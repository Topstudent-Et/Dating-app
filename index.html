<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME - DAWIT EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .gold-text { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        
        /* Layout Grid */
        .main-grid { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 10px; }
        .side-ctrl { display: flex; flex-direction: column; gap: 8px; }
        .action-ctrl { display: flex; flex-direction: column; gap: 10px; }
        
        .game-area { position: relative; height: 210px; background: radial-gradient(circle, #200, #000); border-radius: 20px; border: 1px solid #400; margin: 10px; overflow: hidden; }
        #plane { position: absolute; font-size: 2.5rem; z-index: 10; transition: 0.1s; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #080808; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; }
        .nav-item { color: #444; font-size: 10px; font-weight: 900; text-align: center; }
        .nav-item.active { color: #ff0000; }
        
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 90px; }
        .page.active { display: block; }
        
        .bet-btn { height: 60px; background: #28a745; border-bottom: 4px solid #14532d; border-radius: 15px; font-weight: 900; font-size: 1.2rem; }
        .side-btn { background: #111; border: 1px solid #333; border-radius: 10px; padding: 8px; font-size: 11px; font-weight: 900; color: #888; }
    </style>
</head>
<body>

    <div class="flex justify-between items-center p-4 bg-black/90 sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <span class="font-game text-red-600 italic">WORLD GAME</span>
        </div>
        <div onclick="showPage('walletPage')" class="bg-zinc-900 px-4 py-2 rounded-full border border-zinc-800">
            <span id="balDisplay" class="text-green-500 font-black">0.00</span>
        </div>
    </div>

    <div id="playPage" class="page active">
        <div class="game-area">
            <div id="multDisplay" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-5xl font-black font-game">1.00x</div>
            <div id="plane" style="left:5%; bottom:5%;">✈️</div>
        </div>

        <div class="main-grid">
            <div class="side-ctrl">
                <p class="text-[8px] text-zinc-600 font-black">STAKE</p>
                <button onclick="setAmt(10)" class="side-btn">10</button>
                <button onclick="setAmt(50)" class="side-btn">50</button>
                <button onclick="setAmt(100)" class="side-btn">100</button>
                <button onclick="setAmt(200)" class="side-btn">200</button>
                <p class="text-[8px] text-zinc-600 font-black mt-2">AUTO</p>
                <button class="side-btn">2x</button>
                <button class="side-btn">4x</button>
                <button class="side-btn">8x</button>
                <button class="side-btn">10x</button>
            </div>
            <div class="action-ctrl">
                <div class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 flex flex-col gap-2">
                    <input type="number" id="amtInput1" value="0" class="bg-black text-center border border-zinc-700 rounded p-1 text-sm font-bold">
                    <button id="betBtn1" onclick="makeBet(1)" class="bet-btn">BET</button>
                </div>
                <div class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 flex flex-col gap-2">
                    <input type="number" id="amtInput2" value="0" class="bg-black text-center border border-zinc-700 rounded p-1 text-sm font-bold">
                    <button id="betBtn2" onclick="makeBet(2)" class="bet-btn">BET</button>
                </div>
            </div>
        </div>
    </div>

    <div id="topPage" class="page p-5">
        <h2 class="gold-text text-center text-2xl mb-8 italic">TOP WINNERS</h2>
        <div class="flex justify-center items-end gap-3 mb-10 h-32">
            <div class="w-20 bg-zinc-900 h-20 rounded-t-xl text-center p-2 border-t-2 border-zinc-400">🥈<p class="text-[10px]">Samuel</p></div>
            <div class="w-24 bg-yellow-600/20 h-28 rounded-t-xl text-center p-2 border-t-4 border-yellow-500">👑🥇<p class="text-[10px]">Dawit_F</p></div>
            <div class="w-20 bg-zinc-900 h-16 rounded-t-xl text-center p-2 border-t-2 border-orange-500">🥉<p class="text-[10px]">Hanna</p></div>
        </div>
        <div id="winnerList" class="space-y-2"></div>
    </div>

    <div id="walletPage" class="page p-6">
        <div class="flex gap-2 mb-6">
            <button onclick="setTab('D')" id="dTab" class="flex-1 py-3 bg-red-600 rounded-xl font-black text-xs">DEPOSIT</button>
            <button onclick="setTab('W')" id="wTab" class="flex-1 py-3 bg-zinc-900 rounded-xl font-black text-xs">WITHDRAW</button>
        </div>
        <div id="depArea" class="space-y-4">
            <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                <p id="activeBank" class="text-blue-500 font-bold text-xs">CBE - Dawit Fikadu</p>
                <p id="activeAcc" class="text-xl font-black tracking-widest">1000179571815</p>
            </div>
            <input type="number" id="depAmt" placeholder="Amount" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-800">
            <input type="text" id="depRef" placeholder="Transaction Ref / FT..." class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-800">
            <button onclick="submitReq('DEP')" class="w-full bg-green-600 py-4 rounded-xl font-black">SUBMIT</button>
        </div>
        <div id="witArea" class="hidden space-y-4">
            <input type="number" id="witAmt" placeholder="Withdraw Amount" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-800">
            <input type="text" id="witAcc" placeholder="Bank Account Number" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-800">
            <button onclick="submitReq('WIT')" class="w-full bg-orange-600 py-4 rounded-xl font-black">WITHDRAW</button>
        </div>
    </div>

    <div id="profilePage" class="page p-6 text-center">
        <div class="w-24 h-24 bg-red-600 rounded-full mx-auto mb-4 border-4 border-zinc-900 shadow-xl overflow-hidden">
            <img id="userImg" src="https://via.placeholder.com/150" class="w-full h-full object-cover">
        </div>
        <h2 id="userName" class="font-black text-xl italic uppercase">PLAYER</h2>
        <p class="text-green-500 text-[10px] font-bold mb-8">● VERIFIED ACCOUNT</p>
        <div id="adminLink" onclick="showPage('adminPage')" class="hidden bg-red-900/20 p-4 rounded-2xl border border-red-600 text-red-500 font-black mb-4">ADMIN DASHBOARD</div>
    </div>

    <div id="adminPage" class="page p-6">
        <h2 class="text-red-600 font-game text-center mb-6">ADMIN CONTROL</h2>
        <div class="bg-zinc-900 p-4 rounded-xl space-y-3 mb-6">
            <select id="admBank" class="w-full bg-black p-3 rounded border border-zinc-700">
                <option value="CBE - Dawit Fikadu">CBE - Dawit Fikadu</option>
                <option value="Abyssinia - Dawit Fikadu">Abyssinia - Dawit Fikadu</option>
            </select>
            <input type="text" id="admAcc" placeholder="New Account Number" class="w-full bg-black p-3 rounded border border-zinc-700">
            <button onclick="updateBank()" class="w-full bg-blue-600 py-2 rounded font-black">UPDATE ALL</button>
        </div>
        <p class="text-xs font-bold text-zinc-500 mb-2">USER REQUESTS</p>
        <div id="inboxList" class="space-y-2"></div>
    </div>

    <nav class="nav-bar">
        <div onclick="showPage('playPage')" class="nav-item active"><i class="fas fa-play text-xl"></i><br>PLAY</div>
        <div onclick="showPage('topPage')" class="nav-item"><i class="fas fa-trophy text-xl"></i><br>TOP</div>
        <div onclick="showPage('walletPage')" class="nav-item"><i class="fas fa-wallet text-xl"></i><br>WALLET</div>
        <div onclick="showPage('profilePage')" class="nav-item"><i class="fas fa-user text-xl"></i><br>PROFILE</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        let uid = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "dev";
        let db = JSON.parse(localStorage.getItem('world_db_'+uid)) || {
            bal: 0, bank: "1000179571815", bName: "CBE - Dawit Fikadu", inbox: []
        };

        let mult = 1.0; let isRun = false;
        let bets = { 1: false, 2: false };

        function init() {
            if(tg.initDataUnsafe.user) {
                document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
                if(tg.initDataUnsafe.user.photo_url) document.getElementById('userImg').src = tg.initDataUnsafe.user.photo_url;
                if(tg.initDataUnsafe.user.username === "Dawit_Fikadu21") document.getElementById('adminLink').classList.remove('hidden');
            }
            updateUI();
            loadWinners();
            engine();
        }

        function updateUI() {
            document.getElementById('balDisplay').innerText = db.bal.toFixed(2);
            document.getElementById('activeAcc').innerText = db.bank;
            document.getElementById('activeBank').innerText = db.bName;
            localStorage.setItem('world_db_'+uid, JSON.stringify(db));
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(id === 'adminPage') renderInbox();
        }

        function engine() {
            if(isRun) return;
            isRun = true; mult = 1.0;
            let crash = 1.1 + Math.random() * 3.5;
            let loop = setInterval(() => {
                mult += 0.01 * (mult / 1.5);
                document.getElementById('multDisplay').innerText = mult.toFixed(2) + "x";
                document.getElementById('plane').style.left = Math.min((mult-1)*15 + 5, 80) + "%";
                document.getElementById('plane').style.bottom = Math.min((mult-1)*10 + 5, 70) + "%";
                if(mult >= crash) {
                    clearInterval(loop); isRun = false;
                    document.getElementById('multDisplay').innerText = "FLEW AWAY!";
                    resetBets();
                    setTimeout(engine, 4000);
                }
            }, 80);
        }

        function makeBet(s) {
            let a = parseFloat(document.getElementById('amtInput'+s).value);
            if(!bets[s]) {
                if(db.bal < a || a <= 0) return alert("ዝቅተኛ ባላንስ!");
                db.bal -= a; bets[s] = true;
                document.getElementById('betBtn'+s).innerText = "CASH OUT";
            } else {
                let w = a * mult;
                db.bal += w; bets[s] = false;
                document.getElementById('betBtn'+s).innerText = "BET";
                alert("አሸንፈዋል! +" + w.toFixed(2));
            }
            updateUI();
        }

        function resetBets() {
            [1,2].forEach(s => { bets[s] = false; document.getElementById('betBtn'+s).innerText = "BET"; });
            updateUI();
        }

        function submitReq(t) {
            let a = parseFloat(document.getElementById(t === 'DEP' ? 'depAmt' : 'witAmt').value);
            let r = document.getElementById(t === 'DEP' ? 'depRef' : 'witAcc').value;
            db.inbox.push({ type: t, amt: a, ref: r, time: new Date().toLocaleTimeString() });
            updateUI(); alert("ጥያቄዎ ተልኳል!");
        }

        function updateBank() {
            db.bName = document.getElementById('admBank').value;
            db.bank = document.getElementById('admAcc').value;
            updateUI(); alert("ተቀይሯል!");
        }

        function renderInbox() {
            const list = document.getElementById('inboxList');
            list.innerHTML = db.inbox.length ? '' : '<p class="text-zinc-600 text-center text-xs">ባዶ ነው</p>';
            db.inbox.forEach((m, i) => {
                list.innerHTML += `<div class="bg-zinc-900 p-3 rounded-lg flex justify-between items-center text-xs">
                    <div><b>${m.type}</b>: ${m.amt} ETB<br><span class="text-zinc-500">${m.ref}</span></div>
                    <button onclick="approve(${i})" class="bg-green-600 px-3 py-1 rounded">OK</button>
                </div>`;
            });
        }

        function approve(i) {
            if(db.inbox[i].type === 'DEP') db.bal += db.inbox[i].amt;
            db.inbox.splice(i, 1); updateUI(); renderInbox();
        }

        function setAmt(v) { document.getElementById('amtInput1').value = v; }
        function setTab(m) {
            document.getElementById('depArea').classList.toggle('hidden', m !== 'D');
            document.getElementById('witArea').classList.toggle('hidden', m !== 'W');
        }

        function loadWinners() {
            const list = document.getElementById('winnerList');
            for(let i=4; i<=15; i++) {
                list.innerHTML += `<div class="bg-zinc-900 p-3 rounded-xl flex justify-between items-center text-xs">
                    <span class="text-zinc-500">#${i} User_${100+i}</span>
                    <span class="text-green-500 font-bold">${(Math.random()*20000).toFixed(0)} ETB</span>
                </div>`;
            }
        }
        window.onload = init;
    </script>
</body>
</html>
