<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator - Dai Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Orbitron:wght@700&display=swap');
        body { background-color: #0b0e11; color: white; font-family: 'Roboto', sans-serif; margin: 0; overflow-x: hidden; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Game Screen Background */
        .aviator-screen { 
            background: radial-gradient(circle at bottom left, #1c0a12 0%, #000 100%);
            height: 300px; position: relative; border-radius: 12px; overflow: hidden; border: 1px solid #2d1a24;
        }

        /* The Red Plane from your image */
        .plane-wrapper {
            position: absolute; bottom: 20px; left: 20px; width: 90px; z-index: 50;
            transition: transform 0.1s linear;
        }

        /* Multiplier Glow */
        .multi-display { font-size: 4.5rem; font-weight: 900; z-index: 100; position: relative; text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }

        /* Buttons */
        .btn-bet { background-color: #28a745; border-radius: 8px; font-weight: 800; transition: 0.1s; border: none; }
        .btn-cashout { background-color: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .page { display: none; padding-bottom: 80px; }
        .active-page { display: block; }

        /* Navigation Bar */
        .nav-bar { background: #1c2127; border-top: 1px solid #333; position: fixed; bottom: 0; width: 100%; height: 65px; z-index: 1000; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #848484; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: #d32f2f; }

        /* Player List Style */
        .player-row { background: #14191f; border-bottom: 1px solid #1c2127; padding: 6px 10px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .win-text { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>

    <div class="p-3 flex justify-between items-center bg-[#1c2127] border-b border-gray-800 sticky top-0 z-[500]">
        <div class="flex items-center gap-2">
            <span class="text-red-600 font-black italic text-xl">Aviator</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-black px-4 py-1 rounded-full border border-green-900 cursor-pointer" onclick="showPage('wallet')">
                <span id="main-balance" class="text-green-500 font-bold">50,000.00</span> <span class="text-[10px] text-gray-500">ETB</span>
            </div>
            <i class="fa-solid fa-bars text-gray-400" onclick="showPage('profile')"></i>
        </div>
    </div>

    <section id="game" class="page active-page">
        <div class="flex gap-2 p-2 overflow-x-auto no-scrollbar">
            <span class="bg-gray-800 text-blue-400 px-2 py-0.5 rounded-full text-[10px] font-bold">1.45x</span>
            <span class="bg-gray-800 text-purple-400 px-2 py-0.5 rounded-full text-[10px] font-bold">12.01x</span>
            <span class="bg-gray-800 text-blue-300 px-2 py-0.5 rounded-full text-[10px] font-bold">2.10x</span>
        </div>

        <div class="px-3">
            <div class="aviator-screen flex items-center justify-center">
                <div id="status" class="absolute top-4 text-gray-500 text-[10px] font-bold uppercase tracking-widest">Waiting for next round...</div>
                <div id="multi" class="multi-display font-game">1.00x</div>
                
                <div id="plane" class="plane-wrapper">
                    <img src="https://i.ibb.co/XkyVz7D/plane-red.png" onerror="this.src='https://www.svgrepo.com/show/491500/airplane-top-view.svg'" style="filter: drop-shadow(0 0 10px #ff0000); transform: rotate(10deg); width: 100%;">
                </div>
            </div>

            <div class="grid grid-cols-1 gap-3 mt-4">
                <div class="bg-[#1c2127] p-3 rounded-xl border border-gray-800 flex gap-4">
                    <div class="flex flex-col gap-2 w-1/3">
                        <div class="bg-black flex items-center justify-between px-2 py-1 rounded">
                            <button onclick="adj(1, -1)" class="text-gray-500 font-bold">−</button>
                            <input id="amt1" type="number" value="10" class="bg-transparent text-center w-full font-bold text-sm outline-none">
                            <button onclick="adj(1, 1)" class="text-gray-500 font-bold">+</button>
                        </div>
                        <div class="grid grid-cols-2 gap-1">
                            <button onclick="setV(1, 100)" class="bg-gray-800 text-[10px] py-1 rounded">100</button>
                            <button onclick="setV(1, 500)" class="bg-gray-800 text-[10px] py-1 rounded">500</button>
                        </div>
                    </div>
                    <button id="btn1" onclick="handleBet(1)" class="btn-bet flex-1 text-lg py-4">BET<br><span id="lbl1" class="text-xs font-normal">10.00 ETB</span></button>
                </div>
            </div>

            <div class="mt-4 bg-[#14191f] rounded-xl border border-gray-800 overflow-hidden">
                <div class="p-2 bg-black/50 text-[10px] font-bold flex justify-between uppercase">
                    <span>All Bets</span>
                    <span id="p-count">142 Players</span>
                </div>
                <div id="player-list" class="h-40 overflow-y-auto">
                    </div>
            </div>
        </div>
    </section>

    <section id="wallet" class="page p-5">
        <h2 class="text-2xl font-black mb-6">Financial Hub</h2>
        <div class="space-y-4">
            <div class="bg-gray-900 p-4 rounded-xl border border-blue-900 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold">T</div>
                    <div><p class="font-bold">Telebirr</p><p class="text-xs text-gray-500">Deposit Instantly</p></div>
                </div>
                <button class="bg-blue-600 px-4 py-1 rounded text-xs">Deposit</button>
            </div>
            <div class="bg-gray-900 p-4 rounded-xl border border-yellow-700 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-yellow-600 rounded-full flex items-center justify-center font-bold">C</div>
                    <div><p class="font-bold">CBE Birr</p><p class="text-xs text-gray-500">Bank Transfer</p></div>
                </div>
                <button class="bg-yellow-600 px-4 py-1 rounded text-xs">Deposit</button>
            </div>
            <div class="mt-10 p-5 bg-red-900/20 border border-red-900 rounded-xl">
                <h3 class="font-bold mb-2">Withdraw Earnings</h3>
                <input type="number" placeholder="Enter Amount" class="w-full bg-black p-3 rounded border border-gray-700 mb-3 outline-none">
                <button class="w-full bg-red-600 py-3 rounded-lg font-bold">Request Withdrawal</button>
            </div>
        </div>
    </section>

    <div class="nav-bar">
        <div onclick="showPage('game')" class="nav-item active"><i class="fa-solid fa-plane-up text-xl mb-1"></i><p>Game</p></div>
        <div onclick="showPage('wallet')" class="nav-item"><i class="fa-solid fa-wallet text-xl mb-1"></i><p>Wallet</p></div>
        <div onclick="showPage('game')" class="nav-item"><i class="fa-solid fa-users text-xl mb-1"></i><p>Players</p></div>
    </div>

    <audio id="snd-fly" loop src="https://www.soundjay.com/transportation/sounds/propeller-plane-flying-1.mp3"></audio>

    <script>
        let balance = 50000.00;
        let isFlying = false;
        let multiplier = 1.00;
        let activeBet = { on: false, amt: 0 };
        let gameLoop;

        // Telegram Username Mockups
        const usernames = ["@Dagi_King", "@Sami_99", "@Hana_Eth", "@Abel_Pro", "@Rediet_Z", "@Muller_VIP", "@Sara_Love", "@Elias_Trade"];

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        }

        function adj(n, v) { 
            let el = document.getElementById('amt'+n);
            el.value = Math.max(1, parseInt(el.value) + v);
            document.getElementById('lbl'+n).innerText = el.value + ".00 ETB";
        }

        function setV(n, v) { 
            document.getElementById('amt'+n).value = v; 
            document.getElementById('lbl'+n).innerText = v + ".00 ETB";
        }

        function handleBet(n) {
            let btn = document.getElementById('btn'+n);
            let amt = parseInt(document.getElementById('amt'+n).value);

            if(!isFlying && !activeBet.on) {
                if(amt > balance) return alert("Insufficient Balance");
                balance -= amt;
                activeBet = { on: true, amt: amt };
                btn.innerHTML = "WAITING...<br><span class='text-xs'>CANCEL</span>";
                btn.classList.replace('bg-green-600', 'bg-red-900');
                updateUI();
            } else if (isFlying && activeBet.on) {
                let win = activeBet.amt * multiplier;
                balance += win;
                activeBet.on = false;
                alert(`SUCCESS! Cashed out ${win.toFixed(2)} ETB`);
                resetBtn(n);
                updateUI();
            }
        }

        function resetBtn(n) {
            let btn = document.getElementById('btn'+n);
            btn.className = "btn-bet flex-1 text-lg py-4 bg-green-600";
            btn.innerHTML = `BET<br><span class='text-xs font-normal'>${document.getElementById('amt'+n).value}.00 ETB</span>`;
        }

        function updateUI() { document.getElementById('main-balance').innerText = balance.toLocaleString(); }

        function startRound() {
            if(isFlying) return;
            let status = document.getElementById('status');
            let sec = 5;
            let timer = setInterval(() => {
                status.innerText = `Next Round in ${sec}s...`;
                if(sec-- <= 0) { clearInterval(timer); launch(); }
                addFakeBet();
            }, 1000);
        }

        function launch() {
            isFlying = true; multiplier = 1.00;
            document.getElementById('snd-fly').play();
            document.getElementById('status').innerText = "PLANE IS FLYING";
            
            if(activeBet.on) {
                let btn = document.getElementById('btn1');
                btn.classList.replace('bg-red-900', 'btn-cashout');
                btn.innerHTML = `CASH OUT<br><span>${(activeBet.amt * multiplier).toFixed(2)}</span>`;
            }

            // 40% PROFIT LOGIC: Crash early 40% of the time
            let crashAt = Math.random() < 0.4 ? (1 + Math.random() * 0.2) : (1.2 + Math.random() * 8);

            gameLoop = setInterval(() => {
                multiplier += 0.02;
                document.getElementById('multi').innerText = multiplier.toFixed(2) + "x";
                let p = document.getElementById('plane');
                p.style.transform = `translate(${multiplier * 30}px, -${multiplier * 20}px)`;

                if(activeBet.on) {
                    document.getElementById('btn1').querySelector('span').innerText = (activeBet.amt * multiplier).toFixed(2) + " ETB";
                }

                if(multiplier >= crashAt) crash();
            }, 80);
        }

        function crash() {
            clearInterval(gameLoop);
            isFlying = false;
            document.getElementById('snd-fly').pause();
            document.getElementById('snd-fly').currentTime = 0;
            document.getElementById('multi').innerText = "FLEW AWAY!";
            document.getElementById('multi').style.color = "#ff1e4d";

            if(activeBet.on) { activeBet.on = false; resetBtn(1); }

            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('multi').style.color = "white";
                startRound();
            }, 3000);
        }

        function addFakeBet() {
            let list = document.getElementById('player-list');
            let user = usernames[Math.floor(Math.random()*usernames.length)];
            let bet = (Math.random()*500).toFixed(0);
            let row = document.createElement('div');
            row.className = 'player-row';
            row.innerHTML = `<span>${user}</span> <span>${bet} ETB</span>`;
            list.prepend(row);
            if(list.children.length > 10) list.lastChild.remove();
        }

        startRound();
    </script>
</body>
</html>
