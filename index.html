<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WORLD GAME - HOURLY CRASH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ቀደም ያሉት ቅጦች እዚህ ይቀመጡ (ለአጭርነት አላስገባሁም ነገር ግን ከፊተኛው ኮድ መውሰድ ይችላሉ) */
        body { background: #000; font-family: 'Inter', sans-serif; overflow: hidden; }
        .game-view { position: relative; height: 300px; background: #0a0a0a; border-radius: 25px; margin: 12px; border: 1px solid #1f1f1f; overflow: hidden; }
        #multiplier { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 4rem; font-weight: 900; z-index: 10; font-family: 'Orbitron'; }
        #plane { position: absolute; font-size: 2.5rem; z-index: 20; transition: all 0.05s linear; left: 10%; bottom: 10%; }
        #trail-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
        .btn-bet { background: #28a745; border-radius: 20px; }
        .btn-cash { background: #ffc107; color: #000; }
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 100px; }
        .active-page { display: block; }
        .countdown-box { background: #1f1f1f; padding: 10px; border-radius: 30px; text-align: center; margin: 10px; font-family: monospace; font-size: 1.5rem; }
    </style>
</head>
<body>

<header class="flex justify-between p-4 border-b border-zinc-900">
    <div class="font-game text-red-500">WORLD GAME</div>
    <div onclick="showPage('wallet')" class="bg-zinc-900 px-4 py-2 rounded-full">
        <span id="hBal" class="text-green-500 font-black">0.00</span> <i class="fas fa-wallet"></i>
    </div>
</header>

<div id="playPage" class="page active-page">
    <div class="game-view">
        <canvas id="trail-canvas"></canvas>
        <div id="multiplier">1.00x</div>
        <div id="plane">✈️</div>
        <div id="crashAlert" class="absolute inset-0 bg-black/90 hidden flex-col items-center justify-center">
            <p>CRASHED AT</p>
            <h1 id="crashVal" class="text-red-600 text-4xl">1.00x</h1>
        </div>
    </div>
    <div class="countdown-box" id="countdownDisplay">Next round: --:--</div>
    <div class="space-y-3 px-4">
        <div class="bg-zinc-900 p-4 rounded-2xl">
            <div class="flex gap-3 mb-3">
                <button onclick="adj(1,-10)" class="w-10 h-10 bg-zinc-800 rounded-full">-</button>
                <input type="number" id="a1" value="10" class="flex-1 bg-transparent text-center text-2xl font-black">
                <button onclick="adj(1,10)" class="w-10 h-10 bg-zinc-800 rounded-full">+</button>
            </div>
            <button id="b1" onclick="handleBet(1)" class="w-full py-4 btn-bet font-black">BET</button>
        </div>
        <div class="bg-zinc-900 p-4 rounded-2xl">
            <div class="flex gap-3 mb-3">
                <button onclick="adj(2,-10)" class="w-10 h-10 bg-zinc-800 rounded-full">-</button>
                <input type="number" id="a2" value="20" class="flex-1 bg-transparent text-center text-2xl font-black">
                <button onclick="adj(2,10)" class="w-10 h-10 bg-zinc-800 rounded-full">+</button>
            </div>
            <button id="b2" onclick="handleBet(2)" class="w-full py-4 btn-bet font-black">BET</button>
        </div>
    </div>
</div>

<!-- ሌሎች ገጾች (top, wallet, profile, admin) እንደቀድሞው ማስቀመጥ ይቻላል - ለአጭርነት አላስፋሁም -->

<script>
    const socket = io();
    const tg = window.Telegram.WebApp;
    let user = tg.initDataUnsafe.user || { id: 777, first_name: "Test" };
    let db = { bal: 100, games: 0 };
    let myBets = [null, null]; // ለሁለቱ ቦታዎች
    let gameActive = false;
    let currentMultiplier = 1.00;
    let points = [];
    let ctx, canvas;

    function initCanvas() {
        canvas = document.getElementById('trail-canvas');
        ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }

    function drawTrail() {
        if (!ctx) return;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(points.length<2) return;
        ctx.beginPath();
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 3;
        ctx.moveTo(points[0].x, points[0].y);
        for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.stroke();
    }

    socket.on('balance', (data) => {
        db.bal = data.bal;
        db.games = data.games;
        document.getElementById('hBal').innerText = db.bal.toFixed(2);
        document.getElementById('pBal').innerText = db.bal.toFixed(2);
        document.getElementById('pGames').innerText = db.games;
        localStorage.setItem('wg_'+user.id, JSON.stringify(db));
    });

    socket.on('round_start', ({ crashPoint, startMult }) => {
        gameActive = true;
        currentMultiplier = startMult;
        document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2)+'x';
        document.getElementById('crashAlert').classList.add('hidden');
        points = [];
        drawTrail();
        updateButtons();
    });

    socket.on('tick', ({ mult }) => {
        if(!gameActive) return;
        currentMultiplier = parseFloat(mult);
        document.getElementById('multiplier').innerText = mult + 'x';
        let x = Math.min((currentMultiplier - 1) * 35, 75);
        let y = Math.min((currentMultiplier - 1) * 25, 65);
        let plane = document.getElementById('plane');
        plane.style.left = (10 + x) + '%';
        plane.style.bottom = (10 + y) + '%';
        let px = (10 + x) * canvas.width / 100;
        let py = (10 + y) * canvas.height / 100;
        points.push({x: px, y: py});
        drawTrail();
        updateButtons();
    });

    socket.on('crash', ({ point }) => {
        gameActive = false;
        document.getElementById('crashVal').innerText = point + 'x';
        document.getElementById('crashAlert').classList.remove('hidden');
        myBets = [null, null];
        updateButtons();
        setTimeout(() => {
            document.getElementById('plane').style.left = '10%';
            document.getElementById('plane').style.bottom = '10%';
            ctx.clearRect(0,0,canvas.width,canvas.height);
        }, 2000);
    });

    socket.on('next_round_time', ({ seconds }) => {
        document.getElementById('countdownDisplay').innerHTML = `Next round starts in ${seconds} seconds`;
    });
    socket.on('countdown', (sec) => {
        if(sec>0) document.getElementById('countdownDisplay').innerHTML = `Next round: ${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`;
        else document.getElementById('countdownDisplay').innerHTML = `Game is LIVE!`;
    });

    function handleBet(idx) {
        let amount = parseFloat(document.getElementById('a'+idx).value);
        if(!gameActive && myBets[idx-1] === null) {
            if(db.bal < amount) return alert('Insufficient balance');
            db.bal -= amount;
            myBets[idx-1] = amount;
            socket.emit('placeBet', { amount });
            updateButtons();
        } else if(gameActive && myBets[idx-1] !== null) {
            socket.emit('cashOut');
            myBets[idx-1] = null;
            updateButtons();
        }
    }

    function updateButtons() {
        for(let i=1;i<=2;i++) {
            let btn = document.getElementById('b'+i);
            if(!gameActive && myBets[i-1]) {
                btn.innerText = 'WAITING';
                btn.classList.remove('btn-cash','btn-bet');
                btn.classList.add('bg-zinc-800');
            } else if(gameActive && myBets[i-1]) {
                btn.innerText = 'CASH OUT (20% fee)';
                btn.classList.remove('btn-bet');
                btn.classList.add('btn-cash');
            } else {
                btn.innerText = 'BET';
                btn.classList.remove('btn-cash');
                btn.classList.add('btn-bet');
            }
        }
    }

    function adj(id, delta) {
        let inp = document.getElementById('a'+id);
        let val = parseInt(inp.value) + delta;
        if(val<5) val=5;
        inp.value = val;
    }

    function showPage(p) {
        document.querySelectorAll('.page').forEach(el=>el.classList.remove('active-page'));
        document.getElementById(p+'Page').classList.add('active-page');
    }

    window.onload = () => {
        initCanvas();
        let saved = localStorage.getItem('wg_'+user.id);
        if(saved) db = JSON.parse(saved);
        socket.emit('init', { id: user.id, first_name: user.first_name });
        updateButtons();
    };
</script>
</body>
</html>
