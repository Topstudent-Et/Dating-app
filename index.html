<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER V30 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        :root { --red: #ff0044; --green: #22c55e; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Fixed Top Navigation */
        .nav-top { position: fixed; top: 0; width: 100%; height: 65px; display: flex; justify-content: space-around; align-items: center; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; z-index: 1000; }
        .nav-item { color: #555; font-size: 10px; font-weight: 900; text-align: center; transition: 0.3s; }
        .nav-item.active { color: var(--red); transform: scale(1.1); }

        .page { display: none; height: calc(100vh - 65px); margin-top: 65px; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .active-page { display: block; }

        /* Smooth Screen Animation */
        .screen { background: radial-gradient(circle at bottom left, #250505 0%, #000 100%); height: 220px; position: relative; border-radius: 20px; overflow: hidden; border: 2px solid #1a1a1a; }
        #gamePath { stroke: var(--red); stroke-width: 6; fill: none; filter: drop-shadow(0 0 12px var(--red)); transition: 0.1s linear; }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 45px; z-index: 10; transition: 0.1s linear; }

        /* Bigger Mode Toggle Buttons */
        .mode-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 12px; border-radius: 15px; font-weight: 900; font-size: 14px; text-transform: uppercase; border: 2px solid transparent; transition: 0.3s; }
        .mode-demo.active { background: var(--red); border-color: #ff4d7d; box-shadow: 0 0 15px rgba(255,0,68,0.4); }
        .mode-real.active { background: var(--green); color: black; border-color: #4ade80; box-shadow: 0 0 15px rgba(34,197,94,0.4); }
        .mode-btn:not(.active) { background: #1a1a1a; color: #444; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="no-scrollbar">

    <nav class="nav-top">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-plane-up text-xl"></i><br>GAME</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-xl"></i><br>WALLET</div>
        <div onclick="showP('leaderboard')" id="n-leaderboard" class="nav-item"><i class="fa-solid fa-trophy text-xl"></i><br>TOP</div>
        <div onclick="showP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user-gear text-xl"></i><br>ME</div>
    </nav>

    <section id="home" class="page active-page no-scrollbar">
        <div class="mode-container">
            <button id="btnDemo" onclick="setMode('demo')" class="mode-btn mode-demo active">DEMO</button>
            <button id="btnReal" onclick="setMode('real')" class="mode-btn mode-real">REAL</button>
        </div>

        <div id="hist" class="flex gap-2 mb-3 overflow-x-auto no-scrollbar py-1"></div>

        <div class="screen flex items-center justify-center mb-5">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 220 Q 0 220 0 220" /></svg>
            <div id="mTxt" class="font-game text-7xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane">✈️</div>
            <div id="gStatus" class="absolute top-4 glass px-5 py-1 rounded-full text-[10px] font-black text-gray-400 italic uppercase">Waiting...</div>
        </div>

        <div class="glass p-6 rounded-[30px] mb-5 border-t-2 border-white/5">
            <div class="flex justify-between items-center mb-6">
                <input id="bInp" type="number" value="10" class="bg-transparent text-4xl font-black outline-none w-32 text-white">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setB(50)" class="bg-white/10 px-4 py-2 rounded-xl font-bold active:scale-90">50</button>
                    <button onclick="setB(100)" class="bg-white/10 px-4 py-2 rounded-xl font-bold active:scale-90">100</button>
                </div>
            </div>
            <button id="bBtn" onclick="handleBet()" class="w-full bg-red-600 py-6 rounded-2xl text-3xl font-black italic shadow-2xl active:scale-95 transition-all">BET</button>
        </div>

        <div class="glass rounded-2xl p-4 h-64 overflow-hidden flex flex-col">
            <h3 class="text-[10px] font-black text-gray-500 mb-2 uppercase italic">Live Players</h3>
            <div id="liveList" class="space-y-2 overflow-y-auto no-scrollbar flex-1"></div>
        </div>
    </section>

    <section id="deposit" class="page no-scrollbar">
        <div class="glass p-6 rounded-[35px] mb-6">
            <p class="text-yellow-500 font-black text-xs mb-4 uppercase">Direct Bank Deposit</p>
            <div onclick="copyT('1000179571815')" class="flex justify-between items-center bg-black p-5 rounded-2xl mb-4 border border-white/5">
                <span class="font-black text-lg">CBE: 1000179571815</span><i class="fa-solid fa-copy text-yellow-600"></i>
            </div>
            <div onclick="copyT('0906067696')" class="flex justify-between items-center bg-black p-5 rounded-2xl border border-white/5">
                <span class="font-black text-lg">Telebirr: 0906067696</span><i class="fa-solid fa-copy text-blue-600"></i>
            </div>
        </div>

        <div class="glass p-8 rounded-[45px] text-center border-2 border-dashed border-gray-800">
            <p class="text-xs font-black text-gray-400 mb-6 uppercase">Upload Screenshot / ደረሰኝ</p>
            <input type="file" id="ssInp" class="hidden" accept="image/*" onchange="handlePreview(this)">
            <button onclick="document.getElementById('ssInp').click()" class="w-full bg-white/5 py-5 rounded-2xl font-black mb-5 border border-white/10 uppercase italic">Select File</button>
            <div id="prevBox" class="hidden mb-6"><img id="ssPrev" class="rounded-2xl max-h-60 mx-auto shadow-2xl border border-white/20"></div>
            <button id="finalSend" onclick="submitReceipt()" class="w-full bg-red-600 py-5 rounded-3xl font-black text-sm uppercase shadow-2xl">SUBMIT TO ADMIN</button>
        </div>
    </section>

    <audio id="sndFly" loop src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="sndExplode" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        let isDemo = true;
        let realBal = parseFloat(localStorage.getItem('v30_real')) || 0;
        let demoBal = 500;
        let isFlying = false; let mult = 1.0; let myBet = { active: false, amt: 0 };
        let history = ["1.50x", "3.20x", "1.02x"];
        let user = { uname: tg.initDataUnsafe?.user?.username || "Aviator_User" };

        function init() {
            updateDisplay(); renderLeaders(); renderHist(); loop();
        }

        // --- GAME LOGIC ---
        function loop() {
            if(isFlying) return;
            let timer = 6;
            let t = setInterval(() => {
                document.getElementById('gStatus').innerText = `Flight starts in ${timer}s`;
                if(timer-- <= 0) { clearInterval(t); launch(); }
                if(timer === 4) generateFakeBets();
            }, 1000);
        }

        function launch() {
            isFlying = true; mult = 1.0;
            document.getElementById('sndFly').play();
            
            // 40% PROFIT LOGIC: High bets make it crash early
            let crash = 1.01 + (Math.random() * 8.0);
            if(myBet.active && myBet.amt >= 200) crash = 1.01 + (Math.random() * 0.5);

            let eng = setInterval(() => {
                mult += 0.07;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 18, y = mult * 14;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 220 Q ${x/2} ${220-y} ${x+10} ${220-y-10}`);

                if(mult >= crash) { clearInterval(eng); explode(); }
            }, 90);
        }

        function explode() {
            isFlying = false;
            document.getElementById('sndFly').pause(); document.getElementById('sndFly').currentTime = 0;
            document.getElementById('sndExplode').play();
            document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "#ff0044";
            history.unshift(mult.toFixed(2) + "x"); if(history.length > 8) history.pop();
            renderHist(); myBet.active = false; resetBetUI();
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 220 Q 0 220 0 220');
                document.getElementById('mTxt').style.color = "white";
                loop();
            }, 3000);
        }

        // --- WALLET & SUBMIT (FIXED) ---
        function handlePreview(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => { document.getElementById('ssPrev').src = e.target.result; document.getElementById('prevBox').classList.remove('hidden'); };
                r.readAsDataURL(input.files[0]);
            }
        }

        function submitReceipt() {
            const f = document.getElementById('ssInp').files[0];
            if(!f) return tg.showAlert("እባክህ ፎቶ ምረጥ!");
            tg.showConfirm("ደረሰኙን ለአድሚን መላክ ትፈልጋለህ?", (ok) => {
                if(ok) {
                    let db = JSON.parse(localStorage.getItem('v30_db')) || [];
                    const reader = new FileReader();
                    reader.onload = () => {
                        db.push({ user: user.uname, img: reader.result, time: new Date().toLocaleString() });
                        localStorage.setItem('v30_db', JSON.stringify(db));
                        tg.showAlert("✅ ደረሰኙ ተልኳል! በ 5 ደቂቃ ውስጥ ባላንስህ ይሞላል።");
                        document.getElementById('prevBox').classList.add('hidden');
                    };
                    reader.readAsDataURL(f);
                }
            });
        }

        // --- MODE & UI HELPERS ---
        function setMode(m) {
            isDemo = (m === 'demo');
            document.getElementById('btnDemo').classList.toggle('active', isDemo);
            document.getElementById('btnReal').classList.toggle('active', !isDemo);
            updateDisplay();
        }

        function handleBet() {
            if(isFlying) return myBet.active ? cashOut() : tg.showAlert("ዙሩ እስኪጀምር ጠብቅ!");
            let a = parseInt(document.getElementById('bInp').value);
            let cur = isDemo ? demoBal : realBal;
            if(a > cur) return tg.showAlert("በቂ ባላንስ የለህም!");
            
            if(isDemo) demoBal -= a; else { realBal -= a; localStorage.setItem('v30_real', realBal); }
            myBet = { active: true, amt: a };
            updateDisplay();
            document.getElementById('bBtn').innerText = "CASH OUT";
            document.getElementById('bBtn').className = "w-full bg-orange-600 py-6 rounded-2xl text-3xl font-black italic shadow-xl";
        }

        function cashOut() {
            if(!myBet.active || !isFlying) return;
            let win = myBet.amt * mult;
            if(isDemo) demoBal += win; else { realBal += win; localStorage.setItem('v30_real', realBal); }
            myBet.active = false; resetBetUI(); updateDisplay();
            tg.showAlert(`✅ አሸንፈሃል: ${win.toFixed(2)} ETB`);
        }

        function setB(n) { document.getElementById('bInp').value = n; }
        function resetBetUI() {
            document.getElementById('bBtn').innerText = "BET";
            document.getElementById('bBtn').className = "w-full bg-red-600 py-6 rounded-2xl text-3xl font-black italic shadow-xl";
        }
        function updateDisplay() {
            document.getElementById('hBal').innerText = (isDemo ? demoBal : realBal).toFixed(2);
        }
        function renderHist() {
            document.getElementById('hist').innerHTML = history.map(h => `<span class="bg-white/5 border border-white/10 px-4 py-1 rounded-lg text-[10px] font-black">${h}</span>`).join('');
        }
        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-' + id).classList.add('active');
        }

        init();
    </script>
</body>
</html>
