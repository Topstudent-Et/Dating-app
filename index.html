<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate Betting Pro - ኢትዮጵያ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Amharic', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #0f1422 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navigation */
        .nav-bar {
            background: linear-gradient(135deg, #0a0e1a 0%, #0b0f1a 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ffcc, #00cc99);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 8px 16px;
            border-radius: 25px;
            color: #00ffcc;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(0, 255, 204, 0.3);
            transform: translateY(-2px);
        }

        /* Pages */
        .page {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Cards */
        .card {
            background: rgba(17, 25, 40, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 255, 204, 0.5);
        }

        /* Balance Display */
        .balance-card {
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.2), rgba(0, 204, 153, 0.1));
            border: 1px solid #00ffcc;
            border-radius: 15px;
            padding: 15px 25px;
            text-align: center;
        }

        .balance-card span {
            font-size: 36px;
            font-weight: bold;
            color: #00ffcc;
        }

        /* Forms */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #00ffcc;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ffcc;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffcc, #00cc99);
            color: #0a0e1a;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #00cc88, #00aa66);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffa502, #ff6348);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, #00a8ff, #0097e6);
            color: white;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Aviator */
        .aviator-display {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            margin: 15px 0;
        }

        #multiplier {
            font-size: 48px;
            font-weight: bold;
            color: #00ffcc;
        }

        .plane {
            font-size: 40px;
            display: inline-block;
        }

        @keyframes fly {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(400px); }
        }

        /* Profile */
        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #00ffcc, #00cc99);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 15px;
        }

        /* Transaction History */
        .transaction-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Admin Panel */
        .admin-panel {
            background: rgba(255, 100, 0, 0.1);
            border: 1px solid rgba(255, 100, 0, 0.3);
        }

        /* Sound Control */
        .sound-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            font-size: 24px;
        }

        @media (max-width: 768px) {
            .nav-bar {
                flex-direction: column;
                gap: 10px;
            }
            .games-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="nav-bar">
        <div class="logo">🔥 ኡልቲሜት ቤቲንግ ፕሮ 🎰</div>
        <div class="nav-links">
            <button class="nav-btn active" data-page="home">🏠 መነሻ</button>
            <button class="nav-btn" data-page="profile">👤 መገለጫ</button>
            <button class="nav-btn" data-page="deposit">💰 ገንዘብ አስገባ</button>
            <button class="nav-btn" data-page="history">📜 ታሪክ</button>
            <button class="nav-btn" data-page="admin">⚙️ አድሚን</button>
        </div>
        <div class="balance-card" style="padding: 8px 15px;">
            💰 <span id="balance">0.00</span> ብር
        </div>
    </div>

    <!-- Home Page -->
    <div id="homePage" class="page active">
        <div class="container">
            <div class="games-grid">
                <!-- Aviator -->
                <div class="card">
                    <h3>✈️ አቪዬተር ጨዋታ</h3>
                    <div class="form-group">
                        <input type="number" id="betAmount" placeholder="ውርርድ መጠን" step="0.01" value="10">
                    </div>
                    <div class="aviator-display">
                        <div class="plane" id="plane">✈️</div>
                        <div id="multiplier">1.00x</div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-primary" id="startBtn" style="flex:1">🚀 ጀምር</button>

                    <div id="aviatorResult" class="result" style="margin-top: 10px; text-align: center;"></div>
                </div>

                <!-- Dice -->
                <div class="card">
                    <h3>🎲 ዳይስ ጨዋታ</h3>
                    <div class="form-group">
                        <input type="number" id="diceBet" placeholder="ውርርድ መጠን" step="0.01" value="10">
                    </div>
                    <button class="btn btn-primary" id="diceBtn" style="width:100%">🎲 ውረውር</button>
                    <div id="diceResult" style="margin-top: 10px; text-align: center;"></div>
                </div>

                <!-- Slot -->
                <div class="card">
                    <h3>🎰 ስሎት ማሽን</h3>
                    <div class="form-group">
                        <input type="number" id="slotBet" placeholder="ውርርድ መጠን" step="0.01" value="10">
                    </div>
                    <button class="btn btn-primary" id="slotBtn" style="width:100%">🎰 አሽከርክር</button>
                    <div id="slotResult" style="margin-top: 10px; text-align: center;"></div>
                </div>

                <!-- Coin Flip -->
                <div class="card">
                    <h3>🪙 ሳንቲም ውርወራ</h3>
                    <div class="form-group">
                        <input type="number" id="coinBet" placeholder="ውርርድ መጠን" step="0.01" value="10">
                    </div>
                    <button class="btn btn-primary" id="coinBtn" style="width:100%">🪙 ውረውር</button>
                    <div id="coinResult" style="margin-top: 10px; text-align: center;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Page -->
    <div id="profilePage" class="page">
        <div class="container">
            <div class="card">
                <div class="profile-header">
                    <div class="avatar">👤</div>
                    <h2 id="profileName">እንግዳ</h2>
                    <p id="profilePhone">+251 ----------</p>
                    <p>📅 የተመዘገቡበት: <span id="regDate">-</span></p>
                </div>
                <div style="margin-top: 20px;">
                    <h3>📊 አኃዛዊ መረጃ</h3>
                    <div class="form-group">
                        <label>ጠቅላላ አሸናፊነት:</label>
                        <p id="totalWins" style="color: #00ffcc; font-size: 24px;">0 ብር</p>
                    </div>
                    <div class="form-group">
                        <label>ጠቅላላ ክስረት:</label>
                        <p id="totalLosses" style="color: #ff4757; font-size: 24px;">0 ብር</p>
                    </div>
                    <div class="form-group">
                        <label>ጨዋታዎች ተጫውተዋል:</label>
                        <p id="totalGames">0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Deposit Page -->
    <div id="depositPage" class="page">
        <div class="container">
            <div class="card">
                <h3>💰 ገንዘብ አስገባ</h3>
                <p style="color: #ffa502; margin-bottom: 15px;">📱 በቴሌብር ወይም በሲቢኢ አስገቡ</p>
                
                <div class="form-group">
                    <label>ቴሌብር: 0906067696 ዳዊት</label>
                    <input type="text" value="0906067696" readonly style="background: #1a1f2e;">
                </div>
                <div class="form-group">
                    <label>ሲቢኢ: 1000179571815 ዳዊት</label>
                    <input type="text" value="1000179571815" readonly style="background: #1a1f2e;">
                </div>
                
                <div class="form-group">
                    <label>የከፈሉት መጠን (ብር)</label>
                    <input type="number" id="depositAmount" placeholder="መጠን ያስገቡ">
                </div>
                
                <div class="form-group">
                    <label>የክፍያ ማረጋገጫ (ስክሪንሹት)</label>
                    <input type="file" id="screenshotInput" accept="image/*">
                </div>
                
                <button class="btn btn-success" id="submitDepositBtn">📤 ለአድሚን ላክ</button>
                <div id="depositStatus" style="margin-top: 10px; text-align: center;"></div>
            </div>
            
            <div class="card">
                <h3>💸 ገንዘብ አውጣ</h3>
                <div class="form-group">
                    <label>የሚፈልጉት መጠን (ብር)</label>
                    <input type="number" id="withdrawAmount" placeholder="መጠን ያስገቡ">
                </div>
                <div class="form-group">
                    <label>የሚቀበሉበት አካውንት</label>
                    <select id="withdrawMethod">
                        <option value="telebirr">ቴሌብር</option>
                        <option value="cbe">ሲቢኢ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>የአካውንት ቁጥር</label>
                    <input type="text" id="withdrawAccount" placeholder="ቴሌብር ወይም ሲቢኢ ቁጥር">
                </div>
                <button class="btn btn-warning" id="requestWithdrawBtn">📤 ጥያቄ አስገባ</button>
                <div id="withdrawStatus" style="margin-top: 10px; text-align: center;"></div>
            </div>
        </div>
    </div>

    <!-- History Page -->
    <div id="historyPage" class="page">
        <div class="container">
            <div class="card">
                <h3>📜 የገቢ/ወጪ ታሪክ</h3>
                <div id="transactionHistory" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- Admin Page -->
    <div id="adminPage" class="page">
        <div class="container">
            <div class="card admin-panel">
                <h3>⚙️ አድሚን ፓነል</h3>
                <div class="form-group">
                    <label>የክራሽ ነጥብ ያዘጋጁ (1-10)</label>
                    <input type="number" id="crashControl" step="0.1" min="1" max="10">
                    <button class="btn btn-info" id="setCrashBtn" style="margin-top: 5px;">🎯 አዘጋጅ</button>
                </div>
                <div class="form-group">
                    <label>የገንዘብ ጥያቄዎች</label>
                    <div id="adminRequests" style="max-height: 300px; overflow-y: auto;"></div>
                </div>
                <div class="form-group">
                    <label>ሁሉንም ተጠቃሚዎች አሳይ</label>
                    <button class="btn btn-primary" id="viewUsersBtn">👥 ተጠቃሚዎች</button>
                    <div id="usersList" style="margin-top: 10px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sound Toggle -->
    <div class="sound-toggle" id="soundToggle">🔊</div>

    <script>
        // Audio Context
        let soundEnabled = true;
        const soundToggle = document.getElementById('soundToggle');
        
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const audio = new Audio();
                if (type === 'win') {
                    audio.src = 'data:audio/wav;base64,U3RlYW0gU291bmQ=';
                } else if (type === 'lose') {
                    audio.src = 'data:audio/wav;base64,U3RlYW0gU291bmQ=';
                } else if (type === 'cashout') {
                    audio.src = 'data:audio/wav;base64,U3RlYW0gU291bmQ=';
                }
                audio.volume = 0.3;
                audio.play().catch(() => {});
            } catch(e) {}
        }

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
        });

        // User Data
        let currentUser = null;
        let users = JSON.parse(localStorage.getItem('betting_users') || '[]');
        let transactions = JSON.parse(localStorage.getItem('betting_transactions') || '[]');
        let depositRequests = JSON.parse(localStorage.getItem('deposit_requests') || '[]');
        let withdrawRequests = JSON.parse(localStorage.getItem('withdraw_requests') || '[]');
        
        // Check if logged in
        function checkLogin() {
            const savedUser = localStorage.getItem('current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                updateUIForUser();
            } else {
                showRegistrationModal();
            }
        }
        
        function showRegistrationModal() {
            const name = prompt('👤 ስምዎን ያስገቡ:');
            if (!name) return;
            const phone = prompt('📱 ስልክ ቁጥርዎን ያስገቡ (09xxxxxxxx):');
            if (!phone || phone.length < 10) {
                alert('ትክክለኛ ስልክ ቁጥር ያስገቡ');
                return;
            }
            
            currentUser = {
                id: Date.now(),
                name: name,
                phone: phone,
                balance: 100,
                totalWins: 0,
                totalLosses: 0,
                totalGames: 0,
                regDate: new Date().toLocaleDateString('et-ET')
            };
            
            users.push(currentUser);
            localStorage.setItem('betting_users', JSON.stringify(users));
            localStorage.setItem('current_user', JSON.stringify(currentUser));
            updateUIForUser();
        }
        
        function updateUIForUser() {
            if (!currentUser) return;
            document.getElementById('balance').innerText = currentUser.balance.toFixed(2);
            document.getElementById('profileName').innerText = currentUser.name;
            document.getElementById('profilePhone').innerText = currentUser.phone;
            document.getElementById('regDate').innerText = currentUser.regDate;
            document.getElementById('totalWins').innerText = currentUser.totalWins.toFixed(2) + ' ብር';
            document.getElementById('totalLosses').innerText = currentUser.totalLosses.toFixed(2) + ' ብር';
            document.getElementById('totalGames').innerText = currentUser.totalGames;
            
            // Update transaction history
            const userTransactions = transactions.filter(t => t.userId === currentUser.id);
            const historyDiv = document.getElementById('transactionHistory');
            if (userTransactions.length === 0) {
                historyDiv.innerHTML = '<p style="text-align:center;">ምንም ግብይት የለም</p>';
            } else {
                historyDiv.innerHTML = userTransactions.reverse().map(t => `
                    <div class="transaction-item">
                        <span>${t.date}</span>
                        <span style="color: ${t.type === 'deposit' ? '#00ffcc' : (t.type === 'win' ? '#00ffcc' : '#ff4757')}">
                            ${t.type === 'deposit' ? '+' : (t.type === 'win' ? '+' : '-')} ${t.amount.toFixed(2)} ብር
                        </span>
                        <span>${t.description}</span>
                    </div>
                `).join('');
            }
        }
        
        function updateBalance(newBalance, userId, type, amount, desc) {
            if (!currentUser || (userId && userId !== currentUser.id)) return;
            currentUser.balance = newBalance;
            localStorage.setItem('current_user', JSON.stringify(currentUser));
            
            // Update in users array
            const userIndex = users.findIndex(u => u.id === currentUser.id);
            if (userIndex !== -1) users[userIndex] = currentUser;
            localStorage.setItem('betting_users', JSON.stringify(users));
            
            document.getElementById('balance').innerText = currentUser.balance.toFixed(2);
            
            // Add transaction
            transactions.unshift({
                userId: currentUser.id,
                type: type,
                amount: amount,
                description: desc,
                date: new Date().toLocaleString('et-ET')
            });
            localStorage.setItem('betting_transactions', JSON.stringify(transactions));
            updateUIForUser();
        }
        
        // Game Logic
        let playing = false;
        let multiplier = 1;
        let currentBet = 0;
        let interval = null;
        let customCrash = null;
        
        function startGame() {
            if (playing) { alert('ጨዋታ በሂደት ላይ ነው'); return; }
            const bet = parseFloat(document.getElementById('betAmount').value);
            if (!bet || bet <= 0) { alert('ውርርድ ያስገቡ'); return; }
            if (bet > currentUser.balance) { alert('በቂ ገንዘብ የለዎትም'); return; }
            
            updateBalance(currentUser.balance - bet, currentUser.id, 'bet', bet, 'ውርርድ');
            currentBet = bet;
            multiplier = 1;
            playing = true;
            
            const crashPoint = customCrash || (Math.random() * 5 + 1.1);
            document.getElementById('multiplier').innerText = '1.00x';
            document.getElementById('plane').style.animation = 'fly 3s linear infinite';
            
            interval = setInterval(() => {
                if (!playing) return;
                multiplier += 0.05;
                document.getElementById('multiplier').innerText = multiplier.toFixed(2) + 'x';
                if (multiplier >= crashPoint) {
                    clearInterval(interval);
                    playing = false;
                    document.getElementById('plane').style.animation = 'none';
                    document.getElementById('aviatorResult').innerHTML = `💥 ተሰበረ በ ${crashPoint.toFixed(2)}x! ከሰሩ $${currentBet.toFixed(2)}`;
                    playSound('lose');
                    updateBalance(currentUser.balance, currentUser.id, 'loss', currentBet, 'አቪዬተር ጨዋታ ክስረት');
                    currentUser.totalLosses += currentBet;
                    currentUser.totalGames++;
                    localStorage.setItem('current_user', JSON.stringify(currentUser));
                    updateUIForUser();
                }
            }, 100);
        }
        
        function cashOut() {
            if (!playing) { alert('ምንም ንቁ ጨዋታ የለም'); return; }
            clearInterval(interval);
            playing = false;
            const win = currentBet * multiplier;
            updateBalance(currentUser.balance + win, currentUser.id, 'win', win, `አቪዬተር አሸንፈዋል ${multiplier.toFixed(2)}x`);
            document.getElementById('plane').style.animation = 'none';
            document.getElementById('aviatorResult').innerHTML = `✅ ወጥተዋል! አሸንፈዋል $${win.toFixed(2)} በ ${multiplier.toFixed(2)}x`;
            playSound('win');
            currentUser.totalWins += win;
            currentUser.totalGames++;
            localStorage.setItem('current_user', JSON.stringify(currentUser));
            updateUIForUser();
        }
        
        function playDice() {
            const bet = parseFloat(document.getElementById('diceBet').value);
            if (!bet || bet > currentUser.balance) { alert('ውርርድ ያስገቡ'); return; }
            const roll = Math.floor(Math.random() * 6) + 1;
            if (roll >= 4) {
                updateBalance(currentUser.balance + bet, currentUser.id, 'win', bet, `ዳይስ አሸናፊ ቁጥር ${roll}`);
                document.getElementById('diceResult').innerHTML = `🎉 አሸንፈዋል! ቁጥር ${roll} +${bet.toFixed(2)} ብር`;
                playSound('win');
                currentUser.totalWins += bet;
            } else {
                updateBalance(currentUser.balance - bet, currentUser.id, 'loss', bet, `ዳይስ ክስረት ቁጥር ${roll}`);
                document.getElementById('diceResult').innerHTML = `💀 ከሰሩ! ቁጥር ${roll} -${bet.toFixed(2)} ብር`;
                playSound('lose');
                currentUser.totalLosses += bet;
            }
            currentUser.totalGames++;
            localStorage.setItem('current_user', JSON.stringify(currentUser));
            updateUIForUser();
        }
        
        function playSlot() {
            const bet = parseFloat(document.getElementById('slotBet').value);
            if (!bet || bet > currentUser.balance) { alert('ውርርድ ያስገቡ'); return; }
            const symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
            const a = symbols[Math.floor(Math.random() * 5)];
            const b = symbols[Math.floor(Math.random() * 5)];
            const c = symbols[Math.floor(Math.random() * 5)];
            if (a === b && b === c) {
                const win = bet * 10;
                updateBalance(currentUser.balance + win, currentUser.id, 'win', win, `ስሎት ጃክፖት ${a}${b}${c}`);
                document.getElementById('slotResult').innerHTML = `🎉 ጃክፖት! ${a}${b}${c} +${win.toFixed(2)} ብር`;
                playSound('win');
                currentUser.totalWins += win;
            } else if (a === b || b === c || a === c) {
                const win = bet * 2;
                updateBalance(currentUser.balance + win, currentUser.id, 'win', win, `ስሎት ጥንድ ${a}${b}${c}`);
                document.getElementById('slotResult').innerHTML = `✨ ጥንድ! ${a}${b}${c} +${win.toFixed(2)} ብር`;
                playSound('win');
                currentUser.totalWins += win;
            } else {
                updateBalance(currentUser.balance - bet, currentUser.id, 'loss', bet, `ስሎት ክስረት ${a}${b}${c}`);
                document.getElementById('slotResult').innerHTML = `❌ ${a}${b}${c} -${bet.toFixed(2)} ብር`;
                playSound('lose');
                currentUser.totalLosses += bet;
            }
            currentUser.totalGames++;
            localStorage.setItem('current_user', JSON.stringify(currentUser));
            updateUIForUser();
        }
        
        function flipCoin() {
            const bet = parseFloat(document.getElementById('coinBet').value);
            if (!bet || bet > currentUser.balance) { alert('ውርርድ ያስገቡ'); return; }
            const isWin = Math.random() > 0.5;
            if (isWin) {
                updateBalance(currentUser.balance + bet, currentUser.id, 'win', bet, 'ሳንቲም አሸናፊ');
                document.getElementById('coinResult').innerHTML = `🪙 አሸንፈዋል! +${bet.toFixed(2)} ብር`;
                playSound('win');
                currentUser.totalWins += bet;
            } else {
                updateBalance(currentUser.balance - bet, currentUser.id, 'loss', bet, 'ሳንቲም ክስረት');
                document.getElementById('coinResult').innerHTML = `💀 ከሰሩ! -${bet.toFixed(2)} ብር`;
                playSound('lose');
                currentUser.totalLosses += bet;
            }
            currentUser.totalGames++;
            localStorage.setItem('current_user', JSON.stringify(currentUser));
            updateUIForUser();
        }
        
        // Deposit Request
        document.getElementById('submitDepositBtn')?.addEventListener('click', () => {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            const file = document.getElementById('screenshotInput').files[0];
            if (!amount || amount <= 0) { alert('መጠን ያስገቡ'); return; }
            if (!file) { alert('የስክሪንሹት ፎቶ ያስገቡ'); return; }
            
            depositRequests.push({
                userId: currentUser.id,
                userName: currentUser.name,
                amount: amount,
                screenshot: file.name,
                date: new Date().toLocaleString(),
                status: 'pending'
            });
            localStorage.setItem('deposit_requests', JSON.stringify(depositRequests));
            document.getElementById('depositStatus').innerHTML = '✅ ጥያቄዎ ተልኳል! አድሚን ያረጋግጣል';
            document.getElementById('depositAmount').value = '';
        });
        
        // Withdraw Request
        document.getElementById('requestWithdrawBtn')?.addEventListener('click', () => {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const method = document.getElementById('withdrawMethod').value;
            const account = document.getElementById('withdrawAccount').value;
            if (!amount || amount <= 0) { alert('መጠን ያስገቡ'); return; }
            if (amount > currentUser.balance) { alert('በቂ ገንዘብ የለዎትም'); return; }
            if (!account) { alert('የአካውንት ቁጥር ያስገቡ'); return; }
            
            withdrawRequests.push({
                userId: currentUser.id,
                userName: currentUser.name,
                amount: amount,
                method: method,
                account: account,
                date: new Date().toLocaleString(),
                status: 'pending'
            });
            localStorage.setItem('withdraw_requests', JSON.stringify(withdrawRequests));
            document.getElementById('withdrawStatus').innerHTML = '✅ ጥያቄዎ ተልኳል! አድሚን ያረጋግጣል';
            document.getElementById('withdrawAmount').value = '';
            document.getElementById('withdrawAccount').value = '';
        });
        
        // Admin functions
        function setCrash() {
            const crash = parseFloat(document.getElementById('crashControl').value);
            if (crash >= 1 && crash <= 10) {
                customCrash = crash;
                alert(`ክራሽ ነጥብ ተዘጋጅቷል: ${crash}x`);
            }
        }
        
        document.getElementById('setCrashBtn')?.addEventListener('click', setCrash);
        document.getElementById('viewUsersBtn')?.addEventListener('click', () => {
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = users.map(u => `
                <div class="transaction-item">👤 ${u.name} | 📱 ${u.phone} | 💰 ${u.balance.toFixed(2)} ብር</div>
            `).join('');
        });
        
        // Page Navigation
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const pageId = btn.dataset.page;
                document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
                document.getElementById(pageId + 'Page').classList.add('active');
            });
        });
        
        // Event Listeners
        document.getElementById('startBtn')?.addEventListener('click', startGame);
        document.getElementById('cashOutBtn')?.addEventListener('click', cashOut);
        document.getElementById('diceBtn')?.addEventListener('click', playDice);
        document.getElementById('slotBtn')?.addEventListener('click', playSlot);
        document.getElementById('coinBtn')?.addEventListener('click', flipCoin);
        
        // Initialize
        checkLogin();
        
        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && playing) {
                e.preventDefault();
                cashOut();
            }
        });
    </script>
</body>
</html>
