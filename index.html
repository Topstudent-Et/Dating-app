<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro Audio - Dai Tech</title>
    <style>
        :root {
            --primary: #d21f3c;
            --secondary: #28a745;
            --bg-dark: #050505;
            --panel-bg: #1c1d22;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 15px;
            padding: 15px;
        }

        .players-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            overflow-y: hidden;
        }

        .game-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-bar {
            background: var(--panel-bg);
            padding: 12px 25px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #balance-display { color: var(--secondary); font-weight: bold; font-size: 1.2rem; }

        .canvas-container {
            position: relative;
            background: radial-gradient(circle, #2a0a0e 0%, #000000 100%);
            border-radius: 15px;
            height: 400px;
            overflow: hidden;
            border: 2px solid #333;
        }

        #multiplier {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: 900;
            z-index: 10;
            transition: transform 0.1s;
        }

        .bet-controls {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        input {
            background: #14151a;
            border: 1px solid #444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            text-align: center;
            width: 100%;
        }

        .btn-main {
            height: 70px;
            border: none;
            border-radius: 12px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .bet-active { background: var(--secondary); color: white; }
        .cashout-active { background: #ffc107; color: black; box-shadow: 0 0 20px rgba(255, 193, 7, 0.4); }

        .player-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 12px; }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
            .players-panel { display: none; }
        }
    </style>
</head>
<body>

<audio id="engineSound" loop src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
<audio id="crashSound" src="https://assets.mixkit.co/active_storage/sfx/123/123-preview.mp3"></audio>

<div class="main-container">
    <div class="players-panel">
        <h3 style="font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 10px;">ተጫዋቾች (LIVE)</h3>
        <div id="player-list"></div>
    </div>

    <div class="game-panel">
        <div class="top-bar">
            <span style="color: var(--primary); font-weight: bold; font-size: 1.5rem;">AVIATOR</span>
            <div id="balance-display">💰 1,000.00 ETB</div>
        </div>

        <div class="canvas-container">
            <div id="multiplier">1.00x</div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="bet-controls">
            <div>
                <input type="number" id="betAmount" value="10.00">
                <button id="mainBtn" class="btn-main bet-active" style="width: 100%; margin-top: 10px;" onclick="handleButtonClick()">BET</button>
            </div>
            <div>
                <input type="number" id="autoCashOut" placeholder="Auto Cash Out (e.g 2.00)">
                <div style="font-size: 11px; color: #777; margin-top: 10px; text-align: center;">ድምፅ ለመስማት BET የሚለውን ይጫኑ</div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const multText = document.getElementById('multiplier');
    const balText = document.getElementById('balance-display');
    const mainBtn = document.getElementById('mainBtn');
    
    // የድምፅ ኤለመንቶች
    const engineSnd = document.getElementById('engineSound');
    const winSnd = document.getElementById('winSound');
    const crashSnd = document.getElementById('crashSound');

    let balance = 1000.00;
    let currentBet = 0;
    let multiplier = 1.00;
    let isPlaying = false;
    let crashPoint;
    let animationId;
    let cloudX = 0;

    function resize() {
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
    }
    window.onresize = resize;
    resize();

    function generateCrashPoint() {
        let chance = Math.random();
        if (chance < 0.40) { // 40% House Edge (ትርፍህ)
            return (Math.random() * 0.15 + 1.01).toFixed(2);
        } else {
            return (Math.random() * 5 + 1.16).toFixed(2);
        }
    }

    function handleButtonClick() {
        if (!isPlaying && mainBtn.innerText === "BET") {
            const amt = parseFloat(document.getElementById('betAmount').value);
            if (amt > balance || amt <= 0) return alert("በቂ ሂሳብ የሎትም!");
            
            currentBet = amt;
            balance -= amt;
            balText.innerText = "💰 " + balance.toFixed(2) + " ETB";
            startRound();
        } else if (isPlaying) {
            cashOut();
        }
    }

    function startRound() {
        isPlaying = true;
        multiplier = 1.00;
        crashPoint = generateCrashPoint();
        
        mainBtn.innerText = "CASH OUT";
        mainBtn.className = "btn-main cashout-active";
        multText.style.color = "white";

        // ድምፅ ጀምር
        engineSnd.currentTime = 0;
        engineSnd.play().catch(e => console.log("Audio play blocked"));

        animate();
    }

    function animate() {
        if (!isPlaying) return;

        multiplier += 0.006 * Math.sqrt(multiplier);
        multText.innerText = multiplier.toFixed(2) + "x";
        
        // ለቁጥሩ ትንሽ መንቀጥቀጥ (Vibration effect)
        multText.style.transform = `translate(-50%, -50%) scale(${1 + (multiplier * 0.01)})`;

        drawGame();

        const auto = parseFloat(document.getElementById('autoCashOut').value);
        if (auto > 1 && multiplier >= auto) {
            cashOut();
            return;
        }

        if (multiplier >= crashPoint) {
            crash();
            return;
        }

        animationId = requestAnimationFrame(animate);
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        cloudX -= 3;
        if (cloudX < -200) cloudX = canvas.width;
        ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
        ctx.beginPath();
        ctx.arc(cloudX, 150, 40, 0, Math.PI * 2);
        ctx.arc(cloudX + 50, 130, 50, 0, Math.PI * 2);
        ctx.fill();

        const x = (multiplier - 1) * (canvas.width / 5);
        const y = canvas.height - ((multiplier - 1) * (canvas.height / 5));

        ctx.beginPath();
        ctx.strokeStyle = "var(--primary)";
        ctx.lineWidth = 6;
        ctx.moveTo(0, canvas.height);
        ctx.quadraticCurveTo(x/2, canvas.height, x, y);
        ctx.stroke();

        ctx.font = "50px Arial";
        ctx.save();
        ctx.translate(Math.min(x, canvas.width-80), Math.max(y, 60));
        ctx.rotate(-Math.PI / 12);
        ctx.fillText("✈️", 0, 0);
        ctx.restore();
    }

    function crash() {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        
        engineSnd.pause();
        crashSnd.play();

        multText.innerText = "FLEW AWAY!";
        multText.style.color = "#ff4444";
        mainBtn.innerText = "BET";
        mainBtn.className = "btn-main bet-active";
    }

    function cashOut() {
        if (!isPlaying) return;
        
        engineSnd.pause();
        winSnd.play();

        const win = currentBet * multiplier;
        balance += win;
        balText.innerText = "💰 " + balance.toFixed(2) + " ETB";
        
        isPlaying = false;
        cancelAnimationFrame(animationId);
        
        multText.style.color = "var(--secondary)";
        mainBtn.innerText = "BET";
        mainBtn.className = "btn-main bet-active";
    }

    // Players logic
    const players = ["Abebe", "Sara", "Kebede", "Mulu", "Dai", "Yonas", "Hanna"];
    setInterval(() => {
        const list = document.getElementById('player-list');
        list.innerHTML = players.map(n => `
            <div class="player-row">
                <span>👤 ${n}</span>
                <span style="color: #ffc107;">${(Math.random()*200).toFixed(2)} ETB</span>
            </div>
        `).join('');
    }, 4000);
</script>

</body>
</html>
