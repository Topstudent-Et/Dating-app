<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME V31 - FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Game Area */
        .game-area { position: relative; height: 300px; background: radial-gradient(circle at bottom left, #2a0505, #000 85%); border-radius: 30px; margin: 10px; border: 1px solid #222; overflow: hidden; }
        #multiplier { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font-size: 4.5rem; font-weight: 900; z-index: 10; font-family: 'Orbitron'; color: #fff; }
        #plane { position: absolute; font-size: 3.5rem; z-index: 30; filter: drop-shadow(0 0 15px #f00); }
        .red-line { position: absolute; bottom: 10%; left: 10%; height: 4px; background: #f00; box-shadow: 0 5px 25px #f00; transform-origin: left bottom; z-index: 20; }

        /* Podium */
        .podium-item { position: relative; display: flex; flex-direction: column; align-items: center; width: 32%; border-radius: 15px 15px 0 0; text-align: center; }
        .rank-1 { height: 140px; background: linear-gradient(180deg, #ffd70033, #ffd70005); border: 2px solid #ffd700; border-bottom: 0; }
        .rank-2 { height: 110px; background: linear-gradient(180deg, #c0c0c033, #c0c0c005); border: 2px solid #c0c0c0; border-bottom: 0; }
        .rank-3 { height: 90px; background: linear-gradient(180deg, #cd7f3233, #cd7f3205); border: 2px solid #cd7f32; border-bottom: 0; }
        .crown { position: absolute; top: -45px; font-size: 40px; filter: drop-shadow(0 0 10px #ffd700); }
        .medal { font-size: 28px; margin-bottom: 5px; }

        .bet-btn { background: linear-gradient(180deg, #28a745, #1e7e34); height: 60px; border-radius: 18px; font-weight: 900; width: 100%; border-bottom: 4px solid #145523; color: white; }
        .cash-btn { background: linear-gradient(180deg, #ffc107, #d39e00) !important; color: #000 !important; border-bottom: 4px solid #916c00 !important; }
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 120px; }
        .active-page { display: block; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 10px 20px; border-radius: 50px; font-size: 11px; z-index: 9999; display: none; }
    </style>
</head>
<body>

    <div id="toast" class="toast">Copied! ✅</div>

    <header class="flex justify-between items-center p-4 border-b border-zinc-900 bg-black sticky top-0 z-[1000]">
        <div class="flex items-center gap-2">
            <img id="hPic" src="https://via.placeholder.com/40" class="w-9 h-9 rounded-full border border-zinc-800">
            <span id="hName" class="text-[10px] font-black uppercase truncate w-24 tracking-tighter">Loading...</span>
        </div>
        <div class="bg-zinc-900 px-4 py-1.5 rounded-full border border-zinc-800 flex items-center gap-2">
            <span id="topBal" class="text-green-500 font-black text-sm">0.00</span>
            <i class="fas fa-coins text-yellow-500 text-[10px]"></i>
        </div>
    </header>

    <div id="playPage" class="page active-page px-2">
        <div class="game-area">
            <div id="multiplier">1.00x</div>
            <div id="plane" style="left: 10%; bottom: 10%;">✈️</div>
            <div id="trail" class="red-line" style="width: 0; transform: rotate(-35deg);"></div>
            <div id="crashAlert" class="absolute inset-0 bg-black/95 hidden flex flex-col items-center justify-center z-50">
                <h1 id="crashVal" class="text-red-600 font-game text-6xl">1.00x</h1>
                <p class="text-white text-[10px] font-black mt-4 uppercase tracking-widest">Next Round in 5s</p>
            </div>
        </div>
        <div class="px-2 space-y-3">
            <div class="flex gap-2">
                <button id="btn1" onclick="handleBet(100)" class="bet-btn">BET 100</button>
                <button id="btn2" onclick="handleBet(200)" class="bet-btn">BET 200</button>
            </div>
        </div>
    </div>

    <div id="walletPage" class="page p-5">
        <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 mb-6 text-center">
            <p class="text-yellow-500 font-black text-xs mb-3 uppercase tracking-widest">Refer & Earn 5 ETB</p>
            <div class="bg-black p-3 rounded-xl flex justify-between items-center border border-zinc-800">
                <span id="refLink" class="text-[9px] text-zinc-500 truncate w-44 italic"></span>
                <button onclick="copyRef()" class="text-blue-500 font-black text-xs">COPY</button>
            </div>
        </div>
        <div class="space-y-4">
            <div class="bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800">
                <p class="text-blue-500 font-bold text-[10px] mb-2">DEPOSIT METHODS</p>
                <button class="w-full bg-blue-600 h-14 rounded-xl font-black uppercase text-xs">CBE / Abyssinia</button>
            </div>
            <div class="bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800">
                <p class="text-orange-500 font-bold text-[10px] mb-2">WITHDRAWAL</p>
                <button class="w-full bg-orange-600 h-14 rounded-xl font-black uppercase text-xs">Request Cashout</button>
            </div>
        </div>
    </div>

    <div id="topPage" class="page p-4">
        <div class="flex items-end justify-center gap-1 h-48 mt-6 mb-8">
            <div class="podium-item rank-2">
                <span class="medal">🥈</span>
                <p class="text-[10px] font-bold truncate px-1">አማኑኤል ገላው</p>
                <p class="text-zinc-400 font-black text-[10px]">92,400</p>
            </div>
            <div class="podium-item rank-1">
                <span class="crown">👑</span>
                <p id="winnerName" class="mt-8 text-[12px] font-black text-yellow-500 uppercase truncate px-1 italic">DAI</p>
                <p class="text-white font-black text-xs">245,000</p>
            </div>
            <div class="podium-item rank-3">
                <span class="medal">🥉</span>
                <p class="text-[9px] font-bold truncate px-1">ቤተልሔም ሰለሞን</p>
                <p class="text-zinc-500 font-black text-[10px]">61,200</p>
            </div>
        </div>
        <div id="winnersList" class="space-y-2"></div>
    </div>

    <div id="profilePage" class="page p-10 text-center">
        <img id="uPic" src="https://via.placeholder.com/150" class="w-28 h-28 rounded-full border-4 border-red-600 mx-auto mb-4 p-1">
        <h2 id="uName" class="font-black text-2xl uppercase italic tracking-widest">PLAYER</h2>
        <p class="text-zinc-600 text-[10px] font-bold mb-8 uppercase">ID: <span id="uID">00000</span></p>
        
        <div class="bg-zinc-900 p-8 rounded-3xl border border-zinc-800">
            <p class="text-zinc-500 text-xs uppercase mb-1">Total Balance</p>
            <p id="pBal" class="text-4xl font-black text-green-500">0.00</p>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full h-20 bg-black/95 border-t border-zinc-900 flex justify-around items-center z-[2000] pb-5">
        <div onclick="showPage('play')" id="n-play" class="text-red-600 flex flex-col items-center"><i class="fas fa-play text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Play</span></div>
        <div onclick="showPage('wallet')" id="n-wallet" class="text-zinc-600 flex flex-col items-center"><i class="fas fa-wallet text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Wallet</span></div>
        <div onclick="showPage('top')" id="n-top" class="text-zinc-600 flex flex-col items-center"><i class="fas fa-trophy text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Top 50</span></div>
        <div onclick="showPage('profile')" id="n-profile" class="text-zinc-600 flex flex-col items-center"><i class="fas fa-user-circle text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Profile</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        let user = tg.initDataUnsafe.user || { id: "0000", first_name: "DAI" };
        let db = JSON.parse(localStorage.getItem('world_v31')) || { bal: 0.0 };
        let curM = 1.0, isFlying = false, activeBet = 0, loop;

        const etNames = ["ዮናስ ካሳሁን", "ጽዮን አበበ", "ዳዊት ወንድሙ", "ርብቃ ግርማ", "ኤልያስ ታደሰ", "መክሊት አሰፋ", "በረከት ደረጀ", "ሰላም ይሁን", "ቢኒያም ታሪኩ", "ኤደን ተስፋዬ", "ናቲ ብርሃኑ", "ሊዲያ ግርማ", "ሳሙኤል በቀለ", "ቲጂ ደሳለኝ", "ሳምራዊት ደምሴ", "ሄለን ሙሉጌታ", "ዮሴፍ ታዬ", "ሜሮን አለሙ", "ሮቤል ጌታሁን", "ፍቅር ተፈራ"];

        function startEngine() {
            curM = 1.0; isFlying = true;
            document.getElementById('crashAlert').classList.add('hidden');
            // Logic: Bet ካለ 1.00x - 1.30x (Admin Profit)
            let target = activeBet > 0 ? (1.00 + Math.random() * 0.30) : (2 + Math.random() * 25);
            loop = setInterval(() => {
                curM += (curM < 3 ? 0.04 : 0.4);
                document.getElementById('multiplier').innerText = curM.toFixed(2) + "x";
                let x = Math.min((curM - 1) * 35, 82), y = Math.min((curM - 1) * 25, 72);
                document.getElementById('plane').style.left = (10 + x) + "%"; document.getElementById('plane').style.bottom = (10 + y) + "%";
                document.getElementById('trail').style.width = (x * 4.5) + "px";
                if (curM >= target) { clearInterval(loop); crash(); }
            }, 80);
        }

        function crash() {
            isFlying = false; activeBet = 0;
            document.getElementById('crashVal').innerText = curM.toFixed(2) + "x";
            document.getElementById('crashAlert').classList.remove('hidden');
            setTimeout(startEngine, 5000);
        }

        function handleBet(amt) {
            if(!isFlying && activeBet === 0) {
                if(db.bal < amt) return alert("Low Balance! Contact Admin.");
                db.bal -= amt; activeBet = amt; refresh();
            } else if(isFlying && activeBet > 0) {
                db.bal += (activeBet * curM); activeBet = 0; refresh();
            }
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active-page'));
            document.querySelectorAll('nav div').forEach(el => el.className = 'text-zinc-600 flex flex-col items-center');
            document.getElementById(p+'Page').classList.add('active-page');
            document.getElementById('n-'+p).className = 'text-red-600 flex flex-col items-center scale-110';
        }

        function refresh() {
            document.getElementById('topBal').innerText = db.bal.toFixed(2);
            document.getElementById('pBal').innerText = db.bal.toFixed(2);
            localStorage.setItem('world_v31', JSON.stringify(db));
        }

        function copyRef() {
            navigator.clipboard.writeText(document.getElementById('refLink').innerText);
            document.getElementById('toast').style.display = 'block'; setTimeout(()=>document.getElementById('toast').style.display='none', 2000);
        }

        window.onload = () => {
            document.getElementById('hName').innerText = user.first_name;
            document.getElementById('uName').innerText = user.first_name;
            document.getElementById('winnerName').innerText = user.first_name;
            document.getElementById('uID').innerText = user.id;
            if(user.photo_url) {
                document.getElementById('hPic').src = user.photo_url;
                document.getElementById('uPic').src = user.photo_url;
            }
            // Bot Username Integration
            document.getElementById('refLink').innerText = `https://t.me/world_all_gamesbot?start=${user.id}`;
            
            const list = document.getElementById('winnersList');
            for(let i=4; i<=50; i++) {
                let randomName = etNames[Math.floor(Math.random() * etNames.length)];
                list.innerHTML += `<div class="bg-zinc-900/40 p-3.5 rounded-xl flex justify-between text-[10px] border border-zinc-900">
                    <span class="text-zinc-400 font-bold">#${i} ${randomName}</span>
                    <span class="text-green-500 font-black">${(Math.random()*8000).toFixed(0)} ETB</span></div>`;
            }
            refresh(); startEngine();
        };
    </script>
</body>
</html>
