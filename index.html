<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME - ULTIMATE PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .bet-box { background: #0f1012; border: 1px solid #222; border-radius: 20px; padding: 12px; }
        .btn-bet { background: #28a745; border-bottom: 5px solid #14532d; transition: 0.1s; width: 100%; height: 80px; border-radius: 15px; font-weight: 900; }
        .btn-cashout { background: #f97316; border-bottom: 5px solid #7c2d12; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .amt-btn { background: #111; border: 1px solid #333; font-size: 11px; font-weight: bold; border-radius: 8px; padding: 10px 0; }
        .amt-btn.active-btn { background: #2563eb; border-color: #3b82f6; box-shadow: 0 0 10px #2563eb; color: white; }
        .auto-btn { background: #1f2937; color: #9ca3af; font-size: 9px; font-weight: 900; border-radius: 6px; padding: 6px 0; }
        .auto-btn.active-auto { background: #e11d48; color: white; }
        .nav-dock { position: fixed; bottom: 0; width: 100%; background: #080808; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid #111; z-index: 1000; }
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 90px; }
        .page.active { display: block; }
        .history-badge { background: #1a1b1e; border: 1px solid #333; border-radius: 10px; padding: 2px 8px; font-size: 9px; font-weight: 900; }
    </style>
</head>
<body>

    <div class="flex justify-between items-center px-4 py-3 bg-zinc-950 border-b border-zinc-900">
        <div class="text-red-600 font-black text-xl italic font-game">WORLD GAME</div>
        <div class="flex items-center gap-3">
            <div class="text-[9px] text-zinc-500 font-bold"><i class="fas fa-users text-green-500"></i> 1,480 Live</div>
            <div onclick="showPage('wallet')" class="bg-zinc-900 px-4 py-1.5 rounded-full border border-zinc-800 flex items-center gap-2">
                <span id="topBal" class="text-green-500 font-bold text-sm">0.00</span>
                <span class="text-[9px] text-zinc-500 font-bold uppercase">ETB</span>
            </div>
        </div>
    </div>

    <div id="play" class="page active px-2 pt-1">
        <div id="history" class="flex gap-1 overflow-x-auto py-2 mb-1 no-scrollbar"></div>

        <div class="relative bg-zinc-950 h-52 rounded-3xl border border-zinc-900 mb-4 flex items-center justify-center overflow-hidden">
            <div id="mult" class="text-6xl font-black font-game z-50">1.00x</div>
            <div id="plane" class="absolute z-40 text-4xl" style="left:10%; bottom:10%;">✈️</div>
            <div id="crashMsg" class="hidden absolute z-50 text-red-600 font-black text-4xl font-game">FLEW AWAY!</div>
        </div>

        <div class="space-y-3">
            <div class="bet-box">
                <div class="flex gap-2">
                    <div class="w-1/3 grid grid-cols-2 gap-1">
                        <button id="v1-10" onclick="setV(1,10)" class="amt-btn active-btn">10</button>
                        <button id="v1-50" onclick="setV(1,50)" class="amt-btn">50</button>
                        <button id="v1-100" onclick="setV(1,100)" class="amt-btn">100</button>
                        <button id="v1-200" onclick="setV(1,200)" class="amt-btn">200</button>
                        <button id="a1-2" onclick="setA(1,2)" class="auto-btn">2x</button>
                        <button id="a1-4" onclick="setA(1,4)" class="auto-btn">4x</button>
                    </div>
                    <div class="w-2/3">
                        <button id="btn1" onclick="handle(1)" class="btn-bet">BET<br><span id="sub1" class="text-[9px] font-normal opacity-70">10.00 ETB</span></button>
                    </div>
                </div>
            </div>
            <div class="bet-box">
                <div class="flex gap-2">
                    <div class="w-1/3 grid grid-cols-2 gap-1">
                        <button id="v2-10" onclick="setV(2,10)" class="amt-btn active-btn">10</button>
                        <button id="v2-50" onclick="setV(2,50)" class="amt-btn">50</button>
                        <button id="v2-100" onclick="setV(2,100)" class="amt-btn">100</button>
                        <button id="v2-200" onclick="setV(2,200)" class="amt-btn">200</button>
                        <button id="a2-8" onclick="setA(2,8)" class="auto-btn">8x</button>
                        <button id="a2-16" onclick="setA(2,16)" class="auto-btn">16x</button>
                    </div>
                    <div class="w-2/3">
                        <button id="btn2" onclick="handle(2)" class="btn-bet">BET<br><span id="sub2" class="text-[9px] font-normal opacity-70">10.00 ETB</span></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="wallet" class="page p-6">
        <div class="flex gap-3 mb-8">
            <button onclick="swTab('d')" id="tabD" class="w-1/2 py-5 bg-green-600 rounded-2xl font-black">DEPOSIT</button>
            <button onclick="swTab('w')" id="tabW" class="w-1/2 py-5 bg-zinc-900 rounded-2xl font-black text-zinc-500">WITHDRAW</button>
        </div>
        <div id="secD" class="space-y-4">
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 flex justify-between items-center">
                <div class="flex items-center gap-3"><i class="fas fa-university text-blue-500 text-2xl"></i><div><p class="text-[9px] text-zinc-500">CBE BANK</p><p id="acc1" class="font-black text-lg">1000179571815</p></div></div>
                <i class="fas fa-copy text-zinc-600" onclick="copy('1000179571815')"></i>
            </div>
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 flex justify-between items-center">
                <div class="flex items-center gap-3"><i class="fas fa-mobile-alt text-yellow-500 text-2xl"></i><div><p class="text-[9px] text-zinc-500">TELEBIRR</p><p id="acc2" class="font-black text-lg">0906067696</p></div></div>
                <i class="fas fa-copy text-zinc-600" onclick="copy('0906067696')"></i>
            </div>
            <input type="text" id="ft" placeholder="FT Reference Number" class="w-full bg-zinc-950 p-5 rounded-2xl border border-zinc-800 outline-none font-bold text-sm">
            <input type="number" id="damt" placeholder="Amount" class="w-full bg-zinc-950 p-5 rounded-2xl border border-zinc-800 outline-none font-bold text-sm">
            <button onclick="sendToAdmin('DEP')" class="w-full bg-blue-600 py-5 rounded-2xl font-black text-lg">SUBMIT DEPOSIT</button>
        </div>
        <div id="secW" class="hidden space-y-4">
            <div class="bg-zinc-900 p-6 rounded-3xl text-center"><p class="text-[10px] text-zinc-500">BALANCE</p><p id="wbal" class="text-3xl font-black text-green-500">0.00 ETB</p></div>
            <input type="text" id="wacc" placeholder="Account Number" class="w-full bg-zinc-950 p-5 rounded-2xl border border-zinc-800 outline-none font-bold text-sm">
            <input type="number" id="wamt" placeholder="Withdrawal Amount" class="w-full bg-zinc-950 p-5 rounded-2xl border border-zinc-800 outline-none font-bold text-sm">
            <button onclick="sendToAdmin('WIT')" class="w-full bg-orange-600 py-5 rounded-2xl font-black text-lg">WITHDRAW NOW</button>
        </div>
    </div>

    <div id="profile" class="page p-6 text-center">
        <div class="w-24 h-24 bg-zinc-900 rounded-full border-4 border-blue-600 p-1 mx-auto mb-4">
            <img id="uPic" src="https://via.placeholder.com/150" class="w-full h-full rounded-full object-cover">
        </div>
        <h2 id="uName" class="text-2xl font-black italic mb-2">PLAYER</h2>
        <p class="text-blue-500 text-[10px] font-black uppercase mb-8"><i class="fas fa-check-circle"></i> Verified Profile</p>

        <div id="adminArea" class="hidden space-y-4 text-left">
            <div class="bg-zinc-900 p-5 rounded-3xl border border-red-900/50">
                <p class="text-red-500 font-black text-xs mb-4 italic">ADMIN SETTINGS</p>
                <input id="newCBE" placeholder="Update CBE" class="w-full bg-black p-4 rounded-xl text-xs mb-2 border border-zinc-800">
                <input id="newTB" placeholder="Update Telebirr" class="w-full bg-black p-4 rounded-xl text-xs mb-3 border border-zinc-800">
                <button onclick="updAdminBank()" class="w-full bg-yellow-600 py-4 rounded-xl font-black text-xs">UPDATE ALL ACCOUNTS</button>
            </div>
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800">
                <p class="text-zinc-500 font-black text-xs mb-4">PENDING REQUESTS</p>
                <div id="adminInbox" class="space-y-3 max-h-60 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <nav class="nav-dock">
        <div onclick="showPage('play')" class="nav-link active text-center"><i class="fas fa-gamepad text-xl"></i><div class="text-[9px] font-bold">GAME</div></div>
        <div onclick="showPage('wallet')" class="nav-link text-center"><i class="fas fa-wallet text-xl"></i><div class="text-[9px] font-bold">WALLET</div></div>
        <div onclick="showPage('profile')" class="nav-link text-center"><i class="fas fa-user-shield text-xl"></i><div class="text-[9px] font-bold">PROFILE</div></div>
    </nav>

    <script>
        let balance = 0.00; let isRunning = false; let mult = 1.0;
        let slots = { 1: {active: false, amt: 10, auto: 0}, 2: {active: false, amt: 10, auto: 0} };
        const adminID = "Dawit_Fikadu21";

        const tg = window.Telegram.WebApp;
        tg.expand();

        if(tg.initDataUnsafe.user) {
            document.getElementById('uName').innerText = tg.initDataUnsafe.user.first_name.toUpperCase();
            if(tg.initDataUnsafe.user.photo_url) document.getElementById('uPic').src = tg.initDataUnsafe.user.photo_url;
            if(tg.initDataUnsafe.user.username === adminID) document.getElementById('adminArea').classList.remove('hidden');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setV(s, v) {
            slots[s].amt = v;
            document.querySelectorAll(`#play .bet-box:nth-child(${s+1}) .amt-btn`).forEach(b => b.classList.remove('active-btn'));
            document.getElementById(`v${s}-${v}`).classList.add('active-btn');
            document.getElementById(`sub${s}`).innerText = v.toFixed(2) + " ETB";
        }

        function setA(s, a) {
            slots[s].auto = a;
            document.querySelectorAll(`#play .bet-box:nth-child(${s+1}) .auto-btn`).forEach(b => b.classList.remove('active-auto'));
            document.getElementById(`a${s}-${a}`).classList.add('active-auto');
        }

        function gameLoop() {
            if(isRunning) return;
            isRunning = true; mult = 1.0;
            document.getElementById('crashMsg').classList.add('hidden');
            document.getElementById('mult').classList.remove('hidden');

            let crash = (slots[1].active || slots[2].active) ? (1.0 + Math.random() * 2.5) : (5 + Math.random() * 60);

            let timer = setInterval(() => {
                mult += 0.01 * (mult / 1.5);
                document.getElementById('mult').innerText = mult.toFixed(2) + "x";
                document.getElementById('plane').style.left = (10 + (mult-1)*30) + "%";
                document.getElementById('plane').style.bottom = (10 + (mult-1)*20) + "%";

                [1,2].forEach(s => { if(slots[s].active && slots[s].auto > 0 && mult >= slots[s].auto) handle(s); });

                if(mult >= crash) {
                    clearInterval(timer); isRunning = false;
                    document.getElementById('mult').classList.add('hidden');
                    document.getElementById('crashMsg').classList.remove('hidden');
                    addHistory(mult.toFixed(2));
                    slots[1].active = false; slots[2].active = false;
                    resetBtns();
                    setTimeout(gameLoop, 4000);
                }
            }, 60);
        }

        function handle(s) {
            let b = document.getElementById('btn' + s);
            if(!slots[s].active) {
                if(balance < slots[s].amt) return alert("Insufficient Balance!");
                if(isRunning) return;
                balance -= slots[s].amt; updateUI();
                slots[s].active = true;
                b.style.opacity = "0.5"; b.innerHTML = "WAITING...";
            } else {
                let win = slots[s].amt * mult;
                balance += win; updateUI();
                alert("SUCCESS! +" + win.toFixed(2));
                slots[s].active = false; resetBtns();
            }
        }

        function resetBtns() {
            [1,2].forEach(s => {
                let b = document.getElementById('btn' + s);
                b.className = "btn-bet text-white"; b.style.opacity = "1";
                b.innerHTML = `BET<br><span class="text-[9px] font-normal">${slots[s].amt.toFixed(2)} ETB</span>`;
            });
        }

        function sendToAdmin(type) {
            const amt = type === 'DEP' ? document.getElementById('damt').value : document.getElementById('wamt').value;
            const ref = type === 'DEP' ? document.getElementById('ft').value : document.getElementById('wacc').value;
            const inbox = document.getElementById('adminInbox');
            
            const div = document.createElement('div');
            div.className = "bg-black p-3 rounded-2xl border border-zinc-800 text-[10px] flex justify-between items-center";
            div.innerHTML = `<div><p class="font-black">${type}: ${amt} ETB</p><p class="text-zinc-500">${ref}</p></div>
                             <button onclick="approve(this, ${amt}, '${type}')" class="bg-green-600 px-3 py-1 rounded-lg font-bold">Approve</button>`;
            inbox.prepend(div);
            alert("ጥያቄዎ ለአድሚን ተልኳል!");
        }

        function approve(btn, amt, type) {
            if(type === 'DEP') balance += parseFloat(amt);
            updateUI();
            btn.parentElement.remove();
            alert("Confirmed!");
        }

        function updAdminBank() {
            const c = document.getElementById('newCBE').value;
            const t = document.getElementById('newTB').value;
            if(c) document.getElementById('acc1').innerText = c;
            if(t) document.getElementById('acc2').innerText = t;
            alert("Bank Accounts Updated for All Users!");
        }

        function addHistory(val) {
            const h = document.getElementById('history');
            const b = document.createElement('div');
            b.className = "history-badge " + (val > 2 ? "text-blue-500" : "text-red-500");
            b.innerText = val + "x";
            h.prepend(b);
            if(h.children.length > 10) h.lastChild.remove();
        }

        function updateUI() {
            document.getElementById('topBal').innerText = balance.toFixed(2);
            document.getElementById('wbal').innerText = balance.toFixed(2) + " ETB";
        }

        function swTab(t) {
            document.getElementById('secD').classList.toggle('hidden', t === 'w');
            document.getElementById('secW').classList.toggle('hidden', t === 'd');
            document.getElementById('tabD').className = t === 'd' ? "w-1/2 py-5 bg-green-600 rounded-2xl font-black" : "w-1/2 py-5 bg-zinc-900 rounded-2xl font-black text-zinc-500";
            document.getElementById('tabW').className = t === 'w' ? "w-1/2 py-5 bg-orange-600 rounded-2xl font-black" : "w-1/2 py-5 bg-zinc-900 rounded-2xl font-black text-zinc-500";
        }

        function copy(t) { navigator.clipboard.writeText(t); alert("Copied!"); }

        window.onload = () => {
            gameLoop();
            setInterval(() => {
                if(isRunning) {
                    [1,2].forEach(s => {
                        if(slots[s].active) {
                            let b = document.getElementById('btn' + s);
                            b.className = "btn-bet btn-cashout text-white";
                            b.innerHTML = `CASH OUT<br><span class="text-xl font-black">${(slots[s].amt * mult).toFixed(2)}</span>`;
                        }
                    });
                }
            }, 100);
        };
    </script>
</body>
</html>
