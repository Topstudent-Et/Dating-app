<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIATOR PRO - 24/7 LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
        body { background-color: #0b0e11; color: white; font-family: 'Roboto', sans-serif; margin: 0; overflow: hidden; }
        .aviator-screen { 
            background: radial-gradient(circle at bottom left, #1c0a12 0%, #000 100%);
            height: 280px; position: relative; border-radius: 12px; overflow: hidden; border: 1px solid #2d1a24;
        }
        .plane-box { position: absolute; bottom: 20px; left: 20px; width: 80px; z-index: 50; transition: transform 0.1s linear; }
        .multi-text { font-size: 4rem; font-weight: 900; z-index: 100; position: relative; text-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        .history-dot { background: #1c2127; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; min-width: 45px; text-align: center; }
        .btn-bet { background-color: #28a745; border-radius: 10px; font-weight: 800; transition: 0.2s; }
        .btn-cashout { background-color: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <div id="regModal" class="modal flex">
        <div class="bg-[#1c2127] p-6 rounded-2xl w-full max-w-sm border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-red-500">Welcome to Aviator</h2>
            <p class="text-sm text-gray-400 mb-4">Please enter your Telegram Username to start.</p>
            <input id="userNameInput" type="text" placeholder="@username" class="w-full bg-black p-3 rounded-lg border border-gray-700 mb-4 outline-none">
            <button onclick="saveUser()" class="w-full bg-red-600 py-3 rounded-lg font-bold">START PLAYING</button>
        </div>
    </div>

    <div class="p-3 flex justify-between items-center bg-[#1c2127] border-b border-gray-800">
        <div class="flex flex-col">
            <span class="text-red-600 font-black italic text-xl">Aviator</span>
            <span id="displayUser" class="text-[10px] text-gray-400">@Guest</span>
        </div>
        <div class="flex items-center gap-2">
            <div class="bg-black px-3 py-1 rounded-full border border-green-900">
                <span id="balance" class="text-green-500 font-bold">10.00</span> <span class="text-[10px] text-gray-500">ETB</span>
            </div>
        </div>
    </div>

    <div id="history" class="flex gap-2 p-2 bg-[#0b0e11] overflow-x-auto border-b border-gray-900">
        </div>

    <div class="p-3">
        <div class="aviator-screen flex items-center justify-center">
            <div id="multi" class="multi-text">1.00x</div>
            <div id="plane" class="plane-box">
                <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10,30 L60,30 L90,10 L90,50 L60,30" fill="#d32f2f" stroke="white" stroke-width="2"/>
                    <line x1="70" y1="25" x2="80" y2="35" stroke="black" stroke-width="2"/>
                    <line x1="70" y1="35" x2="80" y2="25" stroke="black" stroke-width="2"/>
                </svg>
            </div>
        </div>

        <div class="mt-4 grid grid-cols-1 gap-3">
            <div class="bg-[#1c2127] p-3 rounded-xl border border-gray-800 flex gap-3">
                <div class="w-1/3 space-y-2">
                    <div class="bg-black flex items-center justify-between px-2 py-2 rounded">
                        <button onclick="adj(-1)" class="text-gray-500 font-bold">−</button>
                        <input id="betAmt" type="number" value="10" class="bg-transparent text-center w-full font-bold outline-none text-sm">
                        <button onclick="adj(1)" class="text-gray-500 font-bold">+</button>
                    </div>
                    <div class="grid grid-cols-2 gap-1">
                        <button onclick="setV(50)" class="bg-gray-800 text-[10px] py-1 rounded">50</button>
                        <button onclick="setV(100)" class="bg-gray-800 text-[10px] py-1 rounded">100</button>
                    </div>
                </div>
                <button id="betBtn" onclick="toggleBet()" class="btn-bet flex-1 py-4 text-lg">BET<br><span id="betLbl" class="text-[10px] font-normal">10.00 ETB</span></button>
            </div>
        </div>

        <div class="mt-4 bg-[#14191f] rounded-xl border border-gray-800 h-48 overflow-hidden flex flex-col">
            <div class="p-2 bg-black/40 text-[10px] font-bold flex justify-between border-b border-gray-800">
                <span>ALL BETS (<span id="activeCount">0</span>)</span>
                <span class="text-yellow-500 cursor-pointer" onclick="copyRef()">🔗 REFERRAL LINK</span>
            </div>
            <div id="playerList" class="overflow-y-auto flex-1 text-[11px]">
                </div>
        </div>
    </div>

    <audio id="sndFly" loop src="https://www.soundjay.com/transportation/sounds/propeller-plane-flying-1.mp3"></audio>

    <script>
        let balance = parseFloat(localStorage.getItem('aviator_bal')) || 10.00;
        let username = localStorage.getItem('aviator_user') || "";
        let history = JSON.parse(localStorage.getItem('aviator_hist')) || ["1.20x", "2.50x", "1.05x"];
        let isFlying = false;
        let multiplier = 1.00;
        let currentBet = { active: false, amt: 0 };
        let gameLoop;

        // Init
        window.onload = () => {
            if(!username) { document.getElementById('regModal').style.display = 'flex'; }
            else { setupUI(); }
            renderHistory();
        };

        function saveUser() {
            let input = document.getElementById('userNameInput').value;
            if(input.length < 3) return alert("Enter valid username");
            username = input.startsWith('@') ? input : '@' + input;
            localStorage.setItem('aviator_user', username);
            localStorage.setItem('aviator_bal', 10.00); // Initial 10 ETB
            document.getElementById('regModal').style.display = 'none';
            setupUI();
        }

        function setupUI() {
            document.getElementById('displayUser').innerText = username;
            document.getElementById('balance').innerText = balance.toFixed(2);
            startGlobalCycle();
        }

        function adj(v) { 
            let el = document.getElementById('betAmt');
            el.value = Math.max(1, parseInt(el.value) + v);
            updateLabels();
        }
        function setV(v) { document.getElementById('betAmt').value = v; updateLabels(); }
        function updateLabels() { document.getElementById('betLbl').innerText = document.getElementById('betAmt').value + ".00 ETB"; }

        function toggleBet() {
            let btn = document.getElementById('betBtn');
            let amt = parseInt(document.getElementById('betAmt').value);
            if(!isFlying && !currentBet.active) {
                if(amt > balance) return alert("Low Balance!");
                balance -= amt;
                currentBet = { active: true, amt: amt };
                btn.innerHTML = "WAITING...<br><span class='text-[10px]'>CANCEL</span>";
                btn.classList.replace('bg-green-600', 'bg-red-900');
                saveState();
            } else if (isFlying && currentBet.active) {
                let win = currentBet.amt * multiplier;
                balance += win;
                currentBet.active = false;
                alert(`Won: ${win.toFixed(2)} ETB`);
                resetBetUI();
                saveState();
            }
        }

        function resetBetUI() {
            let btn = document.getElementById('betBtn');
            btn.className = "btn-bet flex-1 py-4 text-lg bg-green-600";
            updateLabels();
            btn.innerHTML = `BET<br><span id="betLbl" class="text-[10px] font-normal">${document.getElementById('betAmt').value}.00 ETB</span>`;
        }

        function saveState() {
            localStorage.setItem('aviator_bal', balance);
            document.getElementById('balance').innerText = balance.toFixed(2);
        }

        function startGlobalCycle() {
            if(isFlying) return;
            let wait = 5;
            let timer = setInterval(() => {
                document.getElementById('multi').innerText = `Next in ${wait}s`;
                document.getElementById('multi').style.fontSize = "2rem";
                if(wait-- <= 0) { clearInterval(timer); launch(); }
                generateBots();
            }, 1000);
        }

        function launch() {
            isFlying = true; multiplier = 1.00;
            document.getElementById('sndFly').play();
            document.getElementById('multi').style.fontSize = "4rem";
            document.getElementById('multi').style.color = "white";

            if(currentBet.active) {
                document.getElementById('betBtn').classList.replace('bg-red-900', 'btn-cashout');
                document.getElementById('betBtn').innerHTML = `CASH OUT<br><span>${(currentBet.amt * multiplier).toFixed(2)}</span>`;
            }

            // 40% Admin Profit Logic
            let crashAt = Math.random() < 0.4 ? (1 + Math.random() * 0.15) : (1.15 + Math.random() * 8);

            gameLoop = setInterval(() => {
                multiplier += 0.02;
                document.getElementById('multi').innerText = multiplier.toFixed(2) + "x";
                document.getElementById('plane').style.transform = `translate(${multiplier * 25}px, -${multiplier * 15}px)`;
                
                if(currentBet.active) {
                    document.getElementById('betBtn').querySelector('span').innerText = (currentBet.amt * multiplier).toFixed(2) + " ETB";
                }
                if(multiplier >= crashAt) crash();
            }, 80);
        }

        function crash() {
            clearInterval(gameLoop);
            isFlying = false;
            document.getElementById('sndFly').pause();
            document.getElementById('sndFly').currentTime = 0;
            document.getElementById('multi').innerText = "FLEW AWAY!";
            document.getElementById('multi').style.color = "#ff1e4d";
            
            history.unshift(multiplier.toFixed(2) + "x");
            if(history.length > 10) history.pop();
            localStorage.setItem('aviator_hist', JSON.stringify(history));
            renderHistory();

            if(currentBet.active) { currentBet.active = false; resetBetUI(); }
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                startGlobalCycle();
            }, 3000);
        }

        function renderHistory() {
            let h = document.getElementById('history');
            h.innerHTML = history.map(val => `<span class="history-dot ${parseFloat(val) > 2 ? 'text-purple-500' : 'text-blue-400'}">${val}</span>`).join('');
        }

        function generateBots() {
            const names = ["@Dagi_King", "@Sami_99", "@Hana_Eth", "@Abel_Pro", "@Rediet_Z", "@Muller_VIP"];
            let list = document.getElementById('playerList');
            let count = Math.floor(Math.random() * 50) + 100;
            document.getElementById('activeCount').innerText = count;
            list.innerHTML = "";
            for(let i=0; i<8; i++) {
                let n = names[Math.floor(Math.random()*names.length)];
                let b = (Math.random()*200).toFixed(0);
                list.innerHTML += `<div class="p-2 border-b border-gray-900 flex justify-between"><span>👤 ${n}</span><span>${b} ETB</span></div>`;
            }
        }

        function copyRef() {
            const link = window.location.href + "?ref=" + username.replace('@', '');
            navigator.clipboard.writeText(link);
            alert("Referral Link Copied!");
        }
    </script>
</body>
</html>
