<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World All Games Bot - Aviator Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #ff0000;
            --bg-dark: #0b0b0b;
            --panel-bg: #1a1a1a;
            --gold: #ffd700;
            --verified-blue: #1da1f2;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Ubuntu', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Game Animation Canvas */
        .game-screen {
            position: relative;
            width: 100%;
            height: 350px;
            background: #000;
            border-bottom: 3px solid #333;
        }

        #multi-display {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: 900;
            z-index: 10;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* Top 50 Winners List */
        .leaderboard {
            padding: 15px;
            background: var(--panel-bg);
        }

        .winner-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .rank-box { width: 40px; font-weight: bold; }
        .name-box { flex-grow: 1; display: flex; align-items: center; gap: 8px; }
        .verified { color: var(--verified-blue); font-size: 0.9rem; }

        /* Navigation Buttons */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #111;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .nav-btn.active { background: var(--primary-red); border-color: var(--primary-red); }

        /* Admin & Wallet Sections */
        .wallet-panel {
            padding: 20px;
            display: none; /* Hidden by default */
        }

        .bank-info-box {
            background: #222;
            padding: 15px;
            border-left: 5px solid var(--primary-red);
            margin-bottom: 20px;
            border-radius: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="showSection('game')">PLAY</button>
        <button class="nav-btn" onclick="showSection('winners')">TOP 50</button>
        <button class="nav-btn" onclick="showSection('wallet')">WALLET</button>
        <button class="nav-btn" onclick="showSection('profile')">PROFILE</button>
    </div>

    <div id="game-sec">
        <div class="game-screen">
            <div id="multi-display">1.00x</div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <div id="wallet-sec" class="wallet-panel">
        <h2>💰 የገንዘብ ማስተላለፊያ</h2>
        <div class="bank-info-box">
            <p>ንግድ ባንክ (CBE): <b id="cbe-display">1000179571815</b></p>
            <p>አቢሲኒያ (Abyssinia): <b id="aby-display">165097254</b></p>
            <p>አድሚን: <b>@Dawit_Fikadu21</b></p>
        </div>

        <h3>Deposit (ገንዘብ ለማስገባት)</h3>
        <input type="number" id="dep-amt" placeholder="መጠን (Amount)">
        <input type="text" id="ft-num" placeholder="የ FT ቁጥር (Transaction Number)">
        <button class="action-btn" style="background: #28a745; color: white;" onclick="submitToAdmin('Deposit')">ለአድሚን ላክ</button>

        <h3 style="margin-top: 30px;">Withdraw (ገንዘብ ለማውጣት)</h3>
        <input type="number" id="with-amt" placeholder="የሚወጣ መጠን">
        <input type="text" id="bank-acc" placeholder="የባንክ አካውንት ቁጥርዎ">
        <button class="action-btn" style="background: var(--primary-red); color: white;" onclick="submitToAdmin('Withdraw')">የማውጫ ጥያቄ ላክ</button>
    </div>

    <div id="winners-sec" class="leaderboard" style="display:none;">
        <h2 style="text-align: center;">🏆 Top 50 Winners</h2>
        <div id="winners-list"></div>
    </div>

    <script>
        // --- 1. CONFIGURATION (እዚህ ጋር የባንክ ቁጥሩን መቀየር ትችላለህ) ---
        const sysConfig = {
            cbe: "1000179571815",
            abyssinia: "165097254",
            admin: "@Dawit_Fikadu21"
        };

        // የባንክ ቁጥሩን በገጹ ላይ በራስ ሰር መጫን
        document.getElementById('cbe-display').innerText = sysConfig.cbe;
        document.getElementById('aby-display').innerText = sysConfig.abyssinia;

        // --- 2. TOP 50 WINNERS (ኢትዮጵያዊ ስሞች) ---
        const names = [
            "Amanuel G.", "Selamawit T.", "Dawit Fikadu", "Bereket T.", "Hana Y.",
            "Tewodros K.", "Meryem A.", "Yonas Alemu", "Eskinder N.", "Rahel G.",
            "Samuel B.", "Hiwot A.", "Biniyam E.", "Martha H.", "Kaleb T.",
            "Solomon T.", "Genet M.", "Abel Tesfaye", "Fikirte A.", "Daniel G.",
            "Zelalem T.", "Tigist S.", "Mulugeta W.", "Aster A.", "Kedir M.",
            "Lydia H.", "Fasil D.", "Tadele G.", "Saron B.", "Henok A.",
            "Elias T.", "Meaza M.", "Kirubel S.", "Tsion Y.", "Yared W.",
            "Helen K.", "Abraham L.", "Meseret D.", "Tamirat B.", "Frehiwot S.",
            "Getnet A.", "Beza T.", "Natnael M.", " Kalkidan G.", "Eyob S.",
            "Semira A.", "Jemal H.", "Worku B.", "Nigist T.", "Desta F."
        ];

        const list = document.getElementById('winners-list');
        names.forEach((name, i) => {
            let rank = "";
            if(i === 0) rank = "👑";
            else if(i === 1) rank = "🥈";
            else if(i === 2) rank = "🥉";
            else rank = i + 1;

            list.innerHTML += `
                <div class="winner-card">
                    <div class="name-box">
                        <div class="rank-box">${rank}</div>
                        <span>${name}</span>
                        <i class="fas fa-check-circle verified"></i>
                    </div>
                    <div style="font-weight:bold; color:#28a745;">${(Math.random()*8000 + 500).toFixed(2)} ETB</div>
                </div>
            `;
        });

        // --- 3. UI NAVIGATION ---
        function showSection(section) {
            document.getElementById('game-sec').style.display = section === 'game' ? 'block' : 'none';
            document.getElementById('winners-sec').style.display = section === 'winners' ? 'block' : 'none';
            document.getElementById('wallet-sec').style.display = section === 'wallet' ? 'block' : 'none';
            
            // Update active button
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // --- 4. ADMIN SUBMISSION ---
        function submitToAdmin(type) {
            const amount = type === 'Deposit' ? document.getElementById('dep-amt').value : document.getElementById('with-amt').value;
            const ref = type === 'Deposit' ? document.getElementById('ft-num').value : document.getElementById('bank-acc').value;

            if(!amount || !ref) {
                alert("እባክዎ ሁሉንም መረጃዎች በትክክል ይሙሉ።");
                return;
            }

            // እዚህ ጋር ወደ አድሚን ቴሌግራም የሚላክበት API ሊንክ ማከል ይቻላል
            alert(`የ ${type} ጥያቄዎ መጠን ${amount} ETB ለአድሚን ${sysConfig.admin} ተልኳል። በቅርቡ ይጸድቅልዎታል።`);
        }
    </script>
</body>
</html>
