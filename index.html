<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>✈️ AVIATOR | Neon Crash Game</title>
  <!-- Tailwind CSS + Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* custom neon & glassmorphic overrides */
    body {
      background: radial-gradient(circle at 10% 20%, #0a0f1e, #03050b);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .glass-panel {
      background: rgba(12, 20, 35, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .neon-gold {
      text-shadow: 0 0 5px #ffd966, 0 0 10px #ffb347;
    }
    .neon-red {
      text-shadow: 0 0 4px #ff3366, 0 0 8px #cc0033;
    }
    .neon-blue {
      text-shadow: 0 0 6px #00ccff, 0 0 12px #0066cc;
    }
    .bet-btn {
      transition: all 0.2s ease;
      background: linear-gradient(135deg, #ff3366, #cc0033);
      border: none;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .cashout-btn {
      background: linear-gradient(135deg, #f0b90b, #d97706);
      color: #0a0a0a;
      box-shadow: 0 0 12px rgba(240, 185, 11, 0.6);
    }
    .multiplier {
      font-family: 'Orbitron', monospace;
      font-weight: 800;
      background: linear-gradient(135deg, #fff5cc, #ffd966);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 8px rgba(255, 200, 0, 0.5);
    }
    .curve-svg {
      filter: drop-shadow(0 0 6px #ff3366);
    }
    .sidebar-scroll {
      max-height: 280px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    /* custom scrollbar */
    .sidebar-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar-scroll::-webkit-scrollbar-track {
      background: #1e2a3a;
      border-radius: 8px;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: #ffd966;
      border-radius: 8px;
    }
    .history-chip {
      background: rgba(0, 0, 0, 0.6);
      border-left: 3px solid #ffd966;
      padding: 4px 12px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .badge-glow {
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }
  </style>
</head>
<body class="text-white">

  <!-- main container -->
  <div class="max-w-7xl mx-auto px-4 py-6 md:py-8">
    <!-- HEADER: Balance + Provably fair badge -->
    <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
      <div class="flex items-center gap-4">
        <div class="glass-panel px-5 py-2">
          <span class="text-sm font-medium text-gray-300">💰 BALANCE</span>
          <span id="userBalance" class="text-2xl font-black text-green-400 ml-2 neon-gold">1000.00</span>
          <span class="text-xs ml-1">ETB</span>
        </div>
        <div class="glass-panel px-4 py-2 text-xs">
          <i class="fas fa-shield-alt text-yellow-400 mr-1"></i>
          <span class="font-mono">Provably Fair RNG | SHA-256</span>
          <button id="verifyBtn" class="ml-2 underline text-yellow-300 text-[11px]">verify</button>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="bg-black/40 rounded-full px-3 py-1 border border-yellow-500/40">
          <i class="fas fa-users text-yellow-500 text-sm"></i>
          <span class="text-xs ml-1">LIVE: 2.1k</span>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- MAIN GAME COLUMN -->
      <div class="lg:col-span-2 space-y-5">
        <!-- history chips (last 12 rounds) -->
        <div class="glass-panel p-3">
          <div class="flex items-center gap-2 mb-2"><i class="fas fa-chart-line text-yellow-400"></i><span class="font-bold text-sm">LAST ROUNDS</span></div>
          <div id="historyContainer" class="flex flex-wrap gap-2 max-h-20 overflow-y-auto"></div>
        </div>

        <!-- GAME CANVAS (SVG + multiplier) -->
        <div class="glass-panel p-5 relative">
          <div class="relative w-full h-72 md:h-80">
            <svg class="absolute inset-0 w-full h-full curve-svg" viewBox="0 0 600 280" preserveAspectRatio="none">
              <path id="flightPath" d="M 20 250 Q 100 250 200 200 T 580 50" stroke="#ff3366" stroke-width="5" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <div class="text-center">
                <span id="currentMultiplier" class="multiplier text-7xl md:text-8xl font-black tracking-wider">1.00x</span>
                <div id="gameStatus" class="text-xs mt-2 bg-black/60 inline-block px-4 py-1 rounded-full backdrop-blur-sm">⚡ WAITING FOR BETS</div>
              </div>
            </div>
            <!-- plane icon (follows path) -->
            <div id="planeIcon" class="absolute text-3xl transition-all duration-50" style="left: 20px; top: 210px; transform: rotate(-20deg);">✈️</div>
          </div>
          <!-- countdown overlay (when countdown active) -->
          <div id="countdownOverlay" class="absolute inset-0 bg-black/80 backdrop-blur-md rounded-2xl flex items-center justify-center hidden z-20">
            <span id="countdownNumber" class="text-8xl font-black text-yellow-400">5</span>
          </div>
        </div>

        <!-- TWO INDEPENDENT BETTING PANELS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Panel 1 (LEFT) -->
          <div class="glass-panel p-4 border-l-4 border-red-500">
            <div class="flex justify-between items-center mb-2"><span class="font-bold"><i class="fas fa-arrow-left text-red-400"></i> PANEL A</span><span id="autoLabel1" class="text-xs text-yellow-400">⚡ AUTO: OFF</span></div>
            <div class="flex flex-wrap gap-2 mb-2">
              <input type="number" id="betAmount1" class="w-28 bg-black/50 border border-gray-600 rounded-xl px-3 py-2 text-sm" value="10" step="5" min="5">
              <div class="flex gap-1">
                <button data-panel="1" data-amt="10" class="quickBetBtn text-xs bg-white/10 px-2 py-1 rounded">10</button>
                <button data-panel="1" data-amt="50" class="quickBetBtn text-xs bg-white/10 px-2 py-1 rounded">50</button>
                <button data-panel="1" data-amt="100" class="quickBetBtn text-xs bg-white/10 px-2 py-1 rounded">100</button>
              </div>
            </div>
            <div class="flex flex-wrap gap-2 mb-3">
              <span class="text-xs text-gray-300 self-center">Auto Cash:</span>
              <button data-panel="1" data-auto="2" class="autoSetBtn text-xs bg-white/10 px-3 py-1 rounded">2x</button>
              <button data-panel="1" data-auto="4" class="autoSetBtn text-xs bg-white/10 px-3 py-1 rounded">4x</button>
              <button data-panel="1" data-auto="8" class="autoSetBtn text-xs bg-white/10 px-3 py-1 rounded">8x</button>
              <button data-panel="1" data-auto="0" class="autoSetBtn text-xs bg-white/10 px-3 py-1 rounded">OFF</button>
            </div>
            <button id="betBtn1" class="bet-btn w-full py-3 rounded-2xl font-bold text-lg tracking-wider">BET</button>
          </div>

          <!-- Panel 2 (RIGHT) -->
          <div class="glass-panel p-4 border-r-4 border-blue-500">
            <div class="flex justify-between items-center mb-2"><span class="font-bold"><i class="fas fa-arrow-right text-blue-400"></i> PANEL B</span><span id="autoLabel2" class="text-xs text-yellow-400">⚡ AUTO: OFF</span></div>
            <div class="flex flex-wrap gap-2 mb-2">
              <input type="number" id="betAmount2" class="w-28 bg-black/50 border border-gray-600 rounded-xl px-3 py-2 text-sm" value="10" step="5" min="5">
              <div class="flex gap-1">
                <button data-panel="2" data-amt="10" class="quickBetBtn text-xs bg-white/10 px-2 py-1 rounded">10</button>
                <button data-panel="2" data-amt="50" class="quickBetBtn text-xs bg-white/10 px-2 py-1 rounded">50</button>
                <button data-panel="2" data-amt="100" class="quickBetBtn text-xs bg-white/10 px-2 py-1 rounded">100</button>
              </div>
            </div>
            <div class="flex flex-wrap gap-2 mb-3">
              <span class="text-xs text-gray-300 self-center">Auto Cash:</span>
              <button data-panel="2" data-auto="2" class="autoSetBtn text-xs bg-white/10 px-3 py-1 rounded">2x</button>
              <button data-panel="2" data-auto="4" class="autoSetBtn text-xs bg-white/10 px-3 py-1 rounded">4x</button>
              <button data-panel="2" data-auto="8" class="autoSetBtn text-xs bg-white/10 px-3 py-1 rounded">8x</button>
              <button data-panel="2" data-auto="0" class="autoSetBtn text-xs bg-white/10 px-3 py-1 rounded">OFF</button>
            </div>
            <button id="betBtn2" class="bet-btn w-full py-3 rounded-2xl font-bold text-lg tracking-wider">BET</button>
          </div>
        </div>
      </div>

      <!-- SIDEBAR (All Bets / My Bets / Top) -->
      <div class="space-y-5">
        <div class="glass-panel p-4">
          <div class="flex gap-4 border-b border-yellow-500/40 pb-2 mb-3">
            <button id="tabAllBets" class="tab-btn text-sm font-bold text-yellow-400 border-b-2 border-yellow-400 pb-1">📋 ALL BETS</button>
            <button id="tabMyBets" class="tab-btn text-sm font-bold text-gray-400">👤 MY BETS</button>
            <button id="tabTop" class="tab-btn text-sm font-bold text-gray-400">🏆 TOP WINS</button>
          </div>
          <div id="sidebarContent" class="sidebar-scroll space-y-2 text-sm">
            <!-- dynamic content loaded via js -->
            <div class="text-center text-gray-400 text-xs">loading bets...</div>
          </div>
        </div>
        <!-- Provably fair info (minimal) -->
        <div class="glass-panel p-3 text-[11px] text-gray-400">
          <div class="flex justify-between">
            <span>🔐 Server Seed: <span id="serverSeedHash" class="font-mono">...</span></span>
            <span>🎲 Nonce: <span id="roundNonce">0</span></span>
          </div>
          <div class="mt-1">Client seed: <input type="text" id="clientSeedInput" class="bg-black/40 w-36 rounded px-1 text-yellow-200 text-xs" value="mySecretSeed"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------- GAME STATE -------------------------
    let balance = 1000.0;          // demo balance
    let gameActive = false;        // round in progress (plane flying)
    let countdownActive = false;
    let currentMultiplier = 1.00;
    let crashMultiplier = 1.00;
    let roundInProgress = false;
    let roundInterval = null;
    let countdownInterval = null;
    let currentRoundNonce = 0;
    
    // Server seed & provably fair (simulated)
    let serverSeed = "Av1aToR_SeCr3t_" + Math.random().toString(36).substring(2);
    let serverSeedHash = btoa(serverSeed).slice(0, 32); // simple hash simulation
    let clientSeed = "mySecretSeed";
    let roundCrashPoint = 0;

    // Bet data
    let betsPlaced = {
      1: { active: false, amount: 10, autoCash: 0, cashedOut: false },
      2: { active: false, amount: 10, autoCash: 0, cashedOut: false }
    };
    
    // History (last 15 crash multipliers)
    let historyMultipliers = [];
    
    // All bets list (simulated opponents)
    let simulatedBets = [
      { name: "CryptoKing", amount: 45, cashed: false, winMulti: 0 },
      { name: "NeonRider", amount: 120, cashed: false, winMulti: 0 },
      { name: "LuckyAce", amount: 30, cashed: false, winMulti: 0 },
      { name: "GoldenEagle", amount: 200, cashed: false, winMulti: 0 },
      { name: "ShadowBlade", amount: 75, cashed: false, winMulti: 0 }
    ];
    
    // Top wins storage (max 5)
    let topWins = [];
    
    // Helper: update UI balance
    function updateBalanceUI() {
      document.getElementById('userBalance').innerHTML = balance.toFixed(2);
    }
    
    // Generate crash point using provably fair method
    function generateCrashPoint(roundNonce, clientSeedVal, serverSeedVal) {
      const combined = `${serverSeedVal}-${clientSeedVal}-${roundNonce}`;
      let hash = 0;
      for (let i = 0; i < combined.length; i++) {
        hash = ((hash << 5) - hash) + combined.charCodeAt(i);
        hash |= 0;
      }
      let r = Math.abs(hash % 1000000) / 1000000; // 0..1
      let crash = Math.max(1.01, 100 / (Math.floor(r * 100) + 1));
      crash = Math.min(crash, 50);
      return parseFloat(crash.toFixed(2));
    }
    
    // refresh crash point for new round
    function updateCrashForRound() {
      currentRoundNonce++;
      document.getElementById('roundNonce').innerText = currentRoundNonce;
      clientSeed = document.getElementById('clientSeedInput').value;
      roundCrashPoint = generateCrashPoint(currentRoundNonce, clientSeed, serverSeed);
      return roundCrashPoint;
    }
    
    // add to history and update UI
    function addHistory(crashValue) {
      historyMultipliers.unshift(crashValue);
      if (historyMultipliers.length > 15) historyMultipliers.pop();
      const container = document.getElementById('historyContainer');
      container.innerHTML = historyMultipliers.map(m => `<div class="history-chip"><span class="font-mono">${m.toFixed(2)}x</span></div>`).join('');
    }
    
    // Record top win
    function addTopWin(playerName, winAmount, multiplier) {
      topWins.push({ name: playerName, amount: winAmount, mult: multiplier });
      topWins.sort((a,b)=>b.amount - a.amount);
      if (topWins.length > 5) topWins.pop();
      renderSidebarActive();  // refresh sidebar if top tab active
    }
    
    // Render sidebar based on active tab
    let activeTab = 'allbets'; // allbets, mybets, top
    function renderSidebarActive() {
      const container = document.getElementById('sidebarContent');
      if (activeTab === 'allbets') {
        // show all bets (simulated + current player bets)
        let allEntries = [];
        // player bets if active
        if (betsPlaced[1].active) allEntries.push({ name: "YOU (Panel A)", amount: betsPlaced[1].amount, cashed: betsPlaced[1].cashedOut, winMulti: betsPlaced[1].cashedOut ? currentMultiplier : 0 });
        if (betsPlaced[2].active) allEntries.push({ name: "YOU (Panel B)", amount: betsPlaced[2].amount, cashed: betsPlaced[2].cashedOut, winMulti: betsPlaced[2].cashedOut ? currentMultiplier : 0 });
        // simulated bets
        simulatedBets.forEach(b => allEntries.push({ name: b.name, amount: b.amount, cashed: b.cashed, winMulti: b.winMulti }));
        container.innerHTML = allEntries.map(b => `
          <div class="flex justify-between items-center border-b border-gray-700 pb-1">
            <span class="font-medium">${b.name}</span>
            <span class="text-xs">${b.amount} ETB</span>
            <span class="text-xs ${b.cashed ? 'text-green-400' : 'text-red-400'}">${b.cashed ? `✔ ${b.winMulti.toFixed(2)}x` : '✘'}</span>
          </div>
        `).join('');
        if(allEntries.length===0) container.innerHTML = '<div class="text-center text-gray-500">No bets placed</div>';
      } 
      else if (activeTab === 'mybets') {
        let my = [];
        if (betsPlaced[1].active) my.push({ panel: 'A', amount: betsPlaced[1].amount, auto: betsPlaced[1].autoCash, cashed: betsPlaced[1].cashedOut, win: betsPlaced[1].cashedOut ? (betsPlaced[1].amount * currentMultiplier) : 0 });
        if (betsPlaced[2].active) my.push({ panel: 'B', amount: betsPlaced[2].amount, auto: betsPlaced[2].autoCash, cashed: betsPlaced[2].cashedOut, win: betsPlaced[2].cashedOut ? (betsPlaced[2].amount * currentMultiplier) : 0 });
        if(my.length===0) container.innerHTML = '<div class="text-center text-gray-500">No active bets</div>';
        else container.innerHTML = my.map(b => `
          <div class="bg-black/30 p-2 rounded">
            <div class="flex justify-between"><span>Panel ${b.panel}</span><span class="text-yellow-300">${b.amount} ETB</span></div>
            <div class="flex justify-between text-xs"><span>Auto: ${b.auto>0?b.auto+'x':'OFF'}</span><span class="${b.cashed?'text-green-400':'text-orange-400'}">${b.cashed ? `Cashed ${b.win.toFixed(0)} ETB` : 'Active'}</span></div>
          </div>
        `).join('');
      } 
      else if (activeTab === 'top') {
        if(topWins.length===0) container.innerHTML = '<div class="text-center text-gray-500">No big wins yet</div>';
        else container.innerHTML = topWins.map((w,idx) => `
          <div class="flex justify-between items-center bg-gradient-to-r from-yellow-900/20 to-transparent p-2 rounded">
            <span><i class="fas fa-crown text-yellow-500 text-xs mr-1"></i>${w.name}</span>
            <span class="font-bold text-green-400">${w.amount.toFixed(0)} ETB</span>
            <span class="text-[10px]">${w.mult.toFixed(2)}x</span>
          </div>
        `).join('');
      }
    }
    
    // cashout function for a panel
    function cashOut(panelId) {
      if (!gameActive) return;
      if (!betsPlaced[panelId].active || betsPlaced[panelId].cashedOut) return;
      const bet = betsPlaced[panelId];
      const winAmount = bet.amount * currentMultiplier;
      balance += winAmount;
      updateBalanceUI();
      bet.cashedOut = true;
      bet.winValue = winAmount;
      // add to top wins if significant (>500 ETB)
      if (winAmount >= 300) addTopWin(`You (Panel ${panelId===1?'A':'B'})`, winAmount, currentMultiplier);
      // update sidebars
      renderSidebarActive();
      document.getElementById(`betBtn${panelId}`).innerText = "CASHED!";
      document.getElementById(`betBtn${panelId}`).classList.remove('cashout-btn');
      document.getElementById(`betBtn${panelId}`).classList.add('bg-gray-600');
      // show notification
      showToast(`🎉 Panel ${panelId==1?'A':'B'} cashed out ${winAmount.toFixed(0)} ETB @ ${currentMultiplier.toFixed(2)}x`);
    }
    
    // reset round & start countdown
    function resetAndCountdown() {
      if (roundInterval) clearInterval(roundInterval);
      gameActive = false;
      currentMultiplier = 1.00;
      document.getElementById('currentMultiplier').innerHTML = '1.00x';
      document.getElementById('gameStatus').innerHTML = '⏳ COUNTDOWN';
      // reset bet cashout flags but keep active if they placed bet (they remain active for new round)
      betsPlaced[1].cashedOut = false;
      betsPlaced[2].cashedOut = false;
      betsPlaced[1].active = false;
      betsPlaced[2].active = false;
      // reset button states
      ['betBtn1','betBtn2'].forEach(btnId => {
        const btn = document.getElementById(btnId);
        btn.innerText = "BET";
        btn.classList.remove('cashout-btn', 'bg-gray-600');
        btn.classList.add('bet-btn');
      });
      // reset auto label for side
      // reset simulated bets cashout status
      simulatedBets.forEach(b => { b.cashed = false; b.winMulti = 0; });
      // start countdown 5 sec
      startCountdown();
      renderSidebarActive();
    }
    
    function startCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);
      let count = 5;
      const overlay = document.getElementById('countdownOverlay');
      const countSpan = document.getElementById('countdownNumber');
      overlay.classList.remove('hidden');
      countdownInterval = setInterval(() => {
        countSpan.innerText = count;
        if (count <= 0) {
          clearInterval(countdownInterval);
          overlay.classList.add('hidden');
          startRound();
        }
        count--;
      }, 1000);
    }
    
    function startRound() {
      // generate crash point using provably fair
      const crashVal = updateCrashForRound();
      gameActive = true;
      currentMultiplier = 1.00;
      document.getElementById('gameStatus').innerHTML = '✈️ FLYING';
      // reset any cashed flags for active bets (but bets placed flag should be from pre-round)
      // ensure betsPlaced active flags stay as they were (player clicked BET before round)
      betsPlaced[1].cashedOut = false;
      betsPlaced[2].cashedOut = false;
      // update button texts to CASH OUT
      if (betsPlaced[1].active) { 
        let btn1 = document.getElementById('betBtn1');
        btn1.innerText = "CASH OUT";
        btn1.classList.add('cashout-btn');
        btn1.classList.remove('bet-btn');
      }
      if (betsPlaced[2].active) {
        let btn2 = document.getElementById('betBtn2');
        btn2.innerText = "CASH OUT";
        btn2.classList.add('cashout-btn');
        btn2.classList.remove('bet-btn');
      }
      // animate multiplier
      let frame = 0;
      roundInterval = setInterval(() => {
        if (!gameActive) return;
        // increment multiplier smoothly
        currentMultiplier += 0.008;
        if (currentMultiplier > crashVal) {
          // CRASH
          gameActive = false;
          clearInterval(roundInterval);
          // process crash: all active non-cashed bets lose
          let lostAmount = 0;
          if (betsPlaced[1].active && !betsPlaced[1].cashedOut) lostAmount += betsPlaced[1].amount;
          if (betsPlaced[2].active && !betsPlaced[2].cashedOut) lostAmount += betsPlaced[2].amount;
          // simulated bets also lose if not cashed
          simulatedBets.forEach(b => { if (!b.cashed) { /* they lose */ } });
          document.getElementById('gameStatus').innerHTML = `💥 CRASHED at ${crashVal.toFixed(2)}x`;
          // add crash to history
          addHistory(crashVal);
          // reset active bets after crash
          betsPlaced[1].active = false; betsPlaced[2].active = false;
          // reset buttons
          ['betBtn1','betBtn2'].forEach(btnId => {
            const btn = document.getElementById(btnId);
            btn.innerText = "BET";
            btn.classList.remove('cashout-btn');
            btn.classList.add('bet-btn');
          });
          // re-render sidebar & schedule next round
          renderSidebarActive();
          setTimeout(() => {
            resetAndCountdown();
          }, 3500);
          return;
        }
        // update UI multiplier + plane movement
        document.getElementById('currentMultiplier').innerHTML = currentMultiplier.toFixed(2) + 'x';
        // move plane along path (approx)
        const progress = Math.min(currentMultiplier / crashVal, 1);
        const maxX = 520, maxY = 190;
        let newX = 20 + progress * maxX;
        let newY = 210 - progress * maxY;
        const plane = document.getElementById('planeIcon');
        plane.style.left = newX + 'px';
        plane.style.top = newY + 'px';
        plane.style.transform = `rotate(${15 - progress * 35}deg)`;
        // update SVG path animation (optional dynamic)
        const path = document.getElementById('flightPath');
        const midX = 100 + progress * 300;
        const midY = 200 - progress * 100;
        path.setAttribute('d', `M 20 250 Q ${midX} ${midY} ${newX+15} ${newY+5} T 580 40`);
        // auto cashout check for panels
        if (betsPlaced[1].active && !betsPlaced[1].cashedOut && betsPlaced[1].autoCash > 0 && currentMultiplier >= betsPlaced[1].autoCash) {
          cashOut(1);
        }
        if (betsPlaced[2].active && !betsPlaced[2].cashedOut && betsPlaced[2].autoCash > 0 && currentMultiplier >= betsPlaced[2].autoCash) {
          cashOut(2);
        }
        // simulated players cashout logic (some random)
        simulatedBets.forEach(b => {
          if (!b.cashed && currentMultiplier >= 1.2 && Math.random() < 0.015) {
            b.cashed = true;
            b.winMulti = currentMultiplier;
            let winAmount = b.amount * currentMultiplier;
            addTopWin(b.name, winAmount, currentMultiplier);
            renderSidebarActive();
          }
        });
      }, 60);
    }
    
    // place bet (only allowed when game is not active and not countdown? Actually during countdown it's allowed)
    function placeBet(panelId) {
      if (gameActive) return;
      if (betsPlaced[panelId].active) { showToast("Bet already placed for this round"); return; }
      const amountInput = document.getElementById(`betAmount${panelId}`);
      let amount = parseFloat(amountInput.value);
      if (isNaN(amount) || amount <= 0) amount = 10;
      if (amount > balance) { showToast("Insufficient balance"); return; }
      // deduct balance
      balance -= amount;
      updateBalanceUI();
      betsPlaced[panelId].active = true;
      betsPlaced[panelId].amount = amount;
      betsPlaced[panelId].cashedOut = false;
      // auto cash already stored from UI
      // update button visual
      const btn = document.getElementById(`betBtn${panelId}`);
      btn.innerText = (gameActive ? "CASH OUT" : "BET PLACED");
      if (!gameActive) btn.innerText = "BET ✓";
      showToast(`✅ Bet ${amount} ETB on Panel ${panelId==1?'A':'B'}`);
      renderSidebarActive();
    }
    
    // Set auto cash value
    function setAutoCash(panelId, multiplier) {
      betsPlaced[panelId].autoCash = multiplier;
      const labelSpan = document.getElementById(`autoLabel${panelId}`);
      labelSpan.innerHTML = multiplier > 0 ? `⚡ AUTO: ${multiplier}x` : '⚡ AUTO: OFF';
      showToast(`Auto cashout set to ${multiplier > 0 ? multiplier+'x' : 'OFF'}`);
    }
    
    // quick amount
    function setQuickAmount(panelId, amount) {
      const input = document.getElementById(`betAmount${panelId}`);
      input.value = amount;
    }
    
    // helper toast
    function showToast(msg) {
      let toastDiv = document.createElement('div');
      toastDiv.className = 'fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-black/90 text-white text-sm px-5 py-2 rounded-full z-50 border border-yellow-500/50';
      toastDiv.innerText = msg;
      document.body.appendChild(toastDiv);
      setTimeout(() => toastDiv.remove(), 2000);
    }
    
    // EVENT LISTENERS
    document.getElementById('betBtn1').addEventListener('click', () => {
      if (gameActive && betsPlaced[1].active && !betsPlaced[1].cashedOut) cashOut(1);
      else if (!gameActive && !countdownActive) placeBet(1);
      else if (!gameActive && countdownActive) placeBet(1);
      else showToast("Wait for round to start");
    });
    document.getElementById('betBtn2').addEventListener('click', () => {
      if (gameActive && betsPlaced[2].active && !betsPlaced[2].cashedOut) cashOut(2);
      else if (!gameActive && !countdownActive) placeBet(2);
      else if (!gameActive && countdownActive) placeBet(2);
      else showToast("Wait for round to start");
    });
    // quick amount buttons
    document.querySelectorAll('.quickBetBtn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const panel = parseInt(btn.dataset.panel);
        const amount = parseInt(btn.dataset.amt);
        setQuickAmount(panel, amount);
      });
    });
    // auto cash buttons
    document.querySelectorAll('.autoSetBtn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const panel = parseInt(btn.dataset.panel);
        const autoVal = parseInt(btn.dataset.auto);
        setAutoCash(panel, autoVal);
      });
    });
    // Tab switching
    document.getElementById('tabAllBets').addEventListener('click', () => {
      activeTab = 'allbets';
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('border-yellow-400', 'text-yellow-400', 'border-b-2'));
      document.getElementById('tabAllBets').classList.add('border-yellow-400', 'text-yellow-400', 'border-b-2');
      document.getElementById('tabMyBets').classList.remove('text-yellow-400');
      document.getElementById('tabTop').classList.remove('text-yellow-400');
      renderSidebarActive();
    });
    document.getElementById('tabMyBets').addEventListener('click', () => {
      activeTab = 'mybets';
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('border-yellow-400', 'text-yellow-400', 'border-b-2'));
      document.getElementById('tabMyBets').classList.add('border-yellow-400', 'text-yellow-400', 'border-b-2');
      renderSidebarActive();
    });
    document.getElementById('tabTop').addEventListener('click', () => {
      activeTab = 'top';
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('border-yellow-400', 'text-yellow-400', 'border-b-2'));
      document.getElementById('tabTop').classList.add('border-yellow-400', 'text-yellow-400', 'border-b-2');
      renderSidebarActive();
    });
    // provably fair verify button
    document.getElementById('verifyBtn').addEventListener('click', () => {
      alert(`🔐 Provably Fair Details:\nServer Seed Hash: ${serverSeedHash}\nCurrent Client Seed: ${clientSeed}\nRound Nonce: ${currentRoundNonce}\nLast Crash: ${roundCrashPoint}\nFormula: hash(seed+nonce) => crash point between 1.01-50.`);
    });
    // set initial seeds
    document.getElementById('serverSeedHash').innerText = serverSeedHash;
    document.getElementById('clientSeedInput').addEventListener('change', () => {
      clientSeed = document.getElementById('clientSeedInput').value;
      showToast("Client seed updated (next round will use new seed)");
    });
    // start initial countdown
    resetAndCountdown();
    updateBalanceUI();
    renderSidebarActive();
    // preload some fake top wins for demonstration
    addTopWin("⭐ CRYPTO_ACE", 2450, 12.4);
    addTopWin("🔥 NEBULA", 1870, 9.2);
  </script>
</body>
</html>
