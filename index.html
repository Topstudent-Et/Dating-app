<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIATOR V26 - PRO EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        :root { --primary: #ff0044; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; height: calc(100vh - 75px); overflow-y: auto; padding: 15px; }
        .active-page { display: block; }
        .nav-bar { background: #0a0a0a; position: fixed; bottom: 0; width: 100%; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 1000; }
        .nav-item { color: #555; font-size: 10px; font-weight: 900; text-align: center; }
        .nav-item.active { color: var(--primary); }
        .aviator-screen { background: radial-gradient(circle at bottom left, #250505 0%, #000 100%); height: 210px; position: relative; border-radius: 25px; overflow: hidden; border: 1.5px solid #222; }
        #gamePath { stroke: var(--primary); stroke-width: 6; fill: none; filter: drop-shadow(0 0 10px var(--primary)); }
        .plane-jet { position: absolute; bottom: 20px; left: 20px; font-size: 40px; z-index: 10; transition: 0.1s linear; }
        .mode-switch { padding: 12px 25px; border-radius: 50px; font-weight: 900; font-size: 14px; text-transform: uppercase; transition: 0.3s; box-shadow: 0 0 15px rgba(255,0,0,0.2); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="no-scrollbar">

    <div id="adminPanel" class="fixed inset-0 bg-black z-[9999] hidden flex-col">
        <div class="p-5 glass flex justify-between items-center">
            <h2 class="text-red-600 font-black italic">V26 ADMIN DASH</h2>
            <button onclick="closeAdmin()" class="bg-red-600 text-white px-6 py-2 rounded-full font-black">EXIT</button>
        </div>
        <div id="admContent" class="p-4 flex-1 overflow-y-auto space-y-4 no-scrollbar"></div>
    </div>

    <header class="p-4 flex justify-between items-center glass sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div id="hPfp" class="w-10 h-10 rounded-xl bg-red-900/20 border border-white/10 overflow-hidden flex items-center justify-center"></div>
            <div>
                <h1 class="text-red-600 font-game italic text-lg leading-none">AVIATOR</h1>
                <p id="hUser" class="text-[9px] text-gray-500 font-black mt-1 uppercase">@Guest</p>
            </div>
        </div>
        <div class="flex flex-col items-end gap-2">
            <div class="bg-black border border-white/10 rounded-full px-4 py-1.5 flex items-center gap-2">
                <span id="hBal" class="font-black text-sm text-green-500">500.00</span>
                <span class="text-[9px] text-gray-500 font-bold uppercase">ETB</span>
            </div>
            <button id="modeBtn" onclick="switchMode()" class="mode-switch bg-red-600/10 text-red-600 border border-red-600">Demo Mode</button>
        </div>
    </header>

    <section id="home" class="page active-page no-scrollbar">
        <div id="hist" class="flex gap-2 mb-3 overflow-x-auto no-scrollbar"></div>

        <div class="aviator-screen flex items-center justify-center mb-5">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 210 Q 0 210 0 210" /></svg>
            <div id="mTxt" class="font-game text-7xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane-jet">✈️</div>
            <div id="gStatus" class="absolute top-4 glass px-5 py-1 rounded-full text-[10px] font-black text-gray-400 uppercase tracking-widest">Wait...</div>
        </div>

        <div class="glass p-6 rounded-[35px] mb-5">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <span class="text-[10px] text-gray-500 font-black uppercase italic mb-1 block">Stake</span>
                    <input id="bInp" type="number" value="10" class="bg-transparent text-3xl font-black outline-none w-28 text-white">
                </div>
                <div class="flex flex-wrap gap-2 justify-end">
                    <button onclick="setB(50)" class="bg-white/5 border border-white/10 px-4 py-2 rounded-xl text-xs font-black">50</button>
                    <button onclick="setB(100)" class="bg-white/5 border border-white/10 px-4 py-2 rounded-xl text-xs font-black">100</button>
                    <button onclick="setB(200)" class="bg-white/5 border border-white/10 px-4 py-2 rounded-xl text-xs font-black">200</button>
                </div>
            </div>
            <button id="bBtn" onclick="handleBet()" class="w-full bg-red-600 py-6 rounded-[25px] text-3xl font-black italic shadow-2xl active:scale-95 transition-all">BET</button>
        </div>

        <div class="glass p-5 rounded-[30px] flex justify-between items-center">
            <span class="text-[11px] font-black text-gray-500 uppercase italic">Auto Cashout:</span>
            <div class="flex gap-2">
                <button onclick="setA(2.0)" class="bg-white/5 px-4 py-1.5 rounded-lg text-[10px] font-black border border-white/10">2x</button>
                <button onclick="setA(5.0)" class="bg-white/5 px-4 py-1.5 rounded-lg text-[10px] font-black border border-white/10">5x</button>
                <input id="autoOut" type="number" step="0.1" placeholder="OFF" class="bg-black w-16 text-center font-black rounded-lg border border-red-600/30 text-sm">
            </div>
        </div>
    </section>

    <section id="deposit" class="page no-scrollbar">
        <div class="glass p-6 rounded-[35px] mb-6">
            <p class="text-[11px] text-yellow-500 font-black uppercase mb-4 italic">Bank Info (Tap to Copy)</p>
            <div onclick="copyT('1000179571815')" class="flex justify-between items-center bg-black p-5 rounded-2xl mb-4 border border-white/5">
                <span class="font-black text-lg tracking-widest">1000179571815</span>
                <i class="fa-solid fa-copy text-yellow-600"></i>
            </div>
            <div onclick="copyT('0906067696')" class="flex justify-between items-center bg-black p-5 rounded-2xl border border-white/5">
                <span class="font-black text-lg tracking-widest">0906067696</span>
                <i class="fa-solid fa-copy text-blue-600"></i>
            </div>
        </div>

        <div class="glass p-8 rounded-[45px] text-center border-dashed border-2 border-gray-800">
            <p class="text-[11px] font-black text-gray-400 mb-6 uppercase italic tracking-tighter">የከፈሉበትን ደረሰኝ እዚህ ይላኩ</p>
            <input type="file" id="ssInp" class="hidden" accept="image/*">
            <button onclick="document.getElementById('ssInp').click()" class="w-full bg-white/5 py-5 rounded-2xl text-[12px] font-black mb-5 border border-white/10 uppercase"><i class="fa-solid fa-image mr-2 text-red-600"></i> SELECT SCREENSHOT</button>
            <div id="prevBox" class="hidden mb-6 p-2 bg-white/5 rounded-3xl"><img id="ssPrev" class="rounded-2xl max-h-60 mx-auto border border-white/10 shadow-2xl"></div>
            <button onclick="submitSS()" id="subBtn" class="w-full bg-red-600 py-5 rounded-3xl font-black text-sm uppercase shadow-2xl shadow-red-900/40">SUBMIT RECEIPT</button>
        </div>
    </section>

    <section id="leaderboard" class="page no-scrollbar">
        <h2 class="text-center text-xl font-black italic text-red-600 mb-6 uppercase tracking-widest">Top 1000 Elite</h2>
        <div id="lList" class="space-y-3 pb-20"></div>
    </section>

    <section id="profile" class="page no-scrollbar">
        <div class="flex flex-col items-center mb-10 mt-5">
            <div id="pfpBig" class="w-24 h-24 rounded-[40px] bg-red-950/20 border-2 border-red-600/30 overflow-hidden flex items-center justify-center mb-4"></div>
            <h2 id="userBig" class="text-3xl font-black italic uppercase">@User</h2>
            <p id="refShow" class="text-[9px] text-gray-600 mt-2 font-bold tracking-widest"></p>
        </div>
        <div onclick="copyT(document.getElementById('refShow').innerText)" class="glass p-6 rounded-[35px] text-center border border-blue-900/20 active:scale-95 transition-all">
            <i class="fa-solid fa-share-nodes text-blue-500 text-2xl mb-3"></i>
            <h3 class="text-xs font-black uppercase mb-1 italic text-blue-400">Share & Earn 10%</h3>
            <p class="text-[9px] text-gray-500 font-bold uppercase italic">Tap to copy your referral link</p>
        </div>
        <button onclick="checkAdm()" class="w-full py-8 text-[9px] font-black text-gray-900 uppercase tracking-[10px]">Admin</button>
    </section>

    <nav class="nav-bar">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-rocket text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-2xl mb-1"></i><br>WALLET</div>
        <div onclick="showP('leaderboard')" id="n-leaderboard" class="nav-item"><i class="fa-solid fa-crown text-2xl mb-1"></i><br>TOP</div>
        <div onclick="showP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user-gear text-2xl mb-1"></i><br>ME</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADM_UNAME = "Dawit_Fikadu21";
        let realBal = parseFloat(localStorage.getItem('v26_real')) || 0;
        let demoBal = 500.00;
        let isDemo = true;
        let flying = false; let mult = 1.0; let myBet = { active: false, amt: 0 };
        let history = ["2.50x", "1.10x", "5.40x", "1.00x", "12.3x"];
        let user = { uname: tg.initDataUnsafe?.user?.username || "Dai_Dev", photo: tg.initDataUnsafe?.user?.photo_url || null };

        function init() {
            document.getElementById('hUser').innerText = "@" + user.uname;
            document.getElementById('userBig').innerText = "@" + user.uname;
            document.getElementById('refShow').innerText = "https://t.me/world_all_gamesbot?start=ref_" + user.uname;
            const pfp = user.photo ? `<img src="${user.photo}" class="w-full h-full object-cover">` : `<span class="text-3xl font-black text-red-500">${user.uname[0]}</span>`;
            document.getElementById('hPfp').innerHTML = pfp;
            document.getElementById('pfpBig').innerHTML = pfp;
            
            document.getElementById('ssInp').onchange = (e) => {
                const r = new FileReader();
                r.onload = () => { document.getElementById('ssPrev').src = r.result; document.getElementById('prevBox').classList.remove('hidden'); };
                r.readAsDataURL(e.target.files[0]);
            };
            
            updateDisplay(); renderLeaders(); renderHist(); loop();
        }

        // --- 40% PROFIT & GAME ---
        function loop() {
            if(flying) return;
            let timer = 6;
            let t = setInterval(() => {
                document.getElementById('gStatus').innerText = `NEXT FLIGHT IN ${timer}S`;
                if(timer-- <= 0) { clearInterval(t); launch(); }
            }, 1000);
        }

        function launch() {
            flying = true; mult = 1.0;
            // 40% PROFIT LOGIC: ካዚኖው እንዳይከስር ቁጥሩን መቆጣጠር
            let crash = 1.01 + (Math.random() * 8.0);
            if(myBet.active && myBet.amt >= 500) crash = 1.05 + (Math.random() * 0.8);

            let auto = parseFloat(document.getElementById('autoOut').value);
            let eng = setInterval(() => {
                mult += 0.05;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 17, y = mult * 13;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 210 Q ${x/2} ${210-y} ${x+12} ${210-y-12}`);

                if(myBet.active && auto && mult >= auto) cashOut();
                if(mult >= crash) { clearInterval(eng); explode(); }
            }, 90);
        }

        function explode() {
            flying = false; document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "#ff0044";
            history.unshift(mult.toFixed(2) + "x"); if(history.length > 8) history.pop();
            renderHist(); myBet.active = false; resetB();
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 210 Q 0 210 0 210');
                document.getElementById('mTxt').style.color = "white";
                loop();
            }, 3000);
        }

        function handleBet() {
            if(flying) return myBet.active ? cashOut() : tg.showAlert("Wait for next round!");
            let a = parseInt(document.getElementById('bInp').value);
            let cur = isDemo ? demoBal : realBal;
            if(a > cur || a <= 0) return tg.showAlert("Insufficient Funds!");

            if(isDemo) demoBal -= a; else { realBal -= a; localStorage.setItem('v26_real', realBal); }
            myBet = { active: true, amt: a };
            updateDisplay();
            document.getElementById('bBtn').innerText = "CASH OUT";
            document.getElementById('bBtn').className = "w-full bg-orange-600 py-6 rounded-[25px] text-3xl font-black italic shadow-2xl";
        }

        function cashOut() {
            if(!myBet.active || !flying) return;
            let win = myBet.amt * mult;
            if(isDemo) demoBal += win; else { realBal += win; localStorage.setItem('v26_real', realBal); }
            myBet.active = false; resetB(); updateDisplay();
            tg.showAlert(`✅ WON: ${win.toFixed(2)} ETB`);
        }

        function switchMode() {
            isDemo = !isDemo;
            const btn = document.getElementById('modeBtn');
            btn.innerText = isDemo ? "Demo Mode" : "Real Mode";
            btn.className = isDemo ? "mode-switch bg-red-600/10 text-red-600 border border-red-600" : "mode-switch bg-green-600 text-black border border-green-600 shadow-[0_0_20px_rgba(34,197,94,0.4)]";
            updateDisplay();
        }

        // --- CORE FUNCTIONS ---
        function setB(n) { document.getElementById('bInp').value = n; }
        function setA(n) { document.getElementById('autoOut').value = n; }
        function resetB() {
            document.getElementById('bBtn').innerText = "BET";
            document.getElementById('bBtn').className = "w-full bg-red-600 py-6 rounded-[25px] text-3xl font-black italic shadow-2xl";
        }
        function updateDisplay() {
            document.getElementById('hBal').innerText = (isDemo ? demoBal : realBal).toFixed(2);
            document.getElementById('hBal').style.color = isDemo ? "#ef4444" : "#22c55e";
        }
        function renderHist() {
            document.getElementById('hist').innerHTML = history.map(h => `<span class="bg-white/5 border border-white/10 px-4 py-1.5 rounded-xl text-[10px] font-black italic">${h}</span>`).join('');
        }
        function renderLeaders() {
            const l = document.getElementById('lList'); l.innerHTML = "";
            let data = "";
            for(let i=1; i<=1000; i++) {
                data += `<div class="glass p-4 rounded-2xl flex justify-between items-center"><div class="flex items-center gap-3"><span class="text-xs text-gray-600 font-black italic">#${i}</span><span class="text-sm font-bold uppercase">User_${i*7}</span></div><span class="text-green-500 font-black text-sm">${(Math.random()*20000+500).toFixed(0)} <span class="text-[8px] text-gray-500">ETB</span></span></div>`;
                if(i % 100 === 0) { l.innerHTML += data; data = ""; }
            }
        }

        // --- PHOTO & ADMIN ---
        function submitSS() {
            const f = document.getElementById('ssInp').files[0];
            if(!f) return tg.showAlert("Please select a screenshot first!");
            const r = new FileReader();
            r.onload = () => {
                let db = JSON.parse(localStorage.getItem('v26_db')) || [];
                db.push({ user: user.uname, img: r.result, time: new Date().toLocaleString() });
                localStorage.setItem('v26_db', JSON.stringify(db));
                tg.showAlert("✅ Success! Sent to admin for verification.");
                document.getElementById('prevBox').classList.add('hidden');
                document.getElementById('ssInp').value = "";
            };
            r.readAsDataURL(f);
        }

        function checkAdm() {
            if(user.uname === ADM_UNAME && prompt("PIN:") === "215221") {
                document.getElementById('adminPanel').style.display = 'flex'; loadAdm();
            }
        }
        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
        function loadAdm() {
            const db = JSON.parse(localStorage.getItem('v26_db')) || [];
            document.getElementById('admContent').innerHTML = db.map((it, i) => `
                <div class="glass p-5 rounded-3xl">
                    <p class="text-blue-500 text-[10px] font-black uppercase mb-3">@${it.user} | ${it.time}</p>
                    <img src="${it.img}" class="w-full rounded-2xl mb-4 border border-gray-800">
                    <div class="flex gap-2">
                        <button onclick="approve(${i})" class="flex-1 bg-green-600 py-3 rounded-xl font-black text-[11px]">APPROVE ✅</button>
                        <button onclick="reject(${i})" class="flex-1 bg-red-600 py-3 rounded-xl font-black text-[11px]">REJECT ❌</button>
                    </div>
                </div>`).join('') || "No requests found.";
        }
        function approve(i) {
            let db = JSON.parse(localStorage.getItem('v26_db'));
            let amt = prompt("Amount for @" + db[i].user + "?");
            if(amt && db[i].user === user.uname) { realBal += parseFloat(amt); localStorage.setItem('v25_real', realBal); updateDisplay(); }
            db.splice(i, 1); localStorage.setItem('v26_db', JSON.stringify(db)); loadAdm();
        }
        function reject(i) {
            let db = JSON.parse(localStorage.getItem('v26_db'));
            db.splice(i, 1); localStorage.setItem('v26_db', JSON.stringify(db)); loadAdm();
        }

        function copyT(t) {
            const el = document.createElement('textarea'); el.value = t; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert("✅ Copied!");
        }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-' + id).classList.add('active');
        }

        init();
    </script>
</body>
</html>
