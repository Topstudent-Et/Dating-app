<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>World Dating · Light Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        /* LIGHT THEME (default) */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --border: #e2e8f0;
            --accent: #ff477e;
            --accent-hover: #ff6b9d;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --input-bg: #ffffff;
        }
        body {
            background: var(--bg-body);
            color: var(--text-primary);
        }
        /* Layout */
        .app-container {
            max-width: 550px;
            margin: 0 auto;
            background: var(--bg-body);
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
        }
        /* Header */
        .header {
            background: var(--bg-card);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff477e, #ff9f4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 550px;
            margin: 0 auto;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 20px 24px;
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ff477e;
        }
        .tab-content {
            display: none;
            padding: 20px 16px;
            animation: fade 0.2s;
        }
        .tab-content.active-tab {
            display: block;
        }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        /* Cards & Forms */
        .glass-card {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .btn-primary {
            background: linear-gradient(105deg, #ff477e, #ff8c42);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #ff477e;
            color: #ff477e;
            padding: 8px 16px;
            border-radius: 60px;
            cursor: pointer;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            margin-bottom: 14px;
            outline: none;
        }
        .photo-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 8px auto;
            display: block;
            border: 2px solid #ff477e;
        }
        .country-row {
            display: flex;
            gap: 10px;
        }
        .country-row select {
            width: 130px;
            margin-bottom: 0;
        }
        .post-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .post-media {
            margin: 12px 0;
            border-radius: 20px;
            overflow: hidden;
        }
        .post-media img, .post-media video {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
        }
        .match-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar-sm {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<script>
    // ---------- GLOBAL STATE ----------
    let currentUser = null;
    let users = [];
    let posts = [];
    let matches = [];

    // Load/Save localStorage
    function loadData() {
        const u = localStorage.getItem("wd_users");
        if(u) users = JSON.parse(u);
        const p = localStorage.getItem("wd_posts");
        if(p) posts = JSON.parse(p);
        if(users.length === 0) {
            users.push({ id: 1, name: "Emma", phone: "+251911111111", password: "123", gender: "Female", bio: "Adventure lover", interests: "Travel, Music", photo: "https://randomuser.me/api/portraits/women/1.jpg", countryCode: "+251" });
            users.push({ id: 2, name: "Liam", phone: "+1 555123456", password: "123", gender: "Male", bio: "Coffee geek", interests: "Coffee, Books", photo: "https://randomuser.me/api/portraits/men/2.jpg", countryCode: "+1" });
        }
        if(posts.length === 0) {
            posts.push({ id: 101, userId: 1, mediaType: "image", mediaUrl: "https://picsum.photos/id/29/400/300", caption: "Sunset vibes 🌅", likes: 12, timestamp: Date.now() });
        }
        saveAll();
    }
    function saveAll() {
        localStorage.setItem("wd_users", JSON.stringify(users));
        localStorage.setItem("wd_posts", JSON.stringify(posts));
    }

    // Registration
    document.getElementById("completeRegisterBtn").addEventListener("click", () => {
        const name = document.getElementById("regName").value.trim();
        const countryCode = document.getElementById("countryCodeSelect").value;
        const phoneRaw = document.getElementById("regPhone").value.trim();
        const fullPhone = countryCode + phoneRaw;
        const gender = document.getElementById("regGender").value;
        const password = document.getElementById("regPassword").value;
        const bio = document.getElementById("regBio").value;
        const interests = document.getElementById("regInterests").value;
        const photoFile = document.getElementById("regPhotoInput").files[0];
        if(!name || !phoneRaw || !password) { alert("Fill required fields"); return; }
        if(password.length < 6) { alert("Password min 6 chars"); return; }
        if(users.find(u => u.phone === fullPhone)) { alert("Phone already registered"); return; }
        
        const processReg = (photoBase64) => {
            const newUser = {
                id: Date.now(),
                name: name,
                phone: fullPhone,
                password: password,
                gender: gender,
                bio: bio || "New to World Dating!",
                interests: interests || "Exploring",
                photo: photoBase64 || "https://randomuser.me/api/portraits/women/68.jpg",
                countryCode: countryCode
            };
            users.push(newUser);
            saveAll();
            currentUser = newUser;
            localStorage.setItem("wd_current", JSON.stringify(currentUser));
            showMainApp();
        };
        if(photoFile) {
            const reader = new FileReader();
            reader.onload = (e) => processReg(e.target.result);
            reader.readAsDataURL(photoFile);
        } else { processReg(null); }
    });

    function showMainApp() {
        document.getElementById("registerModal").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
        renderProfile();
        renderFeed();
        renderMatch();
    }

    function renderProfile() {
        if(!currentUser) return;
        document.getElementById("profilePhotoImg").src = currentUser.photo;
        document.getElementById("profileName").innerText = currentUser.name;
        document.getElementById("profilePhone").innerHTML = `<i class="fas fa-phone"></i> ${currentUser.phone}`;
        document.getElementById("profileBioText").innerHTML = `<i class="fas fa-comment"></i> ${currentUser.bio}`;
        document.getElementById("profileInterestsText").innerHTML = `<i class="fas fa-tag"></i> ${currentUser.interests}`;
    }

    function renderFeed() {
        const feedDiv = document.getElementById("postsFeed");
        if(!feedDiv) return;
        const sorted = [...posts].reverse();
        feedDiv.innerHTML = sorted.map(post => {
            const author = users.find(u => u.id === post.userId);
            return `
                <div class="post-card">
                    <div class="flex-between"><div><strong>${author?.name || "User"}</strong><span style="font-size:11px; margin-left:8px;">${new Date(post.timestamp).toLocaleString()}</span></div></div>
                    <p>${post.caption}</p>
                    <div class="post-media">${post.mediaType === "image" ? `<img src="${post.mediaUrl}">` : (post.mediaType === "video" ? `<video controls src="${post.mediaUrl}"></video>` : "")}</div>
                    <div class="flex-between"><span><i class="far fa-heart"></i> ${post.likes || 0}</span><span><i class="far fa-comment"></i> Comment</span></div>
                </div>
            `;
        }).join('');
    }

    // Match system (simple swipe)
    function renderMatch() {
        const others = users.filter(u => u.id !== currentUser?.id && !matches.includes(u.id));
        const container = document.getElementById("matchContainer");
        if(others.length === 0) { container.innerHTML = "<div class='glass-card'>No more profiles. Check later!</div>"; return; }
        const p = others[0];
        container.innerHTML = `
            <div class="glass-card" style="text-align:center;">
                <img src="${p.photo}" style="width:120px;height:120px;border-radius:50%;object-fit:cover;">
                <h3>${p.name}, ${p.gender}</h3>
                <p>${p.bio}</p>
                <div style="display:flex; gap:16px; margin-top:16px;">
                    <button id="passBtn" class="btn-outline">❌ Pass</button>
                    <button id="likeBtn" class="btn-primary">❤️ Like</button>
                </div>
            </div>
        `;
        document.getElementById("passBtn")?.addEventListener("click", () => renderMatch());
        document.getElementById("likeBtn")?.addEventListener("click", () => {
            if(!matches.includes(p.id)) matches.push(p.id);
            alert(`💕 You liked ${p.name}! If mutual, it's a match.`);
            renderMatch();
        });
    }

    // Post creation
    let pendingMedia = null, pendingMediaType = null;
    document.getElementById("uploadPhotoPost")?.addEventListener("click", () => document.getElementById("postPhotoFile").click());
    document.getElementById("uploadVideoPost")?.addEventListener("click", () => document.getElementById("postVideoFile").click());
    document.getElementById("postPhotoFile")?.addEventListener("change", (e) => {
        const f = e.target.files[0];
        if(f) { const r = new FileReader(); r.onload = ev => { pendingMedia = ev.target.result; pendingMediaType = "image"; document.getElementById("postMediaPreview").innerHTML = `<img src="${pendingMedia}" style="max-height:150px;border-radius:20px;">`; }; r.readAsDataURL(f); }
    });
    document.getElementById("postVideoFile")?.addEventListener("change", (e) => {
        const f = e.target.files[0];
        if(f) { const r = new FileReader(); r.onload = ev => { pendingMedia = ev.target.result; pendingMediaType = "video"; document.getElementById("postMediaPreview").innerHTML = `<video controls src="${pendingMedia}" style="max-height:150px;border-radius:20px;"></video>`; }; r.readAsDataURL(f); }
    });
    document.getElementById("publishPostBtn")?.addEventListener("click", () => {
        const caption = document.getElementById("newPostCaption").value;
        if(!caption && !pendingMedia) { alert("Write something or add media"); return; }
        const newPost = { id: Date.now(), userId: currentUser.id, mediaType: pendingMediaType, mediaUrl: pendingMedia, caption: caption || "Shared a moment", likes: 0, timestamp: Date.now() };
        posts.push(newPost);
        saveAll();
        renderFeed();
        document.getElementById("newPostCaption").value = "";
        pendingMedia = null; pendingMediaType = null;
        document.getElementById("postMediaPreview").innerHTML = "";
        alert("Post published!");
    });

    // Edit profile
    document.getElementById("editProfileBtn")?.addEventListener("click", () => {
        const newBio = prompt("Edit Bio:", currentUser.bio);
        if(newBio !== null) currentUser.bio = newBio;
        const newInterests = prompt("Edit Interests:", currentUser.interests);
        if(newInterests !== null) currentUser.interests = newInterests;
        saveAll();
        renderProfile();
    });

    // Photo upload registration preview
    document.getElementById("uploadPhotoRegBtn")?.addEventListener("click", () => document.getElementById("regPhotoInput").click());
    document.getElementById("regPhotoInput")?.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if(file) { const reader = new FileReader(); reader.onload = (ev) => { document.getElementById("regPhotoPreview").src = ev.target.result; }; reader.readAsDataURL(file); }
    });

    // Tab switching
    document.querySelectorAll(".nav-item").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            const tab = btn.getAttribute("data-tab");
            document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active-tab"));
            if(tab === "home") document.getElementById("homeTab").classList.add("active-tab");
            if(tab === "profile") document.getElementById("profileTab").classList.add("active-tab");
            if(tab === "post") document.getElementById("postTab").classList.add("active-tab");
            if(tab === "match") { document.getElementById("matchTab").classList.add("active-tab"); renderMatch(); }
        });
    });

    // Restore session
    const savedUser = localStorage.getItem("wd_current");
    loadData();
    if(savedUser) {
        currentUser = JSON.parse(savedUser);
        if(users.find(u => u.id === currentUser.id)) showMainApp();
        else document.getElementById("registerModal").style.display = "block";
    } else {
        document.getElementById("registerModal").style.display = "block";
    }
</script>
</body>
</html>
