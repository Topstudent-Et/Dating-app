<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WORLD GAMES - Aviator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #0f1422 100%);
            color: #fff;
            min-height: 100vh;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: linear-gradient(180deg, #0a0e1a 0%, #0c1020 100%);
            min-height: 100vh;
            position: relative;
            padding-bottom: 70px;
        }

        /* Header */
        .app-header {
            background: linear-gradient(135deg, #0a0e1a 0%, #0b0f1a 100%);
            padding: 12px 16px;
            border-bottom: 2px solid #ff0000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .balance-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .balance-display {
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #ff0000;
        }

        .balance-display span {
            color: #ff0000;
            font-weight: bold;
        }

        /* Aviator Card */
        .aviator-card {
            background: rgba(17, 25, 40, 0.95);
            border-radius: 20px;
            margin: 12px;
            overflow: hidden;
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }

        /* Recent Crashes */
        .recent-crashes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(255,0,0,0.3);
        }

        .crash-bubble {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff0000;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #ff6666;
        }

        /* Fun Mode Badge */
        .fun-mode {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0,0,0,0.3);
        }

        .fun-badge {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .best-multiplier {
            font-size: 12px;
            color: #ff6666;
        }

        /* Graph Container - Red Border */
        .graph-container {
            position: relative;
            background: #000000;
            margin: 16px;
            border: 4px solid #ff0000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255,0,0,0.4), inset 0 0 10px rgba(255,0,0,0.2);
        }

        canvas {
            width: 100%;
            height: 280px;
            display: block;
            background: #000;
        }

        .multiplier-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .multiplier-value {
            font-size: 56px;
            font-weight: 800;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255,0,0,0.8);
            font-family: monospace;
            letter-spacing: 2px;
        }

        .plane-icon {
            position: absolute;
            font-size: 34px;
            pointer-events: none;
            z-index: 15;
            filter: drop-shadow(0 0 5px #ff0000);
            transition: none;
            color: #ff0000;
        }

        /* Bet Controls */
        .bet-section {
            padding: 16px;
        }

        .bet-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            border-radius: 60px;
            padding: 8px 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,0,0,0.3);
        }

        .bet-label {
            font-size: 14px;
            color: #aaa;
        }

        .bet-amount {
            font-size: 28px;
            font-weight: bold;
            color: #ff0000;
        }

        .bet-controls-group {
            display: flex;
            gap: 8px;
        }

        .bet-btn {
            background: rgba(255,0,0,0.2);
            border: 1px solid #ff0000;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: bold;
            color: #ff0000;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bet-btn:active {
            transform: scale(0.95);
            background: rgba(255,0,0,0.4);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-start {
            flex: 1;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }

        .btn-cashout {
            flex: 1;
            background: linear-gradient(135deg, #ff4757, #ff0000);
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-start:active, .btn-cashout:active {
            transform: scale(0.97);
        }

        /* Result Message */
        .result-area {
            text-align: center;
            padding: 12px;
            margin: 0 16px 16px 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Trail Effect */
        .trail-point {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #ff0000;
            border-radius: 50%;
            pointer-events: none;
            z-index: 8;
            box-shadow: 0 0 8px #ff0000;
            animation: trailFade 0.4s ease-out forwards;
        }

        @keyframes trailFade {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.3); }
        }

        @keyframes explodeAnim {
            0% { transform: scale(0.3); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            border-top: 2px solid #ff0000;
            padding: 8px 0;
            z-index: 99;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            padding: 8px;
        }

        .nav-item.active {
            color: #ff0000;
        }

        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Header -->
    <div class="app-header">
        <div class="balance-top">
            <div class="logo">✈️ WORLD GAMES</div>
            <div class="balance-display">
                💰 <span id="balance">50,000.00</span> ETB
            </div>
        </div>
    </div>

    <!-- Aviator Game -->
    <div id="gamesPage">
        <div class="aviator-card">
            <!-- Recent Crashes -->
            <div class="recent-crashes" id="recentCrashes">
                <span class="crash-bubble">1.31x</span>
                <span class="crash-bubble">1.98x</span>
                <span class="crash-bubble">2.29x</span>
                <span class="crash-bubble">1.50x</span>
                <span class="crash-bubble">16.69x</span>
                <span class="crash-bubble">1.21x</span>
                <span class="crash-bubble">1.42x</span>
            </div>

            <!-- Fun Mode -->
            <div class="fun-mode">
                <div class="fun-badge">🎮 FUN MODE</div>
                <div class="best-multiplier">🏆 BEST: <span id="bestMultiplier">37.60</span>x</div>
            </div>

            <!-- Graph with Red Border -->
            <div class="graph-container" id="graphContainer">
                <canvas id="aviatorCanvas" width="500" height="280"></canvas>
                <div class="multiplier-center">
                    <div class="multiplier-value" id="multiplierDisplay">1.00x</div>
                </div>
                <div id="planeIcon" class="plane-icon">🛩️</div>
            </div>

            <!-- Bet Controls -->
            <div class="bet-section">
                <div class="bet-row">
                    <span class="bet-label">BET AMOUNT</span>
                    <div class="bet-controls-group">
                        <button class="bet-btn" id="decBet">−</button>
                        <span class="bet-amount" id="betAmount">4.00</span>
                        <button class="bet-btn" id="incBet">+</button>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn-start" id="startBtn">🚀 START</button>
                    <button class="btn-cashout" id="cashOutBtn">💰 CASH OUT</button>
                </div>
            </div>
            <div id="resultMessage" class="result-area"></div>
        </div>
    </div>

    <!-- Other Pages (Placeholder) -->
    <div id="invitePage" style="display: none;">Invite Page</div>
    <div id="profilePage" style="display: none;">Profile Page</div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" data-page="games">
            <span class="nav-icon">🎮</span>
            <span>Games</span>
        </button>
        <button class="nav-item" data-page="invite">
            <span class="nav-icon">👥</span>
            <span>Invite</span>
        </button>
        <button class="nav-item" data-page="profile">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </button>
    </div>
</div>

<script>
    // ============ GAME STATE ============
    let balance = 50000.00;
    let multiplier = 1.00;
    let playing = false;
    let currentBet = 4.00;
    let intervalId = null;
    let crashPoint = null;
    let bestMultiplier = 37.60;
    
    let recentCrashes = [1.31, 1.98, 2.29, 1.50, 16.69, 1.21, 1.42];
    let trailPoints = [];
    
    // ============ DOM Elements ============
    const canvas = document.getElementById('aviatorCanvas');
    let ctx = canvas.getContext('2d');
    let planeX = 0, planeY = 0;
    
    // ============ Helper Functions ============
    function updateBalanceUI() {
        document.getElementById('balance').innerText = balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    
    function updateRecentCrashes() {
        const container = document.getElementById('recentCrashes');
        container.innerHTML = recentCrashes.slice(0, 10).map(c => `<span class="crash-bubble">${c.toFixed(2)}x</span>`).join('');
    }
    
    function showMessage(msg, isError = true) {
        const div = document.getElementById('resultMessage');
        div.innerHTML = msg;
        div.style.background = isError ? 'rgba(255,0,0,0.2)' : 'rgba(0,255,100,0.2)';
        div.style.border = isError ? '1px solid #ff0000' : '1px solid #00ff66';
        setTimeout(() => { if(div.innerHTML === msg) div.innerHTML = ''; }, 3000);
    }
    
    // ============ CANVAS GRAPH ============
    function resizeCanvas() {
        const container = document.getElementById('graphContainer');
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        drawGraph();
    }
    window.addEventListener('resize', resizeCanvas);
    
    function drawGraph() {
        if(!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw red curve line
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        for(let i = 0; i <= 100; i++) {
            let t = i / 100;
            let x = t * canvas.width;
            let y = canvas.height - (Math.pow(t, 0.55) * canvas.height * 0.85);
            if(i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        
        // Draw red grid lines
        ctx.strokeStyle = '#ff3333';
        ctx.lineWidth = 0.5;
        for(let i = 1; i <= 5; i++) {
            let y = canvas.height - (i / 5 * canvas.height);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
        
        // Draw current multiplier vertical line
        if(playing && multiplier > 1) {
            let t = Math.min(0.95, (multiplier - 1) / 12);
            let x = t * canvas.width;
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
    }
    
    // ============ TRAIL EFFECT ============
    function addTrail(x, y) {
        const trail = document.createElement('div');
        trail.className = 'trail-point';
        trail.style.left = (x - 4) + 'px';
        trail.style.top = (y - 4) + 'px';
        document.getElementById('graphContainer').appendChild(trail);
        setTimeout(() => trail.remove(), 400);
    }
    
    // ============ PLANE POSITION ============
    function updatePlanePosition(mult) {
        let t = Math.min(0.95, (mult - 1) / 12);
        let x = t * canvas.width;
        let y = canvas.height - (Math.pow(t, 0.55) * canvas.height * 0.85);
        planeX = x;
        planeY = y;
        
        const plane = document.getElementById('planeIcon');
        plane.style.left = (x - 18) + 'px';
        plane.style.top = (y - 24) + 'px';
        plane.style.display = 'block';
        
        if(mult > 1.1) {
            addTrail(x - 5, y - 4);
        }
    }
    
    // ============ EXPLOSION EFFECT ============
    function createExplosion(x, y) {
        const explosion = document.createElement('div');
        explosion.style.cssText = `position: absolute; font-size: 50px; pointer-events: none; left: ${x - 35}px; top: ${y - 35}px; z-index: 20; animation: explodeAnim 0.5s ease-out forwards;`;
        explosion.innerHTML = '💥💥';
        document.getElementById('graphContainer').appendChild(explosion);
        setTimeout(() => explosion.remove(), 500);
    }
    
    // ============ GAME LOGIC ============
    function startGame() {
        if(playing) {
            showMessage("Game already in progress!", true);
            return;
        }
        
        if(currentBet > balance) {
            showMessage("Insufficient balance!", true);
            return;
        }
        
        if(currentBet <= 0) {
            showMessage("Enter valid bet amount!", true);
            return;
        }
        
        // Deduct bet
        balance -= currentBet;
        updateBalanceUI();
        
        // Reset game state
        multiplier = 1.00;
        playing = true;
        document.getElementById('multiplierDisplay').innerText = '1.00x';
        
        // Random crash point between 1.1x and 6x
        crashPoint = Math.random() * 5 + 1.1;
        
        // Reset plane position
        const plane = document.getElementById('planeIcon');
        plane.style.display = 'block';
        plane.style.left = '0px';
        plane.style.top = (canvas.height - 25) + 'px';
        
        // Clear any existing interval
        if(intervalId) clearInterval(intervalId);
        
        // Start multiplier interval
        intervalId = setInterval(() => {
            if(!playing) return;
            
            multiplier += 0.035;
            document.getElementById('multiplierDisplay').innerText = multiplier.toFixed(2) + 'x';
            updatePlanePosition(multiplier);
            drawGraph();
            
            // Check for crash
            if(multiplier >= crashPoint) {
                clearInterval(intervalId);
                playing = false;
                
                // Explosion effect
                createExplosion(planeX, planeY);
                document.getElementById('planeIcon').style.display = 'none';
                
                // Show crash message
                showMessage(`💥 CRASHED at ${crashPoint.toFixed(2)}x! Lost ${currentBet.toFixed(2)} ETB`, true);
                
                // Update recent crashes
                recentCrashes.unshift(crashPoint);
                if(recentCrashes.length > 10) recentCrashes.pop();
                updateRecentCrashes();
            }
        }, 45);
    }
    
    function cashOut() {
        if(!playing) {
            showMessage("No active flight!", true);
            return;
        }
        
        clearInterval(intervalId);
        playing = false;
        
        const winAmount = currentBet * multiplier;
        balance += winAmount;
        updateBalanceUI();
        
        // Update best multiplier
        if(multiplier > bestMultiplier) {
            bestMultiplier = multiplier;
            document.getElementById('bestMultiplier').innerText = bestMultiplier.toFixed(2);
        }
        
        showMessage(`✅ CASHED OUT! Won ${winAmount.toFixed(2)} ETB at ${multiplier.toFixed(2)}x`, false);
        
        document.getElementById('planeIcon').style.display = 'none';
        
        // Update recent crashes with win
        recentCrashes.unshift(multiplier);
        if(recentCrashes.length > 10) recentCrashes.pop();
        updateRecentCrashes();
    }
    
    // ============ BET CONTROLS ============
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if(newBet >= 1 && newBet <= 1000) {
            currentBet = newBet;
            document.getElementById('betAmount').innerText = currentBet.toFixed(2);
        }
    }
    
    // ============ EVENT LISTENERS ============
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('cashOutBtn').addEventListener('click', cashOut);
    document.getElementById('decBet').addEventListener('click', () => changeBet(-1));
    document.getElementById('incBet').addEventListener('click', () => changeBet(1));
    
    // ============ NAVIGATION ============
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
        item.addEventListener('click', () => {
            navItems.forEach(nav => nav.classList.remove('active'));
            item.classList.add('active');
            // For demo, only games page is implemented
            if(item.dataset.page !== 'games') {
                showMessage(`${item.dataset.page} page coming soon!`, false);
            }
        });
    });
    
    // ============ INITIALIZATION ============
    function init() {
        resizeCanvas();
        updateBalanceUI();
        updateRecentCrashes();
        setInterval(() => {
            if(!playing) drawGraph();
        }, 100);
    }
    
    init();
</script>
</body>
</html>
