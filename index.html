<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DatingSpark | Global Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #8b5cf6; --secondary: #ec4899; --bg: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #1e293b; overflow: hidden; }
        
        .page { display: none; min-height: 100vh; height: 100vh; position: relative; }
        .page.active { display: flex; flex-direction: column; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-bar { 
            display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); z-index: 100; justify-content: space-around; padding: 12px 0;
        }
        .nav-item { color: #cbd5e1; font-size: 1.2rem; transition: 0.3s; cursor: pointer; }
        .nav-item.active { color: var(--primary); transform: scale(1.2); }

        .btn-main { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; padding: 16px; border-radius: 18px; font-weight: 700; width: 100%; box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4); }
        .input-box { width: 100%; padding: 16px; border-radius: 18px; background: white; border: 1px solid #e2e8f0; outline: none; margin-bottom: 12px; }

        /* Video Call Overlay */
        #video-call-screen {
            display: none; position: fixed; inset: 0; background: #000; z-index: 1000;
        }
        .remote-video { width: 100%; height: 100%; object-cover: cover; }
        .local-video { position: absolute; top: 40px; right: 20px; width: 100px; height: 150px; border-radius: 15px; border: 2px solid white; object-fit: cover; }
    </style>
</head>
<body>

<div class="app-container h-full">

    <div id="login-page" class="page active px-8 pt-20 text-center bg-white">
        <div class="mb-12">
            <div class="w-24 h-24 bg-violet-100 text-violet-600 rounded-[2.5rem] flex items-center justify-center mx-auto mb-6 rotate-12 shadow-xl shadow-violet-100">
                <i class="fas fa-heart text-5xl"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">DatingSpark</h1>
            <p class="text-slate-400 mt-2">Global Discovery awaits you.</p>
        </div>
        <input type="email" id="l-email" placeholder="Email Address" class="input-box">
        <input type="password" id="l-pass" placeholder="Password" class="input-box">
        <button onclick="authLogin()" class="btn-main mt-4">Sign In</button>
        <p class="mt-10 text-slate-500 text-sm">New here? <span onclick="showPage('signup-page')" class="text-violet-600 font-bold underline cursor-pointer">Create Account</span></p>
    </div>

    <div id="signup-page" class="page px-8 pt-10 bg-white overflow-y-auto">
        <h2 class="text-3xl font-extrabold mb-6">Join Spark</h2>
        <input type="text" id="r-name" placeholder="Full Name" class="input-box">
        <div class="grid grid-cols-2 gap-4">
            <input type="number" id="r-age" placeholder="Age" class="input-box">
            <select id="r-gender" class="input-box"><option value="Male">Male</option><option value="Female">Female</option></select>
        </div>
        <select id="r-country" class="input-box"></select>
        <input type="email" id="r-email" placeholder="Email" class="input-box">
        <input type="password" id="r-pass" placeholder="Password" class="input-box">
        <button onclick="authSignup()" class="btn-main mt-4">Create Account</button>
    </div>

    <div id="home-page" class="page px-5 pt-8 overflow-hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black">Discovery</h2>
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-violet-600 shadow-sm border border-slate-100">
                <i class="fas fa-sliders-h"></i>
            </div>
        </div>
        <div class="relative flex-1">
            <div id="match-card" class="h-full rounded-[35px] overflow-hidden shadow-2xl relative">
                <img id="m-img" class="w-full h-full object-cover">
                <div class="absolute bottom-0 w-full p-8 bg-gradient-to-t from-black/90 via-black/40 to-transparent">
                    <h3 id="m-info" class="text-white text-3xl font-bold">Name, 24</h3>
                    <p id="m-country" class="text-slate-300 font-medium"></p>
                    <div class="flex gap-4 mt-6">
                        <button onclick="nextMatch()" class="flex-1 bg-white/20 backdrop-blur-md py-4 rounded-2xl text-white border border-white/20"><i class="fas fa-times text-xl"></i></button>
                        <button onclick="triggerMatchEffect()" class="flex-1 bg-pink-500 py-4 rounded-2xl text-white shadow-lg"><i class="fas fa-heart text-xl"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="message-page" class="page px-6 pt-10">
        <h2 class="text-3xl font-black mb-8">Matches</h2>
        <div id="chat-list" class="space-y-4"></div>
    </div>

    <div id="chat-active-page" class="page bg-white">
        <div class="p-6 border-b flex items-center gap-4">
            <i onclick="showPage('message-page')" class="fas fa-chevron-left text-slate-400"></i>
            <img id="chat-avatar" class="w-10 h-10 rounded-full object-cover">
            <div class="flex-1">
                <h4 id="chat-name" class="font-bold text-sm">Name</h4>
                <p class="text-[10px] text-green-500 font-bold">Online</p>
            </div>
            <div class="flex gap-4 text-violet-600">
                <button onclick="startVideoCall()"><i class="fas fa-video"></i></button>
                <button><i class="fas fa-phone-alt"></i></button>
            </div>
        </div>
        <div id="chat-messages" class="flex-1 p-6 overflow-y-auto bg-slate-50 space-y-4">
            <div class="bg-white p-4 rounded-2xl rounded-bl-none shadow-sm max-w-[80%] text-sm">Hey! I saw we matched. How are you doing?</div>
        </div>
        <div class="p-4 bg-white border-t flex gap-3 items-center">
            <button class="text-slate-400"><i class="fas fa-plus-circle text-xl"></i></button>
            <input type="text" placeholder="Type a message..." class="flex-1 bg-slate-100 p-3 rounded-2xl outline-none text-sm">
            <button class="w-12 h-12 bg-violet-600 text-white rounded-full"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="video-call-screen">
        <img id="vc-remote-img" class="remote-video opacity-40">
        <div class="local-video bg-slate-800 flex items-center justify-center text-white text-xs">You</div>
        <div class="absolute bottom-20 w-full flex justify-center gap-8">
            <button class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-full text-white"><i class="fas fa-microphone-slash"></i></button>
            <button onclick="endCall()" class="w-16 h-16 bg-red-500 rounded-full text-white shadow-2xl shadow-red-500/50"><i class="fas fa-phone-slash text-xl"></i></button>
            <button class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-full text-white"><i class="fas fa-video-slash"></i></button>
        </div>
        <div class="absolute top-20 w-full text-center">
            <h4 id="vc-name" class="text-white text-2xl font-bold">Name</h4>
            <p class="text-white/60">Video Calling...</p>
        </div>
    </div>

    <nav id="nav-bar" class="nav-bar">
        <div onclick="showPage('home-page')" id="n-home" class="nav-item active"><i class="fas fa-fire-alt"></i></div>
        <div onclick="showPage('message-page')" id="n-message" class="nav-item"><i class="fas fa-comment-dots"></i></div>
        <div onclick="showPage('profile-page')" id="n-profile" class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>
</div>

<script>
    // 249 Countries Logic (Minimized for brevity)
    const countries = [{n:"Ethiopia",f:"🇪🇹"},{n:"USA",f:"🇺🇸"},{n:"Italy",f:"🇮🇹"},{n:"Germany",f:"🇩🇪"}]; // Use full list from previous prompt
    const countrySelect = document.getElementById('r-country');
    countries.forEach(c => countrySelect.innerHTML += `<option value="${c.f} ${c.n}">${c.f} ${c.n}</option>`);

    let userAccount = null;
    let activeMatch = null;
    const matchesDB = [
        {name: "Saron", age: 22, country: "🇪🇹 Ethiopia", img: "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=500"},
        {name: "Elena", age: 24, country: "🇮🇹 Italy", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500"}
    ];

    function showPage(id) {
        if (!userAccount && id !== 'login-page' && id !== 'signup-page') return alert("Lock: Login first!");
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        // Nav visibility
        document.getElementById('nav-bar').style.display = (id==='login-page'||id==='signup-page'||id==='chat-active-page') ? 'none' : 'flex';
    }

    function authLogin() {
        const email = document.getElementById('l-email').value;
        if(email) {
            userAccount = { name: "Dai", email: email }; // Mock login
            initHome();
            showPage('home-page');
        }
    }

    function initHome() {
        activeMatch = matchesDB[0];
        updateMatchCard();
        updateChatList();
    }

    function updateMatchCard() {
        document.getElementById('m-img').src = activeMatch.img;
        document.getElementById('m-info').innerText = `${activeMatch.name}, ${activeMatch.age}`;
        document.getElementById('m-country').innerText = activeMatch.country;
    }

    function nextMatch() {
        activeMatch = matchesDB[Math.floor(Math.random()*matchesDB.length)];
        updateMatchCard();
    }

    function updateChatList() {
        const list = document.getElementById('chat-list');
        list.innerHTML = "";
        matchesDB.forEach(m => {
            list.innerHTML += `
                <div onclick="openChat('${m.name}', '${m.img}')" class="flex items-center gap-4 bg-white p-4 rounded-[2rem] shadow-sm border border-slate-50">
                    <img src="${m.img}" class="w-16 h-16 rounded-2xl object-cover">
                    <div class="flex-1">
                        <p class="font-bold text-slate-800">${m.name}</p>
                        <p class="text-xs text-slate-400">Tap to start video call</p>
                    </div>
                </div>`;
        });
    }

    function openChat(name, img) {
        document.getElementById('chat-name').innerText = name;
        document.getElementById('chat-avatar').src = img;
        document.getElementById('vc-remote-img').src = img;
        document.getElementById('vc-name').innerText = name;
        showPage('chat-active-page');
    }

    function startVideoCall() {
        document.getElementById('video-call-screen').style.display = 'block';
    }

    function endCall() {
        document.getElementById('video-call-screen').style.display = 'none';
    }

    function triggerMatchEffect() {
        alert("It's a Match! Starting chat with " + activeMatch.name);
        openChat(activeMatch.name, activeMatch.img);
    }
</script>
</body>
</html>
