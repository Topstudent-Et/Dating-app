<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Dating | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #6366f1; --secondary: #f43f5e; --bg: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #1e293b; overflow: hidden; }
        .page { display: none; height: 100vh; flex-direction: column; overflow-y: auto; padding-bottom: 100px; }
        .page.active { display: flex; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .nav-bar { display: none; position: fixed; bottom: 0; width: 100%; background: white; padding: 15px 0; border-top: 1px solid #e2e8f0; z-index: 100; justify-content: space-around; }
        .nav-item { color: #94a3b8; font-size: 1.5rem; transition: 0.3s; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .input-box { width: 100%; padding: 16px; border-radius: 20px; background: white; border: 1px solid #e2e8f0; outline: none; margin-bottom: 15px; }
        .btn-main { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 18px; border-radius: 20px; font-weight: 800; width: 100%; shadow: 0 10px 20px rgba(99, 102, 241, 0.2); }
        .chat-bubble { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 14px; margin-bottom: 8px; position: relative; }
        .sent { background: var(--primary); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .received { background: white; color: #1e293b; border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="app">

    <div id="login-page" class="page active px-8 pt-24 text-center">
        <div class="mb-6"><i class="fas fa-globe-africa text-7xl text-indigo-500"></i></div>
        <h1 class="text-4xl font-extrabold tracking-tight mb-2">World Dating</h1>
        <p class="text-slate-400 mb-10">Connect across borders</p>
        <input type="tel" id="login-phone" placeholder="Phone Number" class="input-box">
        <input type="password" id="login-pass" placeholder="Password" class="input-box">
        <button onclick="processLogin()" class="btn-main">Login Now</button>
        <p class="mt-8 text-sm">Don't have an account? <span onclick="showPage('signup-page')" class="text-indigo-600 font-bold cursor-pointer underline">Register</span></p>
    </div>

    <div id="signup-page" class="page px-8 pt-10">
        <h2 class="text-3xl font-black mb-6">Create Account</h2>
        <div class="flex justify-center mb-8">
            <div onclick="document.getElementById('reg-photo').click()" class="w-32 h-32 bg-slate-100 rounded-3xl border-2 border-dashed border-slate-300 flex items-center justify-center relative overflow-hidden group">
                <img id="reg-preview" class="absolute inset-0 w-full h-full object-cover hidden">
                <i class="fas fa-plus text-slate-300 text-2xl group-hover:scale-110 transition"></i>
            </div>
            <input type="file" id="reg-photo" class="hidden" accept="image/*" onchange="handleImageUpload(this)">
        </div>
        <input type="text" id="reg-name" placeholder="Full Name" class="input-box">
        <div class="flex gap-3">
            <input type="number" id="reg-age" placeholder="Age" class="input-box w-1/3">
            <select id="reg-gender" class="input-box w-2/3"><option value="Male">Male</option><option value="Female">Female</option></select>
        </div>
        <select id="reg-country" class="input-box"></select>
        <input type="tel" id="reg-phone" placeholder="Phone Number" class="input-box">
        <input type="password" id="reg-pass" placeholder="Create Password" class="input-box">
        <button onclick="startVerification()" class="btn-main">Verify Phone</button>
    </div>

    <div id="verify-page" class="page px-8 pt-20 text-center">
        <h2 class="text-2xl font-bold">Verification Code</h2>
        <p class="text-slate-400 mt-2 mb-8">Copy this code and paste it below</p>
        <div id="otp-code" class="text-5xl font-black tracking-widest text-indigo-600 mb-10 bg-indigo-50 py-8 rounded-3xl cursor-pointer" onclick="copyCode()">000000</div>
        <input type="text" id="otp-input" placeholder="Enter 6-digit code" class="input-box text-center text-2xl font-bold tracking-[0.5em]">
        <button onclick="completeRegistration()" class="btn-main mt-4">Confirm & Join</button>
    </div>

    <div id="home-page" class="page px-6 pt-12">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-black">World Dating</h2>
            <div class="relative"><i class="fas fa-bell text-2xl text-slate-300"></i><span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span></div>
        </div>
        <div class="space-y-6" id="home-feed">
            </div>
    </div>

    <div id="match-page" class="page px-6 pt-12">
        <h2 class="text-3xl font-black mb-8">Discover</h2>
        <div class="relative h-[65vh] rounded-[40px] overflow-hidden shadow-2xl" id="match-card">
            <img id="match-img" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent p-8 flex flex-col justify-end">
                <h3 id="match-name" class="text-white text-3xl font-bold">Name, Age</h3>
                <p id="match-loc" class="text-slate-300"></p>
                <div class="flex gap-4 mt-8">
                    <button onclick="nextMatch()" class="flex-1 bg-white/20 backdrop-blur-md py-4 rounded-2xl text-white"><i class="fas fa-times text-xl"></i></button>
                    <button onclick="likeMatch()" class="flex-1 bg-indigo-500 py-4 rounded-2xl text-white"><i class="fas fa-heart text-xl"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="message-page" class="page px-6 pt-12">
        <h2 class="text-3xl font-black mb-8">Chats</h2>
        <div id="chat-list" class="space-y-4"></div>
    </div>

    <div id="chat-active" class="page bg-white p-0">
        <div class="p-5 border-b flex items-center gap-4 bg-white sticky top-0 z-50">
            <i onclick="showPage('message-page')" class="fas fa-arrow-left text-slate-400"></i>
            <img id="chat-avatar" class="w-12 h-12 rounded-full object-cover">
            <div class="flex-1"><h4 id="chat-title" class="font-bold">Name</h4><p class="text-[10px] text-green-500 font-bold uppercase">Online</p></div>
            <i class="fas fa-ellipsis-v text-slate-300"></i>
        </div>
        <div id="chat-container" class="flex-1 p-6 bg-slate-50 overflow-y-auto min-h-[70vh]"></div>
        <div class="p-4 border-t bg-white flex items-center gap-2 sticky bottom-0">
            <div class="flex gap-2">
                <button onclick="alert('Recording Audio...')" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500"><i class="fas fa-microphone"></i></button>
                <button onclick="document.getElementById('video-upload').click()" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500"><i class="fas fa-video"></i></button>
            </div>
            <input type="file" id="video-upload" class="hidden" accept="video/*" onchange="sendVideoMessage(this)">
            <input type="text" id="chat-input" placeholder="Type message..." class="flex-1 bg-slate-100 p-4 rounded-2xl outline-none">
            <button onclick="sendTextMessage()" class="w-12 h-12 bg-indigo-600 text-white rounded-2xl"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="profile-page" class="page px-8 pt-12 pb-32">
        <h2 class="text-3xl font-black mb-8">My Profile</h2>
        <div class="text-center mb-10">
            <div class="relative w-40 h-40 mx-auto">
                <img id="user-pfp" class="w-full h-full rounded-[3rem] object-cover border-4 border-white shadow-xl">
                <label for="change-pfp" class="absolute -bottom-2 -right-2 w-12 h-12 bg-indigo-600 rounded-full border-4 border-white flex items-center justify-center text-white cursor-pointer">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="change-pfp" class="hidden" onchange="updatePhoto(this)">
            </div>
            <input type="text" id="prof-name" class="text-3xl font-black text-center w-full mt-6 bg-transparent outline-none border-b border-transparent focus:border-indigo-200" onchange="saveProfile()">
            <p id="prof-meta" class="text-slate-400 font-medium"></p>
        </div>

        <div class="space-y-4">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Account Settings</p>
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <span class="font-bold">Age</span>
                        <input type="number" id="prof-age" class="w-16 text-right bg-transparent font-bold text-indigo-600" onchange="saveProfile()">
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-bold">Password</span>
                        <input type="password" id="prof-pass" value="******" class="w-32 text-right bg-transparent font-bold text-indigo-600" onchange="saveProfile()">
                    </div>
                </div>
            </div>
            <button onclick="location.reload()" class="w-full p-6 bg-red-50 text-red-500 font-bold rounded-[2.5rem] mt-6">Logout Account</button>
        </div>
    </div>

    <nav id="nav-bar" class="nav-bar">
        <div onclick="showPage('home-page')" id="n-home" class="nav-item active"><i class="fas fa-home"></i></div>
        <div onclick="showPage('match-page')" id="n-match" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="showPage('message-page')" id="n-message" class="nav-item"><i class="fas fa-comment-dots"></i></div>
        <div onclick="showPage('profile-page')" id="n-profile" class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

</div>

    // --- Navigation Logic ---
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const hideNav = ['login-page', 'signup-page', 'verify-page', 'chat-active'];
        document.getElementById('nav-bar').style.display = hideNav.includes(id) ? 'none' : 'flex';
        const tabId = 'n-' + id.split('-')[0];
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(document.getElementById(tabId)) document.getElementById(tabId).classList.add('active');
    }

    // --- Image Handling ---
    function handleImageUpload(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                uploadedImg = e.target.result;
                document.getElementById('reg-preview').src = uploadedImg;
                document.getElementById('reg-preview').classList.remove('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

        const phone = document.getElementById('reg-phone').value;

        document.getElementById('otp-code').innerText = otpValue;

            name: name, age: document.getElementById('reg-age').value,
            gender: document.getElementById('reg-gender').value,
            phone: phone, pass: document.getElementById('reg-pass').value,
            country: document.getElementById('reg-country').value,
            photo: uploadedImg
        };
        showPage('verify-page');
    }

    function copyCode() {
        navigator.clipboard.writeText(otpValue);
        alert("Code copied!");
    }

    function completeRegistration() {
        if(document.getElementById('otp-input').value === otpValue) {
            localStorage.setItem(tempUserData.phone, JSON.stringify(tempUserData));
            alert("Verified! Please Login.");
            showPage('login-page');
        } else alert("Invalid Code!");
    }

    function processLogin() {
        const ph = document.getElementById('login-phone').value;
        const ps = document.getElementById('login-pass').value;
        const user = JSON.parse(localStorage.getItem(ph));
        if(user && user.pass === ps) {
            currentUser = user;
            initUserApp();
            showPage('home-page');
        } else alert("Wrong phone or password!");
    }

    // --- App Features ---
    function initUserApp() {
        document.getElementById('user-pfp').src = currentUser.photo;
        document.getElementById('prof-name').value = currentUser.name;
        document.getElementById('prof-age').value = currentUser.age;
        document.getElementById('prof-meta').innerText = currentUser.country;
        loadDiscovery();
        loadHomeFeed();
        loadChatList();
    }

    function loadHomeFeed() {
        const feed = document.getElementById('home-feed');
        feed.innerHTML = "";
        usersDB.forEach(u => {
            feed.innerHTML += `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100">
                    <div class="p-4 flex items-center gap-3">
                        <img src="${u.img}" class="w-10 h-10 rounded-full object-cover">
                        <div><p class="font-bold text-sm">${u.name}</p><p class="text-[10px] text-slate-400">${u.country}</p></div>
                    </div>
                    <img src="${u.img}" class="w-full h-72 object-cover">
                    <div class="p-4 flex gap-4 text-xl">
                        <i class="far fa-heart"></i><i class="far fa-comment"></i><i class="far fa-paper-plane"></i>
                    </div>
                </div>`;
        });
    }

    function loadDiscovery() {
        const list = usersDB.filter(u => u.gender !== currentUser.gender);
        if(list.length > 0) {
            const m = list[matchIdx % list.length];
            document.getElementById('match-img').src = m.img;
            document.getElementById('match-name').innerText = `${m.name}, ${m.age}`;
            document.getElementById('match-loc').innerText = m.country;
        }
    }

    function nextMatch() { matchIdx++; loadDiscovery(); }
    function likeMatch() { alert("Matched!"); openChat(usersDB[0]); }

    function loadChatList() {
        const list = document.getElementById('chat-list');
        list.innerHTML = "";
        usersDB.forEach(u => {
            list.innerHTML += `
                <div onclick='openChat(${JSON.stringify(u)})' class="flex items-center gap-4 bg-white p-4 rounded-3xl shadow-sm border border-slate-50">
                    <img src="${u.img}" class="w-16 h-16 rounded-2xl object-cover">
                    <div class="flex-1"><p class="font-bold">${u.name}</p><p class="text-xs text-slate-400">Hey, how are you?</p></div>
                </div>`;
        });
    }

    let activePartner = null;
    function openChat(partner) {
        activePartner = partner;
        document.getElementById('chat-avatar').src = partner.img;
        document.getElementById('chat-title').innerText = partner.name;
        document.getElementById('chat-container').innerHTML = `<div class="chat-bubble received">Hi ${currentUser.name}! Nice to meet you.</div>`;
        showPage('chat-active');
    }

    function sendTextMessage() {
        const input = document.getElementById('chat-input');
        if(input.value) {
            const msg = `<div class="chat-bubble sent">${input.value}</div>`;
            document.getElementById('chat-container').innerHTML += msg;
            input.value = "";
            document.getElementById('chat-container').scrollTop = 9999;
        }
    }

    function sendVideoMessage(input) {
        if(input.files && input.files[0]) {
            const url = URL.createObjectURL(input.files[0]);
            const msg = `<div class="chat-bubble sent"><video src="${url}" controls class="rounded-xl w-full"></video></div>`;
            document.getElementById('chat-container').innerHTML += msg;
        }
    }

    // --- Profile Editing ---
    function saveProfile() {
        currentUser.name = document.getElementById('prof-name').value;
        currentUser.age = document.getElementById('prof-age').value;
        currentUser.pass = document.getElementById('prof-pass').value;
        localStorage.setItem(currentUser.phone, JSON.stringify(currentUser));
    }

    function updatePhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                currentUser.photo = e.target.result;
                document.getElementById('user-pfp').src = currentUser.photo;
                saveProfile();
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
