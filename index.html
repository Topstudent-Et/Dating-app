<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAI AVIATOR - FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;700&display=swap');
        
        body { background-color: #0b0e11; color: white; font-family: 'Poppins', sans-serif; margin: 0; user-select: none; overflow: hidden; }
        .font-game { font-family: 'Orbitron', sans-serif; }

        /* Game Board */
        .aviator-screen { 
            background: radial-gradient(circle at bottom left, #1a0b12 0%, #000 100%);
            height: 320px; position: relative; border-radius: 15px; overflow: hidden; border: 2px solid #2d1a24;
            margin-top: 10px;
        }
        
        /* Red Plane SVG Animation */
        .plane-wrapper {
            position: absolute; bottom: 20px; left: 20px; width: 70px; z-index: 50;
            transition: transform 0.1s linear;
        }

        /* Multiplier Text */
        .multi-display { font-size: 4rem; font-weight: 900; z-index: 100; position: relative; }

        /* Betting Buttons */
        .btn-bet { background-color: #28a745; border-radius: 12px; font-weight: 800; transition: 0.2s; color: white; }
        .btn-cashout { background-color: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .control-panel { background-color: #1c2127; border-radius: 15px; border: 1px solid #2d3748; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body>

    <div class="p-3 flex justify-between items-center bg-[#1c2127] border-b border-gray-800">
        <span class="text-red-600 font-black italic text-2xl tracking-tighter">Aviator</span>
        <div class="bg-black px-4 py-1.5 rounded-full border border-green-900 flex items-center gap-2">
            <span id="main-balance" class="text-green-500 font-bold">50,000.00</span>
            <span class="text-[10px] text-gray-500">ETB</span>
        </div>
    </div>

    <div class="p-4 max-w-md mx-auto">
        <div class="aviator-screen flex items-center justify-center">
            <div id="game-status" class="absolute top-4 text-gray-500 font-bold text-[10px] uppercase tracking-widest">በመጠባበቅ ላይ...</div>
            <div id="multiplier-val" class="multi-display font-game text-white">1.00x</div>
            
            <div id="plane-box" class="plane-wrapper">
                <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10,30 L40,30 L55,10 L70,10 L60,30 L85,30 C92,30 95,35 85,40 L60,40 L70,55 L55,55 L40,40 L10,40 Z" fill="#e11d48" stroke="white" stroke-width="2"/>
                    <circle cx="15" cy="35" r="3" fill="white" />
                </svg>
            </div>
        </div>

        <div class="mt-4 space-y-3">
            <div class="control-panel p-3">
                <div class="flex items-center gap-3">
                    <div class="bg-black flex flex-col items-center rounded-lg p-1 w-24">
                        <div class="flex items-center gap-2">
                            <button onclick="changeVal('amt1', -1)" class="text-gray-400 font-bold">−</button>
                            <input id="amt1" type="number" value="10" class="bg-transparent text-white text-center w-10 font-bold outline-none">
                            <button onclick="changeVal('amt1', 1)" class="text-gray-400 font-bold">+</button>
                        </div>
                        <div class="flex gap-1 mt-1">
                            <button onclick="setVal('amt1', 50)" class="bg-gray-800 text-[8px] px-1 rounded">50</button>
                            <button onclick="setVal('amt1', 100)" class="bg-gray-800 text-[8px] px-1 rounded">100</button>
                        </div>
                    </div>
                    <button id="btn1" onclick="handleAction(1)" class="btn-bet flex-1 py-4 text-lg">ተወራረድ<br><span id="label1" class="text-[10px] font-normal">10.00 ETB</span></button>
                </div>
            </div>

            <div class="control-panel p-3">
                <div class="flex items-center gap-3">
                    <div class="bg-black flex flex-col items-center rounded-lg p-1 w-24">
                        <div class="flex items-center gap-2">
                            <button onclick="changeVal('amt2', -1)" class="text-gray-400 font-bold">−</button>
                            <input id="amt2" type="number" value="10" class="bg-transparent text-white text-center w-10 font-bold outline-none">
                            <button onclick="changeVal('amt2', 1)" class="text-gray-400 font-bold">+</button>
                        </div>
                        <div class="flex gap-1 mt-1">
                            <button onclick="setVal('amt2', 50)" class="bg-gray-800 text-[8px] px-1 rounded">50</button>
                            <button onclick="setVal('amt2', 100)" class="bg-gray-800 text-[8px] px-1 rounded">100</button>
                        </div>
                    </div>
                    <button id="btn2" onclick="handleAction(2)" class="btn-bet flex-1 py-4 text-lg">ተወራረድ<br><span id="label2" class="text-[10px] font-normal">10.00 ETB</span></button>
                </div>
            </div>
        </div>
    </div>

    <audio id="engine-sound" loop src="https://www.soundjay.com/transportation/sounds/propeller-plane-flying-1.mp3"></audio>

    <script>
        let balance = 50000.00;
        let isFlying = false;
        let multiplier = 1.00;
        let gameInterval;
        let bets = { 1: { active: false, amt: 0 }, 2: { active: false, amt: 0 } };

        function changeVal(id, v) {
            let el = document.getElementById(id);
            let val = parseInt(el.value);
            if(val + v > 0) el.value = val + v;
            updateLabels();
        }

        function setVal(id, v) {
            document.getElementById(id).value = v;
            updateLabels();
        }

        function updateLabels() {
            if(!bets[1].active) document.getElementById('label1').innerText = document.getElementById('amt1').value + ".00 ETB";
            if(!bets[2].active) document.getElementById('label2').innerText = document.getElementById('amt2').value + ".00 ETB";
        }

        function handleAction(n) {
            let btn = document.getElementById('btn' + n);
            let amt = parseInt(document.getElementById('amt' + n).value);

            if(!isFlying && !bets[n].active) {
                if(amt > balance) return alert("በቂ ገንዘብ የለም!");
                balance -= amt;
                bets[n].active = true;
                bets[n].amt = amt;
                btn.classList.replace('bg-green-600', 'bg-red-800');
                btn.innerHTML = "ይሰረዝ<br><span class='text-[10px]'>በመጠባበቅ ላይ</span>";
                document.getElementById('main-balance').innerText = balance.toLocaleString();
            } else if (isFlying && bets[n].active) {
                let win = bets[n].amt * multiplier;
                balance += win;
                bets[n].active = false;
                alert(`እንኳን ደስ አለዎት! ${win.toFixed(2)} ETB አሸንፈዋል!`);
                resetBtn(n);
                document.getElementById('main-balance').innerText = balance.toLocaleString();
            }
        }

        function resetBtn(n) {
            let btn = document.getElementById('btn' + n);
            btn.className = "btn-bet flex-1 py-4 text-lg bg-green-600";
            btn.innerHTML = `ተወራረድ<br><span class="text-[10px] font-normal">${document.getElementById('amt'+n).value}.00 ETB</span>`;
        }

        function startLoop() {
            if(isFlying) return;
            let status = document.getElementById('game-status');
            let count = 5;
            let timer = setInterval(() => {
                status.innerText = `ቀጣይ በረራ በ ${count} ሰከንድ...`;
                count--;
                if(count < 0) {
                    clearInterval(timer);
                    launch();
                }
            }, 1000);
        }

        function launch() {
            isFlying = true;
            multiplier = 1.00;
            document.getElementById('multiplier-val').style.color = "white";
            document.getElementById('game-status').innerText = "አውሮፕላኑ እየበረረ ነው!";
            document.getElementById('engine-sound').play();

            // Update buttons to Cash Out
            for(let i=1; i<=2; i++) {
                if(bets[i].active) {
                    let btn = document.getElementById('btn'+i);
                    btn.classList.replace('bg-red-800', 'btn-cashout');
                    btn.innerHTML = `ውጣ (CASH OUT)<br><span class='text-[10px]'>${(bets[i].amt * multiplier).toFixed(2)}</span>`;
                }
            }

            let crashAt = Math.random() < 0.3 ? (1 + Math.random() * 0.5) : (1 + Math.random() * 10);

            gameInterval = setInterval(() => {
                multiplier += 0.03;
                document.getElementById('multiplier-val').innerText = multiplier.toFixed(2) + "x";
                
                // አውሮፕላኑን ማንቀሳቀስ
                let plane = document.getElementById('plane-box');
                plane.style.transform = `translate(${multiplier * 20}px, -${multiplier * 15}px)`;

                for(let i=1; i<=2; i++) {
                    if(bets[i].active) {
                        document.getElementById('btn'+i).querySelector('span').innerText = (bets[i].amt * multiplier).toFixed(2);
                    }
                }

                if(multiplier >= crashAt) crash();
            }, 100);
        }

        function crash() {
            clearInterval(gameInterval);
            isFlying = false;
            document.getElementById('engine-sound').pause();
            document.getElementById('engine-sound').currentTime = 0;
            
            document.getElementById('multiplier-val').innerText = "FLEW AWAY!";
            document.getElementById('multiplier-val').style.color = "#ff0000";

            for(let i=1; i<=2; i++) {
                if(bets[i].active) {
                    bets[i].active = false;
                    resetBtn(i);
                }
            }

            setTimeout(() => {
                document.getElementById('plane-box').style.transform = "translate(0,0)";
                document.getElementById('multiplier-val').innerText = "1.00x";
                startLoop();
            }, 3000);
        }

        startLoop();
    </script>
</body>
</html>
