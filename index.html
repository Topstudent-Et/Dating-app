<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME V55 - ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Game Screen & Buildings */
        .game-area { position: relative; flex-grow: 1; min-height: 300px; background: linear-gradient(to bottom, #001, #100); overflow: hidden; }
        .buildings { position: absolute; bottom: 0; width: 100%; height: 50px; background: url('https://i.imgur.com/8f6Zk0U.png') repeat-x; opacity: 0.3; z-index: 5; }
        
        #multiplier { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: 5rem; font-weight: 900; z-index: 20; color: #fff; text-shadow: 0 0 20px red; }
        #plane { position: absolute; font-size: 40px; z-index: 30; transition: 0.1s linear; }
        #svgPath { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #pathLine { stroke: #ff0000; stroke-width: 4; fill: none; filter: drop-shadow(0 0 5px red); }

        /* Double Bet Layout */
        .bet-row { display: flex; gap: 10px; align-items: center; background: #0a0a0a; padding: 10px; border-radius: 15px; border: 1px solid #1a1a1a; }
        .bet-btn-green { background: linear-gradient(180deg, #22c55e, #15803d); height: 60px; border-radius: 12px; font-weight: 900; width: 40%; border-bottom: 4px solid #050; }
        
        /* Podium Styles */
        .podium-item { display: flex; flex-direction: column; align-items: center; width: 30%; border-radius: 10px 10px 0 0; border: 1px solid #222; padding: 5px; }
        .rank-1 { height: 100px; background: linear-gradient(180deg, #ffd70033, #000); border-color: #ffd700; }

        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 120px; }
        .active-page { display: block; }
    </style>
</head>
<body>

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-green-600 px-6 py-2 rounded-full z-[9999] hidden font-bold text-sm">Success!</div>

    <header class="flex justify-between items-center p-4 border-b border-zinc-900 bg-black">
        <div class="flex items-center gap-2">
            <img id="uPic" src="" class="w-10 h-10 rounded-full border border-zinc-700 bg-zinc-800">
            <div><p id="uName" class="text-[10px] font-black uppercase">User</p><p class="text-[8px] text-green-500 font-bold">ONLINE</p></div>
        </div>
        <div class="bg-zinc-900 px-4 py-1.5 rounded-xl border border-zinc-800"><span id="topBal" class="text-green-500 font-game">0.00</span></div>
    </header>

    <div id="playPage" class="page active-page">
        <div class="game-area">
            <div id="multiplier" class="font-game">1.00x</div>
            <svg id="svgPath"><path id="pathLine" d=""></path></svg>
            <div id="plane" style="left: 10%; bottom: 10%;">✈️</div>
            <div class="buildings"></div>
        </div>
        <div class="p-4 space-y-3">
            <div class="bet-row">
                <div class="flex-1 flex items-center bg-black rounded-lg p-2 gap-2">
                    <button onclick="changeAmt('amt1', -10)" class="text-zinc-500 font-bold px-2">-</button>
                    <input type="number" id="amt1" value="100" class="bg-transparent w-full text-center font-black outline-none">
                    <button onclick="changeAmt('amt1', 10)" class="text-green-500 font-bold px-2">+</button>
                </div>
                <button onclick="tg.HapticFeedback.impactOccurred('medium')" class="bet-btn-green">BET</button>
            </div>
            <div class="bet-row">
                <div class="flex-1 flex items-center bg-black rounded-lg p-2 gap-2">
                    <button onclick="changeAmt('amt2', -10)" class="text-zinc-500 font-bold px-2">-</button>
                    <input type="number" id="amt2" value="200" class="bg-transparent w-full text-center font-black outline-none">
                    <button onclick="changeAmt('amt2', 10)" class="text-green-500 font-bold px-2">+</button>
                </div>
                <button onclick="tg.HapticFeedback.impactOccurred('medium')" class="bet-btn-green">BET</button>
            </div>
        </div>
    </div>

    <div id="walletPage" class="page p-6">
        <div class="grid grid-cols-2 gap-2 mb-6 text-center">
            <button onclick="switchTab('dep')" id="depTab" class="bg-blue-600 p-3 rounded-xl font-black text-xs">DEPOSIT</button>
            <button onclick="switchTab('wit')" id="witTab" class="bg-zinc-900 p-3 rounded-xl font-black text-xs">WITHDRAW</button>
        </div>

        <div id="depSection" class="space-y-4">
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 text-center">
                <p class="text-blue-500 font-bold text-[10px]">CBE: 1000179571815</p>
                <p class="text-yellow-500 font-bold text-[10px]">ABYSSINIA: 165097254</p>
            </div>
            <input type="number" id="depAmt" placeholder="Amount" class="bg-zinc-900 w-full p-4 rounded-xl outline-none">
            <input type="text" id="depFT" placeholder="FT Number" class="bg-zinc-900 w-full p-4 rounded-xl outline-none">
            <button onclick="sendReq('Deposit')" class="w-full bg-green-600 py-4 rounded-xl font-black">SUBMIT DEPOSIT</button>
        </div>

        <div id="witSection" class="hidden space-y-4">
            <input type="number" id="witAmt" placeholder="Amount to Withdraw" class="bg-zinc-900 w-full p-4 rounded-xl outline-none">
            <input type="text" id="witBank" placeholder="Your Bank Account Number" class="bg-zinc-900 w-full p-4 rounded-xl outline-none">
            <button onclick="sendReq('Withdraw')" class="w-full bg-red-600 py-4 rounded-xl font-black">SUBMIT WITHDRAW</button>
        </div>
    </div>

    <div id="topPage" class="page p-4">
        <div class="flex items-end justify-center gap-2 h-32 mb-8">
            <div class="podium-item">🥈<p class="text-[8px]">Dawit.A</p></div>
            <div class="podium-item rank-1">👑<p class="text-[10px] font-black">YOU</p></div>
            <div class="podium-item">🥉<p class="text-[8px]">Sara.K</p></div>
        </div>
        <div id="leaderList" class="space-y-2 px-2 text-[10px]"></div>
    </div>

    <div id="profilePage" class="page p-8 text-center">
        <img id="uPicMain" src="" class="w-24 h-24 rounded-full mx-auto border-4 border-zinc-900 mb-4">
        <h2 id="uNameMain" class="font-black text-xl uppercase">Nahom</h2>
        <div class="grid grid-cols-2 gap-4 mt-8">
            <div class="bg-zinc-900 p-4 rounded-2xl"><p class="text-green-500 font-game text-xl" id="pBal">0.00</p><p class="text-[8px] text-zinc-500">BALANCE</p></div>
            <div class="bg-zinc-900 p-4 rounded-2xl"><p class="text-white font-game text-xl" id="pPlayed">0</p><p class="text-[8px] text-zinc-500">PLAYED</p></div>
        </div>
        <button id="adminBtn" onclick="showPage('admin')" class="hidden w-full bg-yellow-600 py-4 rounded-xl font-black mt-6">ADMIN PANEL</button>
    </div>

    <div id="adminPage" class="page p-6">
        <h2 class="text-center font-black text-red-600 mb-6">ADMIN CONTROL</h2>
        <div class="bg-zinc-900 p-4 rounded-xl mb-6 space-y-2">
            <input type="number" id="manId" placeholder="User ID" class="bg-black w-full p-2 rounded">
            <input type="number" id="manAmt" placeholder="Amount" class="bg-black w-full p-2 rounded">
            <div class="flex gap-2">
                <button onclick="manageBal('add')" class="flex-1 bg-green-600 p-2 rounded font-bold">ADD (+)</button>
                <button onclick="manageBal('sub')" class="flex-1 bg-red-600 p-2 rounded font-bold">SUB (-)</button>
            </div>
        </div>
        <div id="adminRequests" class="space-y-3"></div>
    </div>

    <nav class="fixed bottom-0 w-full h-20 bg-black border-t border-zinc-900 flex justify-around items-center z-[2000] pb-5">
        <div onclick="showPage('play')" id="n-play" class="text-green-500 flex flex-col items-center"><i class="fas fa-plane"></i><span class="text-[8px] font-bold mt-1">GAME</span></div>
        <div onclick="showPage('wallet')" id="n-wallet" class="flex flex-col items-center"><i class="fas fa-wallet"></i><span class="text-[8px] font-bold mt-1">WALLET</span></div>
        <div onclick="showPage('top')" id="n-top" class="flex flex-col items-center"><i class="fas fa-trophy"></i><span class="text-[8px] font-bold mt-1">TOP</span></div>
        <div onclick="showPage('profile')" id="n-profile" class="flex flex-col items-center"><i class="fas fa-user"></i><span class="text-[8px] font-bold mt-1">ME</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const ADMIN_ID = 1476161161;
        
        let user = tg.initDataUnsafe.user || { id: 1476161161, first_name: "Nahom", photo_url: "" };
        let db = JSON.parse(localStorage.getItem('world_v55_db')) || { bal: 0.0, played: 0, reqs: [] };

        function save() {
            localStorage.setItem('world_v55_db', JSON.stringify(db));
            document.getElementById('topBal').innerText = db.bal.toFixed(2);
            document.getElementById('pBal').innerText = db.bal.toFixed(2);
            document.getElementById('pPlayed').innerText = db.played;
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active-page'));
            document.getElementById(p+'Page').classList.add('active-page');
            document.querySelectorAll('nav div').forEach(el => el.classList.remove('text-green-500'));
            document.getElementById('n-'+p).classList.add('text-green-500');
            if(p === 'admin') renderAdmin();
            if(p === 'top') renderTop();
        }

        function switchTab(t) {
            document.getElementById('depSection').classList.toggle('hidden', t==='wit');
            document.getElementById('witSection').classList.toggle('hidden', t==='dep');
            document.getElementById('depTab').className = t==='dep' ? 'bg-blue-600 p-3 rounded-xl font-black text-xs' : 'bg-zinc-900 p-3 rounded-xl font-black text-xs';
            document.getElementById('witTab').className = t==='wit' ? 'bg-red-600 p-3 rounded-xl font-black text-xs' : 'bg-zinc-900 p-3 rounded-xl font-black text-xs';
        }

        function changeAmt(id, val) {
            let el = document.getElementById(id);
            let nv = parseInt(el.value) + val;
            if(nv >= 10) el.value = nv;
        }

        function sendReq(type) {
            const amt = (type === 'Deposit') ? document.getElementById('depAmt').value : document.getElementById('witAmt').value;
            const extra = (type === 'Deposit') ? document.getElementById('depFT').value : document.getElementById('witBank').value;
            if(!amt || !extra) return alert("Please fill all fields!");
            db.reqs.push({ id: Date.now(), name: user.first_name, type, amt: parseFloat(amt), extra });
            save(); alert("Request Sent to Admin!");
        }

        function renderAdmin() {
            const list = document.getElementById('adminRequests');
            list.innerHTML = db.reqs.map(r => `
                <div class="bg-zinc-900 p-4 rounded-xl flex justify-between items-center border border-zinc-800">
                    <div><p class="text-[10px] font-black">${r.type} - ${r.name}</p><p class="text-green-500 font-bold">${r.amt} ETB</p><p class="text-[8px] text-zinc-500">${r.extra}</p></div>
                    <div class="flex gap-2"><button onclick="approve(${r.id})" class="bg-green-600 p-2 rounded text-[10px]">OK</button></div>
                </div>`).join('');
        }

        function approve(id) {
            const i = db.reqs.findIndex(r => r.id === id);
            if(db.reqs[i].type === 'Deposit') db.bal += db.reqs[i].amt;
            db.reqs.splice(i, 1); save(); renderAdmin();
        }

        function manageBal(act) {
            const amt = parseFloat(document.getElementById('manAmt').value);
            if(act === 'add') db.bal += amt; else db.bal -= amt;
            save(); alert("Done!");
        }

        function renderTop() {
            const l = document.getElementById('leaderList'); l.innerHTML = "";
            for(let i=4; i<=50; i++) {
                l.innerHTML += `<div class="flex justify-between p-2 border-b border-zinc-900"><span>#${i} Player_${1000+i}</span><span>${(5000 - i*50).toLocaleString()} ETB</span></div>`;
            }
        }

        // --- FLY ENGINE ---
        let m = 1.0;
        function runGame() {
            const p = document.getElementById('plane');
            const mult = document.getElementById('multiplier');
            const path = document.getElementById('pathLine');
            const area = document.querySelector('.game-area');
            let crash = 1.5 + Math.random() * 4;
            let pts = [];
            let loop = setInterval(() => {
                m += 0.04; mult.innerText = m.toFixed(2) + "x";
                let x = 10 + (m-1)*15, y = 10 + (m-1)*12;
                p.style.left = x + "%"; p.style.bottom = y + "%";
                let sx = (area.clientWidth * x) / 100, sy = area.clientHeight - (area.clientHeight * y) / 100;
                pts.push(`${sx},${sy}`); path.setAttribute("d", "M" + pts.join(" L"));
                if(m >= crash) {
                    clearInterval(loop); mult.classList.add('text-red-600');
                    setTimeout(() => { m = 1.0; mult.classList.remove('text-red-600'); path.setAttribute("d",""); runGame(); }, 3000);
                }
            }, 100);
        }

        window.onload = () => {
            document.getElementById('uName').innerText = user.first_name;
            document.getElementById('uNameMain').innerText = user.first_name;
            if(user.photo_url) {
                document.getElementById('uPic').src = user.photo_url;
                document.getElementById('uPicMain').src = user.photo_url;
            }
            if(user.id === ADMIN_ID) document.getElementById('adminBtn').classList.remove('hidden');
            save(); runGame();
        };
    </script>
</body>
</html>
