<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME V44 - PODIUM EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Podium Styles */
        .podium-container { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 180px; margin-top: 40px; margin-bottom: 20px; }
        .podium-box { position: relative; display: flex; flex-direction: column; align-items: center; width: 30%; border-radius: 15px 15px 0 0; transition: 0.3s; }
        .rank-1 { height: 140px; background: linear-gradient(180deg, #ffd70044, #000); border: 2px solid #ffd700; border-bottom: none; }
        .rank-2 { height: 110px; background: linear-gradient(180deg, #c0c0c044, #000); border: 2px solid #c0c0c0; border-bottom: none; }
        .rank-3 { height: 90px; background: linear-gradient(180deg, #cd7f3244, #000); border: 2px solid #cd7f32; border-bottom: none; }
        .crown-icon { position: absolute; top: -35px; font-size: 35px; filter: drop-shadow(0 0 10px #ffd700); animation: float 2s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 110px; }
        .active-page { display: block; }
        .bet-btn { background: linear-gradient(180deg, #28a745, #1e7e34); height: 50px; border-radius: 12px; font-weight: 900; width: 100%; border-bottom: 3px solid #145523; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 10px 20px; border-radius: 50px; font-size: 11px; z-index: 9999; display: none; }
    </style>
</head>
<body>

    <div id="toast" class="toast">Success! ✅</div>

    <header class="flex justify-between items-center p-4 border-b border-zinc-900 bg-black sticky top-0 z-[1000]">
        <div class="flex items-center gap-2">
            <img id="hPic" src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full border border-zinc-800">
            <span id="hName" class="text-[10px] font-black uppercase truncate w-20">NAHOM</span>
        </div>
        <div class="bg-zinc-900 px-4 py-1.5 rounded-full border border-zinc-800 flex items-center gap-2">
            <span id="topBal" class="text-green-500 font-black text-sm">0.00</span>
            <i class="fas fa-coins text-yellow-500 text-[10px]"></i>
        </div>
    </header>

    <div id="playPage" class="page active-page px-2 text-center">
        <div class="relative h-64 bg-zinc-950 rounded-3xl m-2 border border-zinc-900 overflow-hidden flex flex-col items-center justify-center">
            <div id="multiplier" class="text-6xl font-game font-black text-white">1.00x</div>
            <div id="statusLabel" class="text-[10px] uppercase tracking-widest text-zinc-500 mt-2">Waiting for next round...</div>
        </div>
        <div class="p-4 space-y-3">
            <div class="flex gap-2"><input type="number" id="amt1" value="100" class="bg-zinc-900 w-full p-4 rounded-xl outline-none"><button onclick="handleBet(1)" class="bet-btn">BET</button></div>
        </div>
    </div>

    <div id="walletPage" class="page p-5">
        <div class="space-y-3 mb-6">
            <p class="text-[10px] font-bold text-zinc-500 uppercase">Transfer To:</p>
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex justify-between items-center" onclick="copy('1000179571815', 'CBE')">
                <div><p class="text-[9px] text-blue-500 font-bold">CBE</p><p class="text-sm font-black">1000179571815</p></div>
                <i class="fas fa-copy text-zinc-600"></i>
            </div>
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex justify-between items-center" onclick="copy('165097254', 'Abyssinia')">
                <div><p class="text-[9px] text-yellow-500 font-bold">ABYSSINIA</p><p class="text-sm font-black">165097254</p></div>
                <i class="fas fa-copy text-zinc-600"></i>
            </div>
        </div>
        <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 space-y-4">
            <input type="number" id="depAmt" placeholder="Amount (ETB)" class="bg-black w-full p-4 rounded-xl outline-none border border-zinc-800">
            <input type="text" id="depFT" placeholder="FT Number / Transaction ID" class="bg-black w-full p-4 rounded-xl outline-none border border-zinc-800">
            <button onclick="requestDep()" class="w-full bg-blue-600 py-4 rounded-xl font-black text-xs uppercase">Submit Deposit</button>
        </div>
    </div>

    <div id="topPage" class="page p-4">
        <div class="podium-container">
            <div class="podium-box rank-2">
                <span class="text-2xl mb-1">🥈</span>
                <p class="text-[8px] font-bold text-zinc-400">Tsega.A</p>
                <p class="text-[10px] font-black">15,400</p>
            </div>
            <div class="podium-box rank-1">
                <span class="crown-icon">👑</span>
                <p class="text-[9px] font-bold text-yellow-500 uppercase">Dawit.W</p>
                <p class="text-xs font-black">32,100</p>
            </div>
            <div class="podium-box rank-3">
                <span class="text-2xl mb-1">🥉</span>
                <p class="text-[8px] font-bold text-zinc-400">Bekele.D</p>
                <p class="text-[10px] font-black">12,800</p>
            </div>
        </div>
        <div id="leadersList" class="space-y-2 mt-4">
            </div>
    </div>

    <div id="adminPage" class="page p-5">
        <h2 class="text-center font-black text-red-500 mb-6 uppercase">Admin Panel</h2>
        <div id="requestsBox" class="space-y-3"></div>
    </div>

    <div id="profilePage" class="page p-10 text-center">
        <img id="uPic" src="https://via.placeholder.com/150" class="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-green-600">
        <h2 id="uName" class="font-black text-xl mb-4 uppercase tracking-tighter">NAHOM</h2>
        <div class="bg-zinc-900 p-8 rounded-3xl mb-8 border border-zinc-800">
            <p id="pBal" class="text-5xl font-black text-green-500">0.00</p>
            <p class="text-[8px] text-zinc-500 uppercase mt-2">Available Balance</p>
        </div>
        <button id="adminBtn" onclick="showPage('admin')" class="hidden w-full bg-yellow-600 py-4 rounded-xl font-black text-xs uppercase">Open Admin Panel</button>
    </div>

    <nav class="fixed bottom-0 w-full h-20 bg-black border-t border-zinc-900 flex justify-around items-center z-[2000] pb-5">
        <div onclick="showPage('play')" id="n-play" class="text-red-600 flex flex-col items-center"><i class="fas fa-rocket"></i><span class="text-[8px] mt-1">GAME</span></div>
        <div onclick="showPage('wallet')" id="n-wallet" class="flex flex-col items-center"><i class="fas fa-wallet"></i><span class="text-[8px] mt-1">WALLET</span></div>
        <div onclick="showPage('top')" id="n-top" class="flex flex-col items-center"><i class="fas fa-trophy"></i><span class="text-[8px] mt-1">LEADERS</span></div>
        <div onclick="showPage('profile')" id="n-profile" class="flex flex-col items-center"><i class="fas fa-user"></i><span class="text-[8px] mt-1">ME</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = 12345678; // ያንተን ID እዚህ ጋር ቀይረው
        let user = tg.initDataUnsafe.user || { id: 12345678, first_name: "Nahom" };
        let db = JSON.parse(localStorage.getItem('world_podium_db')) || { bal: 0.0, reqs: [] };

        function requestDep() {
            const a = document.getElementById('depAmt').value;
            const f = document.getElementById('depFT').value;
            if(!a || !f) return alert("Fill all fields!");
            db.reqs.push({ id: Date.now(), user: user.first_name, amt: parseFloat(a), ft: f });
            save(); toast("Sent to Admin Panel! ✅");
        }

        function adminDo(id, act) {
            const i = db.reqs.findIndex(r => r.id === id);
            if(act === 'ok') db.bal += db.reqs[i].amt;
            db.reqs.splice(i, 1);
            save(); renderAdmin();
        }

        function renderAdmin() {
            const b = document.getElementById('requestsBox');
            if(db.reqs.length === 0) { b.innerHTML = `<p class="text-zinc-600 text-center text-[10px]">No pending requests.</p>`; return; }
            b.innerHTML = db.reqs.map(r => `
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex justify-between items-center">
                    <div><p class="text-xs font-black uppercase">${r.user}</p><p class="text-green-500 font-bold">${r.amt} ETB</p><p class="text-[8px] text-zinc-500">FT: ${r.ft}</p></div>
                    <div class="flex gap-2"><button onclick="adminDo(${r.id},'ok')" class="bg-green-600 px-3 py-2 rounded-lg text-[10px] font-black">OK</button><button onclick="adminDo(${r.id},'no')" class="bg-red-600 px-3 py-2 rounded-lg text-[10px] font-black">X</button></div>
                </div>`).join('');
        }

        function renderTop() {
            const list = document.getElementById('leadersList');
            const data = ["Hana.G", "Elias.T", "Sara.M", "Yonas.K", "Betty.S", "Miki.Y", "Abel.Z"];
            list.innerHTML = data.map((n, i) => `
                <div class="bg-zinc-900/40 p-3 rounded-xl flex justify-between items-center border border-zinc-800 mx-2">
                    <span class="text-[10px] font-bold text-zinc-500">#${i+4} ${n}</span>
                    <span class="text-white font-black text-xs">${(10000 - i*1000).toLocaleString()} ETB</span>
                </div>`).join('');
        }

        function save() { localStorage.setItem('world_podium_db', JSON.stringify(db)); refresh(); }
        function refresh() { document.getElementById('topBal').innerText = db.bal.toFixed(2); document.getElementById('pBal').innerText = db.bal.toFixed(2); }
        function toast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); }
        function copy(t, b) { navigator.clipboard.writeText(t); toast(b + " Copied! ✅"); }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active-page'));
            document.getElementById(p+'Page').classList.add('active-page');
            document.querySelectorAll('nav div').forEach(el => el.classList.remove('text-red-600'));
            if(document.getElementById('n-'+p)) document.getElementById('n-'+p).classList.add('text-red-600');
            if(p === 'admin') renderAdmin();
            if(p === 'top') renderTop();
        }

        window.onload = () => {
            document.getElementById('hName').innerText = user.first_name;
            document.getElementById('uName').innerText = user.first_name;
            if(user.id === ADMIN_ID) document.getElementById('adminBtn').classList.remove('hidden');
            
            let m = 1.0;
            setInterval(() => {
                if(m < 3.0) { m += 0.07; document.getElementById('multiplier').innerText = m.toFixed(2) + "x"; }
                else { m = 1.0; }
            }, 100);
            refresh();
        };
    </script>
</body>
</html>
