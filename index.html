<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator ETB</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        /* የጨዋታው ሜዳ */
        #game-container {
            width: 95%;
            max-width: 500px;
            height: 300px;
            background: radial-gradient(circle, #1a1a1a, #000);
            position: relative;
            margin-top: 20px;
            border-radius: 15px;
            border: 2px solid #333;
            overflow: hidden;
        }

        /* አውሮፕላኑ */
        #plane {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 50px;
            z-index: 10;
            transition: transform 0.1s linear;
        }

        /* ቀይ መስመር (Path) */
        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* የጥላው ተጽዕኖ */
        #shadow {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to top, rgba(255, 0, 0, 0.2), transparent);
            display: none;
        }

        /* ውጤቱ (Multiplier) */
        #multiplier {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            z-index: 20;
        }

        #status-text {
            color: #ff0000;
            display: none;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        /* የውርርድ ቦታዎች (Betting Panels) */
        .bet-section {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            width: 95%;
            max-width: 500px;
        }

        .bet-card {
            flex: 1;
            background: #222;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #444;
        }

        input {
            width: 80%;
            background: #000;
            border: 1px solid #555;
            color: #fff;
            padding: 5px;
            margin-bottom: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .bet-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .bet-btn.cashout {
            background-color: #ffc107;
            color: black;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="line-canvas"></canvas>
        <div id="shadow"></div>
        <div id="multiplier">1.00x</div>
        <img id="plane" src="https://img.icons8.com/color/96/000000/fighter-jet.png" alt="plane">
    </div>
    <div id="status-text">FLEW AWAY!</div>

    <div class="bet-section">
        <div class="bet-card">
            <input type="number" id="bet1" value="10.00">
            <button id="btn1" class="bet-btn" onclick="handleBet(1)">BET<br><span id="val1">10.00 ETB</span></button>
        </div>
        <div class="bet-card">
            <input type="number" id="bet2" value="10.00">
            <button id="btn2" class="bet-btn" onclick="handleBet(2)">BET<br><span id="val2">10.00 ETB</span></button>
        </div>
    </div>

    <script>
        let multiplier = 1.00;
        let isFlying = false;
        let crashPoint = 0;
        let gameInterval;
        const plane = document.getElementById('plane');
        const multText = document.getElementById('multiplier');
        const statusText = document.getElementById('status-text');
        const shadow = document.getElementById('shadow');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        function generateCrashPoint() {
            let r = Math.random();
            return Math.max(1.0, (0.98 / (1.0 - r))).toFixed(2);
        }

        function startRound() {
            resetGame();
            crashPoint = generateCrashPoint();
            isFlying = true;
            shadow.style.display = 'block';
            
            gameInterval = setInterval(() => {
                if (multiplier < crashPoint) {
                    multiplier += 0.01;
                    updateUI();
                } else {
                    endRound();
                }
            }, 50);
        }

        function updateUI() {
            multText.innerText = multiplier.toFixed(2) + "x";
            multText.style.color = "white";
            
            // አውሮፕላኑን ወደ ላይ ማንቀሳቀስ
            let x = (multiplier - 1) * 40;
            let y = (multiplier - 1) * 20;
            plane.style.transform = `translate(${x}px, -${y}px)`;

            // ቀይ መስመር መሳል
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = "red";
            ctx.lineWidth = 3;
            ctx.moveTo(20, canvas.height - 20);
            ctx.lineTo(20 + x, canvas.height - 20 - y);
            ctx.stroke();
        }

        function endRound() {
            clearInterval(gameInterval);
            isFlying = false;
            multText.style.color = "red";
            statusText.style.display = "block";
            statusText.innerText = "FLEW AWAY!";
            shadow.style.display = 'none';
            
            setTimeout(startRound, 3000); // ከ3 ሰከንድ በኋላ አዲስ ዙር
        }

        function resetGame() {
            multiplier = 1.00;
            statusText.style.display = "none";
            plane.style.transform = `translate(0px, 0px)`;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function handleBet(num) {
            let btn = document.getElementById('btn' + num);
            if (btn.innerText.includes("BET")) {
                btn.innerText = "CASH OUT";
                btn.classList.add('cashout');
            } else {
                let amount = document.getElementById('bet' + num).value;
                alert((amount * multiplier).toFixed(2) + " ETB አሸንፈዋል!");
                btn.innerText = "BET";
                btn.classList.remove('cashout');
            }
        }

        // ጨዋታውን በራሱ እንዲጀምር
        startRound();
    </script>
</body>
</html>
