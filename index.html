<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Telegram Dating Premium | Global Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.2s ease; }
        :root {
            --bg-body: #f8fafc; --bg-card: #ffffff; --text-primary: #0f172a;
            --text-secondary: #334155; --border: #e2e8f0; --accent: #ff477e;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        body.dark {
            --bg-body: #0a0f1e; --bg-card: #1e293b; --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1; --border: #2d3a5e;
        }
        body { background: var(--bg-body); color: var(--text-primary); font-family: 'Inter', sans-serif; }
        .app-container { max-width: 550px; margin: 0 auto; background: var(--bg-body); min-height: 100vh; padding-bottom: 80px; }
        .header { background: var(--bg-card); padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #ff477e, #ff9f4a); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 550px; margin: 0 auto; background: var(--bg-card); display: flex; justify-content: space-around; padding: 10px 20px 24px; border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { background: none; border: none; color: var(--text-secondary); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #ff477e; }
        .tab-content { display: none; padding: 20px 16px; animation: fade 0.2s; }
        .tab-content.active-tab { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .glass-card { background: var(--bg-card); border-radius: 28px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .btn-primary { background: linear-gradient(105deg, #ff477e, #ff8c42); border: none; color: white; font-weight: 600; padding: 12px; border-radius: 60px; width: 100%; cursor: pointer; }
        .btn-outline { background: transparent; border: 1.5px solid #ff477e; color: #ff477e; padding: 8px 16px; border-radius: 60px; cursor: pointer; }
        input, select, textarea { width: 100%; padding: 12px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--bg-card); margin-bottom: 14px; outline: none; }
        .swipe-card { background: var(--bg-card); border-radius: 32px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; }
        .swipe-photo { height: 380px; background-size: cover; background-position: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .vip-badge { background: gold; color: #1e293b; padding: 4px 12px; border-radius: 40px; font-size: 11px; font-weight: bold; }
        .online-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; display: inline-block; margin-left: 8px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header"><div class="logo">💖 Telegram Dating</div><button class="theme-toggle" id="themeToggleBtn" style="background:none; border:1px solid var(--border); border-radius:40px; padding:6px 12px;">🌙</button></div>

    <!-- Auth Modal -->
    <div id="authModal" class="glass-card" style="margin:20px 16px; text-align:center;">
        <i class="fab fa-telegram" style="font-size: 56px; color: #ff477e;"></i>
        <h2>Welcome to Telegram Dating</h2>
        <div id="authTabs" class="flex-between" style="margin: 20px 0;"><button id="showLoginTab" class="btn-outline" style="flex:1; margin-right:8px;">Login</button><button id="showSignupTab" class="btn-outline" style="flex:1;">Sign Up</button></div>
        <div id="loginForm"><input type="email" id="loginEmail" placeholder="Email"><input type="password" id="loginPassword" placeholder="Password"><button id="doLoginBtn" class="btn-primary">Login</button><button id="googleLoginBtn" class="btn-outline" style="margin-top:10px;"><i class="fab fa-google"></i> Continue with Google</button><button id="telegramLoginBtn" class="btn-outline" style="margin-top:10px;"><i class="fab fa-telegram"></i> Continue with Telegram</button></div>
        <div id="signupForm" style="display:none;"><input type="text" id="signupName" placeholder="Full Name"><input type="email" id="signupEmail" placeholder="Email"><input type="password" id="signupPassword" placeholder="Password"><select id="signupGender"><option>Female</option><option>Male</option></select><input type="text" id="signupLocation" placeholder="City (e.g., Addis Ababa)"><button id="doSignupBtn" class="btn-primary">Create Account</button></div>
    </div>

    <!-- Main App -->
    <div id="mainApp" style="display:none;">
        <div class="bottom-nav">
            <button class="nav-item active" data-tab="home"><i class="fas fa-home"></i><span>Home</span></button>
            <button class="nav-item" data-tab="match"><i class="fas fa-heart"></i><span>Match</span></button>
            <button class="nav-item" data-tab="chat"><i class="fas fa-comment-dots"></i><span>Chat</span></button>
            <button class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Profile</span></button>
        </div>
        <div id="homeTab" class="tab-content active-tab"><h3>💬 Feed</h3><div id="postsFeed"><div class="glass-card">Welcome to Telegram Dating! Start matching now.</div></div></div>
        <div id="matchTab" class="tab-content"><h3>✨ Discover Nearby</h3><div id="matchContainer"></div></div>
        <div id="chatTab" class="tab-content"><h3>💬 Messages</h3><div id="chatsList"></div><div id="chatDetail" style="display:none;"><div class="flex-between"><button id="backToChats" class="btn-outline">← Back</button><span id="chatUserName"></span><span id="chatUserStatus"></span></div><div id="chatMessagesArea" style="height:300px; overflow-y:auto; margin:12px 0;"></div><div class="flex-between" style="gap:8px;"><input type="text" id="chatInput" placeholder="Type a message..."><button id="sendChatMsgBtn" class="btn-primary" style="width:auto; padding:10px 18px;">Send</button></div></div></div>
        <div id="profileTab" class="tab-content"><div class="glass-card" style="text-align:center;"><img id="profilePhoto" src="https://randomuser.me/api/portraits/women/68.jpg" style="width:100px;height:100px;border-radius:50%;"><h3 id="profileName"></h3><p id="profileLocation"></p><p id="profileBio"></p><p id="profileInterests"></p><button id="editProfileBtn" class="btn-outline">Edit Profile</button><button id="upgradeVipBtn" class="btn-primary" style="margin-top:12px;">👑 Upgrade VIP - $9.99/mo</button><button id="logoutBtn" class="btn-outline" style="margin-top:12px;">Logout</button></div></div>
    </div>
</div>

<script>
    // ========== FIREBASE CONFIG (Replace with your own) ==========
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // ========== GLOBAL STATE ==========
    let currentUser = null;
    let currentUserData = null;
    let currentChatWith = null;
    let usersCache = [];

    // Auth UI Toggle
    document.getElementById("showLoginTab").onclick = () => { document.getElementById("loginForm").style.display = "block"; document.getElementById("signupForm").style.display = "none"; };
    document.getElementById("showSignupTab").onclick = () => { document.getElementById("loginForm").style.display = "none"; document.getElementById("signupForm").style.display = "block"; };

    // Signup
    document.getElementById("doSignupBtn").onclick = async () => {
        const email = document.getElementById("signupEmail").value;
        const password = document.getElementById("signupPassword").value;
        const name = document.getElementById("signupName").value;
        const gender = document.getElementById("signupGender").value;
        const location = document.getElementById("signupLocation").value;
        try {
            const cred = await auth.createUserWithEmailAndPassword(email, password);
            await db.collection("users").doc(cred.user.uid).set({
                uid: cred.user.uid, name, email, gender, location, bio: "New to Telegram Dating!", interests: "", photo: "https://randomuser.me/api/portraits/women/68.jpg", vip: false, coins: 100, likes: [], matches: [], online: true, lastSeen: Date.now()
            });
            alert("Account created! Please login.");
        } catch(e) { alert(e.message); }
    };

    // Login
    document.getElementById("doLoginBtn").onclick = async () => {
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;
        try {
            await auth.signInWithEmailAndPassword(email, password);
        } catch(e) { alert(e.message); }
    };

    // Google Login
    document.getElementById("googleLoginBtn").onclick = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        try { await auth.signInWithPopup(provider); } catch(e) { alert(e.message); }
    };

    // Telegram Login Simulated (redirect would go here)
    document.getElementById("telegramLoginBtn").onclick = () => { alert("Telegram login: In production, use Telegram Login Widget"); };

    // Auth State Listener
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            const doc = await db.collection("users").doc(user.uid).get();
            if (doc.exists) currentUserData = doc.data();
            else { currentUserData = { uid: user.uid, name: user.email.split('@')[0], email: user.email, gender: "Female", location: "Addis Ababa", bio: "Love to meet new people!", interests: "", photo: "https://randomuser.me/api/portraits/women/68.jpg", vip: false, coins: 100, likes: [], matches: [], online: true, lastSeen: Date.now() }; await db.collection("users").doc(user.uid).set(currentUserData); }
            await db.collection("users").doc(user.uid).update({ online: true, lastSeen: Date.now() });
            document.getElementById("authModal").style.display = "none";
            document.getElementById("mainApp").style.display = "block";
            loadUsers(); renderProfile(); renderMatch(); renderChatsList();
            // Set online status on disconnect
            window.addEventListener("beforeunload", () => { db.collection("users").doc(user.uid).update({ online: false, lastSeen: Date.now() }); });
        } else {
            document.getElementById("authModal").style.display = "block";
            document.getElementById("mainApp").style.display = "none";
        }
    });

    async function loadUsers() { const snap = await db.collection("users").get(); usersCache = snap.docs.map(d => d.data()); }
    function renderProfile() { if(!currentUserData) return; document.getElementById("profileName").innerHTML = currentUserData.name + (currentUserData.vip ? ' <span class="vip-badge">VIP</span>' : ''); document.getElementById("profileLocation").innerHTML = `<i class="fas fa-map-marker-alt"></i> ${currentUserData.location}`; document.getElementById("profileBio").innerHTML = currentUserData.bio; document.getElementById("profileInterests").innerHTML = `<i class="fas fa-tag"></i> ${currentUserData.interests || "Add interests"}`; document.getElementById("profilePhoto").src = currentUserData.photo; }
    document.getElementById("editProfileBtn").onclick = () => { const newBio = prompt("Edit Bio:", currentUserData.bio); if(newBio) { currentUserData.bio = newBio; db.collection("users").doc(currentUser.uid).update({ bio: newBio }); renderProfile(); } };
    document.getElementById("upgradeVipBtn").onclick = async () => { if(confirm("Upgrade to VIP for $9.99/month?")) { currentUserData.vip = true; await db.collection("users").doc(currentUser.uid).update({ vip: true, coins: firebase.firestore.FieldValue.increment(500) }); alert("VIP Activated! +500 coins"); renderProfile(); } };
    document.getElementById("logoutBtn").onclick = async () => { await db.collection("users").doc(currentUser.uid).update({ online: false }); await auth.signOut(); location.reload(); };

    // Matching System (Tinder Style)
    async function renderMatch() {
        const others = usersCache.filter(u => u.uid !== currentUser.uid && !currentUserData.likes?.includes(u.uid) && !currentUserData.matches?.includes(u.uid));
        if(others.length === 0) { document.getElementById("matchContainer").innerHTML = "<div class='glass-card'>No more profiles!</div>"; return; }
        const p = others[0];
        document.getElementById("matchContainer").innerHTML = `<div class="swipe-card"><div class="swipe-photo" style="background-image: url('${p.photo}');"></div><div style="padding:20px;"><h3>${p.name}, ${p.age || 25}</h3><p>${p.bio}</p><div style="display:flex; gap:16px;"><button id="likeBtn" class="btn-primary" style="flex:1;">❤️ Like</button><button id="superlikeBtn" class="btn-outline" style="flex:1;">⭐ Super Like</button><button id="passBtn" class="btn-outline" style="flex:1;">❌ Pass</button></div></div></div>`;
        document.getElementById("likeBtn").onclick = async () => { await handleLike(p.uid, false); renderMatch(); };
        document.getElementById("superlikeBtn").onclick = async () => { if(currentUserData.vip || currentUserData.coins >= 50) { await handleLike(p.uid, true); if(!currentUserData.vip) await db.collection("users").doc(currentUser.uid).update({ coins: currentUserData.coins - 50 }); renderMatch(); } else alert("VIP or 50 coins required for Super Like!"); };
        document.getElementById("passBtn").onclick = () => renderMatch();
    }
    async function handleLike(targetUid, isSuper) {
        const target = usersCache.find(u => u.uid === targetUid);
        if(target.likes?.includes(currentUser.uid)) {
            // Mutual match!
            await db.collection("users").doc(currentUser.uid).update({ matches: firebase.firestore.FieldValue.arrayUnion(targetUid) });
            await db.collection("users").doc(targetUid).update({ matches: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
            alert(`🎉 It's a match with ${target.name}! Start chatting.`);
        } else {
            await db.collection("users").doc(currentUser.uid).update({ likes: firebase.firestore.FieldValue.arrayUnion(targetUid) });
            alert(`👍 You liked ${target.name}${isSuper ? ' with Super Like!' : ''}`);
        }
        loadUsers();
    }

    // Chat System
    async function renderChatsList() {
        const matches = usersCache.filter(u => currentUserData.matches?.includes(u.uid));
        const container = document.getElementById("chatsList");
        if(matches.length === 0) { container.innerHTML = "<div class='glass-card'>No matches yet. Swipe to connect!</div>"; return; }
        container.innerHTML = matches.map(u => `<div class="glass-card" data-uid="${u.uid}" style="cursor:pointer;"><div class="flex-between"><div><strong>${u.name}</strong> ${u.online ? '<span class="online-dot"></span>' : ''}<br><small>${u.location}</small></div><i class="fas fa-comment"></i></div></div>`).join('');
        document.querySelectorAll("[data-uid]").forEach(el => el.onclick = () => openChat(el.getAttribute("data-uid")));
    }
    async function openChat(otherId) {
        currentChatWith = otherId;
        const other = usersCache.find(u => u.uid === otherId);
        document.getElementById("chatUserName").innerHTML = other.name; document.getElementById("chatUserStatus").innerHTML = other.online ? '<span class="online-dot"></span> Online' : 'Offline';
        document.getElementById("chatsList").style.display = "none"; document.getElementById("chatDetail").style.display = "block";
        const snap = await db.collection("chats").where("participants", "array-contains", currentUser.uid).get();
        let chatId = null;
        snap.forEach(doc => { if(doc.data().participants.includes(otherId)) chatId = doc.id; });
        if(!chatId) { const newChat = await db.collection("chats").add({ participants: [currentUser.uid, otherId], messages: [] }); chatId = newChat.id; }
        db.collection("chats").doc(chatId).onSnapshot((doc) => { if(doc.exists) { const data = doc.data(); const messagesDiv = document.getElementById("chatMessagesArea"); messagesDiv.innerHTML = (data.messages || []).map(m => `<div style="text-align:${m.from === currentUser.uid ? 'right' : 'left'}; margin:8px;"><span style="background:${m.from === currentUser.uid ? '#ff477e' : 'var(--border)'}; padding:8px 14px; border-radius:20px; display:inline-block;">${m.text}</span></div>`).join(''); messagesDiv.scrollTop = messagesDiv.scrollHeight; } });
    }
    document.getElementById("sendChatMsgBtn").onclick = async () => {
        if(!currentChatWith) return;
        const text = document.getElementById("chatInput").value.trim();
        if(!text) return;
        const snap = await db.collection("chats").where("participants", "array-contains", currentUser.uid).get();
        let chatId = null;
        snap.forEach(doc => { if(doc.data().participants.includes(currentChatWith)) chatId = doc.id; });
        if(chatId) { await db.collection("chats").doc(chatId).update({ messages: firebase.firestore.FieldValue.arrayUnion({ from: currentUser.uid, text, timestamp: Date.now() }) }); }
        document.getElementById("chatInput").value = "";
    };
    document.getElementById("backToChats").onclick = () => { document.getElementById("chatDetail").style.display = "none"; document.getElementById("chatsList").style.display = "block"; currentChatWith = null; };

    // Theme Toggle
    let isDark = false;
    document.getElementById("themeToggleBtn").onclick = () => { isDark = !isDark; if(isDark) document.body.classList.add("dark"); else document.body.classList.remove("dark"); };

    // Tab switching
    document.querySelectorAll(".nav-item").forEach(btn => { btn.onclick = () => { document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active")); btn.classList.add("active"); const tab = btn.getAttribute("data-tab"); document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active-tab")); document.getElementById(`${tab}Tab`).classList.add("active-tab"); if(tab === "match") renderMatch(); if(tab === "chat") renderChatsList(); }; });
</script>
</body>
</html>
