<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>World Dating | Signup & Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #03060c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Main container */
        .auth-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Card style */
        .auth-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 40px 36px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s;
            animation: fadeSlideUp 0.5s ease;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.6);
        }

        /* Logo / header */
        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d6d, #ff9f4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #99a4c2;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        /* Form styling */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #e2e8f0;
            font-size: 0.85rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1.5px solid #2d3a5e;
            background: #020617cc;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #ff4d6d;
            box-shadow: 0 0 0 3px rgba(255, 77, 109, 0.2);
        }

        /* Password toggle */
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #99a4c2;
            font-size: 1.1rem;
        }

        /* Button */
        .btn-primary {
            background: linear-gradient(105deg, #ff4d6d, #ff8a4a);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 8px;
            box-shadow: 0 8px 18px -5px rgba(255, 77, 109, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px -8px rgba(255, 77, 109, 0.5);
        }

        /* Switch link */
        .switch-link {
            text-align: center;
            margin-top: 28px;
            color: #99a4c2;
            font-size: 0.9rem;
        }

        .switch-link a {
            color: #ff4d6d;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        /* Form transition */
        .form-container {
            transition: opacity 0.25s ease;
        }

        .hidden-form {
            display: none;
        }

        /* Footer extra */
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.7rem;
            color: #5a6a8a;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .auth-card {
                padding: 32px 24px;
            }
            .logo h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="logo">
            <h1>🌍 World Dating</h1>
            <p>Find love across borders</p>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" class="form-container">
            <form id="signupFormElement">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="e.g., Elena Rodriguez" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="18+" min="18" max="100" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailSignup" placeholder="hello@worlddating.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordSignup" placeholder="••••••" required>
                        <i class="far fa-eye toggle-password" data-target="passwordSignup"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="••••••" required>
                        <i class="far fa-eye toggle-password" data-target="confirmPassword"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Sign Up</button>
                <div class="switch-link">
                    Already have an account? <a id="showLoginBtn">Login</a>
                </div>
            </form>
        </div>

        <!-- LOGIN FORM (UI only) -->
        <div id="loginForm" class="form-container hidden-form">
            <form id="loginFormElement">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailLogin" placeholder="hello@worlddating.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordLogin" placeholder="••••••">
                        <i class="far fa-eye toggle-password" data-target="passwordLogin"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <div class="switch-link">
                    Don't have an account? <a id="showSignupBtn">Sign Up</a>
                </div>
            </form>
        </div>
        <div class="footer-note">
            <i class="fas fa-heart" style="color:#ff4d6d;"></i> Join millions of singles worldwide
        </div>
    </div>
</div>

<script>
    // Toggle between Signup and Login forms
    const signupFormContainer = document.getElementById('signupForm');
    const loginFormContainer = document.getElementById('loginForm');
    const showLoginBtn = document.getElementById('showLoginBtn');
    const showSignupBtn = document.getElementById('showSignupBtn');

    function showSignup() {
        signupFormContainer.classList.remove('hidden-form');
        loginFormContainer.classList.add('hidden-form');
    }

    function showLogin() {
        loginFormContainer.classList.remove('hidden-form');
        signupFormContainer.classList.add('hidden-form');
    }

    if (showLoginBtn) showLoginBtn.addEventListener('click', showLogin);
    if (showSignupBtn) showSignupBtn.addEventListener('click', showSignup);

    // Password show/hide toggle for all password fields
    const toggleIcons = document.querySelectorAll('.toggle-password');
    toggleIcons.forEach(icon => {
        icon.addEventListener('click', function () {
            const targetId = this.getAttribute('data-target');
            const passwordInput = document.getElementById(targetId);
            if (passwordInput) {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye-slash');
            }
        });
    });

    // SIGNUP form validation (demo purposes only, UI feedback)
    const signupForm = document.getElementById('signupFormElement');
    if (signupForm) {
        signupForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const age = document.getElementById('age').value;
            const email = document.getElementById('emailSignup').value.trim();
            const password = document.getElementById('passwordSignup').value;
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (!fullName || !age || !email || !password || !confirmPwd) {
                alert("❌ Please fill in all fields.");
                return;
            }
            if (password !== confirmPwd) {
                alert("❌ Passwords do not match.");
                return;
            }
            if (password.length < 6) {
                alert("❌ Password must be at least 6 characters.");
                return;
            }
            if (age < 18 || age > 100) {
                alert("❌ Age must be between 18 and 100.");
                return;
            }
            // Simple email regex
            const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("❌ Please enter a valid email address.");
                return;
            }
            // Success demo message
            alert(`🎉 Welcome to World Dating, ${fullName}! Your account has been created. (Demo)`);
            // Optionally reset form or switch to login
            signupForm.reset();
            // Switch to login after signup success (optional)
            showLogin();
        });
    }

    // LOGIN form (UI only with demo feedback)
    const loginForm = document.getElementById('loginFormElement');
    if (loginForm) {
        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('emailLogin').value.trim();
            const password = document.getElementById('passwordLogin').value;
            if (!email || !password) {
                alert("❌ Please enter both email and password.");
                return;
            }
            alert(`✨ Welcome back! You've successfully logged in to World Dating. (Demo UI)`);
            // In a real app, you would redirect or authenticate.
            loginForm.reset();
        });
    }

    // Extra: Smooth placeholder effect + live age validation on input
    const ageInput = document.getElementById('age');
    if (ageInput) {
        ageInput.addEventListener('input', function () {
            let val = parseInt(this.value);
            if (val < 18) this.value = 18;
            if (val > 100) this.value = 100;
        });
    }

    // Pre-fill demo data for quick preview (optional)
    // Not auto-filling to keep clean but can add placeholder demo
    console.log("World Dating Auth Module Ready — Dark theme, responsive, toggle ready.");
</script>
</body>
</html>
