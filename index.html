<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorldDating | Global Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #8b5cf6; --secondary: #ec4899; --bg: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #1e293b; overflow: hidden; }
        .page { display: none; height: 100vh; padding-bottom: 90px; overflow-y: auto; }
        .page.active { display: block; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .nav-bar { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); z-index: 100; justify-content: space-around; padding: 12px 0; }
        .nav-item { color: #94a3b8; font-size: 1.2rem; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: scale(1.2); }
        .input-box { width: 100%; padding: 16px; border-radius: 16px; background: white; border: 1px solid #e2e8f0; outline: none; margin-bottom: 12px; }
        .btn-main { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; padding: 16px; border-radius: 16px; font-weight: 700; width: 100%; box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.3); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="login-page" class="page active px-8 pt-24 text-center">
        <div class="mb-10 text-center">
            <div class="w-20 h-20 bg-violet-100 text-violet-600 rounded-3xl flex items-center justify-center mx-auto mb-6 rotate-12">
                <i class="fas fa-heart text-4xl"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight">WorldDating</h1>
            <p class="text-slate-500 mt-2">Connect with the world today.</p>
        </div>
        <input type="email" id="l-email" placeholder="Email Address" class="input-box">
        <input type="password" id="l-pass" placeholder="Password" class="input-box">
        <button onclick="authLogin()" class="btn-main mt-4">Sign In</button>
        <p class="mt-8 text-slate-500">New explorer? <span onclick="showPage('signup-page')" class="text-violet-600 font-bold cursor-pointer underline">Join Now</span></p>
    </div>

    <div id="signup-page" class="page px-8 pt-10">
        <h2 class="text-3xl font-extrabold mb-8">Create Profile</h2>
        <input type="text" id="r-name" placeholder="Full Name" class="input-box">
        <div class="grid grid-cols-2 gap-3">
            <input type="number" id="r-age" placeholder="Age" class="input-box">
            <select id="r-gender" class="input-box">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <select id="r-country" class="input-box">
            <option value="">Select Country</option>
        </select>
        <input type="email" id="r-email" placeholder="Email" class="input-box">
        <input type="password" id="r-pass" placeholder="Password" class="input-box">
        <button onclick="authSignup()" class="btn-main mt-4">Start Journey</button>
    </div>

    <div id="home-page" class="page px-5 pt-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-extrabold">Discovery</h2>
            <i class="fas fa-plus-circle text-2xl text-violet-600"></i>
        </div>
        <div id="match-card" class="relative h-[580px] rounded-[32px] overflow-hidden bg-white shadow-xl">
            <img id="m-img" src="" class="w-full h-full object-cover">
            <div class="absolute bottom-0 w-full p-8 bg-gradient-to-t from-black/80 to-transparent">
                <h3 id="m-info" class="text-white text-3xl font-bold"></h3>
                <p id="m-country" class="text-slate-200"></p>
                <div class="flex gap-4 mt-8">
                    <button onclick="nextMatch()" class="flex-1 bg-white/20 p-4 rounded-2xl text-white"><i class="fas fa-times"></i></button>
                    <button onclick="nextMatch()" class="flex-1 bg-white p-4 rounded-2xl text-pink-600"><i class="fas fa-heart"></i></button>
                </div>
            </div>
        </div>
    </div>

    <nav id="nav-bar" class="nav-bar flex">
        <div onclick="showPage('home-page')" id="n-home" class="nav-item active"><i class="fas fa-compass"></i></div>
        <div onclick="showPage('message-page')" id="n-message" class="nav-item"><i class="fas fa-comment-dots"></i></div>
        <div onclick="showPage('profile-page')" id="n-profile" class="nav-item"><i class="fas fa-user"></i></div>
    </nav>
</div>

    const countrySelect = document.getElementById('r-country');
    countryList.forEach(c => {
        countrySelect.innerHTML += `<option value="${c.f} ${c.n}">${c.f} ${c.n}</option>`;
    });

    let userAccount = null;
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function authSignup() {
        const email = document.getElementById('r-email').value;
        const pass = document.getElementById('r-pass').value;
        const name = document.getElementById('r-name').value;
        const country = document.getElementById('r-country').value;
        if(!email || !pass) return alert("Fill all!");
        localStorage.setItem(email, JSON.stringify({name, email, pass, country, age: document.getElementById('r-age').value}));
        showPage('login-page');
    }

    function authLogin() {
        const email = document.getElementById('l-email').value;
        const pass = document.getElementById('l-pass').value;
        const stored = JSON.parse(localStorage.getItem(email));
        if(stored && stored.pass === pass) {
            userAccount = stored;
            document.getElementById('nav-bar').style.display = 'flex';
            showPage('home-page');
            loadMatch();
        } else { alert("Error!"); }
    }

    function loadMatch() {
        const m = {name: "Elena", age: 23, country: "🇪🇹 Ethiopia", img: "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=500"};
        document.getElementById('m-img').src = m.img;
        document.getElementById('m-info').innerText = `${m.name}, ${m.age}`;
        document.getElementById('m-country').innerText = m.country;
    }
    
    function nextMatch() { loadMatch(); }
</script>
</body>
</html>
