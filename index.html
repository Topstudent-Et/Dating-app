<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spribe Aviator Demo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #1e1e2f;
    color: #fff;
    margin: 0;
    padding: 0;
  }
  #game {
    margin-top: 50px;
  }
  #multiplier {
    font-size: 60px;
    margin: 20px 0;
  }
  button {
    padding: 10px 20px;
    font-size: 18px;
    margin: 5px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
  }
  #start { background-color: #4caf50; color: white; }
  #cashout { background-color: #f44336; color: white; }
</style>
</head>
<body>

<h1>Spribe Aviator Demo</h1>
<div id="game">
  <div id="multiplier">1.00x</div>
  <button id="start">Start</button>
  <button id="cashout" disabled>Cash Out</button>
</div>

<script>
let multiplierDisplay = document.getElementById('multiplier');
let startButton = document.getElementById('start');
let cashoutButton = document.getElementById('cashout');

let interval;
let multiplier = 1.00;
let running = false;

function getRandomGrowthRate() {
  // Simulates the unpredictability of Aviator
  return 1 + Math.random() * 5; // max multiplier ~6x
}

startButton.addEventListener('click', () => {
  if (running) return;
  running = true;
  multiplier = 1.00;
  multiplierDisplay.textContent = multiplier.toFixed(2) + "x";
  cashoutButton.disabled = false;

  let growthRate = getRandomGrowthRate();
  interval = setInterval(() => {
    multiplier *= 1.01; // multiplier increase
    multiplierDisplay.textContent = multiplier.toFixed(2) + "x";

    if (multiplier >= growthRate) {
      clearInterval(interval);
      multiplierDisplay.textContent += " 💥";
      cashoutButton.disabled = true;
      running = false;
    }
  }, 100); // update every 100ms
});

cashoutButton.addEventListener('click', () => {
  clearInterval(interval);
  alert("Cashed out at " + multiplier.toFixed(2) + "x!");
  cashoutButton.disabled = true;
  running = false;
});
</script>

</body>
</html>
