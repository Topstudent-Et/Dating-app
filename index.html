<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME - FINAL FIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* አውሮፕላኑ የሚበርበት ሜዳ */
        .game-canvas { height: 280px; background: radial-gradient(circle at bottom left, #2a0505, #000); border-radius: 24px; margin: 10px; position: relative; border: 1.5px solid #333; overflow: hidden; }
        #multiplier { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font-size: 3.8rem; font-weight: 900; font-family: 'Orbitron'; z-index: 10; color: #fff; transition: 0.1s; }
        #plane { position: absolute; font-size: 3.5rem; z-index: 5; transition: 0.2s linear; display: block; filter: drop-shadow(0 0 10px #f00); }
        
        .btn-bet { background: linear-gradient(180deg, #28a745, #1e7e34); border-bottom: 5px solid #145523; border-radius: 16px; transition: 0.1s; }
        .btn-cash { background: linear-gradient(180deg, #ffc107, #d39e00); color: #000; border-bottom: 5px solid #916c00; border-radius: 16px; }
        
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 120px; }
        .active-page { display: block; }
        .nav-item { color: #555; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .nav-item.active { color: #f00; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black">

    <header class="flex justify-between items-center p-4 bg-black/95 sticky top-0 z-[100] border-b border-zinc-900">
        <div class="font-game text-red-600 italic text-sm tracking-tighter">WORLD GAME</div>
        <div onclick="showPage('wallet')" class="bg-zinc-900 px-4 py-1.5 rounded-full border border-zinc-800 flex items-center gap-2">
            <span id="hBal" class="text-green-500 font-black text-sm">0.00</span>
            <i class="fas fa-wallet text-[10px] text-zinc-600"></i>
        </div>
    </header>

    <div id="playPage" class="page active-page">
        <div class="game-canvas">
            <div id="multiplier">1.00x</div>
            <div id="plane" style="left: 10%; bottom: 10%;">✈️</div>
            <div id="crashAlert" class="absolute inset-0 bg-black/90 hidden flex flex-col items-center justify-center z-50">
                <p class="text-zinc-500 font-bold text-xs">FLEW AWAY!</p>
                <h1 id="crashVal" class="text-red-600 font-game text-5xl italic">1.00x</h1>
            </div>
        </div>

        <div id="admKill" class="hidden px-3 mb-4">
            <button onclick="socket.emit('adminAction', {type: 'CRASH_NOW'})" class="w-full bg-red-600/20 text-red-500 border border-red-600 py-3 rounded-xl font-black text-xs">FORCE CRASH (ADMIN)</button>
        </div>

        <div class="grid grid-cols-1 gap-4 px-3">
            <div class="bg-zinc-900/60 p-5 rounded-[28px] border border-zinc-800 grid grid-cols-2 gap-4">
                <input type="number" id="a1" value="10" class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-center font-black text-xl outline-none">
                <button id="b1" onclick="handleBet(1)" class="btn-bet font-black text-xl italic uppercase">BET</button>
            </div>
            <div class="bg-zinc-900/60 p-5 rounded-[28px] border border-zinc-800 grid grid-cols-2 gap-4">
                <input type="number" id="a2" value="20" class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-center font-black text-xl outline-none">
                <button id="b2" onclick="handleBet(2)" class="btn-bet font-black text-xl italic uppercase">BET</button>
            </div>
        </div>
    </div>

    <div id="topPage" class="page p-6">
        <h2 class="text-center font-game text-yellow-500 mb-10 italic">TOP 50 WINNERS</h2>
        <div id="topList" class="space-y-3">
            <div class="bg-yellow-500/10 p-5 rounded-3xl border border-yellow-500 flex justify-between items-center">
                <span class="flex items-center gap-3"><span class="text-2xl">👑</span> Dawit Fikadu</span>
                <span class="font-black text-yellow-500">185,200</span>
            </div>
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-700 flex justify-between items-center">
                <span class="flex items-center gap-3"><span class="text-xl">🥈</span> Sara Solomon</span>
                <span class="font-black text-zinc-300">92,450</span>
            </div>
            <div class="bg-zinc-900 p-5 rounded-3xl border border-zinc-700 flex justify-between items-center">
                <span class="flex items-center gap-3"><span class="text-xl">🥉</span> Yonas Abel</span>
                <span class="font-black text-zinc-300">74,120</span>
            </div>
            <div id="extraTops"></div>
        </div>
    </div>

    <div id="walletPage" class="page p-6">
        <div class="flex bg-zinc-900 p-1.5 rounded-2xl mb-8 border border-zinc-800">
            <button onclick="setTab('D')" id="tabD" class="flex-1 py-4 bg-red-600 rounded-xl font-black text-xs">DEPOSIT</button>
            <button onclick="setTab('W')" id="tabW" class="flex-1 py-4 rounded-xl font-black text-xs text-zinc-500">WITHDRAW</button>
        </div>

        <div id="depArea" class="space-y-5">
            <div class="bg-zinc-900 p-6 rounded-[32px] border border-zinc-800 text-center">
                <p class="text-red-500 font-bold text-[10px] mb-2 uppercase italic">CBE Bank (ንግድ ባንክ)</p>
                <p class="text-2xl font-black tracking-widest mb-6 select-all">1000179571815</p>
                <hr class="border-zinc-800 mb-6">
                <p class="text-yellow-500 font-bold text-[10px] mb-2 uppercase italic">Abyssinia (አቢሲኒያ)</p>
                <p class="text-2xl font-black tracking-widest select-all">83920112</p>
            </div>
            <input type="number" id="dAmt" placeholder="Amount (ETB)" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl outline-none">
            <input type="text" id="dRef" placeholder="FT / Transaction ID" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl outline-none">
            <button onclick="sendReq('DEP')" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase">Send Deposit Request</button>
        </div>

        <div id="witArea" class="hidden space-y-5">
            <input type="number" id="wAmt" placeholder="Withdraw Amount" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl outline-none">
            <input type="text" id="wAcc" placeholder="Bank Account Number" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl outline-none">
            <button onclick="sendReq('WIT')" class="w-full bg-orange-600 py-5 rounded-2xl font-black uppercase">Request Withdraw</button>
        </div>
    </div>

    <div id="adminPage" class="page p-6">
        <h2 class="text-center font-game text-red-600 mb-8 italic uppercase">Admin Control</h2>
        <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 mb-6 grid grid-cols-2 gap-2 text-center">
            <div><p class="text-[8px] text-zinc-500">Total Profit</p><p id="netProf" class="text-green-500 font-black">0.00</p></div>
            <div><p class="text-[8px] text-zinc-500">Requests</p><p id="reqCount" class="text-blue-500 font-black">0</p></div>
        </div>
        <div id="adminInbox" class="space-y-3">
            <p class="text-center text-zinc-700 text-xs mt-10">ምንም ጥያቄ የለም...</p>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full h-[85px] bg-black border-t border-zinc-900 flex justify-around items-center z-[200] pb-5">
        <div onclick="showPage('play')" id="n-play" class="nav-item active"><i class="fas fa-plane-up text-xl"></i><span class="text-[9px] font-black uppercase">Play</span></div>
        <div onclick="showPage('top')" id="n-top" class="nav-item"><i class="fas fa-trophy text-xl"></i><span class="text-[9px] font-black uppercase">Winners</span></div>
        <div onclick="showPage('wallet')" id="n-wallet" class="nav-item"><i class="fas fa-wallet text-xl"></i><span class="text-[9px] font-black uppercase">Wallet</span></div>
        <div onclick="showPage('admin')" id="n-admin" class="nav-item hidden"><i class="fas fa-user-shield text-xl"></i><span class="text-[9px] font-black uppercase">Admin</span></div>
    </nav>

    <script>
        const socket = io();
        const tg = window.Telegram.WebApp;
        let u = tg.initDataUnsafe.user || { id: 777, first_name: "Dawit", username: "Dawit_Fikadu21" };
        
        let db = JSON.parse(localStorage.getItem('wg_final_v50_'+u.id)) || { bal: 0.0, games: 0 };
        let curM = 1.0, isRun = false, myBets = [null, null];

        // አውሮፕላኑ እንዲበር የሚያደርግ ኮድ
        socket.on('tick', (d) => {
            isRun = true;
            curM = parseFloat(d.mult);
            document.getElementById('multiplier').innerText = d.mult + "x";
            document.getElementById('crashAlert').classList.add('hidden');
            
            // አውሮፕላኑን የማንቀሳቀስያ ሎጂክ
            let x = Math.min((curM - 1) * 40, 80); // max 80% left
            let y = Math.min((curM - 1) * 30, 70); // max 70% bottom
            let plane = document.getElementById('plane');
            plane.style.left = (10 + x) + "%";
            plane.style.bottom = (10 + y) + "%";
            plane.style.transform = `rotate(${-y/2}deg)`;
        });

        socket.on('crash', (d) => {
            isRun = false; myBets = [null, null];
            document.getElementById('multiplier').innerText = "FLY AWAY!";
            document.getElementById('crashVal').innerText = d.point + "x";
            document.getElementById('crashAlert').classList.remove('hidden');
            btnR(1); btnR(2);
        });

        // ለአድሚን ጥያቄዎች እንዲደርሱ
        socket.on('adminInbox', (data) => {
            const box = document.getElementById('adminInbox');
            box.innerHTML = '';
            let reqs = data.reqs || [];
            document.getElementById('reqCount').innerText = reqs.length;
            
            if(reqs.length === 0) box.innerHTML = '<p class="text-center text-zinc-700 text-xs mt-10">ምንም ጥያቄ የለም...</p>';
            
            reqs.forEach((r, i) => {
                box.innerHTML += `
                    <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex justify-between items-center">
                        <div>
                            <p class="text-xs font-black ${r.type==='DEP'?'text-blue-500':'text-orange-500'}">${r.type}: ${r.amt} ETB</p>
                            <p class="text-[8px] text-zinc-500">${r.name} | ${r.ref}</p>
                        </div>
                        <button onclick="socket.emit('approveReq', ${i})" class="bg-green-600 px-4 py-2 rounded-lg text-[10px] font-black">APPROVE</button>
                    </div>`;
            });
        });

        function handleBet(id) {
            let a = parseFloat(document.getElementById('a'+id).value);
            if(!isRun && !myBets[id-1]) {
                if(db.bal < a) return alert("Insufficient Balance!");
                db.bal -= a; db.games++;
                myBets[id-1] = a;
                socket.emit('placeBet', { amt: a, name: u.first_name });
                btnS(id, 'WAIT');
            } else if(isRun && myBets[id-1]) {
                let win = myBets[id-1] * curM;
                db.bal += win;
                alert("Win! +" + win.toFixed(1));
                myBets[id-1] = null;
                btnS(id, 'BET');
            }
            refresh();
        }

        function sendReq(type) {
            let amt = parseFloat(document.getElementById(type==='DEP'?'dAmt':'wAmt').value);
            let ref = document.getElementById(type==='DEP'?'dRef':'wAcc').value;
            if(!amt || !ref) return alert("Please fill all fields!");
            
            // ወሳኝ፡ ለአድሚን እንዲልክ
            socket.emit('newRequest', { type, amt, ref, name: u.first_name });
            alert("Request sent to Admin dashboard!");
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(p+'Page').classList.add('active-page');
            document.getElementById('n-'+p).classList.add('active');
        }

        function setTab(t) {
            document.getElementById('tabD').className = t==='D' ? "flex-1 py-4 bg-red-600 rounded-xl font-black text-xs" : "flex-1 py-4 rounded-xl font-black text-xs text-zinc-500";
            document.getElementById('tabW').className = t==='W' ? "flex-1 py-4 bg-orange-600 rounded-xl font-black text-xs" : "flex-1 py-4 rounded-xl font-black text-xs text-zinc-500";
            document.getElementById('depArea').classList.toggle('hidden', t==='W');
            document.getElementById('witArea').classList.toggle('hidden', t==='D');
        }

        function refresh() {
            document.getElementById('hBal').innerText = db.bal.toFixed(2);
            localStorage.setItem('wg_final_v50_'+u.id, JSON.stringify(db));
        }

        function btnS(id, s) {
            let b = document.getElementById('b'+id);
            if(s==='WAIT') { b.innerText = "WAITING..."; b.className = "bg-zinc-800 text-zinc-600 rounded-xl font-black"; }
            else if(isRun && myBets[id-1]) { b.innerText = "CASHOUT"; b.className = "btn-cash font-black text-xl italic"; }
            else { b.innerText = "BET"; b.className = "btn-bet font-black text-xl italic"; }
        }
        function btnR(id) { btnS(id, 'BET'); }

        function renderTops() {
            const names = ["Bekele", "Sara", "Yonas", "Hanna", "Kaleb", "Lidiya", "Tigist", "Binyam", "Surafel", "Mulu", "Elias", "Rahel"];
            const box = document.getElementById('extraTops');
            for(let i=4; i<=50; i++) {
                box.innerHTML += `<div class="bg-zinc-900/40 p-5 rounded-3xl border border-zinc-900 flex justify-between items-center text-[11px] mb-2">
                    <span><span class="text-zinc-600 font-black mr-2">#${i}</span> ${names[i%names.length]} <i class="fas fa-check-circle text-blue-500 text-[10px]"></i></span>
                    <span class="font-black text-green-500">${(Math.random()*15000 + 1000).toLocaleString()}</span>
                </div>`;
            }
        }

        window.onload = () => {
            if(u.username === "Dawit_Fikadu21") {
                document.getElementById('n-admin').classList.remove('hidden');
                document.getElementById('admKill').classList.remove('hidden');
            }
            renderTops();
            refresh();
        };
    </script>
</body>
</html>
