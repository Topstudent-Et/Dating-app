<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Pro - Dai Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #ff003c;
            --secondary: #28a745;
            --bg: #0b0b0d;
            --panel: #1c1d22;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        .header {
            background: var(--panel);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .user-profile { display: flex; align-items: center; gap: 8px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--primary); background: #333; }
        .user-details { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; font-size: 13px; color: #fff; }
        
        .lang-btn { background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 2px 6px; font-size: 11px; cursor: pointer; }

        /* Wallet Section */
        .wallet-bar {
            background: #14151a;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #222;
        }

        .balance-display { font-size: 18px; font-weight: 900; color: var(--secondary); display: flex; align-items: center; gap: 5px; }

        .wallet-action { background: #222; border: 1px solid #444; color: white; border-radius: 8px; padding: 5px 15px; font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; }

        /* Game Area */
        .game-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #2a0505 0%, #000 100%);
            display: flex;
            flex-direction: column;
        }

        #history-bar { padding: 5px; display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; height: 25px; }
        .hist-tag { background: rgba(255, 255, 255, 0.1); padding: 2px 8px; border-radius: 10px; font-size: 10px; color: #ffc107; border: 0.5px solid #444; }

        #multiplier {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15vw;
            font-weight: 900;
            z-index: 10;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 0, 60, 0.7);
        }

        canvas { width: 100%; height: 100%; flex: 1; }

        /* Control Panel */
        .control-panel {
            background: var(--panel);
            padding: 15px;
            border-top: 1px solid #333;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-box { display: flex; flex-direction: column; gap: 4px; }
        .input-box label { font-size: 11px; color: #aaa; }
        input { background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; text-align: center; font-size: 16px; width: 85%; }

        .main-btn { border: none; border-radius: 12px; font-weight: 900; cursor: pointer; height: 55px; font-size: 20px; transition: 0.2s; }
        .btn-bet { background: var(--secondary); color: white; box-shadow: 0 4px 0 #1e7e34; }
        .btn-cash { background: #ffc107; color: black; box-shadow: 0 4px 0 #d39e00; display: none; }

        .game-title { color: var(--primary); font-weight: 900; text-align: center; font-size: 22px; margin: 0; letter-spacing: 2px; }

    </style>
</head>
<body>

    <audio id="sndJet" loop src="https://www.soundjay.com/transportation/sounds/jet-flying-1.mp3"></audio>
    <audio id="sndWin" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
    <audio id="sndExplode" src="https://www.soundjay.com/mechanical/sounds/explosion-02.mp3"></audio>

    <div class="header">
        <div class="user-profile">
            <img id="userImg" class="avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar">
            <div class="user-details">
                <span class="user-name" id="userName">Dai Player</span>
                <button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button>
            </div>
        </div>
        <h1 class="game-title">AVIATOR PRO</h1>
    </div>

    <div class="wallet-bar">
        <div class="balance-display" id="dispBal">0.00 ETB</div>
        <div style="display: flex; gap: 8px;">
            <button class="wallet-action" onclick="deposit()">💵 <span id="txtDep">Deposit</span></button>
            <button class="wallet-action" onclick="withdraw()">💸 <span id="txtWith">Withdraw</span></button>
        </div>
    </div>

    <div class="game-container">
        <div id="history-bar"></div>
        <div id="multiplier">1.00x</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="control-panel">
        <div class="input-box">
            <label id="lblAmt">Amount (ETB)</label>
            <input type="number" id="betAmt" value="10.00">
            <button id="betBtn" class="main-btn btn-bet" onclick="startFly()">BET</button>
            <button id="cashBtn" class="main-btn btn-cash" onclick="cashOut()">CASH OUT</button>
        </div>
        <div class="input-box">
            <label id="lblAuto">Auto Stop (x)</label>
            <input type="number" id="autoStop" placeholder="2.00">
            <div style="font-size: 9px; color: #666; text-align: center; margin-top: 5px;" id="txtHint">Safety system enabled</div>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Language Data
    let currentLang = 'am';
    const langData = {
        am: { bet: "ውርርድ", cash: "ውጣ", dep: "ገቢ", with: "ወጪ", amt: "መጠን (ብር)", auto: "ራስ-አቁም (x)", hint: "ደህንነት ተጠብቋል", win: "አሸንፈዋል!", fly: "በቀረ!" },
        en: { bet: "BET", cash: "CASH OUT", dep: "Deposit", with: "Withdraw", amt: "Amount (ETB)", auto: "Auto Stop (x)", hint: "Safety system enabled", win: "You Won!", fly: "Flew Away!" }
    };

    function toggleLang() {
        currentLang = currentLang === 'am' ? 'en' : 'am';
        document.getElementById('langBtn').innerText = currentLang === 'am' ? 'English' : 'አማርኛ';
        updateLangUI();
    }

    function updateLangUI() {
        const l = langData[currentLang];
        document.getElementById('betBtn').innerText = l.bet;
        document.getElementById('cashBtn').innerText = l.cash;
        document.getElementById('txtDep').innerText = l.dep;
        document.getElementById('txtWith').innerText = l.with;
        document.getElementById('lblAmt').innerText = l.amt;
        document.getElementById('lblAuto').innerText = l.auto;
        document.getElementById('txtHint').innerText = l.hint;
    }

    // User Profile
    const user = tg.initDataUnsafe?.user;
    if(user) {
        document.getElementById('userName').innerText = user.first_name;
        if(user.photo_url) document.getElementById('userImg').src = user.photo_url;
    }

    // Wallet
    let balance = parseFloat(localStorage.getItem('dai_aviator_bal')) || 1000.00;
    function syncBal() {
        document.getElementById('dispBal').innerText = balance.toFixed(2) + " ETB";
        localStorage.setItem('dai_aviator_bal', balance);
    }
    syncBal();

    // Game Logic
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const multDisp = document.getElementById('multiplier');
    const sndJet = document.getElementById('sndJet');
    const sndWin = document.getElementById('sndWin');
    const sndExp = document.getElementById('sndExplode');

    let multiplier = 1.00;
    let isFlying = false;
    let crashPoint;
    let animId;
    let betVal = 0;

    function startFly() {
        const amt = parseFloat(document.getElementById('betAmt').value);
        if (amt > balance || amt <= 0) return alert("Insufficient Balance!");

        balance -= amt;
        betVal = amt;
        syncBal();

        isFlying = true;
        multiplier = 1.00;
        
        // 40% Owner Profit Logic
        crashPoint = Math.random() < 0.4 ? (Math.random() * 0.15 + 1.01) : (Math.random() * 6 + 1.2);

        document.getElementById('betBtn').style.display = 'none';
        document.getElementById('cashBtn').style.display = 'block';
        multDisp.style.color = "#fff";

        sndJet.currentTime = 0;
        sndJet.play();
        animate();
    }

    function animate() {
        if (!isFlying) return;
        multiplier += 0.008 * Math.pow(multiplier, 0.4);
        multDisp.innerText = multiplier.toFixed(2) + "x";

        const auto = parseFloat(document.getElementById('autoStop').value);
        if (auto > 1 && multiplier >= auto) { cashOut(); return; }
        if (multiplier >= crashPoint) { crash(); return; }

        draw();
        animId = requestAnimationFrame(animate);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const x = (multiplier - 1) * (canvas.width / 5);
        const y = canvas.height - ((multiplier - 1) * (canvas.height / 5));

        ctx.strokeStyle = "#ff003c";
        ctx.lineWidth = 5;
        ctx.shadowBlur = 15; ctx.shadowColor = "red";
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        ctx.quadraticCurveTo(x/2, canvas.height, x, y);
        ctx.stroke();

        ctx.font = "40px Arial";
        ctx.fillText("✈️", x - 20, y + 15);
    }

    function crash() {
        isFlying = false;
        sndJet.pause(); sndExp.play();
        multDisp.innerText = langData[currentLang].fly;
        multDisp.style.color = "#ff4444";
        addHist();
        reset();
    }

    function cashOut() {
        if (!isFlying) return;
        isFlying = false;
        sndJet.pause(); sndWin.play();
        const winAmt = betVal * multiplier;
        balance += winAmt;
        syncBal();
        multDisp.style.color = "#28a745";
        addHist();
        reset();
        alert(langData[currentLang].win + " " + winAmt.toFixed(2));
    }

    function reset() {
        document.getElementById('betBtn').style.display = 'block';
        document.getElementById('cashBtn').style.display = 'none';
        cancelAnimationFrame(animId);
    }

    function addHist() {
        const bar = document.getElementById('history-bar');
        const tag = document.createElement('span');
        tag.className = 'hist-tag';
        tag.innerText = multiplier.toFixed(2) + 'x';
        bar.prepend(tag);
    }

    function deposit() {
        let n = prompt("Enter Deposit Amount / የገቢ መጠን ያስገቡ:");
        if(n && !isNaN(n)) { balance += parseFloat(n); syncBal(); }
    }

    function withdraw() {
        let n = prompt("Enter Withdraw Amount / የወጪ መጠን ያስገቡ:");
        if(n && !isNaN(n) && n <= balance) { balance -= parseFloat(n); syncBal(); alert("Request Sent!"); }
    }

    function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.onresize = resize; resize();
    updateLangUI();
</script>
</body>
</html>
