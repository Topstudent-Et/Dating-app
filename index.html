<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dai Premium Betting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050709; color: white; font-family: 'Inter', sans-serif; }
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        .game-card { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid #2d3748; cursor: pointer; transition: 0.3s; }
        .game-card:hover { transform: scale(1.05); border-color: #e91e63; }
        .game-card img { width: 100%; height: 120px; object-fit: cover; opacity: 0.8; }
        .game-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); padding: 5px; text-align: center; font-weight: bold; }
        
        /* Aviator Arena */
        #game-arena { display: none; }
        .aviator-screen { background: #000; height: 250px; position: relative; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; overflow: hidden;}
        .plane { position: absolute; bottom: 20px; left: 20px; width: 60px; z-index: 10; transition: transform 0.1s linear; }
        .multiplier-text { font-size: 3.5rem; font-weight: 900; color: #ff0055; text-shadow: 0 0 15px rgba(255,0,85,0.6); }
        
        .timer-bar { height: 4px; background: #e91e63; width: 100%; position: absolute; bottom: 0; transition: width linear; }
    </style>
</head>
<body>

    <div id="home-page">
        <div class="p-6 flex justify-between items-center bg-gray-900 border-b border-gray-800">
            <h1 class="text-2xl font-black text-red-500 italic">DAI BET</h1>
            <div class="text-right">
                <p id="main-balance" class="text-green-400 font-bold">1,000.00 ETB</p>
            </div>
        </div>

        <div class="game-grid">
            <div class="game-card" onclick="openGame('aviator')">
                <img src="https://images.unsplash.com/photo-1559156200-66a00ee7efed?q=80&w=400&auto=format&fit=crop" alt="Aviator">
                <div class="game-label">AVIATOR</div>
            </div>
            <div class="game-card" onclick="openGame('keno')">
                <img src="https://images.unsplash.com/photo-1518133835878-5a93cc3f89e5?q=80&w=400&auto=format&fit=crop" alt="Keno">
                <div class="game-label">KENO</div>
            </div>
            <div class="game-card" onclick="openGame('roulette')">
                <img src="https://images.unsplash.com/photo-1596838132731-dd96a2c5adfe?q=80&w=400&auto=format&fit=crop" alt="Roulette">
                <div class="game-label">ROULETTE</div>
            </div>
            <div class="game-card" onclick="openGame('crash')">
                <img src="https://images.unsplash.com/photo-1614028674026-a65e31bfd27c?q=80&w=400&auto=format&fit=crop" alt="Crash">
                <div class="game-label">CRASH</div>
            </div>
        </div>
    </div>

    <div id="game-arena" class="p-4">
        <button onclick="goHome()" class="mb-4 text-gray-400 text-sm">← ተመለስ</button>
        
        <div class="aviator-screen flex flex-col items-center justify-center">
            <div id="next-round-timer" class="absolute top-2 text-yellow-500 font-bold">ቀጣዩ በረራ በ 5 ሰከንድ...</div>
            <div id="live-multiplier" class="multiplier-text">1.00x</div>
            <img id="plane-sprite" src="https://www.svgrepo.com/show/491500/airplane-top-view.svg" class="plane" style="filter: invert(21%) sepia(100%) saturate(7414%) hue-rotate(329deg) brightness(96%) contrast(107%);">
            <div id="progress-bar" class="timer-bar" style="width: 0%;"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <input type="number" id="bet-input" value="10" class="w-full bg-black border border-gray-600 p-2 rounded mb-3 text-center text-xl">
                <button id="main-action-btn" onclick="handleAction()" class="w-full bg-green-600 hover:bg-green-500 p-4 rounded-lg font-black text-xl transition">BET</button>
            </div>
            <div class="bg-gray-900 p-4 rounded-xl flex flex-col justify-center items-center">
                <span class="text-gray-500 text-xs">ቀጥታ ተጫዋቾች</span>
                <span id="player-count" class="text-2xl font-bold text-blue-400">0</span>
            </div>
        </div>
    </div>

    <audio id="snd-engine" loop src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="snd-crash" src="https://assets.mixkit.co/active_storage/sfx/2511/2511-preview.mp3"></audio>

    <script>
        let balance = 1000.00;
        let isFlying = false;
        let hasBet = false;
        let multiplier = 1.00;
        let gameLoopInterval;
        let currentBet = 0;

        function openGame(game) {
            if(game === 'aviator') {
                document.getElementById('home-page').style.display = 'none';
                document.getElementById('game-arena').style.display = 'block';
                startAutoGameLoop();
            }
        }

        function goHome() {
            document.getElementById('home-page').style.display = 'block';
            document.getElementById('game-arena').style.display = 'none';
            clearInterval(gameLoopInterval);
        }

        function startAutoGameLoop() {
            // This runs the game forever in cycles
            let waitTime = 5;
            let timerDisplay = document.getElementById('next-round-timer');
            let progressBar = document.getElementById('progress-bar');
            
            let countdown = setInterval(() => {
                waitTime -= 1;
                timerDisplay.innerText = `ቀጣዩ በረራ በ ${waitTime} ሰከንድ...`;
                progressBar.style.width = (100 - (waitTime * 20)) + "%";

                if (waitTime <= 0) {
                    clearInterval(countdown);
                    timerDisplay.innerText = "አውሮፕላኑ እየበረረ ነው!";
                    runFlight();
                }
            }, 1000);
        }

        function runFlight() {
            isFlying = true;
            multiplier = 1.00;
            document.getElementById('live-multiplier').style.color = "#ff0055";
            document.getElementById('snd-engine').play();

            // 40% Admin Profit Logic (Crash early more frequently)
            let crashPoint = Math.random() < 0.40 ? (1 + Math.random() * 0.5) : (1 + Math.random() * 10);

            gameLoopInterval = setInterval(() => {
                multiplier += 0.02;
                document.getElementById('live-multiplier').innerText = multiplier.toFixed(2) + "x";
                
                // Move plane
                let plane = document.getElementById('plane-sprite');
                plane.style.transform = `translate(${multiplier * 15}px, -${multiplier * 10}px)`;

                if (multiplier >= crashPoint) {
                    crashGame();
                }
            }, 80);
        }

        function crashGame() {
            clearInterval(gameLoopInterval);
            isFlying = false;
            hasBet = false;
            document.getElementById('snd-engine').pause();
            document.getElementById('snd-engine').currentTime = 0;
            document.getElementById('snd-crash').play();
            
            document.getElementById('live-multiplier').innerText = "FLEW AWAY!";
            document.getElementById('live-multiplier').style.color = "red";
            document.getElementById('main-action-btn').innerText = "BET";
            document.getElementById('main-action-btn').className = "w-full bg-green-600 p-4 rounded-lg font-black text-xl";

            setTimeout(() => {
                document.getElementById('plane-sprite').style.transform = "translate(0,0)";
                document.getElementById('live-multiplier').innerText = "1.00x";
                startAutoGameLoop();
            }, 4000);
        }

        function handleAction() {
            let btn = document.getElementById('main-action-btn');
            let betAmt = parseFloat(document.getElementById('bet-input').value);

            if (!isFlying && !hasBet) {
                // Place bet for next round
                if(betAmt > balance) return alert("ሂሳብዎ በቂ አይደለም!");
                balance -= betAmt;
                currentBet = betAmt;
                hasBet = true;
                btn.innerText = "ተመዝግቧል (Waiting...)";
                btn.classList.replace('bg-green-600', 'bg-gray-600');
                updateUI();
            } else if (isFlying && hasBet) {
                // Cash out
                let win = currentBet * multiplier;
                balance += win;
                hasBet = false;
                alert(`እንኳን ደስ አለዎት! ${win.toFixed(2)} ETB አሸንፈዋል!`);
                btn.innerText = "BET";
                btn.classList.replace('bg-yellow-600', 'bg-green-600');
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('main-balance').innerText = balance.toFixed(2) + " ETB";
        }

        // Live player count simulation
        setInterval(() => {
            document.getElementById('player-count').innerText = Math.floor(Math.random() * 50 + 120);
        }, 3000);

    </script>
</body>
</html>
