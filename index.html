<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIATOR ETHIOPIA PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-card { background: rgba(15, 15, 15, 0.95); border: 1px solid #222; border-radius: 20px; }
        
        /* Line & Plane Animation */
        .game-area { background: #050505; height: 260px; border-radius: 25px; position: relative; overflow: hidden; border: 1px solid #1a1a1a; }
        #multiplier { font-size: 70px; font-weight: 900; z-index: 50; position: relative; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; }
        #plane { position: absolute; z-index: 20; transition: transform 0.1s linear; }

        /* Large Bet Buttons */
        .bet-box { height: 95px; width: 100%; border-radius: 18px; font-size: 26px; font-weight: 900; transition: 0.1s; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
        .bet-green { background: linear-gradient(180deg, #28a745 0%, #1e7e34 100%); box-shadow: 0 6px 0 #14532d; }
        .bet-orange { background: linear-gradient(180deg, #f97316 0%, #ea580c 100%); box-shadow: 0 6px 0 #9a3412; }
        .bet-box:active { transform: translateY(4px); box-shadow: 0 2px 0 #14532d; }

        .chip { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 6px; font-size: 11px; font-weight: bold; text-align: center; }
        .chip.active { background: #28a745; border-color: #00ff44; }

        /* Navigation */
        nav { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; height: 80px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 1000; }
        .nav-link { color: #444; font-size: 10px; font-weight: bold; }
        .nav-link.active { color: #34b4ff; }

        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 100px; }
        .page.active { display: block; }
    </style>
</head>
<body class="p-2">

    <div class="flex justify-between items-center mb-3 px-2">
        <div class="text-red-600 font-black italic text-2xl">AVIATOR</div>
        <div class="glass-card px-4 py-2 flex items-center gap-2" onclick="showPage('walletPage')">
            <span id="topBal" class="text-green-500 font-black">0.00 ETB</span>
            <i class="fas fa-plus-circle text-green-500"></i>
        </div>
    </div>

    <div id="playPage" class="page active">
        <div class="game-area flex items-center justify-center mb-4">
            <canvas id="lineCanvas"></canvas>
            <div id="multiplier">1.00x</div>
            <div id="plane" class="text-5xl">✈️</div>
            <div id="flewText" class="hidden absolute text-red-600 font-black text-4xl z-50">FLEW AWAY!</div>
        </div>

        <div class="space-y-3 px-1">
            <div class="glass-card p-4">
                <div class="flex gap-3">
                    <div class="w-2/5 grid grid-cols-2 gap-2">
                        <button onclick="setAmt(1, 10)" class="chip">10</button>
                        <button onclick="setAmt(1, 50)" class="chip">50</button>
                        <button onclick="setAmt(1, 80)" class="chip">80</button>
                        <button onclick="setAmt(1, 200)" class="chip">200</button>
                        <button class="bg-blue-900/20 text-[8px] rounded col-span-2">AUTO 2.0x</button>
                    </div>
                    <div class="w-3/5">
                        <button id="btn1" onclick="handleAction(1)" class="bet-box bet-green">
                            <span class="text-xs font-normal mb-1">BET</span>
                            <span id="btnAmt1">10</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="glass-card p-4">
                <div class="flex gap-3">
                    <div class="w-2/5 grid grid-cols-2 gap-2">
                        <button onclick="setAmt(2, 10)" class="chip">10</button>
                        <button onclick="setAmt(2, 100)" class="chip">100</button>
                        <button class="bg-blue-900/20 text-[8px] rounded col-span-2">AUTO 4.0x</button>
                    </div>
                    <div class="w-3/5">
                        <button id="btn2" onclick="handleAction(2)" class="bet-box bet-green">
                            <span class="text-xs font-normal mb-1">BET</span>
                            <span id="btnAmt2">10</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="walletPage" class="page">
        <div class="flex gap-2 p-2">
            <button onclick="setTab('dep')" class="w-1/2 py-4 bg-green-600 rounded-2xl font-black">DEPOSIT</button>
            <button onclick="setTab('wit')" class="w-1/2 py-4 bg-zinc-900 rounded-2xl font-black text-zinc-500">WITHDRAW</button>
        </div>
        <div id="walletContent" class="p-4 space-y-4">
            <div class="glass-card p-5 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img src="https://share.google/snRme0UmG8bY2eA2E" class="w-12 h-12 rounded-xl bg-white p-1" onerror="this.src='https://via.placeholder.com/50?text=CBE'">
                    <div><p class="text-[10px] text-zinc-500 uppercase">CBE Account</p><p class="text-lg font-black">1000179571815</p></div>
                </div>
                <i class="fas fa-copy text-zinc-600" onclick="copy('1000179571815')"></i>
            </div>
            <div class="glass-card p-5 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img src="https://share.google/sMrs8QadEd2ivVTqo" class="w-12 h-12 rounded-xl bg-white p-1" onerror="this.src='https://via.placeholder.com/50?text=Tele'">
                    <div><p class="text-[10px] text-zinc-500 uppercase">Telebirr</p><p class="text-lg font-black">0906067696</p></div>
                </div>
                <i class="fas fa-copy text-zinc-600" onclick="copy('0906067696')"></i>
            </div>
            <input type="text" id="ftNum" placeholder="FT / Adwa Number" class="w-full bg-zinc-900 p-5 rounded-2xl outline-none">
            <input type="number" id="depAmt" placeholder="Amount Sent" class="w-full bg-zinc-900 p-5 rounded-2xl outline-none">
            <button onclick="sendAdmin('Deposit')" class="w-full bg-blue-600 py-5 rounded-2xl font-black text-xl">SUBMIT TO ADMIN</button>
        </div>
    </div>

    <div id="profilePage" class="page">
        <div class="glass-card p-8 text-center mt-5 mx-2 relative overflow-hidden">
            <div class="w-24 h-24 mx-auto rounded-full border-4 border-blue-500 p-1 mb-4 shadow-xl shadow-blue-500/20">
                <img id="uImg" src="https://via.placeholder.com/150" class="w-full h-full rounded-full object-cover">
            </div>
            <h2 class="text-2xl font-black italic mb-1"><span id="uN">Player</span> <i class="fas fa-check-circle text-blue-400"></i></h2>
            <p class="text-zinc-500 text-[10px] uppercase tracking-widest">Premium Account</p>
            
            <div class="grid grid-cols-2 gap-3 mt-8">
                <div class="bg-black p-4 rounded-2xl border border-zinc-800">
                    <p class="text-[9px] text-zinc-500 mb-1">AVAILABLE</p>
                    <p id="pBal" class="text-lg font-black text-green-500">0.00</p>
                </div>
                <div class="bg-black p-4 rounded-2xl border border-zinc-800">
                    <p class="text-[9px] text-zinc-500 mb-1">PLAYED</p>
                    <p class="text-lg font-black">0</p>
                </div>
            </div>

            <div class="mt-8 p-6 bg-blue-600/10 rounded-3xl border border-blue-500/20">
                <p class="text-blue-400 font-black mb-1">🚀 ጓደኞችን ይጋብዙ</p>
                <p class="text-[10px] text-zinc-400 mb-5">በቀን እስከ 100,000 ብር ያሸንፉ! በአንድ ሪፈራል 5 ብር ያግኙ።</p>
                <button onclick="telegramShare()" class="w-full bg-blue-600 py-4 rounded-xl font-black text-sm flex items-center justify-center gap-2">
                    <i class="fab fa-telegram-plane"></i> SHARE TO FRIENDS
                </button>
            </div>
            
            <button onclick="showPage('adminPage')" class="mt-10 text-zinc-800 text-[10px] font-bold">Admin Panel</button>
        </div>
    </div>

    <div id="adminPage" class="page p-4">
        <h2 class="text-xl font-black mb-4 border-b border-zinc-800 pb-2">ADMIN REQUESTS</h2>
        <div id="adminLog" class="glass-card p-4 min-h-[200px] text-[10px] space-y-2">
            <p class="text-zinc-600 italic">Waiting for data...</p>
        </div>
    </div>

    <nav>
        <div onclick="showPage('playPage')" class="nav-link active text-center"><i class="fas fa-plane-departure text-xl"></i><div>Play</div></div>
        <div onclick="showPage('winnersPage')" class="nav-link text-center"><i class="fas fa-trophy text-xl"></i><div>Winners</div></div>
        <div onclick="showPage('walletPage')" class="nav-link text-center"><i class="fas fa-wallet text-xl"></i><div>Wallet</div></div>
        <div onclick="showPage('profilePage')" class="nav-link text-center"><i class="fas fa-user-circle text-xl"></i><div>Profile</div></div>
    </nav>

    <script>
        let bal = 0.0;
        let running = false;
        let m = 1.0;
        let bets = { 1: {active: false, amt: 10}, 2: {active: false, amt: 10} };
        
        // Canvas Setup
        const canvas = document.getElementById('lineCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth - 20;
        canvas.height = 260;

        const tg = window.Telegram.WebApp;
        tg.expand();
        if(tg.initDataUnsafe.user) {
            document.getElementById('uN').innerText = tg.initDataUnsafe.user.first_name;
            if(tg.initDataUnsafe.user.photo_url) document.getElementById('uImg').src = tg.initDataUnsafe.user.photo_url;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function setAmt(s, v) {
            bets[s].amt = v;
            document.getElementById('btnAmt' + s).innerText = v;
        }

        function startRound() {
            if(running) return;
            running = true;
            m = 1.0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('flewText').classList.add('hidden');
            document.getElementById('multiplier').classList.remove('hidden');

            let hasRealBet = bets[1].active || bets[2].active;
            let crash = hasRealBet ? (1.05 + Math.random() * 2.2) : (5 + Math.random() * 60);

            let points = [{x: 20, y: 240}];
            let loop = setInterval(() => {
                m += 0.01 * (m / 1.5);
                document.getElementById('multiplier').innerText = m.toFixed(2) + "x";
                
                let posX = 20 + (m - 1) * 45;
                let posY = 240 - (m - 1) * 22;
                
                // Draw Line
                ctx.beginPath();
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 5;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0000';
                ctx.moveTo(20, 240);
                ctx.quadraticCurveTo(posX/2, 240, posX, posY);
                ctx.stroke();

                document.getElementById('plane').style.left = posX + 'px';
                document.getElementById('plane').style.top = posY + 'px';

                if(m >= crash) {
                    clearInterval(loop);
                    doCrash();
                }
            }, 60);
        }

        function doCrash() {
            document.getElementById('multiplier').classList.add('hidden');
            document.getElementById('flewText').classList.remove('hidden');
            running = false;
            bets[1].active = false; bets[2].active = false;
            resetBtns();
            setTimeout(startRound, 4000);
        }

        function handleAction(s) {
            let b = document.getElementById('btn' + s);
            if(!bets[s].active) {
                if(bal < bets[s].amt) return alert("ባላንስ የላችሁም!");
                if(running) return alert("ጨዋታው እስኪጀምር ይጠብቁ!");
                bets[s].active = true;
                b.classList.add('opacity-50');
                b.querySelector('span:first-child').innerText = "WAITING";
            } else {
                let win = bets[s].amt * m;
                bal += win;
                updateU();
                alert(win.toFixed(2) + " ETB አሸንፈዋል!");
                bets[s].active = false;
                resetBtns();
            }
        }

        function updateU() {
            document.getElementById('topBal').innerText = bal.toFixed(2) + " ETB";
            document.getElementById('pBal').innerText = bal.toFixed(2);
        }

        function resetBtns() {
            [1, 2].forEach(s => {
                let b = document.getElementById('btn' + s);
                b.className = "bet-box bet-green";
                b.querySelector('span:first-child').innerText = "BET";
                b.disabled = false;
            });
        }

        function sendAdmin(type) {
            let log = document.getElementById('adminLog');
            let ft = document.getElementById('ftNum').value;
            let amt = document.getElementById('depAmt').value;
            if(!amt) return alert("ገንዘቡን ያስገቡ!");
            log.innerHTML += `<div class="p-2 border-b border-zinc-800">${type}: ${amt} ETB | Ref: ${ft} | User: ${document.getElementById('uN').innerText}</div>`;
            alert("ጥያቄው ለአድሚን ደርሷል!");
        }

        function telegramShare() {
            const shareText = encodeURIComponent("🚀 የአቪዬተር ጨዋታ በኢትዮጵያ!\n\n💰 በቀን እስከ 100,000 ብር ያሸንፉ!\n🎁 በአንድ ሰው 5 ብር ያግኙ!\n\nአሁኑኑ መጫወት ለመጀመር ሊንኩን ይጫኑ 👇\nhttps://t.me/AviatorEthioBot?start=ref_" + (tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "123"));
            window.open(`https://t.me/share/url?url=${shareText}`);
        }

        window.onload = () => {
            startRound();
            setInterval(() => {
                if(running) {
                    [1, 2].forEach(s => {
                        if(bets[s].active) {
                            let b = document.getElementById('btn' + s);
                            b.className = "bet-box bet-orange";
                            b.querySelector('span:first-child').innerText = "CASHOUT";
                            b.querySelector('span:last-child').innerText = (bets[s].amt * m).toFixed(2);
                        }
                    });
                }
            }, 100);
        };
    </script>
</body>
</html>
