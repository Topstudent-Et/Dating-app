<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abiator - አቪዬተር ጨዋታ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#0a0a2a, #1a0033);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin: 10px 0; color: #00ffcc; }
        #game {
            width: 700px;
            height: 400px;
            border: 3px solid #00ffcc;
            background: #000033;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }
        #plane {
            position: absolute;
            font-size: 50px;
            transition: all 0.1s linear;
        }
        #multiplier {
            font-size: 60px;
            font-weight: bold;
            color: #ffff00;
            margin: 10px;
        }
        .controls {
            margin: 20px;
        }
        input, button {
            padding: 12px 20px;
            font-size: 18px;
            margin: 5px;
        }
        button {
            background: #ff0066;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #ff3388; }
        #cashout { background: #00cc66; }
        #history {
            max-width: 700px;
            margin: 20px auto;
            text-align: left;
        }
        .bet { color: #00ffcc; }
    </style>
</head>
<body>
    <h1>✈️ Abiator (Aviator Crash Game) ✈️</h1>
    <p>ቤት አድርግ → አውሮፕላኑ ሲበር ገንዘብ አውጣ!</p>

    <div id="game">
        <div id="plane">✈️</div>
    </div>

    <div id="multiplier">1.00x</div>

    <div class="controls">
        <input type="number" id="betAmount" value="50" placeholder="ቤት መጠን (ብር)">
        <button onclick="placeBet()">ቤት አድርግ</button>
        <button id="cashoutBtn" onclick="cashOut()" disabled>ገንዘብ አውጣ (Cash Out)</button>
    </div>

    <p>ባላንስ: <span id="balance" class="bet">1000</span> ብር</p>

    <div id="history">
        <strong>የቀድሞ ማባዛቶች:</strong>
        <div id="crashHistory"></div>
    </div>

    <script>
        let balance = 1000;
        let currentBet = 0;
        let multiplier = 1.0;
        let isFlying = false;
        let crashPoint = 0;
        let interval = null;
        let plane = document.getElementById('plane');
        let multiplierEl = document.getElementById('multiplier');
        let balanceEl = document.getElementById('balance');
        let cashoutBtn = document.getElementById('cashoutBtn');
        let historyEl = document.getElementById('crashHistory');

        function placeBet() {
            if (isFlying) return alert("ጨዋታው እየተጫወተ ነው!");
            
            const betInput = parseFloat(document.getElementById('betAmount').value);
            if (!betInput || betInput <= 0) return alert("ትክክለኛ ቤት አስገባ!");
            if (betInput > balance) return alert("በቂ ባላንስ የለህም!");

            currentBet = betInput;
            balance -= betInput;
            balanceEl.textContent = balance.toFixed(0);

            // አዲስ ጨዋታ ጀምር
            startGame();
        }

        function startGame() {
            isFlying = true;
            multiplier = 1.0;
            cashoutBtn.disabled = false;

            // ራንደም crash point (1.0x \~ 50x)
            crashPoint = Math.random() * 49 + 1.2; // ቢያንስ 1.2x

            plane.style.left = '50px';
            plane.style.top = '200px';

            interval = setInterval(() => {
                multiplier += 0.05 + (multiplier * 0.008); // ፍጥነት ይጨምራል
                multiplierEl.textContent = multiplier.toFixed(2) + "x";

                // አውሮፕላኑ ይንቀሳቀስ
                const progress = Math.min(multiplier / 10, 1);
                plane.style.left = (50 + progress * 500) + 'px';
                plane.style.top = (200 - progress * 150) + 'px';

                if (multiplier >= crashPoint) {
                    crash();
                }
            }, 80);
        }

        function cashOut() {
            if (!isFlying) return;
            clearInterval(interval);
            isFlying = false;
            cashoutBtn.disabled = true;

            const win = Math.floor(currentBet * multiplier);
            balance += win;
            balanceEl.textContent = balance.toFixed(0);

            alert(`🎉 ተሳክቷል! ${multiplier.toFixed(2)}x × ${currentBet} = ${win} ብር አሸንፈሃል!`);
            addToHistory(multiplier);
            resetGame();
        }

        function crash() {
            clearInterval(interval);
            isFlying = false;
            cashoutBtn.disabled = true;

            plane.style.transition = 'all 0.3s';
            plane.style.transform = 'rotate(45deg)';
            
            setTimeout(() => {
                alert(`💥 አውሮፕላኑ በ ${multiplier.toFixed(2)}x በረረ! ቤትህ ጠፋ 😢`);
                addToHistory(multiplier);
                resetGame();
            }, 300);
        }

        function resetGame() {
            multiplier = 1.0;
            multiplierEl.textContent = "1.00x";
            plane.style.transition = 'none';
            plane.style.left = '50px';
            plane.style.top = '200px';
            plane.style.transform = 'rotate(0deg)';
        }

        function addToHistory(mult) {
            const item = document.createElement('span');
            item.style.marginRight = '10px';
            item.style.color = mult < 2 ? '#ff6666' : (mult < 5 ? '#ffff66' : '#66ff66');
            item.textContent = mult.toFixed(2) + "x  ";
            historyEl.appendChild(item);
            
            if (historyEl.children.length > 12) {
                historyEl.removeChild(historyEl.children[0]);
            }
        }

        // የመጀመሪያ ታሪክ
        addToHistory(1.45);
        addToHistory(3.2);
        addToHistory(12.8);
        addToHistory(1.9);
    </script>
</body>
</html>
