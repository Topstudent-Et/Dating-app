<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Dating | Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #000; color: white; }
        .app-container { max-width: 450px; margin: 0 auto; min-height: 100vh; position: relative; background: #0a0a0a; }
        .page { display: none; padding-bottom: 80px; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .gradient-btn { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .nav-active { color: #a855f7; transform: translateY(-5px); }
        #bottom-nav { display: none; } /* መጀመሪያ ተደብቆ ይቆያል */
    </style>
</head>
<body>

    <div class="app-container shadow-2xl">

        <div id="register-page" class="page active px-6 pt-24 text-center">
            <div class="w-20 h-20 gradient-btn rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-lg shadow-purple-500/40">
                <i class="fas fa-globe text-3xl"></i>
            </div>
            <h1 class="text-4xl font-bold mb-2 tracking-tight">World Dating</h1>
            <p class="text-gray-500 mb-12 italic">Join the world of connections.</p>
            
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Full Name" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 focus:border-purple-500 outline-none transition">
                <input type="password" placeholder="Password" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 focus:border-purple-500 outline-none transition">
                
                <button onclick="handleJoin()" class="w-full p-4 rounded-2xl gradient-btn font-bold text-lg mt-6 shadow-xl active:scale-95 transition">
                    Join Now
                </button>
            </div>
        </div>

        <div id="home-page" class="page px-4 pt-6">
            <div class="flex justify-between items-center mb-6 px-2">
                <h2 class="text-2xl font-bold">Discover</h2>
                <div class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center"><i class="fas fa-sliders-h"></i></div>
            </div>
            <div class="relative rounded-[2.5rem] overflow-hidden h-[550px] border border-white/10">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80" class="w-full h-full object-cover">
                <div class="absolute bottom-0 left-0 right-0 p-8 bg-gradient-to-t from-black via-black/60 to-transparent">
                    <h3 class="text-3xl font-bold">Amelia, 24</h3>
                    <p class="text-gray-300 mt-2">Love arts and traveling. NYC based.</p>
                </div>
            </div>
        </div>

        <div id="match-page" class="page px-4 pt-6 text-center">
            <h2 class="text-2xl font-bold mb-6">Your Matches</h2>
            <p class="text-gray-500 mt-20">No matches yet. Keep swiping!</p>
        </div>

        <div id="message-page" class="page px-4 pt-6">
            <h2 class="text-2xl font-bold mb-6">Messages</h2>
            <p class="text-gray-500 text-center mt-20">Your inbox is empty.</p>
        </div>

        <div id="profile-page" class="page px-4 pt-10 text-center">
            <div class="w-32 h-32 mx-auto rounded-full border-4 border-purple-500 p-1 mb-4">
                <img src="https://via.placeholder.com/150" class="w-full h-full rounded-full object-cover bg-gray-800">
            </div>
            <h3 id="display-name" class="text-2xl font-bold">User</h3>
            <button onclick="logout()" class="mt-10 text-red-500 font-bold">Logout</button>
        </div>

        <nav id="bottom-nav" class="fixed bottom-0 w-full max-w-[450px] bg-black/80 backdrop-blur-xl border-t border-white/5 flex justify-around py-6 rounded-t-[2.5rem] z-50">
            <button onclick="showPage('home-page')" id="nav-home" class="text-gray-500 transition-all"><i class="fas fa-fire text-2xl"></i></button>
            <button onclick="showPage('match-page')" id="nav-match" class="text-gray-500 transition-all"><i class="fas fa-heart text-2xl"></i></button>
            <button onclick="showPage('message-page')" id="nav-message" class="text-gray-500 transition-all"><i class="fas fa-comment-alt text-2xl"></i></button>
            <button onclick="showPage('profile-page')" id="nav-profile" class="text-gray-500 transition-all"><i class="fas fa-user-circle text-2xl"></i></button>
        </nav>

    </div>

    <script>
        function handleJoin() {
            const name = document.getElementById('username').value;
            if (name.trim() === "") {
                alert("Please enter your name!");
                return;
            }
            
            // ስሙን በፕሮፋይል ገጽ ላይ አሳይ
            document.getElementById('display-name').innerText = name;

            // ምዝገባው ሲያልቅ Nav እንዲታይ አድርግ
            document.getElementById('bottom-nav').style.display = 'flex';
            showPage('home-page');
        }

        function showPage(pageId) {
            // ሁሉንም ገጽ ደብቅ
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // የተመረጠውን ገጽ አሳይ
            document.getElementById(pageId).classList.add('active');

            // Nav አዶዎችን አድስ (Highlight)
            document.querySelectorAll('#bottom-nav button').forEach(b => b.classList.remove('nav-active'));
            const btnKey = pageId.split('-')[0];
            const activeBtn = document.getElementById('nav-' + btnKey);
            if(activeBtn) activeBtn.classList.add('nav-active');
        }

        function logout() {
            document.getElementById('bottom-nav').style.display = 'none';
            showPage('register-page');
        }
    </script>
</body>
</html>
