<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>AVIATOR ETHIOPIA | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000000; font-family: 'Inter', sans-serif; color: white; overflow-x: hidden; }
        
        /* Header & Backgrounds */
        .game-area { background: radial-gradient(circle at center, #1a2a3a 0%, #000000 100%); border-radius: 16px; position: relative; overflow: hidden; height: 220px; border: 1px solid #333; }
        
        /* Bet Panels (As per screenshot) */
        .bet-panel { background: #1b1c1d; border-radius: 20px; padding: 15px; margin-bottom: 10px; border: 1px solid #2c2d2e; }
        
        /* Multiplier Text */
        .multiplier-display { font-size: 50px; font-weight: 900; color: white; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        
        /* Input Group */
        .input-group { display: flex; align-items: center; background: #000; border-radius: 30px; padding: 4px; border: 1px solid #444; width: 100%; }
        .qty-btn { width: 28px; height: 28px; border-radius: 50%; background: #444; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
        
        /* Main Green Button */
        .bet-btn-main { background: #28a745; color: white; border-radius: 15px; width: 100%; height: 75px; border: none; transition: 0.1s; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 0 #1e7e34; }
        .bet-btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e7e34; }
        .bet-btn-main.cashout { background: #f97316; box-shadow: 0 4px 0 #c2410c; }
        .bet-btn-main span { font-size: 11px; opacity: 0.9; font-weight: normal; margin-top: 2px; }

        /* Chips */
        .chip-btn { background: #333; border-radius: 8px; padding: 5px; font-size: 11px; font-weight: bold; text-align: center; cursor: pointer; }

        /* History */
        .history-item { padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; background: #2c2d2e; min-width: 45px; text-align: center; }
        .high-x { color: #913ef8; }
        .low-x { color: #34b4ff; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; display: flex; justify-content: space-around; align-items: center; background: #1b1c1d; border-top: 1px solid #333; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; }
        .nav-item.active { color: #34b4ff; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }

        /* Bank Cards */
        .bank-card { background: #1b1c1d; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #333; display: flex; align-items: center; }
        .bank-logo { width: 45px; height: 45px; border-radius: 8px; margin-right: 12px; object-fit: contain; background: #000; }
    </style>
</head>
<body class="p-3 pb-24">

    <div class="flex justify-between items-center mb-4 mt-2">
        <div class="text-red-600 font-black italic text-2xl">Aviator</div>
        <div class="flex items-center gap-3">
            <div class="bg-zinc-900 px-3 py-1 rounded-full border border-zinc-700">
                <span id="balanceDisplay" class="text-green-500 font-bold">0.00 ETB</span>
            </div>
            <button onclick="switchPage('walletPage')" class="bg-green-600 px-4 py-1 rounded-md font-bold text-sm">Deposit</button>
        </div>
    </div>

    <div id="homePage" class="page">
        <div id="historyContainer" class="flex gap-2 overflow-x-auto mb-3 no-scrollbar">
            </div>

        <div class="game-area mb-4">
            <div id="multiplierText" class="absolute inset-0 flex items-center justify-center multiplier-display">1.00x</div>
            <svg width="100%" height="100%" class="absolute top-0 left-0">
                <path id="gamePath" d="M 0 200 Q 0 200 0 200" stroke="#e11d48" stroke-width="4" fill="none" />
            </svg>
            <div id="rocket" class="absolute bottom-5 left-5 text-3xl">✈️</div>
        </div>

        <div class="bet-panel">
            <div class="flex justify-center gap-4 mb-3">
                <button class="text-xs font-bold border-b-2 border-white pb-1">Bet</button>
                <button class="text-xs font-bold text-zinc-500">Auto</button>
            </div>
            <div class="flex gap-3">
                <div class="w-1/2">
                    <div class="input-group mb-2">
                        <div class="qty-btn" onclick="adjustValue(1, -10)">-</div>
                        <input type="number" id="input1" value="10" class="bg-transparent w-full text-center font-bold text-sm outline-none">
                        <div class="qty-btn" onclick="adjustValue(1, 10)">+</div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="chip-btn" onclick="setValue(1, 50)">50</div>
                        <div class="chip-btn" onclick="setValue(1, 100)">100</div>
                        <div class="chip-btn" onclick="setValue(1, 200)">200</div>
                        <div class="chip-btn" onclick="setValue(1, 500)">500</div>
                    </div>
                </div>
                <div class="w-1/2">
                    <button id="betBtn1" onclick="handleBet(1)" class="bet-btn-main">
                        <div class="text-lg font-black">BET</div>
                        <span id="btnLabel1">10.00 ETB</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="bet-panel">
            <div class="flex justify-center gap-4 mb-3">
                <button class="text-xs font-bold border-b-2 border-white pb-1">Bet</button>
                <button class="text-xs font-bold text-zinc-500">Auto</button>
            </div>
            <div class="flex gap-3">
                <div class="w-1/2">
                    <div class="input-group mb-2">
                        <div class="qty-btn" onclick="adjustValue(2, -10)">-</div>
                        <input type="number" id="input2" value="10" class="bg-transparent w-full text-center font-bold text-sm outline-none">
                        <div class="qty-btn" onclick="adjustValue(2, 10)">+</div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="chip-btn" onclick="setValue(2, 50)">50</div>
                        <div class="chip-btn" onclick="setValue(2, 100)">100</div>
                        <div class="chip-btn" onclick="setValue(2, 200)">200</div>
                        <div class="chip-btn" onclick="setValue(2, 500)">500</div>
                    </div>
                </div>
                <div class="w-1/2">
                    <button id="betBtn2" onclick="handleBet(2)" class="bet-btn-main">
                        <div class="text-lg font-black">BET</div>
                        <span id="btnLabel2">10.00 ETB</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="walletPage" class="page hidden pt-4">
        <h2 class="text-xl font-bold mb-4">Deposit Funds</h2>
        <div id="bankList">
            <div class="bank-card" onclick="copyAcc('1000179571815')">
                <img src="1000067890.png" class="bank-logo" alt="CBE">
                <div class="flex-1">
                    <div class="text-xs opacity-60">Commercial Bank of Ethiopia</div>
                    <div class="font-bold">1000179571815</div>
                    <div class="text-[10px] text-zinc-400">DAWIT FIKADU</div>
                </div>
                <i class="fas fa-copy text-zinc-500"></i>
            </div>
            <div class="bank-card" onclick="copyAcc('0906067696')">
                <img src="1000067892.png" class="bank-logo" alt="Telebirr">
                <div class="flex-1">
                    <div class="text-xs opacity-60">Telebirr</div>
                    <div class="font-bold">0906067696</div>
                    <div class="text-[10px] text-zinc-400">DAWIT FIKADU</div>
                </div>
                <i class="fas fa-copy text-zinc-500"></i>
            </div>
        </div>
        
        <div class="bg-zinc-900 p-4 rounded-xl mt-4">
            <input type="text" id="depRef" placeholder="Transaction Reference" class="w-full bg-black p-3 rounded-lg mb-2 outline-none border border-zinc-700">
            <input type="number" id="depAmt" placeholder="Amount (min 50)" class="w-full bg-black p-3 rounded-lg mb-3 outline-none border border-zinc-700">
            <button onclick="submitDep()" class="w-full bg-red-600 py-3 rounded-lg font-bold">Submit Deposit</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('homePage')"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="nav-item"><i class="fas fa-trophy"></i><span>Winners</span></div>
        <div class="nav-item" onclick="switchPage('walletPage')"><i class="fas fa-wallet"></i><span>Wallet</span></div>
        <div class="nav-item"><i class="fas fa-bars"></i><span>Menu</span></div>
    </div>

    <script>
        // Core Logic
        let balance = 0;
        let gameActive = false;
        let multiplier = 1.0;
        let bets = { 1: { active: false, amount: 10 }, 2: { active: false, amount: 10 } };
        let history = ["1.20", "5.43", "1.05", "2.11", "11.50", "1.87"];

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        function adjustValue(slot, val) {
            let input = document.getElementById('input' + slot);
            let newVal = parseInt(input.value) + val;
            if(newVal >= 10) {
                input.value = newVal;
                document.getElementById('btnLabel' + slot).innerText = newVal.toFixed(2) + " ETB";
                bets[slot].amount = newVal;
            }
        }

        function setValue(slot, val) {
            document.getElementById('input' + slot).value = val;
            document.getElementById('btnLabel' + slot).innerText = val.toFixed(2) + " ETB";
            bets[slot].amount = val;
        }

        function copyAcc(num) {
            navigator.clipboard.writeText(num);
            alert("Account Copied: " + num);
        }

        // Game Simulation
        function runGame() {
            if(gameActive) return;
            gameActive = true;
            multiplier = 1.0;
            let crashPoint = 1.2 + (Math.random() * 5); // Realistic crash

            let loop = setInterval(() => {
                multiplier += 0.01;
                document.getElementById('multiplierText').innerText = multiplier.toFixed(2) + "x";
                
                // Animate Path & Plane
                let x = (multiplier - 1) * 60;
                let y = (multiplier - 1) * 30;
                document.getElementById('rocket').style.transform = `translate(${x}px, -${y}px)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 200 Q ${x} 200 ${x+20} ${200-y}`);

                if(multiplier >= crashPoint) {
                    clearInterval(loop);
                    crash();
                }
            }, 50);
        }

        function crash() {
            document.getElementById('multiplierText').classList.add('text-red-600');
            document.getElementById('multiplierText').innerText = "FLEW AWAY!";
            setTimeout(() => {
                document.getElementById('multiplierText').classList.remove('text-red-600');
                gameActive = false;
                runGame(); // Restart
            }, 3000);
        }

        function handleBet(slot) {
            if(!gameActive) {
                alert("Wait for next round");
                return;
            }
            // Cashout logic here
        }

        // Init
        window.onload = () => {
            let hDiv = document.getElementById('historyContainer');
            history.forEach(h => {
                let color = parseFloat(h) > 2 ? 'high-x' : 'low-x';
                hDiv.innerHTML += `<div class="history-item ${color}">${h}x</div>`;
            });
            runGame();
        };
    </script>
</body>
</html>
