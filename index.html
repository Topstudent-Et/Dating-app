<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World All Games - Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #ffcc00; --bg: #0b0b0d; --card: #16171b; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* Header */
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #16171b; border-bottom: 1px solid #333; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: var(--gold); border-radius: 50%; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .balance-box { background: #1c1d22; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; }

        /* Navigation */
        .content { padding: 15px; padding-bottom: 80px; }
        .page { display: none; }
        .active { display: block; }

        /* Game Cards */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .game-card { background: var(--card); border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #222; position: relative; }
        .game-card img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
        .badge { position: absolute; top: 10px; left: 10px; background: red; font-size: 10px; padding: 2px 6px; border-radius: 5px; }

        /* Play Section */
        .play-area { text-align: center; background: #111; padding: 20px; border-radius: 15px; border: 1px solid var(--gold); }
        .btn-play { background: var(--gold); color: black; border: none; padding: 12px 30px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 15px; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #222; color: white; text-align: center; }

        /* Bottom Nav */
        .nav { position: fixed; bottom: 0; width: 100%; background: #16171b; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav-item { color: #777; font-size: 12px; text-align: center; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar" id="av">U</div>
            <div>
                <div id="u_name" style="font-size: 14px; font-weight: bold;">Loading...</div>
                <div id="u_id" style="font-size: 10px; color: #777;">ID: 0000</div>
            </div>
        </div>
        <div class="balance-box"><span id="bal">1.00</span> ETB</div>
    </div>

    <div class="content">
        <div id="home" class="page active">
            <h3 style="margin-bottom: 5px;">Top Games</h3>
            <div class="game-grid">
                <div class="game-card" onclick="openGame('Bingo')">
                    <span class="badge">HOT</span>
                    <i class="fas fa-dice" style="font-size: 40px; color: #8a2be2;"></i>
                    <h4>BINGO PRO</h4>
                    <p style="font-size: 10px; color: #777;">1.2k Players</p>
                </div>
                <div class="game-card" onclick="openGame('Aviator')">
                    <span class="badge" style="background: #ff003c;">NEW</span>
                    <i class="fas fa-plane" style="font-size: 40px; color: #ff003c;"></i>
                    <h4>AVIATOR</h4>
                    <p style="font-size: 10px; color: #777;">5.1k Players</p>
                </div>
            </div>
        </div>

        <div id="aviator_game" class="page">
            <button onclick="goHome()" style="background: none; border: none; color: var(--gold); margin-bottom: 10px;"><i class="fas fa-arrow-left"></i> Back</button>
            <div class="play-area">
                <h2 style="color: #ff003c;">AVIATOR 🚀</h2>
                <div id="multiplier" style="font-size: 40px; font-weight: bold; margin: 20px 0;">1.00x</div>
                <input type="number" id="betAmount" placeholder="Enter Bet (min 10 ETB)">
                <button class="btn-play" id="flyBtn" onclick="startAviator()">BET</button>
            </div>
        </div>

        <div id="bingo_game" class="page">
            <button onclick="goHome()" style="background: none; border: none; color: var(--gold); margin-bottom: 10px;"><i class="fas fa-arrow-left"></i> Back</button>
            <div class="play-area">
                <h2 style="color: #8a2be2;">BINGO 🎱</h2>
                <div id="bingo_res" style="font-size: 20px; margin: 20px 0;">Pick a number & Win!</div>
                <input type="number" id="bingoBet" placeholder="Enter Bet">
                <button class="btn-play" onclick="playBingo()">PLAY BINGO</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="goHome()"><i class="fas fa-home"></i><br>Home</div>
        <div class="nav-item"><i class="fas fa-wallet"></i><br>Wallet</div>
        <div class="nav-item"><i class="fas fa-gift"></i><br>Bonus</div>
        <div class="nav-item"><i class="fas fa-user"></i><br>Profile</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const uID = urlParams.get('id') || "Guest";
        const uName = urlParams.get('name') || "Player";
        const uUser = urlParams.get('user') || "None";

        document.getElementById('u_name').innerText = uName;
        document.getElementById('u_id').innerText = "ID: " + uID;
        document.getElementById('av').innerText = uName.charAt(0);

        let balance = 100.00; // Starting demo balance

        function openGame(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            if(name === 'Aviator') document.getElementById('aviator_game').classList.add('active');
            if(name === 'Bingo') document.getElementById('bingo_game').classList.add('active');
        }

        function goHome() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('home').classList.add('active');
        }

        // Aviator Logic (40% House Edge)
        function startAviator() {
            let bet = parseFloat(document.getElementById('betAmount').value);
            if(isNaN(bet) || bet > balance) return alert("Invalid Balance!");
            
            balance -= bet;
            document.getElementById('bal').innerText = balance.toFixed(2);
            
            let flyBtn = document.getElementById('flyBtn');
            flyBtn.disabled = true;
            flyBtn.innerText = "FLYING...";
            
            let mult = 1.00;
            // 40% probability the plane crashes early (below 1.5x)
            let crashPoint = Math.random() < 0.4 ? (1 + Math.random() * 0.5) : (1 + Math.random() * 5);
            
            let interval = setInterval(() => {
                mult += 0.05;
                document.getElementById('multiplier').innerText = mult.toFixed(2) + "x";
                
                if(mult >= crashPoint) {
                    clearInterval(interval);
                    document.getElementById('multiplier').style.color = "red";
                    document.getElementById('multiplier').innerText = "CRASHED at " + mult.toFixed(2) + "x";
                    flyBtn.disabled = false;
                    flyBtn.innerText = "BET AGAIN";
                }
            }, 100);
        }

        // Bingo Logic (40% House Edge)
        function playBingo() {
            let bet = parseFloat(document.getElementById('bingoBet').value);
            if(isNaN(bet) || bet > balance) return alert("Invalid Balance!");
            
            // 40% chance of losing regardless of "luck"
            let win = Math.random() > 0.4; 
            if(win) {
                let winAmt = bet * 1.8;
                balance += winAmt;
                document.getElementById('bingo_res').innerText = "🎉 WIN! + " + winAmt + " ETB";
                document.getElementById('bingo_res').style.color = "lime";
            } else {
                balance -= bet;
                document.getElementById('bingo_res').innerText = "❌ Better luck next time!";
                document.getElementById('bingo_res').style.color = "red";
            }
            document.getElementById('bal').innerText = balance.toFixed(2);
        }
    </script>
</body>
</html>
