<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER V34 ULTRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #ff0044; --premium: #b45cf5; }
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* History Bar */
        .history-pills::-webkit-scrollbar { display: none; }
        .pill { padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; background: #1a1a1a; border: 1px solid #333; }

        /* Navigation */
        .nav-top { position: fixed; top: 0; width: 100%; height: 70px; display: flex; justify-content: space-around; align-items: center; background: #080808; border-bottom: 1px solid #111; z-index: 1000; }
        .nav-item { color: #555; font-size: 10px; font-weight: 800; text-align: center; }
        .nav-item.active { color: var(--accent); }

        .page { display: none; height: calc(100vh - 70px); margin-top: 70px; overflow-y: auto; padding: 15px; }
        .active-page { display: block; }

        /* Screen */
        .screen { background: radial-gradient(circle at bottom left, #1f0505 0%, #000 100%); height: 250px; position: relative; border-radius: 25px; overflow: hidden; border: 2px solid #111; }
        #gamePath { stroke: var(--accent); stroke-width: 5; fill: none; filter: drop-shadow(0 0 8px var(--accent)); }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 45px; z-index: 10; transition: 0.1s linear; }
        
        /* Premium Icon */
        .premium-star { color: var(--premium); font-size: 12px; }
        .v-badge { color: #38bdf8; font-size: 10px; margin-left: 2px; }
    </style>
</head>
<body class="bg-black">

    <nav class="nav-top">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-plane-up text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-2xl mb-1"></i><br>DEPOSIT</div>
        <div onclick="showP('leaderboard')" id="n-leaderboard" class="nav-item"><i class="fa-solid fa-trophy text-2xl mb-1"></i><br>TOP</div>
        <div onclick="showP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user-gear text-2xl mb-1"></i><br>ADMIN</div>
    </nav>

    <section id="home" class="page active-page">
        <div id="history" class="history-pills flex gap-2 overflow-x-auto mb-3 no-scrollbar py-1">
            <span class="pill text-purple-500">1.54x</span>
            <span class="pill text-blue-500">2.10x</span>
            <span class="pill text-red-500">1.02x</span>
        </div>

        <div class="flex justify-between items-center mb-4">
             <div class="flex items-center gap-2">
                <div id="hPfp" class="w-10 h-10 rounded-full bg-zinc-900 border border-white/10 flex items-center justify-center overflow-hidden"></div>
                <div>
                    <p class="text-xs font-black flex items-center"><span id="hName">User</span> <i class="fa-solid fa-star premium-star ml-1"></i> <i class="fa-solid fa-circle-check v-badge"></i></p>
                    <p id="hBal" class="text-[10px] font-bold text-green-500">0.00 ETB</p>
                </div>
            </div>
            <button onclick="toggleMute()" class="w-10 h-10 glass rounded-full flex items-center justify-center"><i id="mIcon" class="fa-solid fa-volume-high text-xs"></i></button>
        </div>

        <div class="screen flex items-center justify-center mb-4">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 250 Q 0 250 0 250" /></svg>
            <div id="mTxt" class="font-game text-7xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane">✈️</div>
        </div>

        <div class="glass p-5 rounded-[30px] mb-4">
            <div class="flex justify-between items-center mb-4 bg-zinc-900/50 p-3 rounded-2xl">
                <button onclick="adjB(-10)" class="text-3xl font-black px-4">-</button>
                <input id="bInp" type="number" value="10" class="text-2xl font-black w-full text-center bg-transparent outline-none">
                <button onclick="adjB(10)" class="text-3xl font-black px-4">+</button>
            </div>
            <button id="bBtn" onclick="handleBet()" class="w-full py-6 rounded-3xl text-3xl font-black italic shadow-2xl active:scale-95" style="background:var(--accent)">BET</button>
        </div>

        <div id="liveList" class="space-y-2 pb-20"></div>
    </section>

    <section id="deposit" class="page">
        <div class="glass p-6 rounded-[30px] border-l-4 border-yellow-500 mb-6">
            <p class="text-[10px] text-zinc-500 mb-4 uppercase font-black">Transfer Money & Send Screenshot</p>
            <div onclick="copyT('1000179571815')" class="flex justify-between bg-zinc-900 p-5 rounded-2xl mb-3">
                <span class="font-black">CBE: 1000179571815</span><i class="fa-solid fa-copy text-yellow-600"></i>
            </div>
            <div onclick="copyT('0906067696')" class="flex justify-between bg-zinc-900 p-5 rounded-2xl">
                <span class="font-black">Telebirr: 0906067696</span><i class="fa-solid fa-copy text-blue-600"></i>
            </div>
        </div>

        <div class="glass p-8 rounded-[40px] text-center">
            <input type="file" id="ssInp" class="hidden" accept="image/*" onchange="previewImg(this)">
            <button onclick="document.getElementById('ssInp').click()" class="w-full bg-white/5 py-5 rounded-2xl font-black mb-4 italic border border-white/10">📂 SELECT RECEIPT FILE</button>
            <div id="prevBox" class="hidden mb-6"><img id="ssPrev" class="rounded-2xl max-h-60 mx-auto"></div>
            <button id="submitBtn" onclick="submitReceipt()" class="w-full py-5 rounded-2xl font-black shadow-2xl uppercase italic" style="background:var(--accent)">Confirm & Send to Admin</button>
        </div>
    </section>

    <section id="profile" class="page">
        <div id="admArea" class="hidden">
            <h2 class="text-red-600 font-black italic text-xl mb-6">ADMIN DASHBOARD</h2>
            <div id="admList" class="space-y-4 pb-20"></div>
        </div>
        <div id="noAdm" class="text-center mt-20">
            <i class="fa-solid fa-lock text-5xl text-zinc-800 mb-4"></i>
            <p class="text-zinc-600 font-black">RESTRICTED AREA</p>
        </div>
    </section>

    <audio id="sndJet" loop src="https://www.soundjay.com/transportation/sounds/jet-plane-fly-over-1.mp3"></audio>
    <audio id="sndBoom" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADM_USER = "Dawit_Fikadu21"; // ያንተ ዩዘርኔም
        let isMuted = false; let isFlying = false; let mult = 1.0;
        let realBal = parseFloat(localStorage.getItem('v34_bal')) || 0;
        let myBet = { active: false, amt: 0 };

        function init() {
            const user = tg.initDataUnsafe?.user;
            const uname = user?.username || "Guest";
            document.getElementById('hName').innerText = "@" + uname;
            
            const pfpHtml = user?.photo_url ? `<img src="${user.photo_url}" class="w-full h-full object-cover">` : `<div class="w-full h-full bg-zinc-800 flex items-center justify-center font-black">${uname[0]}</div>`;
            document.getElementById('hPfp').innerHTML = pfpHtml;

            if(uname === ADM_USER) {
                document.getElementById('admArea').classList.remove('hidden');
                document.getElementById('noAdm').classList.add('hidden');
                loadAdm();
            }
            updateDisplay(); loop();
        }

        // --- GAME LOGIC ---
        function loop() {
            if(isFlying) return;
            let timer = 5;
            let t = setInterval(() => {
                if(timer-- <= 0) { clearInterval(t); launch(); }
                genFakePlayers();
            }, 1000);
        }

        function launch() {
            isFlying = true; mult = 1.0;
            if(!isMuted) document.getElementById('sndJet').play();
            
            let crash = 1.1 + (Math.random() * 9.0);
            if(myBet.active && myBet.amt > 50) crash = 1.1 + (Math.random() * 0.5); // Risk Logic

            let eng = setInterval(() => {
                mult += 0.06;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 25, y = mult * 20;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px) rotate(-15deg)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 250 Q ${x/2} ${250-y} ${x+20} ${250-y-20}`);
                
                if(mult >= crash) { clearInterval(eng); explode(); }
            }, 80);
        }

        function explode() {
            isFlying = false;
            document.getElementById('sndJet').pause(); document.getElementById('sndJet').currentTime = 0;
            if(!isMuted) document.getElementById('sndBoom').play();
            
            // Add to History
            const hist = document.getElementById('history');
            const color = mult > 2 ? 'text-purple-500' : 'text-blue-500';
            hist.innerHTML = `<span class="pill ${color}">${mult.toFixed(2)}x</span>` + hist.innerHTML;
            
            document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "#ff0044";
            myBet.active = false; resetBUI();
            
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 250 Q 0 250 0 250');
                document.getElementById('mTxt').style.color = "white";
                loop();
            }, 3000);
        }

        function handleBet() {
            if(isFlying) {
                if(myBet.active) {
                    let win = myBet.amt * mult;
                    realBal += win; localStorage.setItem('v34_bal', realBal);
                    myBet.active = false; resetBUI(); updateDisplay();
                    tg.showAlert(`WIN: ${win.toFixed(2)} ETB`);
                }
                return;
            }
            let a = parseInt(document.getElementById('bInp').value);
            if(a > realBal || a <= 0) return tg.showAlert("Insufficient Balance!");
            realBal -= a; localStorage.setItem('v34_bal', realBal);
            myBet = { active: true, amt: a };
            updateDisplay();
            document.getElementById('bBtn').innerText = "CASH OUT";
            document.getElementById('bBtn').style.background = "#ea580c";
        }

        // --- SYSTEM ---
        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-' + id).classList.add('active');
            if(id !== 'home') document.getElementById('sndJet').pause();
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mIcon').className = isMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
            if(isMuted) document.getElementById('sndJet').pause();
        }

        function updateDisplay() { document.getElementById('hBal').innerText = realBal.toFixed(2) + " ETB"; }
        function adjB(v) { let i = document.getElementById('bInp'); i.value = Math.max(10, parseInt(i.value) + v); }
        function resetBUI() { document.getElementById('bBtn').innerText = "BET"; document.getElementById('bBtn').style.background = "var(--accent)"; }
        function copyT(t) { navigator.clipboard.writeText(t); tg.showAlert("Copped!"); }

        // --- PHOTO & ADMIN ---
        function previewImg(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => { document.getElementById('ssPrev').src = e.target.result; document.getElementById('prevBox').classList.remove('hidden'); };
                r.readAsDataURL(input.files[0]);
            }
        }

        function submitReceipt() {
            const f = document.getElementById('ssInp').files[0];
            if(!f) return tg.showAlert("Please select a photo first!");
            const r = new FileReader();
            r.onload = () => {
                let db = JSON.parse(localStorage.getItem('v34_db')) || [];
                db.push({ user: tg.initDataUnsafe?.user?.username || "Guest", img: r.result, time: new Date().toLocaleTimeString() });
                localStorage.setItem('v34_db', JSON.stringify(db));
                tg.showAlert("✅ Success! Receipt sent to Admin.");
                document.getElementById('prevBox').classList.add('hidden');
                document.getElementById('ssInp').value = "";
            };
            r.readAsDataURL(f);
        }

        function loadAdm() {
            const db = JSON.parse(localStorage.getItem('v34_db')) || [];
            document.getElementById('admList').innerHTML = db.map((it, i) => `
                <div class="glass p-5 rounded-3xl">
                    <p class="text-[10px] text-blue-500 mb-2 font-black uppercase">User: @${it.user} | ${it.time}</p>
                    <img src="${it.img}" class="w-full rounded-2xl mb-4 border border-white/5">
                    <div class="flex gap-2">
                        <button onclick="approve(${i})" class="flex-1 bg-green-600 py-4 rounded-xl font-black">APPROVE</button>
                        <button onclick="reject(${i})" class="flex-1 bg-red-600 py-4 rounded-xl font-black">REJECT</button>
                    </div>
                </div>`).join('') || "<p class='text-zinc-600 mt-10'>No pending receipts.</p>";
        }

        function approve(i) {
            let db = JSON.parse(localStorage.getItem('v34_db'));
            let amt = prompt("How much ETB to add?");
            if(amt && !isNaN(amt)) {
                // በዚህ ቦታ ላይ ለተጠቃሚው ባላንስ ይጨመራል (በሪል ሲስተም በዳታቤዝ ነው የሚሰራው)
                tg.showAlert(`Success! ${amt} ETB approved for @${db[i].user}`);
                db.splice(i, 1); localStorage.setItem('v34_db', JSON.stringify(db)); loadAdm();
            }
        }

        function reject(i) {
            let db = JSON.parse(localStorage.getItem('v34_db'));
            db.splice(i, 1); localStorage.setItem('v34_db', JSON.stringify(db)); loadAdm();
            tg.showAlert("Receipt Rejected.");
        }

        function genFakePlayers() {
            const list = document.getElementById('liveList');
            const n = ["Abebe","Kebede","Chaltu","Zenebe","Grima","Mese"];
            list.innerHTML = "";
            for(let i=0; i<8; i++) {
                list.innerHTML += `<div class="flex justify-between glass p-3 rounded-xl border border-white/5"><span class="text-[11px] font-black italic uppercase">${n[Math.floor(Math.random()*n.length)]} <i class="fa-solid fa-circle-check v-badge"></i></span><span class="st text-[10px] font-bold">Waiting...</span></div>`;
            }
        }

        init();
    </script>
</body>
</html>
