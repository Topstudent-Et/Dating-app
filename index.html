<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro - Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #ff003c;
            --secondary: #28a745;
            --bg: #0b0b0d;
            --panel: #1c1d22;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Section */
        .header {
            background: var(--panel);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }

        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-name { font-weight: bold; color: #4ecca3; font-size: 14px; }
        .balance-box { background: #000; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--secondary); color: var(--secondary); font-weight: bold; }

        /* Game Display */
        .game-screen {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #2a0505 0%, #000 100%);
            overflow: hidden;
        }

        #multiplier {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4.5rem;
            font-weight: 900;
            z-index: 10;
            text-shadow: 0 0 20px rgba(255, 0, 60, 0.5);
        }

        canvas { width: 100%; height: 100%; }

        /* Control Panel */
        .controls {
            background: var(--panel);
            padding: 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input { background: #000; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; text-align: center; font-size: 16px; }

        .btn { border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; height: 50px; font-size: 18px; }
        .bet-btn { background: var(--secondary); color: white; }
        .cash-btn { background: #ffc107; color: black; display: none; }

        /* Deposit/Withdraw Modal */
        .modal-btns { display: flex; gap: 10px; padding: 10px; background: var(--panel); }
        .wallet-btn { flex: 1; background: #333; color: white; padding: 8px; border-radius: 5px; border: none; font-size: 12px; }

        #history { position: absolute; top: 10px; left: 10px; display: flex; gap: 5px; overflow-x: auto; max-width: 80%; }
        .hist-tag { background: #222; padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #ffc107; }
    </style>
</head>
<body>

    <audio id="jetSnd" loop src="https://www.soundjay.com/transportation/sounds/jet-flying-1.mp3"></audio>
    <audio id="winSnd" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>
    <audio id="bombSnd" src="https://www.soundjay.com/mechanical/sounds/explosion-02.mp3"></audio>

    <div class="header">
        <div class="user-info">
            <span class="user-name" id="tgName">ተጫዋች</span>
        </div>
        <div class="balance-box" id="userBal">0.00 ETB</div>
    </div>

    <div class="modal-btns">
        <button class="wallet-btn" onclick="addMoney()">➕ ገቢ (Deposit)</button>
        <button class="wallet-btn" onclick="withdrawMoney()">➖ ወጪ (Withdraw)</button>
    </div>

    <div class="game-screen">
        <div id="history"></div>
        <div id="multiplier">1.00x</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="input-group">
            <label style="font-size: 11px; color: #888;">መጠን (ETB)</label>
            <input type="number" id="betAmount" value="10.00">
            <button id="betBtn" class="btn bet-btn" onclick="handleBet()">BET</button>
            <button id="cashBtn" class="btn cash-btn" onclick="handleCashOut()">CASH OUT</button>
        </div>
        <div class="input-group">
            <label style="font-size: 11px; color: #888;">Auto Stop (x)</label>
            <input type="number" id="autoStop" placeholder="2.00">
            <div style="font-size: 10px; color: #555; text-align: center; margin-top: 5px;">አውሮፕላኑ እዚህ ሲደርስ በራሱ ያቆማል</div>
        </div>
    </div>

<script>
    // Telegram WebApp Initialization
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    // User Data Handling
    const tgUser = tg.initDataUnsafe?.user;
    document.getElementById('tgName').innerText = tgUser ? tgUser.first_name : "Dai Player";

    // Balance Logic (LocalStorage በመጠቀም ሂሳብ መመዝገብ)
    let balance = parseFloat(localStorage.getItem('aviator_bal')) || 1000.00;
    function updateBalUI() {
        document.getElementById('userBal').innerText = balance.toFixed(2) + " ETB";
        localStorage.setItem('aviator_bal', balance);
    }
    updateBalUI();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const multDisplay = document.getElementById('multiplier');
    const jetSnd = document.getElementById('jetSnd');
    const winSnd = document.getElementById('winSnd');
    const bombSnd = document.getElementById('bombSnd');

    let isFlying = false;
    let multiplier = 1.00;
    let crashPoint;
    let animationId;
    let currentBet = 0;

    function handleBet() {
        const amt = parseFloat(document.getElementById('betAmount').value);
        if (amt > balance || amt <= 0) return alert("በቂ ሂሳብ የሎትም!");

        balance -= amt;
        currentBet = amt;
        updateBalUI();

        isFlying = true;
        multiplier = 1.00;
        
        // 40% House Profit Logic (ባለቤቱ እንዲያተርፍ)
        let chance = Math.random();
        crashPoint = (chance < 0.40) ? (Math.random() * 0.18 + 1.01) : (Math.random() * 5 + 1.2);

        document.getElementById('betBtn').style.display = 'none';
        document.getElementById('cashBtn').style.display = 'block';
        multDisplay.style.color = "white";

        jetSnd.play();
        animate();
    }

    function animate() {
        if (!isFlying) return;

        multiplier += 0.007 * Math.sqrt(multiplier);
        multDisplay.innerText = multiplier.toFixed(2) + "x";

        // Auto Stop Logic
        const auto = parseFloat(document.getElementById('autoStop').value);
        if (auto > 1 && multiplier >= auto) {
            handleCashOut();
            return;
        }

        if (multiplier >= crashPoint) {
            crash();
            return;
        }

        drawPlane();
        animationId = requestAnimationFrame(animate);
    }

    function drawPlane() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const x = (multiplier - 1) * 70;
        const y = canvas.height - ((multiplier - 1) * 50);

        ctx.strokeStyle = "#ff003c";
        ctx.lineWidth = 6;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "red";
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        ctx.quadraticCurveTo(x/2, canvas.height, x, y);
        ctx.stroke();

        ctx.font = "50px Arial";
        ctx.fillText("✈️", x - 25, y + 15);
    }

    function crash() {
        isFlying = false;
        jetSnd.pause();
        bombSnd.play();
        multDisplay.innerText = "FLEW AWAY!";
        multDisplay.style.color = "#ff4444";
        addHistory(multiplier);
        resetUI();
    }

    function handleCashOut() {
        if (!isFlying) return;
        isFlying = false;
        jetSnd.pause();
        winSnd.play();

        const winnings = currentBet * multiplier;
        balance += winnings;
        updateBalUI();

        multDisplay.style.color = "#28a745";
        addHistory(multiplier);
        resetUI();
        alert(`አሸንፈዋል! ${winnings.toFixed(2)} ETB`);
    }

    function resetUI() {
        document.getElementById('betBtn').style.display = 'block';
        document.getElementById('cashBtn').style.display = 'none';
        cancelAnimationFrame(animationId);
    }

    function addHistory(m) {
        const h = document.getElementById('history');
        const span = document.createElement('span');
        span.className = 'hist-tag';
        span.innerText = m.toFixed(2) + 'x';
        h.prepend(span);
    }

    // Wallet Functions
    function addMoney() {
        let amt = prompt("የሚጨምሩትን የገንዘብ መጠን ያስገቡ (ETB):");
        if (amt && !isNaN(amt)) {
            balance += parseFloat(amt);
            updateBalUI();
        }
    }

    function withdrawMoney() {
        let amt = prompt("ወጪ የሚያደርጉትን የገንዘብ መጠን ያስገቡ (ETB):");
        if (amt && !isNaN(amt) && amt <= balance) {
            balance -= parseFloat(amt);
            updateBalUI();
            alert("ወጪ የማድረጊያ ጥያቄዎ ተልኳል!");
        } else {
            alert("በቂ ሂሳብ የሎትም ወይም የተሳሳተ ቁጥር ነው!");
        }
    }

    canvas.width = window.innerWidth;
    canvas.height = 300;
</script>
</body>
</html>
