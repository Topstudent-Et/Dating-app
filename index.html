<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPRIBE AVIATOR • Crash Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0A0E17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* Main app container - like real Spribe Aviator */
        .aviator-app {
            max-width: 580px;
            width: 100%;
            background: linear-gradient(145deg, #0D1220 0%, #070B14 100%);
            border-radius: 48px;
            padding: 20px 18px 28px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 200, 70, 0.2);
        }

        /* Header with balance */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo h2 {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD966, #FFA826);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .logo span {
            font-size: 0.65rem;
            color: #6C7A9E;
        }
        .balance-box {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 6px 20px;
            text-align: center;
            border: 1px solid #FFD96644;
        }
        .balance-box small {
            font-size: 0.65rem;
            color: #9AA4C5;
        }
        .balance-box .amount {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFE484;
            line-height: 1;
        }

        /* Top controls - sound + auto */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #060A12AA;
            border-radius: 100px;
            padding: 6px 16px;
            margin-bottom: 20px;
        }
        .fun-badge {
            background: #FFCF4A;
            color: #1E1F2C;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 0.7rem;
        }
        .sound-btn {
            background: #1A2335;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
        }
        .auto-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0F1626;
            padding: 4px 12px;
            border-radius: 60px;
        }
        .auto-area span {
            font-size: 0.7rem;
            font-weight: 600;
            color: #FFDE9E;
        }
        .auto-input {
            width: 60px;
            background: #010101cc;
            border: 1px solid #FFB347;
            border-radius: 30px;
            padding: 5px 8px;
            color: #FFE6A3;
            font-weight: bold;
            text-align: center;
        }
        .auto-set-btn {
            background: #2F3B5C;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .auto-status {
            font-size: 0.7rem;
            background: #2C3A2E;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* Multiplier history strip */
        .multiplier-strip {
            background: #03070F70;
            border-radius: 60px;
            padding: 12px 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 12px 0;
        }
        .mult-badge {
            background: #111A28;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            color: #F5CD6C;
            font-size: 0.95rem;
            box-shadow: inset 0 1px 0 #ffffff0d, 0 2px 5px black;
        }

        /* Flight zone with canvas and live multiplier */
        .flight-zone {
            background: #01040C;
            border-radius: 40px;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid rgba(255, 190, 70, 0.4);
        }
        .graph-container {
            background: #020509;
            border-radius: 32px;
            padding: 6px;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 24px;
            background: #000000;
        }
        .live-mult {
            text-align: center;
            font-size: 3.2rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            color: #FFDF8C;
            text-shadow: 0 0 12px #FF8C00;
            margin: 14px 0 8px;
        }
        .game-status {
            background: #111A2E;
            text-align: center;
            padding: 10px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* Betting panel like real aviator */
        .bet-panel {
            background: #0B111FCC;
            border-radius: 44px;
            padding: 18px 16px;
            margin: 18px 0;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .bet-label {
            font-weight: 700;
            color: #B9C4E5;
        }
        .bet-input {
            background: #010101dd;
            border: 1.5px solid #F3B33D;
            border-radius: 60px;
            padding: 10px 18px;
            font-size: 1.3rem;
            font-weight: bold;
            width: 140px;
            text-align: center;
            color: #FFE6A3;
        }
        .quick-bets {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .quick-bet {
            background: #1E293B;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            color: #FFE2A4;
            cursor: pointer;
            transition: 0.07s linear;
        }
        .action-buttons {
            display: flex;
            gap: 14px;
        }
        .btn-cash {
            background: linear-gradient(120deg, #F0A429, #FF8C2E);
            border: none;
            padding: 14px;
            font-weight: 800;
            font-size: 1.2rem;
            border-radius: 60px;
            flex: 1;
            cursor: pointer;
            box-shadow: 0 5px 0 #874D12;
            color: #0E121F;
        }
        .btn-bet {
            background: linear-gradient(120deg, #236B9E, #124A6E);
            border: none;
            padding: 14px;
            font-weight: 800;
            font-size: 1.2rem;
            border-radius: 60px;
            flex: 1;
            cursor: pointer;
            box-shadow: 0 5px 0 #08222E;
            color: white;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3A2A0A;
        }
        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        /* Stats and recent */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #03060CAA;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 0.7rem;
            font-weight: 500;
            margin: 12px 0;
        }
        .recent-history {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .history-chip {
            background: #0E1624;
            padding: 5px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-family: monospace;
        }
        footer {
            font-size: 0.6rem;
            text-align: center;
            color: #5E6D8F;
            margin-top: 16px;
        }
        @media (max-width: 500px) {
            .aviator-app { padding: 16px; }
            .live-mult { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<div class="aviator-app">
    <!-- header -->
    <div class="header">
        <div class="logo">
            <h2>✈️ AVIATOR</h2>
            <span>by spribe style</span>
        </div>
        <div class="balance-box">
            <small>BALANCE (ETB)</small>
            <div class="amount" id="mainBalance">50000.00</div>
        </div>
    </div>

    <!-- controls: sound & auto cashout -->
    <div class="controls-row">
        <div class="fun-badge">🎮 DEMO MODE</div>
        <button id="soundControl" class="sound-btn">🔊 ON</button>
        <div class="auto-area">
            <span>⚡ AUTO</span>
            <input type="number" id="autoMult" class="auto-input" step="0.5" min="1.2" value="2.5">
            <button id="setAuto" class="auto-set-btn">SET</button>
            <span id="autoState" class="auto-status">OFF</span>
        </div>
    </div>

    <!-- multiplier history -->
    <div class="multiplier-strip" id="multiplierHistory"></div>

    <!-- flight zone (graph + multiplier) -->
    <div class="flight-zone">
        <div class="graph-container">
            <canvas id="flightCanvas" width="540" height="150" style="width:100%; height:auto; aspect-ratio:540/150"></canvas>
        </div>
        <div class="live-mult" id="liveMultiplier">1.00x</div>
        <div class="game-status" id="gameMessage">✨ PLACE BET TO START FLIGHT</div>
    </div>

    <!-- betting panel -->
    <div class="bet-panel">
        <div class="bet-row">
            <span class="bet-label">💰 BET AMOUNT</span>
            <input type="number" id="betAmount" class="bet-input" value="4.00" step="1" min="1">
        </div>
        <div class="quick-bets">
            <button class="quick-bet" data-bet="4">4 ETB</button>
            <button class="quick-bet" data-bet="16">16 ETB</button>
            <button class="quick-bet" data-bet="40">40 ETB</button>
            <button class="quick-bet" data-bet="80">80 ETB</button>
            <button class="quick-bet" data-bet="400">400 ETB</button>
        </div>
        <div class="action-buttons">
            <button class="btn-bet" id="placeBetBtn">🚀 PLACE BET</button>
            <button class="btn-cash" id="cashoutBtn">💸 CASHOUT</button>
        </div>
    </div>

    <!-- statistics & recent rounds -->
    <div class="stats-bar">
        <span>🏆 BEST WIN: <strong id="maxWinSpan">0.00</strong> ETB</span>
        <span>🔄 ROUND: <span id="roundCounter">217</span></span>
        <span>📈 MULT: <span id="currentMultDisplay">1.00x</span></span>
    </div>
    <div class="recent-history" id="recentList"></div>
    <footer>✈️ multiplier increases while plane flies • cashout before crash • auto cashout available</footer>
</div>

<script>
    // ==================== GAME CORE (SPRIBE STYLE) ====================
    let balance = 50000.00;
    let currentBet = 0;
    let gameActive = false;      // bet placed, plane climbing
    let roundLive = false;       // multiplier increasing
    let multiplier = 1.00;
    let crashValue = 1.00;
    let intervalId = null;
    let autoTarget = 0;
    let soundEnabled = true;
    let bestWin = 0;
    let roundNumber = 217;
    let previousMultipliers = [1.31, 1.98, 2.29, 1.50, 16.69, 1.21, 1.42];

    // Canvas references
    const canvas = document.getElementById('flightCanvas');
    const ctx = canvas.getContext('2d');
    let flightData = [{time: 0, mult: 1}];

    // DOM elements
    const balanceSpan = document.getElementById('mainBalance');
    const liveMultSpan = document.getElementById('liveMultiplier');
    const gameMsgSpan = document.getElementById('gameMessage');
    const betInput = document.getElementById('betAmount');
    const placeBtn = document.getElementById('placeBetBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const maxWinSpan = document.getElementById('maxWinSpan');
    const roundCounterSpan = document.getElementById('roundCounter');
    const currentMultDisplay = document.getElementById('currentMultDisplay');
    const multiplierHistoryDiv = document.getElementById('multiplierHistory');
    const recentListDiv = document.getElementById('recentList');
    const autoStateSpan = document.getElementById('autoState');
    const setAutoBtn = document.getElementById('setAuto');
    const autoMultInput = document.getElementById('autoMult');
    const soundControlBtn = document.getElementById('soundControl');

    // Helper: play sounds
    function playSfx(type) {
        if (!soundEnabled) return;
        try {
            let audio = new Audio();
            if (type === 'cash') audio.src = 'https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3';
            else if (type === 'explode') audio.src = 'https://www.soundjay.com/misc/sounds/explosion-01.mp3';
            else if (type === 'fly') audio.src = 'https://www.soundjay.com/transport/plane-flying-01.mp3';
            else return;
            audio.volume = 0.4;
            audio.play().catch(e => console.log);
        } catch(e) {}
    }

    // update UI values
    function refreshUI() {
        balanceSpan.innerText = balance.toFixed(2);
        liveMultSpan.innerText = multiplier.toFixed(2) + 'x';
        currentMultDisplay.innerText = multiplier.toFixed(2) + 'x';
        maxWinSpan.innerText = bestWin.toFixed(2);
        roundCounterSpan.innerText = roundNumber;
    }

    // draw realistic flight graph
    function drawFlightGraph() {
        if (!ctx) return;
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (flightData.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = '#FFC857';
        ctx.lineWidth = 3;
        for (let i = 0; i < flightData.length; i++) {
            let x = (flightData[i].time / 12) * w;
            let y = h - (Math.min(flightData[i].mult, 40) / 40) * h;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        // plane icon
        if (flightData.length) {
            let last = flightData[flightData.length - 1];
            let lastX = (last.time / 12) * w;
            let lastY = h - (Math.min(last.mult, 40) / 40) * h;
            ctx.font = '22px "Segoe UI"';
            ctx.fillStyle = '#FFDD99';
            ctx.fillText('✈️', lastX - 12, lastY - 8);
        }
        // grid lines
        ctx.beginPath();
        ctx.strokeStyle = '#2F3A5C';
        ctx.lineWidth = 0.6;
        for (let i = 1; i <= 3; i++) {
            let yLine = h - (i / 3) * h;
            ctx.moveTo(0, yLine);
            ctx.lineTo(w, yLine);
            ctx.stroke();
        }
    }

    function addGraphPoint(mult, timeSec) {
        flightData.push({ time: timeSec, mult: mult });
        if (flightData.length > 55) flightData.shift();
        drawFlightGraph();
    }

    // update multiplier history strip
    function updateHistory(newMult) {
        previousMultipliers.unshift(parseFloat(newMult.toFixed(2)));
        if (previousMultipliers.length > 9) previousMultipliers.pop();
        multiplierHistoryDiv.innerHTML = '';
        previousMultipliers.slice(0, 8).forEach(m => {
            let chip = document.createElement('span');
            chip.className = 'mult-badge';
            chip.innerText = m.toFixed(2) + 'x';
            multiplierHistoryDiv.appendChild(chip);
        });
        recentListDiv.innerHTML = previousMultipliers.slice(0, 5).map(m => `<div class="history-chip">${m.toFixed(2)}x</div>`).join('');
    }

    // generate random crash point (same as spribe distribution)
    function getRandomCrash() {
        let r = Math.random();
        if (r < 0.55) return 1.00 + Math.random() * 2.2;
        else if (r < 0.82) return 2.8 + Math.random() * 4.8;
        else return 7.5 + Math.random() * 28;
    }

    // stop round interval
    function stopRound() {
        if (intervalId) clearInterval(intervalId);
        intervalId = null;
        roundLive = false;
    }

    // crash event
    function crashEvent() {
        if (!roundLive) return;
        stopRound();
        roundLive = false;
        if (gameActive && currentBet > 0) {
            // player loses the bet (already deducted when placed)
            gameMsgSpan.innerText = `💥 CRASH! You lost ${currentBet.toFixed(2)} ETB`;
            playSfx('explode');
            currentBet = 0;
            gameActive = false;
        } else {
            gameActive = false;
        }
        updateHistory(multiplier);
        flightData = [{ time: 0, mult: 1 }];
        drawFlightGraph();
        refreshUI();
        gameMsgSpan.style.background = "#4C1E2A";
        setTimeout(() => {
            if (!roundLive && !gameActive) gameMsgSpan.style.background = "#111A2E";
            gameMsgSpan.innerText = "🛬 PLANE CRASHED • PLACE NEW BET";
        }, 1800);
        enableButtons(true);
        roundNumber++;
        roundCounterSpan.innerText = roundNumber;
        refreshUI();
    }

    // multiplier increase loop (like real aviator)
    let elapsedTime = 0;
    function startMultiplierLoop() {
        if (intervalId) clearInterval(intervalId);
        multiplier = 1.00;
        elapsedTime = 0;
        flightData = [{ time: 0, mult: 1 }];
        drawFlightGraph();
        intervalId = setInterval(() => {
            if (!roundLive) return;
            elapsedTime += 0.16;
            let step = 0.02 + (Math.random() * 0.045);
            multiplier = +(multiplier + step).toFixed(3);
            addGraphPoint(multiplier, elapsedTime);
            if (multiplier >= crashValue && roundLive) {
                multiplier = crashValue;
                refreshUI();
                crashEvent();
                return;
            }
            refreshUI();
            // auto cashout trigger
            if (autoTarget > 0 && multiplier >= autoTarget && roundLive && gameActive && currentBet > 0) {
                performCashout(true);
            }
            if (multiplier > 28) liveMultSpan.style.color = "#ff7b7b";
            else liveMultSpan.style.color = "#FFDF8C";
        }, 155);
    }

    // cashout function
    function performCashout(isAuto = false) {
        if (!roundLive || !gameActive || currentBet <= 0) {
            if (!isAuto) gameMsgSpan.innerText = "No active round!";
            return;
        }
        let winAmount = currentBet * multiplier;
        balance += winAmount;
        if (winAmount > bestWin) bestWin = winAmount;
        refreshUI();
        updateHistory(multiplier);
        playSfx('cash');
        if (winAmount >= 250) canvasConfetti({ particleCount: 150, spread: 65, origin: { y: 0.6 } });
        gameMsgSpan.innerText = `🎉 CASHOUT! Won ${winAmount.toFixed(2)} ETB @ ${multiplier.toFixed(2)}x 🎉`;
        stopRound();
        roundLive = false;
        gameActive = false;
        currentBet = 0;
        flightData = [{ time: 0, mult: 1 }];
        drawFlightGraph();
        enableButtons(true);
        gameMsgSpan.style.background = "#1F5530";
        setTimeout(() => {
            if (!roundLive) gameMsgSpan.style.background = "#111A2E";
        }, 1500);
        roundNumber++;
        roundCounterSpan.innerText = roundNumber;
        refreshUI();
    }

    // place bet action
    function placeBetAction() {
        if (roundLive) {
            gameMsgSpan.innerText = "⛔ Flight in progress, wait!";
            return;
        }
        if (gameActive) {
            gameMsgSpan.innerText = "Already active bet, cashout first!";
            return;
        }
        let betVal = parseFloat(betInput.value);
        if (isNaN(betVal) || betVal <= 0) betVal = 4;
        if (betVal > balance) {
            gameMsgSpan.innerText = "❌ Insufficient balance!";
            return;
        }
        currentBet = betVal;
        balance -= currentBet;
        refreshUI();
        roundLive = true;
        gameActive = true;
        crashValue = getRandomCrash();
        multiplier = 1.00;
        refreshUI();
        startMultiplierLoop();
        playSfx('fly');
        gameMsgSpan.innerText = `✈️ FLYING! BET: ${currentBet.toFixed(2)} ETB • multiplier rising`;
        enableButtons(false);
        placeBtn.disabled = true;
        cashoutBtn.disabled = false;
        roundCounterSpan.innerText = roundNumber;
    }

    function enableButtons(enable) {
        if (enable) {
            placeBtn.disabled = false;
            cashoutBtn.disabled = false;
            betInput.disabled = false;
        } else {
            placeBtn.disabled = true;
            cashoutBtn.disabled = false;
            betInput.disabled = true;
        }
        if (!roundLive && !gameActive) cashoutBtn.disabled = true;
        else if (roundLive && gameActive) cashoutBtn.disabled = false;
    }

    // quick bets
    document.querySelectorAll('.quick-bet').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (roundLive) { gameMsgSpan.innerText = "Wait, round active"; return; }
            let val = parseFloat(btn.getAttribute('data-bet'));
            if (!isNaN(val)) betInput.value = val.toFixed(2);
        });
    });

    // auto cashout set
    setAutoBtn.addEventListener('click', () => {
        let val = parseFloat(autoMultInput.value);
        if (isNaN(val) || val < 1.1) val = 2.5;
        autoTarget = val;
        autoStateSpan.innerText = `${val.toFixed(2)}x`;
        autoStateSpan.style.background = "#2C5A2E";
        setTimeout(() => {
            if (autoTarget) autoStateSpan.innerText = `${autoTarget.toFixed(2)}x`;
        }, 1600);
    });

    // sound toggle
    soundControlBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundControlBtn.innerText = soundEnabled ? "🔊 ON" : "🔇 OFF";
    });

    placeBtn.addEventListener('click', placeBetAction);
    cashoutBtn.addEventListener('click', () => performCashout(false));

    // initialize game
    function init() {
        refreshUI();
        updateHistory(1.08);
        previousMultipliers = [1.31, 1.98, 2.29, 1.50, 16.69, 1.21, 1.42];
        updateHistory(1.05);
        multiplier = 1.00;
        liveMultSpan.innerText = "1.00x";
        gameMsgSpan.innerText = "✨ PLACE BET TO START FLIGHT";
        roundLive = false;
        gameActive = false;
        currentBet = 0;
        roundNumber = 217;
        roundCounterSpan.innerText = roundNumber;
        drawFlightGraph();
        autoTarget = 0;
        autoStateSpan.innerText = "OFF";
        autoMultInput.value = "2.5";
        soundEnabled = true;
        soundControlBtn.innerText = "🔊 ON";
        enableButtons(true);
    }
    init();
    window.addEventListener('resize', () => drawFlightGraph());
</script>
</body>
</html>
