<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME PRO V2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Rectangle Frame */
        .game-area { 
            position: relative; 
            height: 35vh; 
            margin: 15px; 
            border: 2px solid #1a1a1a; 
            border-radius: 20px; 
            background: radial-gradient(circle at bottom, #150000, #000);
            overflow: hidden;
        }

        #multiplier { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 3.5rem; font-weight: 900; z-index: 20; color: #fff; }
        #plane { position: absolute; font-size: 30px; z-index: 30; transition: 0.1s linear; filter: drop-shadow(0 0 10px red); }
        #svgPath { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        #redLine { stroke: #ff0000; stroke-width: 4; fill: none; }

        /* Control Panel */
        .panel { padding: 0 15px; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; gap: 10px; align-items: center; }
        .input-box { flex: 1; display: flex; align-items: center; justify-content: space-between; background: #0a0a0a; border: 1px solid #222; border-radius: 12px; height: 50px; padding: 0 15px; font-weight: 900; }
        .bet-btn { background: linear-gradient(180deg, #16a34a, #15803d); width: 40%; height: 50px; border-radius: 12px; font-weight: 900; border-bottom: 4px solid #052e16; }

        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 120px; }
        .active { display: block; }
        
        /* Podium Style */
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 20px 0; }
        .p-card { background: #0a0a0a; border: 1px solid #222; border-radius: 15px; display: flex; flex-direction: column; align-items: center; padding: 12px; text-align: center; }
        .first { width: 110px; height: 140px; border-color: #fbbf24; }
        .second, .third { width: 90px; height: 110px; }
    </style>
</head>
<body>

    <header class="flex justify-between items-center p-4 bg-black border-b border-zinc-900 sticky top-0 z-[1000]">
        <div class="flex items-center gap-3">
            <img id="uPic" src="" class="w-10 h-10 rounded-full border border-zinc-800 bg-zinc-900">
            <div><p id="uDisp" class="text-[10px] font-black uppercase">PLAYER</p><p class="text-[7px] text-green-500 font-bold uppercase">Online</p></div>
        </div>
        <div class="bg-zinc-900 px-4 py-1.5 rounded-xl border border-zinc-800"><span id="mainBal" class="text-green-500 font-game text-lg">0.00</span></div>
    </header>

    <div id="playPage" class="page active">
        <div class="game-area">
            <div id="multiplier" class="font-game">1.00x</div>
            <svg id="svgPath"><path id="redLine" d=""></path></svg>
            <div id="plane" style="left: 10%; bottom: 10%;">✈️</div>
        </div>
        <div class="panel">
            <div class="row">
                <div class="input-box"><button onclick="adj('a1',-50)">-</button><input id="a1" type="number" value="100" class="bg-transparent w-full text-center outline-none"><button onclick="adj('a1',50)" class="text-green-500">+</button></div>
                <button class="bet-btn" onclick="tg.HapticFeedback.impactOccurred('medium')">BET</button>
            </div>
            <div class="row">
                <div class="input-box"><button onclick="adj('a2',-50)">-</button><input id="a2" type="number" value="200" class="bg-transparent w-full text-center outline-none"><button onclick="adj('a2',50)" class="text-green-500">+</button></div>
                <button class="bet-btn" onclick="tg.HapticFeedback.impactOccurred('medium')">BET</button>
            </div>
        </div>
    </div>

    <div id="walletPage" class="page p-6">
        <div class="flex gap-2 mb-6">
            <button onclick="tab('d')" id="tabD" class="flex-1 bg-blue-600 py-3 rounded-xl font-black text-xs">DEPOSIT</button>
            <button onclick="tab('w')" id="tabW" class="flex-1 bg-zinc-900 py-3 rounded-xl font-black text-xs">WITHDRAW</button>
        </div>

        <div id="dSec">
            <div class="space-y-3">
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800" onclick="cp('1000179571815','CBE')">
                    <p class="text-[8px] text-zinc-500 font-bold uppercase">CBE (ዳዊት ፍቃዱ)</p>
                    <p class="text-lg font-black">1000179571815 <i class="fas fa-copy ml-2 text-blue-500"></i></p>
                </div>
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800" onclick="cp('165097254','Abyssinia')">
                    <p class="text-[8px] text-zinc-500 font-bold uppercase">Abyssinia (ዳዊት ፍቃዱ)</p>
                    <p class="text-lg font-black">165097254 <i class="fas fa-copy ml-2 text-yellow-500"></i></p>
                </div>
                <input type="number" id="da" placeholder="የገንዘብ መጠን" class="w-full bg-zinc-900 p-4 rounded-xl outline-none border border-zinc-800 mt-4">
                <input type="text" id="df" placeholder="FT / Transaction Number" class="w-full bg-zinc-900 p-4 rounded-xl outline-none border border-zinc-800">
                <button onclick="sR('Deposit')" class="w-full bg-green-600 py-4 rounded-xl font-black">ያስገቡ</button>
            </div>
        </div>

        <div id="wSec" class="hidden">
            <div class="space-y-4">
                <input type="number" id="wa" placeholder="የሚወጣ መጠን" class="w-full bg-zinc-900 p-4 rounded-xl outline-none border border-zinc-800">
                <input type="text" id="wx" placeholder="የእርሶ ባንክ አካውንት" class="w-full bg-zinc-900 p-4 rounded-xl outline-none border border-zinc-800">
                <button onclick="sR('Withdraw')" class="w-full bg-red-600 py-4 rounded-xl font-black">ገንዘብ ማውጫ ጥያቄ ላክ</button>
            </div>
        </div>
    </div>

    <div id="topPage" class="page p-5">
        <div class="podium">
            <div class="p-card second"><span>🥈</span><p class="text-[9px] font-black mt-2">ሳራ ካሳሁን</p><p class="text-green-500 font-bold">92,400</p></div>
            <div class="p-card first"><span>👑</span><p class="text-[11px] font-black mt-2">አቤል ተስፋዬ</p><p class="text-green-500 font-bold">128,500</p></div>
            <div class="p-card third"><span>🥉</span><p class="text-[9px] font-black mt-2">ዳዊት አሰፋ</p><p class="text-green-500 font-bold">74,200</p></div>
        </div>
        <div id="winL" class="space-y-2"></div>
    </div>

    <div id="profilePage" class="page p-10 text-center">
        <img id="uPicL" src="" class="w-24 h-24 rounded-full mx-auto border-4 border-zinc-900 mb-4 bg-zinc-800">
        <h2 id="uNameL" class="font-black text-xl mb-6">PLAYER</h2>
        <div class="grid grid-cols-2 gap-3 mb-10">
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800"><p id="sB" class="text-green-500 font-game text-xl">0.00</p><p class="text-[8px]">BALANCE</p></div>
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800"><p id="sP" class="font-game text-xl">0</p><p class="text-[8px]">GAMES</p></div>
        </div>
        <div class="bg-zinc-900 p-6 rounded-3xl text-left border border-zinc-800">
            <p class="font-black text-sm">💰 ጋብዘው ያትርፉ!</p>
            <p class="text-[10px] text-zinc-500 mt-2">በየቀኑ እስከ 100,000 ብር ያሸንፉ! አንድ ሰው ሲጋብዙ 5 ብር ያገኛሉ።</p>
            <button onclick="sh()" class="w-full bg-blue-600 py-4 rounded-xl font-black mt-5 text-xs">ሼር ያድርጉ</button>
        </div>
        <button id="admB" onclick="showPage('admin')" class="hidden w-full bg-zinc-800 py-3 rounded-xl mt-6 font-black text-[10px] text-zinc-500">ADMIN PANEL</button>
    </div>

    <div id="adminPage" class="page p-6"><h2 class="text-center font-black text-red-600 mb-6">ADMIN CONTROL</h2><div id="admL" class="space-y-3"></div></div>

    <nav class="fixed bottom-0 w-full h-20 bg-black border-t border-zinc-900 flex justify-around items-center pb-4">
        <div onclick="showPage('play')" id="n-play" class="text-green-500 flex flex-col items-center"><i class="fas fa-gamepad"></i><span class="text-[8px] mt-1 font-black">GAME</span></div>
        <div onclick="showPage('wallet')" id="n-wallet" class="flex flex-col items-center"><i class="fas fa-wallet"></i><span class="text-[8px] mt-1 font-black">WALLET</span></div>
        <div onclick="showPage('top')" id="n-top" class="flex flex-col items-center"><i class="fas fa-crown"></i><span class="text-[8px] mt-1 font-black">TOP</span></div>
        <div onclick="showPage('profile')" id="n-profile" class="flex flex-col items-center"><i class="fas fa-user-circle"></i><span class="text-[8px] mt-1 font-black">ME</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = 1476161161;
        let user = tg.initDataUnsafe.user || { id: 1476161161, first_name: "Nahom" };
        let db = JSON.parse(localStorage.getItem('w_pro_db')) || { bal: 0.0, played: 0, reqs: [] };

        const NAMES = ["ዮናስ መኮንን", "ቤተልሔም ታደሰ", "ሔኖክ አበበ", "ብስራት ደምሴ", "ፅዮን ግርማ", "ዳዊት ወልዴ", "ኪያ ተፈራ", "ሊዲያ ሙሉጌታ", "ዮሴፍ አየለ", "በረከት ደረጄ", "ሰላም አያሌው"];

        function save() {
            localStorage.setItem('w_pro_db', JSON.stringify(db));
            document.getElementById('mainBal').innerText = db.bal.toFixed(2);
            document.getElementById('sB').innerText = db.bal.toFixed(2);
            document.getElementById('sP').innerText = db.played;
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById(p+'Page').classList.add('active');
            document.querySelectorAll('nav div').forEach(e => e.classList.remove('text-green-500'));
            document.getElementById('n-'+p).classList.add('text-green-500');
            if(p==='top') renderW();
            if(p==='admin') renderA();
        }

        function tab(t) {
            document.getElementById('dSec').classList.toggle('hidden', t==='w');
            document.getElementById('wSec').classList.toggle('hidden', t==='d');
            document.getElementById('tabD').className = t==='d' ? 'flex-1 bg-blue-600 py-3 rounded-xl font-black text-xs' : 'flex-1 bg-zinc-900 py-3 rounded-xl font-black text-xs';
            document.getElementById('tabW').className = t==='w' ? 'flex-1 bg-red-600 py-3 rounded-xl font-black text-xs' : 'flex-1 bg-zinc-900 py-3 rounded-xl font-black text-xs';
        }

        function adj(id, v) { let e = document.getElementById(id); let nv = parseInt(e.value)+v; if(nv>=10) e.value=nv; }
        function cp(t,m) { navigator.clipboard.writeText(t); alert(m + " አካውንት ኮፒ ተደርጓል!"); }
        function sh() { window.open(`https://t.me/share/url?url=`+encodeURIComponent(`በየቀኑ እስከ 100,000 ብር ያሸንፉ! t.me/world_all_gamesbot?start=ref${user.id}`)); }

        function sR(t) {
            const a = (t==='Deposit')?document.getElementById('da').value:document.getElementById('wa').value;
            const x = (t==='Deposit')?document.getElementById('df').value:document.getElementById('wx').value;
            if(!a || !x) return alert("መረጃ በትክክል ይሙሉ!");
            db.reqs.push({id: Date.now(), user: user.first_name, type: t, amt: parseFloat(a), extra: x});
            save(); alert("ጥያቄዎ ለአድሚን ደርሷል!");
        }

        function renderA() {
            const l = document.getElementById('admL');
            l.innerHTML = db.reqs.map(r => `
                <div class="bg-zinc-900 p-4 rounded-xl flex justify-between border border-zinc-800">
                    <div><p class="text-[10px] font-black">${r.user} (${r.type})</p><p class="text-green-500 font-bold">${r.amt} ETB</p><p class="text-[8px] text-zinc-500">${r.extra}</p></div>
                    <button onclick="ap(${r.id})" class="bg-green-600 px-4 rounded-lg font-bold">OK</button>
                </div>`).join('');
        }

        function ap(id) {
            const i = db.reqs.findIndex(r => r.id === id);
            if(db.reqs[i].type==='Deposit') db.bal += db.reqs[i].amt;
            if(db.reqs[i].type==='Withdraw') db.bal -= db.reqs[i].amt;
            db.reqs.splice(i, 1); save(); renderA();
        }

        function renderW() {
            const l = document.getElementById('winL'); l.innerHTML = "";
            for(let i=4; i<=50; i++) l.innerHTML += `<div class="bg-zinc-900/40 p-3 rounded-xl flex justify-between text-[11px] border border-zinc-900"><span>#${i} ${NAMES[i%NAMES.length]}</span><span class="font-bold text-zinc-400">${(50000 - i*900).toLocaleString()}</span></div>`;
        }

        let m = 1.0;
        function loop() {
            const p = document.getElementById('plane'), ml = document.getElementById('multiplier'), line = document.getElementById('redLine'), area = document.querySelector('.game-area');
            let crash = 1.2 + Math.random() * 5, pts = [];
            let t = setInterval(() => {
                m += 0.04; ml.innerText = m.toFixed(2) + "x";
                let x = 10+(m-1)*13, y = 10+(m-1)*11;
                p.style.left = x + "%"; p.style.bottom = y + "%";
                let ax = (area.clientWidth * x)/100, ay = area.clientHeight - (area.clientHeight * y)/100;
                pts.push(`${ax},${ay}`); line.setAttribute("d", "M" + pts.join(" L"));
                if(m >= crash) {
                    clearInterval(t); db.played++; save();
                    ml.style.color = "#ff0000";
                    setTimeout(() => { m=1.0; ml.style.color="#fff"; line.setAttribute("d",""); p.style.left="10%"; p.style.bottom="10%"; loop(); }, 3000);
                }
            }, 100);
        }

        window.onload = () => {
            document.getElementById('uDisp').innerText = user.first_name;
            document.getElementById('uNameL').innerText = user.first_name;
            if(user.photo_url) { document.getElementById('uPic').src = user.photo_url; document.getElementById('uPicL').src = user.photo_url; }
            if(user.id === ADMIN_ID) document.getElementById('admB').classList.remove('hidden');
            save(); loop();
        };
    </script>
</body>
</html>
