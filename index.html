<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAI LUXURY BETTING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;800&display=swap');
        body { background-color: #080a0c; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Navigation */
        .bottom-nav { background: rgba(18, 22, 28, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #2d3748; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; color: #718096; transition: 0.3s; }
        .nav-item.active { color: #e91e63; }

        /* Aviator Special Animation */
        .aviator-container { background: linear-gradient(to bottom, #0f1218, #000); height: 280px; position: relative; border-radius: 15px; overflow: hidden; border: 1px solid #1f2937; }
        .plane-sprite { 
            position: absolute; bottom: 20px; left: 20px; width: 65px; z-index: 50; 
            filter: drop-shadow(0 0 10px #ff0055);
            transition: transform 0.1s linear;
        }
        .multiplier-display { font-size: 4rem; font-weight: 900; z-index: 100; text-shadow: 0 0 20px rgba(233, 30, 99, 0.8); }
        
        /* History Dots */
        .dot { height: 22px; padding: 0 8px; border-radius: 11px; font-size: 0.65rem; display: inline-flex; align-items: center; margin-right: 5px; font-weight: bold; }
        .dot-low { background: #34495e; color: #85c1e9; }
        .dot-high { background: #6c3483; color: #d7bde2; }

        /* Hide sections initially */
        .page-section { display: none; padding-bottom: 80px; }
        #home-section { display: block; }
    </style>
</head>
<body>

    <div class="p-4 flex justify-between items-center bg-gray-900 border-b border-gray-800 sticky top-0 z-[1000]">
        <h1 class="text-xl font-black text-red-500 italic tracking-tighter">DAI PREMIUM</h1>
        <div class="flex items-center space-x-3">
            <div class="bg-black px-3 py-1 rounded-full border border-gray-700">
                <span id="global-balance" class="text-green-400 font-bold">1000.00</span> <span class="text-xs text-gray-500">ETB</span>
            </div>
            <img src="https://i.pravatar.cc/150?u=dai" class="w-8 h-8 rounded-full border-2 border-red-500" alt="Profile">
        </div>
    </div>

    <section id="home-section" class="page-section animate-fade">
        <div class="p-4">
            <h2 class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-4">Top Games</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="relative rounded-2xl overflow-hidden border border-gray-800" onclick="showPage('game-section')">
                    <img src="https://images.unsplash.com/photo-1559156200-66a00ee7efed?w=400" class="w-full h-40 object-cover opacity-70">
                    <div class="absolute bottom-0 p-3 bg-gradient-to-t from-black w-full"><p class="font-bold">AVIATOR</p></div>
                </div>
                <div class="relative rounded-2xl overflow-hidden border border-gray-800">
                    <img src="https://images.unsplash.com/photo-1518133835878-5a93cc3f89e5?w=400" class="w-full h-40 object-cover opacity-70">
                    <div class="absolute bottom-0 p-3 bg-gradient-to-t from-black w-full"><p class="font-bold">KENO</p></div>
                </div>
                <div class="relative rounded-2xl overflow-hidden border border-gray-800">
                    <img src="https://images.unsplash.com/photo-1596838132731-dd96a2c5adfe?w=400" class="w-full h-40 object-cover opacity-70">
                    <div class="absolute bottom-0 p-3 bg-gradient-to-t from-black w-full"><p class="font-bold">ROULETTE</p></div>
                </div>
                <div class="relative rounded-2xl overflow-hidden border border-gray-800">
                    <img src="https://images.unsplash.com/photo-1614028674026-a65e31bfd27c?w=400" class="w-full h-40 object-cover opacity-70">
                    <div class="absolute bottom-0 p-3 bg-gradient-to-t from-black w-full"><p class="font-bold">CRASH</p></div>
                </div>
            </div>
        </div>
    </section>

    <section id="game-section" class="page-section">
        <div id="history-bar" class="flex overflow-x-auto p-2 bg-black whitespace-nowrap border-b border-gray-900">
            </div>

        <div class="p-4">
            <div class="aviator-container flex items-center justify-center">
                <div id="game-status" class="absolute top-4 text-gray-500 font-bold uppercase text-xs">Waiting for next round...</div>
                <div id="multi-val" class="multiplier-display font-game text-white">1.00x</div>
                <img id="airplane" src="https://www.svgrepo.com/show/491500/airplane-top-view.svg" class="plane-sprite" style="filter: invert(15%) sepia(95%) saturate(6932%) hue-rotate(348deg) brightness(92%) contrast(100%);">
            </div>

            <div class="mt-6 bg-gray-900 p-4 rounded-3xl border border-gray-800">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex space-x-2">
                        <button onclick="adjustBet(-10)" class="bg-gray-800 w-8 h-8 rounded-full">-</button>
                        <input id="bet-amount" type="number" value="10" class="bg-transparent text-center w-16 font-bold text-xl outline-none">
                        <button onclick="adjustBet(10)" class="bg-gray-800 w-8 h-8 rounded-full">+</button>
                    </div>
                    <div class="text-xs text-gray-500">Auto Cashout: <span class="text-white">2.0x</span></div>
                </div>
                <button id="bet-btn" onclick="userAction()" class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-black text-2xl transition-all shadow-lg shadow-green-900/20">BET</button>
            </div>
        </div>
    </section>

    <section id="wallet-section" class="page-section p-6 text-center">
        <i class="fa-solid fa-wallet text-5xl text-blue-500 mb-4"></i>
        <h2 class="text-2xl font-bold mb-6">Deposit & Withdraw</h2>
        <div class="grid grid-cols-1 gap-4">
            <button class="bg-blue-600 p-4 rounded-xl font-bold flex justify-between items-center">
                <span>Deposit via Telebirr</span> <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button class="bg-gray-800 p-4 rounded-xl font-bold flex justify-between items-center">
                <span>CBE Bank Transfer</span> <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button class="bg-red-600 p-4 rounded-xl font-bold mt-4">Withdraw Profit</button>
        </div>
    </section>

    <section id="ref-section" class="page-section p-6">
        <div class="bg-gradient-to-br from-purple-900 to-indigo-900 p-6 rounded-3xl text-center">
            <h2 class="text-xl font-bold mb-2">Invite Friends</h2>
            <p class="text-sm opacity-70 mb-4">Get 10% commission on every bet they place!</p>
            <div class="bg-black/50 p-3 rounded-lg flex justify-between items-center">
                <code class="text-xs text-blue-300">dai-bet.io/ref/dai777</code>
                <button class="text-xs bg-white text-black px-3 py-1 rounded-full font-bold">COPY</button>
            </div>
        </div>
    </section>

    <div class="bottom-nav fixed bottom-0 w-full h-16 flex justify-around items-center z-[1000]">
        <div class="nav-item active" onclick="showPage('home-section', this)"><i class="fa-solid fa-house mb-1 text-lg"></i>Home</div>
        <div class="nav-item" onclick="showPage('game-section', this)"><i class="fa-solid fa-plane-up mb-1 text-lg"></i>Game</div>
        <div class="nav-item" onclick="showPage('wallet-section', this)"><i class="fa-solid fa-wallet mb-1 text-lg"></i>Wallet</div>
        <div class="nav-item" onclick="showPage('ref-section', this)"><i class="fa-solid fa-users mb-1 text-lg"></i>Invite</div>
    </div>

    <audio id="snd-fly" loop src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="snd-crash" src="https://assets.mixkit.co/active_storage/sfx/2511/2511-preview.mp3"></audio>

    <script>
        let balance = 1000.00;
        let isFlying = false;
        let multiplier = 1.00;
        let userBet = 0;
        let hasPlacedBet = false;
        let loop;

        function showPage(id, el) {
            document.querySelectorAll('.page-section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
            
            if(id === 'game-section') startAutoEngine();
        }

        function adjustBet(val) {
            let input = document.getElementById('bet-amount');
            let current = parseInt(input.value);
            if(current + val > 0) input.value = current + val;
        }

        // --- ENGINE LOGIC ---
        function startAutoEngine() {
            if(isFlying) return;
            
            let countdown = 5;
            let status = document.getElementById('game-status');
            
            let timer = setInterval(() => {
                status.innerText = `Starts in ${countdown}s...`;
                countdown--;
                if(countdown < 0) {
                    clearInterval(timer);
                    launchPlane();
                }
            }, 1000);
        }

        function launchPlane() {
            isFlying = true;
            multiplier = 1.00;
            document.getElementById('game-status').innerText = "Plane is airborne!";
            document.getElementById('multi-val').style.color = "white";
            document.getElementById('snd-fly').play();

            // 40% Admin Profit - forced early crash logic
            let crashTarget = Math.random() < 0.40 ? (1 + Math.random() * 0.4).toFixed(2) : (1 + Math.random() * 8).toFixed(2);

            loop = setInterval(() => {
                multiplier += 0.02;
                document.getElementById('multi-val').innerText = multiplier.toFixed(2) + "x";
                
                // Animation
                let plane = document.getElementById('airplane');
                plane.style.transform = `translate(${multiplier * 20}px, -${multiplier * 15}px) rotate(-15deg)`;

                if(multiplier >= crashTarget) {
                    crash();
                }
            }, 70);
        }

        function crash() {
            clearInterval(loop);
            isFlying = false;
            document.getElementById('snd-fly').pause();
            document.getElementById('snd-fly').currentTime = 0;
            document.getElementById('snd-crash').play();

            document.getElementById('multi-val').innerText = "FLEW AWAY!";
            document.getElementById('multi-val').style.color = "#ff0055";
            
            addHistory(multiplier.toFixed(2));
            
            // If user didn't cash out
            if(hasPlacedBet) {
                hasPlacedBet = false;
                document.getElementById('bet-btn').innerText = "BET";
                document.getElementById('bet-btn').className = "w-full bg-green-600 py-4 rounded-2xl font-black text-2xl";
            }

            setTimeout(() => {
                document.getElementById('airplane').style.transform = "translate(0,0)";
                document.getElementById('multi-val').innerText = "1.00x";
                startAutoEngine();
            }, 3000);
        }

        function userAction() {
            let btn = document.getElementById('bet-btn');
            let amt = parseFloat(document.getElementById('bet-amount').value);

            if(!isFlying && !hasPlacedBet) {
                // Place Bet
                if(amt > balance) return alert("Not enough balance!");
                balance -= amt;
                userBet = amt;
                hasPlacedBet = true;
                btn.innerText = "WAITING...";
                btn.className = "w-full bg-gray-700 py-4 rounded-2xl font-black text-2xl";
                updateBalanceUI();
            } else if (isFlying && hasPlacedBet) {
                // Cash Out
                let win = userBet * multiplier;
                balance += win;
                hasPlacedBet = false;
                alert(`CONGRATS! You won ${win.toFixed(2)} ETB`);
                btn.innerText = "BET";
                btn.className = "w-full bg-green-600 py-4 rounded-2xl font-black text-2xl";
                updateBalanceUI();
            }
        }

        function updateBalanceUI() {
            document.getElementById('global-balance').innerText = balance.toFixed(2);
            document.getElementById('main-balance').innerText = balance.toFixed(2) + " ETB";
        }

        function addHistory(val) {
            let bar = document.getElementById('history-bar');
            let dot = document.createElement('span');
            dot.className = val > 2 ? "dot dot-high" : "dot dot-low";
            dot.innerText = val + "x";
            bar.prepend(dot);
        }

        // Initialize with some fake history
        [1.20, 5.40, 1.05, 2.33, 1.80].forEach(v => addHistory(v));

    </script>
</body>
</html>
