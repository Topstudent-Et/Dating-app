<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME - OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .game-canvas { position: relative; height: 220px; background: radial-gradient(circle at center, #1a0505 0%, #000 100%); border-radius: 24px; border: 1px solid #300; overflow: hidden; }
        #redLine { position: absolute; left: 0; bottom: 0; width: 0; height: 0; border-left: 3px solid #ff0000; filter: drop-shadow(0 0 10px #ff0000); pointer-events: none; transition: none; }
        .red-shadow { position: absolute; left: 0; bottom: 0; background: linear-gradient(to top, rgba(255,0,0,0.2), transparent); pointer-events: none; }
        .btn-bet { background: #28a745; border-bottom: 5px solid #14532d; width: 100%; height: 75px; border-radius: 12px; font-weight: 900; font-size: 20px; transition: 0.1s; }
        .btn-bet.active { background: #15803d; border-bottom: none; transform: translateY(3px); }
        .btn-cashout { background: #f97316; border-bottom: 5px solid #9a3412; animation: pulse 0.6s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .amt-btn { background: #111; border: 1px solid #333; font-size: 11px; font-weight: 800; border-radius: 8px; padding: 10px 0; }
        .amt-btn.selected { background: #2563eb; border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .nav-dock { position: fixed; bottom: 0; width: 100%; background: #050505; height: 70px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #111; z-index: 1000; }
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 80px; }
        .page.active { display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="flex justify-between items-center px-4 py-3 bg-zinc-950 border-b border-zinc-900">
        <div class="text-red-600 font-black text-xl italic font-game">WORLD GAME</div>
        <div class="bg-zinc-900 px-4 py-1 rounded-full border border-zinc-800 flex items-center gap-2">
            <span id="topBal" class="text-green-500 font-bold text-sm">0.00</span>
            <span class="text-[9px] text-zinc-500 font-bold">ETB</span>
        </div>
    </div>

    <div id="play" class="page active px-2 pt-1">
        <div id="history" class="flex gap-1 overflow-x-auto py-2 mb-1 no-scrollbar text-[9px] font-bold"></div>
        
        <div class="game-canvas flex items-center justify-center">
            <div id="mult" class="text-6xl font-black font-game z-50 transition-none">1.00x</div>
            <div id="crashMsg" class="hidden absolute z-50 text-red-600 font-black text-4xl font-game uppercase">Flew Away!</div>
            <svg id="gameSVG" class="absolute inset-0 w-full h-full pointer-events-none">
                <path id="pathLine" d="" fill="none" stroke="#ff0000" stroke-width="4" filter="drop-shadow(0 0 5px #f00)"/>
                <path id="pathFill" d="" fill="url(#grad)" opacity="0.3"/>
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:red;stop-opacity:0.5" />
                        <stop offset="100%" style="stop-color:red;stop-opacity:0" />
                    </linearGradient>
                </defs>
            </svg>
            <div id="plane" class="absolute z-50 text-3xl" style="left:10%; bottom:10%;">✈️</div>
        </div>

        <div class="mt-4 space-y-2">
            <div class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 flex gap-2">
                <div class="w-1/3 grid grid-cols-2 gap-1">
                    <button id="v1-10" onclick="setV(1,10)" class="amt-btn selected">10</button>
                    <button id="v1-50" onclick="setV(1,50)" class="amt-btn">50</button>
                    <button id="v1-100" onclick="setV(1,100)" class="amt-btn">100</button>
                    <button id="v1-200" onclick="setV(1,200)" class="amt-btn">200</button>
                </div>
                <div class="w-2/3">
                    <button id="btn1" onclick="handle(1)" class="btn-bet">BET<br><span id="sub1" class="text-[9px] font-normal">10.00 ETB</span></button>
                </div>
            </div>
            <div class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 flex gap-2">
                <div class="w-1/3 grid grid-cols-2 gap-1">
                    <button id="v2-10" onclick="setV(2,10)" class="amt-btn selected">10</button>
                    <button id="v2-50" onclick="setV(2,50)" class="amt-btn">50</button>
                    <button id="v2-100" onclick="setV(2,100)" class="amt-btn">100</button>
                    <button id="v2-200" onclick="setV(2,200)" class="amt-btn">200</button>
                </div>
                <div class="w-2/3">
                    <button id="btn2" onclick="handle(2)" class="btn-bet">BET<br><span id="sub2" class="text-[9px] font-normal">10.00 ETB</span></button>
                </div>
            </div>
        </div>
    </div>

    <div id="profile" class="page p-6 text-center">
        <div class="w-20 h-20 bg-zinc-900 rounded-full border-2 border-blue-600 mx-auto p-1 mb-3">
            <img id="uPic" src="https://via.placeholder.com/100" class="w-full h-full rounded-full">
        </div>
        <h2 id="uName" class="font-black text-xl italic uppercase">PLAYER</h2>
        <div class="text-blue-500 text-[10px] font-bold mb-6 italic"><i class="fas fa-check-circle"></i> VERIFIED ACCOUNT</div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-left">
                <p class="text-[8px] text-zinc-500">TOTAL GAMES</p><p id="stGames" class="font-black">0</p>
            </div>
            <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-left">
                <p class="text-[8px] text-zinc-500">TOTAL WON</p><p id="stWon" class="font-black text-green-500">0.00</p>
            </div>
        </div>

        <button onclick="shareLink()" class="w-full bg-blue-600 py-4 rounded-xl font-black text-sm mb-2"><i class="fas fa-share-alt mr-2"></i> SHARE & EARN 5 ETB</button>
        <p class="text-[9px] text-zinc-500 mb-8 italic">Get 5 ETB for every friend you invite!</p>

        <div id="adminPanel" class="hidden bg-red-950/20 p-5 rounded-3xl border border-red-900/40 text-left">
            <p class="text-red-600 font-black text-xs mb-4 uppercase">Admin: @Dawit_Fikadu21</p>
            <div class="bg-black p-3 rounded-xl text-[9px] font-mono text-zinc-400 h-32 overflow-y-auto mb-4" id="profitLogs">
                [System]: Monitoring 20% House Edge...
            </div>
            <input id="nCBE" placeholder="New CBE" class="w-full bg-black p-3 rounded-lg text-xs mb-2 border border-zinc-800">
            <input id="nTB" placeholder="New Telebirr" class="w-full bg-black p-3 rounded-lg text-xs mb-4 border border-zinc-800">
            <button onclick="updateBank()" class="w-full bg-yellow-600 py-3 rounded-lg font-black text-xs">UPDATE ALL ACCOUNTS</button>
        </div>
    </div>

    <div id="wallet" class="page p-6">
        <div class="bg-zinc-900 p-6 rounded-3xl mb-6 text-center border border-zinc-800">
            <p class="text-[10px] text-zinc-500 font-bold uppercase mb-1">Total Balance</p>
            <p id="wBal" class="text-4xl font-black text-green-500 font-game">0.00</p>
        </div>
        <div class="space-y-3">
            <div class="bg-zinc-900 p-4 rounded-2xl flex justify-between items-center border border-zinc-800">
                <div class="flex items-center gap-3"><i class="fas fa-university text-blue-500 text-xl"></i><div><p class="text-[8px] text-zinc-500">CBE</p><p id="cbe" class="font-bold text-sm">1000179571815</p></div></div>
                <i class="fas fa-copy text-zinc-600" onclick="copy('1000179571815')"></i>
            </div>
            <div class="bg-zinc-900 p-4 rounded-2xl flex justify-between items-center border border-zinc-800">
                <div class="flex items-center gap-3"><i class="fas fa-mobile-alt text-yellow-500 text-xl"></i><div><p class="text-[8px] text-zinc-500">TELEBIRR</p><p id="tele" class="font-bold text-sm">0906067696</p></div></div>
                <i class="fas fa-copy text-zinc-600" onclick="copy('0906067696')"></i>
            </div>
            <button class="w-full bg-green-600 py-5 rounded-2xl font-black text-lg mt-4">DEPOSIT NOW</button>
        </div>
    </div>

    <nav class="nav-dock">
        <div onclick="showPage('play')" class="text-center opacity-50"><i class="fas fa-plane-departure text-xl"></i><div class="text-[9px] font-bold">GAME</div></div>
        <div onclick="showPage('wallet')" class="text-center opacity-50"><i class="fas fa-wallet text-xl"></i><div class="text-[9px] font-bold">WALLET</div></div>
        <div onclick="showPage('profile')" class="text-center opacity-50"><i class="fas fa-user-shield text-xl"></i><div class="text-[9px] font-bold">PROFILE</div></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        let bal = 0.00; let st_games = 0; let st_won = 0;
        let isRunning = false; let mult = 1.0;
        let slots = { 1: {active: false, amt: 10}, 2: {active: false, amt: 10} };
        const adminID = "Dawit_Fikadu21";

        if(tg.initDataUnsafe.user) {
            document.getElementById('uName').innerText = tg.initDataUnsafe.user.first_name;
            if(tg.initDataUnsafe.user.photo_url) document.getElementById('uPic').src = tg.initDataUnsafe.user.photo_url;
            if(tg.initDataUnsafe.user.username === adminID) document.getElementById('adminPanel').classList.remove('hidden');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setV(s, v) {
            slots[s].amt = v;
            document.querySelectorAll(`#play .bg-zinc-900:nth-of-type(${s}) .amt-btn`).forEach(b => b.classList.remove('selected'));
            document.getElementById(`v${s}-${v}`).classList.add('selected');
            document.getElementById(`sub${s}`).innerText = v.toFixed(2) + " ETB";
        }

        function gameLoop() {
            if(isRunning) return;
            isRunning = true; mult = 1.0;
            document.getElementById('crashMsg').classList.add('hidden');
            document.getElementById('mult').classList.remove('hidden');

            // Logic: 20% Profit Margin (House Edge)
            let isRealBet = slots[1].active || slots[2].active;
            let crash = isRealBet ? (1.05 + Math.random() * 2.1) : (3 + Math.random() * 50);

            let timer = setInterval(() => {
                mult += 0.01 * (mult / 1.5);
                document.getElementById('mult').innerText = mult.toFixed(2) + "x";
                
                // Curve Path Logic
                let w = 350; let h = 220;
                let px = (mult - 1) * 45; if(px > 85) px = 85; 
                let py = (mult - 1) * 25; if(py > 80) py = 80;

                document.getElementById('plane').style.left = px + "%";
                document.getElementById('plane').style.bottom = py + "%";

                // Red Line Follow
                let x = (px / 100) * w; let y = h - ((py / 100) * h);
                let d = `M 0 ${h} Q ${x/2} ${h} ${x} ${y}`;
                document.getElementById('pathLine').setAttribute('d', d);
                document.getElementById('pathFill').setAttribute('d', d + ` L ${x} ${h} L 0 ${h} Z`);

                if(mult >= crash) {
                    clearInterval(timer); isRunning = false;
                    document.getElementById('mult').classList.add('hidden');
                    document.getElementById('crashMsg').classList.remove('hidden');
                    
                    if(isRealBet) logProfit(crash);
                    
                    addHistory(mult.toFixed(2));
                    slots[1].active = false; slots[2].active = false;
                    resetBtns();
                    setTimeout(gameLoop, 4000);
                }
            }, 60);
        }

        function handle(s) {
            if(!slots[s].active) {
                if(bal < slots[s].amt) return alert("Balance የለም!");
                if(isRunning) return;
                bal -= slots[s].amt; st_games++; updateUI();
                slots[s].active = true;
                document.getElementById('btn' + s).innerHTML = "WAITING...";
                document.getElementById('btn' + s).classList.add('active');
            } else {
                let win = slots[s].amt * mult;
                bal += win; st_won += win; updateUI();
                slots[s].active = false; resetBtns();
                alert("ተሳክቷል! " + win.toFixed(2));
            }
        }

        function resetBtns() {
            [1,2].forEach(s => {
                let b = document.getElementById('btn' + s);
                b.className = "btn-bet text-white";
                b.innerHTML = `BET<br><span class="text-[9px] font-normal">${slots[s].amt.toFixed(2)} ETB</span>`;
            });
        }

        function logProfit(c) {
            const l = document.getElementById('profitLogs');
            let p = (slots[1].amt + slots[2].amt) * 0.2;
            l.innerHTML = `<div>[TRX]: House Profit +${p.toFixed(2)} ETB (Crash @${c})</div>` + l.innerHTML;
        }

        function addHistory(v) {
            const h = document.getElementById('history');
            const b = document.createElement('div');
            b.className = "px-3 py-1 rounded-full border border-zinc-800 " + (v > 2 ? "text-blue-500" : "text-red-500");
            b.innerText = v + "x";
            h.prepend(b);
            if(h.children.length > 12) h.lastChild.remove();
        }

        function updateUI() {
            document.getElementById('topBal').innerText = bal.toFixed(2);
            document.getElementById('wBal').innerText = bal.toFixed(2);
            document.getElementById('stGames').innerText = st_games;
            document.getElementById('stWon').innerText = st_won.toFixed(2);
        }

        function shareLink() {
            bal += 5; updateUI();
            alert("5 ETB ተጨምሮልሃል! ለጓደኞችህ ሼር አድርግ።");
        }

        function updateBank() {
            let c = document.getElementById('nCBE').value;
            let t = document.getElementById('nTB').value;
            if(c) document.getElementById('cbe').innerText = c;
            if(t) document.getElementById('tele').innerText = t;
            alert("Updated!");
        }

        function copy(t) { navigator.clipboard.writeText(t); alert("Copied!"); }

        window.onload = () => {
            gameLoop();
            setInterval(() => {
                if(isRunning) {
                    [1,2].forEach(s => {
                        if(slots[s].active) {
                            let b = document.getElementById('btn' + s);
                            b.className = "btn-bet btn-cashout text-white";
                            b.innerHTML = `CASH OUT<br><span class="text-xl font-black">${(slots[s].amt * mult).toFixed(2)}</span>`;
                        }
                    });
                }
            }, 100);
        };
    </script>
</body>
</html>
