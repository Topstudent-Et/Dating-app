<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME PRO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <div class="logo-circle">✈️</div>
            <div class="logo-text font-game">WORLD GAME</div>
            <div class="live-tag"><span class="pulse-dot"></span> LIVE</div>
        </div>
        <div class="balance-pill" onclick="showP('walletPage')">
            <span id="topBal">0.00</span> <small>ETB</small>
        </div>
    </div>

    <div id="playPage" class="page active">
        <div id="historyBar" class="history-row"></div>
        <div class="game-screen">
            <div id="multDisplay" class="font-game">1.00x</div>
            <div id="crashMsg" class="hidden font-game">FLEW AWAY!</div>
            <canvas id="graphCanvas"></canvas>
            <div id="plane">✈️</div>
        </div>
        <div class="bet-section">
            <div class="bet-card">
                <input type="number" id="amt1" value="10" class="bet-input">
                <button id="btn1" onclick="handleBet(1)" class="btn-bet">BET</button>
            </div>
            <div class="bet-card">
                <input type="number" id="amt2" value="10" class="bet-input">
                <button id="btn2" onclick="handleBet(2)" class="btn-bet">BET</button>
            </div>
        </div>
    </div>

    <div id="walletPage" class="page p-4">
        <h2 class="font-game text-center mb-4">WALLET</h2>
        <div class="bank-card">
            <p id="bankTitle">CBE ACCOUNT</p>
            <h3 id="bankAcc">1000179571815</h3>
        </div>
        <input type="number" id="depAmt" placeholder="Amount" class="w-full p-3 bg-zinc-900 mb-2 rounded">
        <input type="text" id="depRef" placeholder="Transaction Ref" class="w-full p-3 bg-zinc-900 mb-4 rounded">
        <button onclick="requestDeposit()" class="w-full bg-blue-600 p-4 rounded font-bold">DEPOSIT</button>
    </div>

    <div id="adminPage" class="page p-4">
        <h2 class="text-red-600 font-game text-center">ADMIN PANEL</h2>
        <div id="adminRequests" class="space-y-2 mt-4">
            </div>
    </div>

    <nav class="nav-bar">
        <button onclick="showP('playPage')"><i class="fas fa-play"></i></button>
        <button onclick="showP('walletPage')"><i class="fas fa-wallet"></i></button>
        <button id="adminTab" onclick="showP('adminPage')" class="hidden"><i class="fas fa-user-shield"></i></button>
    </nav>

    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
