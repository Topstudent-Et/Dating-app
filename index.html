<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aviator - Next Gen Crash Game</title>
    <!-- Google Fonts & Canvas Confetti -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse at 30% 20%, #0B1120, #03060C);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Modern glassmorphism card */
        .app-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: rgba(12, 18, 28, 0.75);
            backdrop-filter: blur(14px);
            border-radius: 64px;
            padding: 24px 20px 32px;
            border: 1px solid rgba(255, 210, 90, 0.25);
            box-shadow: 0 30px 45px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.2s ease;
        }

        /* header section */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .logo-area h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE5A3, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .logo-area p {
            font-size: 0.7rem;
            color: #7E8AAE;
            letter-spacing: 1px;
        }
        .balance-card {
            background: #03070FCC;
            border-radius: 50px;
            padding: 8px 22px;
            text-align: center;
            border: 1px solid #FFD96655;
            backdrop-filter: blur(4px);
        }
        .bal-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #9BA4C9;
        }
        .bal-amount {
            font-size: 1.9rem;
            font-weight: 800;
            color: #FFE484;
            line-height: 1;
        }
        .bal-currency {
            font-size: 0.9rem;
        }

        /* toolbar: sound + auto cashout + fun mode */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #00000040;
            border-radius: 100px;
            padding: 6px 16px;
            margin-bottom: 20px;
        }
        .fun-badge {
            background: #FFCF4A;
            color: #1E1F2C;
            padding: 4px 16px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 0.7rem;
        }
        .sound-btn {
            background: #1F2A3E;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
        }
        .auto-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0F1622AA;
            padding: 4px 14px;
            border-radius: 60px;
        }
        .auto-box span {
            font-size: 0.75rem;
            font-weight: 600;
            color: #FFDE9E;
        }
        .auto-input {
            width: 65px;
            background: #010101cc;
            border: 1px solid #ffb347;
            border-radius: 30px;
            padding: 6px 8px;
            color: #FFE6A3;
            font-weight: bold;
            text-align: center;
        }
        .auto-set {
            background: #2F3B5C;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .auto-status {
            font-size: 0.7rem;
            background: #2C3A2E;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* multiplier strip */
        .multiplier-strip {
            background: #01010160;
            border-radius: 60px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 16px 0;
        }
        .multiplier-chip {
            background: #121a28;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 800;
            color: #F6CD6C;
            font-family: monospace;
            font-size: 1rem;
            box-shadow: inset 0 1px 0 #ffffff1a, 0 2px 4px black;
        }

        /* main flight zone with canvas graph */
        .flight-panel {
            background: #03060ee0;
            border-radius: 48px;
            padding: 16px;
            margin: 12px 0;
            border: 1px solid rgba(255, 200, 80, 0.4);
        }
        .canvas-wrapper {
            background: #02040B;
            border-radius: 36px;
            padding: 8px;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 28px;
            background: #01030A;
        }
        .live-multiplier {
            font-size: 3.5rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            text-align: center;
            color: #FFDF8C;
            text-shadow: 0 0 15px #FF8C00;
            margin: 16px 0 8px;
        }
        .status-text {
            background: #111A2E;
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 10px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* betting card */
        .betting-card {
            background: #0B111FCC;
            border-radius: 48px;
            padding: 20px 18px;
            margin: 20px 0;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .bet-label {
            font-weight: 700;
            color: #CCD6F0;
        }
        .bet-input-field {
            background: #010101dd;
            border: 1px solid #F3B33D;
            border-radius: 60px;
            padding: 12px 20px;
            font-size: 1.4rem;
            font-weight: bold;
            width: 150px;
            text-align: center;
            color: #FFE6A3;
        }
        .quick-chips {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .chip-btn {
            background: #1E293B;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            color: #FFE2A4;
            cursor: pointer;
            transition: 0.1s;
        }
        .dual-buttons {
            display: flex;
            gap: 16px;
        }
        .btn-primary {
            background: linear-gradient(120deg, #E68A2E, #FFB347);
            border: none;
            padding: 14px;
            font-weight: 800;
            font-size: 1.2rem;
            border-radius: 60px;
            flex: 1;
            cursor: pointer;
            box-shadow: 0 5px 0 #7A3E0A;
            color: #0E121F;
        }
        .btn-secondary {
            background: linear-gradient(120deg, #1F6392, #0F4162);
            border: none;
            padding: 14px;
            font-weight: 800;
            font-size: 1.2rem;
            border-radius: 60px;
            flex: 1;
            cursor: pointer;
            box-shadow: 0 5px 0 #08222E;
            color: white;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3A2A0A;
        }
        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        /* stats & recent */
        .stats-row {
            display: flex;
            justify-content: space-between;
            background: #03060CAA;
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin: 12px 0;
        }
        .recent-list {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0 0;
        }
        .recent-badge {
            background: #0E1624;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-family: monospace;
        }
        footer {
            font-size: 0.65rem;
            text-align: center;
            color: #5E6D8F;
            margin-top: 18px;
        }
        @media (max-width: 500px) {
            .app-container { padding: 18px; }
            .live-multiplier { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- header -->
    <div class="header-row">
        <div class="logo-area">
            <h1>✈️ AVIATOR</h1>
            <p>CRASH • MULTIPLIER • LIVE</p>
        </div>
        <div class="balance-card">
            <div class="bal-label">BALANCE (ETB)</div>
            <div class="bal-amount"><span id="globalBalance">50000.00</span></div>
        </div>
    </div>

    <!-- toolbar (sound & auto cashout) -->
    <div class="toolbar">
        <div class="fun-badge">🎮 FUN MODE</div>
        <button id="soundToggle" class="sound-btn">🔊 SOUND ON</button>
        <div class="auto-box">
            <span>🤖 AUTO</span>
            <input type="number" id="autoMultInput" class="auto-input" step="0.5" min="1.2" value="2.8">
            <button id="setAutoBtn" class="auto-set">SET</button>
            <span id="autoStatusBadge" class="auto-status">OFF</span>
        </div>
    </div>

    <!-- multiplier history -->
    <div class="multiplier-strip" id="multiplierStrip"></div>

    <!-- flight & graph area -->
    <div class="flight-panel">
        <div class="canvas-wrapper">
            <canvas id="flightGraphCanvas" width="560" height="150" style="width:100%; height:auto; aspect-ratio:560/150"></canvas>
        </div>
        <div class="live-multiplier" id="liveMultiplex">1.00x</div>
        <div class="status-text" id="gameStatus">✨ Place a bet to start flying</div>
    </div>

    <!-- betting interface -->
    <div class="betting-card">
        <div class="bet-row">
            <span class="bet-label">💰 BET AMOUNT (ETB)</span>
            <input type="number" id="betAmount" class="bet-input-field" value="4.00" step="1" min="1">
        </div>
        <div class="quick-chips">
            <button class="chip-btn" data-bet="4">4 ETB</button>
            <button class="chip-btn" data-bet="16">16 ETB</button>
            <button class="chip-btn" data-bet="40">40 ETB</button>
            <button class="chip-btn" data-bet="80">80 ETB</button>
            <button class="chip-btn" data-bet="400">400 ETB</button>
        </div>
        <div class="dual-buttons">
            <button class="btn-secondary" id="placeBetBtn">🚀 PLACE BET</button>
            <button class="btn-primary" id="cashoutBtn">💸 CASHOUT</button>
        </div>
    </div>

    <!-- statistics & recent rounds -->
    <div class="stats-row">
        <span>🏆 MAX WIN: <strong id="maxWinSpan">0.00</strong> ETB</span>
        <span>🔄 ROUND: <span id="roundCount">217</span></span>
        <span>📈 CURRENT: <span id="currentMultLabel">1.00x</span></span>
    </div>
    <div class="recent-list" id="recentRoundsList"></div>
    <footer>✈️ Plane flies & multiplier increases. Cashout before crash. Auto cashout + realistic chart + sound effects.</footer>
</div>

<script>
    // ==================== GAME STATE ====================
    let balance = 50000.00;
    let currentBetValue = 0;
    let isGameActive = false;      // bet placed, plane climbing
    let roundActive = false;       // multiplier running
    let currentMulti = 1.00;
    let crashPoint = 1.00;
    let multInterval = null;
    let autoCashoutTarget = 0;      // 0 = disabled
    let soundOn = true;
    let maxWin = 0;
    let roundNumber = 217;
    let historyMultipliers = [1.31, 1.98, 2.29, 1.50, 16.69, 1.21, 1.42];

    // Canvas chart data
    const canvas = document.getElementById('flightGraphCanvas');
    const ctx = canvas.getContext('2d');
    let flightPoints = [{t: 0, m: 1}];

    // DOM elements
    const balanceSpan = document.getElementById('globalBalance');
    const liveMultSpan = document.getElementById('liveMultiplex');
    const gameStatusSpan = document.getElementById('gameStatus');
    const betInput = document.getElementById('betAmount');
    const placeBtn = document.getElementById('placeBetBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const maxWinSpan = document.getElementById('maxWinSpan');
    const roundCountSpan = document.getElementById('roundCount');
    const currentMultLabel = document.getElementById('currentMultLabel');
    const multiplierStrip = document.getElementById('multiplierStrip');
    const recentListDiv = document.getElementById('recentRoundsList');
    const autoStatusBadge = document.getElementById('autoStatusBadge');
    const setAutoBtn = document.getElementById('setAutoBtn');
    const autoMultInput = document.getElementById('autoMultInput');
    const soundToggleBtn = document.getElementById('soundToggle');

    // Helper: play sound
    function playGameSound(type) {
        if (!soundOn) return;
        try {
            let audio = new Audio();
            if(type === 'cashout') audio.src = 'https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3';
            else if(type === 'crash') audio.src = 'https://www.soundjay.com/misc/sounds/explosion-01.mp3';
            else if(type === 'takeoff') audio.src = 'https://www.soundjay.com/transport/plane-flying-01.mp3';
            else if(type === 'bigwin') audio.src = 'https://www.soundjay.com/misc/sounds/coins-1.mp3';
            else return;
            audio.volume = 0.35;
            audio.play().catch(e=>console.log);
        } catch(e) {}
    }

    // update UI (balance, multipliers)
    function refreshUI() {
        balanceSpan.innerText = balance.toFixed(2);
        liveMultSpan.innerText = currentMulti.toFixed(2) + 'x';
        currentMultLabel.innerText = currentMulti.toFixed(2) + 'x';
        maxWinSpan.innerText = maxWin.toFixed(2);
        roundCountSpan.innerText = roundNumber;
    }

    // update multiplier history strip
    function updateHistory(newMult) {
        historyMultipliers.unshift(parseFloat(newMult.toFixed(2)));
        if(historyMultipliers.length > 9) historyMultipliers.pop();
        multiplierStrip.innerHTML = '';
        historyMultipliers.slice(0,8).forEach(m => {
            let chip = document.createElement('span');
            chip.className = 'multiplier-chip';
            chip.innerText = m.toFixed(2) + 'x';
            multiplierStrip.appendChild(chip);
        });
        recentListDiv.innerHTML = historyMultipliers.slice(0,5).map(m => `<div class="recent-badge">${m.toFixed(2)}x</div>`).join('');
    }

    // draw professional chart
    function drawGraph() {
        if(!ctx) return;
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        if(flightPoints.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = '#FFC857';
        ctx.lineWidth = 3;
        for(let i=0; i<flightPoints.length; i++) {
            let x = (flightPoints[i].t / 11) * w;
            let y = h - (Math.min(flightPoints[i].m, 38) / 38) * h;
            if(i===0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        if(flightPoints.length) {
            let last = flightPoints[flightPoints.length-1];
            let lastX = (last.t / 11) * w;
            let lastY = h - (Math.min(last.m, 38) / 38) * h;
            ctx.font = '20px "Segoe UI"';
            ctx.fillStyle = '#FFDD99';
            ctx.fillText('✈️', lastX-12, lastY-8);
        }
        // grid
        ctx.beginPath();
        ctx.strokeStyle = '#2F3A5C';
        ctx.lineWidth = 0.6;
        for(let i=1;i<=3;i++) {
            let yGrid = h - (i/3)*h;
            ctx.moveTo(0, yGrid);
            ctx.lineTo(w, yGrid);
            ctx.stroke();
        }
    }

    function addChartPoint(mult, timeSec) {
        flightPoints.push({t: timeSec, m: mult});
        if(flightPoints.length > 55) flightPoints.shift();
        drawGraph();
    }

    // generate crash point (random realistic)
    function generateCrash() {
        let r = Math.random();
        if(r < 0.6) return 1.00 + Math.random() * 2.5;
        else if(r < 0.85) return 3.0 + Math.random() * 5.2;
        else return 8.2 + Math.random() * 30;
    }

    // stop round (clear interval)
    function killRound() {
        if(multInterval) clearInterval(multInterval);
        multInterval = null;
        roundActive = false;
    }

    // crash sequence
    function crashPlane() {
        if(!roundActive) return;
        killRound();
        roundActive = false;
        if(isGameActive && currentBetValue > 0) {
            gameStatusSpan.innerText = `💥 CRASH! You lost ${currentBetValue.toFixed(2)} ETB`;
            playGameSound('crash');
            currentBetValue = 0;
            isGameActive = false;
        } else {
            isGameActive = false;
        }
        updateHistory(currentMulti);
        flightPoints = [{t:0, m:1}];
        drawGraph();
        refreshUI();
        gameStatusSpan.style.background = "#4C1E2A";
        setTimeout(() => {
            if(!roundActive && !isGameActive) gameStatusSpan.style.background = "#111A2E";
            gameStatusSpan.innerText = "🛬 Plane crashed. Place new bet";
        }, 1700);
        enableGameButtons(true);
        roundNumber++;
        roundCountSpan.innerText = roundNumber;
        refreshUI();
    }

    // multiplier increasing loop
    let elapsedSec = 0;
    function startFlight() {
        if(multInterval) clearInterval(multInterval);
        currentMulti = 1.00;
        elapsedSec = 0;
        flightPoints = [{t:0, m:1}];
        drawGraph();
        multInterval = setInterval(() => {
            if(!roundActive) return;
            elapsedSec += 0.17;
            let inc = 0.022 + (Math.random() * 0.048);
            currentMulti = +(currentMulti + inc).toFixed(3);
            addChartPoint(currentMulti, elapsedSec);
            if(currentMulti >= crashPoint && roundActive) {
                currentMulti = crashPoint;
                refreshUI();
                crashPlane();
                return;
            }
            refreshUI();
            // auto cashout check
            if(autoCashoutTarget > 0 && currentMulti >= autoCashoutTarget && roundActive && isGameActive && currentBetValue > 0) {
                executeCashout(true);
            }
            if(currentMulti > 30) liveMultSpan.style.color = "#ff7b7b";
            else liveMultSpan.style.color = "#FFDF8C";
        }, 150);
    }

    // cashout logic
    function executeCashout(isAuto = false) {
        if(!roundActive || !isGameActive || currentBetValue <= 0) {
            if(!isAuto) gameStatusSpan.innerText = "No active round!";
            return;
        }
        let winAmount = currentBetValue * currentMulti;
        balance += winAmount;
        if(winAmount > maxWin) maxWin = winAmount;
        refreshUI();
        updateHistory(currentMulti);
        playGameSound('cashout');
        if(winAmount >= 300) canvasConfetti({particleCount: 180, spread: 65, origin: {y:0.6}});
        gameStatusSpan.innerText = `🎉 CASHOUT! Won ${winAmount.toFixed(2)} ETB @ ${currentMulti.toFixed(2)}x 🎉`;
        killRound();
        roundActive = false;
        isGameActive = false;
        currentBetValue = 0;
        flightPoints = [{t:0, m:1}];
        drawGraph();
        enableGameButtons(true);
        gameStatusSpan.style.background = "#1F5530";
        setTimeout(() => { if(!roundActive) gameStatusSpan.style.background = "#111A2E"; }, 1500);
        roundNumber++;
        roundCountSpan.innerText = roundNumber;
        refreshUI();
    }

    // place bet
    function placeBetAction() {
        if(roundActive) {
            gameStatusSpan.innerText = "⛔ Flight in progress, wait!";
            return;
        }
        if(isGameActive) {
            gameStatusSpan.innerText = "Already bet active, cashout first";
            return;
        }
        let betVal = parseFloat(betInput.value);
        if(isNaN(betVal) || betVal <= 0) betVal = 4;
        if(betVal > balance) {
            gameStatusSpan.innerText = "❌ Low balance!";
            return;
        }
        currentBetValue = betVal;
        balance -= currentBetValue;
        refreshUI();
        roundActive = true;
        isGameActive = true;
        crashPoint = generateCrash();
        currentMulti = 1.00;
        refreshUI();
        startFlight();
        playGameSound('takeoff');
        gameStatusSpan.innerText = `✈️ TAKEOFF! Bet: ${currentBetValue.toFixed(2)} ETB, multiplier climbing`;
        enableGameButtons(false);
        placeBtn.disabled = true;
        cashoutBtn.disabled = false;
        roundCountSpan.innerText = roundNumber;
    }

    function enableGameButtons(enable) {
        if(enable) {
            placeBtn.disabled = false;
            cashoutBtn.disabled = false;
            betInput.disabled = false;
        } else {
            placeBtn.disabled = true;
            cashoutBtn.disabled = false;
            betInput.disabled = true;
        }
        if(!roundActive && !isGameActive) cashoutBtn.disabled = true;
        else if(roundActive && isGameActive) cashoutBtn.disabled = false;
    }

    // quick bet
    document.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if(roundActive) { gameStatusSpan.innerText = "Wait round finish"; return; }
            let val = parseFloat(btn.getAttribute('data-bet'));
            if(!isNaN(val)) betInput.value = val.toFixed(2);
        });
    });

    // set auto cashout
    setAutoBtn.addEventListener('click', () => {
        let val = parseFloat(autoMultInput.value);
        if(isNaN(val) || val < 1.1) val = 2.5;
        autoCashoutTarget = val;
        autoStatusBadge.innerText = `${val.toFixed(2)}x`;
        autoStatusBadge.style.background = "#2C5A2E";
        setTimeout(() => { if(autoCashoutTarget) autoStatusBadge.innerText = `${autoCashoutTarget.toFixed(2)}x`; }, 1500);
    });

    // sound toggle
    soundToggleBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundToggleBtn.innerText = soundOn ? "🔊 SOUND ON" : "🔇 SOUND OFF";
    });

    placeBtn.addEventListener('click', placeBetAction);
    cashoutBtn.addEventListener('click', () => executeCashout(false));

    // initialize game
    function initGame() {
        refreshUI();
        updateHistory(1.08);
        historyMultipliers = [1.31, 1.98, 2.29, 1.50, 16.69, 1.21, 1.42];
        updateHistory(1.05);
        currentMulti = 1.00;
        liveMultSpan.innerText = "1.00x";
        gameStatusSpan.innerText = "✨ Ready. Place bet & watch the sky!";
        roundActive = false;
        isGameActive = false;
        currentBetValue = 0;
        roundNumber = 217;
        roundCountSpan.innerText = roundNumber;
        drawGraph();
        autoCashoutTarget = 0;
        autoStatusBadge.innerText = "OFF";
        autoMultInput.value = "2.8";
        soundOn = true;
        soundToggleBtn.innerText = "🔊 SOUND ON";
        enableGameButtons(true);
    }
    initGame();
    window.addEventListener('resize', () => drawGraph());
</script>
</body>
</html>
