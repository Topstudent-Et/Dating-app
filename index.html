<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DatingSpark | Premium Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #8b5cf6; --secondary: #ec4899; --bg: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #1e293b; overflow: hidden; }
        
        .page { display: none; height: 100vh; flex-direction: column; overflow-y: auto; }
        .page.active { display: flex; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-bar { 
            display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; background: rgba(255, 255, 255, 0.98); border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); z-index: 100; justify-content: space-around; padding: 16px 0;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .nav-item { color: #cbd5e1; font-size: 1.4rem; transition: 0.3s; cursor: pointer; }
        .nav-item.active { color: var(--primary); transform: scale(1.1); }

        .input-box { width: 100%; padding: 15px; border-radius: 18px; background: white; border: 1px solid #e2e8f0; outline: none; margin-bottom: 12px; font-size: 15px; transition: 0.3s; }
        .input-box:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }
        .btn-main { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 16px; border-radius: 18px; font-weight: 700; width: 100%; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3); }
        
        .match-card { height: 65vh; border-radius: 35px; overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        #video-call-ui { display: none; position: fixed; inset: 0; background: black; z-index: 2000; }
    </style>
</head>
<body>

<div class="app-container">

    <div id="login-page" class="page active px-8 pt-20 text-center">
        <div class="mb-10"><i class="fas fa-heart-pulse text-6xl text-violet-600"></i></div>
        <h1 class="text-3xl font-extrabold mb-2">DatingSpark</h1>
        <p class="text-slate-400 mb-8">Login to find your perfect match</p>
        <input type="tel" id="l-phone" placeholder="Phone Number" class="input-box">
        <input type="password" id="l-pass" placeholder="Password" class="input-box">
        <button onclick="authLogin()" class="btn-main mt-4">Sign In</button>
        <p class="mt-8 text-sm">New user? <span onclick="showPage('signup-page')" class="text-violet-600 font-bold cursor-pointer underline">Create Account</span></p>
    </div>

    <div id="signup-page" class="page px-8 pt-8">
        <h2 class="text-2xl font-bold mb-4">Register</h2>
        <div class="flex justify-center mb-6">
            <div onclick="document.getElementById('r-photo').click()" class="w-28 h-28 bg-slate-100 rounded-full flex items-center justify-center border-2 border-dashed border-slate-300 relative overflow-hidden group">
                <img id="img-preview" class="absolute inset-0 w-full h-full object-cover hidden">
                <i class="fas fa-camera text-slate-300 text-xl group-hover:text-violet-400 transition"></i>
            </div>
            <input type="file" id="r-photo" class="hidden" accept="image/*" onchange="previewImage(this)">
        </div>
        <input type="text" id="r-name" placeholder="Full Name" class="input-box">
        <div class="grid grid-cols-2 gap-3">
            <input type="number" id="r-age" placeholder="Age" class="input-box">
            <select id="r-gender" class="input-box"><option value="Male">Male</option><option value="Female">Female</option></select>
        </div>
        <select id="r-country" class="input-box"></select>
        <input type="tel" id="r-phone" placeholder="Phone Number" class="input-box">
        <input type="password" id="r-pass" placeholder="Password" class="input-box">
        <button onclick="handleSignup()" class="btn-main mt-2">Get Verification Code</button>
    </div>

    <div id="verify-page" class="page px-8 pt-20 text-center">
        <h2 class="text-2xl font-bold">Verification</h2>
        <p class="text-slate-400 mt-2 mb-8">Click the code to copy it, then paste below.</p>
        <div id="otp-display" class="bg-violet-100 p-8 rounded-3xl text-4xl font-black tracking-[0.5em] text-violet-600 mb-8 cursor-pointer active:scale-95 transition" onclick="copyOTP()">000000</div>
        <input type="text" id="v-input" placeholder="Enter Code" class="input-box text-center text-2xl tracking-widest font-bold">
        <button onclick="confirmVerify()" class="btn-main mt-4">Confirm & Join</button>
    </div>

    <div id="home-page" class="page px-5 pt-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-black">Discovery</h2>
            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm"><i class="fas fa-sliders-h text-violet-600"></i></div>
        </div>
        <div class="match-card">
            <img id="m-img" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent p-8 flex flex-col justify-end">
                <h3 id="m-info" class="text-white text-3xl font-bold mb-1">Name, 20</h3>
                <p id="m-country-text" class="text-slate-300 font-medium"></p>
                <div class="flex gap-4 mt-8">
                    <button onclick="nextMatch()" class="flex-1 bg-white/10 backdrop-blur-md py-4 rounded-2xl text-white border border-white/20 active:scale-90 transition"><i class="fas fa-times text-xl"></i></button>
                    <button onclick="likeMatch()" class="flex-1 bg-pink-500 py-4 rounded-2xl text-white shadow-lg active:scale-90 transition"><i class="fas fa-heart text-xl"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="message-page" class="page px-6 pt-12">
        <h2 class="text-3xl font-black mb-8">Messages</h2>
        <div id="chat-list" class="space-y-4"></div>
    </div>

    <div id="chat-active" class="page bg-white">
        <div class="p-5 border-b flex items-center gap-4">
            <i onclick="showPage('message-page')" class="fas fa-chevron-left text-slate-400"></i>
            <img id="c-avatar" class="w-12 h-12 rounded-full object-cover">
            <div class="flex-1"><h4 id="c-name" class="font-bold">Name</h4><p class="text-[10px] text-green-500 font-bold uppercase">Online</p></div>
            <button onclick="startVideoCall()" class="w-10 h-10 bg-violet-50 text-violet-600 rounded-full flex items-center justify-center"><i class="fas fa-video"></i></button>
        </div>
        <div id="chat-body" class="flex-1 p-6 bg-slate-50 overflow-y-auto space-y-4"></div>
        <div class="p-4 border-t flex gap-3">
            <input type="text" id="msg-input" placeholder="Type message..." class="flex-1 bg-slate-100 p-4 rounded-2xl outline-none">
            <button onclick="sendMessage()" class="w-14 h-14 bg-violet-600 text-white rounded-2xl shadow-lg"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="profile-page" class="page px-8 pt-12 text-center pb-32">
        <div class="relative w-36 h-36 mx-auto mb-6">
            <img id="u-photo" class="w-full h-full rounded-[2.5rem] object-cover border-4 border-white shadow-2xl">
            <label for="u-photo-change" class="absolute -bottom-2 -right-2 bg-violet-600 text-white w-10 h-10 rounded-full flex items-center justify-center border-4 border-white cursor-pointer shadow-lg">
                <i class="fas fa-camera text-sm"></i>
            </label>
            <input type="file" id="u-photo-change" class="hidden" onchange="updateProfilePhoto(this)">
        </div>
        <input type="text" id="u-name-input" class="text-3xl font-black text-center bg-transparent border-none outline-none w-full mb-1" onchange="updateProfileData()">
        <p id="u-meta" class="text-slate-400 font-bold mb-10"></p>
        
        <div class="space-y-4 text-left">
            <div class="bg-white p-5 rounded-3xl flex justify-between items-center shadow-sm border border-slate-50">
                <span class="font-bold text-slate-700">Account Type</span>
                <span class="text-violet-600 font-black text-xs bg-violet-50 px-3 py-1 rounded-full">PREMIUM</span>
            </div>
            <button onclick="location.reload()" class="w-full p-5 text-red-500 font-bold bg-red-50 rounded-3xl active:scale-95 transition">Logout Account</button>
        </div>
    </div>

    <nav id="nav-bar" class="nav-bar">
        <div onclick="showPage('home-page')" id="n-home" class="nav-item active"><i class="fas fa-fire"></i></div>
        <div onclick="showPage('message-page')" id="n-message" class="nav-item"><i class="fas fa-comment-dots"></i></div>
        <div onclick="showPage('profile-page')" id="n-profile" class="nav-item"><i class="fas fa-user"></i></div>
    </nav>

    <div id="video-call-ui">
        <img id="vc-img" class="w-full h-full object-cover opacity-50">
        <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
            <div class="mb-10 text-center">
                <h2 id="vc-name" class="text-4xl font-black mb-2">Name</h2>
                <p class="animate-pulse">Connecting video...</p>
            </div>
            <button onclick="endCall()" class="w-20 h-20 bg-red-500 rounded-full flex items-center justify-center text-3xl shadow-2xl shadow-red-500/50"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

</div>

    ];

    let currentUser = null;
    let tempUser = null;
    let generatedOTP = "";
    let matchIdx = 0;
    let userImgData = null;

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-bar').style.display = (['login-page','signup-page','verify-page','chat-active'].includes(id)) ? 'none' : 'flex';
        const nId = 'n-' + id.split('-')[0];
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(document.getElementById(nId)) document.getElementById(nId).classList.add('active');
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                userImgData = e.target.result;
                document.getElementById('img-preview').src = userImgData;
                document.getElementById('img-preview').classList.remove('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function handleSignup() {
        const name = document.getElementById('r-name').value;
        const phone = document.getElementById('r-phone').value;
        if(!name || !phone || !userImgData) return alert("Please fill all details and upload a photo!");
        
        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('otp-display').innerText = generatedOTP;
        
        tempUser = {
            name: name, age: document.getElementById('r-age').value,
            gender: document.getElementById('r-gender').value,
            phone: phone, pass: document.getElementById('r-pass').value,
            country: document.getElementById('r-country').value,
            photo: userImgData
        };
        showPage('verify-page');
    }

    function copyOTP() {
        navigator.clipboard.writeText(generatedOTP);
        alert("Verification code copied!");
    }

    function confirmVerify() {
        const input = document.getElementById('v-input').value;
        if(input === generatedOTP) {
            currentUser = tempUser;
            localStorage.setItem(currentUser.phone, JSON.stringify(currentUser));
            initApp();
            showPage('home-page');
        } else {
            alert("Incorrect code! Please try again.");
        }
    }

    function authLogin() {
        const phone = document.getElementById('l-phone').value;
        const pass = document.getElementById('l-pass').value;
        const stored = JSON.parse(localStorage.getItem(phone));
        if(stored && stored.pass === pass) {
            currentUser = stored;
            initApp();
            showPage('home-page');
        } else alert("Invalid phone or password!");
    }

    function initApp() {
        document.getElementById('u-photo').src = currentUser.photo;
        document.getElementById('u-name-input').value = currentUser.name;
        document.getElementById('u-meta').innerText = `${currentUser.age} • ${currentUser.country}`;
        loadDiscovery();
        loadMessages();
    }

    function loadDiscovery() {
        const filtered = matchesDB.filter(m => m.gender !== currentUser.gender);
        if(filtered.length > 0) {
            const m = filtered[matchIdx % filtered.length];
            document.getElementById('m-img').src = m.img;
            document.getElementById('m-info').innerText = `${m.name}, ${m.age}`;
            document.getElementById('m-country-text').innerText = m.country;
        }
    }

    function nextMatch() { matchIdx++; loadDiscovery(); }

    function likeMatch() {
        const filtered = matchesDB.filter(m => m.gender !== currentUser.gender);
        const m = filtered[matchIdx % filtered.length];
        alert("It's a Match with " + m.name + "!");
        openChat(m);
    }

    function loadMessages() {
        const list = document.getElementById('chat-list');
        list.innerHTML = "";
        matchesDB.filter(m => m.gender !== currentUser.gender).forEach(m => {
            list.innerHTML += `
                <div onclick='openChat(${JSON.stringify(m)})' class="flex items-center gap-4 bg-white p-4 rounded-[2rem] shadow-sm border border-slate-50 active:scale-95 transition">
                    <img src="${m.img}" class="w-16 h-16 rounded-2xl object-cover">
                    <div class="flex-1"><p class="font-bold">${m.name}</p><p class="text-xs text-slate-400">Matched from ${m.country}</p></div>
                    <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
                </div>`;
        });
    }

    let activeChatPartner = null;
    function openChat(partner) {
        activeChatPartner = partner;
        document.getElementById('c-avatar').src = partner.img;
        document.getElementById('c-name').innerText = partner.name;
        document.getElementById('chat-body').innerHTML = `<div class="bg-white p-4 rounded-2xl rounded-bl-none shadow-sm text-sm max-w-[80%]">Hey! I'm ${partner.name}. Let's chat!</div>`;
        showPage('chat-active');
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        if(input.value) {
            document.getElementById('chat-body').innerHTML += `<div class="bg-violet-600 text-white p-4 rounded-2xl rounded-br-none text-sm ml-auto max-w-[80%] shadow-lg">${input.value}</div>`;
            input.value = "";
            document.getElementById('chat-body').scrollTop = document.getElementById('chat-body').scrollHeight;
        }
    }

    function startVideoCall() {
        document.getElementById('vc-img').src = activeChatPartner.img;
        document.getElementById('vc-name').innerText = activeChatPartner.name;
        document.getElementById('video-call-ui').style.display = 'block';
    }

    function endCall() { document.getElementById('video-call-ui').style.display = 'none'; }

    function updateProfileData() {
        currentUser.name = document.getElementById('u-name-input').value;
        localStorage.setItem(currentUser.phone, JSON.stringify(currentUser));
    }

    function updateProfilePhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                currentUser.photo = e.target.result;
                document.getElementById('u-photo').src = currentUser.photo;
                localStorage.setItem(currentUser.phone, JSON.stringify(currentUser));
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
