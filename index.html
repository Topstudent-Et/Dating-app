<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIATOR PREMIUM | ETHIOPIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .game-screen { background: radial-gradient(circle at center, #1a2a3a 0%, #000 100%); height: 250px; border-radius: 20px; position: relative; overflow: hidden; border: 1px solid #333; }
        .bet-btn-main { background: #28a745; border-radius: 15px; height: 70px; width: 100%; font-weight: 900; box-shadow: 0 4px 0 #1e7e34; }
        .bet-btn-main.cashout { background: #f97316; box-shadow: 0 4px 0 #c2410c; }
        .winner-card { background: linear-gradient(180deg, #2c2d2e 0%, #1b1c1d 100%); border-radius: 15px; padding: 10px; border: 1px solid #444; }
        .crown-1 { color: #ffd700; font-size: 24px; } /* Gold */
        .crown-2 { color: #c0c0c0; font-size: 20px; } /* Silver */
        .crown-3 { color: #cd7f32; font-size: 20px; } /* Bronze */
        .verified-badge { color: #34b4ff; margin-left: 4px; font-size: 12px; }
        .auto-btn { background: #333; border-radius: 8px; padding: 5px; font-size: 12px; font-weight: bold; border: 1px solid #444; }
        .auto-btn.active { background: #fff; color: #000; }
        .nav-fixed { position: fixed; bottom: 0; width: 100%; background: #1b1c1d; border-top: 1px solid #333; height: 65px; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    </style>
</head>
<body class="p-3 pb-24">

    <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-2">
            <div id="userPhoto" class="w-10 h-10 rounded-full bg-zinc-800 border-2 border-blue-500 overflow-hidden">
                <img src="https://via.placeholder.com/40" id="tgImg">
            </div>
            <div>
                <div class="text-[12px] font-bold flex items-center">
                    <span id="tgName">Guest_User</span> <i class="fas fa-check-circle verified-badge"></i>
                </div>
                <div class="text-[10px] text-zinc-400">Verified Player</div>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-zinc-900 px-3 py-1 rounded-full border border-zinc-700">
            <span id="mainBalance" class="text-green-500 font-black">0.00 ETB</span>
        </div>
    </div>

    <div id="gamePage" class="page-content">
        <div class="game-screen mb-4 flex flex-col items-center justify-center">
            <div id="statusLabel" class="text-zinc-500 text-xs font-bold mb-2">WAITING FOR NEXT ROUND</div>
            <div id="multiplier" class="text-6xl font-black">1.00x</div>
            <div id="plane" class="absolute bottom-10 left-10 text-4xl transform transition-transform">✈️</div>
        </div>

        <div class="bg-zinc-900 p-4 rounded-3xl mb-3 border border-zinc-800">
            <div class="flex justify-around mb-3">
                <button class="auto-btn active">2x</button>
                <button class="auto-btn">4x</button>
                <button class="auto-btn">8x</button>
                <button class="auto-btn">10x</button>
            </div>
            <div class="flex gap-3">
                <div class="w-1/2">
                    <input type="number" id="betAmt1" value="10" class="w-full bg-black border border-zinc-700 rounded-xl p-3 text-center font-bold outline-none">
                </div>
                <div class="w-1/2">
                    <button id="mainBetBtn" onclick="toggleBet()" class="bet-btn-main text-xl">BET</button>
                </div>
            </div>
        </div>

        <div class="mt-6">
            <h3 class="text-center font-bold mb-4 text-zinc-400">TOP PLAYERS</h3>
            <div class="flex justify-center items-end gap-2 mb-6">
                <div class="winner-card w-24 h-32 flex flex-col items-center justify-center">
                    <i class="fas fa-trophy crown-2"></i>
                    <span class="text-[10px] font-bold mt-1">Abebe_K</span>
                    <span class="text-green-500 font-bold text-xs">4,200.00</span>
                </div>
                <div class="winner-card w-28 h-40 flex flex-col items-center justify-center border-yellow-500">
                    <i class="fas fa-crown crown-1"></i>
                    <span class="text-[12px] font-bold mt-1">Dawit_Dev</span>
                    <span class="text-green-500 font-bold text-sm">12,500.00</span>
                </div>
                <div class="winner-card w-24 h-28 flex flex-col items-center justify-center">
                    <i class="fas fa-trophy crown-3"></i>
                    <span class="text-[10px] font-bold mt-1">Sami_Pro</span>
                    <span class="text-green-500 font-bold text-xs">2,150.00</span>
                </div>
            </div>
            
            <div id="winnersList" class="space-y-2 max-h-60 overflow-y-auto pr-2">
                </div>
        </div>
    </div>

    <div id="walletPage" class="page-content hidden">
        <h2 class="text-xl font-bold mb-4">Financial Dashboard</h2>
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="showSection('deposit')" class="bg-green-600 p-3 rounded-xl font-bold">Deposit</button>
            <button onclick="showSection('withdraw')" class="bg-orange-600 p-3 rounded-xl font-bold">Withdraw</button>
        </div>

        <div id="depositSection" class="space-y-4">
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <img src="1000067890.png" class="w-12 mb-2">
                <p class="text-xs text-zinc-400">Commercial Bank (CBE)</p>
                <p class="font-bold select-all text-lg">1000179571815</p>
                <p class="text-[10px]">DAWIT FIKADU</p>
            </div>
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <img src="1000067892.png" class="w-12 mb-2">
                <p class="text-xs text-zinc-400">Telebirr</p>
                <p class="font-bold select-all text-lg">0906067696</p>
                <p class="text-[10px]">DAWIT FIKADU</p>
            </div>
            <input type="text" id="txnId" placeholder="Transaction Reference (FT/Adwa No)" class="w-full bg-zinc-800 p-4 rounded-xl outline-none">
            <input type="number" id="depAmt" placeholder="Amount to Deposit" class="w-full bg-zinc-800 p-4 rounded-xl outline-none">
            <button onclick="submitAdmin('Deposit')" class="w-full bg-blue-600 p-4 rounded-xl font-black">SUBMIT DEPOSIT</button>
        </div>
    </div>

    <nav class="nav-fixed">
        <div onclick="togglePage('gamePage')" class="flex flex-col items-center"><i class="fas fa-plane"></i><span class="text-[10px]">Play</span></div>
        <div onclick="togglePage('walletPage')" class="flex flex-col items-center"><i class="fas fa-wallet"></i><span class="text-[10px]">Wallet</span></div>
        <div class="flex flex-col items-center text-zinc-600"><i class="fas fa-user-shield"></i><span class="text-[10px]">Admin</span></div>
    </nav>

    <script>
        // --- Game Logic ---
        let currentMult = 1.0;
        let isPlaying = false;
        let betActive = false;
        let totalPool = 5000; // Example total money in this round
        let adminProfitTarget = 0.20; // 20% Profit margin

        function syncWithUTC() {
            // This ensures everyone sees the same game start based on server time (mocked here)
            const now = new Date();
            return now.getUTCSeconds();
        }

        function startRound() {
            let status = document.getElementById('statusLabel');
            let multDisplay = document.getElementById('multiplier');
            let plane = document.getElementById('plane');
            
            isPlaying = true;
            currentMult = 1.0;
            status.innerText = "ROUND IN PROGRESS";
            status.classList.add('text-red-500');

            // Algorithm: If many people bet, crash sooner to protect 20% profit
            // If no one is betting, let it fly to 30x+ to bait people
            let crashPoint = betActive ? (1.1 + Math.random() * 2.5) : (10 + Math.random() * 50);

            let timer = setInterval(() => {
                currentMult += 0.01 * (currentMult / 2);
                multDisplay.innerText = currentMult.toFixed(2) + "x";
                
                // Plane movement
                plane.style.transform = `translate(${currentMult * 20}px, -${currentMult * 10}px)`;

                if (currentMult >= crashPoint) {
                    clearInterval(timer);
                    crash();
                }
            }, 50);
        }

        function crash() {
            document.getElementById('statusLabel').innerText = "FLEW AWAY!";
            document.getElementById('multiplier').classList.add('text-red-600');
            isPlaying = false;
            betActive = false;
            
            setTimeout(() => {
                document.getElementById('multiplier').classList.remove('text-red-600');
                document.getElementById('multiplier').innerText = "1.00x";
                document.getElementById('plane').style.transform = "translate(0,0)";
                startRound();
            }, 4000);
        }

        // --- UI Logic ---
        function togglePage(id) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function toggleBet() {
            let btn = document.getElementById('mainBetBtn');
            if(!betActive) {
                betActive = true;
                btn.innerText = "CASHOUT";
                btn.classList.add('cashout');
            } else {
                let win = currentMult * parseFloat(document.getElementById('betAmt1').value);
                alert("You Cashed Out: " + win.toFixed(2) + " ETB");
                betActive = false;
                btn.innerText = "BET";
                btn.classList.remove('cashout');
            }
        }

        function loadWinners() {
            const list = document.getElementById('winnersList');
            const names = ["Mulugeta", "Selam_T", "Yared_Bio", "Hana_99", "Kebede_King", "Ethio_Pro"];
            for(let i=4; i<=50; i++) {
                let name = names[Math.floor(Math.random()*names.length)] + "_" + i;
                let win = (Math.random() * 1500 + 100).toFixed(2);
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-zinc-900 p-2 rounded-lg text-xs">
                        <div class="flex items-center">
                            <span class="text-zinc-500 mr-2">#${i}</span>
                            <span>${name}</span>
                        </div>
                        <span class="text-green-500 font-bold">${win} ETB</span>
                    </div>`;
            }
        }

        function submitAdmin(type) {
            let tid = document.getElementById('txnId').value;
            let amt = document.getElementById('depAmt').value;
            if(!tid || !amt) return alert("Please fill all fields!");
            alert(type + " Request Sent to Admin Dawit!");
        }

        window.onload = () => {
            loadWinners();
            startRound();
        };
    </script>
</body>
</html>
