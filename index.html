<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator - DAI Edition</title>
    <style>
        body {
            background-color: #0b0e11;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* Top Bar */
        .top-bar {
            background-color: #1c2127;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .top-left, .top-right {
            display: flex;
            align-items: center;
        }
        .back-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 16px;
            margin-right: 15px;
            cursor: pointer;
        }
        .aviator-logo {
            color: #d32f2f;
            font-size: 20px;
            font-weight: bold;
            font-style: italic;
        }
        .balance {
            color: #28a745;
            font-weight: bold;
            margin-right: 15px;
        }
        .menu-btn, .dropdown-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* History Bar */
        .history-bar {
            background-color: #1c2127;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
            overflow-x: auto;
        }
        .history-bar span {
            margin-right: 15px;
            font-size: 14px;
        }
        .h-blue { color: #5bc0de; }
        .h-purple { color: #a951d4; }
        .h-dark-purple { color: #8e44ad; }
        .h-icon {
            color: #ccc;
            margin-left: auto;
            cursor: pointer;
        }

        /* Fun Mode & Game Screen */
        .game-display {
            padding: 15px;
            text-align: center;
        }
        .fun-mode-banner {
            background-color: #e6b800; /* Gold */
            color: black;
            padding: 5px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            border-radius: 5px 5px 0 0;
        }
        .game-screen {
            background-color: black;
            padding: 40px;
            border-radius: 0 0 10px 10px;
            position: relative;
            overflow: hidden;
        }
        .screen-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at bottom, rgba(211, 47, 47, 0.2) 0%, rgba(0,0,0,1) 60%);
            z-index: 1;
        }
        .current-multiplier {
            font-size: 64px;
            font-weight: bold;
            z-index: 2;
            position: relative;
        }
        .plane-graphic {
            position: absolute;
            bottom: 10px; left: 10px;
            width: 80px;
            z-index: 2;
        }
        .players-count {
            position: absolute;
            bottom: 10px; right: 10px;
            background-color: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            display: flex;
            align-items: center;
            z-index: 2;
        }
        .players-avatars {
            display: flex;
            margin-right: 5px;
        }
        .player-avatar {
            width: 15px; height: 15px;
            border-radius: 50%;
            margin-left: -5px;
            border: 1px solid #1c2127;
        }
        .player-avatar:first-child { margin-left: 0; }
        .a1 { background: green; }
        .a2 { background: yellow; }
        .a3 { background: purple; }

        /* Double Bet Panels */
        .betting-panel {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bet-control-container {
            background-color: #1c2127;
            padding: 15px;
            border-radius: 10px;
        }
        .tab-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            gap: 10px;
        }
        .tab {
            background-color: #2c353d;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
        }
        .tab.active {
            background-color: #4a5a69;
            color: white;
        }
        .middle-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .amount-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }
        .bet-input-row {
            display: flex;
            align-items: center;
            background-color: black;
            border-radius: 5px;
            padding: 5px 10px;
        }
        .adjust-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
        }
        .amount-input {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            width: 100%;
        }
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }
        .preset-btn {
            background-color: #2c353d;
            border: none;
            color: #ccc;
            padding: 8px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .bet-btn-main {
            background-color: #28a745; /* Green */
            color: white;
            border: none;
            border-radius: 10px;
            padding: 20px;
            width: 120px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }
        .bet-btn-label { display: block; }
        .bet-btn-amount { display: block; margin-top: 5px; font-weight: normal; font-size: 14px; }
        .bet-header-right {
            display: flex;
            align-items: center;
            margin-left: auto;
        }
        .cancel-btn {
            background: none;
            border: 1px solid #4a5a69;
            color: #4a5a69;
            border-radius: 50%;
            width: 25px; height: 25px;
            margin-left: 10px;
            cursor: pointer;
        }

        /* Summary Bar */
        .summary-bar {
            background-color: #1c2127;
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-tabs {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #ccc;
        }
        .summary-tab.active { color: white; }
        .stats {
            text-align: right;
            font-size: 14px;
        }
        .total-win { color: #ccc; }
        .total-win-amount { font-weight: bold; font-size: 16px; color: white; }
        .win-currency { color: #ccc; font-size: 12px; }
        .all-bets-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 12px;
            color: #ccc;
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-left">
            <button class="back-btn">← Back</button>
            <span class="aviator-logo">Aviator</span>
        </div>
        <div class="top-right">
            <span class="balance">50,000.00 ETB</span>
            <button class="menu-btn">≡</button>
        </div>
    </div>

    <div class="history-bar">
        <span class="h-blue">1.31x</span>
        <span class="h-blue">1.98x</span>
        <span class="h-purple">2.29x</span>
        <span class="h-blue">1.50x</span>
        <span class="h-dark-purple">16.69x</span>
        <span class="h-blue">1.21x</span>
        <span class="h-blue">1.42x</span>
        <button class="dropdown-btn">∨</button>
        <span class="h-icon">ⓘ</span>
    </div>

    <div class="game-display">
        <div class="fun-mode-banner">FUN MODE</div>
        <div class="game-screen">
            <div class="screen-gradient"></div>
            <div class="current-multiplier">1.08x</div>
            <svg class="plane-graphic" viewBox="0 0 100 60">
                <path d="M10,30 L60,30 L90,10 L90,50 L60,30" fill="#d32f2f" stroke="white" stroke-width="2"/>
                <line x1="70" y1="25" x2="80" y2="35" stroke="black" stroke-width="2"/>
                <line x1="70" y1="35" x2="80" y2="25" stroke="black" stroke-width="2"/>
            </svg>
            <div class="players-count">
                <div class="players-avatars">
                    <div class="player-avatar a1"></div>
                    <div class="player-avatar a2"></div>
                    <div class="player-avatar a3"></div>
                </div>
                131
            </div>
        </div>
    </div>

    <div class="betting-panel">
        <div class="bet-control-container">
            <div class="tab-bar">
                <div class="tab active">ተወራረድ</div>
                <div class="tab">ራስ ሰር</div>
            </div>
            <div class="middle-controls">
                <div class="amount-selector">
                    <div class="bet-input-row">
                        <button class="adjust-btn">−</button>
                        <input type="text" value="4.00" class="amount-input">
                        <button class="adjust-btn">+</button>
                    </div>
                    <div class="preset-grid">
                        <button class="preset-btn">16</button>
                        <button class="preset-btn">40</button>
                        <button class="preset-btn">80</button>
                        <button class="preset-btn">400</button>
                    </div>
                </div>
                <button class="bet-btn-main">
                    <span class="bet-btn-label">ተወራረድ</span>
                    <span class="bet-btn-amount">4.00 ETB</span>
                </button>
            </div>
        </div>

        <div class="bet-control-container">
            <div class="tab-bar">
                <div class="tab active">ተወራረድ</div>
                <div class="tab">ራስ ሰር</div>
                <div class="bet-header-right">
                    <button class="cancel-btn">−</button>
                </div>
            </div>
            <div class="middle-controls">
                <div class="amount-selector">
                    <div class="bet-input-row">
                        <button class="adjust-btn">−</button>
                        <input type="text" value="4.00" class="amount-input">
                        <button class="adjust-btn">+</button>
                    </div>
                    <div class="preset-grid">
                        <button class="preset-btn">16</button>
                        <button class="preset-btn">40</button>
                        <button class="preset-btn">80</button>
                        <button class="preset-btn">400</button>
                    </div>
                </div>
                <button class="bet-btn-main">
                    <span class="bet-btn-label">ተወራረድ</span>
                    <span class="bet-btn-amount">4.00 ETB</span>
                </button>
            </div>
        </div>

        <div class="summary-bar">
            <div class="summary-tabs">
                <span class="summary-tab active">ሁሉም ውርርዶች</span>
                <span class="summary-tab">የኔዎች</span>
                <span class="summary-tab">ከፍተኛ</span>
            </div>
            <div class="stats">
                <span class="total-win">ጠቅላላ ድል <span class="win-currency">ETB</span></span>
                <div class="total-win-amount">13,316.25</div>
            </div>
        </div>
        <div class="all-bets-row">
            <span>217/218 ውርርዶች</span>
        </div>
    </div>

</body>
</html>
