<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator - Fun Mode</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f1e;
      color: white;
      text-align: center;
    }
    .header {
      background: #1a1a2e;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { color: #ff3366; font-size: 24px; font-weight: bold; }
    .balance { color: #00ff88; font-size: 20px; }
    
    .game-area {
      height: 300px;
      background: linear-gradient(#0a0a1f, #1a1a3a);
      position: relative;
      overflow: hidden;
      margin: 10px;
      border-radius: 12px;
    }
    #plane {
      position: absolute;
      font-size: 60px;
      transition: transform 0.1s linear;
      bottom: 80px;
      left: 20%;
    }
    
    .multiplier {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 20px #00ffff;
    }
    
    .controls {
      display: flex;
      gap: 15px;
      padding: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .bet-box {
      background: #1f1f2e;
      padding: 15px;
      border-radius: 12px;
      width: 220px;
    }
    button {
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .bet-btn {
      background: #00cc66;
      color: white;
      width: 100%;
    }
    .cashout-btn {
      background: #ff3366;
      color: white;
      font-weight: bold;
    }
    .history {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 10px;
    }
    .hist-item {
      background: #2a2a3a;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">Aviator</div>
    <div class="balance">50,000.00 ETB</div>
  </div>

  <div class="game-area" id="game">
    <div id="plane">✈️</div>
    <div class="multiplier" id="multi">1.00x</div>
  </div>

  <div class="history" id="history"></div>

  <div class="controls">
    <div class="bet-box">
      <p>ተጫወት (Bet)</p>
      <input type="number" id="betAmount" value="4" style="width:100%; padding:8px; margin:8px 0; background:#333; color:white; border:none; border-radius:6px;">
      <button class="bet-btn" onclick="placeBet()">ተጫወት 4.00 ETB</button>
    </div>

    <div class="bet-box">
      <button class="cashout-btn" id="cashoutBtn" onclick="cashOut()" style="display:none; width:100%; padding:18px; font-size:22px;">
        ይውጣ <span id="currentWin">0.00</span> ETB
      </button>
    </div>
  </div>

  <script>
    let multiplier = 1.00;
    let isFlying = false;
    let betPlaced = false;
    let currentBet = 0;
    let interval;
    let crashPoint;

    const multiEl = document.getElementById('multi');
    const planeEl = document.getElementById('plane');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const historyEl = document.getElementById('history');

    function startFlight() {
      if (isFlying) return;
      isFlying = true;
      betPlaced = false;
      multiplier = 1.00;
      crashPoint = (Math.random() * 8 + 1.2).toFixed(2); // 1.2x \~ 9x መካከል

      multiEl.textContent = "1.00x";
      planeEl.style.transform = `translateY(0px) rotate(-10deg)`;

      cashoutBtn.style.display = 'none';

      interval = setInterval(() => {
        multiplier += 0.01;
        multiEl.textContent = multiplier.toFixed(2) + "x";

        // Plane animation
        const height = Math.min(multiplier * 25, 200);
        planeEl.style.transform = `translateY(-\( {height}px) rotate( \){Math.sin(multiplier) * 15}deg)`;

        if (multiplier >= crashPoint) {
          crash();
        }
      }, 50);
    }

    function placeBet() {
      const amount = parseFloat(document.getElementById('betAmount').value);
      if (amount <= 0) return alert("ትክክለኛ ቤት አስገባ");
      
      currentBet = amount;
      betPlaced = true;
      startFlight();
    }

    function cashOut() {
      if (!isFlying || !betPlaced) return;
      
      const win = (currentBet * multiplier).toFixed(2);
      alert(`🎉 ተሳክቷል! አሸንፈሃል ${win} ETB (at ${multiplier.toFixed(2)}x)`);
      
      addToHistory(multiplier.toFixed(2));
      resetGame();
    }

    function crash() {
      clearInterval(interval);
      isFlying = false;
      planeEl.style.transition = 'transform 0.6s';
      planeEl.style.transform = `translateY(-280px) rotate(-80deg)`;

      setTimeout(() => {
        alert(`💥 Plane Crashed at ${crashPoint}x !`);
        addToHistory(crashPoint + "x", true);
        resetGame();
      }, 600);
    }

    function resetGame() {
      clearInterval(interval);
      isFlying = false;
      betPlaced = false;
      cashoutBtn.style.display = 'none';
      planeEl.style.transition = 'transform 0.1s linear';
      planeEl.style.transform = `translateY(0px) rotate(-10deg)`;
    }

    function addToHistory(mult, isCrash = false) {
      const item = document.createElement('div');
      item.className = 'hist-item';
      item.style.color = isCrash ? '#ff3366' : '#00ff88';
      item.textContent = mult + "x";
      historyEl.prepend(item);

      if (historyEl.children.length > 8) historyEl.removeChild(historyEl.lastChild);
    }

    // Auto start button simulation
    setTimeout(() => {
      console.log("ጨዋታው ዝግጁ ነው!");
    }, 500);
  </script>
</body>
</html>
