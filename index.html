<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DatingSpark | Global Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #8b5cf6; --secondary: #ec4899; --bg: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #1e293b; overflow-x: hidden; }
        
        .page { display: none; min-height: 100vh; padding-bottom: 100px; }
        .page.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-bar { 
            display: none; position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 85%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            border-radius: 24px; border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.1); z-index: 100; justify-content: space-around; padding: 15px 0;
        }
        .nav-item { color: #cbd5e1; font-size: 1.3rem; transition: 0.3s; cursor: pointer; }
        .nav-item.active { color: var(--primary); transform: scale(1.2); }

        .input-box { width: 100%; padding: 16px; border-radius: 18px; background: white; border: 1px solid #e2e8f0; outline: none; margin-bottom: 12px; transition: 0.3s; }
        .input-box:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }

        .btn-main { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; padding: 16px; border-radius: 18px; font-weight: 700; width: 100%; box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4); }
        
        .match-card { position: relative; height: 70vh; border-radius: 35px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); }
        
        .match-overlay { 
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);
            position: absolute; bottom: 0; width: 100%; padding: 30px;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div id="login-page" class="page active px-8 pt-20 text-center">
        <div class="mb-12">
            <div class="w-20 h-20 bg-violet-100 text-violet-600 rounded-[2rem] flex items-center justify-center mx-auto mb-6 rotate-12 shadow-lg shadow-violet-100">
                <i class="fas fa-heart text-4xl"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight">DatingSpark</h1>
            <p class="text-slate-400 mt-2">Find your global connection</p>
        </div>
        <input type="email" id="l-email" placeholder="Email Address" class="input-box">
        <input type="password" id="l-pass" placeholder="Password" class="input-box">
        <button onclick="authLogin()" class="btn-main mt-4">Sign In</button>
        <p class="mt-10 text-slate-500 text-sm">New here? <span onclick="showPage('signup-page')" class="text-violet-600 font-bold underline cursor-pointer">Create Account</span></p>
    </div>

    <div id="signup-page" class="page px-8 pt-10">
        <h2 class="text-3xl font-extrabold mb-6">Create Profile</h2>
        <div class="flex justify-center mb-8">
            <div onclick="document.getElementById('r-photo').click()" class="w-32 h-32 bg-white rounded-[2.5rem] border-2 border-dashed border-slate-200 flex flex-col items-center justify-center cursor-pointer overflow-hidden relative group">
                <img id="img-preview" class="absolute w-full h-full object-cover hidden">
                <i id="upload-icon" class="fas fa-camera text-slate-300 text-2xl mb-2"></i>
                <span id="upload-text" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Add Photo</span>
            </div>
            <input type="file" id="r-photo" class="hidden" accept="image/*" onchange="previewImage(this)">
        </div>
        <input type="text" id="r-name" placeholder="Full Name" class="input-box">
        <div class="grid grid-cols-2 gap-4">
            <input type="number" id="r-age" placeholder="Age" class="input-box">
            <select id="r-gender" class="input-box">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <select id="r-country" class="input-box text-slate-600">
            <option value="">Select Your Country</option>
        </select>
        <input type="email" id="r-email" placeholder="Email" class="input-box">
        <input type="password" id="r-pass" placeholder="Password" class="input-box">
        <button onclick="authSignup()" class="btn-main mt-4">Start Exploring</button>
    </div>

    <div id="home-page" class="page px-5 pt-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-black">Discovery</h2>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Global Matches</p>
            </div>
            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-violet-600 shadow-sm border border-slate-100">
                <i class="fas fa-sliders text-lg"></i>
            </div>
        </div>
        <div id="match-card" class="match-card bg-white">
            <img id="m-img" src="" class="w-full h-full object-cover">
            <div class="match-overlay">
                <div class="flex items-center gap-2 mb-2">
                    <span id="m-badge" class="bg-violet-600 text-[10px] text-white px-3 py-1 rounded-full font-bold uppercase tracking-tighter">Verified</span>
                </div>
                <h3 id="m-info" class="text-white text-3xl font-bold">Name, Age</h3>
                <p id="m-country" class="text-slate-300 font-medium"></p>
                <div class="flex gap-4 mt-8">
                    <button onclick="nextMatch()" class="flex-1 bg-white/10 backdrop-blur-md py-4 rounded-2xl text-white border border-white/20 active:scale-95 transition">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                    <button onclick="triggerMatchEffect()" class="flex-1 bg-white py-4 rounded-2xl text-pink-600 shadow-lg active:scale-95 transition">
                        <i class="fas fa-heart text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="message-page" class="page px-6 pt-12">
        <h2 class="text-3xl font-black mb-8">Messages</h2>
        <div id="chat-list" class="space-y-4"></div>
    </div>

    <div id="profile-page" class="page px-8 pt-16 text-center">
        <div class="relative w-40 h-40 mx-auto mb-8">
            <img id="u-avatar" src="" class="w-full h-full rounded-[3rem] border-4 border-white shadow-2xl object-cover ring-8 ring-violet-50">
        </div>
        <h2 id="u-name" class="text-3xl font-black italic">Name</h2>
        <p id="u-meta" class="text-slate-400 mt-2 font-bold"></p>
        <div class="mt-12 grid grid-cols-1 gap-4">
            <div class="bg-white p-6 rounded-[2rem] text-left flex justify-between items-center shadow-sm border border-slate-100">
                <span class="text-slate-600 font-bold"><i class="fas fa-crown text-amber-400 mr-2"></i> Spark VIP</span>
                <button class="text-violet-600 font-black text-xs">UPGRADE</button>
            </div>
            <button onclick="location.reload()" class="w-full p-6 text-red-500 font-bold bg-red-50 rounded-[2rem]">Sign Out</button>
        </div>
    </div>

    <nav id="nav-bar" class="nav-bar flex">
        <div onclick="showPage('home-page')" id="n-home" class="nav-item active"><i class="fas fa-fire-alt"></i></div>
        <div onclick="showPage('message-page')" id="n-message" class="nav-item"><i class="fas fa-comment-dots"></i></div>
        <div onclick="showPage('profile-page')" id="n-profile" class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

</div>

<div id="match-effect" class="fixed inset-0 bg-violet-600/95 z-[500] hidden flex flex-col items-center justify-center text-white text-center p-10">
    <div class="flex gap-4 mb-8">
        <img id="match-u1" class="w-32 h-32 rounded-full border-4 border-white object-cover">
        <img id="match-u2" class="w-32 h-32 rounded-full border-4 border-white object-cover">
    </div>
    <h2 class="text-5xl font-black italic mb-4">It's a Match!</h2>
    <p class="mb-12 font-medium opacity-80">You and <span id="match-name">Her</span> like each other.</p>
    <button onclick="closeMatchEffect()" class="bg-white text-violet-600 px-10 py-4 rounded-2xl font-black shadow-2xl">Send Message</button>
    <p onclick="closeMatchEffect()" class="mt-6 font-bold cursor-pointer opacity-60">Keep Swiping</p>
</div>

    const countrySelect = document.getElementById('r-country');
    countries.forEach(c => {
        countrySelect.innerHTML += `<option value="${c.f} ${c.n}">${c.f} ${c.n}</option>`;
    });

    const matchesDB = [
        {name: "Saron", age: 22, gender: "Female", country: "🇪🇹 Ethiopia", img: "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=500"},
        {name: "Elena", age: 24, gender: "Female", country: "🇮🇹 Italy", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500"},
        {name: "Chloe", age: 21, gender: "Female", country: "🇺🇸 USA", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500"}
    ];

    let userAccount = null;
    let matchIdx = 0;
    let userPhoto = "https://ui-avatars.com/api/?background=8b5cf6&color=fff&name=User";

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const navId = 'n-' + id.split('-')[0];
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(document.getElementById(navId)) document.getElementById(navId).classList.add('active');
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                userPhoto = e.target.result;
                document.getElementById('img-preview').src = userPhoto;
                document.getElementById('img-preview').classList.remove('hidden');
                document.getElementById('upload-icon').style.display = 'none';
                document.getElementById('upload-text').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function authSignup() {
        const email = document.getElementById('r-email').value;
        const name = document.getElementById('r-name').value;
        if(!email || !name) return alert("Please fill your basic info!");
        userAccount = {
            name: name, email: email, pass: document.getElementById('r-pass').value,
            country: document.getElementById('r-country').value, age: document.getElementById('r-age').value, photo: userPhoto
        };
        localStorage.setItem(email, JSON.stringify(userAccount));
        alert("Welcome to DatingSpark!");
        showPage('login-page');
    }

    function authLogin() {
        const email = document.getElementById('l-email').value;
        const pass = document.getElementById('l-pass').value;
        const stored = JSON.parse(localStorage.getItem(email));
        if(stored && stored.pass === pass) {
            userAccount = stored;
            initApp();
            document.getElementById('nav-bar').style.display = 'flex';
            showPage('home-page');
        } else { alert("Invalid Credentials!"); }
    }

    function initApp() {
        document.getElementById('u-name').innerText = userAccount.name;
        document.getElementById('u-meta').innerText = `${userAccount.age} • ${userAccount.country}`;
        document.getElementById('u-avatar').src = userAccount.photo;
        loadMatch();
        updateChatList();
    }

    function loadMatch() {
        const target = matchesDB[matchIdx % matchesDB.length];
        document.getElementById('m-img').src = target.img;
        document.getElementById('m-info').innerText = `${target.name}, ${target.age}`;
        document.getElementById('m-country').innerText = target.country;
    }

    function nextMatch() { matchIdx++; loadMatch(); }

    function triggerMatchEffect() {
        const target = matchesDB[matchIdx % matchesDB.length];
        document.getElementById('match-u1').src = userAccount.photo;
        document.getElementById('match-u2').src = target.img;
        document.getElementById('match-name').innerText = target.name;
        document.getElementById('match-effect').classList.remove('hidden');
    }

    function closeMatchEffect() {
        document.getElementById('match-effect').classList.add('hidden');
        nextMatch();
    }

    function updateChatList() {
        const list = document.getElementById('chat-list');
        list.innerHTML = "";
        matchesDB.forEach(m => {
            list.innerHTML += `
                <div class="flex items-center gap-4 bg-white p-4 rounded-3xl shadow-sm border border-slate-50">
                    <img src="${m.img}" class="w-16 h-16 rounded-2xl object-cover">
                    <div class="flex-1">
                        <p class="font-bold text-slate-800">${m.name}</p>
                        <p class="text-xs text-slate-400">Match from ${m.country}</p>
                    </div>
                    <i class="fas fa-chevron-right text-slate-200 text-sm"></i>
                </div>`;
        });
    }
</script>
</body>
</html>
