<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAI ULTIMATE CASINO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Poppins:wght@300;600;800&display=swap');
        
        :root { --primary: #e91e63; --bg: #060709; --card: #12151a; }
        body { background-color: var(--bg); color: white; font-family: 'Poppins', sans-serif; transition: 0.3s; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }

        /* Game Screens */
        .page { display: none; padding-bottom: 80px; animation: fadeIn 0.4s ease-out; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Aviator Animation */
        .aviator-canvas { height: 300px; background: radial-gradient(circle at bottom left, #1a0b12 0%, #000 100%); position: relative; border-radius: 20px; overflow: hidden; border: 1px solid #2d1a24; }
        .plane-img { position: absolute; width: 70px; bottom: 20px; left: 20px; z-index: 10; filter: drop-shadow(0 0 12px var(--primary)); }
        
        /* Navigation */
        .bottom-nav { background: rgba(18, 21, 26, 0.98); backdrop-filter: blur(15px); border-top: 1px solid #242933; position: fixed; bottom: 0; width: 100%; height: 70px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-btn { color: #64748b; font-size: 0.75rem; text-align: center; cursor: pointer; }
        .nav-btn.active { color: var(--primary); }

        /* Slots Animation */
        .slot-reel { height: 100px; background: #1a1f26; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 3rem; border: 2px solid #2d3748; }
    </style>
</head>
<body>

    <div class="p-4 flex justify-between items-center sticky top-0 bg-[#060709]/90 z-[999] backdrop-blur-md">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-gradient-to-tr from-pink-600 to-red-500 rounded-xl flex items-center justify-center font-black">D</div>
            <h1 class="text-xl font-black italic tracking-tight">DAI <span class="text-pink-600">CASINO</span></h1>
        </div>
        <div class="bg-gray-900 border border-gray-800 px-4 py-1.5 rounded-full flex items-center gap-2">
            <i class="fa-solid fa-coins text-yellow-500"></i>
            <span id="balance" class="font-bold text-green-400">1000.00</span>
        </div>
    </div>

    <section id="home" class="page active-page p-4">
        <h2 class="text-gray-400 font-bold text-xs uppercase tracking-widest mb-4">Popular Games</h2>
        <div class="grid grid-cols-2 gap-4">
            <div onclick="openGame('aviator')" class="relative group rounded-2xl overflow-hidden border border-gray-800 cursor-pointer">
                <img src="https://images.unsplash.com/photo-1559156200-66a00ee7efed?w=400" class="w-full h-44 object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent p-4 flex flex-col justify-end">
                    <p class="font-black text-lg">AVIATOR</p>
                    <span class="text-[10px] text-pink-500">LIVE NOW</span>
                </div>
            </div>
            <div onclick="openGame('keno')" class="relative rounded-2xl overflow-hidden border border-gray-800">
                <img src="https://images.unsplash.com/photo-1518133835878-5a93cc3f89e5?w=400" class="w-full h-44 object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent p-4 flex flex-col justify-end">
                    <p class="font-black text-lg">KENO</p>
                </div>
            </div>
            <div onclick="openGame('slots')" class="relative rounded-2xl overflow-hidden border border-gray-800">
                <img src="https://images.unsplash.com/photo-1596838132731-dd96a2c5adfe?w=400" class="w-full h-44 object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent p-4 flex flex-col justify-end">
                    <p class="font-black text-lg">SLOTS</p>
                </div>
            </div>
            <div onclick="openGame('crash')" class="relative rounded-2xl overflow-hidden border border-gray-800">
                <img src="https://images.unsplash.com/photo-1614028674026-a65e31bfd27c?w=400" class="w-full h-44 object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent p-4 flex flex-col justify-end">
                    <p class="font-black text-lg">CRASH</p>
                </div>
            </div>
        </div>
    </section>

    <section id="aviator" class="page p-4">
        <div class="flex items-center gap-2 mb-4 text-gray-500" onclick="showPage('home')">
            <i class="fa-solid fa-arrow-left"></i> <span>Back</span>
        </div>
        
        <div class="aviator-canvas flex items-center justify-center">
            <div id="aviator-msg" class="absolute top-4 text-gray-500 font-bold text-xs uppercase">Connecting...</div>
            <div id="aviator-multi" class="font-game text-5xl font-black text-white z-20">1.00x</div>
            <img id="aviator-plane" src="https://www.svgrepo.com/show/491500/airplane-top-view.svg" class="plane-img" style="filter: invert(15%) sepia(95%) saturate(6932%) hue-rotate(348deg) brightness(92%) contrast(100%);">
        </div>

        <div class="mt-4 bg-gray-900 p-4 rounded-3xl border border-gray-800">
            <input id="aviator-bet" type="number" value="10" class="w-full bg-black text-center p-3 rounded-xl mb-3 font-bold border border-gray-700 outline-none">
            <button id="aviator-btn" onclick="aviatorBet()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-xl">BET</button>
        </div>
    </section>

    <section id="slots" class="page p-6 text-center">
        <div class="flex items-center gap-2 mb-6 text-gray-500" onclick="showPage('home')">
            <i class="fa-solid fa-arrow-left"></i> <span>Back</span>
        </div>
        <h2 class="text-2xl font-black mb-8 italic">LUCKY SLOTS</h2>
        <div class="grid grid-cols-3 gap-2 mb-8">
            <div id="reel1" class="slot-reel">🍒</div>
            <div id="reel2" class="slot-reel">💎</div>
            <div id="reel3" class="slot-reel">🍋</div>
        </div>
        <button onclick="spinSlots()" class="w-full bg-pink-600 py-5 rounded-2xl font-black text-xl shadow-lg shadow-pink-900/40">SPIN (10 ETB)</button>
    </section>

    <section id="keno" class="page p-4">
        <div class="flex items-center gap-2 mb-4 text-gray-500" onclick="showPage('home')">
            <i class="fa-solid fa-arrow-left"></i> <span>Back</span>
        </div>
        <h2 class="text-xl font-bold mb-4">Select 5 Numbers</h2>
        <div id="keno-grid" class="grid grid-cols-5 gap-2 mb-6">
            </div>
        <button onclick="playKeno()" class="w-full bg-blue-600 py-4 rounded-2xl font-black">PLAY KENO</button>
    </section>

    <div class="bottom-nav">
        <div onclick="showPage('home')" class="nav-btn active"><i class="fa-solid fa-house text-xl mb-1"></i><p>Home</p></div>
        <div onclick="openGame('aviator')" class="nav-btn"><i class="fa-solid fa-plane-up text-xl mb-1"></i><p>Aviator</p></div>
        <div onclick="showPage('slots')" class="nav-btn"><i class="fa-solid fa-bolt text-xl mb-1"></i><p>Slots</p></div>
        <div class="nav-btn"><i class="fa-solid fa-wallet text-xl mb-1"></i><p>Wallet</p></div>
    </div>

    <audio id="audio-fly" loop src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="audio-crash" src="https://assets.mixkit.co/active_storage/sfx/2511/2511-preview.mp3"></audio>

    <script>
        let balance = 1000.00;
        let currentBet = 0;
        let isFlying = false;
        let hasBet = false;
        let aviatorLoop;
        let multiplier = 1.00;

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
            
            // Stop sound when leaving game
            if(id !== 'aviator') {
                document.getElementById('audio-fly').pause();
                clearInterval(aviatorLoop);
            }
        }

        function openGame(id) {
            showPage(id);
            if(id === 'aviator') startAviatorLoop();
        }

        // --- AVIATOR ENGINE (STABLE) ---
        function startAviatorLoop() {
            if(isFlying) return;
            let status = document.getElementById('aviator-msg');
            let countdown = 5;
            
            let timer = setInterval(() => {
                status.innerText = `NEXT ROUND IN ${countdown}S...`;
                countdown--;
                if(countdown < 0) {
                    clearInterval(timer);
                    runAviator();
                }
            }, 1000);
        }

        function runAviator() {
            isFlying = true;
            multiplier = 1.00;
            document.getElementById('aviator-msg').innerText = "PLANE IS FLYING";
            document.getElementById('aviator-multi').style.color = "white";
            document.getElementById('audio-fly').play();

            // 40% Admin Profit Logic
            let crashPoint = Math.random() < 0.4 ? (1 + Math.random() * 0.5) : (1 + Math.random() * 10);

            aviatorLoop = setInterval(() => {
                multiplier += 0.03;
                document.getElementById('aviator-multi').innerText = multiplier.toFixed(2) + "x";
                
                // Plane Movement
                let plane = document.getElementById('aviator-plane');
                plane.style.transform = `translate(${multiplier * 25}px, -${multiplier * 15}px)`;

                if(multiplier >= crashPoint) {
                    endAviator();
                }
            }, 80);
        }

        function endAviator() {
            clearInterval(aviatorLoop);
            isFlying = false;
            document.getElementById('audio-fly').pause();
            document.getElementById('audio-fly').currentTime = 0;
            document.getElementById('audio-crash').play();

            document.getElementById('aviator-multi').innerText = "FLEW AWAY!";
            document.getElementById('aviator-multi').style.color = "#ff0055";
            
            if(hasBet) {
                hasBet = false;
                document.getElementById('aviator-btn').innerText = "BET";
                document.getElementById('aviator-btn').className = "w-full bg-green-600 py-4 rounded-2xl font-black text-xl";
            }

            setTimeout(() => {
                document.getElementById('aviator-plane').style.transform = "translate(0,0)";
                startAviatorLoop();
            }, 3000);
        }

        function aviatorBet() {
            let btn = document.getElementById('aviator-btn');
            let amt = parseFloat(document.getElementById('aviator-bet').value);

            if(!isFlying && !hasBet) {
                if(amt > balance) return alert("Low Balance!");
                balance -= amt;
                currentBet = amt;
                hasBet = true;
                btn.innerText = "WAITING...";
                btn.className = "w-full bg-gray-700 py-4 rounded-2xl font-black text-xl";
                updateBalance();
            } else if (isFlying && hasBet) {
                let win = currentBet * multiplier;
                balance += win;
                hasBet = false;
                alert(`WIN: ${win.toFixed(2)} ETB`);
                btn.innerText = "BET";
                btn.className = "w-full bg-green-600 py-4 rounded-2xl font-black text-xl";
                updateBalance();
            }
        }

        // --- SLOTS LOGIC ---
        function spinSlots() {
            if(balance < 10) return alert("Low balance");
            balance -= 10;
            updateBalance();

            const icons = ['🍒', '💎', '🍋', '🔔', '7️⃣'];
            let r1 = icons[Math.floor(Math.random() * icons.length)];
            let r2 = icons[Math.floor(Math.random() * icons.length)];
            let r3 = icons[Math.floor(Math.random() * icons.length)];

            document.getElementById('reel1').innerText = r1;
            document.getElementById('reel2').innerText = r2;
            document.getElementById('reel3').innerText = r3;

            if(r1 === r2 && r2 === r3) {
                balance += 500;
                alert("JACKPOT! 500 ETB Won!");
                updateBalance();
            }
        }

        // --- KENO GRID ---
        const kenoGrid = document.getElementById('keno-grid');
        for(let i=1; i<=25; i++) {
            let div = document.createElement('div');
            div.className = "bg-gray-800 p-3 rounded-lg text-center cursor-pointer font-bold border border-gray-700";
            div.innerText = i;
            div.onclick = () => div.classList.toggle('bg-blue-600');
            kenoGrid.appendChild(div);
        }

        function playKeno() {
            alert("Keno numbers drawn! You matched 2 numbers. Prize: 20 ETB");
            balance += 20;
            updateBalance();
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance.toFixed(2);
        }
    </script>
</body>
</html>
