<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME V300 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Game Area */
        .game-view { 
            position: relative; height: 35vh; margin: 10px; border: 2px solid #1a1a1a; 
            border-radius: 20px; background: radial-gradient(circle at bottom, #1a0505, #000); overflow: hidden;
        }
        #multiplier { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font-size: 3.5rem; font-weight: 900; z-index: 20; }
        #flewAway { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 900; color: #ff0000; z-index: 40; display: none; text-shadow: 0 0 20px red; }
        #plane { position: absolute; font-size: 30px; z-index: 30; transition: 0.1s linear; }
        #svgPath { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        #redLine { stroke: #ff0000; stroke-width: 4; fill: none; }

        /* History Dots */
        #history { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .h-item { padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: 900; }

        .btn-bet { background: linear-gradient(180deg, #22c55e, #166534); width: 45%; height: 55px; border-radius: 15px; font-weight: 900; border-bottom: 4px solid #052e16; }
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 120px; }
        .active { display: block; }
        
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 20px 0; }
        .p-card { background: #0a0a0a; border: 1px solid #222; border-radius: 15px; display: flex; flex-direction: column; align-items: center; padding: 12px; }
        .gold { width: 110px; height: 140px; border-color: #fbbf24; box-shadow: 0 0 15px #fbbf2433; }
    </style>
</head>
<body>

    <header class="flex justify-between items-center p-4 bg-black border-b border-zinc-900 sticky top-0 z-[1000]">
        <div class="flex items-center gap-3">
            <img id="uP" src="" class="w-10 h-10 rounded-full border border-zinc-800">
            <div><p id="uN" class="text-[10px] font-black uppercase">Nahom</p><p class="text-[7px] text-blue-500 font-bold uppercase">Pro Player</p></div>
        </div>
        <div onclick="showPage('wallet')" class="bg-zinc-900 px-4 py-1.5 rounded-xl border border-zinc-800 cursor-pointer active:scale-95">
            <span id="mainBal" class="text-green-500 font-game text-lg">0.00</span>
        </div>
    </header>

    <div id="playPage" class="page active">
        <div id="history"></div>
        <div class="game-view">
            <div id="multiplier" class="font-game">1.00x</div>
            <div id="flewAway" class="font-game">FLEW AWAY</div>
            <svg id="svgPath"><path id="redLine" d=""></path></svg>
            <div id="plane" style="left: 10%; bottom: 10%;">✈️</div>
        </div>
        <div class="px-4 space-y-3">
            <div class="flex gap-2 items-center">
                <div class="flex-1 flex justify-between bg-zinc-900 p-3 rounded-xl border border-zinc-800 font-black">
                    <button onclick="adj('a1',-50)">-</button><input id="a1" type="number" value="100" class="bg-transparent w-16 text-center outline-none"><button onclick="adj('a1',50)" class="text-green-500">+</button>
                </div>
                <button class="btn-bet" onclick="startBet()">BET</button>
            </div>
            <div class="flex gap-2 items-center">
                <div class="flex-1 flex justify-between bg-zinc-900 p-3 rounded-xl border border-zinc-800 font-black">
                    <button onclick="adj('a2',-50)">-</button><input id="a2" type="number" value="200" class="bg-transparent w-16 text-center outline-none"><button onclick="adj('a2',50)" class="text-green-500">+</button>
                </div>
                <button class="btn-bet" onclick="startBet()">BET</button>
            </div>
        </div>
    </div>

    <div id="walletPage" class="page p-6">
        <h2 class="font-black mb-4">WALLET</h2>
        <div class="space-y-4">
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800" onclick="cp('1000179571815','CBE')">
                <p class="text-[8px] text-zinc-500 font-black">CBE (ዳዊት ፍቃዱ)</p>
                <p class="text-lg font-black mt-1">1000179571815 <i class="fas fa-copy ml-2 text-blue-500"></i></p>
            </div>
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800" onclick="cp('165097254','Abyssinia')">
                <p class="text-[8px] text-zinc-500 font-black">ABYSSINIA (ዳዊት ፍቃዱ)</p>
                <p class="text-xl font-black mt-1">165097254 <i class="fas fa-copy ml-2 text-yellow-500"></i></p>
            </div>
            <div class="grid grid-cols-2 gap-2 mt-6">
                <input type="number" id="da" placeholder="Amount" class="bg-zinc-900 p-4 rounded-xl outline-none border border-zinc-800 col-span-2">
                <input type="text" id="df" placeholder="Transaction ID / Acc" class="bg-zinc-900 p-4 rounded-xl outline-none border border-zinc-800 col-span-2">
                <button onclick="sR('Deposit')" class="bg-green-600 py-4 rounded-xl font-black">DEPOSIT</button>
                <button onclick="sR('Withdraw')" class="bg-red-600 py-4 rounded-xl font-black">WITHDRAW</button>
            </div>
        </div>
    </div>

    <div id="topPage" class="page p-5">
        <div class="podium">
            <div class="p-card border-zinc-500 h-28 w-24"><span>🥈</span><p class="text-[9px] font-black mt-1">ሳራ ካሳሁን</p><p class="text-green-500 font-bold">92,400</p></div>
            <div class="p-card gold"><span>👑</span><p class="text-[11px] font-black mt-1">አቤል ተስፋዬ</p><p class="text-green-500 font-bold">128,500</p></div>
            <div class="p-card border-orange-800 h-28 w-24"><span>🥉</span><p class="text-[9px] font-black mt-1">ዳዊት አሰፋ</p><p class="text-green-500 font-bold">74,200</p></div>
        </div>
        <div id="winList" class="space-y-2"></div>
    </div>

    <div id="profilePage" class="page p-10 text-center">
        <img id="uPL" src="" class="w-24 h-24 rounded-full mx-auto border-4 border-zinc-900 mb-4 bg-zinc-800">
        <h2 id="uNL" class="font-black text-xl mb-6">PLAYER</h2>
        <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 text-left">
            <p class="font-black text-sm">💰 ጋብዘው ያትርፉ!</p>
            <p class="text-[10px] text-zinc-400 mt-2">በቀን እስከ <span class="text-white">100,000 ብር</span> የሚያሸንፉበት ምርጥ ጨዋታ! አንድ ሰው ሲጋብዙ <span class="text-green-500 font-bold">500 ብር</span> ያገኛሉ።</p>
            <button onclick="sh()" class="w-full bg-blue-600 py-4 rounded-xl font-black mt-5 text-xs">SHARE LINK</button>
        </div>
        <button id="admB" onclick="showPage('admin')" class="hidden w-full bg-zinc-800 py-3 rounded-xl mt-6 font-black text-[10px] text-zinc-500 tracking-widest">ADMIN PANEL</button>
    </div>

    <div id="adminPage" class="page p-6"><h2 class="text-center font-black text-red-600 mb-6">ADMIN REQUESTS</h2><div id="admL" class="space-y-3"></div></div>

    <nav class="fixed bottom-0 w-full h-20 bg-black border-t border-zinc-900 flex justify-around items-center pb-4 z-[2000]">
        <div onclick="showPage('play')" id="n-play" class="text-green-500 flex flex-col items-center"><i class="fas fa-gamepad"></i><span class="text-[8px] mt-1 font-black">GAME</span></div>
        <div onclick="showPage('wallet')" id="n-wallet" class="flex flex-col items-center"><i class="fas fa-wallet"></i><span class="text-[8px] mt-1 font-black">WALLET</span></div>
        <div onclick="showPage('top')" id="n-top" class="flex flex-col items-center"><i class="fas fa-crown"></i><span class="text-[8px] mt-1 font-black">TOP</span></div>
        <div onclick="showPage('profile')" id="n-profile" class="flex flex-col items-center"><i class="fas fa-user-circle"></i><span class="text-[8px] mt-1 font-black">ME</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = 1476161161;
        let user = tg.initDataUnsafe.user || { id: 1476161161, first_name: "Nahom" };
        let db = JSON.parse(localStorage.getItem('w_pro_v3')) || { bal: 0.0, played: 0, reqs: [], hist: [] };

        function save() {
            localStorage.setItem('w_pro_v3', JSON.stringify(db));
            document.getElementById('mainBal').innerText = db.bal.toFixed(2);
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById(p+'Page').classList.add('active');
            document.querySelectorAll('nav div').forEach(e => e.classList.remove('text-green-500'));
            document.getElementById('n-'+p).classList.add('text-green-500');
            if(p==='top') renderW();
            if(p==='admin') renderA();
        }

        function adj(id, v) { let e = document.getElementById(id); let nv = parseInt(e.value)+v; if(nv>=10) e.value=nv; }
        function cp(t,m) { navigator.clipboard.writeText(t); alert(m + " አካውንት ተገልብጧል!"); }
        
        function sh() {
            const m = encodeURIComponent(`በየቀኑ እስከ 100,000 ብር የሚያሸንፉበት ምርጥ ጨዋታ! ጋብዘው 500 ብር ያግኙ፡ t.me/world_all_gamesbot?start=ref${user.id}`);
            window.open(`https://t.me/share/url?url=${m}`);
        }

        function sR(t) {
            const a = document.getElementById('da').value, x = document.getElementById('df').value;
            if(!a || !x) return alert("Fill all data!");
            db.reqs.push({id: Date.now(), user: user.first_name, type: t, amt: parseFloat(a), extra: x});
            save(); alert("Request sent to Admin!");
        }

        function renderA() {
            const l = document.getElementById('admL');
            l.innerHTML = db.reqs.map(r => `
                <div class="bg-zinc-900 p-4 rounded-xl flex justify-between items-center border border-zinc-800">
                    <div><p class="text-[10px] font-black">${r.user} (${r.type})</p><p class="text-green-500 font-bold">${r.amt} ETB</p><p class="text-[8px] text-zinc-500">${r.extra}</p></div>
                    <button onclick="approve(${r.id})" class="bg-green-600 px-4 py-2 rounded-lg font-bold text-xs">APPROVE</button>
                </div>`).join('');
        }

        function approve(id) {
            const i = db.reqs.findIndex(r => r.id === id);
            if(db.reqs[i].type==='Deposit') db.bal += db.reqs[i].amt;
            if(db.reqs[i].type==='Withdraw') db.bal -= db.reqs[i].amt;
            db.reqs.splice(i, 1); save(); renderA();
        }

        function renderW() {
            const names = ["ዮናስ መኮንን", "ቤተልሔም ታደሰ", "ሔኖክ አበበ", "ብስራት ደምሴ", "ፅዮን ግርማ", "ዳዊት ወልዴ", "ኪያ ተፈራ", "ሊዲያ ሙሉጌታ", "ዮሴፍ አየለ"];
            const l = document.getElementById('winList'); l.innerHTML = "";
            for(let i=4; i<=50; i++) l.innerHTML += `<div class="bg-zinc-900/40 p-3 rounded-xl flex justify-between text-[11px] border border-zinc-900"><span>#${i} ${names[i%names.length]}</span><span class="font-bold text-zinc-400">${(60000 - i*1100).toLocaleString()}</span></div>`;
        }

        let m = 1.0, isCrashed = false;
        function gameLoop() {
            const p = document.getElementById('plane'), ml = document.getElementById('multiplier'), fl = document.getElementById('flewAway'), line = document.getElementById('redLine'), area = document.querySelector('.game-view');
            // Admin Profit Logic: Fast crash if real balance is used (1.0 to 1.3)
            let crash = (db.bal > 50) ? (1.0 + Math.random() * 0.3) : (1.1 + Math.random() * 6.0);
            let pts = []; isCrashed = false; fl.style.display = 'none'; ml.style.display = 'block'; ml.style.color = 'white';

            let t = setInterval(() => {
                if(isCrashed) return;
                m += 0.04; ml.innerText = m.toFixed(2) + "x";
                let x = 10+(m-1)*13, y = 10+(m-1)*11;
                p.style.left = x + "%"; p.style.bottom = y + "%";
                let ax = (area.clientWidth * x)/100, ay = area.clientHeight - (area.clientHeight * y)/100;
                pts.push(`${ax},${ay}`); line.setAttribute("d", "M" + pts.join(" L"));

                if(m >= crash) {
                    isCrashed = true; clearInterval(t);
                    ml.style.display = 'none'; fl.style.display = 'block';
                    db.hist.unshift({v: crash.toFixed(2), c: crash > 2 ? 'bg-blue-600' : 'bg-red-600'});
                    if(db.hist.length > 15) db.hist.pop();
                    updateHist(); db.played++; save();
                    setTimeout(() => { m=1.0; line.setAttribute("d",""); p.style.left="10%"; p.style.bottom="10%"; gameLoop(); }, 3500);
                }
            }, 100);
        }

        function updateHist() {
            const h = document.getElementById('history');
            h.innerHTML = db.hist.map(i => `<span class="h-item ${i.c}">${i.v}x</span>`).join('');
        }

        window.onload = () => {
            document.getElementById('uN').innerText = user.first_name;
            document.getElementById('uNL').innerText = user.first_name;
            if(user.photo_url) { document.getElementById('uP').src = user.photo_url; document.getElementById('uPL').src = user.photo_url; }
            if(user.id === ADMIN_ID) document.getElementById('admB').classList.remove('hidden');
            save(); updateHist(); gameLoop();
        };
    </script>
</body>
</html>
