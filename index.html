<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="World Dating - Professional Dating Platform">
    <meta name="theme-color" content="#ff6b8b">
    <title>World Dating | Find Your Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        /* LIGHT THEME */
        body.light {
            background: #f5f7fb;
            color: #1a1a2e;
        }
        body.light .card {
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            border: 1px solid #eef2f6;
        }
        body.light .sticky-header {
            background: rgba(255,255,255,0.98);
            box-shadow: 0 2px 20px rgba(0,0,0,0.03);
            border-bottom: 1px solid #eef2f6;
        }
        body.light .nav-btn {
            color: #555;
        }
        body.light .user-card {
            background: #fafbfc;
            border: 1px solid #eef2f6;
        }
        body.light input, body.light select {
            background: #ffffff;
            color: #1a1a2e;
            border: 1px solid #e1e8ed;
        }
        body.light .logo h1 {
            background: linear-gradient(135deg, #c2185b, #ff6b8b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.light .hero {
            background: linear-gradient(135deg, #ffe0e7 0%, #fff0f3 100%);
        }

        /* DARK THEME */
        body.dark {
            background: #0a0a1a;
            color: #e4e6eb;
        }
        body.dark .card {
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,107,139,0.15);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
        }
        body.dark .sticky-header {
            background: rgba(10, 10, 26, 0.98);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,107,139,0.1);
        }
        body.dark .nav-btn {
            color: #b0b3b8;
        }
        body.dark .user-card {
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(255,107,139,0.1);
        }
        body.dark input, body.dark select {
            background: rgba(20, 20, 35, 0.9);
            color: #e4e6eb;
            border: 1px solid rgba(255,107,139,0.2);
        }
        body.dark .logo h1 {
            background: linear-gradient(135deg, #ff6b8b, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.dark .hero {
            background: linear-gradient(135deg, rgba(255,107,139,0.1), rgba(0,0,0,0.3));
        }

        /* GLOBAL STYLES */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px 40px;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-radius: 60px;
            margin-top: 15px;
        }

        .logo h1 {
            font-size: 26px;
            letter-spacing: -0.5px;
        }
        .logo p {
            font-size: 11px;
            opacity: 0.7;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: none;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn.active, .nav-btn:hover {
            background: linear-gradient(135deg, #ff6b8b, #c2185b);
            color: white !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(194,24,91,0.3);
        }

        .user-widget {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle {
            background: rgba(255,107,139,0.15);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            color: inherit;
        }
        .theme-toggle:hover {
            background: rgba(255,107,139,0.3);
            transform: scale(1.05);
        }

        .avatar-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(145deg, #ff6b8b, #b34167);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
            overflow: hidden;
        }
        .avatar-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card {
            border-radius: 28px;
            padding: 28px;
            margin-bottom: 28px;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-3px);
        }

        .hero {
            border-radius: 40px;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 40px;
        }
        .hero h2 {
            font-size: 52px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .hero p {
            font-size: 18px;
            opacity: 0.85;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff8da1;
            font-size: 18px;
            z-index: 1;
        }
        input, select {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 50px;
            font-size: 15px;
            transition: all 0.2s;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ff6b8b;
            box-shadow: 0 0 0 3px rgba(255,107,139,0.15);
        }
        button {
            background: linear-gradient(135deg, #ff6b8b, #c2185b);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-size: 15px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(194,24,91,0.35);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #ff6b8b;
            color: #ff6b8b;
        }
        .btn-outline:hover {
            background: #ff6b8b;
            color: white;
        }

        .flex-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .user-card {
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: 0.2s;
        }
        .user-card:hover {
            transform: translateX(5px);
        }
        .user-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #ffb347, #ff6b8b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }
        .icon-btn {
            background: rgba(255,107,139,0.15);
            padding: 8px 16px;
            width: auto;
            border-radius: 40px;
            font-size: 13px;
        }

        .stat-card {
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            flex: 1;
            min-width: 150px;
        }
        .stat-card i {
            font-size: 42px;
            color: #ff6b8b;
            margin-bottom: 12px;
        }
        .stat-card h3 {
            font-size: 32px;
            font-weight: 800;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid rgba(255,107,139,0.15);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }
        .social-icons a {
            color: #ffb6c7;
            margin: 0 12px;
            font-size: 22px;
            transition: 0.2s;
        }
        .social-icons a:hover {
            color: #ff6b8b;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .app-container { padding: 0 16px 30px; }
            .hero h2 { font-size: 32px; }
            .hero { padding: 40px 20px; }
            .user-card { flex-wrap: wrap; }
            .action-buttons { margin-left: 0; width: 100%; justify-content: flex-end; }
        }

        .hide { display: none !important; }
        .error { color: #ff4444; font-size: 13px; margin-top: -8px; margin-bottom: 12px; }
        .badge {
            background: #ff6b8b;
            color: white;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            margin-left: 8px;
        }
    </style>
</head>
<body class="light">
<div class="app-container" id="app">
    <div class="sticky-header">
        <div class="logo">
            <h1><i class="fas fa-globe-americas"></i> World Dating</h1>
            <p>✨ Find your perfect match ✨</p>
        </div>
        <div class="nav-links" id="navLinks"></div>
        <div class="user-widget" id="userWidget">
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        </div>
    </div>
    <div id="mainContent"></div>
    <footer>
        <div>© 2026 World Dating | Premium Dating Platform</div>
        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-telegram-plane"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
        </div>
    </footer>
</div>

<script>
    let currentUser = null;
    let allUsers = [];
    let currentTab = "home";
    let isAdminMode = false;
    const STORAGE_KEY = "world_dating_pro";

    // Load data from localStorage
    function loadStoredData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            allUsers = JSON.parse(stored);
        } else {
            allUsers = [
                { id: "u1", phone: "0912345678", fullname: "Aisha Ahmed", gender: "female", age: 24, photo: "👩🏾", country: "Ethiopia", password: "1234", liked: [], receivedLikes: [], messages: [], lastLogin: Date.now() },
                { id: "u2", phone: "0922334455", fullname: "Nathaniel Bekele", gender: "male", age: 27, photo: "🧔🏾", country: "Ethiopia", password: "abcd", liked: [], receivedLikes: [], messages: [], lastLogin: Date.now() },
                { id: "u3", phone: "0933445566", fullname: "Selam Haile", gender: "female", age: 22, photo: "👩🏽", country: "Ethiopia", password: "selam", liked: [], receivedLikes: [], messages: [], lastLogin: Date.now() }
            ];
            saveToLocal();
        }
        const savedSession = sessionStorage.getItem("currentUserId");
        if(savedSession) {
            const found = allUsers.find(u => u.id === savedSession);
            if(found) currentUser = found;
        }
    }
    
    function saveToLocal() { 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allUsers)); 
    }
    
    function saveCurrentUserToSession() { 
        if(currentUser) sessionStorage.setItem("currentUserId", currentUser.id); 
        else sessionStorage.removeItem("currentUserId"); 
    }

    // Register new user (Telegram not asked - uses phone as identifier)
    function registerUser(phone, gender, age, photoFile, password) {
        if(!phone || phone.length < 10) return "Valid phone number required";
        if(!gender) return "Please select gender";
        if(!age || age < 18) return "Minimum age 18 required";
        if(!password) return "Password required";
        if(allUsers.find(u => u.phone === phone)) return "Phone number already registered!";
        
        let photoData = gender === "female" ? "👩" : "👨";
        if(photoFile && photoFile instanceof File && photoFile.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) { 
                photoData = e.target.result;
                // Update after async load
                const userIndex = allUsers.findIndex(u => u.phone === phone);
                if(userIndex !== -1) {
                    allUsers[userIndex].photo = photoData;
                    if(currentUser && currentUser.phone === phone) currentUser.photo = photoData;
                    saveToLocal();
                    render();
                }
            };
            reader.readAsDataURL(photoFile);
        }
        
        const newUser = {
            id: "u"+Date.now()+Math.random(),
            phone: phone,
            fullname: phone,
            gender: gender,
            age: parseInt(age),
            photo: photoData,
            country: "Ethiopia",
            password: password,
            liked: [],
            receivedLikes: [],
            messages: [],
            lastLogin: Date.now()
        };
        allUsers.push(newUser);
        saveToLocal();
        currentUser = newUser;
        saveCurrentUserToSession();
        return "SUCCESS";
    }

    function loginUser(phone, password) {
        const user = allUsers.find(u => u.phone === phone);
        if(!user) return "Phone number not found";
        if(user.password !== password) return "Incorrect password";
        currentUser = user;
        user.lastLogin = Date.now();
        saveToLocal();
        saveCurrentUserToSession();
        return "SUCCESS";
    }

    function adminLogin(phone, password) {
        if(phone === "0910016861" && password === "215221") {
            isAdminMode = true;
            currentUser = null;
            return "SUCCESS";
        }
        return "Invalid admin credentials";
    }

    function sendLike(targetId) {
        if(!currentUser) return;
        const target = allUsers.find(u => u.id === targetId);
        if(!target || currentUser.liked.includes(targetId)) { 
            alert("You already liked this person"); 
            return; 
        }
        currentUser.liked.push(targetId);
        target.receivedLikes.push(currentUser.id);
        saveToLocal();
        render();
    }

    function sendMessage(targetId, msg) {
        if(!currentUser || !msg?.trim()) return;
        const target = allUsers.find(u => u.id === targetId);
        if(target) {
            const messageObj = { from: currentUser.id, to: targetId, text: msg, time: Date.now() };
            currentUser.messages = currentUser.messages || [];
            currentUser.messages.push(messageObj);
            target.messages = target.messages || [];
            target.messages.push(messageObj);
            saveToLocal();
            render();
        }
    }

    function getOppositeGenderUsers() {
        if(!currentUser) return [];
        const opposite = currentUser.gender === "male" ? "female" : "male";
        return allUsers.filter(u => u.id !== currentUser.id && u.gender === opposite);
    }

    function getMatches() {
        if(!currentUser) return [];
        return allUsers.filter(u => currentUser.liked.includes(u.id) && u.receivedLikes.includes(currentUser.id));
    }

    function getUserMessages() {
        if(!currentUser) return [];
        return (currentUser.messages || []).sort((a,b)=>b.time - a.time);
    }

    // Admin Panel
    function renderAdminPanel() {
        const totalUsers = allUsers.length;
        const totalLikes = allUsers.reduce((sum, u) => sum + u.liked.length, 0);
        const countries = [...new Set(allUsers.map(u => u.country))];
        return `
            <div class="card">
                <h2><i class="fas fa-shield-alt"></i> Admin Panel</h2>
                <div class="flex-row" style="margin-top: 25px">
                    <div class="stat-card"><i class="fas fa-users"></i><h3>${totalUsers}</h3><p>Total Members</p></div>
                    <div class="stat-card"><i class="fas fa-heart"></i><h3>${totalLikes}</h3><p>Total Likes</p></div>
                    <div class="stat-card"><i class="fas fa-globe"></i><h3>${countries.length}</h3><p>Countries</p></div>
                </div>
                <h3 style="margin-top: 25px; margin-bottom: 15px"><i class="fas fa-list"></i> All Members (${totalUsers})</h3>
                ${allUsers.map(u => `
                    <div class="user-card">
                        <div class="user-avatar">${u.photo && u.photo.includes('data:image') ? `<img src="${u.photo}">` : (u.photo || '👤')}</div>
                        <div>
                            <strong>${u.fullname}</strong><br>
                            <i class="fas fa-phone"></i> ${u.phone}<br>
                            <i class="fas fa-map-marker-alt"></i> ${u.country} | 🎂 ${u.age} | ${u.gender === 'male' ? '👨 Male' : '👩 Female'}
                        </div>
                    </div>
                `).join('')}
                <button id="adminLogoutBtn" class="btn-outline" style="margin-top: 20px"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        `;
    }

    // Home Page
    function renderHome() {
        if(isAdminMode) return renderAdminPanel();
        if(!currentUser) {
            return `
                <div class="hero">
                    <h2>Find Your Love 🌍</h2>
                    <p>Connect with amazing people from around the world</p>
                </div>
                <div class="card" id="authCard">
                    <div style="display:flex; gap:12px; margin-bottom:25px; border-bottom:2px solid #ff6b8b20; padding-bottom:10px">
                        <button id="showLoginBtn" style="background:#ff6b8b; width:auto; padding:10px 28px">Login</button>
                        <button id="showSignupBtn" class="btn-outline" style="width:auto; padding:10px 28px">Sign Up</button>
                    </div>
                    <div id="authMsg" class="error"></div>
                    <div id="loginForm">
                        <div class="input-group"><i class="fas fa-phone-alt"></i><input type="tel" id="loginPhone" placeholder="Phone Number"></div>
                        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="loginPassword" placeholder="Password"></div>
                        <button id="doLoginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
                        <button id="adminLoginBtn" class="btn-outline" style="margin-top:12px"><i class="fas fa-user-shield"></i> Admin Login</button>
                    </div>
                    <div id="signupForm" class="hide">
                        <div class="input-group"><i class="fas fa-phone-alt"></i><input type="tel" id="signupPhone" placeholder="Phone Number"></div>
                        <div class="flex-row">
                            <div class="input-group" style="flex:1"><i class="fas fa-venus-mars"></i><select id="signupGender"><option value="">Gender</option><option value="male">Male</option><option value="female">Female</option></select></div>
                            <div class="input-group" style="flex:1"><i class="fas fa-calendar"></i><input type="number" id="signupAge" placeholder="Age"></div>
                        </div>
                        <div class="input-group"><i class="fas fa-camera"></i><input type="file" id="signupPhoto" accept="image/*"></div>
                        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="signupPassword" placeholder="Password"></div>
                        <button id="doSignupBtn"><i class="fas fa-user-plus"></i> Create Account</button>
                    </div>
                </div>
            `;
        }
        
        const oppositeUsers = getOppositeGenderUsers();
        const matches = getMatches();
        
        let html = `<div class="hero"><h2>Welcome back, ${currentUser.fullname}! 👋</h2><p>Find your perfect match today</p></div>`;
        
        // Stats
        html += `<div class="flex-row" style="margin-bottom: 25px">
            <div class="stat-card"><i class="fas fa-heart"></i><h3>${currentUser.liked.length}</h3><p>Likes Sent</p></div>
            <div class="stat-card"><i class="fas fa-handshake"></i><h3>${matches.length}</h3><p>Matches</p></div>
            <div class="stat-card"><i class="fas fa-envelope"></i><h3>${(currentUser.messages || []).length}</h3><p>Messages</p></div>
        </div>`;
        
        html += `<div class="card"><h3><i class="fas fa-users"></i> ${currentUser.gender === 'male' ? '👩 Suggested Matches' : '👨 Suggested Matches'}</h3>`;
        if(oppositeUsers.length === 0) html += `<p>No users found yet. Check back later!</p>`;
        else oppositeUsers.forEach(u => {
            const likedAlready = currentUser.liked.includes(u.id);
            html += `<div class="user-card">
                <div class="user-avatar">${u.photo && u.photo.includes('data:image') ? `<img src="${u.photo}">` : (u.photo || '👤')}</div>
                <div>
                    <strong>${u.fullname}</strong>, ${u.age}<br>
                    <small><i class="fas fa-map-marker-alt"></i> ${u.country}</small>
                </div>
                <div class="action-buttons">
                    ${!likedAlready ? `<button class="icon-btn like-btn" data-id="${u.id}"><i class="fas fa-heart"></i> Like</button>` : `<button disabled style="background:gray; padding:8px 16px; border-radius:40px;">❤️ Liked</button>`}
                    <button class="icon-btn msg-btn" data-id="${u.id}"><i class="fas fa-comment"></i> Message</button>
                </div>
            </div>`;
        });
        html += `</div>`;
        return html;
    }

    function renderProfile() {
        if(!currentUser || isAdminMode) return "";
        return `<div class="card" style="text-align:center">
            <div class="user-avatar" style="margin:0 auto 20px; width:120px; height:120px; font-size:60px;">${currentUser.photo && currentUser.photo.includes('data:image') ? `<img src="${currentUser.photo}" style="width:100%;height:100%;object-fit:cover">` : (currentUser.photo || '👤')}</div>
            <h2>${currentUser.fullname}</h2>
            <p><i class="fas fa-phone"></i> ${currentUser.phone}</p>
            <p><i class="fas fa-venus-mars"></i> ${currentUser.gender === 'male' ? 'Male' : 'Female'} | 🎂 ${currentUser.age} | <i class="fas fa-globe"></i> ${currentUser.country}</p>
            <button id="logoutBtn" class="btn-outline" style="margin-top: 20px; width: auto; padding: 12px 32px"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>`;
    }

    function renderMatch() {
        if(!currentUser || isAdminMode) return "";
        const matches = getMatches();
        let html = `<div class="card"><h3><i class="fas fa-gem"></i> Your Matches</h3>`;
        if(matches.length === 0) html += `<p>No mutual matches yet. Start liking profiles!</p>`;
        else matches.forEach(m => {
            html += `<div class="user-card">
                <div class="user-avatar">${m.photo && m.photo.includes('data:image') ? `<img src="${m.photo}">` : (m.photo || '👤')}</div>
                <div>
                    <strong>${m.fullname}</strong>, ${m.age}<br>
                    <i class="fas fa-phone"></i> ${m.phone}
                </div>
                <div class="action-buttons">
                    <button class="icon-btn msg-btn" data-id="${m.id}"><i class="fas fa-comment-dots"></i> Message</button>
                </div>
            </div>`;
        });
        html += `</div>`;
        return html;
    }

    function renderMessage() {
        if(!currentUser || isAdminMode) return "";
        const messages = getUserMessages();
        let html = `<div class="card"><h3><i class="fas fa-comments"></i> Messages</h3>`;
        if(messages.length === 0) html += `<p>No messages yet. Start a conversation!</p>`;
        else messages.forEach(msg => {
            const sender = allUsers.find(u => u.id === msg.from);
            html += `<div class="user-card">
                <div>
                    <strong>${sender ? sender.fullname : 'Unknown'}</strong><br>
                    <small>${new Date(msg.time).toLocaleString()}</small>
                    <p style="margin-top:8px">💬 ${msg.text}</p>
                </div>
            </div>`;
        });
        html += `<hr style="margin: 20px 0; border-color:#ff6b8b20">
            <div class="input-group"><i class="fas fa-search"></i><input type="text" id="newMessageTo" placeholder="Recipient phone number"></div>
            <div class="input-group"><i class="fas fa-pen"></i><input type="text" id="newMessageText" placeholder="Type your message..."></div>
            <button id="sendMessageBtn"><i class="fas fa-paper-plane"></i> Send Message</button>
        </div>`;
        return html;
    }

    function render() {
        const navDiv = document.getElementById("navLinks");
        const widgetDiv = document.getElementById("userWidget");
        const mainDiv = document.getElementById("mainContent");
        
        if(isAdminMode || currentUser) {
            if(!isAdminMode) {
                navDiv.innerHTML = `
                    <button class="nav-btn ${currentTab==='home'?'active':''}" data-tab="home"><i class="fas fa-home"></i> Home</button>
                    <button class="nav-btn ${currentTab==='profile'?'active':''}" data-tab="profile"><i class="fas fa-user"></i> Profile</button>
                    <button class="nav-btn ${currentTab==='match'?'active':''}" data-tab="match"><i class="fas fa-handshake"></i> Match</button>
                    <button class="nav-btn ${currentTab==='message'?'active':''}" data-tab="message"><i class="fas fa-envelope"></i> Message</button>
                `;
                widgetDiv.innerHTML = `<div class="avatar-icon" id="profileQuick">${currentUser?.photo?.includes('data:image') ? '<img src="'+currentUser.photo+'">' : (currentUser?.photo || '👤')}</div>`;
            } else {
                navDiv.innerHTML = `<button class="nav-btn active"><i class="fas fa-shield-alt"></i> Admin Panel</button>`;
                widgetDiv.innerHTML = `<div class="avatar-icon"><i class="fas fa-user-shield"></i></div>`;
            }
        } else {
            navDiv.innerHTML = `<button class="nav-btn active"><i class="fas fa-home"></i> Home</button>`;
            widgetDiv.innerHTML = `<div></div>`;
        }

        let content = "";
        if(isAdminMode) content = renderAdminPanel();
        else if(currentTab === 'home') content = renderHome();
        else if(currentTab === 'profile') content = renderProfile();
        else if(currentTab === 'match') content = renderMatch();
        else if(currentTab === 'message') content = renderMessage();
        else content = renderHome();
        
        mainDiv.innerHTML = content;
        
        // Attach event listeners
        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.addEventListener("click", (e) => { 
                if(!isAdminMode && btn.getAttribute("data-tab")) currentTab = btn.getAttribute("data-tab"); 
                render(); 
            });
        });
        
        if(currentUser && !isAdminMode) {
            document.getElementById("logoutBtn")?.addEventListener("click", () => { 
                currentUser = null; 
                isAdminMode = false; 
                saveCurrentUserToSession(); 
                currentTab = "home"; 
                render(); 
            });
            document.getElementById("profileQuick")?.addEventListener("click", () => { 
                currentTab = "profile"; 
                render(); 
            });
        }
        if(isAdminMode) {
            document.getElementById("adminLogoutBtn")?.addEventListener("click", () => { 
                isAdminMode = false; 
                currentUser = null; 
                render(); 
            });
        }
        
        document.querySelectorAll(".like-btn").forEach(btn => btn.addEventListener("click", () => sendLike(btn.getAttribute("data-id"))));
        document.querySelectorAll(".msg-btn").forEach(btn => btn.addEventListener("click", () => {
            const msg = prompt("Type your message:");
            if(msg) sendMessage(btn.getAttribute("data-id"), msg);
        }));
        
        document.getElementById("sendMessageBtn")?.addEventListener("click", () => {
            const toPhone = document.getElementById("newMessageTo")?.value;
            const msgText = document.getElementById("newMessageText")?.value;
            const target = allUsers.find(u => u.phone === toPhone);
            if(target && msgText) sendMessage(target.id, msgText);
            else alert("User not found");
        });
        
        if(!currentUser && !isAdminMode) {
            document.getElementById("showLoginBtn")?.addEventListener("click", () => { 
                document.getElementById("loginForm").classList.remove("hide"); 
                document.getElementById("signupForm").classList.add("hide"); 
            });
            document.getElementById("showSignupBtn")?.addEventListener("click", () => { 
                document.getElementById("loginForm").classList.add("hide"); 
                document.getElementById("signupForm").classList.remove("hide"); 
            });
            document.getElementById("doLoginBtn")?.addEventListener("click", () => {
                const res = loginUser(document.getElementById("loginPhone").value, document.getElementById("loginPassword").value);
                if(res === "SUCCESS") render();
                else document.getElementById("authMsg").innerText = res;
            });
            document.getElementById("doSignupBtn")?.addEventListener("click", () => {
                const fileInput = document.getElementById("signupPhoto");
                const file = fileInput.files[0];
                const res = registerUser(
                    document.getElementById("signupPhone").value,
                    document.getElementById("signupGender").value,
                    document.getElementById("signupAge").value,
                    file,
                    document.getElementById("signupPassword").value
                );
                if(res === "SUCCESS") render();
                else document.getElementById("authMsg").innerText = res;
            });
            document.getElementById("adminLoginBtn")?.addEventListener("click", () => {
                const res = adminLogin(document.getElementById("loginPhone").value, document.getElementById("loginPassword").value);
                if(res === "SUCCESS") render();
                else document.getElementById("authMsg").innerText = res;
            });
        }
    }

    // Theme Toggle
    document.getElementById("themeToggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        document.body.classList.toggle("light");
        const icon = document.querySelector("#themeToggle i");
        icon.className = document.body.classList.contains("dark") ? "fas fa-sun" : "fas fa-moon";
    });
    
    loadStoredData();
    render();
</script>
</body>
</html>
