<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER ELITE V2 | Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #ff0044; --secondary: #00ff66; --bg: #050505; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; color: white; overflow-x: hidden; padding-top: 70px; }
        .font-crash { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; }
        
        /* Game Animations */
        @keyframes shake { 0% { transform: translate(1px, 1px); } 20% { transform: translate(-2px, 0); } 40% { transform: translate(2px, -1px); } 100% { transform: translate(0, 0); } }
        .crash-shake { animation: shake 0.2s infinite; }
        
        .nav-active { color: var(--primary) !important; border-bottom: 2px solid var(--primary); }
        .btn-grad { background: linear-gradient(135deg, #ff0044, #990022); transition: 0.3s; }
        .btn-grad:active { transform: scale(0.95); opacity: 0.8; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .chat-msg { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="fixed top-0 left-0 right-0 h-16 bg-black/80 backdrop-blur-xl border-b border-white/10 z-[1000] flex items-center justify-between px-4">
    <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-full btn-grad flex items-center justify-center font-bold text-xl" id="userIcon">N</div>
        <div>
            <p class="text-[10px] opacity-50 uppercase font-bold">Balance</p>
            <p class="text-secondary font-black text-lg leading-none" id="mainBal">0.00 ETB</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <select id="langSelect" class="bg-white/5 text-[10px] p-1 rounded border border-white/20">
            <option value="en">EN</option>
            <option value="am">አማ</option>
        </select>
        <button id="dailyBonus" class="text-yellow-400 animate-bounce"><i class="fas fa-gift text-xl"></i></button>
    </div>
</div>

<div class="fixed bottom-0 left-0 right-0 h-16 bg-black border-t border-white/10 z-[1000] flex justify-around items-center">
    <button onclick="showPage('game')" class="nav-btn nav-active flex flex-col items-center gap-1"><i class="fas fa-plane"></i><span class="text-[10px]">Play</span></button>
    <button onclick="showPage('chat')" class="nav-btn text-gray-500 flex flex-col items-center gap-1"><i class="fas fa-comments"></i><span class="text-[10px]">Chat</span></button>
    <button onclick="showPage('wallet')" class="nav-btn text-gray-500 flex flex-col items-center gap-1"><i class="fas fa-wallet"></i><span class="text-[10px]">Wallet</span></button>
    <button onclick="showPage('account')" class="nav-btn text-gray-500 flex flex-col items-center gap-1"><i class="fas fa-user-shield"></i><span class="text-[10px]">Admin</span></button>
</div>

<main class="p-4 pb-24">
    
    <section id="page-game" class="page active">
        <div id="historyList" class="flex gap-2 overflow-x-auto mb-4 no-scrollbar"></div>

        <div class="relative w-full h-64 bg-black rounded-[30px] border-2 border-white/5 overflow-hidden mb-6" id="gameArea">
            <div class="absolute top-4 right-4 z-10">
                <span class="text-[10px] bg-white/10 px-2 py-1 rounded-full text-white/50">#ProvablyFair: <span id="gameHash">8f2d...</span></span>
            </div>
            
            <svg class="w-full h-full">
                <path id="graphLine" d="M 0 250 Q 0 250 0 250" fill="none" stroke="#ff0044" stroke-width="4" />
            </svg>
            
            <div id="multiplier" class="absolute inset-0 flex items-center justify-center">
                <h1 class="font-crash text-7xl font-black text-white drop-shadow-[0_0_15px_rgba(255,0,68,0.5)]">1.00x</h1>
            </div>

            <div id="plane" class="absolute bottom-10 left-10 text-4xl transition-all duration-75">✈️</div>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <div class="glass p-4 relative overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-bold opacity-60">SINGLE BET</span>
                    <div class="flex gap-2">
                        <button class="text-[10px] bg-white/10 px-2 py-1 rounded" onclick="setBet(50)">50</button>
                        <button class="text-[10px] bg-white/10 px-2 py-1 rounded" onclick="setBet(100)">100</button>
                    </div>
                </div>
                <div class="flex gap-4">
                    <input type="number" id="betInput" value="10" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 font-bold text-xl outline-none focus:border-primary">
                    <button id="betBtn" onclick="handleMainAction()" class="btn-grad px-8 py-4 rounded-xl font-black text-xl min-w-[140px]">BET</button>
                </div>
            </div>
        </div>
    </section>

    <section id="page-chat" class="page hidden">
        <div class="glass h-[60vh] flex flex-col">
            <div class="p-3 border-b border-white/10 flex justify-between">
                <span class="font-bold">Global Chat</span>
                <span class="text-secondary text-xs">● 1,240 Online</span>
            </div>
            <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm">
                <div class="chat-msg"><b>Abebe:</b> ዛሬ እያዋጣ ነው! 🔥</div>
                <div class="chat-msg"><b>Lydia:</b> Just won 500 ETB! 🚀</div>
            </div>
            <div class="p-2 flex gap-2">
                <input type="text" id="chatInput" placeholder="Type a message..." class="flex-1 bg-white/5 rounded-full px-4 outline-none border border-white/10">
                <button onclick="sendChat()" class="w-10 h-10 btn-grad rounded-full"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </section>

    <section id="page-wallet" class="page hidden">
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="glass p-4 text-center border-b-4 border-primary">
                <p class="text-xs opacity-50">Deposits</p>
                <p class="font-black text-xl">12,400</p>
            </div>
            <div class="glass p-4 text-center border-b-4 border-secondary">
                <p class="text-xs opacity-50">Withdraws</p>
                <p class="font-black text-xl">8,200</p>
            </div>
        </div>
        <div class="glass p-5">
            <h3 class="font-bold mb-4">Add Funds</h3>
            <div class="space-y-3">
                <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/8/80/Commercial_Bank_of_Ethiopia_logo.png/220px-Commercial_Bank_of_Ethiopia_logo.png" class="w-8 h-8 rounded">
                        <div><p class="text-sm font-bold">CBE Bank</p><p class="text-[10px] opacity-50">10002345678</p></div>
                    </div>
                    <button class="text-primary"><i class="fas fa-copy"></i></button>
                </div>
                <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center font-bold italic">tb</div>
                        <div><p class="text-sm font-bold">Telebirr</p><p class="text-[10px] opacity-50">0912345678</p></div>
                    </div>
                    <button class="text-primary"><i class="fas fa-copy"></i></button>
                </div>
            </div>
            <button class="w-full btn-grad mt-6 py-4 rounded-2xl font-black">SUBMIT RECEIPT</button>
        </div>
    </section>

</main>

<script>
    // --- Configuration ---
    const tg = window.Telegram.WebApp;
    let balance = 500.00;
    let isPlaying = false;
    let currentMult = 1.00;
    let betAmount = 0;
    let gameInterval;
    const houseEdge = 0.20; // 20% House Profit

    // --- Core Functions ---
    function updateUI() {
        document.getElementById('mainBal').innerText = balance.toFixed(2) + ' ETB';
        document.getElementById('userIcon').innerText = tg.initDataUnsafe?.user?.first_name?.[0] || 'N';
    }

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById('page-' + pageId).classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
        event.currentTarget.classList.add('nav-active');
    }

    // --- Game Logic ---
    function handleMainAction() {
        const btn = document.getElementById('betBtn');
        if (!isPlaying && currentMult === 1.00) {
            // Start Bet
            betAmount = parseFloat(document.getElementById('betInput').value);
            if (betAmount > balance) return alert("Insufficient Balance!");
            
            balance -= betAmount;
            isPlaying = true;
            btn.innerText = "CASH OUT";
            btn.classList.replace('btn-grad', 'bg-orange-500');
            startFlight();
        } else if (isPlaying) {
            // Cash Out
            const win = betAmount * currentMult;
            balance += win;
            isPlaying = false;
            btn.innerText = "WON " + win.toFixed(0);
            btn.classList.replace('bg-orange-500', 'bg-green-500');
            setTimeout(() => { resetGame(); }, 2000);
        }
        updateUI();
    }

    function startFlight() {
        const plane = document.getElementById('plane');
        const multText = document.querySelector('#multiplier h1');
        const path = document.getElementById('graphLine');
        
        // Provably Fair Crash Point
        const crashPoint = Math.max(1.0, (Math.random() * (100 / (1 + houseEdge * 100)) * 1.5)).toFixed(2);
        console.log("Crash at:", crashPoint);

        gameInterval = setInterval(() => {
            currentMult += 0.01 + (currentMult * 0.002);
            multText.innerText = currentMult.toFixed(2) + 'x';
            
            // Animate Plane
            const x = (currentMult - 1) * 40;
            const y = (currentMult - 1) * 25;
            plane.style.transform = `translate(${x}px, -${y}px)`;
            path.setAttribute('d', `M 0 250 Q ${x/2} ${250-y} ${x} ${250-y}`);

            if (currentMult >= crashPoint) {
                crash();
            }
        }, 50);
    }

    function crash() {
        clearInterval(gameInterval);
        const btn = document.getElementById('betBtn');
        const area = document.getElementById('gameArea');
        
        area.classList.add('crash-shake');
        document.querySelector('#multiplier h1').classList.replace('text-white', 'text-primary');
        document.querySelector('#multiplier h1').innerText = "CRASHED";
        
        if (isPlaying) {
            isPlaying = false;
            btn.innerText = "LOST";
            btn.classList.replace('bg-orange-500', 'bg-red-600');
        }
        
        setTimeout(() => {
            area.classList.remove('crash-shake');
            resetGame();
        }, 3000);
    }

    function resetGame() {
        currentMult = 1.00;
        isPlaying = false;
        document.getElementById('betBtn').innerText = "BET";
        document.getElementById('betBtn').className = "btn-grad px-8 py-4 rounded-xl font-black text-xl min-w-[140px]";
        document.querySelector('#multiplier h1').className = "font-crash text-7xl font-black text-white";
        document.querySelector('#multiplier h1').innerText = "1.00x";
        document.getElementById('plane').style.transform = `translate(0, 0)`;
        document.getElementById('graphLine').setAttribute('d', `M 0 250 Q 0 250 0 250`);
    }

    // --- Extra Features ---
    document.getElementById('dailyBonus').onclick = () => {
        balance += 5;
        updateUI();
        alert("Daily Bonus: 5 ETB Added! 🎁");
        document.getElementById('dailyBonus').style.display = 'none';
    };

    function sendChat() {
        const input = document.getElementById('chatInput');
        if (!input.value) return;
        const msg = document.createElement('div');
        msg.className = "chat-msg";
        msg.innerHTML = `<b>You:</b> ${input.value}`;
        document.getElementById('chatBox').appendChild(msg);
        input.value = "";
    }

    // Init
    updateUI();
    tg.expand();
</script>

</body>
</html>
