<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldDating Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: white; overflow: hidden; }
        .app-container { width: 100vw; height: 100vh; position: relative; }
        .page { display: none; padding: 20px; height: 100%; overflow-y: auto; }
        .page.active { display: block; }
        .input-field { width: 100%; padding: 15px; border-radius: 12px; background: #1a1a1a; border: 1px solid #333; margin-bottom: 12px; color: white; }
        .btn-main { background: #8b5cf6; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; }
        .nav-bar { display: none; position: fixed; bottom: 0; width: 100%; background: #0a0a0a; border-top: 1px solid #222; justify-content: space-around; padding: 15px; }
        .nav-item { color: #666; cursor: pointer; }
        .nav-item.active { color: #8b5cf6; }
    </style>
</head>
<body>

<div class="app-container">

    <div id="login-page" class="page active pt-10">
        <h1 class="text-3xl font-bold text-center mb-8">Login</h1>
        <div id="login-error" class="text-red-500 text-sm mb-4 text-center hidden italic italic">Invalid Email or Password!</div>
        <input type="email" id="login-email" placeholder="Email" class="input-field">
        <input type="password" id="login-pass" placeholder="Password" class="input-field">
        <button onclick="processLogin()" class="btn-main mb-4">Login</button>
        <p class="text-center text-gray-500">Don't have an account? <span onclick="showPage('signup-page')" class="text-purple-400 cursor-pointer">Register</span></p>
    </div>

    <div id="signup-page" class="page pt-5">
        <h1 class="text-2xl font-bold mb-6">Create Account</h1>
        <input type="text" id="reg-name" placeholder="Full Name" class="input-field">
        <input type="email" id="reg-email" placeholder="Email" class="input-field">
        <input type="password" id="reg-pass" placeholder="Create Password" class="input-field">
        <select id="reg-gender" class="input-field">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <button onclick="processSignup()" class="btn-main">Create Account</button>
        <p onclick="showPage('login-page')" class="text-center mt-4 text-gray-500 cursor-pointer">Back to Login</p>
    </div>

    <div id="home-page" class="page pt-5">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Matches</h2>
            <i class="fas fa-cog text-gray-400"></i>
        </div>
        <div class="bg-gray-900 rounded-3xl h-[450px] flex flex-col justify-end p-6 border border-white/5">
            <h3 class="text-2xl font-bold">Welcome!</h3>
            <p class="text-gray-400">Successfully Logged in as <span id="user-display" class="text-purple-400"></span></p>
        </div>
    </div>

    <nav id="nav-bar" class="nav-bar">
        <div onclick="showPage('home-page')" class="nav-item active"><i class="fas fa-fire text-2xl"></i></div>
        <div class="nav-item"><i class="fas fa-comment text-2xl"></i></div>
        <div onclick="logout()" class="nav-item"><i class="fas fa-user text-2xl"></i></div>
    </nav>

</div>

<script>
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        // Error መልዕክት ካለ እንዲጠፋ
        document.getElementById('login-error').classList.add('hidden');
    }

    // ምዝገባን ማስቀመጥ (Sign Up)
    function processSignup() {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        const gender = document.getElementById('reg-gender').value;

        if(!name || !email || !pass) {
            alert("Please fill all fields!");
            return;
        }

        // መረጃውን በ Local Storage ሴቭ እናደርጋለን (ዳታቤዝ እስኪኖር)
        const userData = { name, email, pass, gender };
        localStorage.setItem(email, JSON.stringify(userData));

        alert("Registration Successful! Now Login.");
        showPage('login-page');
    }

    // መግቢያ ማጣሪያ (Login Validation)
    function processLogin() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;

        // መረጃውን ከ Local Storage እንፈልጋለን
        const savedData = localStorage.getItem(email);

        if (savedData) {
            const user = JSON.parse(savedData);
            
            // የይለፍ ቃል ማረጋገጥ
            if (user.pass === pass) {
                // መረጃው ልክ ከሆነ አፑን ክፈት
                document.getElementById('user-display').innerText = user.name;
                document.getElementById('nav-bar').style.display = 'flex';
                showPage('home-page');
            } else {
                // የይለፍ ቃል ከተሳሳተ
                document.getElementById('login-error').classList.remove('hidden');
            }
        } else {
            // ኢሜይሉ ካልተመዘገበ
            document.getElementById('login-error').classList.remove('hidden');
        }
    }

    function logout() {
        document.getElementById('nav-bar').style.display = 'none';
        showPage('login-page');
    }
</script>

</body>
</html>
