<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE AVIATOR V20 - PROFIT ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        :root { --primary: #ff0044; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .page { display: none; height: calc(100vh - 75px); overflow-y: auto; padding: 16px; }
        .active-page { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }
        .nav-bar { background: rgba(10, 10, 10, 0.95); position: fixed; bottom: 0; width: 100%; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 1000; }
        .nav-item { color: #444; font-size: 9px; font-weight: 900; text-align: center; }
        .nav-item.active { color: var(--primary); }
        .aviator-screen { background: radial-gradient(circle at bottom left, #1a0505 0%, #000 100%); height: 230px; position: relative; border-radius: 30px; overflow: hidden; border: 1px solid #222; }
        #gamePath { stroke: var(--primary); stroke-width: 6; fill: none; filter: drop-shadow(0 0 8px var(--primary)); }
        .plane-jet { position: absolute; bottom: 20px; left: 20px; font-size: 40px; z-index: 10; transition: 0.1s linear; }
    </style>
</head>
<body>

    <div id="adminPanel" class="fixed inset-0 bg-black z-[9999] hidden flex-col">
        <div class="p-5 glass flex justify-between items-center border-b border-white/5">
            <h2 class="text-red-600 font-black italic">V20 ADMIN PANEL</h2>
            <button onclick="closeAdmin()" class="bg-red-600/20 text-red-500 px-4 py-2 rounded-full text-[10px] font-black border border-red-500/30">EXIT</button>
        </div>
        <div id="admContent" class="p-4 flex-1 overflow-y-auto space-y-4"></div>
    </div>

    <header class="p-4 flex justify-between items-center glass sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div id="hPfp" class="w-10 h-10 rounded-xl bg-red-900/20 border border-white/5 flex items-center justify-center overflow-hidden"></div>
            <div>
                <h1 class="text-red-600 font-game italic text-lg leading-none">AVIATOR</h1>
                <p id="hUser" class="text-[9px] text-gray-500 font-black mt-1 uppercase tracking-widest">@Guest</p>
            </div>
        </div>
        <div class="flex flex-col items-end gap-1">
            <div class="bg-black/60 border border-white/10 rounded-full px-5 py-1.5 flex items-center gap-2">
                <span id="hBal" class="font-black text-sm text-green-500">500.00</span>
                <span class="text-[8px] text-gray-600 font-black">ETB</span>
            </div>
            <div id="profitTag" class="text-[7px] text-gray-700 font-black uppercase">Secure 40% Profit Active</div>
        </div>
    </header>

    <section id="home" class="page active-page">
        <div class="aviator-screen flex items-center justify-center">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 230 Q 0 230 0 230" /></svg>
            <div id="mTxt" class="font-game text-7xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane-jet">✈️</div>
            <div id="gStatus" class="absolute top-4 glass px-5 py-1 rounded-full text-[9px] font-black text-gray-400 uppercase tracking-widest">READY...</div>
        </div>

        <div class="mt-6 grid grid-cols-2 gap-4">
            <div class="glass p-5 rounded-[30px]">
                <p class="text-[8px] text-gray-600 font-black mb-1 uppercase italic">Stake Amount</p>
                <input id="bInp" type="number" value="10" class="w-full bg-transparent text-center font-black text-3xl outline-none text-white">
            </div>
            <button id="bBtn" onclick="handleBet()" class="bg-red-600 rounded-[30px] text-3xl font-black italic shadow-xl active:scale-95 transition-all">BET</button>
        </div>

        <div class="mt-4 glass p-4 rounded-2xl flex justify-between items-center border border-white/5">
            <span class="text-[9px] font-black text-gray-500 italic uppercase">Auto Cashout:</span>
            <input id="autoOut" type="number" step="0.1" placeholder="OFF" class="bg-white/5 border border-white/10 rounded-xl w-24 text-center font-black text-sm py-2">
        </div>

        <div class="mt-6 glass rounded-3xl p-5 h-40 overflow-hidden">
            <div class="flex justify-between text-[9px] font-black text-gray-600 border-b border-white/5 pb-2 mb-3">
                <span>PLAYER</span><span>BET</span><span>CASH OUT</span>
            </div>
            <div id="livePlayers" class="space-y-2 text-[11px] font-bold"></div>
        </div>
    </section>

    <section id="deposit" class="page">
        <div class="glass p-6 rounded-[35px] mb-6">
            <p class="text-[10px] text-yellow-500 font-black uppercase mb-3">Official Accounts</p>
            <div onclick="copyText('1000179571815')" class="flex justify-between items-center bg-black/40 p-4 rounded-2xl mb-3 border border-white/5 active:scale-95">
                <span class="font-black text-lg tracking-wider">1000179571815</span>
                <i class="fa-solid fa-copy text-yellow-500"></i>
            </div>
            <div onclick="copyText('0906067696')" class="flex justify-between items-center bg-black/40 p-4 rounded-2xl border border-white/5 active:scale-95">
                <span class="font-black text-lg tracking-wider">0906067696</span>
                <i class="fa-solid fa-copy text-blue-500"></i>
            </div>
        </div>

        <div class="glass p-7 rounded-[40px] text-center border-dashed border-2 border-gray-800">
            <p class="text-[11px] font-black text-gray-400 mb-5 uppercase italic">የከፈሉበትን ደረሰኝ (Screenshot) ይላኩ</p>
            <input type="file" id="ssInp" class="hidden" accept="image/*">
            <button onclick="document.getElementById('ssInp').click()" class="w-full bg-white/5 py-5 rounded-2xl text-[11px] font-black mb-5 border border-white/5"><i class="fa-solid fa-camera mr-2 text-red-600"></i> SELECT RECEIPT</button>
            <div id="previewBox" class="hidden mb-5"><img id="ssPreview" class="rounded-2xl max-h-52 mx-auto border border-gray-700 shadow-2xl"></div>
            <button onclick="submitReceipt()" class="w-full bg-red-600 py-5 rounded-3xl font-black text-sm uppercase shadow-2xl shadow-red-900/40">SUBMIT TO ADMIN</button>
        </div>
    </section>

    <section id="withdraw" class="page text-center">
        <i class="fa-solid fa-money-bill-transfer text-green-500 text-5xl mb-6 mt-10"></i>
        <h2 class="text-2xl font-black italic mb-6">WITHDRAWAL</h2>
        <div class="glass p-6 rounded-[35px] space-y-4">
            <input id="wAmt" type="number" placeholder="Amount (መጠን)" class="w-full bg-black/50 border border-white/10 p-4 rounded-2xl font-bold">
            <input id="wAcc" type="text" placeholder="Bank Account Number" class="w-full bg-black/50 border border-white/10 p-4 rounded-2xl font-bold">
            <button onclick="reqWithdraw()" class="w-full bg-green-600 py-5 rounded-3xl font-black text-sm uppercase shadow-xl">REQUEST CASH OUT</button>
        </div>
    </section>

    <section id="help" class="page">
        <div class="flex flex-col items-center mb-8">
            <div id="accPfp" class="w-24 h-24 rounded-[35px] bg-red-950/20 border-2 border-red-600/30 flex items-center justify-center overflow-hidden mb-4"></div>
            <h2 id="accUser" class="text-2xl font-black italic uppercase">@User</h2>
        </div>
        <div class="glass p-6 rounded-[35px] mb-6">
            <h3 class="text-xs font-black text-blue-500 mb-4 uppercase">Support Ticket</h3>
            <textarea id="supMsg" placeholder="መልዕክትዎን እዚህ ይፃፉ..." class="w-full bg-black/50 border border-white/10 p-5 rounded-2xl text-xs h-32 outline-none mb-4"></textarea>
            <button onclick="tg.showAlert('Support Ticket Sent!')" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-[10px] uppercase">SEND MESSAGE</button>
        </div>
        <button onclick="checkAdmin()" class="w-full py-4 text-[9px] font-black text-gray-800 uppercase tracking-[4px]">System Access</button>
    </section>

    <nav class="nav-bar">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-plane-up text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-2xl mb-1"></i><br>WALLET</div>
        <div onclick="showP('withdraw')" id="n-withdraw" class="nav-item"><i class="fa-solid fa-hand-holding-dollar text-2xl mb-1"></i><br>CASH OUT</div>
        <div onclick="showP('help')" id="n-help" class="nav-item"><i class="fa-solid fa-user-gear text-2xl mb-1"></i><br>ME</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const MY_ADMIN_UNAME = "Dawit_Fikadu21"; // የአንተ ዩዘርኔም
        let realBal = parseFloat(localStorage.getItem('v20_real_bal')) || 0;
        let isFlying = false; let mult = 1.00;
        let myBet = { active: false, amt: 0 };
        let userData = { uname: tg.initDataUnsafe?.user?.username || "Dai_User", photo: tg.initDataUnsafe?.user?.photo_url || null };

        // 40% PROFIT LOGIC VARIABLES
        let activePlayers = []; 
        const PROFIT_PERCENT = 0.40; // 40% ለካዚኖው

        function init() {
            document.getElementById('hUser').innerText = "@" + userData.uname;
            document.getElementById('accUser').innerText = "@" + userData.uname;
            const pfpHtml = userData.photo ? `<img src="${userData.photo}" class="w-full h-full object-cover">` : `<span class="text-2xl font-black text-red-500">${userData.uname[0]}</span>`;
            document.getElementById('hPfp').innerHTML = pfpHtml;
            document.getElementById('accPfp').innerHTML = pfpHtml;
            
            updateBal();
            startLoop();
            generateFakePlayers();

            document.getElementById('ssInp').onchange = (e) => {
                const r = new FileReader();
                r.onload = () => { document.getElementById('ssPreview').src = r.result; document.getElementById('previewBox').classList.remove('hidden'); };
                r.readAsDataURL(e.target.files[0]);
            };
        }

        function updateBal() {
            document.getElementById('hBal').innerText = realBal.toFixed(2);
        }

        // --- PROFIT ENGINE LOGIC (40% ትርፍ ማስጠበቂያ) ---
        function calculateCrashPoint() {
            // በጨዋታው ውስጥ ያሉትን ጠቅላላ ተጫዋቾች ድምር እንቆጥራለን
            let totalStaked = myBet.active ? myBet.amt : 0;
            activePlayers.forEach(p => totalStaked += p.bet);

            // ካዚኖው 40% እንዲያተርፍ፣ ተጫዋቾች መውሰድ የሚችሉት ከጠቅላላው 60% ብቻ ነው
            let maxPayable = totalStaked * (1 - PROFIT_PERCENT);
            
            // ሁሉም ሰው 1.5x ላይ ቢወጣ እንኳን ካዚኖው እንዳይከስር ቼክ እናደርጋለን
            // ይህ አልጎሪዝም በዘፈቀደ ቁጥር እና በገንዘብ ድምር መካከል ሚዛን ይጠብቃል
            let randomCrash = 1.01 + (Math.random() * 8); 
            
            // ገንዘብ ከበዛ አውሮፕላኑ ቶሎ እንዲፈነዳ እናደርጋለን
            if(totalStaked > 1000) {
                return Math.min(randomCrash, 1.20 + (Math.random() * 0.5));
            }
            return randomCrash;
        }

        function startLoop() {
            if(isFlying) return;
            let timer = 5;
            let wait = setInterval(() => {
                document.getElementById('gStatus').innerText = `TAKEOFF IN ${timer}S`;
                if(timer-- <= 0) { clearInterval(wait); launch(); }
            }, 1000);
        }

        function launch() {
            isFlying = true; mult = 1.00;
            let crashPoint = calculateCrashPoint(); // 40% ትርፍ የሚያስጠብቀው ነጥብ እዚህ ይሰላል
            let auto = parseFloat(document.getElementById('autoOut').value);
            
            let engine = setInterval(() => {
                mult += 0.06;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                
                let x = mult * 15, y = mult * 12;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 230 Q ${x/2} ${230-y} ${x+10} ${230-y-10}`);

                if(myBet.active && auto && mult >= auto) cashOut();

                if(mult >= crashPoint) { clearInterval(engine); explode(); }
            }, 100);
        }

        function explode() {
            isFlying = false;
            document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "#ff0044";
            myBet.active = false;
            resetBetBtn();
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 230 Q 0 230 0 230');
                document.getElementById('mTxt').style.color = "white";
                generateFakePlayers();
                startLoop();
            }, 3000);
        }

        function handleBet() {
            if(isFlying && myBet.active) return cashOut();
            let amt = parseInt(document.getElementById('bInp').value);
            if(amt > realBal || amt <= 0) return tg.showAlert("Insufficient Balance!");
            
            realBal -= amt;
            localStorage.setItem('v20_real_bal', realBal);
            myBet = { active: true, amt: amt };
            updateBal();
            
            document.getElementById('bBtn').innerText = "CASH OUT";
            document.getElementById('bBtn').className = "bg-orange-600 rounded-[30px] text-2xl font-black italic shadow-xl";
        }

        function cashOut() {
            if(!myBet.active || !isFlying) return;
            let win = myBet.amt * mult;
            realBal += win;
            localStorage.setItem('v20_real_bal', realBal);
            myBet.active = false;
            resetBetBtn();
            updateBal();
            tg.showAlert(`✅ WON: ${win.toFixed(2)} ETB`);
        }

        function resetBetBtn() {
            document.getElementById('bBtn').innerText = "BET";
            document.getElementById('bBtn').className = "bg-red-600 rounded-[30px] text-3xl font-black italic shadow-xl";
        }

        // --- DEPOSIT & PHOTO SUBMIT LOGIC ---
        function submitReceipt() {
            const file = document.getElementById('ssInp').files[0];
            if(!file) return tg.showAlert("እባክህ መጀመሪያ ፎቶ ምረጥ!");
            
            const reader = new FileReader();
            reader.onload = () => {
                let db = JSON.parse(localStorage.getItem('sys_v20_db')) || [];
                db.push({ 
                    type: 'DEPOSIT', 
                    user: userData.uname, 
                    img: reader.result, 
                    time: new Date().toLocaleString() 
                });
                localStorage.setItem('sys_v20_db', JSON.stringify(db));
                tg.showAlert("✅ ደረሰኙ ለአድሚን ተልኳል! ባላንሱ እስኪሞላ ድረስ ትንሽ ይጠብቁ።");
                document.getElementById('previewBox').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        // --- WITHDRAW LOGIC ---
        function reqWithdraw() {
            let a = parseFloat(document.getElementById('wAmt').value);
            let acc = document.getElementById('wAcc').value;
            if(!a || a < 100 || !acc) return tg.showAlert("Please enter valid amount (Min 100) and account.");
            if(a > realBal) return tg.showAlert("Insufficient balance.");

            realBal -= a;
            localStorage.setItem('v20_real_bal', realBal);
            updateBal();

            let db = JSON.parse(localStorage.getItem('sys_v20_db')) || [];
            db.push({ type: 'WITHDRAW', user: userData.uname, amt: a, acc: acc, time: new Date().toLocaleString() });
            localStorage.setItem('sys_v20_db', JSON.stringify(db));
            tg.showAlert("✅ Withdrawal Request Sent!");
        }

        // --- ADMIN PANEL LOGIC ---
        function checkAdmin() {
            if(userData.uname === MY_ADMIN_UNAME) {
                let pin = prompt("Enter Admin PIN:");
                if(pin === "215221") {
                    document.getElementById('adminPanel').style.display = 'flex';
                    loadAdminData();
                }
            }
        }
        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
        function loadAdminData() {
            const db = JSON.parse(localStorage.getItem('sys_v20_db')) || [];
            document.getElementById('admContent').innerHTML = db.map((item, i) => `
                <div class="glass p-5 rounded-3xl">
                    <p class="text-[10px] text-blue-500 font-black mb-2">${item.type} | @${item.user} | ${item.time}</p>
                    ${item.img ? `<img src="${item.img}" class="w-full rounded-2xl mb-4 border border-gray-800">` : `<p class="font-bold py-2 text-xl">💰 Amount: ${item.amt} ETB<br><span class="text-gray-500 text-xs">Acc: ${item.acc}</span></p>`}
                    <div class="flex gap-2">
                        <button onclick="approveItem(${i})" class="flex-1 bg-green-600 py-3 rounded-xl font-black text-[10px]">APPROVE ✅</button>
                        <button onclick="rejectItem(${i})" class="flex-1 bg-red-900 py-3 rounded-xl font-black text-[10px]">REJECT ❌</button>
                    </div>
                </div>`).join('') || '<p class="text-center text-gray-700 mt-10">No pending requests.</p>';
        }

        function approveItem(i) {
            let db = JSON.parse(localStorage.getItem('sys_v20_db'));
            if(db[i].type === 'DEPOSIT') {
                let amt = prompt("How much ETB to add for @" + db[i].user + "?");
                if(amt && db[i].user === userData.uname) { 
                    realBal += parseFloat(amt); 
                    localStorage.setItem('v20_real_bal', realBal); 
                    updateBal(); 
                }
            }
            db.splice(i, 1);
            localStorage.setItem('sys_v20_db', JSON.stringify(db));
            loadAdminData();
        }
        function rejectItem(i) {
            let db = JSON.parse(localStorage.getItem('sys_v20_db'));
            db.splice(i, 1);
            localStorage.setItem('sys_v20_db', JSON.stringify(db));
            loadAdminData();
        }

        // --- HELPERS ---
        function copyText(t) {
            const el = document.createElement('textarea'); el.value = t; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert("Copied: " + t);
        }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-' + id).classList.add('active');
        }

        function generateFakePlayers() {
            activePlayers = [];
            const list = document.getElementById('livePlayers');
            list.innerHTML = "";
            for(let i=0; i<6; i++) {
                let pBet = Math.floor(Math.random() * 200) + 20;
                activePlayers.push({ user: "User_"+Math.floor(Math.random()*999), bet: pBet });
                list.innerHTML += `<div class="flex justify-between items-center text-gray-500 italic"><span>@Player_${i}</span><span>${pBet}</span><span class="text-green-500 font-black">Waiting...</span></div>`;
            }
        }

        init();
    </script>
</body>
</html>
