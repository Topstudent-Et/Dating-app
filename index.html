<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Betting App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{
  --primary:#22c55e;
  --bg:#020617;
  --card:#0f172a;
  --card2:#1e293b;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(180deg,#020617,#0f172a);
  color:white;
}

.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.balance{
  background:var(--card2);
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
}

.container{padding:15px}

.card{
  background:linear-gradient(145deg,var(--card2),var(--card));
  padding:15px;
  border-radius:15px;
  margin-bottom:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.5);
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#22c55e,#16a34a);
  color:white;
  margin-top:10px;
}

.input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:8px;
  background:#020617;
  color:white;
}

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#020617;
  padding:10px 0;
}

.nav div{font-size:12px;opacity:0.6}
.nav .active{color:var(--primary);opacity:1}

.hidden{display:none}
</style></head><body><div class="header">
  <b>🔥 Betting Pro</b>
  <div class="balance" id="balance">100 Birr</div>
</div><!-- HOME --><div class="container" id="home">
  <div class="card">
    <b>⚽ Arsenal vs Chelsea</b><br>
    Prediction: Over 2.5<br>
    Odds: 1.8
    <input class="input" id="stake" placeholder="Enter stake">
    <button class="btn" onclick="bet()">Place Bet</button>
  </div>
</div><!-- WALLET --><div class="container hidden" id="wallet">
  <div class="card">
    <b>💰 Deposit</b>
    <input class="input" id="deposit" placeholder="Amount">
    <button class="btn" onclick="deposit()">Add Balance</button>
  </div>
</div><!-- VIP --><div class="container hidden" id="vip">
  <div class="card">
    <b>🔒 VIP Tips</b>
    <p>Premium predictions</p>
    <button class="btn">Buy VIP - 100 Birr</button>
  </div>
</div><!-- PROFILE --><div class="container hidden" id="profile">
  <div class="card">
    <b>👤 Profile</b>
    <p id="user">User</p>
    <p id="bets">Bets: 0</p>
  </div>
</div><!-- REFERRAL --><div class="container hidden" id="ref">
  <div class="card">
    <b>🎁 Referral</b>
    <p>Invite friends & earn</p>
    <button class="btn">Copy Link</button>
  </div>
</div><!-- NAV --><div class="nav">
  <div class="active" onclick="show('home',this)">🏠</div>
  <div onclick="show('wallet',this)">💰</div>
  <div onclick="show('vip',this)">🔥</div>
  <div onclick="show('ref',this)">🎁</div>
  <div onclick="show('profile',this)">👤</div>
</div><audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
let balance = 100;
let bets = 0;

const tg = window.Telegram.WebApp;
tg.expand();

if(tg.initDataUnsafe?.user){
  document.getElementById('user').innerText = tg.initDataUnsafe.user.first_name;
}

function show(id,el){
  document.querySelectorAll('.container').forEach(c=>c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.nav div').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
}

function bet(){
  let stake = parseFloat(document.getElementById('stake').value);
  if(!stake || stake>balance) return alert('Invalid amount');

  balance -= stake;
  bets++;
  let win = stake * 1.8;

  document.getElementById('balance').innerText = balance + ' Birr';
  document.getElementById('bets').innerText = 'Bets: ' + bets;

  document.getElementById('sound').play();

  setTimeout(()=>{
    balance += win;
    document.getElementById('balance').innerText = balance + ' Birr';
    alert('You won ' + win + ' Birr');
  },2000);
}

function deposit(){
  let amount = parseFloat(document.getElementById('deposit').value);
  if(!amount) return;
  balance += amount;
  document.getElementById('balance').innerText = balance + ' Birr';
}
</script></body>
</html>
