<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAI AVIATOR PRO - ADMIN CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;900&display=swap');
        body { background-color: #0b0e11; color: white; font-family: 'Roboto', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .aviator-screen { 
            background: radial-gradient(circle at bottom left, #0f172a 0%, #000 100%);
            height: 300px; position: relative; border-radius: 20px; overflow: hidden; border: 1px solid #1e293b;
        }
        #gamePath { stroke: #ef4444; stroke-width: 6; fill: none; filter: drop-shadow(0 0 12px #ff0000); }
        .plane-emoji { position: absolute; bottom: 15px; left: 15px; font-size: 50px; z-index: 100; transition: transform 0.1s linear; }
        .multiplier-display { font-size: 4.5rem; font-weight: 900; z-index: 200; position: relative; text-shadow: 0 0 30px rgba(255, 255, 255, 0.4); }
        .nav-bar { background: #1c2127; position: fixed; bottom: 0; width: 100%; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: #ef4444; }
        .page { display: none; height: calc(100vh - 65px); overflow-y: auto; padding-bottom: 80px; }
        .active-page { display: block; }
        .btn-bet { background: #22c55e; border-radius: 15px; font-weight: 800; }
        .btn-cashout { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .pfp-img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #ef4444; }
    </style>
</head>
<body>

    <div class="p-3 flex justify-between items-center bg-[#1c2127] border-b border-gray-800 sticky top-0 z-[500]">
        <div class="flex items-center gap-3">
            <div id="headerPfp"></div>
            <div class="flex flex-col">
                <span class="text-red-600 font-black italic text-xl">Aviator</span>
                <span id="tgName" class="text-[9px] text-gray-500 font-bold uppercase">@Guest</span>
            </div>
        </div>
        <div class="bg-black px-4 py-1.5 rounded-full border border-green-900">
            <span id="balDisplay" class="text-green-500 font-bold text-sm">0.00</span> <span class="text-[10px] text-gray-500">ETB</span>
        </div>
    </div>

    <section id="home" class="page active-page p-3">
        <div id="historyBar" class="flex gap-2 mb-2 overflow-x-auto no-scrollbar py-1"></div>
        <div class="aviator-screen flex items-center justify-center">
            <svg id="gameArea" width="100%" height="100%" style="position:absolute; top:0; left:0;"><path id="gamePath" d="M 0 300 Q 0 300 0 300" /></svg>
            <div id="multiText" class="multiplier-display font-game">1.00x</div>
            <div id="plane" class="plane-emoji">✈️</div>
            <div id="statusMsg" class="absolute top-2 text-[10px] text-gray-400 font-bold">READY TO FLY</div>
        </div>
        <div class="mt-4 bg-[#1c2127] p-4 rounded-2xl border border-gray-800 shadow-2xl">
            <div class="flex gap-3">
                <div class="w-1/3 space-y-2">
                    <div class="bg-black flex items-center justify-between p-2 rounded-xl border border-gray-700">
                        <button onclick="adjBet(-10)" class="text-gray-400 font-bold px-2">−</button>
                        <input id="betInput" type="number" value="10" class="bg-transparent text-center w-full font-bold outline-none text-sm">
                        <button onclick="adjBet(10)" class="text-gray-400 font-bold px-2">+</button>
                    </div>
                    <button onclick="setBet(100)" class="w-full bg-gray-800 text-[10px] py-2 rounded-lg font-bold uppercase">MAX BET</button>
                </div>
                <button id="mainBetBtn" onclick="onBetClick()" class="btn-bet flex-1 text-xl shadow-lg">BET<br><span id="betLabel" class="text-xs font-normal">10.00 ETB</span></button>
            </div>
        </div>
    </section>

    <section id="wallet" class="page p-5">
        <h2 class="text-2xl font-black mb-6">Deposit Money</h2>
        <div class="bg-blue-900/20 p-5 rounded-2xl border border-blue-800 mb-4">
            <p class="text-sm text-gray-300 mb-2">1. Send money via Telebirr or CBE.</p>
            <p class="text-sm text-gray-300 mb-4">2. Click 'Verify' and wait for Admin to approve.</p>
            <button onclick="tg.showAlert('Verification request sent to Admin!')" class="w-full bg-blue-600 py-3 rounded-xl font-bold">VERIFY DEPOSIT</button>
        </div>
        <p class="text-[10px] text-gray-500 text-center uppercase tracking-widest">Admin will credit your account after manual check</p>
    </section>

    <section id="profile" class="page p-5">
        <div class="bg-[#1c2127] p-8 rounded-3xl text-center border border-gray-800 shadow-xl">
            <div id="largePfp" class="mx-auto mb-4"></div>
            <h3 id="profName" class="font-bold text-xl">@User</h3>
            <div class="mt-6 grid grid-cols-2 gap-4">
                <div class="bg-black p-4 rounded-2xl border border-gray-800"><p class="text-xs text-gray-500">Wins</p><p id="totalWins" class="text-green-500 font-black">0.00</p></div>
                <div class="bg-black p-4 rounded-2xl border border-gray-800"><p class="text-xs text-gray-500">Status</p><p class="text-blue-500 font-black">Verified</p></div>
            </div>
        </div>
    </section>

    <div class="nav-bar">
        <div onclick="showPage('home')" class="nav-item active" id="nav-home"><i class="fa-solid fa-gamepad text-lg mb-1"></i><span>Game</span></div>
        <div onclick="showPage('wallet')" class="nav-item" id="nav-wallet"><i class="fa-solid fa-plus-circle text-lg mb-1"></i><span>Deposit</span></div>
        <div onclick="showPage('profile')" class="nav-item" id="nav-profile"><i class="fa-solid fa-circle-user text-lg mb-1"></i><span>Profile</span></div>
    </div>

    <audio id="sndFly" loop src="https://www.soundjay.com/transportation/sounds/propeller-plane-flying-1.mp3"></audio>
    <audio id="sndCrash" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>
    <audio id="sndEmpty" src="https://www.soundjay.com/misc/sounds/fail-trumpet-01.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 10 ETB Initial Bonus check
        let isFirstTime = localStorage.getItem('is_new_v2') === null;
        let balance = parseFloat(localStorage.getItem('dai_bal_v2'));
        
        if(isFirstTime) {
            balance = 10.00;
            localStorage.setItem('dai_bal_v2', balance);
            localStorage.setItem('is_new_v2', 'no');
            tg.showPopup({title: 'Welcome Gift', message: 'You received 10 ETB for your first game!'});
        }

        let userData = {
            name: tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "Guest",
            photo: tg.initDataUnsafe?.user?.photo_url || null
        };

        let isFlying = false;
        let multiplier = 1.00;
        let activeBet = { active: false, amt: 0 };
        let history = JSON.parse(localStorage.getItem('dai_hist_v2')) || ["1.20x", "5.40x", "1.02x"];

        function init() {
            document.getElementById('tgName').innerText = "@" + userData.name;
            document.getElementById('profName').innerText = "@" + userData.name;
            document.getElementById('balDisplay').innerText = balance.toFixed(2);
            
            // Photo logic
            const pfpHtml = userData.photo ? `<img src="${userData.photo}" class="pfp-img">` : `<div class="pfp-img bg-red-600 flex items-center justify-center font-bold text-sm">${userData.name[0]}</div>`;
            document.getElementById('headerPfp').innerHTML = pfpHtml;
            document.getElementById('largePfp').innerHTML = pfpHtml.replace('35px','80px').replace('text-sm','text-4xl');

            renderHistory();
            startEngine();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('nav-' + id).classList.add('active');
        }

        function adjBet(v) { let i = document.getElementById('betInput'); i.value = Math.max(1, parseInt(i.value) + v); updateL(); }
        function setBet(v) { document.getElementById('betInput').value = v; updateL(); }
        function updateL() { document.getElementById('betLabel').innerText = document.getElementById('betInput').value + ".00 ETB"; }

        function onBetClick() {
            let btn = document.getElementById('mainBetBtn');
            let amt = parseInt(document.getElementById('betInput').value);
            
            if(!isFlying && !activeBet.active) {
                if(balance <= 0) {
                    document.getElementById('sndEmpty').play();
                    return tg.showAlert("Your balance is 0! Please deposit to continue.");
                }
                if(amt > balance) return tg.showAlert("Insufficient Funds!");
                
                balance -= amt;
                activeBet = { active: true, amt: amt };
                btn.innerHTML = "WAITING...<br><span class='text-[10px] font-normal'>CANCEL</span>";
                btn.classList.replace('bg-[#22c55e]', 'bg-red-900');
                save();
            } else if (isFlying && activeBet.active) {
                let win = activeBet.amt * multiplier;
                balance += win;
                activeBet.active = false;
                tg.showAlert(`SUCCESS! You won ${win.toFixed(2)} ETB`);
                resetBetUI();
                save();
            }
        }

        function resetBetUI() {
            let b = document.getElementById('mainBetBtn');
            b.className = "btn-bet flex-1 text-xl bg-[#22c55e]";
            updateL();
            b.innerHTML = `BET<br><span class="text-xs font-normal">${document.getElementById('betInput').value}.00 ETB</span>`;
        }

        function save() {
            localStorage.setItem('dai_bal_v2', balance);
            document.getElementById('balDisplay').innerText = balance.toFixed(2);
        }

        function startEngine() {
            if(isFlying) return;
            let wait = 7;
            let t = setInterval(() => {
                document.getElementById('statusMsg').innerText = `NEXT FLIGHT IN ${wait}S`;
                document.getElementById('multiText').innerText = "1.00x";
                if(wait-- <= 0) { clearInterval(t); takeoff(); }
            }, 1000);
        }

        function takeoff() {
            isFlying = true; multiplier = 1.00;
            document.getElementById('sndFly').play();
            if(activeBet.active) {
                document.getElementById('mainBetBtn').classList.replace('bg-red-900', 'btn-cashout');
                document.getElementById('mainBetBtn').innerHTML = `CASH OUT<br><span>${(activeBet.amt * multiplier).toFixed(2)}</span>`;
            }

            // 40% Admin House Edge Logic
            let crashPoint = Math.random() < 0.4 ? (1 + Math.random() * 0.15) : (1.15 + Math.random() * 12);

            let engine = setInterval(() => {
                multiplier += 0.02;
                document.getElementById('multiText').innerText = multiplier.toFixed(2) + "x";
                
                let x = multiplier * 24; let y = multiplier * 20;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 300 Q ${x/2} ${300-y} ${x+15} ${300-y-15}`);

                if(activeBet.active) {
                    document.getElementById('mainBetBtn').querySelector('span').innerText = (activeBet.amt * multiplier).toFixed(2) + " ETB";
                }

                if(multiplier >= crashPoint) { clearInterval(engine); crash(); }
            }, 80);
        }

        function crash() {
            isFlying = false;
            document.getElementById('sndFly').pause(); document.getElementById('sndFly').currentTime = 0;
            document.getElementById('sndCrash').play();
            document.getElementById('multiText').innerText = "FLEW AWAY!";
            document.getElementById('multiText').style.color = "#ef4444";
            
            history.unshift(multiplier.toFixed(2) + "x");
            if(history.length > 10) history.pop();
            localStorage.setItem('dai_hist_v2', JSON.stringify(history));
            renderHistory();

            if(activeBet.active) { activeBet.active = false; resetBetUI(); }

            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 300 Q 0 300 0 300');
                document.getElementById('multiText').style.color = "white";
                startEngine();
            }, 3000);
        }

        function renderHistory() {
            document.getElementById('historyBar').innerHTML = history.map(v => `<span class="bg-gray-800 px-3 py-1 rounded-full text-[9px] font-bold ${parseFloat(v)>2?'text-purple-500':'text-blue-400'}">${v}</span>`).join('');
        }

        init();
    </script>
</body>
</html>
