<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER ULTIMATE V120</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800;900&display=swap');
        :root { --accent: #ff0044; --real-green: #00ff66; --gold: #ffd700; }
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass-ui { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; }
        
        /* Nav */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 80px; display: flex; justify-content: space-around; align-items: center; background: #050505; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { color: #444; font-size: 9px; font-weight: 900; text-align: center; }
        .nav-item.active { color: var(--accent); }

        .page { display: none; height: calc(100vh - 80px); overflow-y: auto; padding: 15px; margin-top: 85px; }
        .active-page { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Game Area */
        .game-canvas { background: radial-gradient(circle at center, #220505 0%, #000 100%); height: 240px; position: relative; border-radius: 35px; border: 1px solid #333; overflow: hidden; }
        #gamePath { stroke: var(--accent); stroke-width: 6; fill: none; filter: drop-shadow(0 0 15px var(--accent)); }
        
        .verify-badge { color: #38bdf8; font-size: 12px; margin-left: 4px; }
        .chip { background: #111; border: 1px solid #333; font-size: 10px; padding: 6px; border-radius: 10px; font-weight: 900; color: #777; transition: 0.2s; }
        .chip.active { background: var(--accent); color: white; border-color: white; }
        
        /* Animation Stickers */
        .winner-anim { animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <header class="fixed top-0 w-full z-50 bg-black/90 p-4 flex justify-between items-center border-b border-white/10">
        <div class="flex items-center gap-3">
            <div id="hPfp" class="w-10 h-10 bg-zinc-900 rounded-xl border border-white/10 overflow-hidden"></div>
            <div>
                <div class="flex items-center"><p id="hBal" class="text-green-400 font-black text-lg">0.00 ETB</p></div>
                <p id="modeTxt" class="text-[8px] text-zinc-500 font-bold tracking-widest uppercase">Real Mode</p>
            </div>
        </div>
        <div id="topMode" class="flex gap-1 p-1 bg-white/5 rounded-xl">
            <button onclick="setMode(false)" id="mReal" class="px-4 py-1.5 bg-green-600 text-black text-[10px] font-black rounded-lg transition-all">REAL</button>
            <button onclick="setMode(true)" id="mDemo" class="px-4 py-1.5 text-zinc-500 text-[10px] font-black rounded-lg">DEMO</button>
        </div>
    </header>

    <section id="home" class="page active-page">
        <div id="history" class="flex gap-2 overflow-x-auto mb-4 pb-2 scrollbar-hide"></div>

        <div class="game-canvas flex items-center justify-center mb-6">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 240 Q 0 240 0 240" /></svg>
            <div id="mTxt" class="font-game text-7xl italic text-white z-20">1.00x</div>
            <div id="plane" class="absolute bottom-6 left-6 text-5xl z-20" style="transform: rotate(-15deg);">✈️</div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="glass-ui p-4">
                <div class="grid grid-cols-5 gap-1 mb-2">
                    <button onclick="setB(1,10)" class="chip">10</button>
                    <button onclick="setB(1,50)" class="chip">50</button>
                    <button onclick="setB(1,100)" class="chip">100</button>
                    <button onclick="setB(1,500)" class="chip">500</button>
                    <button onclick="setB(1,1000)" class="chip">1K</button>
                </div>
                <div class="flex gap-1 mb-3 overflow-x-auto pb-1">
                    <button onclick="setA(1,2)" id="a1_2" class="chip">2x</button>
                    <button onclick="setA(1,4)" id="a1_4" class="chip">4x</button>
                    <button onclick="setA(1,10)" id="a1_10" class="chip">10x</button>
                    <button onclick="setA(1,20)" id="a1_20" class="chip">20x</button>
                    <button onclick="setA(1,50)" id="a1_50" class="chip">50x</button>
                </div>
                <input id="bInp1" type="number" value="10" class="w-full bg-black border border-white/10 p-3 rounded-xl mb-3 text-center font-black text-xl outline-none">
                <button id="bBtn1" onclick="handleBet(1)" class="w-full py-5 rounded-2xl font-black italic text-xl shadow-2xl active:scale-95 transition-all" style="background:var(--real-green); color:#000">BET</button>
            </div>
            <div class="glass-ui p-4">
                <div class="grid grid-cols-5 gap-1 mb-2">
                    <button onclick="setB(2,10)" class="chip">10</button>
                    <button onclick="setB(2,50)" class="chip">50</button>
                    <button onclick="setB(2,100)" class="chip">100</button>
                    <button onclick="setB(2,500)" class="chip">500</button>
                    <button onclick="setB(2,1000)" class="chip">1K</button>
                </div>
                <div class="flex gap-1 mb-3 overflow-x-auto pb-1">
                    <button onclick="setA(2,2)" id="a2_2" class="chip">2x</button>
                    <button onclick="setA(2,4)" id="a2_4" class="chip">4x</button>
                    <button onclick="setA(2,10)" id="a2_10" class="chip">10x</button>
                    <button onclick="setA(2,20)" id="a2_20" class="chip">20x</button>
                    <button onclick="setA(2,50)" id="a2_50" class="chip">50x</button>
                </div>
                <input id="bInp2" type="number" value="10" class="w-full bg-black border border-white/10 p-3 rounded-xl mb-3 text-center font-black text-xl outline-none">
                <button id="bBtn2" onclick="handleBet(2)" class="w-full py-5 rounded-2xl font-black italic text-xl shadow-2xl active:scale-95 transition-all" style="background:var(--real-green); color:#000">BET</button>
            </div>
        </div>

        <div class="mt-8 mb-24 space-y-2" id="liveFeed"></div>
    </section>

    <section id="deposit" class="page">
        <div class="glass-ui p-6 mb-4">
            <p class="text-[10px] text-zinc-500 font-black mb-4 uppercase">CBE Account</p>
            <div onclick="copyT('1000179571815')" class="bg-black p-5 rounded-xl border border-white/5 flex justify-between items-center">
                <p class="font-game text-lg tracking-widest">1000179571815</p><i class="fa-solid fa-copy text-zinc-600"></i>
            </div>
        </div>
        <div class="glass-ui p-6">
            <input type="text" id="dFull" placeholder="Full Name" class="w-full bg-black border border-white/10 p-4 rounded-xl mb-3 outline-none font-bold">
            <input type="text" id="dFT" placeholder="FT Number" class="w-full bg-black border border-white/10 p-4 rounded-xl mb-3 outline-none font-bold">
            <input type="number" id="dAmt" placeholder="Amount (ETB)" class="w-full bg-black border border-white/10 p-4 rounded-xl mb-6 outline-none font-bold">
            <button onclick="submitDep()" class="w-full py-5 bg-red-600 rounded-2xl font-black tracking-widest shadow-xl">SUBMIT DEPOSIT</button>
        </div>
    </section>

    <section id="withdraw" class="page">
        <div class="glass-ui p-6">
            <h2 class="font-black mb-6 italic text-xl">WITHDRAW FUNDS</h2>
            <input type="text" id="wAcc" placeholder="CBE Account Number" class="w-full bg-black border border-white/10 p-4 rounded-xl mb-3 outline-none font-bold">
            <input type="number" id="wAmt" placeholder="Withdraw Amount (ETB)" class="w-full bg-black border border-white/10 p-4 rounded-xl mb-6 outline-none font-bold text-lg">
            <button onclick="submitWit()" class="w-full py-5 bg-green-600 text-black rounded-2xl font-black tracking-widest shadow-xl">REQUEST CASH OUT</button>
            <p class="text-[9px] text-zinc-500 mt-4 text-center">Note: 20% system fee applies to all matches.</p>
        </div>
    </section>

    <section id="top" class="page">
        <div class="flex justify-center items-end gap-3 mb-12 h-64">
            <div class="glass-ui w-24 h-40 order-1 flex flex-col items-center justify-center border-zinc-500">🥈<p class="text-[10px] font-black mt-2">Bini_Boy</p><p class="text-[8px] text-green-500">82K</p></div>
            <div class="glass-ui w-32 h-56 border-2 border-yellow-500 order-2 flex flex-col items-center justify-center winner-anim">👑<p class="text-xs font-black mt-3">DAI_FIKADU <i class="fa-solid fa-circle-check verify-badge"></i></p><p class="text-[10px] text-yellow-500 font-bold tracking-tighter">195,400 ETB</p></div>
            <div class="glass-ui w-24 h-36 order-3 flex flex-col items-center justify-center border-orange-800">🥉<p class="text-[10px] font-black mt-2">Sami_Pro</p><p class="text-[8px] text-green-500">45K</p></div>
        </div>
        <div id="tList" class="space-y-3 pb-10"></div>
    </section>

    <section id="admin" class="page">
        <div class="text-center mb-8">
            <div id="pfpB" class="w-28 h-28 mx-auto mb-4 border-2 border-red-600 rounded-3xl flex items-center justify-center text-5xl bg-zinc-900 shadow-2xl"></div>
            <h2 id="uName" class="text-2xl font-black italic">@User <i class="fa-solid fa-circle-check verify-badge"></i></h2>
            <p id="pBal" class="text-green-400 font-black text-3xl">0.00 ETB</p>
        </div>

        <div id="admBox" class="hidden space-y-4 px-2">
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-ui p-6 border-l-4 border-blue-500"><p class="text-[9px] text-zinc-500 font-black mb-1">TOTAL REVENUE</p><p id="adTotal" class="text-2xl font-game">0</p></div>
                <div class="glass-ui p-6 border-l-4 border-yellow-500"><p class="text-[9px] text-zinc-500 font-black mb-1">ADMIN 20% NET</p><p id="adProfit" class="text-2xl font-game text-yellow-500">0</p></div>
            </div>
            <button onclick="withdrawAdminProfit()" class="w-full py-4 bg-yellow-500 text-black rounded-xl font-black text-[10px] mb-4">WITHDRAW ADMIN PROFIT</button>
            <button onclick="oMod('dep')" class="w-full py-5 bg-red-600 rounded-2xl font-black italic shadow-xl">DEPOSIT REQUESTS</button>
            <button onclick="oMod('wit')" class="w-full py-5 bg-zinc-800 rounded-2xl font-black italic shadow-xl">WITHDRAW REQUESTS</button>
        </div>
    </section>

    <nav class="nav-bar">
        <div onclick="shP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-plane-up text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="shP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-plus text-2xl mb-1"></i><br>DEPOSIT</div>
        <div onclick="shP('withdraw')" id="n-withdraw" class="nav-item"><i class="fa-solid fa-money-bill-transfer text-2xl mb-1"></i><br>WITHDRAW</div>
        <div onclick="shP('top')" id="n-top" class="nav-item"><i class="fa-solid fa-crown text-2xl mb-1"></i><br>RANK</div>
        <div onclick="shP('admin')" id="n-admin" class="nav-item"><i class="fa-solid fa-user-shield text-2xl mb-1"></i><br>ADMIN</div>
    </nav>

    <div id="admMod" class="fixed inset-0 bg-black z-[2000] hidden flex flex-col p-6">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10"><h2 id="modTitle" class="font-black text-red-500 uppercase tracking-widest"></h2><button onclick="cMod()" class="bg-zinc-800 px-5 py-2 rounded-xl font-black text-[10px]">CLOSE</button></div>
        <div id="admList" class="space-y-4 overflow-y-auto"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADM = "Dawit_Fikadu21";
        let isD = false; let isF = false; let mult = 1.0;
        let rBal = parseFloat(localStorage.getItem('v120_r')) || 0;
        let dBal = parseFloat(localStorage.getItem('v120_d')) || 500; // Demo 500 Gift
        let bts = { 1: { a: false, amt: 0, au: 0 }, 2: { a: false, amt: 0, au: 0 } };
        let stats = JSON.parse(localStorage.getItem('v120_st')) || { total: 0, profit: 0 };

        function init() {
            const u = tg.initDataUnsafe?.user;
            const un = u?.username || "Guest";
            document.getElementById('uName').innerText = "@" + un;
            document.getElementById('hPfp').innerHTML = u?.photo_url ? `<img src="${u.photo_url}" class="w-full h-full object-cover">` : `<span class="p-2 font-black">${un[0]}</span>`;
            document.getElementById('pfpB').innerHTML = u?.photo_url ? `<img src="${u.photo_url}" class="w-full h-full object-cover">` : `<span class="p-2 font-black">${un[0]}</span>`;
            if(un === ADM) document.getElementById('admBox').classList.remove('hidden');
            upUI(); gameLoop(); loadTop();
            if(dBal === 500 && rBal === 0) tg.showAlert("🎁 Welcome! You got 500 ETB for Demo Play.");
        }

        function gameLoop() {
            if(isF) return;
            let timer = 5;
            let t = setInterval(() => {
                timer--;
                if(timer <= 0) { clearInterval(t); start(); }
                genFeed();
            }, 1000);
        }

        function start() {
            isF = true; mult = 1.0;
            let pool = 0; if(!isD) { if(bts[1].a) pool += bts[1].amt; if(bts[2].a) pool += bts[2].amt; }
            let crash = 1.1 + (Math.random() * 8.0);
            
            // 20% Profit Secure Logic
            if(pool > 0) {
                crash = 1.1 + (Math.random() * 0.3);
                stats.total += pool; stats.profit += (pool * 0.2);
                localStorage.setItem('v120_st', JSON.stringify(stats));
                updateAdminUI();
            }

            let eng = setInterval(() => {
                mult += 0.05;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 20, y = mult * 18;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px) rotate(-15deg)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 240 Q ${x/2} ${240-y} ${x+20} ${240-y-20}`);
                
                [1,2].forEach(i => { if(bts[i].a && bts[i].au > 0 && mult >= bts[i].au) handleBet(i); });
                if(mult >= crash) { clearInterval(eng); boom(crash); }
            }, 80);
        }

        function boom(c) {
            isF = false; document.getElementById('mTxt').innerText = "CRASHED!";
            document.getElementById('mTxt').style.color = "var(--accent)";
            addHistory(c.toFixed(2));
            bts[1].a = bts[2].a = false; resetBtns();
            if(!isD && rBal <= 0) tg.showAlert("Real balance empty! Switch to Demo or Deposit.");
            if(isD && dBal <= 0) tg.showAlert("Demo empty! Ready for Real game?");
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0) rotate(-15deg)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 240 Q 0 240 0 240');
                document.getElementById('mTxt').style.color = "white";
                gameLoop();
            }, 4000);
        }

        function handleBet(id) {
            if(isF) {
                if(bts[id].a) {
                    let w = bts[id].amt * mult;
                    if(isD) { dBal += w; localStorage.setItem('v120_d', dBal); } 
                    else { rBal += w; localStorage.setItem('v120_r', rBal); }
                    addWinFeed(tg.initDataUnsafe?.user?.username || "You", w.toFixed(0));
                    bts[id].a = false; resetBtns(); upUI();
                    tg.showAlert(`🚀 WON: ${w.toFixed(0)} ETB`);
                }
                return;
            }
            let amt = parseInt(document.getElementById('bInp'+id).value);
            let bal = isD ? dBal : rBal;
            if(amt > bal || amt <= 0) return tg.showAlert("Low Balance!");
            if(isD) { dBal -= amt; localStorage.setItem('v120_d', dBal); }
            else { rBal -= amt; localStorage.setItem('v120_r', rBal); }
            bts[id].a = true; bts[id].amt = amt;
            upUI();
            document.getElementById('bBtn'+id).innerText = "CASH OUT";
            document.getElementById('bBtn'+id).style.background = "#ea580c";
        }

        function setMode(d) {
            isD = d;
            document.getElementById('mDemo').className = d ? "px-4 py-1.5 bg-red-600 text-white text-[10px] font-black rounded-lg" : "px-4 py-1.5 text-zinc-500 text-[10px] font-black rounded-lg";
            document.getElementById('mReal').className = !d ? "px-4 py-1.5 bg-green-600 text-black text-[10px] font-black rounded-lg" : "px-4 py-1.5 text-zinc-500 text-[10px] font-black rounded-lg";
            document.getElementById('modeTxt').innerText = d ? "Demo Mode (Gifted)" : "Real Mode";
            upUI();
        }

        function upUI() {
            let v = (isD ? dBal : rBal).toFixed(2);
            document.getElementById('hBal').innerText = v + " ETB";
            document.getElementById('pBal').innerText = v + " ETB";
        }

        function updateAdminUI() {
            if(document.getElementById('adTotal')) {
                document.getElementById('adTotal').innerText = stats.total.toFixed(0);
                document.getElementById('adProfit').innerText = stats.profit.toFixed(0);
            }
        }

        function withdrawAdminProfit() {
            tg.showConfirm(`Withdraw ${stats.profit.toFixed(0)} ETB from admin profit?`, (ok) => {
                if(ok) { stats.profit = 0; localStorage.setItem('v120_st', JSON.stringify(stats)); updateAdminUI(); }
            });
        }

        function shP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-'+id).classList.add('active');
        }

        function setB(id, v) { document.getElementById('bInp'+id).value = v; }
        function setA(id, v) { bts[id].au = v; tg.showAlert(`Auto Cashout: ${v}x`); }
        function resetBtns() { [1,2].forEach(i => { document.getElementById('bBtn'+i).innerText = "BET"; document.getElementById('bBtn'+i).style.background = "var(--real-green)"; }); }

        function addHistory(c) {
            const h = document.getElementById('history');
            const item = document.createElement('div');
            item.className = `px-3 py-1 rounded-full text-[10px] font-black ${c > 2 ? 'bg-purple-600' : 'bg-zinc-800'}`;
            item.innerText = c + "x";
            h.prepend(item); if(h.children.length > 10) h.removeChild(h.lastChild);
        }

        function submitDep() {
            const n = document.getElementById('dFull').value, ft = document.getElementById('dFT').value, a = document.getElementById('dAmt').value;
            if(!n || !ft || !a) return tg.showAlert("Fill all!");
            let db = JSON.parse(localStorage.getItem('v120_db')) || [];
            db.push({ u: tg.initDataUnsafe?.user?.username || "Guest", n, ft, a: parseFloat(a), t: "DEP" });
            localStorage.setItem('v120_db', JSON.stringify(db));
            tg.showAlert("Sent to admin!");
        }

        function submitWit() {
            const acc = document.getElementById('wAcc').value, amt = document.getElementById('wAmt').value;
            if(!acc || !amt) return tg.showAlert("Fill all!");
            if(parseFloat(amt) > rBal) return tg.showAlert("Insufficient Real Balance!");
            let db = JSON.parse(localStorage.getItem('v120_db')) || [];
            db.push({ u: tg.initDataUnsafe?.user?.username || "Guest", acc, a: parseFloat(amt), t: "WIT" });
            localStorage.setItem('v120_db', JSON.stringify(db));
            rBal -= parseFloat(amt); localStorage.setItem('v120_r', rBal); upUI();
            tg.showAlert("Withdrawal requested!");
        }

        function oMod(type) {
            document.getElementById('admMod').classList.remove('hidden');
            document.getElementById('modTitle').innerText = type === 'dep' ? "Deposits" : "Withdrawals";
            lMod(type);
        }
        function cMod() { document.getElementById('admMod').classList.add('hidden'); }
        function lMod(type) {
            const db = JSON.parse(localStorage.getItem('v120_db')) || [];
            const filtered = db.filter(i => i.t === (type === 'dep' ? 'DEP' : 'WIT'));
            document.getElementById('admList').innerHTML = filtered.map((it, i) => `
                <div class="glass-ui p-5">
                    <p class="text-[10px] text-zinc-500 font-bold">@${it.u}</p>
                    <p class="text-xl font-black text-green-500 my-1">${it.a} ETB</p>
                    <p class="text-[10px] opacity-60 mb-3">${type === 'dep' ? 'FT: '+it.ft : 'Acc: '+it.acc}</p>
                    <div class="flex gap-2">
                        <button onclick="approveMod('${it.u}', ${it.a}, '${type}', ${i})" class="flex-1 bg-green-600 py-3 rounded-xl font-black text-[10px]">APPROVE</button>
                        <button onclick="rejectMod(${i})" class="flex-1 bg-red-600 py-3 rounded-xl font-black text-[10px]">REJECT</button>
                    </div>
                </div>
            `).join('') || "<p class='text-center opacity-20 mt-10'>Empty</p>";
        }

        function approveMod(un, amt, type, idx) {
            let db = JSON.parse(localStorage.getItem('v120_db'));
            if(type === 'dep' && un === (tg.initDataUnsafe?.user?.username || "Guest")) { rBal += amt; localStorage.setItem('v120_r', rBal); upUI(); }
            db.splice(idx, 1); localStorage.setItem('v120_db', JSON.stringify(db)); lMod(type);
        }
        function rejectMod(idx) {
            let db = JSON.parse(localStorage.getItem('v120_db'));
            db.splice(idx, 1); localStorage.setItem('v120_db', JSON.stringify(db)); cMod();
        }

        function addWinFeed(un, amt) {
            const f = document.getElementById('liveFeed');
            const row = document.createElement('div');
            row.className = "flex justify-between p-3 bg-white/5 border-l-4 border-green-500 rounded-xl mb-1";
            row.innerHTML = `<span class="text-[10px] font-black">🌟 @${un}</span><span class="text-green-500 text-[10px] font-black">+${amt} ETB</span>`;
            f.prepend(row); if(f.children.length > 5) f.removeChild(f.lastChild);
        }

        function genFeed() {
            const n = ["Kaleb_M","Hana_E","Muller_T","Bini_W","Sami_A"];
            if(Math.random() > 0.8) addWinFeed(n[Math.floor(Math.random()*n.length)], (Math.random()*2000).toFixed(0));
        }

        function loadTop() {
            const l = document.getElementById('tList');
            for(let i=1; i<=20; i++) {
                l.innerHTML += `<div class="glass-ui p-4 flex justify-between items-center"><span class="text-xs font-black uppercase">💎 Player_${i} <i class="fa-solid fa-circle-check verify-badge"></i></span><span class="text-green-500 font-black">${(Math.random()*30000+1000).toFixed(0)} ETB</span></div>`;
            }
        }
        function copyT(t) { navigator.clipboard.writeText(t); tg.showAlert("Copied!"); }

        init();
    </script>
</body>
</html>
