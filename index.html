<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World All Games - Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #ffcc00; --bg: #0b0b0d; --card: #16171b; --red: #ff003c; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #16171b; border-bottom: 1px solid #333; }
        .balance-box { background: #1c1d22; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; }

        .content { padding: 15px; height: calc(100vh - 140px); overflow-y: auto; }
        .page { display: none; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Aviator Animation */
        .aviator-env { height: 200px; background: #050505; position: relative; overflow: hidden; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 30px; color: var(--red); transition: all 0.1s linear; z-index: 10; }
        .line-canvas { position: absolute; bottom: 35px; left: 35px; width: 0; height: 0; border-left: 2px solid var(--red); border-bottom: 2px solid var(--red); transform-origin: bottom left; }

        /* Bingo Styles */
        .scratch-card { width: 200px; height: 100px; background: #444; margin: 20px auto; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; position: relative; overflow: hidden; }
        .scratch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(45deg, #888, #555); transition: 0.5s; }
        .scratched .scratch-overlay { transform: translateY(-100%); }

        /* Forms */
        .form-group { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .btn-gold { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }

        .nav { position: fixed; bottom: 0; width: 100%; background: #16171b; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav-item { color: #777; font-size: 12px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div id="av" style="width: 35px; height: 35px; background: var(--gold); border-radius: 50%; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold;">U</div>
            <div id="u_name" style="font-size: 14px; font-weight: bold;">Player</div>
        </div>
        <div class="balance-box"><span id="bal">0.00</span> ETB</div>
    </div>

    <div class="content">
        <div id="home" class="page active">
            <h3>Top Games</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div style="background: var(--card); padding: 20px; border-radius: 15px; text-align: center;" onclick="showPage('aviator')">
                    <i class="fas fa-plane" style="font-size: 40px; color: var(--red);"></i>
                    <h4>AVIATOR</h4>
                </div>
                <div style="background: var(--card); padding: 20px; border-radius: 15px; text-align: center;" onclick="showPage('bingo')">
                    <i class="fas fa-dice" style="font-size: 40px; color: #8a2be2;"></i>
                    <h4>BINGO</h4>
                </div>
            </div>
        </div>

        <div id="aviator" class="page">
            <h4 onclick="showPage('home')"><i class="fas fa-arrow-left"></i> Back</h4>
            <div class="aviator-env">
                <div id="plane" class="plane"><i class="fas fa-plane"></i></div>
                <div id="mult" style="position: absolute; width: 100%; text-align: center; top: 40%; font-size: 40px; font-weight: bold;">1.00x</div>
            </div>
            <input type="number" id="aviBet" placeholder="Bet Amount">
            <button class="btn-gold" id="aviBtn" onclick="startAviator()">BET</button>
        </div>

        <div id="bingo" class="page">
            <h4 onclick="showPage('home')"><i class="fas fa-arrow-left"></i> Back</h4>
            <div id="bingoCard" class="scratch-card">
                <div class="scratch-overlay"></div>
                <div id="bingoRes" style="font-size: 24px; font-weight: bold;">?</div>
            </div>
            <input type="number" id="bingoBet" placeholder="Bet Amount">
            <button class="btn-gold" onclick="playBingo()">SCRATCH & PLAY</button>
        </div>

        <div id="deposit" class="page">
            <h3>Deposit Money</h3>
            <div class="form-group">
                <p style="font-size: 13px; color: #ccc;">Send minimum <b>50 ETB</b> to:</p>
                <p style="color: var(--gold); font-weight: bold;">Dawit - 0906067696 (Telebirr)</p>
                <button class="btn-gold" style="background: #222; color: #fff; border: 1px solid #444;" onclick="sendScreenshot()">Submit Screenshot</button>
            </div>
        </div>

        <div id="withdraw" class="page">
            <h3>Withdraw</h3>
            <div class="form-group">
                <input type="number" id="winAmt" placeholder="Amount">
                <select id="method">
                    <option value="Telebirr">Telebirr</option>
                    <option value="CBE">CBE</option>
                </select>
                <input type="text" id="accInfo" placeholder="Account Number">
                <button class="btn-gold" onclick="sendWithdraw()">Withdraw Now</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showPage('home')"><i class="fas fa-gamepad"></i><br>Games</div>
        <div class="nav-item" onclick="showPage('deposit')"><i class="fas fa-plus-circle"></i><br>Deposit</div>
        <div class="nav-item" onclick="showPage('withdraw')"><i class="fas fa-wallet"></i><br>Withdraw</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const adminId = "6521426530";
        const urlParams = new URLSearchParams(window.location.search);
        const uId = urlParams.get('id');
        const uName = urlParams.get('name') || "Player";

        // Initial Balance Logic
        let balance = parseFloat(localStorage.getItem('user_balance'));
        if (isNaN(balance)) {
            balance = 20.00; // First time bonus
            localStorage.setItem('user_balance', balance);
            alert("Welcome! You received 20 ETB Bonus! 🎉");
        }

        function updateUI() {
            document.getElementById('bal').innerText = balance.toFixed(2);
            document.getElementById('u_name').innerText = uName;
            document.getElementById('av').innerText = uName.charAt(0);
            localStorage.setItem('user_balance', balance);
        }
        updateUI();

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        }

        // Aviator Logic
        function startAviator() {
            let bet = parseFloat(document.getElementById('aviBet').value);
            if(bet > balance || bet < 1) return alert("Invalid Balance!");
            
            balance -= bet; updateUI();
            let plane = document.getElementById('plane');
            let multText = document.getElementById('mult');
            let m = 1.00;
            let crash = Math.random() < 0.4 ? (1 + Math.random()) : (1.5 + Math.random() * 5);
            
            let fly = setInterval(() => {
                m += 0.05;
                multText.innerText = m.toFixed(2) + "x";
                plane.style.bottom = (20 + (m * 15)) + "px";
                plane.style.left = (20 + (m * 25)) + "px";
                
                if(m >= crash) {
                    clearInterval(fly);
                    multText.style.color = "red";
                    multText.innerText = "FLEW AWAY!";
                    setTimeout(() => { 
                        plane.style.bottom = "20px"; plane.style.left = "20px"; 
                        multText.style.color = "white"; multText.innerText = "1.00x";
                    }, 2000);
                }
            }, 100);
        }

        // Bingo Logic
        function playBingo() {
            let bet = parseFloat(document.getElementById('bingoBet').value);
            if(bet > balance) return alert("Low Balance!");
            
            document.getElementById('bingoCard').classList.remove('scratched');
            setTimeout(() => {
                document.getElementById('bingoCard').classList.add('scratched');
                let win = Math.random() > 0.4;
                if(win) {
                    let prize = bet * 1.8; balance += prize;
                    document.getElementById('bingoRes').innerText = "WIN " + prize + "!";
                    document.getElementById('bingoRes').style.color = "lime";
                } else {
                    balance -= bet;
                    document.getElementById('bingoRes').innerText = "LOSE!";
                    document.getElementById('bingoRes').style.color = "red";
                }
                updateUI();
            }, 500);
        }

        // Admin Communication
        function sendScreenshot() {
            tg.sendData(JSON.stringify({type: "deposit_request", id: uId}));
            alert("Please send the screenshot to the Admin now!");
        }

        function sendWithdraw() {
            let amt = document.getElementById('winAmt').value;
            let acc = document.getElementById('accInfo').value;
            let method = document.getElementById('method').value;
            
            if(amt > balance) return alert("Insufficient balance!");
            
            let data = `Withdraw Request:\nID: ${uId}\nName: ${uName}\nAmount: ${amt} ETB\nMethod: ${method}\nAccount: ${acc}`;
            tg.sendData(data); // This sends data back to Bots.business
            alert("Withdrawal request sent to Admin!");
        }
    </script>
</body>
</html>
