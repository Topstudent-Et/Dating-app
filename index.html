<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TikVibe · Video Social Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #0a0a0a;
            color: #ffffff;
        }
        /* App Layout */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: #000000;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        /* Video Feed (TikTok style scroll) */
        .video-feed {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .video-card {
            scroll-snap-align: start;
            height: 100vh;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .video-overlay {
            position: relative;
            z-index: 2;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .video-info {
            flex: 1;
        }
        .video-actions {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }
        .action-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            text-align: center;
        }
        .username {
            font-weight: bold;
            margin-bottom: 6px;
        }
        .caption {
            font-size: 14px;
            margin-bottom: 8px;
        }
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 20px 28px;
            border-top: 0.5px solid #2c2c2c;
            z-index: 10;
        }
        .nav-item {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }
        .nav-item.active {
            color: #ff3b6f;
        }
        /* Modal & forms */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .modal-card {
            background: #1a1a1a;
            border-radius: 32px;
            padding: 28px;
            width: 90%;
            max-width: 380px;
            color: white;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 40px;
            border: none;
            background: #2c2c2c;
            color: white;
        }
        .btn-primary {
            background: #ff3b6f;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
        }
        /* Messages & Notifications panels */
        .panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            z-index: 20;
            overflow-y: auto;
            padding: 60px 20px 20px;
            transform: translateX(100%);
            transition: 0.3s;
        }
        .panel.open {
            transform: translateX(0);
        }
        .close-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            background: none;
            border: none;
            color: white;
        }
        .chat-message {
            background: #2a2a2a;
            border-radius: 20px;
            padding: 10px;
            margin: 8px 0;
        }
        .notification-item {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Video Feed (TikTok style) -->
    <div class="video-feed" id="videoFeed"></div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" data-nav="feed"><i class="fas fa-play-circle"></i><span>Feed</span></button>
        <button class="nav-item" data-nav="messages"><i class="fas fa-comment-dots"></i><span>Msg</span></button>
        <button class="nav-item" data-nav="notifications"><i class="fas fa-bell"></i><span>Notif</span></button>
        <button class="nav-item" data-nav="profile"><i class="fas fa-user"></i><span>Profile</span></button>
    </div>

    <!-- Registration / Auth Modal -->
    <div id="authModal" class="modal">
        <div class="modal-card">
            <h2 style="text-align:center;">✨ TikVibe</h2>
            <p style="text-align:center; margin-bottom:16px;">Sign up to watch & share</p>
            <input type="text" id="regName" placeholder="Full Name">
            <input type="text" id="regPhone" placeholder="Phone / Email">
            <input type="password" id="regPassword" placeholder="Password">
            <button id="registerBtn" class="btn-primary">Register / Login</button>
            <p style="font-size:12px; text-align:center; margin-top:12px;">© 2026 TikVibe — Connect & Vibe</p>
        </div>
    </div>

    <!-- Messages Panel -->
    <div id="messagesPanel" class="panel">
        <button class="close-panel" id="closeMessagesBtn"><i class="fas fa-arrow-left"></i></button>
        <h2>💬 Messages</h2>
        <div id="messagesList"></div>
        <div id="chatBox" style="display:none; margin-top:20px;">
            <div id="chatMessagesArea" style="max-height:300px; overflow-y:auto;"></div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button id="sendChatBtn" class="btn-primary" style="width:auto; padding:10px 18px;">Send</button>
            </div>
            <button id="backToChatsBtn" style="background:none; color:#ff3b6f; margin-top:10px;">← Back</button>
        </div>
    </div>

    <!-- Notifications Panel -->
    <div id="notificationsPanel" class="panel">
        <button class="close-panel" id="closeNotifBtn"><i class="fas fa-arrow-left"></i></button>
        <h2>🔔 Notifications</h2>
        <div id="notificationsList"></div>
    </div>

    <!-- Profile Panel -->
    <div id="profilePanel" class="panel">
        <button class="close-panel" id="closeProfileBtn"><i class="fas fa-arrow-left"></i></button>
        <h2>👤 My Profile</h2>
        <div id="profileInfo"></div>
        <button id="logoutBtn" class="btn-primary" style="background:#555;">Logout</button>
    </div>
</div>

<script>
    // ---------- DATA MODELS ----------
    let currentUser = null;
    let users = [];          // { id, name, phone, password, avatar, bio }
    let videos = [];         // { id, userId, videoUrl, caption, likes, comments, shares, createdAt }
    let messages = [];       // { id, fromUserId, toUserId, text, timestamp, seen }
    let notifications = [];  // { id, userId, text, type, read, createdAt }
    let currentChatWith = null;

    // Helper: save/load localStorage
    function saveData() {
        localStorage.setItem("tikvibe_users", JSON.stringify(users));
        localStorage.setItem("tikvibe_videos", JSON.stringify(videos));
        localStorage.setItem("tikvibe_messages", JSON.stringify(messages));
        localStorage.setItem("tikvibe_notifications", JSON.stringify(notifications));
        if(currentUser) localStorage.setItem("tikvibe_currentUser", JSON.stringify(currentUser));
    }
    function loadData() {
        const u = localStorage.getItem("tikvibe_users");
        if(u) users = JSON.parse(u);
        const v = localStorage.getItem("tikvibe_videos");
        if(v) videos = JSON.parse(v);
        const m = localStorage.getItem("tikvibe_messages");
        if(m) messages = JSON.parse(m);
        const n = localStorage.getItem("tikvibe_notifications");
        if(n) notifications = JSON.parse(n);
        const cu = localStorage.getItem("tikvibe_currentUser");
        if(cu) currentUser = JSON.parse(cu);
        if(users.length === 0) {
            // create demo users
            users.push({ id: 1, name: "Alex", phone: "alex@vibe.com", password: "123", avatar: "A", bio: "Travel & Music" });
            users.push({ id: 2, name: "Mia", phone: "mia@vibe.com", password: "123", avatar: "M", bio: "Dancer 💃" });
            users.push({ id: 3, name: "John", phone: "john@vibe.com", password: "123", avatar: "J", bio: "Filmmaker" });
            saveData();
        }
        if(videos.length === 0) {
            // sample videos (using sample mp4 from web)
            videos.push({ id: 101, userId: 1, videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", caption: "Sunset vibes 🔥", likes: 120, comments: [], shares: 0, createdAt: Date.now() });
            videos.push({ id: 102, userId: 2, videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunflies.mp4", caption: "Dance with me 🕺", likes: 340, comments: [], shares: 0, createdAt: Date.now() });
            videos.push({ id: 103, userId: 3, videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", caption: "Nature escape 🌿", likes: 89, comments: [], shares: 0, createdAt: Date.now() });
            saveData();
        }
    }

    // Render video feed (TikTok scroll)
    function renderFeed() {
        const feedDiv = document.getElementById("videoFeed");
        if(!feedDiv) return;
        feedDiv.innerHTML = "";
        videos.forEach(vid => {
            const user = users.find(u => u.id === vid.userId);
            const userName = user ? user.name : "Unknown";
            const card = document.createElement("div");
            card.className = "video-card";
            card.setAttribute("data-video-id", vid.id);
            card.innerHTML = `
                <video src="${vid.videoUrl}" loop playsinline></video>
                <div class="video-overlay">
                    <div class="video-info">
                        <div class="username">@${userName}</div>
                        <div class="caption">${vid.caption}</div>
                    </div>
                    <div class="video-actions">
                        <button class="action-btn like-btn" data-id="${vid.id}"><i class="far fa-heart"></i><span> ${vid.likes}</span></button>
                        <button class="action-btn comment-btn" data-id="${vid.id}"><i class="far fa-comment"></i><span> ${vid.comments?.length || 0}</span></button>
                        <button class="action-btn share-btn" data-id="${vid.id}"><i class="fas fa-share"></i></button>
                        <button class="action-btn copy-link-btn" data-id="${vid.id}"><i class="fas fa-link"></i></button>
                    </div>
                </div>
            `;
            feedDiv.appendChild(card);
        });
        // attach video observers for autoplay on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector("video");
                if(entry.isIntersecting) {
                    video.play().catch(e=>{});
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.6 });
        document.querySelectorAll(".video-card").forEach(card => observer.observe(card));
        attachVideoActions();
    }

    function attachVideoActions() {
        // Like
        document.querySelectorAll(".like-btn").forEach(btn => {
            btn.removeEventListener("click", likeHandler);
            btn.addEventListener("click", likeHandler);
        });
        // Comment
        document.querySelectorAll(".comment-btn").forEach(btn => {
            btn.removeEventListener("click", commentHandler);
            btn.addEventListener("click", commentHandler);
        });
        // Share
        document.querySelectorAll(".share-btn").forEach(btn => {
            btn.removeEventListener("click", shareHandler);
            btn.addEventListener("click", shareHandler);
        });
        // Copy link
        document.querySelectorAll(".copy-link-btn").forEach(btn => {
            btn.removeEventListener("click", copyLinkHandler);
            btn.addEventListener("click", copyLinkHandler);
        });
    }

    function likeHandler(e) {
        e.stopPropagation();
        const videoId = parseInt(this.getAttribute("data-id"));
        const video = videos.find(v => v.id === videoId);
        if(video) {
            video.likes += 1;
            saveData();
            renderFeed(); // re-render
            addNotification(video.userId, `${currentUser?.name} liked your video`, "like");
        }
    }
    function commentHandler(e) {
        e.stopPropagation();
        const videoId = parseInt(this.getAttribute("data-id"));
        const commentText = prompt("💬 Write a comment:");
        if(commentText && commentText.trim()) {
            const video = videos.find(v => v.id === videoId);
            if(video) {
                if(!video.comments) video.comments = [];
                video.comments.push({ userId: currentUser?.id, text: commentText, createdAt: Date.now() });
                saveData();
                renderFeed();
                addNotification(video.userId, `${currentUser?.name} commented: "${commentText.substring(0,30)}"`, "comment");
            }
        }
    }
    function shareHandler(e) {
        e.stopPropagation();
        const videoId = parseInt(this.getAttribute("data-id"));
        const video = videos.find(v => v.id === videoId);
        if(video) {
            video.shares = (video.shares || 0) + 1;
            saveData();
            alert("📤 Shared to feed (demo)");
            addNotification(video.userId, `${currentUser?.name} shared your video`, "share");
        }
    }
    function copyLinkHandler(e) {
        e.stopPropagation();
        const videoId = parseInt(this.getAttribute("data-id"));
        const link = `https://tikvibe.app/video/${videoId}`;
        navigator.clipboard.writeText(link);
        alert("✅ Video link copied to clipboard!");
    }

    function addNotification(targetUserId, text, type) {
        if(!currentUser) return;
        const notif = { id: Date.now(), userId: targetUserId, text: text, type: type, read: false, createdAt: Date.now() };
        notifications.push(notif);
        saveData();
        if(targetUserId === currentUser?.id) renderNotificationsPanel();
    }

    // Messaging system
    function renderMessagesList() {
        const container = document.getElementById("messagesList");
        if(!container) return;
        // get conversations: unique users that currentUser has messages with
        const myMessages = messages.filter(m => m.fromUserId === currentUser?.id || m.toUserId === currentUser?.id);
        const userIds = new Set();
        myMessages.forEach(m => {
            if(m.fromUserId === currentUser?.id) userIds.add(m.toUserId);
            else userIds.add(m.fromUserId);
        });
        const convos = Array.from(userIds).map(uid => users.find(u => u.id === uid)).filter(Boolean);
        if(convos.length === 0) { container.innerHTML = "<p>No messages yet. Like & comment to start chatting!</p>"; return; }
        container.innerHTML = convos.map(u => `<div class="chat-message" data-otherid="${u.id}" style="cursor:pointer; display:flex; justify-content:space-between;"><span><strong>${u.name}</strong></span><span><i class="fas fa-comment"></i></span></div>`).join('');
        document.querySelectorAll("[data-otherid]").forEach(el => {
            el.addEventListener("click", () => openChat(parseInt(el.getAttribute("data-otherid"))));
        });
    }

    function openChat(otherUserId) {
        currentChatWith = otherUserId;
        const other = users.find(u => u.id === otherUserId);
        document.getElementById("chatBox").style.display = "block";
        document.getElementById("messagesList").style.display = "none";
        document.getElementById("chatMessagesArea").innerHTML = "";
        loadChatMessages(otherUserId);
    }

    function loadChatMessages(otherId) {
        const chatMessages = messages.filter(m => (m.fromUserId === currentUser?.id && m.toUserId === otherId) || (m.fromUserId === otherId && m.toUserId === currentUser?.id));
        chatMessages.sort((a,b) => a.timestamp - b.timestamp);
        const container = document.getElementById("chatMessagesArea");
        container.innerHTML = chatMessages.map(msg => `<div style="text-align:${msg.fromUserId === currentUser?.id ? 'right' : 'left'}; margin:8px;"><span style="background:${msg.fromUserId === currentUser?.id ? '#ff3b6f' : '#2c2c2c'}; padding:8px 14px; border-radius:20px; display:inline-block;">${msg.text}</span></div>`).join('');
        // mark as seen
        chatMessages.forEach(msg => { if(msg.toUserId === currentUser?.id && !msg.seen) { msg.seen = true; } });
        saveData();
        container.scrollTop = container.scrollHeight;
    }

    function sendMessage(toUserId, text) {
        if(!text.trim()) return;
        const newMsg = { id: Date.now(), fromUserId: currentUser.id, toUserId: toUserId, text: text, timestamp: Date.now(), seen: false };
        messages.push(newMsg);
        saveData();
        loadChatMessages(toUserId);
        // add notification for receiver
        addNotification(toUserId, `New message from ${currentUser.name}`, "message");
    }

    // Notifications render
    function renderNotificationsPanel() {
        const container = document.getElementById("notificationsList");
        if(!container) return;
        const myNotifs = notifications.filter(n => n.userId === currentUser?.id).sort((a,b)=>b.createdAt - a.createdAt);
        if(myNotifs.length === 0) { container.innerHTML = "<p>🔔 No notifications yet</p>"; return; }
        container.innerHTML = myNotifs.map(n => `<div class="notification-item"><i class="fas fa-bell"></i> ${n.text}<br><small>${new Date(n.createdAt).toLocaleString()}</small></div>`).join('');
    }

    function renderProfilePanel() {
        if(!currentUser) return;
        document.getElementById("profileInfo").innerHTML = `
            <div style="text-align:center;"><div style="width:80px;height:80px;background:#ff3b6f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto;">${currentUser.avatar || '👤'}</div>
            <h3>${currentUser.name}</h3>
            <p>📞 ${currentUser.phone}</p>
            <p>✍️ ${currentUser.bio || "Love to vibe!"}</p>
            </div>
        `;
    }

    // Registration / Login logic
    document.getElementById("registerBtn").addEventListener("click", () => {
        const name = document.getElementById("regName").value.trim();
        const phone = document.getElementById("regPhone").value.trim();
        const pass = document.getElementById("regPassword").value;
        if(!name || !phone || !pass) { alert("Fill all fields"); return; }
        let user = users.find(u => u.phone === phone && u.password === pass);
        if(!user) {
            // register new
            const newId = users.length + 1;
            user = { id: newId, name: name, phone: phone, password: pass, avatar: name.charAt(0), bio: "New to TikVibe" };
            users.push(user);
            saveData();
            alert("Account created!");
        } else {
            alert("Welcome back " + user.name);
        }
        currentUser = user;
        localStorage.setItem("tikvibe_currentUser", JSON.stringify(currentUser));
        document.getElementById("authModal").style.display = "none";
        renderFeed();
        renderMessagesList();
        renderNotificationsPanel();
        renderProfilePanel();
    });

    // Navigation between panels
    const panels = { feed: null, messages: document.getElementById("messagesPanel"), notifications: document.getElementById("notificationsPanel"), profile: document.getElementById("profilePanel") };
    document.querySelectorAll(".nav-item").forEach(btn => {
        btn.addEventListener("click", () => {
            const nav = btn.getAttribute("data-nav");
            document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            if(nav === "feed") {
                panels.messages.classList.remove("open");
                panels.notifications.classList.remove("open");
                panels.profile.classList.remove("open");
                renderFeed();
            } else if(nav === "messages") {
                panels.messages.classList.add("open");
                panels.notifications.classList.remove("open");
                panels.profile.classList.remove("open");
                renderMessagesList();
                document.getElementById("chatBox").style.display = "none";
                document.getElementById("messagesList").style.display = "block";
            } else if(nav === "notifications") {
                panels.notifications.classList.add("open");
                panels.messages.classList.remove("open");
                panels.profile.classList.remove("open");
                renderNotificationsPanel();
            } else if(nav === "profile") {
                panels.profile.classList.add("open");
                panels.messages.classList.remove("open");
                panels.notifications.classList.remove("open");
                renderProfilePanel();
            }
        });
    });
    document.getElementById("closeMessagesBtn").addEventListener("click", () => panels.messages.classList.remove("open"));
    document.getElementById("closeNotifBtn").addEventListener("click", () => panels.notifications.classList.remove("open"));
    document.getElementById("closeProfileBtn").addEventListener("click", () => panels.profile.classList.remove("open"));
    document.getElementById("logoutBtn").addEventListener("click", () => {
        currentUser = null;
        localStorage.removeItem("tikvibe_currentUser");
        location.reload();
    });
    document.getElementById("sendChatBtn").addEventListener("click", () => {
        const input = document.getElementById("chatInput");
        if(currentChatWith && input.value.trim()) {
            sendMessage(currentChatWith, input.value);
            input.value = "";
        }
    });
    document.getElementById("backToChatsBtn").addEventListener("click", () => {
        document.getElementById("chatBox").style.display = "none";
        document.getElementById("messagesList").style.display = "block";
        currentChatWith = null;
    });

    // initial load
    loadData();
    if(!currentUser) {
        document.getElementById("authModal").style.display = "flex";
    } else {
        document.getElementById("authModal").style.display = "none";
        renderFeed();
        renderMessagesList();
        renderNotificationsPanel();
        renderProfilePanel();
    }
    // auto-save interval
    setInterval(() => { if(currentUser) saveData(); }, 5000);
    // copyright year updated
    const footerYear = document.createElement("div");
    footerYear.style.position = "fixed";
    footerYear.style.bottom = "70px";
    footerYear.style.left = "0";
    footerYear.style.right = "0";
    footerYear.style.textAlign = "center";
    footerYear.style.fontSize = "10px";
    footerYear.style.color = "#555";
    footerYear.innerText = "© 2026 TikVibe — All rights reserved";
    document.querySelector(".app-container").appendChild(footerYear);
</script>
</body>
</html>
