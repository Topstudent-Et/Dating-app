<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aviator | Professional Crash Game</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Poppins', sans-serif;
            padding: 24px 16px;
        }

        /* main game panel */
        .game-container {
            max-width: 620px;
            width: 100%;
            background: rgba(8, 12, 20, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 56px;
            padding: 24px 22px 34px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 200, 80, 0.25);
            transition: all 0.2s;
        }

        /* header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(145deg, #FFDF85, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .balance-card {
            background: #03060ecc;
            border-radius: 60px;
            padding: 6px 20px;
            text-align: center;
            border: 1px solid #ffd96666;
        }
        .balance-label {
            font-size: 0.75rem;
            color: #9aa9c7;
        }
        .balance-amount {
            font-size: 1.9rem;
            font-weight: 800;
            color: #FFE484;
            line-height: 1;
        }
        .currency {
            font-size: 0.9rem;
        }

        /* top bar: sound & auto cashout */
        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 16px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .sound-toggle {
            background: #1e243b;
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.9rem;
        }
        .auto-cashout-box {
            background: #0b101ccc;
            border-radius: 60px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .auto-label {
            color: #FFD966;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .auto-input {
            background: #010101aa;
            border: 1px solid #ffd966aa;
            border-radius: 40px;
            padding: 6px 12px;
            width: 70px;
            text-align: center;
            color: #FFE5A3;
            font-weight: bold;
            font-family: monospace;
        }
        .set-auto-btn {
            background: #2c2f42;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        /* multiplier history strip */
        .multiplier-strip {
            background: #00000066;
            border-radius: 60px;
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 16px 0;
        }
        .multiplier-chip {
            background: #121a28;
            padding: 5px 14px;
            border-radius: 40px;
            font-weight: 800;
            color: #f3cd68;
            font-family: monospace;
            font-size: 1rem;
            box-shadow: inset 0 1px 0 #ffffff1a;
        }

        /* flight zone + canvas graph */
        .flight-zone {
            background: #01010170;
            border-radius: 44px;
            padding: 16px 12px;
            margin: 10px 0;
            border: 1px solid #ffd96655;
        }
        .canvas-container {
            background: #03070f;
            border-radius: 32px;
            padding: 8px;
        }
        canvas {
            width: 100%;
            height: auto;
            background: #02040a;
            border-radius: 24px;
            display: block;
        }
        .current-multiplier {
            font-size: 3.2rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            text-align: center;
            color: #FFE484;
            text-shadow: 0 0 10px #ffa600;
            margin-top: 12px;
        }
        .status-badge {
            background: #1a2538;
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 8px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 12px;
        }

        /* bet section */
        .bet-section {
            background: #0a101ccc;
            border-radius: 42px;
            padding: 20px 16px;
            margin: 18px 0;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .bet-input {
            background: #010101dd;
            border: 1px solid #f3b33d;
            border-radius: 60px;
            padding: 10px 18px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #FFE6A3;
            width: 140px;
            text-align: center;
        }
        .quick-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .quick-btn {
            background: #262e44;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: #FFE5A3;
        }
        .action-group {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }
        .btn-cashout {
            background: linear-gradient(120deg, #f0b429, #ff8c42);
            border: none;
            padding: 14px;
            font-weight: 800;
            font-size: 1.2rem;
            border-radius: 60px;
            flex: 1;
            cursor: pointer;
            box-shadow: 0 5px 0 #874d12;
        }
        .btn-place {
            background: linear-gradient(120deg, #2c6e9e, #1f4e72);
            border: none;
            padding: 14px;
            font-weight: 800;
            font-size: 1.2rem;
            border-radius: 60px;
            flex: 1;
            cursor: pointer;
            color: white;
            box-shadow: 0 5px 0 #0c2b3b;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3a2a0a;
        }
        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }
        .stats-footer {
            display: flex;
            justify-content: space-between;
            background: #03060c99;
            border-radius: 36px;
            padding: 10px 20px;
            font-size: 0.75rem;
            margin-top: 16px;
            color: #b9c3e0;
        }
        .round-history {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0 0;
            flex-wrap: wrap;
        }
        footer {
            font-size: 0.65rem;
            text-align: center;
            color: #5f6a8a;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="title">✈️ AVIATOR</div>
        <div class="balance-card">
            <div class="balance-label">BALANCE</div>
            <div class="balance-amount"><span id="balanceDisplay">50000.00</span> <span class="currency">ETB</span></div>
        </div>
    </div>

    <!-- Sound + Auto Cashout Panel -->
    <div class="top-actions">
        <button id="soundToggleBtn" class="sound-toggle">🔊 SOUND ON</button>
        <div class="auto-cashout-box">
            <span class="auto-label">🤖 AUTO CASHOUT</span>
            <input type="number" id="autoMultiplierInput" class="auto-input" step="0.5" min="1.2" value="2.5" placeholder="x">
            <button id="setAutoBtn" class="set-auto-btn">SET</button>
            <span id="autoActiveLabel" style="font-size:0.7rem; color:#90ff90;">⚡ OFF</span>
        </div>
    </div>

    <!-- Multiplier history -->
    <div class="multiplier-strip" id="multiplierHistory"></div>

    <!-- Flight Area with canvas graph -->
    <div class="flight-zone">
        <div class="canvas-container">
            <canvas id="flightCanvas" width="560" height="160" style="width:100%; height:auto; max-width:560px; aspect-ratio:560/160"></canvas>
        </div>
        <div class="current-multiplier" id="liveMultiplier">1.00x</div>
        <div class="status-badge" id="gameStatusText">⚡ Place a bet to start flight</div>
    </div>

    <!-- Betting panel -->
    <div class="bet-section">
        <div class="bet-row">
            <span style="font-weight:600;">💰 BET (ETB)</span>
            <input type="number" id="betAmountInput" class="bet-input" value="4.00" step="1" min="1">
        </div>
        <div class="quick-buttons">
            <button class="quick-btn" data-bet="4">4 ETB</button>
            <button class="quick-btn" data-bet="16">16 ETB</button>
            <button class="quick-btn" data-bet="40">40 ETB</button>
            <button class="quick-btn" data-bet="80">80 ETB</button>
            <button class="quick-btn" data-bet="400">400 ETB</button>
        </div>
        <div class="action-group">
            <button class="btn-place" id="placeBetBtn">🚀 PLACE BET</button>
            <button class="btn-cashout" id="cashoutBtn">💸 CASHOUT</button>
        </div>
    </div>

    <!-- Stats and recent rounds -->
    <div class="stats-footer">
        <span>🏆 MAX WIN: <span id="maxWinSpan">0.00</span> ETB</span>
        <span>🎲 ROUND: <span id="roundNumber">217</span></span>
        <span>📈 MULT: <span id="currentMultiText">1.00x</span></span>
    </div>
    <div class="round-history" id="lastRounds"></div>
    <footer>✈️ Plane climbs → multiplier increases. Cashout before crash! Auto cashout + sound effects + live chart.</footer>
</div>

<script>
    // ------------------- GAME STATE ------------------
    let balance = 50000.00;
    let currentBet = 0.00;
    let isGameActive = false;       // bet placed, plane in air
    let roundActive = false;        // multiplier increasing
    let currentMultiplier = 1.00;
    let crashPoint = 1.00;
    let multiplierInterval = null;
    let autoCashoutMultiplier = 0;   // 0 = disabled
    let soundEnabled = true;
    let maxWinAmount = 0.00;
    let roundCounter = 217;
    let lastMultipliers = [1.31, 1.98, 2.29, 1.50, 16.69, 1.21, 1.42];

    // Canvas chart
    const canvas = document.getElementById('flightCanvas');
    const ctx = canvas.getContext('2d');
    let chartPoints = [{x: 0, y: 1}];

    // DOM elements
    const balanceSpan = document.getElementById('balanceDisplay');
    const liveMultiplierSpan = document.getElementById('liveMultiplier');
    const gameStatusSpan = document.getElementById('gameStatusText');
    const betAmountInput = document.getElementById('betAmountInput');
    const placeBtn = document.getElementById('placeBetBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const maxWinSpan = document.getElementById('maxWinSpan');
    const roundNumberSpan = document.getElementById('roundNumber');
    const currentMultiText = document.getElementById('currentMultiText');
    const multiplierHistoryDiv = document.getElementById('multiplierHistory');
    const lastRoundsDiv = document.getElementById('lastRounds');
    const autoActiveLabel = document.getElementById('autoActiveLabel');
    const autoMultiplierInput = document.getElementById('autoMultiplierInput');
    const setAutoBtn = document.getElementById('setAutoBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');

    // Helper: play sound (using Web Audio or simple Audio)
    function playSound(type) {
        if (!soundEnabled) return;
        try {
            let audio;
            if (type === 'cashout') {
                audio = new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3');
            } else if (type === 'crash') {
                audio = new Audio('https://www.soundjay.com/misc/sounds/explosion-01.mp3');
            } else if (type === 'takeoff') {
                audio = new Audio('https://www.soundjay.com/transport/plane-flying-01.mp3');
            } else if (type === 'win') {
                audio = new Audio('https://www.soundjay.com/misc/sounds/coins-1.mp3');
            } else {
                return;
            }
            audio.volume = 0.35;
            audio.play().catch(e => console.log("Audio not allowed"));
        } catch(e) { console.log("audio error"); }
    }

    // UI updates
    function updateUI() {
        balanceSpan.innerText = balance.toFixed(2);
        liveMultiplierSpan.innerText = currentMultiplier.toFixed(2) + 'x';
        currentMultiText.innerText = currentMultiplier.toFixed(2) + 'x';
        maxWinSpan.innerText = maxWinAmount.toFixed(2);
        roundNumberSpan.innerText = roundCounter;
    }

    // update multiplier history strip
    function updateMultiplierHistory(newMult) {
        lastMultipliers.unshift(parseFloat(newMult.toFixed(2)));
        if(lastMultipliers.length > 9) lastMultipliers.pop();
        multiplierHistoryDiv.innerHTML = '';
        lastMultipliers.slice(0,8).forEach(m => {
            const chip = document.createElement('span');
            chip.className = 'multiplier-chip';
            chip.innerText = m.toFixed(2) + 'x';
            multiplierHistoryDiv.appendChild(chip);
        });
        lastRoundsDiv.innerHTML = lastMultipliers.slice(0,5).map(m => `<span style="background:#00000066; padding:4px 14px; border-radius:20px;">${m.toFixed(2)}x</span>`).join('');
    }

    // draw flight chart (exponential / smooth curve)
    function drawFlightGraph() {
        if (!canvas || !ctx) return;
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (chartPoints.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = '#FFD966';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 0;
        for (let i = 0; i < chartPoints.length; i++) {
            let x = (chartPoints[i].x / 12) * w;   // max time 12 sec approx
            let y = h - (Math.min(chartPoints[i].y, 40) / 40) * h;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        // draw plane icon at last point
        if (chartPoints.length > 0) {
            let last = chartPoints[chartPoints.length-1];
            let lastX = (last.x / 12) * w;
            let lastY = h - (Math.min(last.y, 40) / 40) * h;
            ctx.font = '22px "Segoe UI"';
            ctx.fillStyle = '#ffdd99';
            ctx.fillText('✈️', lastX-12, lastY-6);
        }
        // draw grid
        ctx.beginPath();
        ctx.strokeStyle = '#2a334a';
        ctx.lineWidth = 0.5;
        for(let i=1;i<=4;i++) {
            let yGrid = h - (i/4)*h;
            ctx.moveTo(0, yGrid);
            ctx.lineTo(w, yGrid);
            ctx.stroke();
        }
    }

    function addChartPoint(multiplier, timeSec) {
        chartPoints.push({x: timeSec, y: multiplier});
        if(chartPoints.length > 60) chartPoints.shift();
        drawFlightGraph();
    }

    // generate random crash point (1.05 - 100)
    function generateCrashPoint() {
        let r = Math.random();
        if(r < 0.58) return 1 + Math.random() * 2.2;      // 1.00 - 3.2
        else if(r < 0.86) return 3.2 + Math.random() * 5;  // 3.2 - 8.2
        else return 8.5 + Math.random() * 28;              // up to 36.5
    }

    // reset game after crash or cashout
    function stopGame(keepBetActive = false) {
        if(multiplierInterval) {
            clearInterval(multiplierInterval);
            multiplierInterval = null;
        }
        roundActive = false;
        if(!keepBetActive) {
            isGameActive = false;
        }
        enableButtons(true);
    }

    // crash sequence
    function crashGame() {
        if(!roundActive) return;
        if(multiplierInterval) clearInterval(multiplierInterval);
        multiplierInterval = null;
        roundActive = false;
        // if player still has active bet -> lose money
        if(isGameActive && currentBet > 0) {
            // already deducted when placed, so no extra deduction, but notify loss
            gameStatusSpan.innerText = `💥 PLANE CRASHED! You lost ${currentBet.toFixed(2)} ETB`;
            playSound('crash');
            // trigger confetti? no, loss.
            currentBet = 0;
            isGameActive = false;
        } else if(isGameActive && currentBet === 0) {
            isGameActive = false;
        }
        // record crash multiplier in history
        let crashedValue = currentMultiplier;
        updateMultiplierHistory(crashedValue);
        // reset chart for next round?
        chartPoints = [{x:0, y:1}];
        drawFlightGraph();
        updateUI();
        gameStatusSpan.style.background = "#4a1a2a";
        setTimeout(() => {
            if(!roundActive && !isGameActive) {
                gameStatusSpan.innerText = "🛬 Plane crashed. Place new bet";
                gameStatusSpan.style.background = "#1a2538";
            }
        }, 1800);
        stopGame(false);
        enableButtons(true);
        // increment round counter after crash
        roundCounter++;
        roundNumberSpan.innerText = roundCounter;
        updateUI();
    }

    // multiplier increment loop
    let startTime = 0;
    function startMultiplierRise() {
        if(multiplierInterval) clearInterval(multiplierInterval);
        currentMultiplier = 1.00;
        chartPoints = [{x:0, y:1}];
        drawFlightGraph();
        let elapsed = 0;
        multiplierInterval = setInterval(() => {
            if(!roundActive) return;
            elapsed += 0.18;
            let increment = 0.02 + (Math.random() * 0.045);
            currentMultiplier = +(currentMultiplier + increment).toFixed(3);
            addChartPoint(currentMultiplier, elapsed);
            if(currentMultiplier >= crashPoint && roundActive) {
                currentMultiplier = crashPoint;
                updateUI();
                crashGame();
                return;
            }
            updateUI();
            // Auto cashout check
            if(autoCashoutMultiplier > 0 && currentMultiplier >= autoCashoutMultiplier && roundActive && isGameActive && currentBet > 0) {
                // auto cashout trigger
                cashout(true);
            }
            if(currentMultiplier > 25) liveMultiplierSpan.style.color = "#ff7777";
            else liveMultiplierSpan.style.color = "#FFE484";
        }, 150);
    }

    // Cashout function
    function cashout(isAuto = false) {
        if(!roundActive || !isGameActive || currentBet <= 0) {
            if(!isAuto) gameStatusSpan.innerText = "No active bet or round not started!";
            return;
        }
        let winAmount = currentBet * currentMultiplier;
        balance += winAmount;
        if(winAmount > maxWinAmount) maxWinAmount = winAmount;
        updateUI();
        // record cashout multiplier to history
        updateMultiplierHistory(currentMultiplier);
        playSound('cashout');
        if(winAmount > 100) canvasConfetti({particleCount:120, spread:70, origin:{y:0.6}});
        gameStatusSpan.innerText = `🎉 CASHED OUT! Won ${winAmount.toFixed(2)} ETB @ ${currentMultiplier.toFixed(2)}x 🎉`;
        // stop round
        if(multiplierInterval) clearInterval(multiplierInterval);
        multiplierInterval = null;
        roundActive = false;
        isGameActive = false;
        currentBet = 0;
        enableButtons(true);
        chartPoints = [{x:0, y:1}];
        drawFlightGraph();
        gameStatusSpan.style.background = "#1f5530";
        setTimeout(() => {
            if(!roundActive) gameStatusSpan.style.background = "#1a2538";
        }, 1500);
        roundCounter++;
        roundNumberSpan.innerText = roundCounter;
        updateUI();
    }

    // Place bet
    function placeBet() {
        if(roundActive) {
            gameStatusSpan.innerText = "⚠️ Flight in progress! Wait for next round.";
            return;
        }
        if(isGameActive) {
            gameStatusSpan.innerText = "Bet already active. Cashout or wait.";
            return;
        }
        let betVal = parseFloat(betAmountInput.value);
        if(isNaN(betVal) || betVal <= 0) betVal = 4.00;
        if(betVal > balance) {
            gameStatusSpan.innerText = "❌ Insufficient balance!";
            return;
        }
        currentBet = betVal;
        balance -= currentBet;
        updateUI();
        // start fresh round
        roundActive = true;
        isGameActive = true;
        crashPoint = generateCrashPoint();
        currentMultiplier = 1.00;
        updateUI();
        startMultiplierRise();
        playSound('takeoff');
        gameStatusSpan.innerText = `✈️ Plane taking off! Multiplier climbing... Bet: ${currentBet.toFixed(2)} ETB`;
        enableButtons(false);
        // Disable place button but cashout enabled
        placeBtn.disabled = true;
        cashoutBtn.disabled = false;
        // update round display
        roundNumberSpan.innerText = roundCounter;
    }

    function enableButtons(enable) {
        if(enable) {
            placeBtn.disabled = false;
            cashoutBtn.disabled = false;
            betAmountInput.disabled = false;
        } else {
            if(roundActive) {
                placeBtn.disabled = true;
                cashoutBtn.disabled = false;
            } else {
                placeBtn.disabled = false;
                cashoutBtn.disabled = true;
            }
            betAmountInput.disabled = roundActive;
        }
        // extra: if no active round, cashout disabled
        if(!roundActive && !isGameActive) cashoutBtn.disabled = true;
        else if(roundActive && isGameActive) cashoutBtn.disabled = false;
    }

    // Quick bet buttons
    document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if(roundActive) {
                gameStatusSpan.innerText = "Wait, plane is flying! Next round.";
                return;
            }
            let val = parseFloat(btn.getAttribute('data-bet'));
            if(!isNaN(val)) betAmountInput.value = val.toFixed(2);
        });
    });

    // Auto cashout setter
    setAutoBtn.addEventListener('click', () => {
        let val = parseFloat(autoMultiplierInput.value);
        if(isNaN(val) || val < 1.1) val = 2.5;
        autoCashoutMultiplier = val;
        autoActiveLabel.innerText = `✅ ${val.toFixed(2)}x`;
        autoActiveLabel.style.color = "#aaffaa";
        setTimeout(() => {
            if(autoCashoutMultiplier > 0) autoActiveLabel.innerText = `⚡ ${autoCashoutMultiplier.toFixed(2)}x`;
        }, 1800);
    });

    // Sound toggle
    soundToggleBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundToggleBtn.innerText = soundEnabled ? "🔊 SOUND ON" : "🔇 SOUND OFF";
    });

    // Event listeners
    placeBtn.addEventListener('click', placeBet);
    cashoutBtn.addEventListener('click', () => cashout(false));

    // Initialize UI with existing data
    function init() {
        updateUI();
        updateMultiplierHistory(1.08);
        lastMultipliers = [1.31, 1.98, 2.29, 1.50, 16.69, 1.21, 1.42];
        updateMultiplierHistory(1.05);
        currentMultiplier = 1.00;
        liveMultiplierSpan.innerText = "1.00x";
        gameStatusSpan.innerText = "✨ Ready. Place bet & watch the plane!";
        enableButtons(true);
        roundActive = false;
        isGameActive = false;
        currentBet = 0;
        roundCounter = 217;
        roundNumberSpan.innerText = roundCounter;
        drawFlightGraph();
        autoCashoutMultiplier = 0;
        autoActiveLabel.innerText = "⚡ OFF";
        autoMultiplierInput.value = "2.5";
        soundEnabled = true;
        soundToggleBtn.innerText = "🔊 SOUND ON";
    }
    init();
    // ensure chart responsive redraw on resize
    window.addEventListener('resize', () => drawFlightGraph());
</script>
</body>
</html>
