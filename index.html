<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAI AVIATOR - EXCLUSIVE ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;900&display=swap');
        body { background-color: #0b0e11; color: white; font-family: 'Roboto', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .aviator-screen { 
            background: radial-gradient(circle at bottom left, #1c0a12 0%, #000 100%);
            height: 280px; position: relative; border-radius: 20px; overflow: hidden; border: 1px solid #2d1a24;
        }
        #gamePath { stroke: #d32f2f; stroke-width: 6; fill: none; filter: drop-shadow(0 0 10px #ff0000); }
        .plane-emoji { position: absolute; bottom: 15px; left: 15px; font-size: 55px; z-index: 100; transition: transform 0.1s linear; }
        .multiplier-display { font-size: 4.5rem; font-weight: 900; z-index: 200; position: relative; }
        
        /* Navigation */
        .nav-bar { background: #1c2127; position: fixed; bottom: 0; width: 100%; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: #d32f2f; }
        .page { display: none; height: calc(100vh - 65px); overflow-y: auto; padding-bottom: 80px; }
        .active-page { display: block; }

        /* Secret Admin Panel */
        #secretAdminPanel { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; padding: 20px; flex-direction: column; }
        .user-row { background: #1c2127; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="secretAdminPanel">
        <div class="flex justify-between items-center border-b border-red-600 pb-3 mb-4">
            <h2 class="text-red-500 font-black text-xl underline">DAWIT'S COMMAND CENTER</h2>
            <button onclick="closeAdmin()" class="bg-gray-800 px-4 py-1 rounded text-xs font-bold">CLOSE</button>
        </div>
        <div id="adminUserList" class="overflow-y-auto flex-1">
            </div>
    </div>

    <div class="p-3 flex justify-between items-center bg-[#1c2127] border-b border-gray-800 sticky top-0 z-[500]">
        <div class="flex items-center gap-3">
            <div id="headerPfp"></div>
            <div class="flex flex-col">
                <span class="text-red-600 font-black italic text-xl">Aviator</span>
                <span id="tgName" onclick="tryOpenAdmin()" class="text-[9px] text-gray-500 font-bold uppercase cursor-pointer">@Guest</span>
            </div>
        </div>
        <div class="bg-black px-4 py-1.5 rounded-full border border-green-900">
            <span id="balDisplay" class="text-green-500 font-bold text-sm">0.00</span> <span class="text-[10px] text-gray-500">ETB</span>
        </div>
    </div>

    <section id="home" class="page active-page p-3 text-center">
        <div id="historyBar" class="flex gap-2 mb-2 overflow-x-auto no-scrollbar py-1"></div>
        
        <div class="aviator-screen flex items-center justify-center">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 300 Q 0 300 0 300" /></svg>
            <div id="multiText" class="multiplier-display font-game italic text-white">1.00x</div>
            <div id="plane" class="plane-emoji">✈️</div>
            <div id="statusMsg" class="absolute top-2 text-[10px] text-gray-500 font-bold">WAITING FOR NEXT ROUND</div>
        </div>

        <div class="mt-4 bg-[#1c2127] p-5 rounded-2xl border border-gray-800">
            <div class="flex gap-4">
                <div class="w-1/3">
                    <input id="betInput" type="number" value="10" class="w-full bg-black border border-gray-700 p-3 rounded-xl text-center font-bold outline-none">
                </div>
                <button id="mainBetBtn" onclick="onBetClick()" class="bg-[#28a745] flex-1 text-xl font-black rounded-xl shadow-lg">BET<br><span id="betLabel" class="text-xs font-normal">10.00 ETB</span></button>
            </div>
        </div>
    </section>

    <section id="wallet" class="page p-5">
        <h2 class="text-2xl font-black mb-6">Deposit (ማስገቢያ)</h2>
        <div class="space-y-4">
            <div class="bg-[#1c2127] p-4 rounded-xl border-l-4 border-yellow-500">
                <p class="text-xs text-gray-400">Telebirr (ዳዊት)</p>
                <p class="text-xl font-bold">0906067696</p>
            </div>
            <div class="bg-[#1c2127] p-4 rounded-xl border-l-4 border-blue-500">
                <p class="text-xs text-gray-400">CBE (ዳዊት)</p>
                <p class="text-lg font-bold">1000179571815</p>
            </div>
            <button onclick="window.open('https://t.me/Dawit_fikadu21')" class="w-full bg-blue-600 py-3 rounded-xl font-bold">SEND SCREENSHOT</button>
        </div>
    </section>

    <div class="nav-bar">
        <div onclick="showPage('home')" class="nav-item active" id="nav-home"><i class="fa-solid fa-plane text-lg mb-1"></i><span>Game</span></div>
        <div onclick="showPage('wallet')" class="nav-item" id="nav-wallet"><i class="fa-solid fa-wallet text-lg mb-1"></i><span>Deposit</span></div>
        <div onclick="showPage('profile')" class="nav-item" id="nav-profile"><i class="fa-solid fa-user text-lg mb-1"></i><span>Profile</span></div>
    </div>

    <audio id="sndFly" loop src="https://www.soundjay.com/transportation/sounds/propeller-plane-flying-1.mp3"></audio>
    <audio id="sndCrash" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>
    <audio id="sndMoney" src="https://www.soundjay.com/misc/sounds/coins-spilled-1.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Security check: ONLY Dawit
        const ADMIN_USERNAME = "Dawit_fikadu21";
        let balance = parseFloat(localStorage.getItem('dawit_bal_v3')) || 10.00;
        let currentUser = tg.initDataUnsafe?.user?.username || "Guest";

        function init() {
            document.getElementById('tgName').innerText = "@" + currentUser;
            document.getElementById('balDisplay').innerText = balance.toFixed(2);
            renderHistory();
            startLoop();
        }

        // --- SECRET ADMIN LOGIC ---
        function tryOpenAdmin() {
            // Check if current user is exactly @Dawit_fikadu21
            if(currentUser === ADMIN_USERNAME) {
                let pass = prompt("Welcome Dawit. Enter Key:");
                if(pass === "215221") {
                    loadAdminData();
                    document.getElementById('secretAdminPanel').style.display = 'flex';
                }
            } else {
                console.log("Access Denied: Not Dawit");
            }
        }

        function closeAdmin() { document.getElementById('secretAdminPanel').style.display = 'none'; }

        function loadAdminData() {
            const list = document.getElementById('adminUserList');
            // In a real app, this would fetch from your database
            list.innerHTML = `
                <div class="user-row">
                    <span>@${currentUser} (YOU)</span>
                    <button onclick="modBal()" class="bg-red-600 px-3 py-1 rounded text-[10px]">EDIT BAL</button>
                </div>
                <p class="text-[9px] text-gray-500 mt-4 text-center italic">Only you can see this menu, Dawit.</p>
            `;
        }

        function modBal() {
            let n = prompt("Set New Balance:");
            if(n) { balance = parseFloat(n); save(); alert("Done!"); }
        }

        // --- GAME ENGINE ---
        let isFlying = false; let mult = 1.00; let myBet = { active: false, amt: 0 };
        let history = ["1.50x", "12.0x", "1.05x"];

        function startLoop() {
            if(isFlying) return;
            let w = 8;
            let t = setInterval(() => {
                document.getElementById('statusMsg').innerText = `NEXT TAKEOFF IN ${w}S`;
                if(w-- <= 0) { clearInterval(t); takeoff(); }
            }, 1000);
        }

        function takeoff() {
            isFlying = true; mult = 1.00;
            document.getElementById('sndFly').play();
            if(myBet.active) {
                document.getElementById('mainBetBtn').className = "bg-orange-500 flex-1 text-xl font-black rounded-xl";
                document.getElementById('mainBetBtn').innerHTML = `CASH OUT<br><span>${(myBet.amt * mult).toFixed(2)}</span>`;
            }

            // 40% Admin Profit Logic
            let crashAt = Math.random() < 0.4 ? (1 + Math.random() * 0.15) : (1.15 + Math.random() * 15);
            
            let engine = setInterval(() => {
                mult += 0.03;
                document.getElementById('multiText').innerText = mult.toFixed(2) + "x";
                let x = mult * 25; let y = mult * 22;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 300 Q ${x/2} ${300-y} ${x+10} ${300-y-10}`);
                
                if(myBet.active) document.getElementById('mainBetBtn').querySelector('span').innerText = (myBet.amt * mult).toFixed(2) + " ETB";
                
                if(mult >= crashAt) { clearInterval(engine); crash(); }
            }, 80);
        }

        function crash() {
            isFlying = false;
            document.getElementById('sndFly').pause(); document.getElementById('sndFly').currentTime = 0;
            document.getElementById('sndCrash').play();
            document.getElementById('multiText').innerText = "FLEW AWAY!";
            document.getElementById('multiText').style.color = "#ff1e4d";
            
            history.unshift(mult.toFixed(2) + "x"); history.pop();
            renderHistory();
            if(myBet.active) { myBet.active = false; resetUI(); }
            
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 300 Q 0 300 0 300');
                document.getElementById('multiText').style.color = "white";
                startLoop();
            }, 3000);
        }

        function onBetClick() {
            let amt = parseInt(document.getElementById('betInput').value);
            if(!isFlying && !myBet.active) {
                if(amt > balance) return tg.showAlert("No Money!");
                balance -= amt; myBet = { active: true, amt: amt };
                document.getElementById('mainBetBtn').innerHTML = "WAITING...";
                document.getElementById('mainBetBtn').classList.replace('bg-[#28a745]', 'bg-red-900');
                save();
            } else if (isFlying && myBet.active) {
                balance += myBet.amt * mult;
                document.getElementById('sndMoney').play();
                myBet.active = false; resetUI(); save();
            }
        }

        function resetUI() {
            document.getElementById('mainBetBtn').className = "bg-[#28a745] flex-1 text-xl font-black rounded-xl";
            document.getElementById('mainBetBtn').innerHTML = `BET<br><span class="text-xs font-normal">${document.getElementById('betInput').value}.00 ETB</span>`;
        }

        function save() {
            localStorage.setItem('dawit_bal_v3', balance);
            document.getElementById('balDisplay').innerText = balance.toFixed(2);
        }

        function renderHistory() {
            document.getElementById('historyBar').innerHTML = history.map(v => `<span class="bg-gray-800 px-3 py-1 rounded-full text-[9px] font-bold text-blue-400">${v}</span>`).join('');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
        }

        init();
    </script>
</body>
</html>
