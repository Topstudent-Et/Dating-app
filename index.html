<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE AVIATOR V15 - PREMIUM EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;600;800&display=swap');
        
        :root { --primary: #ff0044; --secondary: #22c55e; --bg: #050505; --card: #0f0f0f; }
        body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; -webkit-tap-highlight-color: transparent; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Glassmorphism */
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .red-glow { box-shadow: 0 0 20px rgba(255, 0, 68, 0.2); }
        
        /* Game Screen */
        .aviator-screen { background: radial-gradient(circle at bottom left, #1a0505 0%, #000 100%); height: 230px; position: relative; border-radius: 24px; border: 1px solid #222; overflow: hidden; }
        #gamePath { stroke: var(--primary); stroke-width: 6; fill: none; filter: drop-shadow(0 0 12px var(--primary)); stroke-linecap: round; }
        .plane-jet { position: absolute; bottom: 20px; left: 20px; font-size: 45px; z-index: 100; filter: drop-shadow(0 0 10px var(--primary)); }
        
        /* Navigation */
        .nav-bar { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); position: fixed; bottom: 0; width: 100%; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #555; font-size: 10px; font-weight: 800; text-align: center; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }
        
        /* Pages */
        .page { display: none; height: calc(100vh - 75px); overflow-y: auto; padding: 16px; scroll-behavior: smooth; }
        .active-page { display: block; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Admin */
        .admin-view { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; }
        
        /* Utility */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .copy-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="no-scrollbar">

    <div id="adminPanel" class="admin-view">
        <div class="p-5 glass flex justify-between items-center">
            <h2 class="font-black text-xs text-red-500 italic tracking-widest">SYSTEM OVERRIDE</h2>
            <button onclick="closeAdmin()" class="bg-red-600/20 text-red-500 border border-red-500/30 px-5 py-2 rounded-full text-[10px] font-black uppercase">Close</button>
        </div>
        <div class="p-4 flex-1 overflow-y-auto space-y-6 pb-32 no-scrollbar">
            <div class="glass p-5 rounded-[30px]">
                <h3 class="text-[10px] font-black text-blue-500 mb-4 border-b border-white/5 pb-2 uppercase italic">Deposit Verification</h3>
                <div id="admReqList" class="space-y-4"></div>
            </div>
            <div class="glass p-5 rounded-[30px]">
                <h3 class="text-[10px] font-black text-orange-500 mb-4 border-b border-white/5 pb-2 uppercase italic">User Support</h3>
                <div id="admSupList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center sticky top-0 z-50 glass">
        <div class="flex items-center gap-3">
            <div id="hPfp" class="w-10 h-10 rounded-2xl border border-red-600/30 bg-red-950/20 flex items-center justify-center overflow-hidden"></div>
            <div>
                <h1 class="text-red-600 font-black italic text-xl leading-none font-game">AVIATOR</h1>
                <div class="flex gap-2 items-center mt-1">
                    <button onclick="toggleLang()" class="bg-white/5 px-2 py-0.5 rounded text-[8px] text-gray-400 font-black border border-white/5">ENG/አማር</button>
                    <p id="hUser" class="text-[9px] text-gray-500 font-bold">@Guest</p>
                </div>
            </div>
        </div>
        
        <div class="flex flex-col items-end gap-2">
            <div class="flex bg-black/40 rounded-full p-1 border border-white/5 w-28">
                <button id="demoBtn" onclick="switchMode(true)" class="flex-1 py-1 rounded-full text-[8px] font-black transition-all demo-active">DEMO</button>
                <button id="realBtn" onclick="switchMode(false)" class="flex-1 py-1 rounded-full text-[8px] font-black transition-all">REAL</button>
            </div>
            <div class="bg-white/5 px-4 py-1.5 rounded-2xl border border-white/5 flex items-center gap-2">
                <span id="hBal" class="text-white font-black text-sm">500.00</span>
                <span class="text-[8px] text-gray-500 font-black l-curr">ETB</span>
            </div>
        </div>
    </header>

    <section id="home" class="page active-page no-scrollbar">
        <div id="hist" class="flex gap-2 mb-4 overflow-x-auto no-scrollbar py-1"></div>
        
        <div id="gameArea" class="aviator-screen flex items-center justify-center red-glow">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 230 Q 0 230 0 230" /></svg>
            <div id="mTxt" class="font-game text-7xl italic text-white z-10 drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]">1.00x</div>
            <div id="plane" class="plane-jet">✈️</div>
            <div id="gStatus" class="absolute top-4 glass px-4 py-1 rounded-full text-[9px] text-gray-300 font-black uppercase l-waiting">Waiting...</div>
        </div>

        <div class="mt-6 grid grid-cols-2 gap-4">
            <div class="glass p-4 rounded-[28px]">
                <label class="text-[9px] text-gray-500 font-black block mb-2 l-amt uppercase tracking-widest">Stake Amount</label>
                <input id="bInp" type="number" value="10" class="w-full bg-transparent text-center font-black text-2xl py-1 outline-none">
                <div class="h-[1px] bg-white/5 my-2"></div>
                <input id="autoOut" type="number" step="0.1" placeholder="Auto Cashout" class="w-full bg-transparent text-center text-[11px] font-bold text-gray-400">
            </div>
            <button id="bBtn" onclick="hBet()" class="bg-red-600 rounded-[28px] text-3xl font-black italic shadow-[0_10px_30px_rgba(239,68,68,0.3)] l-bet transition-transform active:scale-95">BET</button>
        </div>

        <div class="mt-6 glass rounded-[30px] p-5 h-44 overflow-hidden relative">
            <div class="flex justify-between text-[9px] font-black text-gray-600 border-b border-white/5 pb-2 mb-3">
                <span>USER</span><span>BET</span><span>CASH OUT</span>
            </div>
            <div id="fList" class="space-y-3 text-[11px]"></div>
        </div>
    </section>

    <section id="deposit" class="page no-scrollbar">
        <div class="glass p-6 rounded-[35px] border-white/10 mb-6 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-500/10 blur-3xl rounded-full"></div>
            
            <div class="mb-8">
                <p class="text-[10px] text-yellow-500 font-black uppercase tracking-[3px] mb-3">Bank Transfer (CBE)</p>
                <div onclick="copyText('1000179571815')" class="flex items-center justify-between bg-black/40 p-4 rounded-2xl border border-white/5 copy-btn">
                    <span class="text-xl font-black tracking-widest">1000179571815</span>
                    <i class="fa-solid fa-copy text-yellow-500 text-lg"></i>
                </div>
            </div>

            <div>
                <p class="text-[10px] text-blue-500 font-black uppercase tracking-[3px] mb-3">Telebirr Wallet</p>
                <div onclick="copyText('0906067696')" class="flex items-center justify-between bg-black/40 p-4 rounded-2xl border border-white/5 copy-btn">
                    <span class="text-xl font-black tracking-widest">0906067696</span>
                    <i class="fa-solid fa-copy text-blue-500 text-lg"></i>
                </div>
            </div>
            <p class="text-center text-[9px] text-gray-600 mt-5 font-bold italic">Tap the account number to copy</p>
        </div>

        <div class="glass p-6 rounded-[35px] text-center border-dashed border-2 border-gray-800">
            <input type="file" id="ssInp" class="hidden" accept="image/*">
            <button onclick="document.getElementById('ssInp').click()" class="w-full bg-white/5 py-5 rounded-2xl text-[12px] font-black mb-4 uppercase tracking-wider border border-white/5"><i class="fa-solid fa-camera-retro mr-3 text-red-500"></i><span class="l-select">Select Receipt</span></button>
            
            <div id="previewBox" class="hidden mb-4 animate-bounce-in">
                <img id="ssPreview" class="rounded-2xl max-h-52 mx-auto border border-gray-700 shadow-2xl">
            </div>
            
            <button onclick="subSS()" class="w-full bg-red-600 py-5 rounded-[20px] font-black text-sm uppercase l-submit shadow-2xl shadow-red-900/40">Submit to Admin</button>
        </div>
    </section>

    <section id="leader" class="page no-scrollbar">
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 bg-yellow-500/10 rounded-full flex items-center justify-center mb-2">
                <i class="fa-solid fa-trophy text-yellow-500 text-3xl"></i>
            </div>
            <h2 class="text-2xl font-black italic l-top tracking-tighter">ELITE TOP 7500</h2>
        </div>
        <div id="lList" class="grid grid-cols-1 gap-3 pb-20 no-scrollbar"></div>
    </section>

    <section id="account" class="page no-scrollbar">
        <div class="flex flex-col items-center mb-8">
            <div id="accPfpMain" class="w-24 h-24 rounded-[35px] border-2 border-red-600/30 bg-red-950/20 flex items-center justify-center overflow-hidden mb-4 shadow-2xl"></div>
            <h2 id="accUserMain" class="text-2xl font-black italic tracking-tight">@User</h2>
        </div>
        
        <div class="glass p-6 rounded-[35px] mb-6">
            <h3 class="text-[11px] font-black text-blue-500 border-b border-white/5 pb-3 uppercase mb-5 l-support tracking-[2px]">Support Ticket</h3>
            <textarea id="supMsg" placeholder="How can we help?" class="w-full bg-black/40 border border-white/5 p-5 rounded-2xl text-xs h-32 outline-none mb-4 focus:border-blue-500/50 transition-all"></textarea>
            <button onclick="sendSupport()" class="w-full bg-blue-600 py-4 rounded-[18px] font-black text-xs uppercase l-send shadow-xl shadow-blue-900/20">Send Ticket</button>
        </div>

        <button onclick="tryAdm()" class="w-full py-4 rounded-2xl text-[9px] font-black uppercase text-gray-600 border border-white/5 bg-white/5">System Access</button>
    </section>

    <nav class="nav-bar">
        <div onclick="showP('home')" class="nav-item active" id="n-home"><i class="fa-solid fa-rocket text-2xl mb-1"></i><br><span class="l-nav-play">PLAY</span></div>
        <div onclick="showP('deposit')" class="nav-item" id="n-deposit"><i class="fa-solid fa-shield-heart text-2xl mb-1"></i><br><span class="l-nav-wallet">WALLET</span></div>
        <div onclick="showP('leader')" class="nav-item" id="n-leader"><i class="fa-solid fa-crown text-2xl mb-1"></i><br><span class="l-nav-top">TOP</span></div>
        <div onclick="showP('account')" class="nav-item" id="n-account"><i class="fa-solid fa-ghost text-2xl mb-1"></i><br><span class="l-nav-sup">HELP</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADMIN_UNAME = "Dawit_Fikadu21";
        let realBal = parseFloat(localStorage.getItem('v15_real_bal')) || 0;
        let demoBal = 500.00;
        let isDemo = true;
        let curLang = "EN";
        let userData = { uname: tg.initDataUnsafe?.user?.username || "Dai_Dev", photo: tg.initDataUnsafe?.user?.photo_url || null };

        const texts = {
            EN: { play: "PLAY", wallet: "WALLET", top: "TOP 7500", sup: "SUPPORT", wait: "Preparing...", amt: "STAKE", bet: "BET", select: "Select Receipt", submit: "Verify Deposit", send: "Send Ticket", support: "Support Center", curr: "ETB" },
            AMH: { play: "ተጫወት", wallet: "ኪስ", top: "7500 ምርጦች", sup: "እርዳታ", wait: "በመዘጋጀት ላይ...", amt: "መጠን", bet: "መድብ", select: "ደረሰኝ ምረጥ", submit: "ለአድሚን ላክ", send: "መልዕክት ላክ", support: "የደንበኞች አገልግሎት", curr: "ብር" }
        };

        function toggleLang() {
            curLang = curLang === "EN" ? "AMH" : "EN";
            const t = texts[curLang];
            document.querySelectorAll('.l-nav-play').forEach(e => e.innerText = t.play);
            document.querySelectorAll('.l-nav-wallet').forEach(e => e.innerText = t.wallet);
            document.querySelectorAll('.l-nav-top').forEach(e => e.innerText = t.top.split(' ')[0]);
            document.querySelectorAll('.l-nav-sup').forEach(e => e.innerText = t.sup);
            document.querySelector('.l-waiting').innerText = t.wait;
            document.querySelector('.l-amt').innerText = t.amt;
            document.querySelector('.l-bet').innerText = t.bet;
            document.querySelector('.l-select').innerText = t.select;
            document.querySelector('.l-submit').innerText = t.submit;
            document.querySelector('.l-send').innerText = t.send;
            document.querySelector('.l-support').innerText = t.support;
            document.querySelector('.l-top').innerText = t.top;
            document.querySelector('.l-curr').innerText = t.curr;
        }

        function init() {
            document.getElementById('hUser').innerText = "@" + userData.uname;
            document.getElementById('accUserMain').innerText = "@" + userData.uname;
            const pfp = userData.photo ? `<img src="${userData.photo}" class="w-full h-full object-cover">` : `<span class="text-xl font-black text-red-500">${userData.uname[0]}</span>`;
            document.getElementById('hPfp').innerHTML = pfp;
            document.getElementById('accPfpMain').innerHTML = pfp;

            document.getElementById('ssInp').onchange = (e) => {
                const r = new FileReader();
                r.onload = () => { document.getElementById('ssPreview').src = r.result; document.getElementById('previewBox').classList.remove('hidden'); };
                r.readAsDataURL(e.target.files[0]);
            };
            updateDisplay(); renderLeaders(); startLoop(); genFakes();
        }

        // ONE-TAP COPY WITH HAPTIC
        function copyText(text) {
            const el = document.createElement('textarea');
            el.value = text; document.body.appendChild(el);
            el.select(); document.execCommand('copy');
            document.body.removeChild(el);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert(`Copied: ${text} \n\nአካውንት ቁጥሩ ተገልብጧል!`);
        }

        // DEPOSIT TO ADMIN
        function subSS() {
            const file = document.getElementById('ssInp').files[0];
            if(!file) return tg.showAlert("Please select a screenshot!");
            const r = new FileReader();
            r.onload = () => {
                let ss = JSON.parse(localStorage.getItem('sys_v15_ss')) || [];
                ss.push({ user: userData.uname, img: r.result, time: new Date().toLocaleString() });
                localStorage.setItem('sys_v15_ss', JSON.stringify(ss));
                tg.showAlert("✅ Success! Your receipt is sent to the Admin Panel for verification.");
                document.getElementById('previewBox').classList.add('hidden');
                document.getElementById('ssInp').value = "";
            };
            r.readAsDataURL(file);
        }

        function sendSupport() {
            const msg = document.getElementById('supMsg').value;
            if(!msg) return tg.showAlert("Please write your message!");
            let sups = JSON.parse(localStorage.getItem('sys_v15_sup')) || [];
            sups.push({ user: userData.uname, msg: msg, time: new Date().toLocaleString() });
            localStorage.setItem('sys_v15_sup', JSON.stringify(sups));
            tg.showAlert("✅ Your support ticket has been created!");
            document.getElementById('supMsg').value = "";
        }

        // GAME LOGIC
        let flying = false; let mult = 1.00; let myB = { active: false, amt: 0 };
        let history = ["1.12x", "4.50x", "1.05x", "2.30x"];

        function startLoop() {
            if(flying) return;
            let w = 5;
            let t = setInterval(() => {
                document.getElementById('gStatus').innerText = `TAKEOFF IN ${w}S`;
                document.getElementById('mTxt').innerText = "1.00x";
                if(w-- <= 0) { clearInterval(t); launch(); }
            }, 1000);
        }

        function launch() {
            flying = true; mult = 1.00;
            let crashAt = 1.01 + (Math.random() * 9);
            let aOut = parseFloat(document.getElementById('autoOut').value);
            let engine = setInterval(() => {
                mult += 0.04;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 18, y = mult * 16;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 230 Q ${x/2} ${230-y} ${x+15} ${230-y-15}`);
                if(myB.active && aOut && mult >= aOut) cashOut();
                if(mult >= crashAt) { clearInterval(engine); crash(); }
            }, 80);
        }

        function crash() {
            flying = false; document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "#ff0044";
            history.unshift(mult.toFixed(2) + "x"); if(history.length > 8) history.pop();
            renderHistory(); myB.active = false; resetB();
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 230 Q 0 230 0 230');
                document.getElementById('mTxt').style.color = "white";
                startLoop();
            }, 3000);
        }

        function hBet() {
            if(flying && myB.active) return cashOut();
            let a = parseInt(document.getElementById('bInp').value);
            let cur = isDemo ? demoBal : realBal;
            if(a > cur) return tg.showAlert("Insufficient Funds!");
            if(isDemo) demoBal -= a; else { realBal -= a; localStorage.setItem('v15_real_bal', realBal); }
            myB = { active: true, amt: a };
            document.getElementById('bBtn').innerHTML = "CASH OUT";
            document.getElementById('bBtn').className = "bg-orange-600 rounded-[28px] text-2xl font-black italic shadow-xl";
            updateDisplay();
        }

        function cashOut() {
            if(!myB.active || !flying) return;
            let win = myB.amt * mult;
            if(isDemo) demoBal += win; else { realBal += win; localStorage.setItem('v15_real_bal', realBal); }
            myB.active = false; resetB(); updateDisplay();
            tg.showAlert("CONGRATS! WIN: " + win.toFixed(2) + " ETB");
        }

        function switchMode(demo) {
            isDemo = demo;
            document.getElementById('demoBtn').className = demo ? "flex-1 py-1 rounded-full text-[8px] font-black demo-active" : "flex-1 py-1 rounded-full text-[8px] font-black";
            document.getElementById('realBtn').className = !demo ? "flex-1 py-1 rounded-full text-[8px] font-black real-active" : "flex-1 py-1 rounded-full text-[8px] font-black";
            document.getElementById('gameArea').style.background = demo ? "radial-gradient(circle at bottom left, #1a0505 0%, #000 100%)" : "radial-gradient(circle at bottom left, #051a05 0%, #000 100%)";
            resetB(); updateDisplay();
        }

        function resetB() {
            const btnColor = isDemo ? "bg-red-600" : "bg-green-600";
            document.getElementById('bBtn').className = `${btnColor} rounded-[28px] text-3xl font-black italic l-bet`;
            document.getElementById('bBtn').innerHTML = texts[curLang].bet;
        }

        function updateDisplay() {
            document.getElementById('hBal').innerText = (isDemo ? demoBal : realBal).toFixed(2);
            document.getElementById('hBal').style.color = isDemo ? "#ef4444" : "#22c55e";
        }

        function renderHistory() { document.getElementById('hist').innerHTML = history.map(h => `<span class="bg-white/5 border border-white/5 px-3 py-1 rounded-full text-[9px] font-black tracking-tighter">${h}</span>`).join(''); }

        function renderLeaders() {
            const l = document.getElementById('lList'); l.innerHTML = "";
            let html = "";
            for(let i=1; i<=7500; i++) {
                let w = (50000 / (i*0.1) + Math.random()*200).toFixed(0);
                html += `<div class="glass p-4 rounded-2xl flex justify-between items-center"><div class="flex items-center gap-3"><span class="text-[10px] text-gray-600 font-black">#${i}</span><span class="text-xs font-bold tracking-tight">User_ID_${1000+i}</span></div><span class="text-green-500 font-black text-sm">${parseInt(w).toLocaleString()} <span class="text-[8px] text-gray-600">ETB</span></span></div>`;
                if(i % 500 === 0) { l.innerHTML += html; html = ""; }
            }
            l.innerHTML += html;
        }

        function genFakes() {
            const l = document.getElementById('fList'); l.innerHTML = "";
            for(let i=0; i<5; i++) {
                l.innerHTML += `<div class="flex justify-between items-center text-gray-500 font-semibold"><span class="text-white/80 italic">@Player_${Math.floor(Math.random()*99)}</span><span class="text-white">${(10+Math.random()*200).toFixed(0)}</span><span class="text-green-500">${(1.2+Math.random()*2).toFixed(2)}x</span></div>`;
            }
        }

        // ADMIN PANEL LOGIC
        function tryAdm() {
            if(userData.uname.toLowerCase() === ADMIN_UNAME.toLowerCase()) {
                const pin = prompt("Enter PIN:");
                if(pin === "215221") { document.getElementById('adminPanel').style.display = 'flex'; loadAdmin(); }
            }
        }
        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
        function loadAdmin() {
            const ss = JSON.parse(localStorage.getItem('sys_v15_ss')) || [];
            const sups = JSON.parse(localStorage.getItem('sys_v15_sup')) || [];
            document.getElementById('admReqList').innerHTML = ss.map((r, i) => `<div class="bg-black p-4 rounded-3xl border border-white/5"><p class="text-[10px] text-blue-500 mb-2">@${r.user} - ${r.time}</p><img src="${r.img}" class="w-full rounded-2xl mb-3"><div class="flex gap-2"><button onclick="approve(${i})" class="flex-1 bg-green-600 py-3 rounded-xl text-[10px] font-black">APPROVE</button><button onclick="reject(${i})" class="flex-1 bg-red-600 py-3 rounded-xl text-[10px] font-black">REJECT</button></div></div>`).join('') || '<p class="text-center text-[10px] text-gray-600">No requests</p>';
            document.getElementById('admSupList').innerHTML = sups.map(s => `<div class="bg-black p-4 rounded-3xl border border-white/5"><p class="text-orange-500 text-[9px]">@${s.user}</p><p class="text-xs text-gray-400 mt-1">${s.msg}</p></div>`).join('') || '<p class="text-center text-[10px] text-gray-600">No tickets</p>';
        }

        function approve(i) {
            let ss = JSON.parse(localStorage.getItem('sys_v15_ss'));
            let amt = prompt("Amount for @" + ss[i].user + "?");
            if(amt && !isNaN(amt)) {
                if(ss[i].user === userData.uname) { realBal += parseFloat(amt); localStorage.setItem('v15_real_bal', realBal); updateDisplay(); }
                ss.splice(i, 1); localStorage.setItem('sys_v15_ss', JSON.stringify(ss)); loadAdmin();
                tg.showAlert("Balance Updated!");
            }
        }
        function reject(i) {
            let ss = JSON.parse(localStorage.getItem('sys_v15_ss'));
            ss.splice(i, 1); localStorage.setItem('sys_v15_ss', JSON.stringify(ss)); loadAdmin();
        }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-' + id).classList.add('active');
        }

        init();
    </script>
</body>
</html>
