<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER V30 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #ff0044; --bg-glow: radial-gradient(circle at bottom left, #200505 0%, #000 100%); }
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; transition: 0.5s; }
        .real-mode { --accent: #22c55e; --bg-glow: radial-gradient(circle at bottom left, #052005 0%, #000 100%); }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* Navigation */
        .nav-top { position: fixed; top: 0; width: 100%; height: 65px; display: flex; justify-content: space-around; align-items: center; background: rgba(10,10,10,0.95); border-bottom: 1px solid #1a1a1a; z-index: 1000; }
        .nav-item { color: #444; font-size: 10px; font-weight: 800; text-align: center; }
        .nav-item.active { color: var(--accent); }

        .page { display: none; height: calc(100vh - 65px); margin-top: 65px; overflow-y: auto; padding: 15px; }
        .active-page { display: block; }

        /* Game Core */
        .screen { background: var(--bg-glow); height: 230px; position: relative; border-radius: 20px; overflow: hidden; border: 2px solid #1a1a1a; }
        #gamePath { stroke: var(--accent); stroke-width: 6; fill: none; filter: drop-shadow(0 0 10px var(--accent)); }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 40px; z-index: 10; transition: 0.1s linear; transform: rotate(-15deg); }
        
        .btn-main { background: var(--accent); transition: 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Input styling */
        .bet-control { display: flex; align-items: center; background: #111; border-radius: 15px; padding: 5px 15px; border: 1px solid #222; }
        input[type="number"] { background: transparent; border: none; outline: none; color: white; text-align: center; font-weight: 900; }
    </style>
</head>
<body class="no-scrollbar">

    <nav class="nav-top">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-plane text-xl mb-1"></i><br>PLAY</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-xl mb-1"></i><br>WALLET</div>
        <div onclick="showP('leaderboard')" id="n-leaderboard" class="nav-item"><i class="fa-solid fa-trophy text-xl mb-1"></i><br>TOP</div>
        <div onclick="showP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user-gear text-xl mb-1"></i><br>ADMIN</div>
    </nav>

    <section id="home" class="page active-page no-scrollbar">
        <div class="flex gap-2 mb-4">
            <button onclick="setMode(true)" id="mDemo" class="flex-1 py-3 rounded-xl font-black text-xs border-2 border-red-600 bg-red-600/20">DEMO MODE</button>
            <button onclick="setMode(false)" id="mReal" class="flex-1 py-3 rounded-xl font-black text-xs border-2 border-gray-800 text-gray-500">REAL MODE</button>
        </div>

        <div class="screen flex items-center justify-center mb-4">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 230 Q 0 230 0 230" /></svg>
            <div id="mTxt" class="font-game text-7xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane">✈️</div>
            <div id="gStatus" class="absolute top-3 glass px-4 py-1 rounded-full text-[9px] font-black text-gray-400 italic">READY TO FLY</div>
        </div>

        <div class="glass p-5 rounded-[25px] mb-4">
            <div class="flex justify-between items-center mb-4">
                <div class="bet-control w-full mr-2">
                    <button onclick="adjB(-10)" class="text-2xl font-black px-2">-</button>
                    <input id="bInp" type="number" value="10" class="text-2xl w-full">
                    <button onclick="adjB(10)" class="text-2xl font-black px-2">+</button>
                </div>
                <div class="grid grid-cols-3 gap-1">
                    <button onclick="setB(10)" class="bg-white/5 p-2 rounded-lg text-[9px] font-bold">10</button>
                    <button onclick="setB(40)" class="bg-white/5 p-2 rounded-lg text-[9px] font-bold">40</button>
                    <button onclick="setB(100)" class="bg-white/5 p-2 rounded-lg text-[9px] font-bold">100</button>
                </div>
            </div>
            <button id="bBtn" onclick="handleBet()" class="btn-main w-full py-5 rounded-2xl text-3xl font-black italic shadow-xl active:scale-95">BET</button>
        </div>

        <div class="glass rounded-2xl p-4 h-52 overflow-hidden flex flex-col">
            <h3 class="text-[10px] text-gray-500 font-black mb-2 uppercase">Live Bets (Ethiopia)</h3>
            <div id="liveList" class="space-y-2 overflow-y-auto no-scrollbar flex-1"></div>
        </div>
    </section>

    <section id="deposit" class="page no-scrollbar">
        <div class="glass p-5 rounded-[30px] mb-5 border-l-4 border-yellow-500">
            <h4 class="text-yellow-500 font-black text-xs mb-3">BANK TRANSFER (TAP TO COPY)</h4>
            <div onclick="copyT('1000179571815')" class="flex justify-between items-center bg-black p-4 rounded-xl mb-2">
                <span class="font-black">CBE: 1000179571815</span><i class="fa-solid fa-copy"></i>
            </div>
            <div onclick="copyT('0906067696')" class="flex justify-between items-center bg-black p-4 rounded-xl">
                <span class="font-black">Telebirr: 0906067696</span><i class="fa-solid fa-copy"></i>
            </div>
        </div>

        <div class="glass p-6 rounded-[35px] text-center border-2 border-dashed border-gray-700">
            <p class="text-xs font-black text-gray-400 mb-4">UPLOAD RECEIPT (ደረሰኝ ላክ)</p>
            <input type="file" id="ssInp" class="hidden" accept="image/*" onchange="previewImg(this)">
            <button onclick="document.getElementById('ssInp').click()" class="w-full bg-white/5 py-4 rounded-xl font-black mb-4">SELECT SCREENSHOT</button>
            <div id="prevBox" class="hidden mb-4"><img id="ssPrev" class="rounded-xl max-h-52 mx-auto"></div>
            <button id="submitBtn" onclick="submitReceipt()" class="btn-main w-full py-4 rounded-2xl font-black shadow-2xl">SEND TO ADMIN</button>
        </div>
    </section>

    <section id="profile" class="page no-scrollbar">
        <div id="admLock">
            <div class="p-10 text-center">
                <i class="fa-solid fa-lock text-5xl mb-5 text-gray-800"></i>
                <button onclick="checkAdm()" class="w-full py-4 bg-white/5 rounded-xl font-black">ENTER ADMIN PIN</button>
            </div>
        </div>
        <div id="admInterface" class="hidden p-2 space-y-4">
            <h2 class="text-red-600 font-black italic">V30 ADMIN DASHBOARD</h2>
            <div id="admContent" class="space-y-4"></div>
        </div>
    </section>

    <audio id="sndFly" loop src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="sndBoom" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        let isDemo = true;
        let realBal = parseFloat(localStorage.getItem('v30_real')) || 0;
        let demoBal = 500.00;
        let isFlying = false; let mult = 1.0; let myBet = { active: false, amt: 0 };
        const ADM_UNAME = "Dawit_Fikadu21";

        const names = ["አበበ","ከበደ","ጫልቱ","ዘነበች","ፋንቱ","ግርማ","ብስራት","ዮናስ","መሰረት","ሃይሉ","ራሄል","ኤልሳቤጥ"];

        function init() {
            setMode(true);
            loop();
        }

        // --- GAME ENGINE ---
        function loop() {
            if(isFlying) return;
            let timer = 5;
            let t = setInterval(() => {
                document.getElementById('gStatus').innerText = `NEXT FLIGHT IN ${timer}S`;
                if(timer-- <= 0) { clearInterval(t); launch(); }
                if(timer === 3) genPlayers();
            }, 1000);
        }

        function launch() {
            isFlying = true; mult = 1.0;
            document.getElementById('sndFly').play();
            // 40% Logic (High risk for big bets)
            let crash = 1.01 + (Math.random() * 7.0);
            if(myBet.active && myBet.amt >= 100) crash = 1.01 + (Math.random() * 0.8);

            let eng = setInterval(() => {
                mult += 0.06; // Speed
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 22, y = mult * 18;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px) rotate(-15deg)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 230 Q ${x/2} ${230-y} ${x+15} ${230-y-15}`);
                
                updatePlayers(mult);

                if(mult >= crash) { clearInterval(eng); boom(); }
            }, 80);
        }

        function boom() {
            isFlying = false;
            document.getElementById('sndFly').pause(); document.getElementById('sndFly').currentTime = 0;
            document.getElementById('sndBoom').play();
            document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "#ff0044";
            myBet.active = false; resetBUI();
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0) rotate(-15deg)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 230 Q 0 230 0 230');
                document.getElementById('mTxt').style.color = "white";
                loop();
            }, 3000);
        }

        // --- ACTIONS ---
        function handleBet() {
            if(isFlying) return myBet.active ? cashOut() : tg.showAlert("ዙሩ ጀምሯል!");
            let a = parseInt(document.getElementById('bInp').value);
            let cur = isDemo ? demoBal : realBal;
            if(a > cur || a <= 0) return tg.showAlert("ባላንስ የለህም!");
            
            if(isDemo) demoBal -= a; else { realBal -= a; localStorage.setItem('v30_real', realBal); }
            myBet = { active: true, amt: a };
            updateDisplay();
            document.getElementById('bBtn').innerText = "CASH OUT";
            document.getElementById('bBtn').style.background = "#ea580c";
        }

        function cashOut() {
            if(!myBet.active || !isFlying) return;
            let win = myBet.amt * mult;
            if(isDemo) demoBal += win; else { realBal += win; localStorage.setItem('v30_real', realBal); }
            myBet.active = false; resetBUI(); updateDisplay();
            tg.showAlert(`✅ WON: ${win.toFixed(2)} ETB`);
        }

        function setMode(demo) {
            isDemo = demo;
            document.body.classList.toggle('real-mode', !demo);
            document.getElementById('mDemo').className = demo ? "flex-1 py-3 rounded-xl font-black text-xs border-2 border-red-600 bg-red-600/20" : "flex-1 py-3 rounded-xl font-black text-xs border-2 border-gray-800 text-gray-500";
            document.getElementById('mReal').className = !demo ? "flex-1 py-3 rounded-xl font-black text-xs border-2 border-green-600 bg-green-600/20" : "flex-1 py-3 rounded-xl font-black text-xs border-2 border-gray-800 text-gray-500";
            updateDisplay();
        }

        // --- UTILS ---
        function updateDisplay() {
            let b = isDemo ? demoBal : realBal;
            document.querySelectorAll('.nav-item').forEach(n => n.style.color = "");
            document.querySelector('.nav-item.active').style.color = "var(--accent)";
        }
        function adjB(v) { let i = document.getElementById('bInp'); i.value = Math.max(10, parseInt(i.value) + v); }
        function setB(v) { document.getElementById('bInp').value = v; }
        function resetBUI() { document.getElementById('bBtn').innerText = "BET"; document.getElementById('bBtn').style.background = "var(--accent)"; }
        
        function genPlayers() {
            const list = document.getElementById('liveList'); list.innerHTML = "";
            for(let i=0; i<10; i++) {
                let name = names[Math.floor(Math.random()*names.length)] + "_" + Math.floor(Math.random()*99);
                let t = 1.1 + (Math.random()*4);
                list.innerHTML += `<div id="p-${i}" data-t="${t}" data-b="${Math.floor(Math.random()*400)+10}" class="flex justify-between text-[11px] font-bold text-gray-500 bg-white/5 p-2 rounded-lg"><span>${name}</span><span class="st">Waiting...</span></div>`;
            }
        }
        function updatePlayers(m) {
            document.querySelectorAll('#liveList div').forEach(el => {
                let t = parseFloat(el.getAttribute('data-t'));
                if(m >= t && el.querySelector('.st').innerText === "Waiting...") {
                    el.querySelector('.st').innerText = (parseFloat(el.getAttribute('data-b'))*t).toFixed(0) + " ETB";
                    el.querySelector('.st').className = "st text-green-500 font-black";
                }
            });
        }

        // --- ADMIN & PHOTO ---
        function previewImg(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => { document.getElementById('ssPrev').src = e.target.result; document.getElementById('prevBox').classList.remove('hidden'); };
                r.readAsDataURL(input.files[0]);
            }
        }
        function submitReceipt() {
            const f = document.getElementById('ssInp').files[0];
            if(!f) return tg.showAlert("እባክህ ፎቶ ምረጥ!");
            const r = new FileReader();
            r.onload = () => {
                let db = JSON.parse(localStorage.getItem('v30_db')) || [];
                db.push({ user: tg.initDataUnsafe?.user?.username || "Guest", img: r.result, time: new Date().toLocaleString() });
                localStorage.setItem('v30_db', JSON.stringify(db));
                tg.showAlert("✅ ደረሰኙ ለአድሚን ደርሷል!");
                document.getElementById('prevBox').classList.add('hidden');
                document.getElementById('ssInp').value = "";
            };
            r.readAsDataURL(f);
        }
        function checkAdm() { if(prompt("ADMIN PIN:") === "215221") { document.getElementById('admLock').classList.add('hidden'); document.getElementById('admInterface').classList.remove('hidden'); loadAdm(); } }
        function loadAdm() {
            const db = JSON.parse(localStorage.getItem('v30_db')) || [];
            document.getElementById('admContent').innerHTML = db.map((it, i) => `<div class="glass p-4 rounded-xl"><p class="text-[10px] mb-2">@${it.user} | ${it.time}</p><img src="${it.img}" class="w-full rounded-lg mb-2"><button onclick="approve(${i})" class="w-full bg-green-600 py-3 rounded-lg font-black uppercase">Approve</button></div>`).join('') || "No Pending Requests.";
        }
        function approve(i) {
            let db = JSON.parse(localStorage.getItem('v30_db'));
            let amt = prompt("Amount to add?");
            if(amt) { realBal += parseFloat(amt); localStorage.setItem('v30_real', realBal); updateDisplay(); }
            db.splice(i, 1); localStorage.setItem('v30_db', JSON.stringify(db)); loadAdm();
        }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-' + id).classList.add('active');
            updateDisplay();
        }
        function copyT(t) { const el = document.createElement('textarea'); el.value = t; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); tg.showAlert("✅ ኮፒ ተደርጓል!"); }

        init();
    </script>
</body>
</html>
