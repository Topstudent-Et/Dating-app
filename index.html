<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME V41 - ULTIMATE ADMIN EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Aviator Game Area */
        .game-area { position: relative; height: 260px; background: radial-gradient(circle at bottom left, #2a0505, #000 85%); border-radius: 25px; margin: 10px; border: 1px solid #222; overflow: hidden; }
        #multiplier { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font-size: 3.5rem; font-weight: 900; z-index: 10; font-family: 'Orbitron'; color: #fff; }
        #plane { position: absolute; font-size: 2.5rem; z-index: 30; filter: drop-shadow(0 0 10px #f00); transition: 0.1s linear; }

        /* Podium System */
        .podium-container { display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 160px; margin-top: 50px; }
        .podium-box { position: relative; display: flex; flex-direction: column; align-items: center; width: 30%; border-radius: 12px 12px 0 0; }
        .rank-1 { height: 130px; background: linear-gradient(180deg, #ffd70033, #000); border: 2px solid #ffd700; border-bottom: none; }
        .rank-2 { height: 100px; background: linear-gradient(180deg, #c0c0c033, #000); border: 2px solid #c0c0c0; border-bottom: none; }
        .rank-3 { height: 80px; background: linear-gradient(180deg, #cd7f3233, #000); border: 2px solid #cd7f32; border-bottom: none; }
        .crown-icon { position: absolute; top: -40px; font-size: 32px; filter: drop-shadow(0 0 8px #ffd700); }

        .bet-btn { background: linear-gradient(180deg, #28a745, #1e7e34); height: 55px; border-radius: 15px; font-weight: 900; width: 100%; border-bottom: 4px solid #145523; color: white; transition: 0.2s; }
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 110px; }
        .active-page { display: block; }
        .admin-only { display: none; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 10px 20px; border-radius: 50px; font-size: 11px; z-index: 9999; display: none; }
    </style>
</head>
<body>

    <div id="toast" class="toast">Action Success! ✅</div>

    <header class="flex justify-between items-center p-4 border-b border-zinc-900 bg-black sticky top-0 z-[1000]">
        <div class="flex items-center gap-2">
            <img id="hPic" src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full border border-zinc-800">
            <span id="hName" class="text-[10px] font-black uppercase truncate w-20">DAI</span>
        </div>
        <div class="bg-zinc-900 px-4 py-1.5 rounded-full border border-zinc-800 flex items-center gap-2">
            <span id="topBal" class="text-green-500 font-black text-sm">0.00</span>
            <i class="fas fa-coins text-yellow-500 text-[10px]"></i>
        </div>
    </header>

    <div id="playPage" class="page active-page">
        <div class="game-area">
            <div id="multiplier">1.00x</div>
            <div id="plane" style="left: 10%; bottom: 10%;">✈️</div>
            <div id="crashAlert" class="absolute inset-0 bg-black/95 hidden flex flex-col items-center justify-center z-50">
                <h1 id="crashVal" class="text-red-600 font-game text-5xl">1.00x</h1>
                <p id="timerText" class="text-white font-game text-3xl mt-2">5</p>
            </div>
        </div>
        <div class="px-4 space-y-3">
            <div class="flex gap-2"><input type="number" id="amt1" value="100" class="bg-zinc-900 w-full p-4 rounded-xl outline-none border border-zinc-800"><button id="btn1" onclick="handleBet(1)" class="bet-btn text-xs">BET</button></div>
            <div class="flex gap-2"><input type="number" id="amt2" value="200" class="bg-zinc-900 w-full p-4 rounded-xl outline-none border border-zinc-800"><button id="btn2" onclick="handleBet(2)" class="bet-btn text-xs">BET</button></div>
        </div>
    </div>

    <div id="walletPage" class="page p-5">
        <div class="flex gap-2 mb-6">
            <button onclick="setTab('dep')" id="tabDep" class="flex-1 h-12 rounded-xl font-black text-xs bg-blue-600">DEPOSIT</button>
            <button onclick="setTab('wit')" id="tabWit" class="flex-1 h-12 rounded-xl font-black text-xs bg-zinc-800">WITHDRAW</button>
        </div>
        <div id="depBox" class="space-y-4">
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <p class="text-[8px] text-blue-500 font-bold mb-2 uppercase">Official CBE Account</p>
                <div class="flex justify-between items-center" onclick="copyText('1000179571815', 'CBE')">
                    <p class="text-sm font-black">1000179571815</p>
                    <i class="fas fa-copy text-zinc-600"></i>
                </div>
            </div>
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 space-y-3">
                <input type="number" id="depAmt" placeholder="Amount (ETB)" class="bg-black w-full p-4 rounded-xl outline-none border border-zinc-800">
                <input type="text" id="depFT" placeholder="Transaction (FT) Number" class="bg-black w-full p-4 rounded-xl outline-none border border-zinc-800">
                <button onclick="submitToAdmin('Deposit')" class="w-full bg-blue-600 py-4 rounded-xl font-black text-xs uppercase">Submit to Admin</button>
                <p class="text-zinc-500 text-[8px] text-center italic">@Dawit_Fikadu21 will verify and add balance.</p>
            </div>
        </div>
        <div id="witBox" class="hidden space-y-4">
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 space-y-3">
                <input type="number" id="witAmt" placeholder="Withdraw Amount" class="bg-black w-full p-4 rounded-xl outline-none border border-zinc-800">
                <input type="text" id="witBank" placeholder="Bank Name & Account No" class="bg-black w-full p-4 rounded-xl outline-none border border-zinc-800">
                <button onclick="submitToAdmin('Withdraw')" class="w-full bg-orange-600 py-4 rounded-xl font-black text-xs uppercase">Request Payout</button>
            </div>
        </div>
    </div>

    <div id="topPage" class="page p-4">
        <div class="podium-container">
            <div class="podium-box rank-2"><span>🥈</span><p class="text-[9px] font-bold text-zinc-400">Yonas.K</p><p class="text-[10px] font-black">92,400</p></div>
            <div class="podium-box rank-1">
                <span class="crown-icon">👑</span>
                <p id="winnerName" class="text-[10px] font-black text-yellow-500 mt-1 uppercase">DAI</p>
                <p class="text-xs font-black">245,000</p>
            </div>
            <div class="podium-box rank-3"><span>🥉</span><p class="text-[9px] font-bold text-zinc-400">Betty.S</p><p class="text-[10px] font-black">61,200</p></div>
        </div>
        <div id="winnersList" class="mt-6 space-y-2 px-2"></div>
    </div>

    <div id="adminPage" class="page p-5">
        <h2 class="text-center font-black text-yellow-500 mb-6 uppercase">Admin Control Panel</h2>
        <div class="space-y-4" id="adminRequests">
            <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex justify-between items-center">
                <div>
                    <p class="text-[10px] text-zinc-400">User: Sample_Player</p>
                    <p class="text-xs font-black">FT: 987654321</p>
                    <p class="text-green-500 font-black text-xs">1,000 ETB</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="adminProcess('approve', 1000)" class="bg-green-600 p-2 px-3 rounded-lg text-[10px] font-black">APPROVE</button>
                    <button onclick="adminProcess('reject', 0)" class="bg-red-600 p-2 px-3 rounded-lg text-[10px] font-black">REJECT</button>
                </div>
            </div>
        </div>
    </div>

    <div id="profilePage" class="page p-10 text-center">
        <img id="uPic" src="https://via.placeholder.com/150" class="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-red-600">
        <h2 id="uName" class="font-black text-xl mb-6">PLAYER</h2>
        <div class="bg-zinc-900 p-6 rounded-3xl mb-6">
            <p id="pBal" class="text-4xl font-black text-green-500">0.00</p>
        </div>
        <button onclick="shareLink()" class="w-full bg-blue-600 py-4 rounded-xl font-black text-xs mb-3 uppercase">Invite & Earn 5 ETB</button>
        <button id="adminBtn" onclick="showPage('admin')" class="w-full bg-yellow-600 py-4 rounded-xl font-black text-xs uppercase admin-only">Open Admin Panel</button>
    </div>

    <nav class="fixed bottom-0 w-full h-20 bg-black border-t border-zinc-900 flex justify-around items-center z-[2000] pb-5">
        <div onclick="showPage('play')" id="n-play" class="text-red-600 flex flex-col items-center"><i class="fas fa-play"></i><span class="text-[8px] mt-1">PLAY</span></div>
        <div onclick="showPage('wallet')" id="n-wallet" class="flex flex-col items-center"><i class="fas fa-wallet"></i><span class="text-[8px] mt-1">WALLET</span></div>
        <div onclick="showPage('top')" id="n-top" class="flex flex-col items-center"><i class="fas fa-trophy"></i><span class="text-[8px] mt-1">TOP</span></div>
        <div onclick="showPage('profile')" id="n-profile" class="flex flex-col items-center"><i class="fas fa-user-circle"></i><span class="text-[8px] mt-1">ME</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        // እዚህ ጋር ያንተን Telegram ID አስገባ (ለምሳሌ 12345678)
        const ADMIN_ID = 12345678; 
        let user = tg.initDataUnsafe.user || { id: 12345678, first_name: "DAI" };
        let db = JSON.parse(localStorage.getItem('world_v41')) || { bal: 0.0 };
        let curM = 1.0, isFlying = false, myBets = [null, null];

        function startEngine() {
            curM = 1.0; isFlying = true;
            document.getElementById('crashAlert').classList.add('hidden');
            let target = 1.00 + Math.random() * 5.0;
            let loop = setInterval(() => {
                curM += 0.05;
                document.getElementById('multiplier').innerText = curM.toFixed(2) + "x";
                document.getElementById('plane').style.left = (10 + (curM-1)*15) + "%";
                document.getElementById('plane').style.bottom = (10 + (curM-1)*10) + "%";
                if(curM >= target) { clearInterval(loop); crash(); }
            }, 100);
        }

        function crash() {
            isFlying = false;
            document.getElementById('crashVal').innerText = curM.toFixed(2) + "x";
            document.getElementById('crashAlert').classList.remove('hidden');
            let time = 5;
            let timer = setInterval(() => {
                time--; document.getElementById('timerText').innerText = time;
                if(time <= 0) { clearInterval(timer); myBets = [null, null]; startEngine(); }
            }, 1000);
        }

        function handleBet(id) {
            let amt = parseFloat(document.getElementById('amt'+id).value);
            if(!isFlying && db.bal >= amt) {
                db.bal -= amt; myBets[id-1] = amt; refresh();
            } else if(isFlying && myBets[id-1]) {
                db.bal += (myBets[id-1] * curM); myBets[id-1] = null; refresh();
            }
        }

        function submitToAdmin(type) {
            const amt = type === 'Deposit' ? document.getElementById('depAmt').value : document.getElementById('witAmt').value;
            const ref = type === 'Deposit' ? document.getElementById('depFT').value : document.getElementById('witBank').value;
            const msg = encodeURIComponent(`${type.toUpperCase()} REQUEST:\nUser: ${user.first_name}\nID: ${user.id}\nAmount: ${amt} ETB\nRef: ${ref}`);
            tg.openTelegramLink(`https://t.me/Dawit_Fikadu21?text=${msg}`);
            showToast("Sent to Admin! ✅");
        }

        function adminProcess(action, amount) {
            if(action === 'approve') { db.bal += amount; refresh(); showToast("Approved! ✅"); }
            else { showToast("Rejected! ❌", "#ef4444"); }
        }

        function refresh() {
            document.getElementById('topBal').innerText = db.bal.toFixed(2);
            document.getElementById('pBal').innerText = db.bal.toFixed(2);
            localStorage.setItem('world_v41', JSON.stringify(db));
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active-page'));
            document.getElementById(p+'Page').classList.add('active-page');
            document.querySelectorAll('nav div').forEach(el => el.classList.remove('text-red-600'));
            if(document.getElementById('n-'+p)) document.getElementById('n-'+p).classList.add('text-red-600');
        }

        function setTab(t) {
            document.getElementById('depBox').classList.toggle('hidden', t !== 'dep');
            document.getElementById('witBox').classList.toggle('hidden', t !== 'wit');
            document.getElementById('tabDep').className = t === 'dep' ? 'flex-1 h-12 rounded-xl bg-blue-600 text-[10px] font-black' : 'flex-1 h-12 rounded-xl bg-zinc-800 text-[10px] font-black';
            document.getElementById('tabWit').className = t === 'wit' ? 'flex-1 h-12 rounded-xl bg-orange-600 text-[10px] font-black' : 'flex-1 h-12 rounded-xl bg-zinc-800 text-[10px] font-black';
        }

        function showToast(m, bg="#22c55e") {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.background = bg; t.style.display = 'block';
            setTimeout(() => t.style.display='none', 2500);
        }

        function shareLink() {
            const url = `https://t.me/world_all_gamesbot?start=${user.id}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=Join and earn 5 ETB reward!`);
        }

        function copyText(t, name) {
            navigator.clipboard.writeText(t);
            showToast(name + " Copied! ✅");
        }

        window.onload = () => {
            document.getElementById('hName').innerText = user.first_name;
            document.getElementById('uName').innerText = user.first_name;
            document.getElementById('winnerName').innerText = user.first_name;
            if(user.id === ADMIN_ID) document.getElementById('adminBtn').style.display = 'block';
            
            const list = document.getElementById('winnersList');
            ["Dawit.F", "Hana.G", "Miki.Y"].forEach((n, i) => {
                list.innerHTML += `<div class="bg-zinc-900/50 p-3 rounded-xl flex justify-between text-[10px] border border-zinc-800">
                    <span class="text-zinc-500 font-bold">#${i+4} ${n}</span>
                    <span class="text-green-500 font-black">${(2000 + Math.random()*3000).toFixed(0)} ETB</span></div>`;
            });
            refresh(); startEngine();
        };
    </script>
</body>
</html>
