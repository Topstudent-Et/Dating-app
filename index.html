<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game - አቪዬተር</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #0a0a1f;
            color: #fff;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 184, 148, 0.5);
        }
        h1 {
            color: #00b894;
            margin-bottom: 10px;
        }
        .game-area {
            position: relative;
            height: 400px;
            background: linear-gradient(#0a1f3d, #1a3a5f);
            border: 4px solid #00b894;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
        }
        .plane {
            position: absolute;
            font-size: 60px;
            transition: all 0.1s linear;
            left: 80px;
            top: 200px;
        }
        .multiplier {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        .bet-btn {
            background: #00b894;
            color: white;
        }
        .cashout-btn {
            background: #ff4757;
            color: white;
            display: none;
        }
        .info {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .history {
            margin-top: 20px;
        }
        .history-items {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .crash-item {
            padding: 8px 15px;
            background: rgba(255,71,87,0.3);
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ AVIATOR GAME ✈️</h1>
        <p>በጊዜው ገንዘብህን አውጣ! አውሮፕላኑ ከመበረሩ በፊት</p>

        <div class="game-area" id="gameArea">
            <div class="multiplier" id="multiplier">1.00x</div>
            <div class="plane" id="plane">✈️</div>
        </div>

        <div class="info">
            <div>ተጫዋች ቁጥር: <strong id="betAmount">100</strong> ብር</div>
            <div>የአሁኑ Multiplier: <strong id="currentMult">1.00x</strong></div>
        </div>

        <div class="controls">
            <button class="bet-btn" id="startBtn">ጨዋታ ጀምር</button>
            <button class="cashout-btn" id="cashoutBtn">ገንዘብ አውጣ (<span id="cashoutValue">1.00x</span>)</button>
        </div>

        <div class="history">
            <h3>የቀድሞ ውጤቶች</h3>
            <div class="history-items" id="history"></div>
        </div>
    </div>

    <script>
        let multiplier = 1.00;
        let isFlying = false;
        let animationFrame;
        let crashPoint = 0;
        let bet = 100;
        let winnings = 0;

        const multiplierEl = document.getElementById('multiplier');
        const planeEl = document.getElementById('plane');
        const startBtn = document.getElementById('startBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const cashoutValueEl = document.getElementById('cashoutValue');
        const historyEl = document.getElementById('history');

        function generateCrashPoint() {
            // ቀላል ራንደም (እውነተኛ ጨዋታ ውስጥ provably fair ነው)
            const rand = Math.random();
            if (rand < 0.4) return 1.2 + Math.random() * 1.5;      // ቀደም ብሎ መበረር
            if (rand < 0.75) return 2 + Math.random() * 5;
            return 1.5 + Math.random() * 20;                       // ከፍተኛ multiplier
        }

        function startGame() {
            if (isFlying) return;
            
            isFlying = true;
            multiplier = 1.00;
            crashPoint = generateCrashPoint();
            
            startBtn.style.display = 'none';
            cashoutBtn.style.display = 'inline-block';
            cashoutValueEl.textContent = '1.00x';
            
            // አውሮፕላን ቀስ ብሎ ወደ ላይ ይውጣ
            let height = 200;
            planeEl.style.top = height + 'px';
            
            function animate() {
                if (!isFlying) return;
                
                multiplier += 0.02 + (multiplier * 0.008);  // ፍጥነት ይጨምራል
                
                if (multiplier >= crashPoint) {
                    crashPlane();
                    return;
                }
                
                multiplierEl.textContent = multiplier.toFixed(2) + 'x';
                cashoutValueEl.textContent = multiplier.toFixed(2) + 'x';
                
                // አውሮፕላኑ ወደ ላይ ይውጣ
                height = Math.max(30, 200 - (multiplier * 8));
                planeEl.style.top = height + 'px';
                
                animationFrame = requestAnimationFrame(animate);
            }
            
            animate();
        }

        function cashOut() {
            if (!isFlying) return;
            
            isFlying = false;
            cancelAnimationFrame(animationFrame);
            
            winnings = Math.floor(bet * multiplier);
            
            alert(`🎉 ተሳክቷል! ትርፍህ: \( {winnings} ብር ( \){multiplier.toFixed(2)}x)`);
            
            addToHistory(multiplier.toFixed(2));
            resetGame();
        }

        function crashPlane() {
            isFlying = false;
            cancelAnimationFrame(animationFrame);
            
            multiplierEl.style.color = '#ff4757';
            multiplierEl.textContent = crashPoint.toFixed(2) + 'x 💥 CRASH!';
            planeEl.style.transition = 'all 0.6s';
            planeEl.style.top = '350px';
            planeEl.style.transform = 'rotate(45deg)';
            
            setTimeout(() => {
                alert(`💥 አውሮፕላኑ ተበረረ! ተሸንፈሃል.`);
                addToHistory(crashPoint.toFixed(2) + ' CRASH');
                resetGame();
            }, 800);
        }

        function resetGame() {
            multiplier = 1.00;
            multiplierEl.style.color = '#ffd700';
            multiplierEl.textContent = '1.00x';
            planeEl.style.transition = 'all 0.1s linear';
            planeEl.style.top = '200px';
            planeEl.style.transform = 'rotate(0deg)';
            
            startBtn.style.display = 'inline-block';
            cashoutBtn.style.display = 'none';
        }

        function addToHistory(mult) {
            const item = document.createElement('div');
            item.className = 'crash-item';
            item.textContent = mult + 'x';
            if (mult.includes('CRASH')) item.style.background = 'rgba(255, 71, 87, 0.6)';
            historyEl.prepend(item);
            
            // ከ10 በላይ ከሆነ የድሮውን አስወግድ
            if (historyEl.children.length > 10) {
                historyEl.removeChild(historyEl.lastChild);
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        cashoutBtn.addEventListener('click', cashOut);

        // የመጀመሪያ ታሪክ
        addToHistory('2.34');
        addToHistory('1.45');
        addToHistory('8.92');
        addToHistory('1.12 CRASH');

        console.log("%cAviator Game ተዘጋጅቷል! ✈️ በጥንቃቄ ጫወት", "color:#00b894; font-size:18px;");
    </script>
</body>
</html>
