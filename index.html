<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Games PRO</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root { --gold:#ffcc00; --bg:#0b0b0d; --card:#16171b; }
body { margin:0; background:var(--bg); color:white; font-family:sans-serif; }

.header { display:flex; justify-content:space-between; padding:10px; background:#16171b; }
.balance { color:var(--gold); }

.page { display:none; padding:15px; }
.active { display:block; }

.btn { background:var(--gold); padding:10px; border:none; width:100%; margin-top:10px; }

.nav { position:fixed; bottom:0; width:100%; display:flex; background:#16171b; }
.nav div { flex:1; text-align:center; padding:10px; }

.card { background:var(--card); padding:15px; margin:10px 0; }
</style>
</head>

<body>

<div class="header">
<div id="name">User</div>
<div class="balance"><span id="bal">0</span> ETB</div>
</div>

<div id="home" class="page active">
<h3>Games</h3>

<div class="card" onclick="show('aviator')">✈️ Aviator</div>
<div class="card" onclick="show('bingo')">🎰 Bingo</div>
<div class="card" onclick="show('spin')">🎡 Spin</div>

</div>

<div id="aviator" class="page">
<h3>Aviator</h3>
<input id="bet" placeholder="Bet">
<button class="btn" onclick="start()">Start</button>
<button class="btn" onclick="cashout()">Cashout</button>
<div id="mult">1.00x</div>
</div>

<div id="bingo" class="page">
<h3>Bingo</h3>
<input id="bbet">
<button class="btn" onclick="bingo()">Play</button>
</div>

<div id="spin" class="page">
<h3>Spin</h3>
<button class="btn" onclick="spin()">Spin</button>
</div>

<div id="deposit" class="page">
<h3>Deposit</h3>
<p>Telebirr: 0906067696</p>
<input type="file">
<button class="btn" onclick="deposit()">Submit</button>
</div>

<div id="withdraw" class="page">
<h3>Withdraw</h3>
<input id="wamt" placeholder="Amount">
<input id="wacc" placeholder="Telebirr">
<button class="btn" onclick="withdraw()">Withdraw</button>
</div>

<div id="profile" class="page">
<h3>Profile</h3>
<p id="refLink"></p>
</div>

<div class="nav">
<div onclick="show('home')">Games</div>
<div onclick="show('deposit')">Deposit</div>
<div onclick="show('withdraw')">Withdraw</div>
<div onclick="show('profile')">Profile</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let user = new URLSearchParams(location.search);
let id = user.get("id") || "1";
let name = user.get("name") || "Player";

document.getElementById("name").innerText = name;

let balance = parseFloat(localStorage.getItem("bal_"+id));

if(!balance){
    balance = 20;
    alert("🎁 Bonus 20 ETB");
}

function save(){
    localStorage.setItem("bal_"+id, balance);
    document.getElementById("bal").innerText = balance.toFixed(2);
}
save();

function show(p){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

//// AVIATOR
let running=false, multi=1, bet=0, interval;

function start(){
bet=parseFloat(document.getElementById("bet").value);
if(bet>balance) return alert("No balance");

balance-=bet;
save();

multi=1;
running=true;

interval=setInterval(()=>{
multi+=0.05;
document.getElementById("mult").innerText=multi.toFixed(2)+"x";

if(Math.random()<0.02){
clearInterval(interval);
running=false;
alert("💥 Lost");
}
},100);
}

function cashout(){
if(!running) return;
clearInterval(interval);

let win=bet*multi;
balance+=win;
save();

alert("✅ Win "+win);
running=false;
}

//// BINGO
function bingo(){
let b=parseFloat(document.getElementById("bbet").value);
if(b>balance) return;

balance-=b;

if(Math.random()<0.3){
let win=b*3;
balance+=win;
alert("Win "+win);
}else{
alert("Lose");
}
save();
}

//// SPIN
function spin(){
let win=Math.random()<0.5?10:0;
balance+=win;
alert(win? "Win 10":"Lose");
save();
}

//// WITHDRAW
function withdraw(){
let amt=parseFloat(document.getElementById("wamt").value);
let acc=document.getElementById("wacc").value;

if(amt>balance) return alert("Low");

tg.sendData(JSON.stringify({
type:"withdraw",
amount:amt,
acc:acc
}));

alert("Sent");
}

//// DEPOSIT
function deposit(){
tg.sendData(JSON.stringify({type:"deposit"}));
alert("Sent");
}

//// REFERRAL
let refLink="https://t.me/yourbot?start="+id;
document.getElementById("refLink").innerText=refLink;

//// DAILY BONUS
let last=localStorage.getItem("daily");
if(!last || Date.now()-last>86400000){
balance+=5;
localStorage.setItem("daily",Date.now());
alert("🎁 Daily 5 ETB");
save();
}

</script>

</body>
</html>
