<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dating App - Registration</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .hidden { display: none; }
    .form-section { max-width: 400px; margin: 40px auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    label { display: block; margin-top: 12px; }
    select, input { width: 100%; padding: 6px; margin-top: 4px; }
    .lang-btns { text-align: center; margin-bottom: 20px; }
    .lang-btns button { margin: 0 10px; font-size: 16px; }
  </style>
</head>
<body>

  <!-- 1. Language Selector -->
  <div class="form-section" id="language-section">
    <h2>ቋንቋ ምረጥ | Choose Language</h2>
    <div class="lang-btns">
      <button onclick="selectLanguage('am')">አማርኛ</button>
      <button onclick="selectLanguage('en')">English</button>
    </div>
  </div>

  <!-- 2. Registration Form -->
  <form id="register-form" class="form-section hidden" onsubmit="showNext(event)">
    <h2 id="reg-title">መመዝገብ</h2>
    <label id="lbl-name" for="name">ስም</label>
    <input type="text" id="name" name="name" required>

    <label id="lbl-email" for="email">ኢሜይል</label>
    <input type="email" id="email" name="email" required>

    <label id="lbl-pass" for="password">የይለፍ ቃል</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" id="reg-btn">መመዝገብ</button>
  </form>

  <!-- 3. Next Info Form -->
  <form id="more-form" class="form-section hidden" onsubmit="submitAll(event)">
    <h2 id="more-title">ቀጣይ መረጃ</h2>
    <label id="lbl-gender" for="gender">ፆታ</label>
    <select id="gender" name="gender" required>
      <option value="" disabled selected></option>
      <option value="male" id="opt-male">ወንድ</option>
      <option value="female" id="opt-female">ሴት</option>
      <option value="other" id="opt-other">ሌላ</option>
    </select>

    <label id="lbl-age" for="age">እድሜ</label>
    <input type="number" id="age" name="age" required min="18" max="100">

    <label id="lbl-city" for="city">ከተማ</label>
    <input type="text" id="city" name="city" required>

    <button type="submit" id="more-btn">አቀርብ</button>
  </form>

  <div id="done-section" class="form-section hidden" style="text-align:center;">
    <h2 id="done-msg">በትክክል ተመዝግበዋል!</h2>
  </div>

  <script>
    // Language data
    const langData = {
      am: {
        regTitle: 'መመዝገብ',
        lblName: 'ስም',
        lblEmail: 'ኢሜይል',
        lblPass: 'የይለፍ ቃል',
        regBtn: 'መመዝገብ',
        moreTitle: 'ቀጣይ መረጃ',
        lblGender: 'ፆታ',
        optMale: 'ወንድ',
        optFemale: 'ሴት',
        optOther: 'ሌላ',
        lblAge: 'እድሜ',
        lblCity: 'ከተማ',
        moreBtn: 'አቀርብ',
        doneMsg: 'በትክክል ተመዝግበዋል!',
      },
      en: {
        regTitle: 'Register',
        lblName: 'Name',
        lblEmail: 'Email',
        lblPass: 'Password',
        regBtn: 'Register',
        moreTitle: 'More Information',
        lblGender: 'Gender',
        optMale: 'Male',
        optFemale: 'Female',
        optOther: 'Other',
        lblAge: 'Age',
        lblCity: 'City',
        moreBtn: 'Submit',
        doneMsg: 'Registration Complete!',
      }
    };
    let currentLang = 'am';

    function selectLanguage(lang) {
      currentLang = lang;
      document.getElementById('language-section').classList.add('hidden');
      document.getElementById('register-form').classList.remove('hidden');
      // Set language
      setFormLanguage();
    }

    function setFormLanguage() {
      let l = langData[currentLang];
      document.getElementById('reg-title').innerText = l.regTitle;
      document.getElementById('lbl-name').innerText = l.lblName;
      document.getElementById('lbl-email').innerText = l.lblEmail;
      document.getElementById('lbl-pass').innerText = l.lblPass;
      document.getElementById('reg-btn').innerText = l.regBtn;

      document.getElementById('more-title').innerText = l.moreTitle;
      document.getElementById('lbl-gender').innerText = l.lblGender;
      document.getElementById('opt-male').innerText = l.optMale;
      document.getElementById('opt-female').innerText = l.optFemale;
      document.getElementById('opt-other').innerText = l.optOther;
      document.getElementById('lbl-age').innerText = l.lblAge;
      document.getElementById('lbl-city').innerText = l.lblCity;
      document.getElementById('more-btn').innerText = l.moreBtn;
      document.getElementById('done-msg').innerText = l.doneMsg;
    }

    function showNext(e) {
      e.preventDefault();
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('more-form').classList.remove('hidden');
    }

    function submitAll(e) {
      e.preventDefault();
      document.getElementById('more-form').classList.add('hidden');
      document.getElementById('done-section').classList.remove('hidden');
      // Here you could collect all info and send it to backend if needed
    }
  </script>

</body>
</html>
