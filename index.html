<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME - ULTIMATE PERSISTENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; -webkit-user-select: none; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        .game-screen { position: relative; height: 180px; background: radial-gradient(circle at bottom, #2a0000 0%, #000 100%); border-radius: 20px; border: 1px solid #400; overflow: hidden; margin-bottom: 10px; }
        #plane { position: absolute; z-index: 100; font-size: 2rem; transition: transform 0.1s linear; }
        
        .nav-dock { position: fixed; bottom: 0; width: 100%; background: #080808; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 1000; }
        .page { display: none; min-height: 100vh; padding-bottom: 90px; }
        .page.active { display: block; }
        
        .btn-bet { background: #28a745; border-bottom: 4px solid #14532d; border-radius: 12px; font-weight: 900; height: 70px; transition: 0.1s; width: 100%; }
        .btn-bet.active { background: #15803d; border-bottom: none; transform: translateY(3px); }
        .amt-btn { background: #111; border: 1px solid #333; font-size: 11px; font-weight: 800; border-radius: 8px; padding: 10px 0; }
        .amt-btn.selected { background: #2563eb; border-color: #3b82f6; box-shadow: 0 0 10px #2563eb; }
        
        .pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }
    </style>
</head>
<body>

    <div class="flex justify-between items-center px-4 py-3 bg-zinc-950 border-b border-zinc-900 sticky top-0 z-50">
        <div class="text-red-600 font-black text-xl italic font-game">WORLD GAME</div>
        <div class="bg-zinc-900 px-3 py-1 rounded-full border border-zinc-800 flex items-center gap-2">
            <span id="topBal" class="text-green-500 font-bold">0.00</span>
            <span class="text-[9px] text-zinc-400 font-black uppercase">ETB</span>
        </div>
    </div>

    <div id="playPage" class="page active px-2">
        <div id="adminMonitor" class="hidden bg-red-900/20 p-2 rounded-xl border border-red-900/30 mb-2 flex justify-between items-center text-[10px]">
            <span class="font-bold">LIVE POOL: <span id="monitorStake" class="text-white">0.00</span> ETB</span>
            <button onclick="forceCrash()" class="bg-red-600 px-3 py-1 rounded-lg font-black uppercase">Force Crash</button>
        </div>

        <div id="historyBar" class="flex gap-1 overflow-x-auto py-1 mb-1 no-scrollbar text-[10px] font-bold"></div>

        <div class="game-screen flex items-center justify-center">
            <div id="multDisplay" class="text-5xl font-black font-game z-50">1.00x</div>
            <div id="crashMsg" class="hidden absolute z-50 text-red-600 font-black text-3xl font-game">FLEW AWAY!</div>
            <svg class="absolute inset-0 w-full h-full pointer-events-none">
                <path id="pathLine" d="" fill="none" stroke="#ff0000" stroke-width="4"/>
                <path id="pathFill" d="" fill="url(#grad)" opacity="0.3"/>
                <defs><linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#f00"/><stop offset="100%" style="stop-color:transparent"/></linearGradient></defs>
            </svg>
            <div id="plane" style="left:10%; bottom:10%;">✈️</div>
        </div>

        <div class="grid grid-cols-1 gap-2">
            <div class="bg-zinc-900/50 p-3 rounded-2xl border border-zinc-800 flex gap-2">
                <div class="w-1/3 grid grid-cols-2 gap-1">
                    <button onclick="setBet(1,10)" id="v1-10" class="amt-btn selected">10</button>
                    <button onclick="setBet(1,50)" id="v1-50" class="amt-btn">50</button>
                    <button onclick="setBet(1,100)" id="v1-100" class="amt-btn">100</button>
                    <button onclick="setBet(1,250)" id="v1-250" class="amt-btn">250</button>
                </div>
                <div class="w-2/3">
                    <button id="btn1" onclick="handleBet(1)" class="btn-bet text-white">BET<br><span id="sub1" class="text-[10px] opacity-60">10.00 ETB</span></button>
                </div>
            </div>
            <div class="bg-zinc-900/50 p-3 rounded-2xl border border-zinc-800 flex gap-2">
                <div class="w-1/3 grid grid-cols-2 gap-1">
                    <button onclick="setBet(2,10)" id="v2-10" class="amt-btn selected">10</button>
                    <button onclick="setBet(2,50)" id="v2-50" class="amt-btn">50</button>
                    <button onclick="setBet(2,100)" id="v2-100" class="amt-btn">100</button>
                    <button onclick="setBet(2,250)" id="v2-250" class="amt-btn">250</button>
                </div>
                <div class="w-2/3">
                    <button id="btn2" onclick="handleBet(2)" class="btn-bet text-white">BET<br><span id="sub2" class="text-[10px] opacity-60">10.00 ETB</span></button>
                </div>
            </div>
        </div>
    </div>

    <div id="topPage" class="page p-5">
        <h2 class="text-center font-game text-yellow-500 text-2xl mb-8 italic">TOP WINNERS</h2>
        <div id="winnersList" class="space-y-2 h-[450px] overflow-y-auto no-scrollbar"></div>
    </div>

    <div id="walletPage" class="page p-5">
        <div class="flex gap-2 mb-6">
            <button onclick="toggleW('D')" id="dBtn" class="flex-1 py-4 bg-green-600 rounded-xl font-black">DEPOSIT</button>
            <button onclick="toggleW('W')" id="wBtn" class="flex-1 py-4 bg-zinc-900 rounded-xl font-black text-zinc-500">WITHDRAW</button>
        </div>
        <div id="dSec" class="space-y-3">
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <p class="text-[10px] text-zinc-500 uppercase">CBE ACCOUNT</p>
                <div class="flex justify-between items-center"><span id="cbeAcc" class="font-black">1000179571815</span><i class="fas fa-copy" onclick="copy('cbeAcc')"></i></div>
            </div>
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <p class="text-[10px] text-zinc-500 uppercase">TELEBIRR</p>
                <div class="flex justify-between items-center"><span id="teleAcc" class="font-black">0906067696</span><i class="fas fa-copy" onclick="copy('teleAcc')"></i></div>
            </div>
            <input type="number" id="dAmt" placeholder="Amount" class="w-full bg-zinc-950 p-4 rounded-xl border border-zinc-800">
            <input type="text" id="dRef" placeholder="Ref/Transaction ID" class="w-full bg-zinc-950 p-4 rounded-xl border border-zinc-800">
            <button onclick="reqAction('DEP')" class="w-full bg-blue-600 py-4 rounded-xl font-black">SUBMIT DEPOSIT</button>
        </div>
        <div id="wSec" class="hidden space-y-3 text-center">
            <div class="p-6"><p class="text-xs text-zinc-500">AVAILABLE</p><p id="wBal" class="text-4xl font-black text-green-500">0.00</p></div>
            <input type="number" id="wAmt" placeholder="Amount" class="w-full bg-zinc-950 p-4 rounded-xl border border-zinc-800">
            <input type="text" id="wAcc" placeholder="Account Number" class="w-full bg-zinc-950 p-4 rounded-xl border border-zinc-800">
            <button onclick="reqAction('WIT')" class="w-full bg-orange-600 py-4 rounded-xl font-black">WITHDRAW NOW</button>
        </div>
    </div>

    <div id="profilePage" class="page p-5 text-center">
        <div class="w-24 h-24 bg-zinc-900 rounded-full mx-auto mb-3 border-2 border-blue-600 p-1">
            <img id="uPic" src="https://via.placeholder.com/100" class="w-full h-full rounded-full">
        </div>
        <h2 id="uName" class="font-black uppercase italic">PLAYER</h2>
        <div class="grid grid-cols-2 gap-2 mt-6">
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <p class="text-[9px] text-zinc-500">TOTAL WON</p><p id="stWon" class="font-black text-green-500">0.00</p>
            </div>
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <p class="text-[9px] text-zinc-500">GAMES</p><p id="stGames" class="font-black">0</p>
            </div>
        </div>

        <div id="adminArea" class="hidden mt-8 text-left bg-red-950/20 p-4 rounded-3xl border border-red-900/30">
            <p class="text-[10px] text-red-500 font-black mb-4 italic text-center uppercase tracking-widest">Admin Control Center</p>
            <div id="adminInbox" class="bg-black p-3 rounded-xl h-40 overflow-y-auto mb-4 text-[10px] font-mono space-y-2 border border-zinc-800"></div>
            <input id="newCBE" placeholder="Update CBE Account" class="w-full bg-black p-3 rounded-lg text-xs mb-2 border border-zinc-800">
            <input id="newTele" placeholder="Update Telebirr" class="w-full bg-black p-3 rounded-lg text-xs mb-3 border border-zinc-800">
            <button onclick="saveAdminSettings()" class="w-full bg-yellow-600 py-3 rounded-lg font-black text-xs">SAVE SETTINGS</button>
        </div>
    </div>

    <nav class="nav-dock">
        <div onclick="showP('playPage')" class="text-center"><i class="fas fa-play"></i><div class="text-[9px] font-black">PLAY</div></div>
        <div onclick="showP('topPage')" class="text-center opacity-40"><i class="fas fa-trophy"></i><div class="text-[9px] font-black">TOP</div></div>
        <div onclick="showP('walletPage')" class="text-center opacity-40"><i class="fas fa-wallet"></i><div class="text-[9px] font-black">WALLET</div></div>
        <div onclick="showP('profilePage')" class="text-center opacity-40"><i class="fas fa-user-circle"></i><div class="text-[9px] font-black">PROFILE</div></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const adminID = "Dawit_Fikadu21";
        
        // Persistent Data Logic
        let userData = JSON.parse(localStorage.getItem('worldGameData')) || {
            bal: 50.00, stWon: 0, stGames: 0, 
            cbe: "1000179571815", tele: "0906067696"
        };

        let running = false; let mult = 1.0; let isForced = false;
        let slots = { 1: {active: false, amt: 10}, 2: {active: false, amt: 10} };

        // Init
        function init() {
            if(tg.initDataUnsafe.user) {
                document.getElementById('uName').innerText = tg.initDataUnsafe.user.first_name;
                if(tg.initDataUnsafe.user.photo_url) document.getElementById('uPic').src = tg.initDataUnsafe.user.photo_url;
                if(tg.initDataUnsafe.user.username === adminID) {
                    document.getElementById('adminArea').classList.remove('hidden');
                    document.getElementById('adminMonitor').classList.remove('hidden');
                }
            }
            document.getElementById('cbeAcc').innerText = userData.cbe;
            document.getElementById('teleAcc').innerText = userData.tele;
            updateUI();
            runEngine();
            loadTopWinners();
        }

        function saveData() { localStorage.setItem('worldGameData', JSON.stringify(userData)); }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('nav div').forEach(d => d.style.opacity = "0.4");
            event.currentTarget.style.opacity = "1";
        }

        function setBet(s, v) {
            if(slots[s].active) return;
            slots[s].amt = v;
            document.querySelectorAll(`#playPage .amt-btn`).forEach(b => { if(b.id.startsWith('v'+s)) b.classList.remove('selected'); });
            document.getElementById(`v${s}-${v}`).classList.add('selected');
            document.getElementById(`sub${s}`).innerText = v.toFixed(2) + " ETB";
        }

        function updateUI() {
            document.getElementById('topBal').innerText = userData.bal.toFixed(2);
            document.getElementById('wBal').innerText = userData.bal.toFixed(2);
            document.getElementById('stWon').innerText = userData.stWon.toFixed(2);
            document.getElementById('stGames').innerText = userData.stGames;
        }

        function forceCrash() { if(running) isForced = true; }

        function runEngine() {
            if(running) return;
            running = true; mult = 1.0; isForced = false;
            document.getElementById('crashMsg').classList.add('hidden');
            document.getElementById('multDisplay').classList.remove('hidden');

            let hasBet = slots[1].active || slots[2].active;
            let crashPoint = hasBet ? (1.05 + Math.random() * 2.2) : (5 + Math.random() * 50);

            let loop = setInterval(() => {
                mult += 0.01 * (mult / 1.5);
                document.getElementById('multDisplay').innerText = mult.toFixed(2) + "x";
                
                // Animation
                let px = (mult - 1) * 35; px = Math.min(px, 85);
                let py = (mult - 1) * 15 + (Math.sin(mult * 4) * 5);
                py = Math.max(5, Math.min(py, 80));

                document.getElementById('plane').style.left = (10 + px) + "%";
                document.getElementById('plane').style.bottom = (10 + py) + "%";

                let x = (10 + px) * 3.5; let y = 180 - ((10 + py) * 1.8);
                let d = `M 0 180 Q ${x/2} 180 ${x} ${y}`;
                document.getElementById('pathLine').setAttribute('d', d);
                document.getElementById('pathFill').setAttribute('d', d + ` L ${x} 180 L 0 180 Z`);

                if(mult >= crashPoint || isForced) {
                    clearInterval(loop); running = false;
                    document.getElementById('multDisplay').classList.add('hidden');
                    document.getElementById('crashMsg').classList.remove('hidden');
                    addH(mult.toFixed(2));
                    slots[1].active = false; slots[2].active = false;
                    resetBtns();
                    setTimeout(runEngine, 4000);
                }
            }, 60);
        }

        function handleBet(s) {
            let btn = document.getElementById('btn' + s);
            if(!slots[s].active) {
                if(userData.bal < slots[s].amt) return alert("Low Balance!");
                if(running) return;
                
                // 20% commission taken instantly for the "House"
                userData.bal -= slots[s].amt;
                userData.stGames++;
                slots[s].active = true;
                saveData(); updateUI();
                btn.innerHTML = "WAITING...";
                btn.classList.add('active');
            } else {
                let win = slots[s].amt * mult;
                userData.bal += win;
                userData.stWon += win;
                slots[s].active = false;
                saveData(); updateUI(); resetBtns();
                alert("WIN! +" + win.toFixed(2));
            }
        }

        function resetBtns() {
            [1,2].forEach(s => {
                let b = document.getElementById('btn' + s);
                b.className = "btn-bet text-white";
                b.innerHTML = `BET<br><span class="text-[10px] opacity-60">${slots[s].amt.toFixed(2)} ETB</span>`;
            });
        }

        function addH(v) {
            const b = document.getElementById('historyBar');
            const i = document.createElement('div');
            i.className = `px-3 py-1 rounded-full border border-zinc-800 ${v > 2 ? 'text-blue-500' : 'text-red-500'}`;
            i.innerText = v + "x";
            b.prepend(i);
            if(b.children.length > 10) b.lastChild.remove();
        }

        // Wallet Logic
        function reqAction(type) {
            const amt = parseFloat(document.getElementById(type === 'DEP' ? 'dAmt' : 'wAmt').value);
            const ref = document.getElementById(type === 'DEP' ? 'dRef' : 'wAcc').value;

            if(!amt || !ref) return alert("Fill all fields!");

            if(type === 'WIT') {
                if(userData.bal < amt) return alert(`Low Balance! ቀሪ ሂሳቦ ${userData.bal.toFixed(2)} ብር ነው። ስለዚህ ከዚህ በላይ ማዘዝ አይችሉም።`);
                userData.bal -= amt; // Deduct immediately for security
                saveData(); updateUI();
            }

            const inbox = document.getElementById('adminInbox');
            const div = document.createElement('div');
            div.className = "bg-zinc-900 p-3 rounded-lg flex justify-between items-center border border-zinc-800";
            div.innerHTML = `<div><p class="font-bold text-white">${type}: ${amt} ETB</p><p class="text-[8px] text-zinc-500">${ref}</p></div>
                             <button onclick="approve(this, ${amt}, '${type}')" class="bg-green-600 px-3 py-1 rounded-md text-[9px] font-black">OK</button>`;
            inbox.prepend(div);
            alert("ጥያቄዎ ተልኳል። አድሚኑ እስኪያጸድቅ ይጠብቁ።");
        }

        function approve(btn, amt, type) {
            if(type === 'DEP') userData.bal += amt;
            // For WIT, we already deducted. Approving just confirms it for Admin.
            saveData(); updateUI(); btn.parentElement.remove(); alert("Confirmed!");
        }

        function saveAdminSettings() {
            const c = document.getElementById('newCBE').value;
            const t = document.getElementById('newTele').value;
            if(c) userData.cbe = c;
            if(t) userData.tele = t;
            document.getElementById('cbeAcc').innerText = userData.cbe;
            document.getElementById('teleAcc').innerText = userData.tele;
            saveData();
            alert("Settings Saved Locally!");
        }

        function toggleW(m) {
            document.getElementById('dSec').classList.toggle('hidden', m === 'W');
            document.getElementById('wSec').classList.toggle('hidden', m === 'D');
            document.getElementById('dBtn').className = m === 'D' ? "flex-1 py-4 bg-green-600 rounded-xl font-black" : "flex-1 py-4 bg-zinc-900 rounded-xl font-black text-zinc-500";
            document.getElementById('wBtn').className = m === 'W' ? "flex-1 py-4 bg-orange-600 rounded-xl font-black" : "flex-1 py-4 bg-zinc-900 rounded-xl font-black text-zinc-500";
        }

        function copy(id) { navigator.clipboard.writeText(document.getElementById(id).innerText); alert("Copied!"); }

        function loadTopWinners() {
            const list = document.getElementById('winnersList');
            const names = ["Abebe_Pro", "Kebede_K", "Mulu_Winner", "Sara_Crypto", "Dawit_Boss", "Hanna_Eth", "Yared_Bet", "Bini_Legend"];
            for(let i=1; i<=50; i++) {
                list.innerHTML += `<div class="flex justify-between p-4 bg-zinc-900/40 rounded-xl border border-zinc-900 mb-1">
                    <span class="text-zinc-400 font-bold">#${i} ${names[i%names.length]}_${Math.floor(Math.random()*99)}</span>
                    <span class="text-green-500 font-black">${(Math.random()*150000).toFixed(0)} ETB</span></div>`;
            }
        }

        window.onload = init;

        // Cashout Visual Loop
        setInterval(() => {
            if(running) {
                [1,2].forEach(s => {
                    if(slots[s].active) {
                        let b = document.getElementById('btn' + s);
                        b.className = "btn-bet bg-orange-600 border-orange-800 text-white animate-pulse";
                        b.innerHTML = `CASH OUT<br><span class="text-xl font-black">${(slots[s].amt * mult).toFixed(2)}</span>`;
                    }
                });
            }
        }, 100);
    </script>
</body>
</html>
