<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetPro</title>
  <style>
    body { margin:0; font-family: Arial; background:#0f172a; color:white; }
    header { background:#020617; padding:15px; display:flex; justify-content:space-between; }
    header h1 { color:#22c55e; }
    nav a { margin:0 10px; color:white; text-decoration:none; }
    .container { padding:20px; }
    .card { background:#1e293b; padding:20px; border-radius:10px; margin:10px; display:inline-block; width:200px; }
    button { background:#22c55e; border:none; padding:10px; color:white; border-radius:5px; cursor:pointer; }
    .balance { background:#020617; padding:10px; border-radius:5px; }
  </style>
</head>
<body><header>
  <h1>BetPro</h1>
  <div class="balance">Balance: 0 ETB</div>
</header><div class="container">
  <h2>Games</h2>  <div class="card">
    <h3>Aviator</h3>
    <p>Play crash game</p>
    <button onclick="playGame('Aviator')">Play</button>
  </div>  <div class="card">
    <h3>Slots</h3>
    <p>Spin & Win</p>
    <button onclick="playGame('Slots')">Play</button>
  </div>  <div class="card">
    <h3>Football</h3>
    <p>Bet on matches</p>
    <button onclick="playGame('Football')">Play</button>
  </div>  <div class="card">
    <h3>Virtual</h3>
    <p>24/7 games</p>
    <button onclick="playGame('Virtual')">Play</button>
  </div>  <h2>Deposit / Withdraw</h2>
  <button onclick="deposit()">Deposit</button>
  <button onclick="withdraw()">Withdraw</button>
</div><script>
let balance = 0;

function updateBalance() {
  document.querySelector('.balance').innerText = 'Balance: ' + balance + ' ETB';
}

function deposit() {
  let amount = prompt('Enter deposit amount');
  balance += Number(amount);
  updateBalance();
}

function withdraw() {
  let amount = prompt('Enter withdraw amount');
  if(balance >= amount) {
    balance -= Number(amount);
    updateBalance();
  } else {
    alert('Not enough balance');
  }
}

function playGame(game) {
  let bet = prompt('Enter bet amount');
  if(balance >= bet) {
    balance -= Number(bet);
    let win = Math.random() > 0.5;
    if(win) {
      let profit = bet * 2;
      balance += profit;
      alert('You won ' + profit);
    } else {
      alert('You lost');
    }
    updateBalance();
  } else {
    alert('Deposit first');
  }
}
</script></body>
</html>
