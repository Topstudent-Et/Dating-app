<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME - FLYING FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* ጨዋታው የሚታይበት ሜዳ */
        .game-canvas { 
            height: 320px; 
            background: radial-gradient(circle at bottom left, #2a0505, #000); 
            border-radius: 28px; 
            margin: 12px; 
            position: relative; 
            border: 2px solid #222; 
            overflow: hidden; 
        }
        
        #multiplier { 
            position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); 
            font-size: 4.5rem; font-weight: 900; font-family: 'Orbitron'; z-index: 10; 
        }

        /* አውሮፕላኑ - እዚህ ጋር ነው በረራው የሚስተካከለው */
        #plane { 
            position: absolute; 
            font-size: 4rem; 
            z-index: 20; 
            left: 10%; 
            bottom: 10%;
            transition: all 0.1s linear; /* በረራው እንዳይቆራረጥ */
            filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.7));
            transform: rotate(-15deg);
        }

        .btn-bet { background: linear-gradient(180deg, #28a745, #1e7e34); border-bottom: 6px solid #145523; border-radius: 20px; }
        .btn-cash { background: linear-gradient(180deg, #ffc107, #d39e00); color: #000; border-bottom: 6px solid #916c00; border-radius: 20px; }
        
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 120px; }
        .active-page { display: block; }
        .nav-item { color: #444; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #ff0000; }
        
        /* 1ኛ ደረጃ ዘውድ አኒሜሽን */
        .crown-anim { animation: bounce 1.5s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body class="bg-black">

    <header class="flex justify-between items-center p-4 border-b border-zinc-900">
        <div class="font-game text-red-600 italic">WORLD GAME</div>
        <div class="bg-zinc-900 px-4 py-1.5 rounded-full border border-zinc-800 flex items-center gap-2">
            <span id="hBal" class="text-green-500 font-black">0.00</span>
        </div>
    </header>

    <div id="playPage" class="page active-page">
        <div class="game-canvas">
            <div id="multiplier">1.00x</div>
            <div id="plane">✈️</div>
            
            <div id="crashAlert" class="absolute inset-0 bg-black/90 hidden flex flex-col items-center justify-center z-50">
                <p class="text-zinc-600 font-bold text-xs">FLEW AWAY!</p>
                <h1 id="crashVal" class="text-red-600 font-game text-6xl">1.00x</h1>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-4 px-4 mt-2">
            <div class="bg-zinc-900/50 p-6 rounded-[32px] border border-zinc-800 grid grid-cols-2 gap-4">
                <input type="number" id="a1" value="10" class="w-full bg-black border border-zinc-800 rounded-xl p-4 text-center font-black text-2xl outline-none">
                <button id="b1" onclick="handleBet(1)" class="btn-bet font-black text-xl italic uppercase">BET</button>
            </div>
        </div>
    </div>

    <div id="topPage" class="page p-6">
        <h2 class="text-center font-game text-yellow-500 mb-14 italic uppercase">Top Winners</h2>
        <div class="flex justify-center items-end gap-2 mb-10 h-40">
            <div class="w-1/3 bg-zinc-900 h-24 rounded-t-3xl text-center p-3 relative border border-zinc-800">
                <span class="absolute -top-8 left-1/2 -translate-x-1/2 text-3xl">🥈</span>
                <p class="text-[9px] font-bold">Sara Solomon</p>
                <p class="text-green-500 font-black text-[10px]">92,450</p>
            </div>
            <div class="w-1/3 bg-yellow-500/10 h-36 rounded-t-3xl text-center p-3 relative border-t-4 border-yellow-500">
                <span class="absolute -top-14 left-1/2 -translate-x-1/2 text-5xl crown-anim">👑</span>
                <p class="text-[10px] font-black text-yellow-500">Dawit Fikadu</p>
                <p class="text-xs font-black">185,200</p>
            </div>
            <div class="w-1/3 bg-zinc-900 h-20 rounded-t-3xl text-center p-3 relative border border-zinc-800">
                <span class="absolute -top-8 left-1/2 -translate-x-1/2 text-3xl">🥉</span>
                <p class="text-[9px] font-bold">Yonas Abel</p>
                <p class="text-green-500 font-black text-[10px]">74,120</p>
            </div>
        </div>
        <div id="topList" class="space-y-3"></div>
    </div>

    <nav class="fixed bottom-0 w-full h-[85px] bg-black border-t border-zinc-900 flex justify-around items-center z-[200] pb-6">
        <div onclick="showPage('play')" id="n-play" class="nav-item active"><i class="fas fa-plane-up text-xl"></i><span class="text-[9px] font-black uppercase">Play</span></div>
        <div onclick="showPage('top')" id="n-top" class="nav-item"><i class="fas fa-trophy text-xl"></i><span class="text-[9px] font-black uppercase">Top</span></div>
        <div onclick="showPage('wallet')" id="n-wallet" class="nav-item"><i class="fas fa-wallet text-xl"></i><span class="text-[9px] font-black uppercase">Wallet</span></div>
    </nav>

    <script>
        const socket = io();
        let curM = 1.0, isRun = false, myBet = null;
        const plane = document.getElementById('plane');

        // አውሮፕላኑን እንዲበር የሚያደርግ ዋናው ሎጂክ
        socket.on('tick', (d) => {
            isRun = true;
            curM = parseFloat(d.mult);
            document.getElementById('multiplier').innerText = d.mult + "x";
            document.getElementById('crashAlert').classList.add('hidden');
            
            // የቦታ ስሌት (Multiplier ሲጨምር አውሮፕላኑ ይበርራል)
            let posX = Math.min((curM - 1) * 45, 80); // max 80% ወደ ቀኝ
            let posY = Math.min((curM - 1) * 35, 70); // max 70% ወደ ላይ
            
            plane.style.left = (10 + posX) + "%";
            plane.style.bottom = (10 + posY) + "%";
            
            // አውሮፕላኑን ቀና ማድረግ
            plane.style.transform = `rotate(${-15 - (posY/2)}deg)`;
            
            // ካሽ አውት በትኑን እንዲታይ ማድረግ
            if(myBet) btnS('CASH');
        });

        socket.on('crash', (d) => {
            isRun = false; myBet = null;
            document.getElementById('multiplier').innerText = "FLY AWAY!";
            document.getElementById('crashVal').innerText = d.point + "x";
            document.getElementById('crashAlert').classList.remove('hidden');
            
            // አውሮፕላኑን ወደ ቦታው መመለስ
            setTimeout(() => {
                plane.style.left = "10%";
                plane.style.bottom = "10%";
                plane.style.transform = "rotate(-15deg)";
            }, 1000);
            
            btnS('BET');
        });

        function handleBet(id) {
            if(!isRun && !myBet) {
                myBet = 10;
                socket.emit('placeBet', { amt: 10, name: "Dawit" });
                btnS('WAIT');
            } else if(isRun && myBet) {
                alert("WIN! " + (myBet * curM).toFixed(2));
                myBet = null;
                btnS('BET');
            }
        }

        function btnS(s) {
            let b = document.getElementById('b1');
            if(s==='WAIT') { b.innerText = "WAITING..."; b.className = "bg-zinc-800 text-zinc-600 rounded-xl font-black"; }
            else if(s==='CASH') { b.innerText = "CASHOUT"; b.className = "btn-cash font-black text-2xl italic"; }
            else { b.innerText = "BET"; b.className = "btn-bet font-black text-2xl italic"; }
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(p+'Page').classList.add('active-page');
            document.getElementById('n-'+p).classList.add('active');
        }

        function renderTops() {
            const hNames = ["Bekele Tesfaye", "Sara Solomon", "Yonas Abel", "Hanna Girma", "Kaleb Efrem"];
            const box = document.getElementById('topList');
            for(let i=4; i<=50; i++) {
                box.innerHTML += `<div class="bg-zinc-900/40 p-4 rounded-2xl border border-zinc-900 flex justify-between items-center text-[10px] mb-2">
                    <span><span class="text-zinc-700 mr-2">#${i}</span> ${hNames[i%5]}</span>
                    <span class="font-black text-green-500">${(Math.random()*15000 + 500).toLocaleString()}</span>
                </div>`;
            }
        }

        window.onload = renderTops;
    </script>
</body>
</html>
