<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER V45 ELITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap');
        :root { --accent: #ff0044; --win-green: #2ecc71; --gold: #ffd700; --podium-bg: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); }
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Layout Structure */
        .nav-top { position: fixed; bottom: 0; width: 100%; height: 75px; display: flex; justify-content: space-around; align-items: center; background: #0a0a0a; border-top: 1px solid #1a1a1a; z-index: 1000; }
        .nav-item { color: #555; font-size: 10px; font-weight: 800; text-align: center; }
        .nav-item.active { color: var(--accent); }

        .page { display: none; height: calc(100vh - 75px); overflow-y: auto; padding: 12px; }
        .active-page { display: block; }

        /* Game Screen */
        .screen { background: radial-gradient(circle at center, #1e0505 0%, #000 100%); height: 200px; position: relative; border-radius: 20px; overflow: hidden; border: 1px solid #222; }
        #gamePath { stroke: var(--accent); stroke-width: 5; fill: none; filter: drop-shadow(0 0 10px var(--accent)); }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 40px; transform: rotate(-15deg); }

        /* Side-by-Side Bet UI */
        .bet-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .bet-card { background: #111; border: 1px solid #222; border-radius: 18px; padding: 10px; }
        .amt-btn { background: #222; color: #aaa; border-radius: 6px; padding: 4px 0; font-size: 9px; font-weight: 800; }

        /* Gold Podium */
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 30px 0; }
        .podium-box { text-align: center; border-radius: 15px 15px 5px 5px; position: relative; box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2); }
        .rank-1 { height: 160px; width: 110px; background: var(--podium-bg); order: 2; z-index: 10; border: 2px solid #fff; }
        .rank-2 { height: 130px; width: 95px; background: linear-gradient(180deg, #c0c0c0 0%, #708090 100%); order: 1; border: 1px solid #eee; }
        .rank-3 { height: 110px; width: 95px; background: linear-gradient(180deg, #cd7f32 0%, #8b4513 100%); order: 3; border: 1px solid #eee; }
        .trophy-icon { font-size: 30px; margin-top: -20px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="no-scrollbar">

    <section id="home" class="page active-page">
        <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
                <div id="hPfp" class="w-9 h-9 rounded-full bg-zinc-900 border border-white/10 overflow-hidden"></div>
                <p id="hBal" class="text-sm font-black text-green-500">0.00 ETB</p>
            </div>
            <button onclick="toggleMute()" class="w-8 h-8 glass rounded-full flex items-center justify-center"><i id="mIcon" class="fa-solid fa-volume-high text-xs"></i></button>
        </div>

        <div class="screen flex items-center justify-center mb-2">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 200 Q 0 200 0 200" /></svg>
            <div id="mTxt" class="font-game text-6xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane">✈️</div>
        </div>

        <div class="bet-container">
            <div class="bet-card">
                <div class="grid grid-cols-2 gap-1 mb-2">
                    <button onclick="setB(1,10)" class="amt-btn">10</button>
                    <button onclick="setB(1,100)" class="amt-btn">100</button>
                    <button onclick="setB(1,200)" class="amt-btn">200</button>
                    <button onclick="setB(1,1000)" class="amt-btn">1k</button>
                </div>
                <input id="bInp1" type="number" value="10" class="w-full bg-black/50 text-center font-black py-2 rounded-lg mb-2 outline-none text-xs border border-white/5">
                <button id="bBtn1" onclick="handleBet(1)" class="w-full py-4 rounded-xl font-black italic text-lg shadow-lg transition-all active:scale-95" style="background:var(--win-green)">BET</button>
            </div>
            <div class="bet-card">
                <div class="grid grid-cols-2 gap-1 mb-2">
                    <button onclick="setB(2,10)" class="amt-btn">10</button>
                    <button onclick="setB(2,100)" class="amt-btn">100</button>
                    <button onclick="setB(2,200)" class="amt-btn">200</button>
                    <button onclick="setB(2,1000)" class="amt-btn">1k</button>
                </div>
                <input id="bInp2" type="number" value="10" class="w-full bg-black/50 text-center font-black py-2 rounded-lg mb-2 outline-none text-xs border border-white/5">
                <button id="bBtn2" onclick="handleBet(2)" class="w-full py-4 rounded-xl font-black italic text-lg shadow-lg transition-all active:scale-95" style="background:var(--win-green)">BET</button>
            </div>
        </div>

        <div id="liveList" class="mt-4 space-y-1 pb-10"></div>
    </section>

    <section id="deposit" class="page">
        <div class="flex gap-2 mb-6">
            <button onclick="showW('depBox')" class="flex-1 py-4 bg-zinc-900 rounded-2xl font-black text-xs border border-white/5 active:bg-zinc-800">DEPOSIT</button>
            <button onclick="showW('witBox')" class="flex-1 py-4 bg-zinc-900 rounded-2xl font-black text-xs border border-white/5 active:bg-zinc-800">WITHDRAW</button>
        </div>

        <div id="depBox" class="space-y-4">
            <div class="glass p-5 rounded-3xl">
                <p class="text-[10px] text-zinc-500 mb-2 uppercase font-black">CBE Transfer</p>
                <div onclick="copyT('1000179571815')" class="flex justify-between items-center bg-black/40 p-4 rounded-xl">
                    <span class="font-black text-sm">1000179571815</span><i class="fa-solid fa-copy text-zinc-600"></i>
                </div>
            </div>
            <div class="glass p-6 rounded-[35px] text-center">
                <input type="file" id="ssInp" class="hidden" onchange="previewImg(this)">
                <button onclick="document.getElementById('ssInp').click()" class="w-full py-4 glass rounded-xl font-black mb-3 text-xs italic">UPLOAD RECEIPT</button>
                <div id="prevBox" class="hidden mb-4"><img id="ssPrev" class="rounded-xl max-h-40 mx-auto border border-white/10 shadow-2xl"></div>
                <button onclick="submitReceipt()" class="w-full py-4 rounded-xl font-black uppercase text-sm" style="background:var(--accent)">SEND TO ADMIN</button>
            </div>
        </div>

        <div id="witBox" class="hidden space-y-4">
            <div class="glass p-6 rounded-3xl">
                <input type="text" placeholder="Account Name" class="w-full bg-black/40 p-4 rounded-xl mb-3 outline-none text-sm font-bold">
                <input type="number" placeholder="Amount (min 100)" class="w-full bg-black/40 p-4 rounded-xl mb-4 outline-none text-sm font-bold">
                <button class="w-full py-4 bg-zinc-800 rounded-xl font-black uppercase text-sm">Submit Request</button>
            </div>
        </div>
    </section>

    <section id="leaderboard" class="page">
        <div class="podium">
            <div class="podium-box rank-2">
                <div class="trophy-icon">🥈</div>
                <p class="text-[10px] font-black mt-2">Kebede_Pro</p>
                <p class="text-[9px] text-white/70">42,500 ETB</p>
            </div>
            <div class="podium-box rank-1">
                <div class="trophy-icon">👑</div>
                <p class="text-[11px] font-black mt-2 text-black">Dai_Fikadu <i class="fa-solid fa-certificate text-[8px] text-blue-800"></i></p>
                <p class="text-[10px] text-black/80 font-bold">120,800 ETB</p>
            </div>
            <div class="podium-box rank-3">
                <div class="trophy-icon">🥉</div>
                <p class="text-[10px] font-black mt-2">Hana_Love</p>
                <p class="text-[9px] text-white/70">28,100 ETB</p>
            </div>
        </div>
        <div id="lList" class="space-y-2 pb-10"></div>
    </section>

    <section id="profile" class="page text-center">
        <div class="mt-8 mb-8">
            <div id="pfpBig" class="w-24 h-24 rounded-full bg-zinc-900 border-2 border-white/5 mx-auto mb-4 overflow-hidden flex items-center justify-center"></div>
            <h2 class="text-2xl font-black italic flex justify-center items-center">
                <span id="uName">@User</span> <i class="fa-solid fa-circle-check text-blue-400 ml-2 text-lg"></i>
            </h2>
            <p id="uBal" class="text-green-500 font-black text-xl mt-1">0.00 ETB</p>
        </div>

        <div class="grid grid-cols-2 gap-4 px-4 mb-10">
            <div class="glass p-4 rounded-2xl">
                <p class="text-[9px] text-zinc-500 font-black uppercase mb-1">Total Games</p>
                <p id="statGames" class="text-xl font-game">0</p>
            </div>
            <div class="glass p-4 rounded-2xl">
                <p class="text-[9px] text-zinc-500 font-black uppercase mb-1">Total Wins</p>
                <p id="statWins" class="text-xl font-game text-green-400">0</p>
            </div>
        </div>

        <div id="admBox" class="hidden glass p-5 rounded-2xl mx-4 border border-red-900/40">
            <button onclick="openAdm()" class="w-full py-4 bg-red-600 rounded-xl font-black text-xs italic">OPEN ADMIN PANEL</button>
        </div>
    </section>

    <nav class="nav-top">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-plane-up text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-2xl mb-1"></i><br>WALLET</div>
        <div onclick="showP('leaderboard')" id="n-leaderboard" class="nav-item"><i class="fa-solid fa-crown text-2xl mb-1"></i><br>TOP</div>
        <div onclick="showP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user text-2xl mb-1"></i><br>PROFILE</div>
    </nav>

    <div id="admModal" class="fixed inset-0 bg-black z-[2000] hidden flex flex-col p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-black text-red-600">ADMIN: PENDING RECEIPTS</h2>
            <button onclick="closeAdm()" class="bg-zinc-800 px-4 py-2 rounded-lg font-black text-xs">CLOSE</button>
        </div>
        <div id="admList" class="space-y-4 overflow-y-auto no-scrollbar"></div>
    </div>

    <audio id="sndTick" loop src="https://www.soundjay.com/buttons/sounds/button-20.mp3"></audio>
    <audio id="sndExplode" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADM_USER = "Dawit_Fikadu21";
        let isMuted = false; let isFlying = false; let mult = 1.0;
        let realBal = parseFloat(localStorage.getItem('v45_bal')) || 0;
        let gamesCount = parseInt(localStorage.getItem('v45_games')) || 0;
        let winsCount = parseInt(localStorage.getItem('v45_wins')) || 0;
        let bets = { 1: { active: false, amt: 0 }, 2: { active: false, amt: 0 } };

        function init() {
            const user = tg.initDataUnsafe?.user;
            const uname = user?.username || "Guest_User";
            document.getElementById('uName').innerText = "@" + uname;
            document.getElementById('pfpBig').innerHTML = user?.photo_url ? `<img src="${user.photo_url}" class="w-full h-full object-cover">` : `<span class="text-3xl font-black">${uname[0]}</span>`;
            document.getElementById('hPfp').innerHTML = user?.photo_url ? `<img src="${user.photo_url}" class="w-full h-full object-cover">` : `<span class="text-xs font-black">${uname[0]}</span>`;
            if(uname === ADM_USER) document.getElementById('admBox').classList.remove('hidden');
            updateUI(); renderWinners(); gameLoop();
        }

        // --- GAME ENGINE ---
        function gameLoop() {
            if(isFlying) return;
            let timer = 5;
            let t = setInterval(() => {
                timer--;
                if(timer <= 0) { clearInterval(t); launch(); }
                genBots();
            }, 1000);
        }

        function launch() {
            isFlying = true; mult = 1.0;
            if(!isMuted) document.getElementById('sndTick').play();
            gamesCount++; localStorage.setItem('v45_games', gamesCount); updateUI();

            let crash = 1.1 + (Math.random() * 8.0);
            if(bets[1].active || bets[2].active) crash = 1.1 + (Math.random() * 0.3); // 10% Profit Logic

            let eng = setInterval(() => {
                mult += 0.05;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 20, y = mult * 15;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px) rotate(-15deg)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 200 Q ${x/2} ${200-y} ${x+20} ${200-y-20}`);
                
                if(mult >= crash) { clearInterval(eng); explode(); }
            }, 80);
        }

        function explode() {
            isFlying = false;
            document.getElementById('sndTick').pause(); 
            document.getElementById('sndTick').currentTime = 0;
            if(!isMuted) document.getElementById('sndExplode').play();
            
            document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "#ff0044";
            bets[1].active = bets[2].active = false; resetBUI(1); resetBUI(2);

            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0) rotate(-15deg)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 200 Q 0 200 0 200');
                document.getElementById('mTxt').style.color = "white";
                gameLoop();
            }, 4000);
        }

        function handleBet(id) {
            if(isFlying) {
                if(bets[id].active) {
                    let win = bets[id].amt * mult;
                    realBal += win; winsCount++;
                    localStorage.setItem('v45_bal', realBal);
                    localStorage.setItem('v45_wins', winsCount);
                    bets[id].active = false; resetBUI(id); updateUI();
                    tg.showAlert(`🚀 BIG WIN: ${win.toFixed(0)} ETB!`);
                }
                return;
            }
            let a = parseInt(document.getElementById('bInp'+id).value);
            if(a > realBal || a <= 0) return tg.showAlert("Insufficient Funds!");
            realBal -= a; localStorage.setItem('v45_bal', realBal);
            bets[id].active = true; bets[id].amt = a;
            updateUI();
            document.getElementById('bBtn'+id).innerText = "CASH OUT";
            document.getElementById('bBtn'+id).style.background = "#ea580c";
        }

        // --- INTERFACE UTILS ---
        function updateUI() {
            let val = realBal.toFixed(2) + " ETB";
            document.getElementById('uBal').innerText = val;
            document.getElementById('hBal').innerText = val;
            document.getElementById('statGames').innerText = gamesCount;
            document.getElementById('statWins').innerText = winsCount;
        }
        function setB(id, v) { document.getElementById('bInp'+id).value = v; }
        function resetBUI(id) { document.getElementById('bBtn'+id).innerText = "BET"; document.getElementById('bBtn'+id).style.background = "var(--win-green)"; }
        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-'+id).classList.add('active');
            if(id !== 'home') document.getElementById('sndTick').pause();
        }
        function showW(id) {
            document.getElementById('depBox').classList.add('hidden');
            document.getElementById('witBox').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }
        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mIcon').className = isMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
            if(isMuted) document.getElementById('sndTick').pause();
        }

        // --- PHOTO & ADMIN ---
        function previewImg(i) { if(i.files[0]) { let r = new FileReader(); r.onload=(e)=>{document.getElementById('ssPrev').src=e.target.result;document.getElementById('prevBox').classList.remove('hidden');}; r.readAsDataURL(i.files[0]); } }
        function submitReceipt() {
            const f = document.getElementById('ssInp').files[0]; if(!f) return;
            let r = new FileReader();
            r.onload = () => {
                let db = JSON.parse(localStorage.getItem('v45_db')) || [];
                db.push({ u: tg.initDataUnsafe?.user?.username || "Guest", img: r.result, t: new Date().toLocaleTimeString() });
                localStorage.setItem('v45_db', JSON.stringify(db));
                tg.showAlert("✅ Sent Successfully!");
                document.getElementById('prevBox').classList.add('hidden');
            };
            r.readAsDataURL(f);
        }
        function openAdm() { document.getElementById('admModal').classList.remove('hidden'); loadAdm(); }
        function closeAdm() { document.getElementById('admModal').classList.add('hidden'); }
        function loadAdm() {
            const db = JSON.parse(localStorage.getItem('v45_db')) || [];
            document.getElementById('admList').innerHTML = db.map((it, i) => `
                <div class="glass p-5 rounded-3xl"><p class="text-xs font-black mb-3">@${it.u} | ${it.t}</p><img src="${it.img}" class="rounded-xl mb-4"><div class="flex gap-2"><button onclick="approve(${i})" class="flex-1 bg-green-600 py-3 rounded-xl font-black">APPROVE</button><button onclick="reject(${i})" class="flex-1 bg-red-600 py-3 rounded-xl font-black">REJECT</button></div></div>
            `).join('') || "<p class='text-center opacity-30 mt-20'>No receipts</p>";
        }
        function approve(i) {
            let db = JSON.parse(localStorage.getItem('v45_db'));
            let amt = prompt("Amount to add?");
            if(amt) {
                if(db[i].u === (tg.initDataUnsafe?.user?.username || "Guest")) { realBal += parseFloat(amt); localStorage.setItem('v45_bal', realBal); updateUI(); }
                db.splice(i,1); localStorage.setItem('v45_db', JSON.stringify(db)); loadAdm();
                tg.showAlert("Approved!");
            }
        }
        function reject(i) { let db = JSON.parse(localStorage.getItem('v45_db')); db.splice(i,1); localStorage.setItem('v45_db', JSON.stringify(db)); loadAdm(); }
        function copyT(t) { navigator.clipboard.writeText(t); tg.showAlert("Copied!"); }

        function genBots() {
            const names = ["Yonas_X","Solomon_K","Betty_W","Habesha_Pro","King_Sami","Fifi_Love"];
            const list = document.getElementById('liveList'); list.innerHTML = "";
            for(let i=0; i<5; i++) {
                list.innerHTML += `<div class="glass p-2 rounded-xl flex justify-between items-center px-4"><span class="text-[11px] font-bold">${names[Math.floor(Math.random()*names.length)]} <i class="fa-solid fa-circle-check text-blue-400 text-[8px]"></i></span><span class="text-[9px] text-zinc-600 italic">Waiting...</span></div>`;
            }
        }
        function renderWinners() {
            const l = document.getElementById('lList'); const n = ["Dawit_Dev","Elias_Sol","Teddy_M","Bini_Boy","Sura_X"];
            for(let i=1; i<=25; i++) {
                l.innerHTML += `<div class="glass p-4 rounded-2xl flex justify-between items-center"><span class="text-xs font-bold uppercase">${n[i%5]}_${i} <i class="fa-solid fa-circle-check text-blue-400"></i></span><span class="text-green-500 font-black">${(Math.random()*15000+200).toFixed(0)} ETB</span></div>`;
            }
        }

        init();
    </script>
</body>
</html>
