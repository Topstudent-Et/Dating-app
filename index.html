<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="World Dating - Professional Dating Platform">
    <meta name="theme-color" content="#ff6b8b">
    <title>World Dating | Find Your Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        /* LIGHT THEME */
        body.light {
            background: #f5f7fb;
            color: #1a1a2e;
        }
        body.light .card {
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            border: 1px solid #eef2f6;
        }
        body.light .sticky-header {
            background: rgba(255,255,255,0.98);
            box-shadow: 0 2px 20px rgba(0,0,0,0.03);
            border-bottom: 1px solid #eef2f6;
        }
        body.light .nav-btn {
            color: #555;
        }
        body.light .user-card {
            background: #fafbfc;
            border: 1px solid #eef2f6;
        }
        body.light input, body.light select, body.light textarea {
            background: #ffffff;
            color: #1a1a2e;
            border: 1px solid #e1e8ed;
        }
        body.light .logo h1 {
            background: linear-gradient(135deg, #c2185b, #ff6b8b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.light .hero {
            background: linear-gradient(135deg, #ffe0e7 0%, #fff0f3 100%);
        }
        body.light .bottom-nav {
            background: rgba(255,255,255,0.98);
            border-top: 1px solid #eef2f6;
        }
        body.light .bottom-nav-item.active {
            color: #ff6b8b;
        }

        /* DARK THEME */
        body.dark {
            background: #0a0a1a;
            color: #e4e6eb;
        }
        body.dark .card {
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,107,139,0.15);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
        }
        body.dark .sticky-header {
            background: rgba(10, 10, 26, 0.98);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,107,139,0.1);
        }
        body.dark .nav-btn {
            color: #b0b3b8;
        }
        body.dark .user-card {
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(255,107,139,0.1);
        }
        body.dark input, body.dark select, body.dark textarea {
            background: rgba(20, 20, 35, 0.9);
            color: #e4e6eb;
            border: 1px solid rgba(255,107,139,0.2);
        }
        body.dark .logo h1 {
            background: linear-gradient(135deg, #ff6b8b, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.dark .hero {
            background: linear-gradient(135deg, rgba(255,107,139,0.1), rgba(0,0,0,0.3));
        }
        body.dark .bottom-nav {
            background: rgba(10, 10, 26, 0.98);
            border-top: 1px solid rgba(255,107,139,0.1);
        }
        body.dark .bottom-nav-item.active {
            color: #ff6b8b;
        }

        /* GLOBAL STYLES */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-radius: 60px;
            margin-top: 15px;
            background: transparent;
        }

        .logo h1 {
            font-size: 24px;
            letter-spacing: -0.5px;
        }
        .logo p {
            font-size: 10px;
            opacity: 0.7;
        }

        .theme-toggle {
            background: rgba(255,107,139,0.15);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            color: inherit;
        }
        .theme-toggle:hover {
            background: rgba(255,107,139,0.3);
            transform: scale(1.05);
        }

        /* Bottom Navigation - horizontal at bottom */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px;
            backdrop-filter: blur(20px);
            z-index: 1000;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        
        @media (min-width: 768px) {
            .bottom-nav {
                left: 50%;
                transform: translateX(-50%);
                width: 100%;
                max-width: 500px;
                border-radius: 30px 30px 20px 20px;
            }
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 30px;
            transition: 0.2s;
            font-size: 12px;
            color: #888;
        }
        .bottom-nav-item i {
            font-size: 22px;
        }
        .bottom-nav-item.active {
            color: #ff6b8b;
            background: rgba(255,107,139,0.1);
        }
        .bottom-nav-item:hover {
            transform: translateY(-3px);
        }

        .card {
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .hero {
            border-radius: 40px;
            padding: 50px 30px;
            text-align: center;
            margin-bottom: 30px;
        }
        .hero h2 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .hero p {
            font-size: 16px;
            opacity: 0.85;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff8da1;
            font-size: 18px;
            z-index: 1;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 50px;
            font-size: 15px;
            transition: all 0.2s;
            font-family: inherit;
        }
        textarea {
            border-radius: 24px;
            padding: 14px 20px;
            resize: vertical;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff6b8b;
            box-shadow: 0 0 0 3px rgba(255,107,139,0.15);
        }
        button {
            background: linear-gradient(135deg, #ff6b8b, #c2185b);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-size: 15px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(194,24,91,0.35);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #ff6b8b;
            color: #ff6b8b;
        }
        .btn-outline:hover {
            background: #ff6b8b;
            color: white;
        }

        .flex-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-card {
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
            cursor: pointer;
        }
        .user-card:hover {
            transform: translateX(5px);
        }
        .user-avatar {
            width: 65px;
            height: 65px;
            background: linear-gradient(145deg, #ffb347, #ff6b8b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        .icon-btn {
            background: rgba(255,107,139,0.15);
            padding: 8px 14px;
            width: auto;
            border-radius: 40px;
            font-size: 12px;
        }

        .stat-card {
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        .stat-card i {
            font-size: 36px;
            color: #ff6b8b;
            margin-bottom: 10px;
        }
        .stat-card h3 {
            font-size: 28px;
            font-weight: 800;
        }

        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            padding-left: 48px;
        }

        .message-item {
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            background: rgba(255,107,139,0.08);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .app-container { padding: 0 16px 80px 16px; }
            .hero h2 { font-size: 28px; }
            .hero { padding: 35px 20px; }
            .user-card { flex-wrap: wrap; }
            .action-buttons { margin-left: 0; width: 100%; justify-content: flex-end; }
        }

        .hide { display: none !important; }
        .error { color: #ff4444; font-size: 12px; margin-top: -5px; margin-bottom: 10px; }
        
        .profile-photo-upload {
            text-align: center;
            margin-bottom: 20px;
        }
        .profile-photo-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffb347, #ff6b8b);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 50px;
            overflow: hidden;
            cursor: pointer;
        }
        .profile-photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-upload-btn {
            background: rgba(255,107,139,0.15);
            color: #ff6b8b;
            padding: 8px 20px;
            width: auto;
            font-size: 13px;
        }
    </style>
</head>
<body class="light">
<div class="app-container" id="app">
    <div class="sticky-header">
        <div class="logo">
            <h1><i class="fas fa-globe-americas"></i> World Dating</h1>
            <p>✨ Find your perfect match ✨</p>
        </div>
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
    </div>
    
    <div id="mainContent"></div>
    
    <footer>
        <div>© 2026 World Dating | Premium Dating Platform</div>
    </footer>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav" id="bottomNav">
    <button class="bottom-nav-item" data-tab="home"><i class="fas fa-home"></i><span>Home</span></button>
    <button class="bottom-nav-item" data-tab="match"><i class="fas fa-search"></i><span>Match</span></button>
    <button class="bottom-nav-item" data-tab="message"><i class="fas fa-envelope"></i><span>Message</span></button>
    <button class="bottom-nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Profile</span></button>
</div>

<script>
    let currentUser = null;
    let allUsers = [];
    let currentTab = "home";
    let isAdminMode = false;
    let searchQuery = "";
    const STORAGE_KEY = "world_dating_final";

    function loadStoredData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            allUsers = JSON.parse(stored);
        } else {
            allUsers = [
                { id: "u1", phone: "0912345678", fullname: "Aisha Ahmed", gender: "female", age: 24, photo: "👩🏾", country: "Ethiopia", password: "1234", liked: [], receivedLikes: [], messages: [], lastLogin: Date.now() },
                { id: "u2", phone: "0922334455", fullname: "Nathaniel Bekele", gender: "male", age: 27, photo: "🧔🏾", country: "Ethiopia", password: "abcd", liked: [], receivedLikes: [], messages: [], lastLogin: Date.now() },
                { id: "u3", phone: "0933445566", fullname: "Selam Haile", gender: "female", age: 22, photo: "👩🏽", country: "Ethiopia", password: "selam", liked: [], receivedLikes: [], messages: [], lastLogin: Date.now() }
            ];
            saveToLocal();
        }
        const savedSession = sessionStorage.getItem("currentUserId");
        if(savedSession) {
            const found = allUsers.find(u => u.id === savedSession);
            if(found) currentUser = found;
        }
    }
    
    function saveToLocal() { 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allUsers)); 
    }
    
    function saveCurrentUserToSession() { 
        if(currentUser) sessionStorage.setItem("currentUserId", currentUser.id); 
        else sessionStorage.removeItem("currentUserId"); 
    }

    function registerUser(phone, gender, age, photoFile, password) {
        if(!phone || phone.length < 10) return "Valid phone number required";
        if(!gender) return "Please select gender";
        if(!age || age < 18) return "Minimum age 18 required";
        if(!password) return "Password required";
        if(allUsers.find(u => u.phone === phone)) return "Phone number already registered!";
        
        let photoData = gender === "female" ? "👩" : "👨";
        
        const newUser = {
            id: "u"+Date.now()+Math.random(),
            phone: phone,
            fullname: phone,
            gender: gender,
            age: parseInt(age),
            photo: photoData,
            country: "Ethiopia",
            password: password,
            liked: [],
            receivedLikes: [],
            messages: [],
            lastLogin: Date.now()
        };
        allUsers.push(newUser);
        saveToLocal();
        currentUser = newUser;
        saveCurrentUserToSession();
        
        if(photoFile && photoFile instanceof File && photoFile.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) { 
                currentUser.photo = e.target.result;
                const userIndex = allUsers.findIndex(u => u.id === currentUser.id);
                if(userIndex !== -1) allUsers[userIndex].photo = e.target.result;
                saveToLocal();
                render();
            };
            reader.readAsDataURL(photoFile);
        }
        return "SUCCESS";
    }

    function loginUser(phone, password) {
        const user = allUsers.find(u => u.phone === phone);
        if(!user) return "Phone number not found";
        if(user.password !== password) return "Incorrect password";
        currentUser = user;
        user.lastLogin = Date.now();
        saveToLocal();
        saveCurrentUserToSession();
        return "SUCCESS";
    }

    function adminLogin(phone, password) {
        if(phone === "0910016861" && password === "215221") {
            isAdminMode = true;
            currentUser = null;
            return "SUCCESS";
        }
        return "Invalid admin credentials";
    }

    function updateUserPhoto(photoData) {
        if(currentUser) {
            currentUser.photo = photoData;
            const userIndex = allUsers.findIndex(u => u.id === currentUser.id);
            if(userIndex !== -1) allUsers[userIndex].photo = photoData;
            saveToLocal();
            render();
        }
    }

    function sendLike(targetId) {
        if(!currentUser) return;
        const target = allUsers.find(u => u.id === targetId);
        if(!target || currentUser.liked.includes(targetId)) { 
            alert("You already liked this person"); 
            return; 
        }
        currentUser.liked.push(targetId);
        target.receivedLikes.push(currentUser.id);
        saveToLocal();
        render();
    }

    function sendMessage(targetId, msg) {
        if(!currentUser || !msg?.trim()) return;
        const target = allUsers.find(u => u.id === targetId);
        if(target) {
            const messageObj = { from: currentUser.id, to: targetId, text: msg, time: Date.now(), read: false };
            currentUser.messages = currentUser.messages || [];
            currentUser.messages.push(messageObj);
            target.messages = target.messages || [];
            target.messages.push(messageObj);
            saveToLocal();
            render();
        }
    }

    function getOppositeGenderUsers() {
        if(!currentUser) return [];
        const opposite = currentUser.gender === "male" ? "female" : "male";
        let users = allUsers.filter(u => u.id !== currentUser.id && u.gender === opposite);
        if(searchQuery) {
            users = users.filter(u => u.fullname.toLowerCase().includes(searchQuery.toLowerCase()) || u.phone.includes(searchQuery));
        }
        return users;
    }

    function getMatches() {
        if(!currentUser) return [];
        return allUsers.filter(u => currentUser.liked.includes(u.id) && u.receivedLikes.includes(currentUser.id));
    }

    function getUserMessages() {
        if(!currentUser) return [];
        const received = (currentUser.messages || []).filter(m => m.to === currentUser.id);
        const sent = (currentUser.messages || []).filter(m => m.from === currentUser.id);
        const all = [...received, ...sent];
        return all.sort((a,b)=>b.time - a.time);
    }

    function renderAdminPanel() {
        const totalUsers = allUsers.length;
        const totalLikes = allUsers.reduce((sum, u) => sum + u.liked.length, 0);
        const countries = [...new Set(allUsers.map(u => u.country))];
        return `
            <div class="card">
                <h2><i class="fas fa-shield-alt"></i> Admin Panel</h2>
                <div class="flex-row" style="margin-top: 20px">
                    <div class="stat-card"><i class="fas fa-users"></i><h3>${totalUsers}</h3><p>Total Members</p></div>
                    <div class="stat-card"><i class="fas fa-heart"></i><h3>${totalLikes}</h3><p>Total Likes</p></div>
                    <div class="stat-card"><i class="fas fa-globe"></i><h3>${countries.length}</h3><p>Countries</p></div>
                </div>
                <h3 style="margin-top: 20px">All Members (${totalUsers})</h3>
                ${allUsers.map(u => `
                    <div class="user-card">
                        <div class="user-avatar">${u.photo && u.photo.includes('data:image') ? `<img src="${u.photo}">` : (u.photo || '👤')}</div>
                        <div><strong>${u.fullname}</strong><br><i class="fas fa-phone"></i> ${u.phone}<br>${u.country} | ${u.age} | ${u.gender}</div>
                    </div>
                `).join('')}
                <button id="adminLogoutBtn" class="btn-outline"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        `;
    }

    function renderHome() {
        if(isAdminMode) return renderAdminPanel();
        if(!currentUser) {
            return `
                <div class="hero">
                    <h2>Find Your Love 🌍</h2>
                    <p>Connect with amazing people from around the world</p>
                </div>
                <div class="card" id="authCard">
                    <div style="display:flex; gap:12px; margin-bottom:20px">
                        <button id="showLoginBtn" style="background:#ff6b8b; width:auto; padding:10px 28px">Login</button>
                        <button id="showSignupBtn" class="btn-outline" style="width:auto; padding:10px 28px">Sign Up</button>
                    </div>
                    <div id="authMsg" class="error"></div>
                    <div id="loginForm">
                        <div class="input-group"><i class="fas fa-phone-alt"></i><input type="tel" id="loginPhone" placeholder="Phone Number"></div>
                        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="loginPassword" placeholder="Password"></div>
                        <button id="doLoginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
                        <button id="adminLoginBtn" class="btn-outline" style="margin-top:12px"><i class="fas fa-user-shield"></i> Admin Login</button>
                    </div>
                    <div id="signupForm" class="hide">
                        <div class="input-group"><i class="fas fa-phone-alt"></i><input type="tel" id="signupPhone" placeholder="Phone Number"></div>
                        <div class="flex-row">
                            <div class="input-group" style="flex:1"><i class="fas fa-venus-mars"></i><select id="signupGender"><option value="">Gender</option><option value="male">Male</option><option value="female">Female</option></select></div>
                            <div class="input-group" style="flex:1"><i class="fas fa-calendar"></i><input type="number" id="signupAge" placeholder="Age"></div>
                        </div>
                        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="signupPassword" placeholder="Password"></div>
                        <button id="doSignupBtn"><i class="fas fa-user-plus"></i> Create Account</button>
                    </div>
                </div>
            `;
        }
        
        const oppositeUsers = getOppositeGenderUsers();
        const matches = getMatches();
        
        let html = `<div class="hero"><h2>Welcome, ${currentUser.fullname}! 👋</h2><p>Find your perfect match</p></div>`;
        
        html += `<div class="flex-row" style="margin-bottom: 20px">
            <div class="stat-card"><i class="fas fa-heart"></i><h3>${currentUser.liked.length}</h3><p>Likes</p></div>
            <div class="stat-card"><i class="fas fa-handshake"></i><h3>${matches.length}</h3><p>Matches</p></div>
            <div class="stat-card"><i class="fas fa-envelope"></i><h3>${(currentUser.messages || []).length}</h3><p>Messages</p></div>
        </div>`;
        
        html += `<div class="card"><h3><i class="fas fa-users"></i> Suggested Matches</h3>`;
        if(oppositeUsers.length === 0) html += `<p>No users found.</p>`;
        else oppositeUsers.forEach(u => {
            const likedAlready = currentUser.liked.includes(u.id);
            html += `<div class="user-card">
                <div class="user-avatar">${u.photo && u.photo.includes('data:image') ? `<img src="${u.photo}">` : (u.photo || '👤')}</div>
                <div><strong>${u.fullname}</strong>, ${u.age}<br><small>${u.country}</small></div>
                <div class="action-buttons">
                    ${!likedAlready ? `<button class="icon-btn like-btn" data-id="${u.id}"><i class="fas fa-heart"></i> Like</button>` : `<button disabled style="background:gray; padding:6px 12px; border-radius:40px;">Liked</button>`}
                    <button class="icon-btn msg-btn" data-id="${u.id}"><i class="fas fa-comment"></i> Msg</button>
                </div>
            </div>`;
        });
        html += `</div>`;
        return html;
    }

    // Match page with search/filter
    function renderMatch() {
        if(!currentUser || isAdminMode) return "";
        const oppositeUsers = getOppositeGenderUsers();
        let html = `<div class="card">
            <h3><i class="fas fa-search"></i> Find People</h3>
            <div class="search-box input-group"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search by name or phone..." value="${searchQuery}"></div>
        </div>`;
        
        html += `<div class="card"><h3><i class="fas fa-users"></i> Search Results (${oppositeUsers.length})</h3>`;
        if(oppositeUsers.length === 0) html += `<p>No users found.</p>`;
        else oppositeUsers.forEach(u => {
            const likedAlready = currentUser.liked.includes(u.id);
            html += `<div class="user-card">
                <div class="user-avatar">${u.photo && u.photo.includes('data:image') ? `<img src="${u.photo}">` : (u.photo || '👤')}</div>
                <div><strong>${u.fullname}</strong>, ${u.age}<br><small><i class="fas fa-phone"></i> ${u.phone}</small></div>
                <div class="action-buttons">
                    ${!likedAlready ? `<button class="icon-btn like-btn" data-id="${u.id}"><i class="fas fa-heart"></i> Like</button>` : `<button disabled style="background:gray;">Liked</button>`}
                    <button class="icon-btn msg-btn" data-id="${u.id}"><i class="fas fa-comment"></i> Msg</button>
                </div>
            </div>`;
        });
        html += `</div>`;
        return html;
    }

    // Message page - receiving messages
    function renderMessage() {
        if(!currentUser || isAdminMode) return "";
        const messages = getUserMessages();
        let html = `<div class="card"><h3><i class="fas fa-inbox"></i> Messages (${messages.length})</h3>`;
        if(messages.length === 0) html += `<p>No messages yet.</p>`;
        else messages.forEach(msg => {
            const sender = allUsers.find(u => u.id === msg.from);
            const receiver = allUsers.find(u => u.id === msg.to);
            const otherPerson = sender?.id === currentUser.id ? receiver : sender;
            html += `<div class="message-item">
                <strong>${otherPerson?.fullname || 'Unknown'}</strong> 
                <small>${new Date(msg.time).toLocaleString()}</small>
                <p style="margin-top:8px">💬 ${msg.text}</p>
            </div>`;
        });
        html += `</div>`;
        return html;
    }

    // Profile page with photo upload at bottom
    function renderProfile() {
        if(!currentUser || isAdminMode) return "";
        return `<div class="card" style="text-align:center">
            <div class="profile-photo-upload">
                <div class="profile-photo-preview" id="photoPreview">
                    ${currentUser.photo && currentUser.photo.includes('data:image') ? `<img src="${currentUser.photo}" id="profileImg">` : (currentUser.photo || '👤')}
                </div>
                <input type="file" id="photoUploadInput" accept="image/*" style="display:none">
                <button class="photo-upload-btn" id="uploadPhotoBtn"><i class="fas fa-camera"></i> Change Photo</button>
            </div>
            <h2>${currentUser.fullname}</h2>
            <p><i class="fas fa-phone"></i> ${currentUser.phone}</p>
            <p><i class="fas fa-venus-mars"></i> ${currentUser.gender === 'male' ? 'Male' : 'Female'} | 🎂 ${currentUser.age}</p>
            <p><i class="fas fa-globe"></i> ${currentUser.country}</p>
            <button id="logoutBtn" class="btn-outline" style="margin-top: 20px; width: auto; padding: 12px 32px"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>`;
    }

    function render() {
        const mainDiv = document.getElementById("mainContent");
        
        let content = "";
        if(isAdminMode) content = renderAdminPanel();
        else if(currentTab === 'home') content = renderHome();
        else if(currentTab === 'match') content = renderMatch();
        else if(currentTab === 'message') content = renderMessage();
        else if(currentTab === 'profile') content = renderProfile();
        else content = renderHome();
        
        mainDiv.innerHTML = content;
        
        // Bottom nav active state
        document.querySelectorAll(".bottom-nav-item").forEach(btn => {
            const tab = btn.getAttribute("data-tab");
            if(tab === currentTab) btn.classList.add("active");
            else btn.classList.remove("active");
            btn.addEventListener("click", () => {
                currentTab = tab;
                searchQuery = "";
                render();
            });
        });
        
        // Search functionality
        const searchInput = document.getElementById("searchInput");
        if(searchInput) {
            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value;
                render();
            });
        }
        
        // Photo upload
        const uploadBtn = document.getElementById("uploadPhotoBtn");
        const photoInput = document.getElementById("photoUploadInput");
        if(uploadBtn && photoInput) {
            uploadBtn.addEventListener("click", () => photoInput.click());
            photoInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if(file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        updateUserPhoto(ev.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
        
        if(currentUser && !isAdminMode) {
            document.getElementById("logoutBtn")?.addEventListener("click", () => { 
                currentUser = null; 
                isAdminMode = false; 
                saveCurrentUserToSession(); 
                currentTab = "home"; 
                render(); 
            });
        }
        if(isAdminMode) {
            document.getElementById("adminLogoutBtn")?.addEventListener("click", () => { 
                isAdminMode = false; 
                currentUser = null; 
                render(); 
            });
        }
        
        document.querySelectorAll(".like-btn").forEach(btn => btn.addEventListener("click", () => sendLike(btn.getAttribute("data-id"))));
        document.querySelectorAll(".msg-btn").forEach(btn => btn.addEventListener("click", () => {
            const msg = prompt("Type your message:");
            if(msg) sendMessage(btn.getAttribute("data-id"), msg);
        }));
        
        if(!currentUser && !isAdminMode) {
            document.getElementById("showLoginBtn")?.addEventListener("click", () => { 
                document.getElementById("loginForm").classList.remove("hide"); 
                document.getElementById("signupForm").classList.add("hide"); 
            });
            document.getElementById("showSignupBtn")?.addEventListener("click", () => { 
                document.getElementById("loginForm").classList.add("hide"); 
                document.getElementById("signupForm").classList.remove("hide"); 
            });
            document.getElementById("doLoginBtn")?.addEventListener("click", () => {
                const res = loginUser(document.getElementById("loginPhone").value, document.getElementById("loginPassword").value);
                if(res === "SUCCESS") render();
                else document.getElementById("authMsg").innerText = res;
            });
            document.getElementById("doSignupBtn")?.addEventListener("click", () => {
                const fileInput = document.getElementById("signupPhoto");
                const file = fileInput?.files[0];
                const res = registerUser(
                    document.getElementById("signupPhone").value,
                    document.getElementById("signupGender").value,
                    document.getElementById("signupAge").value,
                    file,
                    document.getElementById("signupPassword").value
                );
                if(res === "SUCCESS") render();
                else document.getElementById("authMsg").innerText = res;
            });
            document.getElementById("adminLoginBtn")?.addEventListener("click", () => {
                const res = adminLogin(document.getElementById("loginPhone").value, document.getElementById("loginPassword").value);
                if(res === "SUCCESS") render();
                else document.getElementById("authMsg").innerText = res;
            });
        }
    }

    // Theme Toggle
    document.getElementById("themeToggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        document.body.classList.toggle("light");
        const icon = document.querySelector("#themeToggle i");
        icon.className = document.body.classList.contains("dark") ? "fas fa-sun" : "fas fa-moon";
    });
    
    loadStoredData();
    render();
</script>
</body>
</html>
