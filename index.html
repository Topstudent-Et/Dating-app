<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME PRO - 365</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* Glassmorphism Effects */
        .glass { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 90px; }
        .page.active { display: block; animation: fadeIn 0.3s ease-in; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Game Screen */
        .game-display { height: 190px; position: relative; background: radial-gradient(circle at center, #200, #000); border-radius: 20px; margin: 10px; overflow: hidden; border: 1px solid #311; }
        #multDisplay { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 3.5rem; font-weight: 900; z-index: 5; }
        #plane { position: absolute; bottom: 15%; left: 10%; font-size: 2.5rem; z-index: 10; filter: drop-shadow(0 0 10px red); }

        /* Navigation */
        .nav-dock { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 65px; background: rgba(10, 10, 10, 0.9); border-radius: 25px; display: flex; justify-content: space-around; align-items: center; border: 1px solid #222; z-index: 1000; }
        .nav-btn { color: #555; font-size: 0.6rem; font-weight: 900; text-align: center; transition: 0.3s; }
        .nav-btn.active { color: #ff0000; transform: scale(1.1); }
        .nav-btn i { font-size: 1.4rem; display: block; margin-bottom: 2px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

    <div class="flex justify-between items-center p-4 sticky top-0 bg-black/80 backdrop-blur z-[1001]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center shadow-[0_0_15px_red]">✈️</div>
            <div>
                <h1 class="font-game text-red-600 text-sm tracking-tighter">WORLD GAME</h1>
                <div class="flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span><span class="text-[8px] text-zinc-500 font-black">ONLINE</span></div>
            </div>
        </div>
        <div onclick="showP('walletPage')" class="glass px-4 py-2 rounded-full flex items-center gap-2 border border-red-900/30">
            <span id="mainBal" class="text-green-500 font-black text-sm">0.00</span>
            <span class="text-[8px] text-zinc-500">ETB</span>
        </div>
    </div>

    <div id="playPage" class="page active px-2">
        <div id="history" class="flex gap-2 p-2 overflow-x-auto no-scrollbar mb-2">
            <span class="bg-zinc-900 px-3 py-1 rounded-full text-[10px] text-blue-500 font-bold border border-blue-900/30">2.45x</span>
            <span class="bg-zinc-900 px-3 py-1 rounded-full text-[10px] text-red-500 font-bold border border-red-900/30">1.02x</span>
        </div>

        <div class="game-display">
            <div id="multDisplay" class="font-game italic text-white">1.00x</div>
            <div id="crashMsg" class="hidden absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-red-600 font-game text-2xl z-20">FLEW AWAY!</div>
            <div id="plane">✈️</div>
        </div>

        <div class="grid grid-cols-2 gap-3 p-2">
            <div class="glass p-3 rounded-3xl">
                <div class="flex justify-between mb-2"><button onclick="adjust(1,-10)" class="text-xs bg-zinc-800 w-6 h-6 rounded">-</button><span id="betAmt1" class="font-black">10</span><button onclick="adjust(1,10)" class="text-xs bg-zinc-800 w-6 h-6 rounded">+</button></div>
                <button id="btn1" onclick="handleBet(1)" class="w-full h-14 bg-green-600 rounded-2xl font-black shadow-lg shadow-green-900/20 active:scale-95 transition">BET</button>
            </div>
            <div class="glass p-3 rounded-3xl">
                <div class="flex justify-between mb-2"><button onclick="adjust(2,-10)" class="text-xs bg-zinc-800 w-6 h-6 rounded">-</button><span id="betAmt2" class="font-black">10</span><button onclick="adjust(2,10)" class="text-xs bg-zinc-800 w-6 h-6 rounded">+</button></div>
                <button id="btn2" onclick="handleBet(2)" class="w-full h-14 bg-green-600 rounded-2xl font-black shadow-lg shadow-green-900/20 active:scale-95 transition">BET</button>
            </div>
        </div>
    </div>

    <div id="topPage" class="page px-4 pt-4">
        <div class="text-center mb-8">
            <i class="fas fa-trophy text-yellow-500 text-4xl mb-2"></i>
            <h2 class="font-game text-xl">CHAMPIONS</h2>
        </div>
        
        <div class="flex justify-center items-end gap-2 mb-10 h-32">
            <div class="w-24 bg-zinc-800 h-16 rounded-t-lg flex flex-col items-center justify-center p-2">
                <span class="text-[8px] font-bold">Aster_M</span>
                <span class="text-xs font-black text-green-500">4,200</span>
            </div>
            <div class="w-28 bg-yellow-600 h-24 rounded-t-lg flex flex-col items-center justify-center p-2 relative">
                <i class="fas fa-crown absolute -top-6 text-yellow-400 text-xl"></i>
                <span class="text-[10px] font-black">Dawit_Dev</span>
                <span class="text-sm font-black">12,500</span>
            </div>
            <div class="w-24 bg-orange-900 h-12 rounded-t-lg flex flex-col items-center justify-center p-2">
                <span class="text-[8px] font-bold">Bini_K</span>
                <span class="text-xs font-black text-green-500">2,800</span>
            </div>
        </div>

        <div id="rankList" class="space-y-2"></div>
    </div>

    <div id="walletPage" class="page px-6 pt-6">
        <div class="bg-gradient-to-br from-zinc-900 to-black p-6 rounded-[30px] border border-zinc-800 mb-8">
            <p class="text-zinc-500 text-xs font-bold mb-1 uppercase tracking-widest">Available Balance</p>
            <h1 class="text-4xl font-game"><span id="walletBal">0.00</span> <span class="text-sm text-zinc-500">ETB</span></h1>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <button onclick="toggleSec('D')" id="dBtn" class="py-4 bg-red-600 rounded-2xl font-black text-sm shadow-lg shadow-red-900/40">DEPOSIT</button>
            <button onclick="toggleSec('W')" id="wBtn" class="py-4 bg-zinc-900 rounded-2xl font-black text-sm text-zinc-500 border border-zinc-800">WITHDRAW</button>
        </div>

        <div id="depSec" class="space-y-4">
            <div class="glass p-4 rounded-2xl">
                <p class="text-[10px] text-zinc-500 mb-1">CBE ACCOUNT</p>
                <div class="flex justify-between font-bold"><span>1000179571815</span><i class="fas fa-copy"></i></div>
            </div>
            <input type="number" id="dAmt" placeholder="Amount" class="w-full bg-zinc-900 p-4 rounded-2xl outline-none border border-zinc-800">
            <button class="w-full bg-blue-600 py-4 rounded-2xl font-black">CONFIRM DEPOSIT</button>
        </div>
    </div>

    <div id="profilePage" class="page px-6 pt-10 text-center">
        <div class="relative w-24 h-24 mx-auto mb-4">
            <div class="w-full h-full rounded-full bg-zinc-900 border-4 border-red-600 p-1">
                <img src="https://via.placeholder.com/100" class="w-full h-full rounded-full object-cover" id="userImg">
            </div>
            <div class="absolute bottom-0 right-0 bg-green-500 w-6 h-6 rounded-full border-4 border-black"></div>
        </div>
        <h2 id="userName" class="font-game text-lg mb-1">DAWIT FIKADU</h2>
        <p class="text-[10px] text-zinc-500 mb-8">VERIFIED DEVELOPER ACCOUNT</p>

        <div class="grid grid-cols-2 gap-3 mb-10">
            <div class="glass p-4 rounded-3xl text-left">
                <p class="text-[9px] text-zinc-500 mb-1">TOTAL WON</p>
                <p class="font-black text-green-500">45,200 ETB</p>
            </div>
            <div class="glass p-4 rounded-3xl text-left">
                <p class="text-[9px] text-zinc-500 mb-1">GAMES</p>
                <p class="font-black">1,240</p>
            </div>
        </div>

        <button class="w-full bg-zinc-900 py-4 rounded-2xl text-xs font-bold border border-zinc-800 flex items-center justify-center gap-3">
            <i class="fas fa-cog"></i> ACCOUNT SETTINGS
        </button>
    </div>

    <nav class="nav-dock">
        <div onclick="showP('playPage')" class="nav-btn active"><i class="fas fa-rocket"></i>PLAY</div>
        <div onclick="showP('topPage')" class="nav-btn"><i class="fas fa-chart-line"></i>TOP</div>
        <div onclick="showP('walletPage')" class="nav-btn"><i class="fas fa-wallet"></i>WALLET</div>
        <div onclick="showP('profilePage')" class="nav-btn"><i class="fas fa-user-circle"></i>PROFILE</div>
    </nav>

    <script>
        let db = { bal: 500.00, bet1: 10, bet2: 10 };
        let running = false; let mult = 1.0;

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function adjust(s, v) {
            db['bet'+s] = Math.max(10, db['bet'+s] + v);
            document.getElementById('betAmt' + s).innerText = db['bet'+s];
        }

        function engine() {
            if(running) return;
            running = true; mult = 1.0;
            document.getElementById('crashMsg').classList.add('hidden');
            let crashPoint = 1.1 + Math.random() * 5;
            
            let loop = setInterval(() => {
                mult += 0.01 * (mult / 1.5);
                document.getElementById('multDisplay').innerText = mult.toFixed(2) + "x";
                
                let px = Math.min(10 + (mult * 5), 80);
                let py = Math.min(15 + (mult * 4), 70);
                document.getElementById('plane').style.left = px + "%";
                document.getElementById('plane').style.bottom = py + "%";

                if(mult >= crashPoint) {
                    clearInterval(loop); running = false;
                    document.getElementById('multDisplay').innerText = "";
                    document.getElementById('crashMsg').classList.remove('hidden');
                    setTimeout(engine, 4000);
                }
            }, 80);
        }

        function toggleSec(m) {
            const isD = m === 'D';
            document.getElementById('dBtn').className = isD ? "py-4 bg-red-600 rounded-2xl font-black text-sm" : "py-4 bg-zinc-900 rounded-2xl font-black text-sm text-zinc-500 border border-zinc-800";
            document.getElementById('wBtn').className = !isD ? "py-4 bg-red-600 rounded-2xl font-black text-sm" : "py-4 bg-zinc-900 rounded-2xl font-black text-sm text-zinc-500 border border-zinc-800";
        }

        function loadRanks() {
            const list = document.getElementById('rankList');
            for(let i=4; i<=10; i++) {
                list.innerHTML += `<div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <span class="text-zinc-500 font-bold">#${i} Player_${i}92</span>
                    <span class="font-black text-green-500">${(Math.random()*2000).toFixed(0)} ETB</span>
                </div>`;
            }
        }

        window.onload = () => {
            document.getElementById('mainBal').innerText = db.bal.toFixed(2);
            document.getElementById('walletBal').innerText = db.bal.toFixed(2);
            loadRanks();
            engine();
        };
    </script>
</body>
</html>
