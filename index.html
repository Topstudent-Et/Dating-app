<!DOCTYPE html>
<html>
<head>
  <title>🔥 Aviator Betting</title>
</head>
<body>

<h2>✈️ Aviator Game</h2>

<button onclick="loadGame()">🎮 Start Game</button>

<pre id="output"></pre>

<script>
function loadGame() {
  fetch("/api/aviator")
    .then(res => res.json())
    .then(data => {
      document.getElementById("output").innerText =
        JSON.stringify(data, null, 2);
    });
}
</script>

</body>
</html>
