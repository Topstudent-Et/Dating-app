<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER V50 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #ff0044; --real-green: #00ff66; --demo-red: #ff3333; --gold: #ffd700; }
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Navigation */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; height: 70px; display: flex; justify-content: space-around; align-items: center; background: #0a0a0a; border-top: 1px solid #1a1a1a; z-index: 1000; }
        .nav-item { color: #444; font-size: 10px; font-weight: 900; text-align: center; }
        .nav-item.active { color: var(--accent); }

        .page { display: none; height: calc(100vh - 70px); overflow-y: auto; padding: 12px; padding-bottom: 100px; }
        .active-page { display: block; }

        /* Game Screen */
        .screen { background: radial-gradient(circle at center, #1a0505 0%, #000 100%); height: 210px; position: relative; border-radius: 25px; overflow: hidden; border: 1px solid #222; }
        #gamePath { stroke: var(--accent); stroke-width: 6; fill: none; filter: drop-shadow(0 0 12px var(--accent)); transition: 0.1s; }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 40px; z-index: 10; transform: rotate(-15deg); }
        
        /* Podium Styles */
        .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 40px 0; }
        .podium-box { text-align: center; border-radius: 20px; position: relative; border: 2px solid transparent; background: rgba(255,255,255,0.03); }
        .gold-frame { border-color: var(--gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); background: linear-gradient(180deg, rgba(255,215,0,0.1) 0%, transparent 100%); }
        .rank-1 { height: 170px; width: 120px; order: 2; z-index: 10; transform: scale(1.1); }
        .rank-2 { height: 140px; width: 100px; order: 1; border-color: #c0c0c0; }
        .rank-3 { height: 120px; width: 100px; order: 3; border-color: #cd7f32; }
        
        .mode-btn { padding: 8px 20px; border-radius: 12px; font-weight: 900; font-size: 12px; transition: 0.3s; }
        .bet-input { background: #000; border: 1px solid #222; border-radius: 10px; text-align: center; font-weight: 900; font-size: 14px; padding: 5px; width: 100%; }
        .btn-speed { background: #1a1a1a; border: 1px solid #333; padding: 4px; border-radius: 6px; font-size: 9px; font-weight: 900; color: #777; }
        .btn-speed.active { border-color: var(--accent); color: white; }
    </style>
</head>
<body class="no-scrollbar">

    <div class="fixed top-0 w-full z-50 bg-black/80 backdrop-blur-md p-3 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-2">
            <div id="hPfp" class="w-8 h-8 rounded-full bg-zinc-800 border border-white/10 overflow-hidden"></div>
            <span id="hBal" class="text-green-500 font-black text-sm">0.00 ETB</span>
        </div>
        <div class="flex gap-2">
            <button onclick="setMode(true)" id="mDemo" class="mode-btn bg-red-600 text-white">DEMO</button>
            <button onclick="setMode(false)" id="mReal" class="mode-btn bg-zinc-900 text-zinc-500">REAL</button>
        </div>
    </div>

    <section id="home" class="page active-page mt-14">
        <div class="screen flex items-center justify-center mb-4">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 210 Q 0 210 0 210" /></svg>
            <div id="mTxt" class="font-game text-6xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane">✈️</div>
            <button onclick="toggleMute()" class="absolute top-4 right-4 glass w-9 h-9 rounded-full flex items-center justify-center"><i id="mIcon" class="fa-solid fa-volume-high text-xs"></i></button>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="glass p-3 rounded-3xl">
                <div class="flex gap-1 mb-2">
                    <button onclick="setB(1,100)" class="btn-speed flex-1">100</button>
                    <button onclick="setB(1,200)" class="btn-speed flex-1">200</button>
                    <button onclick="setB(1,500)" class="btn-speed flex-1">500</button>
                    <button onclick="setB(1,1000)" class="btn-speed flex-1">1k</button>
                </div>
                <input id="bInp1" type="number" value="10" class="bet-input mb-2 outline-none">
                <div class="grid grid-cols-5 gap-1 mb-2">
                    <button id="a2_1" onclick="setAuto(1,2)" class="btn-speed">2x</button>
                    <button id="a4_1" onclick="setAuto(1,4)" class="btn-speed">4x</button>
                    <button id="a8_1" onclick="setAuto(1,8)" class="btn-speed">8x</button>
                    <button id="a10_1" onclick="setAuto(1,10)" class="btn-speed">10x</button>
                    <button id="a50_1" onclick="setAuto(1,50)" class="btn-speed">50x</button>
                </div>
                <button id="bBtn1" onclick="handleBet(1)" class="w-full py-4 rounded-xl font-black italic text-lg shadow-xl" style="background:var(--real-green); color:black">BET</button>
            </div>
            <div class="glass p-3 rounded-3xl">
                <div class="flex gap-1 mb-2">
                    <button onclick="setB(2,100)" class="btn-speed flex-1">100</button>
                    <button onclick="setB(2,200)" class="btn-speed flex-1">200</button>
                    <button onclick="setB(2,500)" class="btn-speed flex-1">500</button>
                    <button onclick="setB(2,1000)" class="btn-speed flex-1">1k</button>
                </div>
                <input id="bInp2" type="number" value="10" class="bet-input mb-2 outline-none">
                <div class="grid grid-cols-5 gap-1 mb-2">
                    <button id="a2_2" onclick="setAuto(2,2)" class="btn-speed">2x</button>
                    <button id="a4_2" onclick="setAuto(2,4)" class="btn-speed">4x</button>
                    <button id="a8_2" onclick="setAuto(2,8)" class="btn-speed">8x</button>
                    <button id="a10_2" onclick="setAuto(2,10)" class="btn-speed">10x</button>
                    <button id="a50_2" onclick="setAuto(2,50)" class="btn-speed">50x</button>
                </div>
                <button id="bBtn2" onclick="handleBet(2)" class="w-full py-4 rounded-xl font-black italic text-lg shadow-xl" style="background:var(--real-green); color:black">BET</button>
            </div>
        </div>

        <div id="botList" class="mt-6 space-y-1 pb-10"></div>
    </section>

    <section id="deposit" class="page mt-14">
        <div class="glass p-5 rounded-[30px] mb-4">
            <p class="text-[10px] text-zinc-500 font-black mb-4">CHOOSE METHOD</p>
            <div class="space-y-3">
                <div onclick="copyT('1000179571815')" class="flex justify-between items-center bg-zinc-900/50 p-4 rounded-2xl border border-white/5">
                    <div><p class="text-[9px] text-blue-400">CBE (ንግድ ባንክ)</p><p class="font-black">1000179571815</p></div>
                    <i class="fa-solid fa-copy"></i>
                </div>
                <div onclick="copyT('0912345678')" class="flex justify-between items-center bg-zinc-900/50 p-4 rounded-2xl border border-white/5">
                    <div><p class="text-[9px] text-yellow-500">TELEBIRR (ቴሌብር)</p><p class="font-black">0912345678</p></div>
                    <i class="fa-solid fa-copy"></i>
                </div>
            </div>
        </div>

        <div class="glass p-6 rounded-[35px] text-center border-2 border-dashed border-zinc-800">
            <input type="text" id="depName" placeholder="Account Name (የአካውንት ስም)" class="w-full bg-black border border-white/5 p-4 rounded-xl mb-3 outline-none font-bold text-sm">
            <input type="number" id="depAmt" placeholder="Amount (የገንዘብ መጠን)" class="w-full bg-black border border-white/5 p-4 rounded-xl mb-4 outline-none font-bold text-sm">
            
            <input type="file" id="ssInp" class="hidden" onchange="previewImg(this)">
            <button onclick="document.getElementById('ssInp').click()" class="w-full py-4 bg-white/5 rounded-xl font-black mb-4 text-xs italic">UPLOAD RECEIPT PHOTO</button>
            <div id="prevBox" class="hidden mb-4"><img id="ssPrev" class="rounded-xl max-h-48 mx-auto shadow-2xl"></div>
            
            <button id="sendBtn" onclick="submitReceipt()" class="w-full py-5 rounded-2xl font-black text-sm shadow-2xl uppercase italic" style="background:var(--accent)">SEND TO ADMIN</button>
        </div>
    </section>

    <section id="leaderboard" class="page mt-14">
        <div class="podium-container">
            <div class="podium-box rank-2"><i class="fa-solid fa-medal text-zinc-400 text-3xl my-3"></i><p class="text-[10px] font-black">Aman_King</p><p class="text-[9px] text-green-500">45,200 ETB</p></div>
            <div class="podium-box rank-1 gold-frame"><i class="fa-solid fa-crown text-yellow-500 text-5xl my-3"></i><p class="text-[11px] font-black">Dai_Fikadu <i class="fa-solid fa-certificate text-blue-500 text-[8px]"></i></p><p class="text-[10px] text-yellow-500 font-bold">120,800 ETB</p></div>
            <div class="podium-box rank-3"><i class="fa-solid fa-medal text-orange-700 text-3xl my-3"></i><p class="text-[10px] font-black">Sami_Pro</p><p class="text-[9px] text-green-500">28,100 ETB</p></div>
        </div>
        <div id="winList" class="space-y-2 pb-10"></div>
    </section>

    <section id="profile" class="page mt-14 text-center">
        <div id="pfpBig" class="w-24 h-24 rounded-[35px] bg-zinc-900 border-2 border-white/10 mx-auto mt-10 mb-4 overflow-hidden flex items-center justify-center"></div>
        <h2 class="text-2xl font-black italic flex justify-center items-center">
            <span id="uName">@User</span> <i class="fa-solid fa-circle-check text-blue-500 ml-2 text-xl"></i>
        </h2>
        <p id="uBal" class="text-green-500 font-black text-2xl mt-1">0.00 ETB</p>

        <div class="grid grid-cols-2 gap-4 px-4 mt-10">
            <div class="glass p-5 rounded-3xl">
                <p class="text-[9px] text-zinc-500 font-black uppercase mb-1">Played Games</p>
                <p id="statG" class="text-2xl font-game">0</p>
            </div>
            <div class="glass p-5 rounded-3xl">
                <p class="text-[9px] text-zinc-500 font-black uppercase mb-1">Total Wins</p>
                <p id="statW" class="text-2xl font-game text-green-500">0</p>
            </div>
        </div>

        <div id="admBtnBox" class="hidden mt-10 px-4">
            <button onclick="openAdm()" class="w-full py-4 bg-red-600 rounded-2xl font-black italic text-xs shadow-xl">OPEN ADMIN DASHBOARD</button>
        </div>
    </section>

    <nav class="nav-bottom">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-plane-up text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-2xl mb-1"></i><br>WALLET</div>
        <div onclick="showP('leaderboard')" id="n-leaderboard" class="nav-item"><i class="fa-solid fa-trophy text-2xl mb-1"></i><br>TOP</div>
        <div onclick="showP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user-gear text-2xl mb-1"></i><br>PROFILE</div>
    </nav>

    <div id="admModal" class="fixed inset-0 bg-black z-[2000] hidden flex flex-col p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-black text-red-600 italic">ADMIN: PENDING APPROVALS</h2>
            <button onclick="closeAdm()" class="bg-zinc-800 px-4 py-2 rounded-xl font-black text-[10px]">CLOSE</button>
        </div>
        <div id="admList" class="space-y-4 overflow-y-auto no-scrollbar"></div>
    </div>

    <audio id="sndTick" loop src="https://www.soundjay.com/buttons/sounds/button-20.mp3"></audio>
    <audio id="sndBoom" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADM_USER = "Dawit_Fikadu21";
        let isDemo = true; let isFlying = false; let mult = 1.0; let isMuted = false;
        let realBal = parseFloat(localStorage.getItem('v50_real')) || 0;
        let demoBal = 1000.00;
        let stats = { g: parseInt(localStorage.getItem('v50_g'))||0, w: parseInt(localStorage.getItem('v50_w'))||0 };
        let bets = { 1: { active: false, amt: 0, auto: 0 }, 2: { active: false, amt: 0, auto: 0 } };

        function init() {
            const user = tg.initDataUnsafe?.user;
            const uname = user?.username || "Guest_User";
            document.getElementById('uName').innerText = "@" + uname;
            document.getElementById('hPfp').innerHTML = user?.photo_url ? `<img src="${user.photo_url}" class="w-full h-full object-cover">` : `<span class="text-xs font-black">${uname[0]}</span>`;
            document.getElementById('pfpBig').innerHTML = user?.photo_url ? `<img src="${user.photo_url}" class="w-full h-full object-cover">` : `<span class="text-3xl font-black">${uname[0]}</span>`;
            if(uname === ADM_USER) document.getElementById('admBtnBox').classList.remove('hidden');
            updateUI(); renderWinners(); gameLoop();
        }

        // --- GAME LOOP ---
        function gameLoop() {
            if(isFlying) return;
            let timer = 5;
            let t = setInterval(() => {
                timer--;
                if(timer <= 0) { clearInterval(t); launch(); }
                genBots();
            }, 1000);
        }

        function launch() {
            isFlying = true; mult = 1.0;
            if(!isMuted) document.getElementById('sndTick').play();
            stats.g++; localStorage.setItem('v50_g', stats.g); updateUI();

            let crash = 1.1 + (Math.random() * 9.0);
            if(!isDemo && (bets[1].active || bets[2].active)) crash = 1.1 + (Math.random() * 0.4); // 10% Profit

            let eng = setInterval(() => {
                mult += 0.05;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 22, y = mult * 18;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px) rotate(-15deg)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 210 Q ${x/2} ${210-y} ${x+20} ${210-y-20}`);
                
                // Auto Cash-out
                [1,2].forEach(id => { if(bets[id].active && bets[id].auto > 0 && mult >= bets[id].auto) handleBet(id); });

                if(mult >= crash) { clearInterval(eng); boom(); }
            }, 80);
        }

        function boom() {
            isFlying = false;
            document.getElementById('sndTick').pause(); document.getElementById('sndTick').currentTime = 0;
            if(!isMuted) document.getElementById('sndBoom').play();
            document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "var(--accent)";
            bets[1].active = bets[2].active = false; resetBUI(1); resetBUI(2);
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0) rotate(-15deg)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 210 Q 0 210 0 210');
                document.getElementById('mTxt').style.color = "white";
                gameLoop();
            }, 4000);
        }

        function handleBet(id) {
            if(isFlying) {
                if(bets[id].active) {
                    let win = bets[id].amt * mult;
                    if(isDemo) demoBal += win; else { realBal += win; localStorage.setItem('v50_real', realBal); }
                    stats.w++; localStorage.setItem('v50_w', stats.w);
                    bets[id].active = false; resetBUI(id); updateUI();
                    tg.showAlert(`🚀 WON: ${win.toFixed(0)} ETB!`);
                }
                return;
            }
            let a = parseInt(document.getElementById('bInp'+id).value);
            let cur = isDemo ? demoBal : realBal;
            if(a > cur || a <= 0) return tg.showAlert("Insufficient Funds!");
            if(isDemo) demoBal -= a; else { realBal -= a; localStorage.setItem('v50_real', realBal); }
            bets[id].active = true; bets[id].amt = a;
            updateUI();
            document.getElementById('bBtn'+id).innerText = "CASH OUT";
            document.getElementById('bBtn'+id).style.background = "#ea580c";
        }

        // --- UTILS ---
        function setMode(demo) {
            isDemo = demo;
            document.getElementById('mDemo').className = demo ? "mode-btn bg-red-600 text-white" : "mode-btn bg-zinc-900 text-zinc-500";
            document.getElementById('mReal').className = !demo ? "mode-btn bg-green-600 text-black" : "mode-btn bg-zinc-900 text-zinc-500";
            updateUI();
        }
        function updateUI() {
            let val = (isDemo ? demoBal : realBal).toFixed(2);
            document.getElementById('hBal').innerText = val + " ETB";
            document.getElementById('uBal').innerText = val + " ETB";
            document.getElementById('statG').innerText = stats.g;
            document.getElementById('statW').innerText = stats.w;
        }
        function setB(id, v) { document.getElementById('bInp'+id).value = v; }
        function setAuto(id, v) { 
            bets[id].auto = bets[id].auto === v ? 0 : v;
            document.querySelectorAll(`#a2_${id}, #a4_${id}, #a8_${id}, #a10_${id}, #a50_${id}`).forEach(b => b.classList.remove('active'));
            if(bets[id].auto) document.getElementById(`a${v}_${id}`).classList.add('active');
        }
        function resetBUI(id) { document.getElementById('bBtn'+id).innerText = "BET"; document.getElementById('bBtn'+id).style.background = "var(--real-green)"; }
        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-'+id).classList.add('active');
        }
        function toggleMute() { isMuted = !isMuted; document.getElementById('mIcon').className = isMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high"; }
        function copyT(t) { navigator.clipboard.writeText(t); tg.showAlert("Copied!"); }

        // --- ADMIN & PHOTO (FIXED) ---
        function previewImg(i) { if(i.files[0]) { let r = new FileReader(); r.onload=(e)=>{document.getElementById('ssPrev').src=e.target.result;document.getElementById('prevBox').classList.remove('hidden');}; r.readAsDataURL(i.files[0]); } }
        function submitReceipt() {
            const f = document.getElementById('ssInp').files[0];
            const name = document.getElementById('depName').value;
            const amt = document.getElementById('depAmt').value;
            if(!f || !name || !amt) return tg.showAlert("Please fill all fields!");
            
            document.getElementById('sendBtn').innerText = "SENDING...";
            let r = new FileReader();
            r.onload = () => {
                let db = JSON.parse(localStorage.getItem('v50_db')) || [];
                db.push({ u: tg.initDataUnsafe?.user?.username || "Guest", n: name, a: amt, img: r.result, t: new Date().toLocaleTimeString() });
                localStorage.setItem('v50_db', JSON.stringify(db));
                tg.showAlert("✅ Success! Sent to Admin.");
                document.getElementById('sendBtn').innerText = "SEND TO ADMIN";
                document.getElementById('prevBox').classList.add('hidden');
                document.getElementById('ssInp').value = "";
            };
            r.readAsDataURL(f);
        }
        function openAdm() { document.getElementById('admModal').classList.remove('hidden'); loadAdm(); }
        function closeAdm() { document.getElementById('admModal').classList.add('hidden'); }
        function loadAdm() {
            const db = JSON.parse(localStorage.getItem('v50_db')) || [];
            document.getElementById('admList').innerHTML = db.map((it, i) => `
                <div class="glass p-5 rounded-3xl">
                    <p class="text-[10px] text-blue-400 font-black mb-2">USER: @${it.u} | TIME: ${it.t}</p>
                    <p class="text-xs font-bold mb-1">Name: ${it.n}</p>
                    <p class="text-xs font-bold mb-3 text-green-500">Amount: ${it.a} ETB</p>
                    <img src="${it.img}" class="rounded-xl mb-4 border border-white/10">
                    <div class="flex gap-2">
                        <button onclick="approve(${i})" class="flex-1 bg-green-600 py-3 rounded-xl font-black text-xs">APPROVE</button>
                        <button onclick="reject(${i})" class="flex-1 bg-red-600 py-3 rounded-xl font-black text-xs">REJECT</button>
                    </div>
                </div>
            `).join('') || "<p class='text-center opacity-30 mt-20'>No Pending Receipts</p>";
        }
        function approve(i) {
            let db = JSON.parse(localStorage.getItem('v50_db'));
            if(db[i].u === (tg.initDataUnsafe?.user?.username || "Guest")) { realBal += parseFloat(db[i].a); localStorage.setItem('v50_real', realBal); updateUI(); }
            db.splice(i,1); localStorage.setItem('v50_db', JSON.stringify(db)); loadAdm();
            tg.showAlert("Approved!");
        }
        function reject(i) { let db = JSON.parse(localStorage.getItem('v50_db')); db.splice(i,1); localStorage.setItem('v50_db', JSON.stringify(db)); loadAdm(); }

        function genBots() {
            const names = ["Yonas_X","Sol_Pro","Betty_V","Kaleb_21","Hana_W","Muller_J"];
            const list = document.getElementById('botList'); list.innerHTML = "";
            for(let i=0; i<5; i++) {
                list.innerHTML += `<div class="glass p-2 rounded-xl flex justify-between px-4"><span class="text-[11px] font-bold">${names[Math.floor(Math.random()*names.length)]} <i class="fa-solid fa-circle-check text-blue-500 text-[8px]"></i></span><span class="text-[9px] opacity-30 italic">Waiting...</span></div>`;
            }
        }
        function renderWinners() {
            const l = document.getElementById('winList'); const n = ["Dawit_F","Elias_S","Teddy_M","Bini_B","Sura_X"];
            for(let i=1; i<=20; i++) {
                l.innerHTML += `<div class="glass p-4 rounded-2xl flex justify-between items-center"><span class="text-xs font-bold uppercase">${n[i%5]}_${i} <i class="fa-solid fa-circle-check text-blue-500"></i></span><span class="text-green-500 font-black">${(Math.random()*15000+200).toFixed(0)} ETB</span></div>`;
            }
        }

        init();
    </script>
</body>
</html>
