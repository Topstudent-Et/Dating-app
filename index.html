<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER V40 ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #ff0044; --real-green: #00ff66; --demo-red: #ff3333; --gold: #ffd700; }
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* Dynamic Modes */
        .mode-real { --theme: var(--real-green); }
        .mode-demo { --theme: var(--demo-red); }

        /* Game Screen */
        .screen { background: radial-gradient(circle at bottom left, #1a0505 0%, #000 100%); height: 240px; position: relative; border-radius: 30px; overflow: hidden; border: 2px solid #111; }
        #gamePath { stroke: var(--theme); stroke-width: 6; fill: none; filter: drop-shadow(0 0 15px var(--theme)); transition: 0.1s; }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 45px; z-index: 10; transform: rotate(-15deg); }
        
        /* Navigation */
        .nav-top { position: fixed; top: 0; width: 100%; height: 75px; display: flex; justify-content: space-around; align-items: center; background: #050505; border-bottom: 1px solid #111; z-index: 1000; }
        .nav-item { color: #444; font-size: 10px; font-weight: 900; text-align: center; }
        .nav-item.active { color: var(--theme); }

        /* Podium */
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin: 25px 0; }
        .p-card { text-align: center; border-radius: 20px; background: rgba(255,255,255,0.02); border: 2px solid #222; position: relative; }
        .p1 { height: 150px; width: 110px; border-color: var(--gold); order: 2; z-index: 5; transform: scale(1.1); }
        .p2 { height: 120px; width: 95px; border-color: #c0c0c0; order: 1; }
        .p3 { height: 100px; width: 95px; border-color: #cd7f32; order: 3; }
        
        .v-badge { color: #38bdf8; font-size: 10px; margin-left: 2px; }
        .page { display: none; height: calc(100vh - 75px); margin-top: 75px; overflow-y: auto; padding: 15px; padding-bottom: 120px; }
        .active-page { display: block; }
        
        .btn-speed { background: #111; border: 1px solid #222; padding: 6px; border-radius: 8px; font-size: 9px; font-weight: 900; }
        .btn-speed.active { border-color: var(--theme); color: var(--theme); }
    </style>
</head>
<body class="mode-demo no-scrollbar">

    <nav class="nav-top">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-jet-fighter-up text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-2xl mb-1"></i><br>WALLET</div>
        <div onclick="showP('leaderboard')" id="n-leaderboard" class="nav-item"><i class="fa-solid fa-trophy text-2xl mb-1"></i><br>TOP</div>
        <div onclick="showP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user-gear text-2xl mb-1"></i><br>PROFILE</div>
    </nav>

    <section id="home" class="page active-page">
        <div class="flex gap-2 mb-4">
            <button onclick="setMode(true)" id="mBtnDemo" class="flex-1 py-4 bg-red-600 rounded-2xl font-black text-sm border-b-4 border-red-800 active:translate-y-1">DEMO MODE</button>
            <button onclick="setMode(false)" id="mBtnReal" class="flex-1 py-4 bg-zinc-900 text-zinc-600 rounded-2xl font-black text-sm border-b-4 border-zinc-800 active:translate-y-1">REAL MODE</button>
        </div>

        <div class="screen flex items-center justify-center mb-4">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 240 Q 0 240 0 240" /></svg>
            <div id="mTxt" class="font-game text-7xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane">✈️</div>
            <div id="waitMsg" class="absolute inset-0 bg-black/60 z-30 flex items-center justify-center hidden">
                <p class="font-black italic text-yellow-500 text-xl">WAITING FOR NEXT ROUND...</p>
            </div>
        </div>

        <div class="space-y-4">
            <div class="glass p-4 rounded-[30px]">
                <div class="flex gap-2 mb-3">
                    <div class="flex-1 flex bg-black p-2 rounded-xl items-center">
                        <button onclick="adj(1,-10)" class="px-3 font-black">-</button>
                        <input id="bInp1" type="number" value="10" class="w-full bg-transparent text-center font-black outline-none">
                        <button onclick="adj(1,10)" class="px-3 font-black">+</button>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="setB(1,100)" class="btn-speed">100</button>
                        <button onclick="setB(1,1000)" class="btn-speed">1k</button>
                    </div>
                </div>
                <div class="flex gap-2 mb-3">
                    <button id="auto2_1" onclick="setAuto(1,2)" class="btn-speed flex-1">AUTO 2x</button>
                    <button id="auto4_1" onclick="setAuto(1,4)" class="btn-speed flex-1">AUTO 4x</button>
                    <button id="auto10_1" onclick="setAuto(1,10)" class="btn-speed flex-1">AUTO 10x</button>
                </div>
                <button id="bBtn1" onclick="handleBet(1)" class="w-full py-5 rounded-2xl font-black italic text-2xl shadow-xl" style="background:var(--theme)">BET</button>
            </div>

            <div class="glass p-4 rounded-[30px]">
                <div class="flex gap-2 mb-3">
                    <div class="flex-1 flex bg-black p-2 rounded-xl items-center">
                        <button onclick="adj(2,-10)" class="px-3 font-black">-</button>
                        <input id="bInp2" type="number" value="10" class="w-full bg-transparent text-center font-black outline-none">
                        <button onclick="adj(2,10)" class="px-3 font-black">+</button>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="setB(2,100)" class="btn-speed">100</button>
                        <button onclick="setB(2,1000)" class="btn-speed">1k</button>
                    </div>
                </div>
                <div class="flex gap-2 mb-3">
                    <button id="auto2_2" onclick="setAuto(2,2)" class="btn-speed flex-1">AUTO 2x</button>
                    <button id="auto4_2" onclick="setAuto(2,4)" class="btn-speed flex-1">AUTO 4x</button>
                    <button id="auto10_2" onclick="setAuto(2,10)" class="btn-speed flex-1">AUTO 10x</button>
                </div>
                <button id="bBtn2" onclick="handleBet(2)" class="w-full py-5 rounded-2xl font-black italic text-2xl shadow-xl" style="background:var(--theme)">BET</button>
            </div>
        </div>

        <div id="liveList" class="mt-6 space-y-2 pb-10"></div>
    </section>

    <section id="deposit" class="page">
        <div class="glass p-6 rounded-[35px] mb-6">
            <h3 class="text-xs font-black text-yellow-500 mb-4">CBE BANK TRANSFER</h3>
            <div onclick="copyT('1000179571815')" class="flex justify-between items-center bg-black/40 p-5 rounded-2xl active:scale-95">
                <span class="text-xl font-black">1000179571815</span><i class="fa-solid fa-copy"></i>
            </div>
        </div>
        <div class="glass p-8 rounded-[40px] text-center border-2 border-dashed border-zinc-800">
            <input type="file" id="ssInp" class="hidden" onchange="previewImg(this)">
            <button onclick="document.getElementById('ssInp').click()" class="w-full py-5 rounded-2xl font-black bg-white/5 border border-white/5 mb-4">SELECT RECEIPT PHOTO</button>
            <div id="prevBox" class="hidden mb-6"><img id="ssPrev" class="rounded-2xl max-h-60 mx-auto"></div>
            <button onclick="submitReceipt()" class="w-full py-5 rounded-2xl font-black italic shadow-2xl" style="background:var(--theme)">CONFIRM & SEND</button>
        </div>
    </section>

    <section id="leaderboard" class="page">
        <div class="podium">
            <div class="p-card p2"><i class="fa-solid fa-medal text-zinc-400 text-2xl my-2"></i><p class="text-[10px] font-black">Aman_King</p><p class="text-[9px] text-green-500">45k ETB</p></div>
            <div class="p-card p1"><i class="fa-solid fa-crown text-yellow-500 text-4xl my-2"></i><p class="text-[11px] font-black">Dai_Fikadu <i class="fa-solid fa-circle-check v-badge"></i></p><p class="text-[10px] text-green-500">120k ETB</p></div>
            <div class="p-card p3"><i class="fa-solid fa-medal text-orange-700 text-2xl my-2"></i><p class="text-[10px] font-black">Sami_Pro</p><p class="text-[9px] text-green-500">28k ETB</p></div>
        </div>
        <div id="lList" class="space-y-2 pb-10"></div>
    </section>

    <section id="profile" class="page text-center">
        <div id="pfpArea" class="w-32 h-32 rounded-[50px] bg-zinc-900 mx-auto mt-10 mb-6 flex items-center justify-center border-4 border-white/5 overflow-hidden"></div>
        <h2 class="text-3xl font-black flex justify-center items-center">
            <span id="uName">@User</span> <i class="fa-solid fa-circle-check v-badge text-2xl"></i>
        </h2>
        <p id="uBal" class="text-2xl font-black text-green-500 mt-2">0.00 ETB</p>

        <div id="admBox" class="hidden mt-10 p-6 glass rounded-3xl border-2 border-red-600/30">
            <p class="text-red-600 font-black mb-4 italic">ADMIN PANEL ACCESS</p>
            <button onclick="openAdm()" class="w-full py-4 bg-red-600 rounded-xl font-black">MANAGE RECEIPTS</button>
        </div>
    </section>

    <div id="admModal" class="fixed inset-0 bg-black z-[2000] hidden flex flex-col p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-black text-red-600">PENDING APPROVALS</h2>
            <button onclick="closeAdm()" class="bg-zinc-800 px-4 py-2 rounded-lg font-black text-xs">CLOSE</button>
        </div>
        <div id="admList" class="space-y-4 overflow-y-auto no-scrollbar"></div>
    </div>

    <audio id="sndFly" loop src="https://www.soundjay.com/transportation/sounds/jet-plane-fly-over-1.mp3"></audio>
    <audio id="sndBoom" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADM_USER = "Dawit_Fikadu21";
        let isDemo = true; let isFlying = false; let mult = 1.0;
        let realBal = parseFloat(localStorage.getItem('v40_real')) || 0;
        let demoBal = 1000.00;
        let bets = { 1: { active: false, amt: 0, auto: 0 }, 2: { active: false, amt: 0, auto: 0 } };

        function init() {
            const user = tg.initDataUnsafe?.user;
            const name = user?.username || "Guest_User";
            document.getElementById('uName').innerText = "@" + name;
            document.getElementById('pfpArea').innerHTML = user?.photo_url ? `<img src="${user.photo_url}" class="w-full h-full object-cover">` : `<span class="text-4xl font-black">${name[0]}</span>`;
            if(name === ADM_USER) document.getElementById('admBox').classList.remove('hidden');
            updateUI(); renderWinners(); gameLoop();
        }

        // --- CORE GAME LOOP (24/7 Sync Simulation) ---
        function gameLoop() {
            if(isFlying) return;
            let count = 5;
            document.getElementById('waitMsg').classList.add('hidden');
            let t = setInterval(() => {
                count--;
                if(count <= 0) { clearInterval(t); launch(); }
                genBots();
            }, 1000);
        }

        function launch() {
            isFlying = true; mult = 1.0;
            document.getElementById('sndFly').play();
            
            // Logic: 10% Profit margin (Real mode only)
            let crash = 1.1 + (Math.random() * 9.0);
            if(!isDemo && (bets[1].active || bets[2].active)) crash = 1.1 + (Math.random() * 0.4);

            let eng = setInterval(() => {
                mult += 0.05;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 25, y = mult * 20;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px) rotate(-15deg)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 240 Q ${x/2} ${240-y} ${x+20} ${240-y-20}`);
                
                // Auto Cash-out
                [1,2].forEach(id => {
                    if(bets[id].active && bets[id].auto > 0 && mult >= bets[id].auto) handleBet(id);
                });

                if(mult >= crash) { clearInterval(eng); boom(); }
            }, 80);
        }

        function boom() {
            isFlying = false;
            document.getElementById('sndFly').pause(); document.getElementById('sndFly').currentTime = 0;
            document.getElementById('sndBoom').play();
            document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "#ff0044";
            document.getElementById('waitMsg').classList.remove('hidden');
            bets[1].active = bets[2].active = false; resetBUI(1); resetBUI(2);

            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0) rotate(-15deg)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 240 Q 0 240 0 240');
                document.getElementById('mTxt').style.color = "white";
                gameLoop();
            }, 4000);
        }

        function handleBet(id) {
            if(isFlying) {
                if(bets[id].active) {
                    let win = bets[id].amt * mult;
                    if(isDemo) demoBal += win; else { realBal += win; localStorage.setItem('v40_real', realBal); }
                    bets[id].active = false; resetBUI(id); updateUI();
                    tg.showAlert(`✅ WON ${win.toFixed(0)} ETB!`);
                }
                return;
            }
            let a = parseInt(document.getElementById('bInp'+id).value);
            let cur = isDemo ? demoBal : realBal;
            if(a > cur || a <= 0) return tg.showAlert("Insufficient Funds!");
            
            if(isDemo) demoBal -= a; else { realBal -= a; localStorage.setItem('v40_real', realBal); }
            bets[id].active = true; bets[id].amt = a;
            updateUI();
            document.getElementById('bBtn'+id).innerText = "CASH OUT";
            document.getElementById('bBtn'+id).style.background = "#ea580c";
        }

        // --- UTILS ---
        function setMode(demo) {
            isDemo = demo;
            document.body.className = demo ? "mode-demo" : "mode-real";
            document.getElementById('mBtnDemo').className = demo ? "flex-1 py-4 bg-red-600 rounded-2xl font-black text-sm border-b-4 border-red-800" : "flex-1 py-4 bg-zinc-900 text-zinc-600 rounded-2xl font-black text-sm";
            document.getElementById('mBtnReal').className = !demo ? "flex-1 py-4 bg-green-600 rounded-2xl font-black text-sm border-b-4 border-green-800" : "flex-1 py-4 bg-zinc-900 text-zinc-600 rounded-2xl font-black text-sm";
            updateUI();
        }
        function updateUI() { document.getElementById('uBal').innerText = (isDemo ? demoBal : realBal).toFixed(2) + " ETB"; }
        function adj(id, v) { let i = document.getElementById('bInp'+id); i.value = Math.max(10, parseInt(i.value)+v); }
        function setB(id, v) { document.getElementById('bInp'+id).value = v; }
        function setAuto(id, v) { 
            bets[id].auto = bets[id].auto === v ? 0 : v;
            document.querySelectorAll(`#auto2_${id}, #auto4_${id}, #auto10_${id}`).forEach(b => b.classList.remove('active'));
            if(bets[id].auto) document.getElementById(`auto${v}_${id}`).classList.add('active');
        }
        function resetBUI(id) { document.getElementById('bBtn'+id).innerText = "BET"; document.getElementById('bBtn'+id).style.background = "var(--theme)"; }
        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-'+id).classList.add('active');
        }

        // --- BOTS & WINNERS ---
        function genBots() {
            const names = ["Yonas_Tech","Hana_M","Abdu_21","Sol_Ethio","Betty_V","Kaleb_X","Muller_J"];
            const list = document.getElementById('liveList'); list.innerHTML = "";
            for(let i=0; i<6; i++) {
                list.innerHTML += `<div class="glass p-3 rounded-xl flex justify-between items-center"><span class="text-xs font-bold">${names[Math.floor(Math.random()*names.length)]} <i class="fa-solid fa-circle-check v-badge"></i></span><span class="text-[10px] opacity-50">Waiting...</span></div>`;
            }
        }
        function renderWinners() {
            const l = document.getElementById('lList');
            const n = ["Dawit_Dev","Elias_Sol","Fifi_Love","Teddy_M","Bini_Boy","Sura_X"];
            for(let i=0; i<20; i++) {
                l.innerHTML += `<div class="glass p-4 rounded-2xl flex justify-between items-center"><span class="text-xs font-bold uppercase">${n[i%6]} <i class="fa-solid fa-circle-check v-badge"></i></span><span class="text-green-500 font-black">${(Math.random()*15000+200).toFixed(0)} ETB</span></div>`;
            }
        }

        // --- ADMIN & PHOTO ---
        function previewImg(i) { if(i.files[0]) { let r = new FileReader(); r.onload = (e) => { document.getElementById('ssPrev').src = e.target.result; document.getElementById('prevBox').classList.remove('hidden'); }; r.readAsDataURL(i.files[0]); } }
        function submitReceipt() {
            const f = document.getElementById('ssInp').files[0];
            if(!f) return tg.showAlert("Select photo!");
            let r = new FileReader();
            r.onload = () => {
                let db = JSON.parse(localStorage.getItem('v40_db')) || [];
                db.push({ u: tg.initDataUnsafe?.user?.username || "Guest", img: r.result, t: new Date().toLocaleTimeString() });
                localStorage.setItem('v40_db', JSON.stringify(db));
                tg.showAlert("✅ Sent to Admin!");
                document.getElementById('prevBox').classList.add('hidden');
            };
            r.readAsDataURL(f);
        }
        function openAdm() { document.getElementById('admModal').classList.remove('hidden'); loadAdm(); }
        function closeAdm() { document.getElementById('admModal').classList.add('hidden'); }
        function loadAdm() {
            const db = JSON.parse(localStorage.getItem('v40_db')) || [];
            document.getElementById('admList').innerHTML = db.map((it, i) => `
                <div class="glass p-5 rounded-3xl"><p class="text-xs font-black mb-3">@${it.u} | ${it.t}</p><img src="${it.img}" class="rounded-xl mb-4"><div class="flex gap-2"><button onclick="approve(${i})" class="flex-1 bg-green-600 py-3 rounded-xl font-black">APPROVE</button><button onclick="reject(${i})" class="flex-1 bg-red-600 py-3 rounded-xl font-black">REJECT</button></div></div>
            `).join('') || "<p class='text-center opacity-30 mt-20'>No receipts</p>";
        }
        function approve(i) {
            let db = JSON.parse(localStorage.getItem('v40_db'));
            let amt = prompt("Amount?");
            if(amt) {
                if(db[i].u === (tg.initDataUnsafe?.user?.username || "Guest")) { realBal += parseFloat(amt); localStorage.setItem('v40_real', realBal); updateUI(); }
                db.splice(i,1); localStorage.setItem('v40_db', JSON.stringify(db)); loadAdm();
                tg.showAlert("Approved!");
            }
        }
        function reject(i) { let db = JSON.parse(localStorage.getItem('v40_db')); db.splice(i,1); localStorage.setItem('v40_db', JSON.stringify(db)); loadAdm(); }
        function copyT(t) { navigator.clipboard.writeText(t); tg.showAlert("Copied!"); }

        init();
    </script>
</body>
</html>
