<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Telegram Dating · Global Love Connection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s, border-color 0.2s;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        /* Light Theme (default) */
        :root {
            --bg-primary: #f5f7fb;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --accent: #ff477e;
            --accent-hover: #ff6b9d;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --navbar-bg: rgba(255,255,255,0.85);
        }
        body.dark {
            --bg-primary: #0a0f1e;
            --bg-secondary: #111827;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #2d3a5e;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
            --navbar-bg: rgba(15,23,42,0.95);
        }
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg-primary);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }
        /* Glass navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--navbar-bg);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff477e, #ff9f4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-icons {
            display: flex;
            gap: 18px;
            align-items: center;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-primary);
        }
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: var(--navbar-bg);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 10px 20px 24px;
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ff477e;
        }
        .tab-content {
            display: none;
            padding: 20px 16px 80px;
            animation: fade 0.2s;
        }
        .tab-content.active-tab {
            display: block;
        }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        /* Cards */
        .glass-card {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .btn-primary {
            background: linear-gradient(105deg, #ff477e, #ff8c42);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #ff477e;
            color: #ff477e;
            padding: 10px 20px;
            border-radius: 60px;
            cursor: pointer;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        /* Swipe Card */
        .swipe-card {
            background: var(--bg-card);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .swipe-photo {
            height: 380px;
            background-size: cover;
            background-position: center;
        }
        /* Post Feed */
        .post-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .post-media {
            margin: 12px 0;
            border-radius: 20px;
            overflow: hidden;
        }
        .post-media img, .post-media video {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
        }
        .action-buttons {
            display: flex;
            gap: 24px;
            margin-top: 12px;
        }
        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
        }
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-card {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 28px;
            width: 90%;
            max-width: 380px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-message {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 10px;
            margin: 8px 0;
        }
        hr {
            border-color: var(--border);
            margin: 12px 0;
        }
        /* Theme toggle specific */
        .theme-toggle-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">💕 Telegram Dating</div>
        <div class="nav-icons">
            <button class="icon-btn" id="themeToggleBtn"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" id="notificationIcon"><i class="fas fa-bell"></i></button>
        </div>
    </div>

    <!-- Tab Content: Swipe (Discover) -->
    <div id="swipeTab" class="tab-content active-tab">
        <div class="flex-between"><h3>✨ Discover Matches</h3><button id="filterBtn" class="btn-outline" style="padding:6px 16px;">Filter</button></div>
        <div id="swipeContainer" style="margin-top: 20px;"></div>
    </div>

    <!-- Tab Content: Feed (Posts like TikTok) -->
    <div id="feedTab" class="tab-content">
        <div class="glass-card" style="padding:16px;">
            <textarea id="postContent" rows="2" placeholder="Share your moment..."></textarea>
            <div style="display:flex; gap:12px; margin-top:12px;">
                <button id="uploadPhotoPostBtn" class="btn-outline" style="flex:1;"><i class="fas fa-image"></i> Photo</button>
                <button id="uploadVideoPostBtn" class="btn-outline" style="flex:1;"><i class="fas fa-video"></i> Video</button>
                <button id="publishPostBtn" class="btn-primary" style="width:auto; padding:10px 20px;">Post</button>
            </div>
            <input type="file" id="postPhotoFile" accept="image/*" style="display:none">
            <input type="file" id="postVideoFile" accept="video/*" style="display:none">
        </div>
        <div id="postsFeed"></div>
    </div>

    <!-- Tab Content: Messages -->
    <div id="messagesTab" class="tab-content">
        <h3>💬 Conversations</h3>
        <div id="messagesList"></div>
        <div id="chatDetail" style="display:none; margin-top:16px;">
            <div class="flex-between"><button id="backToMessages" class="btn-outline">← Back</button><span id="chatUserName"></span></div>
            <div id="chatMessagesArea" style="height:300px; overflow-y:auto; margin:12px 0;"></div>
            <div style="display:flex; gap:8px;"><input type="text" id="chatInput" placeholder="Type..."><button id="sendChatMsgBtn" class="btn-primary" style="width:auto;">Send</button></div>
        </div>
    </div>

    <!-- Tab Content: Profile -->
    <div id="profileTab" class="tab-content">
        <div class="glass-card" style="text-align:center;">
            <img id="profilePhoto" src="https://randomuser.me/api/portraits/women/68.jpg" style="width:100px;height:100px;border-radius:50%;object-fit:cover;">
            <h3 id="profileName">User</h3>
            <p id="profileBio">Love to travel and meet new people</p>
            <button id="editProfileBtn" class="btn-outline">Edit Profile</button>
            <button id="upgradeVipBtn" class="btn-primary" style="margin-top:12px;">👑 Upgrade VIP</button>
            <hr>
            <div class="flex-between"><span>💰 Coins: <span id="coinBalance">100</span></span><button id="buyCoinsBtn" class="btn-outline" style="padding:4px 12px;">Buy</button></div>
            <button id="logoutBtn" class="btn-outline" style="margin-top:12px; border-color:#ff477e;">Logout</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" data-tab="swipe"><i class="fas fa-fire"></i><span>Discover</span></button>
        <button class="nav-item" data-tab="feed"><i class="fas fa-play-circle"></i><span>Feed</span></button>
        <button class="nav-item" data-tab="messages"><i class="fas fa-comment-dots"></i><span>Chats</span></button>
        <button class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Profile</span></button>
    </div>
</div>

<!-- Auth Modal -->
<div id="authModal" class="modal">
    <div class="modal-card">
        <h2 style="text-align:center;">💕 Telegram Dating</h2>
        <p style="text-align:center;">Sign up to find love worldwide</p>
        <input type="text" id="regName" placeholder="Full Name">
        <input type="tel" id="regPhone" placeholder="Phone (with country code)">
        <input type="password" id="regPassword" placeholder="Password">
        <input type="text" id="regDob" placeholder="Birth Date (YYYY-MM-DD)">
        <button id="registerBtn" class="btn-primary">Register / Login</button>
        <p style="font-size:12px; text-align:center; margin-top:12px;">© 2026 Telegram Dating — Global Love</p>
    </div>
</div>

<script>
    // ---------- GLOBAL STATE ----------
    let currentUser = null;
    let users = [];
    let videos = [];       // posts (video/photo)
    let matches = [];      // matched user ids
    let messages = [];
    let notifications = [];
    let currentChatWith = null;

    // Load/Save
    function saveData() {
        localStorage.setItem("td_users", JSON.stringify(users));
        localStorage.setItem("td_posts", JSON.stringify(videos));
        localStorage.setItem("td_matches", JSON.stringify(matches));
        localStorage.setItem("td_messages", JSON.stringify(messages));
        localStorage.setItem("td_notifications", JSON.stringify(notifications));
        if(currentUser) localStorage.setItem("td_currentUser", JSON.stringify(currentUser));
    }
    function loadData() {
        const u = localStorage.getItem("td_users");
        if(u) users = JSON.parse(u);
        const p = localStorage.getItem("td_posts");
        if(p) videos = JSON.parse(p);
        const m = localStorage.getItem("td_matches");
        if(m) matches = JSON.parse(m);
        const msg = localStorage.getItem("td_messages");
        if(msg) messages = JSON.parse(msg);
        const n = localStorage.getItem("td_notifications");
        if(n) notifications = JSON.parse(n);
        const cu = localStorage.getItem("td_currentUser");
        if(cu) currentUser = JSON.parse(cu);
        if(users.length === 0) {
            users.push({ id: 1, name: "Emma", phone: "+251911111111", password: "123", dob: "1995-01-01", bio: "Adventure seeker", photo: "https://randomuser.me/api/portraits/women/1.jpg", coins: 100, vip: false });
            users.push({ id: 2, name: "Liam", phone: "+251922222222", password: "123", dob: "1992-05-12", bio: "Coffee lover", photo: "https://randomuser.me/api/portraits/men/2.jpg", coins: 80, vip: false });
            users.push({ id: 3, name: "Sofia", phone: "+251933333333", password: "123", dob: "1998-03-22", bio: "Dancer 💃", photo: "https://randomuser.me/api/portraits/women/3.jpg", coins: 120, vip: true });
            saveData();
        }
        if(videos.length === 0) {
            videos.push({ id: 101, userId: 1, mediaType: "video", mediaUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", caption: "Sunset vibes 🔥", likes: 45, comments: [], shares: 0, timestamp: Date.now() });
            videos.push({ id: 102, userId: 2, mediaType: "image", mediaUrl: "https://picsum.photos/id/29/400/300", caption: "Nature escape 🌿", likes: 32, comments: [], shares: 0, timestamp: Date.now() });
            saveData();
        }
    }

    // Helper functions
    function addNotification(userId, text) {
        notifications.push({ id: Date.now(), userId, text, read: false, createdAt: Date.now() });
        saveData();
    }

    function renderSwipe() {
        const otherUsers = users.filter(u => u.id !== currentUser?.id && !matches.includes(u.id));
        const container = document.getElementById("swipeContainer");
        if(otherUsers.length === 0) { container.innerHTML = `<div class="glass-card">🎉 No more profiles! Check later.</div>`; return; }
        const profile = otherUsers[0];
        container.innerHTML = `
            <div class="swipe-card">
                <div class="swipe-photo" style="background-image: url('${profile.photo}');"></div>
                <div style="padding:20px;">
                    <h2>${profile.name}, ${new Date().getFullYear() - new Date(profile.dob).getFullYear()}</h2>
                    <p>${profile.bio}</p>
                    <div style="display:flex; gap:16px; margin-top:20px;">
                        <button id="swipeLeftBtn" class="btn-outline" style="flex:1;">❌ Pass</button>
                        <button id="swipeRightBtn" class="btn-primary" style="flex:1;">❤️ Like</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById("swipeLeftBtn")?.addEventListener("click", () => { renderSwipe(); });
        document.getElementById("swipeRightBtn")?.addEventListener("click", () => {
            if(!matches.includes(profile.id)) {
                matches.push(profile.id);
                addNotification(profile.id, `${currentUser.name} liked you! 💕`);
                // check mutual
                const otherMatches = JSON.parse(localStorage.getItem("td_matches") || "[]");
                if(otherMatches.includes(currentUser.id)) {
                    alert(`🎉 It's a match with ${profile.name}! Start chatting.`);
                    addNotification(profile.id, `You matched with ${currentUser.name}!`);
                }
                saveData();
            }
            renderSwipe();
        });
    }

    function renderFeed() {
        const feedDiv = document.getElementById("postsFeed");
        if(!feedDiv) return;
        const sorted = [...videos].reverse();
        feedDiv.innerHTML = sorted.map(post => {
            const user = users.find(u => u.id === post.userId);
            return `
                <div class="post-card" data-id="${post.id}">
                    <div class="flex-between"><div><strong>${user?.name || "User"}</strong> <span style="font-size:11px;">${new Date(post.timestamp).toLocaleString()}</span></div></div>
                    <p>${post.caption}</p>
                    <div class="post-media">${post.mediaType === "image" ? `<img src="${post.mediaUrl}">` : `<video controls src="${post.mediaUrl}"></video>`}</div>
                    <div class="action-buttons">
                        <button class="action-btn like-post" data-id="${post.id}"><i class="far fa-heart"></i> ${post.likes}</button>
                        <button class="action-btn comment-post" data-id="${post.id}"><i class="far fa-comment"></i> ${post.comments?.length || 0}</button>
                        <button class="action-btn share-post" data-id="${post.id}"><i class="fas fa-share"></i></button>
                        <button class="action-btn copy-post" data-id="${post.id}"><i class="fas fa-link"></i></button>
                    </div>
                </div>
            `;
        }).join('');
        attachPostEvents();
    }

    function attachPostEvents() {
        document.querySelectorAll(".like-post").forEach(btn => {
            btn.onclick = () => { const id = parseInt(btn.getAttribute("data-id")); const post = videos.find(p => p.id === id); if(post){ post.likes++; saveData(); renderFeed(); addNotification(post.userId, `${currentUser.name} liked your post`); } };
        });
        document.querySelectorAll(".comment-post").forEach(btn => {
            btn.onclick = () => { const id = parseInt(btn.getAttribute("data-id")); const comment = prompt("Write a comment:"); if(comment){ const post = videos.find(p => p.id === id); if(post){ if(!post.comments) post.comments=[]; post.comments.push({userId:currentUser.id, text:comment}); saveData(); renderFeed(); addNotification(post.userId, `${currentUser.name} commented: "${comment.slice(0,30)}"`); } } };
        });
        document.querySelectorAll(".share-post").forEach(btn => {
            btn.onclick = () => { alert("📤 Shared to feed!"); };
        });
        document.querySelectorAll(".copy-post").forEach(btn => {
            btn.onclick = () => { const id = btn.getAttribute("data-id"); navigator.clipboard.writeText(`https://tdating.app/post/${id}`); alert("Link copied!"); };
        });
    }

    function renderMessages() {
        const container = document.getElementById("messagesList");
        if(!container) return;
        const myMatches = matches.filter(mid => users.find(u => u.id === mid));
        if(myMatches.length === 0) { container.innerHTML = "<p>No matches yet. Swipe to connect!</p>"; return; }
        container.innerHTML = myMatches.map(mid => {
            const u = users.find(u => u.id === mid);
            return `<div class="chat-message" data-uid="${u.id}" style="cursor:pointer; display:flex; justify-content:space-between;"><span><strong>${u.name}</strong></span><span><i class="fas fa-comment"></i></span></div>`;
        }).join('');
        document.querySelectorAll("[data-uid]").forEach(el => {
            el.addEventListener("click", () => openChat(parseInt(el.getAttribute("data-uid"))));
        });
    }

    function openChat(otherId) {
        currentChatWith = otherId;
        const other = users.find(u => u.id === otherId);
        document.getElementById("chatUserName").innerText = other.name;
        document.getElementById("messagesList").style.display = "none";
        document.getElementById("chatDetail").style.display = "block";
        loadChatMessages(otherId);
    }

    function loadChatMessages(otherId) {
        const chatMessages = messages.filter(m => (m.from === currentUser.id && m.to === otherId) || (m.from === otherId && m.to === currentUser.id));
        const container = document.getElementById("chatMessagesArea");
        container.innerHTML = chatMessages.map(msg => `<div style="text-align:${msg.from === currentUser.id ? 'right' : 'left'}; margin:8px;"><span style="background:${msg.from === currentUser.id ? '#ff477e' : '#2c2c2c'}; padding:8px 14px; border-radius:20px; display:inline-block;">${msg.text}</span></div>`).join('');
        container.scrollTop = container.scrollHeight;
    }

    function sendMessage(toId, text) {
        if(!text.trim()) return;
        messages.push({ id: Date.now(), from: currentUser.id, to: toId, text, timestamp: Date.now() });
        saveData();
        loadChatMessages(toId);
        addNotification(toId, `New message from ${currentUser.name}`);
    }

    // Registration
    document.getElementById("registerBtn")?.addEventListener("click", () => {
        const name = document.getElementById("regName").value.trim();
        const phone = document.getElementById("regPhone").value.trim();
        const pass = document.getElementById("regPassword").value;
        const dob = document.getElementById("regDob").value;
        if(!name || !phone || !pass || !dob) { alert("Fill all fields"); return; }
        let user = users.find(u => u.phone === phone && u.password === pass);
        if(!user) {
            user = { id: Date.now(), name, phone, password: pass, dob, bio: "New to Telegram Dating", photo: "https://randomuser.me/api/portraits/women/68.jpg", coins: 100, vip: false };
            users.push(user);
            saveData();
            alert("Account created!");
        } else { alert("Welcome back " + user.name); }
        currentUser = user;
        saveData();
        document.getElementById("authModal").style.display = "none";
        document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active-tab"));
        document.getElementById("swipeTab").classList.add("active-tab");
        renderSwipe();
        renderFeed();
        renderMessages();
        document.getElementById("profileName").innerText = currentUser.name;
        document.getElementById("profileBio").innerText = currentUser.bio;
        document.getElementById("coinBalance").innerText = currentUser.coins;
        document.getElementById("profilePhoto").src = currentUser.photo;
    });

    // Theme Toggle (Dark/Light)
    let isDark = false;
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
        isDark = !isDark;
        if(isDark) document.body.classList.add("dark");
        else document.body.classList.remove("dark");
        localStorage.setItem("td_theme", isDark ? "dark" : "light");
    });
    const savedTheme = localStorage.getItem("td_theme");
    if(savedTheme === "dark") { isDark = true; document.body.classList.add("dark"); }

    // Tab switching
    document.querySelectorAll(".nav-item").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            const tab = btn.getAttribute("data-tab");
            document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active-tab"));
            document.getElementById(`${tab}Tab`).classList.add("active-tab");
            if(tab === "swipe") renderSwipe();
            if(tab === "feed") renderFeed();
            if(tab === "messages") { renderMessages(); document.getElementById("chatDetail").style.display = "none"; document.getElementById("messagesList").style.display = "block"; }
            if(tab === "profile") { document.getElementById("profileName").innerText = currentUser?.name; document.getElementById("profileBio").innerText = currentUser?.bio; }
        });
    });

    // Post creation
    let pendingMedia = null, pendingMediaType = null;
    document.getElementById("uploadPhotoPostBtn")?.addEventListener("click", () => document.getElementById("postPhotoFile").click());
    document.getElementById("uploadVideoPostBtn")?.addEventListener("click", () => document.getElementById("postVideoFile").click());
    document.getElementById("postPhotoFile")?.addEventListener("change", (e) => { const f = e.target.files[0]; if(f){ const r = new FileReader(); r.onload = ev => { pendingMedia = ev.target.result; pendingMediaType = "image"; alert("Photo ready"); }; r.readAsDataURL(f); } });
    document.getElementById("postVideoFile")?.addEventListener("change", (e) => { const f = e.target.files[0]; if(f){ const r = new FileReader(); r.onload = ev => { pendingMedia = ev.target.result; pendingMediaType = "video"; alert("Video ready"); }; r.readAsDataURL(f); } });
    document.getElementById("publishPostBtn")?.addEventListener("click", () => {
        const caption = document.getElementById("postContent").value;
        if(!caption && !pendingMedia) { alert("Write something or add media"); return; }
        const newPost = { id: Date.now(), userId: currentUser.id, mediaType: pendingMediaType || null, mediaUrl: pendingMedia || null, caption: caption || "Shared a moment", likes: 0, comments: [], shares: 0, timestamp: Date.now() };
        videos.push(newPost);
        saveData();
        renderFeed();
        document.getElementById("postContent").value = "";
        pendingMedia = null; pendingMediaType = null;
    });

    // Messages
    document.getElementById("sendChatMsgBtn")?.addEventListener("click", () => {
        const input = document.getElementById("chatInput");
        if(currentChatWith && input.value.trim()) { sendMessage(currentChatWith, input.value); input.value = ""; }
    });
    document.getElementById("backToMessages")?.addEventListener("click", () => {
        document.getElementById("chatDetail").style.display = "none";
        document.getElementById("messagesList").style.display = "block";
        currentChatWith = null;
    });

    // VIP & Coins
    document.getElementById("upgradeVipBtn")?.addEventListener("click", () => { if(currentUser){ currentUser.vip = true; alert("VIP Activated! Unlimited likes & gifts"); saveData(); } });
    document.getElementById("buyCoinsBtn")?.addEventListener("click", () => { if(currentUser){ currentUser.coins += 500; alert("500 coins added! 💎"); saveData(); document.getElementById("coinBalance").innerText = currentUser.coins; } });
    document.getElementById("logoutBtn")?.addEventListener("click", () => { currentUser = null; localStorage.removeItem("td_currentUser"); location.reload(); });
    document.getElementById("notificationIcon")?.addEventListener("click", () => { alert(`🔔 You have ${notifications.filter(n => n.userId === currentUser?.id && !n.read).length} new notifications`); });

    // Initial load
    loadData();
    if(!currentUser) document.getElementById("authModal").style.display = "flex";
    else { document.getElementById("authModal").style.display = "none"; renderSwipe(); renderFeed(); renderMessages(); document.getElementById("profileName").innerText = currentUser.name; document.getElementById("profileBio").innerText = currentUser.bio; document.getElementById("coinBalance").innerText = currentUser.coins; document.getElementById("profilePhoto").src = currentUser.photo; }
</script>
</body>
</html>
