<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WORLD GAME - Multiplayer Crash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; font-family: 'Inter', sans-serif; }
        .multiplier { font-family: 'Orbitron', monospace; text-shadow: 0 0 20px red; }
        .crash-text { animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="bg-black/80 backdrop-blur rounded-3xl p-6 w-full max-w-md border border-red-800 shadow-2xl">
            <h1 class="text-3xl font-bold text-center text-red-600 mb-2">✈️ WORLD GAME</h1>
            <div class="text-center">
                <div id="multiplier" class="multiplier text-7xl font-black my-4">1.00x</div>
                <div id="status" class="text-yellow-500 text-sm mb-2">⏳ በመጠበቅ ላይ...</div>
                <div id="history" class="text-xs text-gray-400 mb-4 flex flex-wrap justify-center gap-1"></div>
                
                <div class="bg-gray-900 rounded-2xl p-4 mb-4">
                    <div class="flex justify-between mb-2">
                        <span>💰 ባላንስ:</span>
                        <span id="balance" class="text-green-400 font-bold">100.00 ETB</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="number" id="betAmount" value="10" class="bg-black text-white p-2 rounded-xl w-full border border-gray-700">
                        <button id="betBtn" class="bg-red-600 px-6 py-2 rounded-xl font-bold">ውርርድ</button>
                    </div>
                </div>
                
                <button id="cashoutBtn" disabled class="w-full bg-orange-600 py-4 rounded-xl font-bold text-xl disabled:opacity-50 disabled:bg-gray-600 transition">💸 CASH OUT</button>
                
                <div id="message" class="mt-4 text-sm text-gray-400"></div>
            </div>
        </div>
        <p class="text-[10px] text-gray-600 mt-6">ሁሉም ተጫዋቾች አንድ አይነት ጨዋታ ይጫወታሉ | 20% ክራሽ በ1.00x</p>
    </div>

    <script>
        const socket = io();
        let balance = 100.00;
        let currentBet = 0;
        let hasBet = false;
        let currentMultiplier = 1.00;
        let gameActive = false;

        const balanceEl = document.getElementById('balance');
        const multiplierEl = document.getElementById('multiplier');
        const statusEl = document.getElementById('status');
        const historyEl = document.getElementById('history');
        const betBtn = document.getElementById('betBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const messageEl = document.getElementById('message');

        function updateBalanceUI() {
            balanceEl.innerText = balance.toFixed(2) + ' ETB';
        }

        function showMessage(msg, isError = false) {
            messageEl.innerText = msg;
            messageEl.className = 'mt-4 text-sm ' + (isError ? 'text-red-400' : 'text-green-400');
            setTimeout(() => { messageEl.innerText = ''; }, 3000);
        }

        // ከሰርቨር የሚመጡ ክስተቶች
        socket.on('current_state', (data) => {
            gameActive = data.isRunning;
            currentMultiplier = data.multiplier;
            multiplierEl.innerText = data.multiplier.toFixed(2) + 'x';
            if (!data.isRunning) {
                statusEl.innerHTML = '💥 ክራሽ! ቀጣዩን ይጠብቁ...';
                cashoutBtn.disabled = true;
            } else {
                statusEl.innerHTML = '✈️ ጨዋታ እየሄደ ነው';
                if (hasBet) cashoutBtn.disabled = false;
            }
            // ታሪክ ማሳየት
            historyEl.innerHTML = data.history.map(p => `<span class="bg-gray-800 px-2 py-1 rounded-full text-xs">${p.toFixed(2)}x</span>`).join('');
        });

        socket.on('multiplier_update', (mult) => {
            currentMultiplier = mult;
            multiplierEl.innerText = mult.toFixed(2) + 'x';
            if (hasBet && gameActive) {
                cashoutBtn.disabled = false;
                cashoutBtn.innerText = `💸 CASH OUT (${(currentBet * mult).toFixed(2)} ETB)`;
            }
        });

        socket.on('crash', () => {
            gameActive = false;
            statusEl.innerHTML = '💥 ክራሽ! ገንዘብዎ ጠፋ';
            cashoutBtn.disabled = true;
            if (hasBet) {
                showMessage(`😭 ክራሽ! ${currentBet} ETB ጠፋ`, true);
                hasBet = false;
                currentBet = 0;
            }
        });

        socket.on('round_start', () => {
            gameActive = true;
            statusEl.innerHTML = '✈️ አዲስ ዙር ተጀምሯል! ውርርድ ያድርጉ';
            cashoutBtn.disabled = true;
            cashoutBtn.innerText = '💸 CASH OUT';
        });

        socket.on('admin_message', (msg) => {
            showMessage(msg);
        });

        // ውርርድ ማድረግ
        betBtn.onclick = () => {
            if (gameActive) {
                showMessage('ዙሩ በሂደት ላይ ነው፣ ቀጣዩን ይጠብቁ', true);
                return;
            }
            let amount = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(amount) || amount <= 0) {
                showMessage('ትክክለኛ መጠን ያስገቡ', true);
                return;
            }
            if (amount > balance) {
                showMessage('በቂ ባላንስ የለም', true);
                return;
            }
            balance -= amount;
            currentBet = amount;
            hasBet = true;
            updateBalanceUI();
            showMessage(`✅ ${amount} ETB ውርርድ ተደርጓል. ክራሽ ከመከሰቱ በፊት CASH OUT ያድርጉ`);
        };

        // ካሽ አውት
        cashoutBtn.onclick = () => {
            if (!hasBet || !gameActive) return;
            let win = currentBet * currentMultiplier;
            balance += win;
            hasBet = false;
            currentBet = 0;
            updateBalanceUI();
            cashoutBtn.disabled = true;
            cashoutBtn.innerText = '💸 CASH OUT';
            showMessage(`🎉 አሸንፈዋል! ${win.toFixed(2)} ETB ተጨምሯል`);
        };

        updateBalanceUI();

        // አድሚን ቀጣይ ክራሽ ለማዘጋጀት (በኮንሶል ይጠቀሙ)
        window.adminForceCrash = (crashPoint) => {
            socket.emit('admin_force_crash', { secret: 'admin123', crashPoint: crashPoint });
        };
        console.log('አድሚን ከሆኑ: adminForceCrash(1.50) ብለው ይሞክሩ');
    </script>
</body>
</html>
