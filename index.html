<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Aviator - Dai Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0d;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        .game-wrapper {
            width: 100%;
            max-width: 450px;
            background: #1b1c21;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 50px rgba(233, 30, 99, 0.2);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .logo { color: #e91e63; font-weight: bold; font-size: 24px; }

        /* የጨዋታው ሜዳ */
        #game-area {
            width: 100%;
            height: 250px;
            background: linear-gradient(to bottom, #141517, #1e1f24);
            margin: 15px 0;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        #multiplier {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            font-weight: 900;
            z-index: 10;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        canvas { width: 100%; height: 100%; }

        /* የመጫወቻ ቁልፎች */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bet-box {
            background: #2c2d33;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .main-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .bet-btn { background: #28a745; color: white; }
        .cash-btn { background: #ffc107; color: black; display: none; }
        .reset-btn { background: #e91e63; color: white; display: none; }

        .history {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            overflow-x: auto;
        }

        .hist-item {
            background: #333;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
            color: #ffc107;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header">
        <div class="logo">AVIATOR</div>
        <div id="balance">💰 1,000.00 ETB</div>
    </div>

    <div class="history" id="historyLog">
        <span class="hist-item">1.50x</span>
        <span class="hist-item">2.10x</span>
    </div>

    <div id="game-area">
        <div id="multiplier">1.00x</div>
        <canvas id="aviatorCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="bet-box">
            <button id="betBtn" class="main-btn bet-btn" onclick="startGame()">BET</button>
            <button id="cashBtn" class="main-btn cash-btn" onclick="cashOut()">CASH OUT</button>
            <button id="resetBtn" class="main-btn reset-btn" onclick="prepareNext()">NEXT ROUND</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('aviatorCanvas');
    const ctx = canvas.getContext('2d');
    const multDisplay = document.getElementById('multiplier');
    const histLog = document.getElementById('historyLog');

    let multiplier = 1.00;
    let isFlying = false;
    let crashPoint;
    let animationFrame;
    let time = 0;

    // ካንቫሱን ማስተካከል
    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function drawScene(progress) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // የመስመሩ ስዕል (Curve)
        ctx.beginPath();
        ctx.strokeStyle = "#e91e63";
        ctx.lineWidth = 5;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#e91e63";
        
        ctx.moveTo(0, canvas.height);
        let targetX = (progress - 1) * (canvas.width / 4);
        let targetY = canvas.height - ((progress - 1) * (canvas.height / 4));
        
        // አውሮፕላኑ እንዳይወጣ መቆጣጠሪያ
        targetX = Math.min(targetX, canvas.width - 50);
        targetY = Math.max(targetY, 50);

        ctx.quadraticCurveTo(targetX / 2, canvas.height, targetX, targetY);
        ctx.stroke();

        // አውሮፕላኑን መሳል
        ctx.shadowBlur = 0;
        ctx.font = "40px Arial";
        ctx.fillText("✈️", targetX - 20, targetY + 10);
    }

    function startGame() {
        if (isFlying) return;

        isFlying = true;
        multiplier = 1.00;
        crashPoint = (Math.random() * 10 + 1.1).toFixed(2); // በዘፈቀደ መውደቂያ

        document.getElementById('betBtn').style.display = 'none';
        document.getElementById('cashBtn').style.display = 'block';
        multDisplay.style.color = "white";

        animate();
    }

    function animate() {
        if (!isFlying) return;

        multiplier += 0.005 * Math.sqrt(multiplier); // ፍጥነቱ በሂደት ይጨምራል
        multDisplay.innerText = multiplier.toFixed(2) + "x";
        
        drawScene(multiplier);

        if (multiplier >= crashPoint) {
            crash();
            return;
        }

        animationFrame = requestAnimationFrame(animate);
    }

    function crash() {
        isFlying = false;
        cancelAnimationFrame(animationFrame);
        multDisplay.innerText = "FLEW AWAY!";
        multDisplay.style.color = "#ff4444";
        
        // ታሪክ ላይ ጨምር
        const item = document.createElement('span');
        item.className = 'hist-item';
        item.innerText = multiplier.toFixed(2) + 'x';
        histLog.prepend(item);

        document.getElementById('cashBtn').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'block';
    }

    function cashOut() {
        if (!isFlying) return;
        isFlying = false;
        cancelAnimationFrame(animationFrame);

        multDisplay.style.color = "#28a745";
        alert("አሸንፈሃል! " + multiplier.toFixed(2) + "x");

        document.getElementById('cashBtn').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'block';
    }

    function prepareNext() {
        multiplier = 1.00;
        multDisplay.innerText = "1.00x";
        multDisplay.style.color = "white";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        document.getElementById('resetBtn').style.display = 'none';
        document.getElementById('betBtn').style.display = 'block';
    }
</script>

</body>
</html>
