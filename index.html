<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIATOR ETHIOPIA | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Glassmorphism UI */
        .glass-panel { background: rgba(30, 30, 30, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        
        /* Button Animations */
        .click-effect:active { transform: scale(0.92); filter: brightness(1.2); transition: 0.1s; }
        .bet-btn { background: linear-gradient(180deg, #28a745 0%, #1e7e34 100%); transition: all 0.3s; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3); }
        .bet-btn.active-bet { background: linear-gradient(180deg, #f97316 0%, #c2410c 100%); box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); }
        .amt-btn { background: #222; border: 1px solid #444; border-radius: 12px; font-size: 14px; font-weight: bold; transition: 0.3s; }
        .amt-btn:active { background: #34b4ff; border-color: #34b4ff; }

        /* Game Screen */
        .game-area { background: radial-gradient(circle at center, #1a2a3a 0%, #000 100%); height: 240px; border-radius: 24px; position: relative; border: 1px solid #333; }
        #flew-away { display: none; color: #ff0000; font-size: 40px; font-weight: 900; z-index: 10; text-shadow: 0 0 20px rgba(255,0,0,0.5); }

        /* Profile & Winners */
        .profile-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #000 100%); }
        .winner-rank-1 { border: 2px solid #ffd700; background: rgba(255, 215, 0, 0.1); }
        
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 100px; }
        .page.active { display: block; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .nav-btn { color: #888; transition: 0.3s; }
        .nav-btn.active { color: #34b4ff; transform: translateY(-5px); }
    </style>
</head>
<body class="p-3">

    <div class="flex justify-between items-center mb-4">
        <div class="text-red-600 font-black italic text-2xl tracking-tighter">AVIATOR</div>
        <div onclick="showPage('walletPage')" class="bg-zinc-900 px-4 py-2 rounded-2xl border border-zinc-700 flex items-center gap-2 click-effect">
            <span id="balanceDisp" class="text-green-500 font-bold">0.00 ETB</span>
            <i class="fas fa-wallet text-zinc-400"></i>
        </div>
    </div>

    <div id="playPage" class="page active">
        <div class="game-area flex items-center justify-center mb-4">
            <div id="flew-away" class="absolute">FLEW AWAY!</div>
            <div id="multiplier" class="text-6xl font-black">1.00x</div>
            <div id="plane" class="absolute bottom-10 left-10 text-5xl">✈️</div>
        </div>

        <div class="space-y-3">
            <div class="glass-panel p-4">
                <div class="grid grid-cols-4 gap-2 mb-3">
                    <button onclick="setAmt(1, 10)" class="amt-btn py-2 click-effect">10</button>
                    <button onclick="setAmt(1, 50)" class="amt-btn py-2 click-effect">50</button>
                    <button onclick="setAmt(1, 100)" class="amt-btn py-2 click-effect">100</button>
                    <button onclick="setAmt(1, 200)" class="amt-btn py-2 click-effect">200</button>
                </div>
                <div class="flex gap-3">
                    <div class="w-1/3 flex flex-col gap-1">
                        <button class="bg-zinc-800 text-[10px] rounded py-1">Auto 2x</button>
                        <button class="bg-zinc-800 text-[10px] rounded py-1">Auto 4x</button>
                    </div>
                    <button id="betBtn1" onclick="handleBet(1)" class="bet-btn w-2/3 rounded-2xl font-black text-xl click-effect">BET</button>
                </div>
            </div>
        </div>
    </div>

    <div id="winnersPage" class="page">
        <div class="text-center mb-6">
            <i class="fas fa-award text-4xl text-yellow-500 mb-2"></i>
            <h2 class="text-2xl font-black">TOP 50 PLAYERS</h2>
        </div>
        <div class="flex justify-center items-end gap-3 mb-8 px-2">
            <div class="glass-panel w-1/3 p-3 text-center h-28 flex flex-col justify-center">
                <span class="text-2xl">🥈</span>
                <p class="text-[10px] font-bold">Abebe_Teklu</p>
                <p class="text-green-500 font-bold">45,000</p>
            </div>
            <div class="glass-panel w-1/3 p-4 text-center h-36 border-yellow-500 winner-rank-1 flex flex-col justify-center">
                <span class="text-4xl">👑</span>
                <p class="text-xs font-bold">Dawit_Dev</p>
                <p class="text-green-400 font-black text-lg">120,500</p>
            </div>
            <div class="glass-panel w-1/3 p-3 text-center h-24 flex flex-col justify-center">
                <span class="text-2xl">🥉</span>
                <p class="text-[10px] font-bold">Mulu_G</p>
                <p class="text-green-500 font-bold">28,300</p>
            </div>
        </div>
        <div id="winnersList" class="space-y-2"></div>
    </div>

    <div id="walletPage" class="page">
        <div class="glass-panel p-6 mb-4 flex justify-between">
            <button onclick="setWalletMode('dep')" class="text-xl font-bold border-b-2 border-green-500">Deposit</button>
            <button onclick="setWalletMode('wit')" class="text-xl font-bold text-zinc-500">Withdraw</button>
        </div>
        
        <div id="depUI" class="space-y-4">
            <div class="bg-white/5 p-4 rounded-2xl flex items-center gap-4">
                <img src="1000067890.png" class="w-12 h-12">
                <div><p class="text-xs text-zinc-400">CBE Account</p><p class="font-bold">1000179571815</p></div>
            </div>
            <div class="bg-white/5 p-4 rounded-2xl flex items-center gap-4">
                <img src="1000067892.png" class="w-12 h-12">
                <div><p class="text-xs text-zinc-400">Telebirr</p><p class="font-bold">0906067696</p></div>
            </div>
            <input type="text" id="ftNum" placeholder="FT Number / Transaction Ref" class="w-full bg-zinc-900 p-4 rounded-2xl outline-none border border-zinc-700">
            <input type="number" id="depAmtInput" placeholder="Amount (ETB)" class="w-full bg-zinc-900 p-4 rounded-2xl outline-none border border-zinc-700">
            <button onclick="sendToAdmin()" class="w-full bg-green-600 py-4 rounded-2xl font-black click-effect">SEND DEPOSIT REQUEST</button>
        </div>
    </div>

    <div id="profilePage" class="page">
        <div class="profile-gradient rounded-[40px] p-8 text-center border border-zinc-800 mb-6">
            <div class="relative w-24 h-24 mx-auto mb-4">
                <img id="pfp" src="https://via.placeholder.com/100" class="rounded-full border-4 border-blue-500">
                <div class="absolute bottom-0 right-0 bg-blue-500 rounded-full p-1"><i class="fas fa-check text-[10px]"></i></div>
            </div>
            <h2 class="text-2xl font-black italic"><span id="pName">User_Name</span></h2>
            <p class="text-blue-400 text-xs font-bold tracking-widest">VERIFIED PLAYER</p>
        </div>
        <div class="grid grid-cols-2 gap-4 px-2">
            <div class="glass-panel p-5 text-center">
                <p class="text-[10px] text-zinc-500 mb-1">TOTAL WON</p>
                <p class="text-xl font-black text-green-500">12,400.00</p>
            </div>
            <div class="glass-panel p-5 text-center">
                <p class="text-[10px] text-zinc-500 mb-1">GAMES PLAYED</p>
                <p class="text-xl font-black">154</p>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full h-20 bg-black/80 backdrop-blur-lg border-t border-zinc-800 flex justify-around items-center px-4 z-50">
        <button onclick="showPage('playPage')" class="nav-btn active flex flex-col items-center"><i class="fas fa-plane"></i><span class="text-[10px] mt-1">Play</span></button>
        <button onclick="showPage('winnersPage')" class="nav-btn flex flex-col items-center"><i class="fas fa-trophy"></i><span class="text-[10px] mt-1">Winners</span></button>
        <button onclick="showPage('walletPage')" class="nav-btn flex flex-col items-center"><i class="fas fa-wallet"></i><span class="text-[10px] mt-1">Wallet</span></button>
        <button onclick="showPage('profilePage')" class="nav-btn flex flex-col items-center"><i class="fas fa-user-tie"></i><span class="text-[10px] mt-1">Profile</span></button>
    </nav>

    <script>
        let balance = 0.00;
        let isGameRunning = false;
        let currentMult = 1.0;
        let myBet = { active: false, amt: 10 };
        
        // Audio Effects (Mockup - You can add real URLs)
        const playSound = (type) => {
            const audio = new Audio();
            if(type === 'click') audio.src = 'https://www.soundjay.com/buttons/button-16.mp3';
            if(type === 'crash') audio.src = 'https://www.soundjay.com/free-music/fart-01.mp3'; // Replace with proper crash sound
            audio.play().catch(()=>{});
        };

        const tg = window.Telegram.WebApp;
        if(tg.initDataUnsafe.user) {
            document.getElementById('pName').innerText = tg.initDataUnsafe.user.first_name;
            if(tg.initDataUnsafe.user.photo_url) document.getElementById('pfp').src = tg.initDataUnsafe.user.photo_url;
        }

        function showPage(id) {
            playSound('click');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function setAmt(slot, val) {
            playSound('click');
            myBet.amt = val;
            document.getElementById('betBtn1').innerText = `BET ${val} ETB`;
        }

        function startEngine() {
            if(isGameRunning) return;
            isGameRunning = true;
            currentMult = 1.0;
            document.getElementById('flew-away').style.display = 'none';
            document.getElementById('multiplier').style.display = 'block';
            
            // 80/20 Profit Logic
            let crashPoint = myBet.active ? (1.05 + Math.random() * 2.1) : (10 + Math.random() * 60);

            let loop = setInterval(() => {
                currentMult += 0.01 * (currentMult / 1.4);
                document.getElementById('multiplier').innerText = currentMult.toFixed(2) + "x";
                
                let x = (currentMult - 1) * 35;
                let y = (currentMult - 1) * 18;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px)`;

                if(currentMult >= crashPoint) {
                    clearInterval(loop);
                    onCrash();
                }
            }, 60);
        }

        function onCrash() {
            playSound('crash');
            document.getElementById('multiplier').style.display = 'none';
            document.getElementById('flew-away').style.display = 'block';
            isGameRunning = false;
            myBet.active = false;
            document.getElementById('betBtn1').innerText = "BET";
            document.getElementById('betBtn1').classList.remove('active-bet');
            
            setTimeout(() => {
                document.getElementById('plane').style.transform = `translate(0, 0)`;
                startEngine();
            }, 4000);
        }

        function handleBet(slot) {
            if(!isGameRunning) return alert("Wait for next round!");
            let btn = document.getElementById('betBtn1');
            
            if(!myBet.active) {
                if(balance < myBet.amt) return alert("Insufficient funds!");
                myBet.active = true;
                btn.classList.add('active-bet');
                btn.innerText = "CASHOUT";
            } else {
                let win = myBet.amt * currentMult;
                balance += win;
                updateBal();
                alert(`SUCCESS! You Won ${win.toFixed(2)} ETB`);
                myBet.active = false;
                btn.innerText = "BET";
                btn.classList.remove('active-bet');
            }
        }

        function updateBal() {
            document.getElementById('balanceDisp').innerText = balance.toFixed(2) + " ETB";
        }

        function sendToAdmin() {
            let ft = document.getElementById('ftNum').value;
            let amt = document.getElementById('depAmtInput').value;
            if(!ft || !amt) return alert("Fill all details!");
            
            // This would normally be an API call to your Telegram Bot
            alert(`Admin Notification Sent!\nFT: ${ft}\nAmt: ${amt}\nStatus: Pending Approval`);
        }

        function loadWinners() {
            const list = document.getElementById('winnersList');
            const names = ["Yonas", "Lensa", "Tadesse", "Hiwot", "Bereket", "Sifan", "Meskerm", "Desta"];
            for(let i=4; i<=50; i++) {
                let n = names[Math.floor(Math.random()*names.length)] + "_" + i;
                list.innerHTML += `
                    <div class="glass-panel p-3 flex justify-between items-center mx-2 mb-2">
                        <span class="text-zinc-500 font-bold">#${i}</span>
                        <span class="font-bold">${n}</span>
                        <span class="text-green-500 font-black">${(200000 / i).toFixed(2)} ETB</span>
                    </div>`;
            }
        }

        window.onload = () => {
            loadWinners();
            startEngine();
        };
    </script>
</body>
</html>
