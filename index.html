<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER V36 FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #ff0044; --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32; }
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* History Bar */
        .history-bar::-webkit-scrollbar { display: none; }
        .pill { padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; background: #111; border: 1px solid #333; flex-shrink: 0; }

        /* Nav */
        .nav-top { position: fixed; top: 0; width: 100%; height: 70px; display: flex; justify-content: space-around; align-items: center; background: #080808; border-bottom: 1px solid #111; z-index: 1000; }
        .nav-item { color: #444; font-size: 10px; font-weight: 800; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--accent); }

        .page { display: none; height: calc(100vh - 70px); margin-top: 70px; overflow-y: auto; padding: 12px; padding-bottom: 100px; }
        .active-page { display: block; }

        /* Game Screen */
        .screen { background: radial-gradient(circle at bottom left, #200505 0%, #000 100%); height: 220px; position: relative; border-radius: 20px; overflow: hidden; border: 1px solid #1a1a1a; }
        #gamePath { stroke: var(--accent); stroke-width: 5; fill: none; filter: drop-shadow(0 0 10px var(--accent)); }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 40px; z-index: 10; transition: 0.1s linear; }
        
        /* Verified Badge with Gear */
        .v-badge { color: #38bdf8; font-size: 10px; position: relative; top: -1px; }
        
        /* Podium Style */
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 5px; margin: 20px 0; }
        .p-card { text-align: center; padding: 10px; border-radius: 15px; background: rgba(255,255,255,0.02); border-width: 2px; }
        .p1 { height: 140px; width: 100px; border-color: var(--gold); order: 2; box-shadow: 0 0 15px rgba(255,215,0,0.1); }
        .p2 { height: 115px; width: 90px; border-color: var(--silver); order: 1; }
        .p3 { height: 95px; width: 90px; border-color: var(--bronze); order: 3; }

        /* Double Bet UI */
        .bet-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 12px; }
    </style>
</head>
<body class="no-scrollbar">

    <nav class="nav-top">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-plane-up text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-2xl mb-1"></i><br>WALLET</div>
        <div onclick="showP('leaderboard')" id="n-leaderboard" class="nav-item"><i class="fa-solid fa-crown text-2xl mb-1"></i><br>WINNERS</div>
        <div onclick="showP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user-shield text-2xl mb-1"></i><br>ADMIN</div>
    </nav>

    <section id="home" class="page active-page no-scrollbar">
        <div id="history" class="history-bar flex gap-2 overflow-x-auto mb-3 no-scrollbar py-1">
            <span class="pill text-blue-400">1.20x</span>
            <span class="pill text-purple-500">5.43x</span>
            <span class="pill text-red-500">1.00x</span>
        </div>

        <div class="flex justify-between items-center mb-3">
             <div class="flex items-center gap-2">
                <div id="hPfp" class="w-10 h-10 rounded-xl bg-zinc-900 border border-white/10 flex items-center justify-center overflow-hidden"></div>
                <div>
                    <p class="text-[11px] font-black flex items-center"><span id="hName">@User</span> <i class="fa-solid fa-certificate v-badge ml-1"></i></p>
                    <p id="hBal" class="text-[10px] font-bold text-green-500">0.00 ETB</p>
                </div>
            </div>
            <button onclick="toggleMute()" class="w-9 h-9 glass rounded-full flex items-center justify-center"><i id="mIcon" class="fa-solid fa-volume-high text-xs"></i></button>
        </div>

        <div class="screen flex items-center justify-center mb-4">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 220 Q 0 220 0 220" /></svg>
            <div id="mTxt" class="font-game text-6xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane">✈️</div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bet-box">
                <input id="bInp1" type="number" value="10" class="w-full bg-black/40 text-center font-black py-2 rounded-lg mb-2 outline-none text-sm">
                <button id="bBtn1" onclick="handleBet(1)" class="w-full py-3 rounded-xl font-black text-xs uppercase" style="background:var(--accent)">BET</button>
            </div>
            <div class="bet-box">
                <input id="bInp2" type="number" value="10" class="w-full bg-black/40 text-center font-black py-2 rounded-lg mb-2 outline-none text-sm">
                <button id="bBtn2" onclick="handleBet(2)" class="w-full py-3 rounded-xl font-black text-xs uppercase" style="background:var(--accent)">BET</button>
            </div>
        </div>

        <div id="liveList" class="space-y-1 pb-10"></div>
    </section>

    <section id="deposit" class="page no-scrollbar">
        <div class="glass p-5 rounded-3xl mb-5">
            <p class="text-[9px] text-zinc-500 mb-3 uppercase font-black">CBE Bank Transfer</p>
            <div onclick="copyT('1000179571815')" class="flex justify-between items-center bg-zinc-900/50 p-4 rounded-xl border border-white/5 active:scale-95">
                <span class="font-black text-sm">1000179571815</span><i class="fa-solid fa-copy text-yellow-600"></i>
            </div>
        </div>

        <div class="glass p-6 rounded-[35px] text-center border-2 border-dashed border-zinc-800">
            <h3 class="font-black text-xs mb-5 uppercase tracking-widest text-zinc-400">Upload Receipt / ደረሰኝ ላክ</h3>
            <input type="file" id="ssInp" class="hidden" accept="image/*" onchange="previewImg(this)">
            <button onclick="document.getElementById('ssInp').click()" class="w-full bg-white/5 py-4 rounded-xl font-black mb-3 border border-white/5 text-xs">📂 SELECT FILE</button>
            <div id="prevBox" class="hidden mb-5"><img id="ssPrev" class="rounded-xl max-h-48 mx-auto shadow-2xl"></div>
            <button id="submitBtn" onclick="submitReceipt()" class="w-full py-4 rounded-xl font-black uppercase text-sm shadow-xl" style="background:var(--accent)">Confirm & Send</button>
        </div>
    </section>

    <section id="leaderboard" class="page no-scrollbar">
        <div class="podium">
            <div class="p-card p2"><i class="fa-solid fa-medal text-zinc-400 text-2xl mb-2"></i><p class="text-[9px] font-black">@Abebe_X</p><p class="text-[8px] text-green-500">42,500 ETB</p></div>
            <div class="p-card p1"><i class="fa-solid fa-crown text-yellow-500 text-4xl mb-2"></i><p class="text-[10px] font-black">@Dai_Dev <i class="fa-solid fa-certificate v-badge"></i></p><p class="text-[9px] text-green-500">95,800 ETB</p></div>
            <div class="p-card p3"><i class="fa-solid fa-medal text-orange-700 text-2xl mb-2"></i><p class="text-[9px] font-black">@Chaltu_O</p><p class="text-[8px] text-green-500">28,100 ETB</p></div>
        </div>
        <div id="lList" class="space-y-2 pb-20"></div>
    </section>

    <section id="profile" class="page">
        <div id="admArea" class="hidden">
            <h2 class="text-red-600 font-black italic mb-5">PENDING APPROVALS</h2>
            <div id="admList" class="space-y-4"></div>
        </div>
        <div id="noAdm" class="text-center mt-20 opacity-20">
            <i class="fa-solid fa-lock text-6xl mb-4"></i><br>RESTRICTED
        </div>
    </section>

    <audio id="sndJet" loop src="https://www.soundjay.com/transportation/sounds/jet-plane-fly-over-1.mp3"></audio>
    <audio id="sndBoom" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADM_USER = "Dawit_Fikadu21";
        let isMuted = false; let isFlying = false; let mult = 1.0;
        let realBal = parseFloat(localStorage.getItem('v36_bal')) || 0;
        let bets = { 1: { active: false, amt: 0 }, 2: { active: false, amt: 0 } };

        function init() {
            const user = tg.initDataUnsafe?.user;
            const uname = user?.username || "Dai_Dev";
            document.getElementById('hName').innerText = "@" + uname;
            
            const pfpHtml = user?.photo_url ? `<img src="${user.photo_url}" class="w-full h-full object-cover">` : `<div class="w-full h-full bg-zinc-900 flex items-center justify-center font-black">${uname[0]}</div>`;
            document.getElementById('hPfp').innerHTML = pfpHtml;

            if(uname === ADM_USER) {
                document.getElementById('admArea').classList.remove('hidden');
                document.getElementById('noAdm').classList.add('hidden');
                loadAdm();
            }
            updateDisplay(); renderLeaders(); loop();
        }

        // --- GAME ENGINE ---
        function loop() {
            if(isFlying) return;
            let timer = 5;
            let t = setInterval(() => {
                if(timer-- <= 0) { clearInterval(t); launch(); }
            }, 1000);
        }

        function launch() {
            isFlying = true; mult = 1.0;
            if(!isMuted) document.getElementById('sndJet').play();
            
            let crash = 1.1 + (Math.random() * 8.0);
            if((bets[1].active && bets[1].amt > 50) || (bets[2].active && bets[2].amt > 50)) crash = 1.1 + (Math.random() * 0.4);

            let eng = setInterval(() => {
                mult += 0.05;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 25, y = mult * 20;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px) rotate(-15deg)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 220 Q ${x/2} ${220-y} ${x+20} ${220-y-20}`);
                
                if(mult >= crash) { clearInterval(eng); explode(); }
            }, 80);
        }

        function explode() {
            isFlying = false;
            document.getElementById('sndJet').pause(); document.getElementById('sndJet').currentTime = 0;
            if(!isMuted) document.getElementById('sndBoom').play();
            
            const hist = document.getElementById('history');
            hist.innerHTML = `<span class="pill ${mult > 2 ? 'text-purple-500' : 'text-blue-400'}">${mult.toFixed(2)}x</span>` + hist.innerHTML;
            
            document.getElementById('mTxt').innerText = "FLEW AWAY";
            document.getElementById('mTxt').style.color = "#ff0044";
            bets[1].active = bets[2].active = false; resetBUI(1); resetBUI(2);
            
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 220 Q 0 220 0 220');
                document.getElementById('mTxt').style.color = "white";
                loop();
            }, 3000);
        }

        function handleBet(id) {
            if(isFlying) {
                if(bets[id].active) {
                    let win = bets[id].amt * mult;
                    realBal += win; localStorage.setItem('v36_bal', realBal);
                    bets[id].active = false; resetBUI(id); updateDisplay();
                    tg.showAlert(`✅ WON ${win.toFixed(0)} ETB!`);
                }
                return;
            }
            let a = parseInt(document.getElementById('bInp' + id).value);
            if(a > realBal || a <= 0) return tg.showAlert("Insufficient Balance!");
            realBal -= a; localStorage.setItem('v36_bal', realBal);
            bets[id] = { active: true, amt: a };
            updateDisplay();
            document.getElementById('bBtn' + id).innerText = "CASH OUT";
            document.getElementById('bBtn' + id).style.background = "#ea580c";
        }

        // --- SYSTEM ---
        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-' + id).classList.add('active');
            if(id !== 'home') document.getElementById('sndJet').pause();
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mIcon').className = isMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
            if(isMuted) document.getElementById('sndJet').pause();
        }

        function updateDisplay() { document.getElementById('hBal').innerText = realBal.toFixed(2) + " ETB"; }
        function resetBUI(id) { document.getElementById('bBtn' + id).innerText = "BET"; document.getElementById('bBtn' + id).style.background = "var(--accent)"; }
        function copyT(t) { navigator.clipboard.writeText(t); tg.showAlert("Copped!"); }

        // --- PHOTO & ADMIN ---
        function previewImg(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => { document.getElementById('ssPrev').src = e.target.result; document.getElementById('prevBox').classList.remove('hidden'); };
                r.readAsDataURL(input.files[0]);
            }
        }

        function submitReceipt() {
            const f = document.getElementById('ssInp').files[0];
            if(!f) return tg.showAlert("Please select a file!");
            const r = new FileReader();
            r.onload = () => {
                let db = JSON.parse(localStorage.getItem('v36_db')) || [];
                db.push({ user: tg.initDataUnsafe?.user?.username || "Guest", img: r.result, time: new Date().toLocaleTimeString() });
                localStorage.setItem('v36_db', JSON.stringify(db));
                tg.showAlert("✅ Success! Sent to Admin.");
                document.getElementById('prevBox').classList.add('hidden');
                document.getElementById('ssInp').value = "";
            };
            r.readAsDataURL(f);
        }

        function loadAdm() {
            const db = JSON.parse(localStorage.getItem('v36_db')) || [];
            document.getElementById('admList').innerHTML = db.map((it, i) => `
                <div class="glass p-4 rounded-2xl border border-white/5">
                    <p class="text-[10px] text-blue-400 mb-2 font-black italic">@${it.user} | ${it.time}</p>
                    <img src="${it.img}" class="w-full rounded-xl mb-3 border border-white/5">
                    <div class="flex gap-2">
                        <button onclick="approve(${i})" class="flex-1 bg-green-600 py-3 rounded-xl font-black text-xs">APPROVE</button>
                        <button onclick="reject(${i})" class="flex-1 bg-red-600 py-3 rounded-xl font-black text-xs">REJECT</button>
                    </div>
                </div>`).join('') || "<p class='text-center opacity-30 mt-10'>No pending receipts</p>";
        }

        function approve(i) {
            let db = JSON.parse(localStorage.getItem('v36_db'));
            let amt = prompt("Amount to add?");
            if(amt) {
                if(db[i].user === (tg.initDataUnsafe?.user?.username || "Guest")) {
                    realBal += parseFloat(amt); localStorage.setItem('v36_bal', realBal); updateDisplay();
                }
                db.splice(i, 1); localStorage.setItem('v36_db', JSON.stringify(db)); loadAdm();
                tg.showAlert("✅ Added!");
            }
        }

        function reject(i) {
            let db = JSON.parse(localStorage.getItem('v36_db'));
            db.splice(i, 1); localStorage.setItem('v36_db', JSON.stringify(db)); loadAdm();
            tg.showAlert("Rejected.");
        }

        function renderLeaders() {
            const l = document.getElementById('lList'); l.innerHTML = "";
            for(let i=4; i<=50; i++) {
                l.innerHTML += `<div class="glass p-3 rounded-xl flex justify-between items-center"><div class="flex items-center gap-3"><span class="text-[8px] text-zinc-600">#${i}</span><span class="text-[11px] font-black uppercase">User_${i} <i class="fa-solid fa-certificate v-badge"></i></span></div><span class="text-green-500 font-black text-[10px]">${(Math.random()*5000+100).toFixed(0)} ETB</span></div>`;
            }
        }

        init();
    </script>
</body>
</html>
