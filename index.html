<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aviator - ከፍ ያለ ጨዋታ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, 'Montserrat', sans-serif;
            padding: 20px;
        }

        /* ዋና ካርድ */
        .game-container {
            max-width: 560px;
            width: 100%;
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255,255,255,0.08);
            border: 1px solid rgba(255,215,0,0.2);
            transition: all 0.2s;
        }

        /* ራስጌ */
        .game-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD966, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .balance-box {
            background: #070b14;
            border-radius: 100px;
            padding: 8px 20px;
            display: inline-flex;
            align-items: baseline;
            gap: 10px;
            margin-top: 12px;
            border: 1px solid #FFD96655;
        }

        .balance-label {
            color: #9aa4bf;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .balance-amount {
            color: #FFE484;
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .balance-currency {
            font-size: 1rem;
            color: #cdd9ff;
        }

        /* ማባዣ ሰሌዳ (multipliers history) */
        .multiplier-strip {
            background: #03060ecc;
            border-radius: 60px;
            padding: 12px 16px;
            margin: 16px 0 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid #2a2f3f;
        }

        .multiplier-chip {
            background: #11161f;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1.1rem;
            color: #f2c94c;
            box-shadow: inset 0 1px 0 #ffffff1a, 0 2px 6px black;
            font-family: monospace;
        }

        /* ማዕከላዊ ግራፊክ / አውሮፕላን ክልል */
        .flight-area {
            background: #01010180;
            border-radius: 48px;
            margin: 16px 0;
            padding: 20px 10px;
            text-align: center;
            border: 1px solid #ffd96655;
            position: relative;
            overflow: hidden;
        }

        .current-multiplier {
            font-size: 5rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            color: #FFE55C;
            text-shadow: 0 0 12px #ffb347;
            line-height: 1;
        }

        .plane-icon {
            font-size: 3rem;
            display: inline-block;
            margin-top: 8px;
            filter: drop-shadow(0 4px 6px black);
            animation: floatPlane 1.8s infinite ease;
        }

        @keyframes floatPlane {
            0% { transform: translateY(0px);}
            50% { transform: translateY(-6px);}
            100% { transform: translateY(0px);}
        }

        .status-badge {
            background: #1e2a3a;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 12px;
            color: #b9e6ff;
        }

        /* ውርርድ አካባቢ */
        .bet-section {
            background: #0b101ccc;
            border-radius: 42px;
            padding: 20px 16px;
            margin: 16px 0;
            border: 1px solid #2e3444;
        }

        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .bet-label {
            color: white;
            font-weight: 600;
            background: #00000055;
            padding: 6px 14px;
            border-radius: 32px;
            font-size: 0.9rem;
        }

        .bet-amount-input {
            background: #010101aa;
            border: 1px solid #ffd966aa;
            border-radius: 60px;
            padding: 8px 16px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #FFE6A3;
            width: 130px;
            text-align: center;
            font-family: monospace;
        }

        .quick-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: #1f2538;
            border: none;
            color: #FFE5A3;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 2px 4px black;
        }

        .quick-btn:active {
            transform: scale(0.96);
        }

        .action-buttons {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-cashout {
            background: linear-gradient(120deg, #f0b429, #ff8c42);
            border: none;
            padding: 14px 28px;
            font-weight: 800;
            font-size: 1.3rem;
            border-radius: 60px;
            color: #0a0f1e;
            width: 48%;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 6px 0 #7a3e0a;
        }

        .btn-place {
            background: linear-gradient(120deg, #2c6e9e, #1f4e72);
            border: none;
            padding: 14px 28px;
            font-weight: 800;
            font-size: 1.3rem;
            border-radius: 60px;
            color: white;
            width: 48%;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 6px 0 #0c2b3b;
        }

        .btn-cashout:active, .btn-place:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3a2a0a;
        }

        .info-stats {
            display: flex;
            justify-content: space-between;
            background: #02050ccc;
            border-radius: 28px;
            padding: 12px 20px;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #b7c3e6;
        }

        .fun-mode-tag {
            background: #ffcf4a;
            color: #1a1e2c;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        .round-history {
            display: flex;
            gap: 12px;
            justify-content: center;
            font-family: monospace;
            font-weight: bold;
            margin-top: 8px;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #6a7290;
            margin-top: 16px;
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="game-title">✈️ AVIATOR</div>
        <div class="balance-box">
            <span class="balance-label">ቀሪ ሒሳብ</span>
            <span class="balance-amount" id="balanceDisplay">50,000.00</span>
            <span class="balance-currency">ETB</span>
        </div>
    </div>

    <!-- FUN MODE እና ያለፉ ማባዣዎች -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 8px 0 4px;">
        <div class="fun-mode-tag">🎮 FUN MODE</div>
        <div style="font-size: 0.7rem; background: #00000066; padding: 4px 12px; border-radius: 20px;">ዝንባሌ ሙከራ</div>
    </div>
    <div class="multiplier-strip" id="multiplierHistory">
        <span class="multiplier-chip">1.31x</span>
        <span class="multiplier-chip">1.98x</span>
        <span class="multiplier-chip">2.29x</span>
        <span class="multiplier-chip">1.50x</span>
        <span class="multiplier-chip">16.69x</span>
        <span class="multiplier-chip">1.21x</span>
        <span class="multiplier-chip">1.42x</span>
    </div>

    <!-- ዋና የበረራ ክፍል -->
    <div class="flight-area">
        <div class="current-multiplier" id="liveMultiplier">1.00x</div>
        <div class="plane-icon">🛩️</div>
        <div class="status-badge" id="gameStatusText">⚡ ውርርድ አልተደረገም</div>
    </div>

    <!-- ውርርድ ቅንብሮች -->
    <div class="bet-section">
        <div class="bet-row">
            <span class="bet-label">💰 ውርርድ (ETB)</span>
            <input type="number" id="betAmount" class="bet-amount-input" value="4.00" step="1" min="1">
        </div>
        <div class="quick-buttons">
            <button class="quick-btn" data-bet="4">4 ETB</button>
            <button class="quick-btn" data-bet="16">16 ETB</button>
            <button class="quick-btn" data-bet="40">40 ETB</button>
            <button class="quick-btn" data-bet="80">80 ETB</button>
            <button class="quick-btn" data-bet="400">400 ETB</button>
        </div>
        <div class="action-buttons">
            <button class="btn-place" id="placeBetBtn">🚀 ውርርድ አስገባ</button>
            <button class="btn-cashout" id="cashoutBtn">💸 ገንዘብ አውጣ</button>
        </div>
    </div>

    <!-- የጨዋታ ስታቲስቲክስ -->
    <div class="info-stats">
        <span>🏆 ከፍተኛ ሽልማት: <span id="maxWinSpan">0.00</span> ETB</span>
        <span>🔄 ዙር: <span id="roundNumber">217</span>/<span id="totalRounds">218</span></span>
        <span>📈 የአሁን ማባዣ: <span id="currentMultiText">1.00x</span></span>
    </div>
    <div class="round-history" id="lastRounds">
        <!-- ተጨማሪ የማባዣ ታሪክ -->
    </div>
    <footer>⚡ አውሮፕላኑ ከመብረሩ በፊት ውርርድ ያስገቡ! በሚበርበት ጊዜ ማባዣ ይጨምራል።</footer>
</div>

<script>
    // ------------------- የጨዋታ ሁኔታ ------------------
    let balance = 50000.00;      // ETB
    let currentBet = 0.00;
    let isGameActive = false;     // ውርርድ ከተደረገ በኋላ አውሮፕላን እየበረረ ነው
    let currentMultiplier = 1.00;
    let animationFrame = null;
    let roundInterval = null;
    let roundActive = false;      // የአውሮፕላን ጨዋታ እየሄደ ነው (multiplier እየጨመረ)
    let lastMultipliers = [1.31, 1.98, 2.29, 1.50, 16.69, 1.21, 1.42];  // ያለፉ ውጤቶች
    let roundCounter = 217;
    let maxWin = 0.00;
    let gameLoopTimeout = null;

    // DOM elements
    const balanceSpan = document.getElementById('balanceDisplay');
    const liveMultiplierSpan = document.getElementById('liveMultiplier');
    const gameStatusSpan = document.getElementById('gameStatusText');
    const betInput = document.getElementById('betAmount');
    const placeBtn = document.getElementById('placeBetBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const maxWinSpan = document.getElementById('maxWinSpan');
    const roundNumberSpan = document.getElementById('roundNumber');
    const totalRoundsSpan = document.getElementById('totalRounds');
    const currentMultiText = document.getElementById('currentMultiText');
    const multiplierHistoryDiv = document.getElementById('multiplierHistory');
    const lastRoundsDiv = document.getElementById('lastRounds');

    // ተጨማሪ የማሳያ ተግባር
    function updateUI() {
        balanceSpan.innerText = balance.toFixed(2);
        if (maxWin < balance) {
            // ከፍተኛ ሽልማት መዝግብ (ከ cashout ጋር)
        }
        maxWinSpan.innerText = maxWin.toFixed(2);
        roundNumberSpan.innerText = roundCounter;
        totalRoundsSpan.innerText = roundCounter + 1;
        currentMultiText.innerText = currentMultiplier.toFixed(2) + 'x';
        liveMultiplierSpan.innerText = currentMultiplier.toFixed(2) + 'x';
    }

    // የማባዣ ታሪክ ማሳደግ
    function updateMultiplierHistory(newMult) {
        lastMultipliers.unshift(newMult);
        if(lastMultipliers.length > 8) lastMultipliers.pop();
        // ማሳያ ማደራጀት
        multiplierHistoryDiv.innerHTML = '';
        lastMultipliers.slice(0,7).forEach(m => {
            const chip = document.createElement('span');
            chip.className = 'multiplier-chip';
            chip.innerText = m.toFixed(2) + 'x';
            multiplierHistoryDiv.appendChild(chip);
        });
        // በታችኛው ረድፍ ላይ የቅርብ ጊዜ ውጤቶች
        lastRoundsDiv.innerHTML = lastMultipliers.slice(0,5).map(m => `<span style="background:#00000066; padding:4px 12px; border-radius:20px;">${m.toFixed(2)}x</span>`).join('');
    }

    // አዲስ ዙር ሲጀምር crash point ማመንጨት (1.00 - 100.00)
    function generateCrashPoint() {
        // እውነተኛ አቪዬተር መሰል RTP አሰራር: 1.00 እስከ 100 መካከል በራንደም ግን አንዳንድ ጊዜ በትንሹ ይወድቃል
        let r = Math.random();
        // አብዛኛውን ጊዜ ከ1.2 እስከ 10, አልፎ አልፎ ትልቅ
        if(r < 0.55) return 1 + Math.random() * 1.8;       // 1.00 - 2.80
        else if(r < 0.85) return 2.8 + Math.random() * 4;   // 2.8 - 6.8
        else return 7 + Math.random() * 25;                 // 7 - 32
    }

    let crashPoint = 0.00;
    let multiplierInterval = null;

    // ጨዋታ ማቆም (crash)
    function crashGame() {
        if(!roundActive) return;
        if(multiplierInterval) clearInterval(multiplierInterval);
        multiplierInterval = null;
        roundActive = false;
        // የአሁን ውርርድ ካለ እና ካልወጣ ማጣት
        if(isGameActive && currentBet > 0) {
            // ተጫዋቹ አልወጣም => ውርርድ ይቀንሳል
            balance -= currentBet;
            if(balance < 0) balance = 0;
            gameStatusSpan.innerText = `💥 አውሮፕላኑ ፈረሰ! ከሽሯል ${currentBet.toFixed(2)} ETB`;
            updateUI();
            currentBet = 0;
            isGameActive = false;
        }
        // የተዘጋጀ crash point ወደ ታሪክ መዝግብ
        let crashedMult = currentMultiplier;
        updateMultiplierHistory(crashedMult);
        // ዙሩ ተጠናቋል
        gameStatusSpan.style.background = "#4a1a2a";
        setTimeout(() => {
            if(!roundActive && !isGameActive) {
                gameStatusSpan.innerText = "🛬 አውሮፕላን ተደምስሷል. አዲስ ውርርድ ያስገቡ";
                gameStatusSpan.style.background = "#1e2a3a";
            }
        }, 1800);
        stopGameLoop();
        enableButtons(true);
    }

    // ማባዣ መጨመር (loop)
    function startMultiplierIncrease() {
        if(multiplierInterval) clearInterval(multiplierInterval);
        let step = 0;
        currentMultiplier = 1.00;
        updateUI();
        multiplierInterval = setInterval(() => {
            if(!roundActive) return;
            // ማባዣ መጨመር (ያለማቋረጥ)
            let increment = 0.02 + (Math.random() * 0.03);
            currentMultiplier = +(currentMultiplier + increment).toFixed(2);
            if(currentMultiplier >= crashPoint && roundActive) {
                // crash ይሆናል
                currentMultiplier = crashPoint;
                updateUI();
                crashGame();
                return;
            }
            updateUI();
            // ከፍተኛ ምንጭ ከሆነ እንዲያሳይ
            if(currentMultiplier > 50) {
                liveMultiplierSpan.style.color = "#ff4444";
            } else {
                liveMultiplierSpan.style.color = "#FFE55C";
            }
        }, 160);
    }

    function stopGameLoop() {
        if(multiplierInterval) {
            clearInterval(multiplierInterval);
            multiplierInterval = null;
        }
        if(gameLoopTimeout) clearTimeout(gameLoopTimeout);
        roundActive = false;
        // ጨዋታ ከጨረሰ በኋላ የ cashout/place እንዲሰራ
    }

    // ውርርድ ማስገባት (አዲስ ዙር መጀመር)
    function placeBet() {
        if(roundActive) {
            gameStatusSpan.innerText = "⚠️ አውሮፕላኑ በበረራ ላይ ነው! ቀጣዩን ዙር ይጠብቁ";
            return;
        }
        if(isGameActive) {
            gameStatusSpan.innerText = "ቀድሞ ውርርድ አለ. ይጠብቁ ወይም ገንዘብ ያውጡ";
            return;
        }
        let betVal = parseFloat(betInput.value);
        if(isNaN(betVal) || betVal <= 0) betVal = 4;
        if(betVal > balance) {
            gameStatusSpan.innerText = "❌ በቂ ገንዘብ የለም!";
            return;
        }
        if(betVal < 1) betVal = 1;
        currentBet = betVal;
        balance -= currentBet;
        updateUI();
        // አዲስ ዙር መክፈት
        roundActive = true;
        isGameActive = true;
        crashPoint = generateCrashPoint();
        currentMultiplier = 1.00;
        updateUI();
        // የጨዋታ ሁኔታ መለወጥ
        gameStatusSpan.innerText = `✈️ እየበረረ ነው... ማባዣ እየጨመረ ${currentMultiplier.toFixed(2)}x`;
        startMultiplierIncrease();
        enableButtons(false);
        // ከተወሰነ ጊዜ በኋላ crash ሊሆን ይችላል (ተጨማሪ ዋስትና)
    }

    // Cashout: ገንዘብ ማውጣት
    function cashout() {
        if(!roundActive || !isGameActive) {
            gameStatusSpan.innerText = "ንቁ ውርርድ የለም ወይም አውሮፕላኑ አልበረረም!";
            return;
        }
        if(currentBet <= 0) {
            gameStatusSpan.innerText = "ምንም ውርርድ የለም!";
            return;
        }
        // አሁን ባለው ማባዣ ይሰላል
        let winAmount = currentBet * currentMultiplier;
        balance += winAmount;
        if(winAmount > maxWin) maxWin = winAmount;
        updateUI();
        gameStatusSpan.innerText = `🎉 ገንዘብ ወጥቷል! አሸንፈዋል ${winAmount.toFixed(2)} ETB በ ${currentMultiplier.toFixed(2)}x`;
        // ውጤቱን ወደ ታሪክ ጨምር
        updateMultiplierHistory(currentMultiplier);
        // ጨዋታውን አቁም
        stopGameLoop();
        roundActive = false;
        isGameActive = false;
        currentBet = 0;
        enableButtons(true);
        // ማባዣ ዳራ መልሶ ማስጀመር
        currentMultiplier = 1.00;
        updateUI();
        liveMultiplierSpan.innerText = "1.00x";
        gameStatusSpan.style.background = "#1e5530";
        setTimeout(() => {
            if(!roundActive) gameStatusSpan.style.background = "#1e2a3a";
        },1500);
    }

    function enableButtons(enable) {
        if(enable) {
            placeBtn.disabled = false;
            cashoutBtn.disabled = false;
            betInput.disabled = false;
        } else {
            placeBtn.disabled = true;
            cashoutBtn.disabled = false;   // cashout ሁልጊዜ መጫን ይቻላል ጨዋታ በሚኖርበት ጊዜ
            betInput.disabled = true;
        }
        // ንቁ ውርርድ ሲኖር ውርርድ ማስገባት አይቻልም
        if(roundActive) {
            placeBtn.disabled = true;
        } else {
            placeBtn.disabled = false;
        }
    }

    // ፈጣን የውርርድ አዝራሮች
    document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if(roundActive) {
                gameStatusSpan.innerText = "እባክዎ የአውሮፕላኑን ዙር ይጠብቁ";
                return;
            }
            let val = parseFloat(btn.getAttribute('data-bet'));
            if(!isNaN(val)) {
                betInput.value = val.toFixed(2);
            }
        });
    });

    // ክስተቶች
    placeBtn.addEventListener('click', placeBet);
    cashoutBtn.addEventListener('click', cashout);

    // መጀመሪያ ላይ ማሳያ ማዘጋጀት
    function initGame() {
        updateUI();
        updateMultiplierHistory(1.08);
        lastMultipliers = [1.31, 1.98, 2.29, 1.50, 16.69, 1.21, 1.42];
        updateMultiplierHistory(1.08);
        currentMultiplier = 1.00;
        liveMultiplierSpan.innerText = "1.00x";
        gameStatusSpan.innerText = "✨ ውርርድ ያስገቡ እና አውሮፕላኑ እንዲበር ያድርጉ!";
        enableButtons(true);
        roundActive = false;
        isGameActive = false;
        currentBet = 0;
        roundCounter = 217;
        totalRoundsSpan.innerText = "218";
        roundNumberSpan.innerText = "217";
    }

    initGame();
    // ለማስመሰል ተጨማሪ ዙር መቁጠሪያ አውቶማቲክ ማደስ crash ሲደረግ
    function incrementRoundAfterCrash() {
        if(!roundActive && !isGameActive) {
            roundCounter++;
            roundNumberSpan.innerText = roundCounter;
            totalRoundsSpan.innerText = roundCounter+1;
        }
    }
    setInterval(() => {
        if(!roundActive && !isGameActive) {
            incrementRoundAfterCrash();
        }
    }, 800);
</script>
</body>
</html>
