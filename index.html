<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME - FLIGHT FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        
        /* አውሮፕላኑ የሚበርበት ሜዳ */
        .game-canvas { height: 300px; background: radial-gradient(circle at bottom left, #2a0505, #000); border-radius: 24px; margin: 10px; position: relative; border: 1.5px solid #333; overflow: hidden; }
        #multiplier { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 4rem; font-weight: 900; font-family: 'Orbitron'; z-index: 10; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        
        /* አውሮፕላኑ */
        #plane { 
            position: absolute; 
            font-size: 3.5rem; 
            z-index: 5; 
            transition: all 0.25s cubic-bezier(0.1, 0.7, 1.0, 0.1); 
            display: block; 
            filter: drop-shadow(0 0 15px rgba(255,0,0,0.5));
            transform: rotate(-10deg);
        }

        /* የሚንቀጠቀጥ አኒሜሽን */
        .vibrate { animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(-10deg); }
            20% { transform: translate(-1px, -1px) rotate(-11deg); }
            40% { transform: translate(-1px, 1px) rotate(-9deg); }
            60% { transform: translate(1px, -1px) rotate(-10deg); }
            80% { transform: translate(-1px, -1px) rotate(-11deg); }
            100% { transform: translate(1px, 1px) rotate(-10deg); }
        }

        .btn-bet { background: linear-gradient(180deg, #28a745, #1e7e34); border-bottom: 6px solid #145523; border-radius: 18px; }
        .btn-cash { background: linear-gradient(180deg, #ffc107, #d39e00); color: #000; border-bottom: 6px solid #916c00; border-radius: 18px; }
        
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 120px; }
        .active-page { display: block; }
        .nav-item { color: #444; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: #ff0000; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black">

    <header class="flex justify-between items-center p-4 bg-black border-b border-zinc-900 sticky top-0 z-[100]">
        <div class="font-game text-red-600 italic text-lg tracking-tighter">WORLD GAME</div>
        <div onclick="showPage('wallet')" class="bg-zinc-900 px-5 py-2 rounded-full border border-zinc-800 flex items-center gap-3 active:scale-90 transition">
            <span id="hBal" class="text-green-500 font-black text-sm">0.00</span>
            <i class="fas fa-wallet text-zinc-600 text-xs"></i>
        </div>
    </header>

    <div id="playPage" class="page active-page">
        <div class="game-canvas">
            <div id="multiplier">1.00x</div>
            <div id="plane" class="vibrate" style="left: 10%; bottom: 10%;">✈️</div>
            
            <div id="crashAlert" class="absolute inset-0 bg-black/90 hidden flex flex-col items-center justify-center z-50">
                <p class="text-zinc-500 font-black text-xs uppercase tracking-[5px]">FLEW AWAY!</p>
                <h1 id="crashVal" class="text-red-600 font-game text-6xl italic">1.00x</h1>
            </div>
        </div>

        <div id="admKill" class="hidden px-4 mb-4">
            <button onclick="socket.emit('adminAction', {type: 'CRASH_NOW'})" class="w-full bg-red-600/10 text-red-500 border border-red-600 py-3 rounded-2xl font-black text-xs italic">FORCE CRASH (ADMIN)</button>
        </div>

        <div class="grid grid-cols-1 gap-4 px-4">
            <div class="bg-zinc-900/40 p-5 rounded-[30px] border border-zinc-800 grid grid-cols-2 gap-4">
                <input type="number" id="a1" value="10" class="w-full bg-black border border-zinc-800 rounded-xl p-4 text-center font-black text-2xl outline-none">
                <button id="b1" onclick="handleBet(1)" class="btn-bet font-black text-xl italic">BET</button>
            </div>
            <div class="bg-zinc-900/40 p-5 rounded-[30px] border border-zinc-800 grid grid-cols-2 gap-4">
                <input type="number" id="a2" value="20" class="w-full bg-black border border-zinc-800 rounded-xl p-4 text-center font-black text-2xl outline-none">
                <button id="b2" onclick="handleBet(2)" class="btn-bet font-black text-xl italic">BET</button>
            </div>
        </div>
    </div>

    <div id="topPage" class="page p-6">
        <h2 class="text-center font-game text-yellow-500 mb-10 italic">TOP 50 WINNERS</h2>
        <div id="topList" class="space-y-4">
            <div class="bg-yellow-500/10 p-6 rounded-[25px] border border-yellow-500 flex justify-between items-center relative overflow-hidden">
                <span class="font-black flex items-center gap-3"><span class="text-3xl">👑</span> Dawit Fikadu</span>
                <span class="text-xl font-game text-white">185,200</span>
            </div>
            <div id="habeshaWinners"></div>
        </div>
    </div>

    <div id="walletPage" class="page p-6">
        <div class="flex bg-zinc-900 p-1.5 rounded-2xl mb-8 border border-zinc-800">
            <button onclick="setTab('D')" id="tabD" class="flex-1 py-4 bg-red-600 rounded-xl font-black text-xs">DEPOSIT</button>
            <button onclick="setTab('W')" id="tabW" class="flex-1 py-4 rounded-xl font-black text-xs text-zinc-500">WITHDRAW</button>
        </div>

        <div id="depArea" class="space-y-5">
            <div class="bg-zinc-900/80 p-6 rounded-[35px] border border-zinc-800 text-center">
                <p class="text-red-500 font-bold text-[10px] mb-2 uppercase italic">CBE (ንግድ ባንክ)</p>
                <p class="text-2xl font-black tracking-widest mb-6">1000179571815</p>
                <hr class="border-zinc-800 mb-6">
                <p class="text-yellow-500 font-bold text-[10px] mb-2 uppercase italic">Abyssinia (አቢሲኒያ)</p>
                <p class="text-2xl font-black tracking-widest">83920112</p>
            </div>
            <input type="number" id="dAmt" placeholder="Amount (ETB)" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl outline-none">
            <input type="text" id="dRef" placeholder="Transaction ID (FT...)" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl outline-none">
            <button onclick="sendReq('DEP')" class="w-full bg-blue-600 py-5 rounded-2xl font-black active:scale-95 transition">SEND TO ADMIN</button>
        </div>
    </div>

    <div id="adminPage" class="page p-6">
        <h2 class="text-center font-game text-red-600 mb-6 italic uppercase">Admin Inbox</h2>
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <p class="text-[8px] text-zinc-500 uppercase">Profit</p>
                <p id="totalProfit" class="text-green-500 font-black">0.00</p>
            </div>
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <p class="text-[8px] text-zinc-500 uppercase">Users</p>
                <p id="userCount" class="text-blue-500 font-black">128</p>
            </div>
        </div>
        <div id="adminInbox" class="space-y-4"></div>
    </div>

    <nav class="fixed bottom-0 w-full h-[90px] bg-black border-t border-zinc-900 flex justify-around items-center z-[200] pb-6 px-4">
        <div onclick="showPage('play')" id="n-play" class="nav-item active"><i class="fas fa-plane-up text-xl"></i><span class="text-[9px] font-black uppercase">Play</span></div>
        <div onclick="showPage('top')" id="n-top" class="nav-item"><i class="fas fa-trophy text-xl"></i><span class="text-[9px] font-black uppercase">Winners</span></div>
        <div onclick="showPage('wallet')" id="n-wallet" class="nav-item"><i class="fas fa-wallet text-xl"></i><span class="text-[9px] font-black uppercase">Wallet</span></div>
        <div onclick="showPage('admin')" id="n-admin" class="nav-item hidden"><i class="fas fa-user-shield text-xl"></i><span class="text-[9px] font-black uppercase">Admin</span></div>
    </nav>

    <script>
        const socket = io();
        const tg = window.Telegram.WebApp;
        let u = tg.initDataUnsafe.user || { id: 777, first_name: "Dawit", username: "Dawit_Fikadu21" };
        
        let db = JSON.parse(localStorage.getItem('wg_flight_fix_'+u.id)) || { bal: 0.0, games: 0 };
        let curM = 1.0, isRun = false, myBets = [null, null];

        // በረራውን በትክክል የሚያንቀሳቅስ ሎጂክ
        socket.on('tick', (d) => {
            isRun = true;
            curM = parseFloat(d.mult);
            document.getElementById('multiplier').innerText = d.mult + "x";
            document.getElementById('crashAlert').classList.add('hidden');
            
            // የአውሮፕላን እንቅስቃሴ ስሌት
            let x = Math.min((curM - 1) * 42, 85); // ወደ ቀኝ
            let y = Math.min((curM - 1) * 32, 75); // ወደ ላይ
            
            let plane = document.getElementById('plane');
            plane.style.left = (10 + x) + "%";
            plane.style.bottom = (10 + y) + "%";
            
            // ፍጥነቱ ሲጨምር አውሮፕላኑን ትንሽ ከፍ ማድረግ
            if(curM > 2) plane.style.transform = `rotate(${-10 - (y/3)}deg)`;
        });

        socket.on('crash', (d) => {
            isRun = false; myBets = [null, null];
            document.getElementById('multiplier').innerText = "CRASHED";
            document.getElementById('crashVal').innerText = d.point + "x";
            document.getElementById('crashAlert').classList.remove('hidden');
            
            // አውሮፕላኑን ወደ መጀመሪያው ቦታ መመለስ
            setTimeout(() => {
                let p = document.getElementById('plane');
                p.style.left = "10%"; p.style.bottom = "10%";
                p.style.transform = "rotate(-10deg)";
            }, 2000);
            
            btnR(1); btnR(2);
        });

        // ለአድሚን ጥያቄዎች እንዲደርሱ
        socket.on('adminInbox', (data) => {
            const box = document.getElementById('adminInbox');
            box.innerHTML = '';
            let reqs = data.reqs || [];
            
            if(reqs.length === 0) box.innerHTML = '<p class="text-center text-zinc-700 text-xs">No pending requests.</p>';
            
            reqs.forEach((r, i) => {
                box.innerHTML += `
                    <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 flex justify-between items-center animate-pulse">
                        <div>
                            <p class="text-xs font-black ${r.type==='DEP'?'text-blue-500':'text-orange-500'}">${r.type}: ${r.amt} ETB</p>
                            <p class="text-[9px] text-zinc-500 mt-1">${r.name} | ${r.ref}</p>
                        </div>
                        <button onclick="socket.emit('approveReq', ${i})" class="bg-green-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase">Approve</button>
                    </div>`;
            });
        });

        function handleBet(id) {
            let a = parseFloat(document.getElementById('a'+id).value);
            if(!isRun && !myBets[id-1]) {
                if(db.bal < a) return alert("Insufficient Balance!");
                db.bal -= a; db.games++;
                myBets[id-1] = a;
                socket.emit('placeBet', { amt: a, name: u.first_name });
                btnS(id, 'WAIT');
            } else if(isRun && myBets[id-1]) {
                let win = myBets[id-1] * curM;
                db.bal += win;
                alert("SUCCESS! +" + win.toFixed(1) + " ETB");
                myBets[id-1] = null;
                btnS(id, 'BET');
            }
            refresh();
        }

        function sendReq(type) {
            let amt = parseFloat(document.getElementById('dAmt').value);
            let ref = document.getElementById('dRef').value;
            if(!amt || !ref) return alert("Please fill all details!");
            
            // ለአድሚን ዳሽቦርድ መላክ
            socket.emit('newRequest', { type, amt, ref, name: u.first_name, userId: u.id });
            alert("Request sent! Admin will approve shortly.");
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(p+'Page').classList.add('active-page');
            document.getElementById('n-'+p).classList.add('active');
        }

        function setTab(t) {
            document.getElementById('tabD').className = t==='D' ? "flex-1 py-4 bg-red-600 rounded-xl font-black text-xs" : "flex-1 py-4 rounded-xl font-black text-xs text-zinc-500";
            document.getElementById('depArea').classList.toggle('hidden', t==='W');
        }

        function refresh() {
            document.getElementById('hBal').innerText = db.bal.toFixed(2);
            localStorage.setItem('wg_flight_fix_'+u.id, JSON.stringify(db));
        }

        function btnS(id, s) {
            let b = document.getElementById('b'+id);
            if(s==='WAIT') { b.innerText = "WAITING..."; b.className = "bg-zinc-800 text-zinc-500 rounded-xl font-black"; }
            else if(isRun && myBets[id-1]) { b.innerText = "CASHOUT"; b.className = "btn-cash font-black text-2xl italic"; }
            else { b.innerText = "BET"; b.className = "btn-bet font-black text-2xl italic"; }
        }
        function btnR(id) { btnS(id, 'BET'); }

        function renderHabesha() {
            const hNames = ["Yonas Abel", "Sara Solomon", "Bekele Tesfaye", "Hanna Girma", "Kaleb Efrem", "Lidiya Tekle", "Binyam Assefa", "Tigist Mulu"];
            const hBox = document.getElementById('habeshaWinners');
            for(let i=1; i<=20; i++) {
                hBox.innerHTML += `<div class="bg-zinc-900/40 p-5 rounded-2xl border border-zinc-900 flex justify-between items-center text-[12px] mb-3">
                    <span class="flex items-center gap-3"><span class="text-zinc-600 font-black">#${i+1}</span> ${hNames[i%hNames.length]} <i class="fas fa-check-circle text-blue-500 text-[10px]"></i></span>
                    <span class="font-black text-green-500">${(Math.random()*25000 + 1000).toLocaleString()}</span>
                </div>`;
            }
        }

        window.onload = () => {
            if(u.username === "Dawit_Fikadu21") {
                document.getElementById('n-admin').classList.remove('hidden');
                document.getElementById('admKill').classList.remove('hidden');
            }
            renderHabesha();
            refresh();
        };
    </script>
</body>
</html>
