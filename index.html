<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER ELITE V400</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #ff0044; --real-green: #00ff66; --blue-v: #38bdf8; }
        
        body.dark-mode { background: #000; color: #fff; }
        body.light-mode { background: #f1f5f9; color: #0f172a; }

        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(128, 128, 128, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(128, 128, 128, 0.2); border-radius: 20px; }
        
        /* Nav Bar - Icons Only */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border-top: 1px solid rgba(128,128,128,0.2); backdrop-blur: 20px; }
        .dark-mode .nav-bar { background: rgba(10, 10, 10, 0.95); }
        .light-mode .nav-bar { background: rgba(255, 255, 255, 0.95); }
        .nav-item { font-size: 28px; color: #666; transition: 0.3s; }
        .nav-item.active { color: var(--accent); transform: translateY(-5px); }

        .page { display: none; height: calc(100vh - 75px); overflow-y: auto; padding: 15px; margin-top: 85px; }
        .active-page { display: block; animation: slideIn 0.3s ease-out; }

        /* Wobble Animation for Winners */
        @keyframes wobble {
            0%, 100% { transform: rotate(-3deg) translateY(0); }
            50% { transform: rotate(3deg) translateY(-10px); }
        }
        .animate-wobble { animation: wobble 3s infinite ease-in-out; }

        /* Game Canvas */
        .game-canvas { height: 240px; position: relative; border-radius: 30px; border: 1px solid rgba(128,128,128,0.3); overflow: hidden; }
        #gamePath { stroke: var(--accent); stroke-width: 6; fill: none; filter: drop-shadow(0 0 12px var(--accent)); }
        
        /* Bet Controls - Left/Right Layout */
        .bet-panel { display: flex; gap: 10px; align-items: stretch; }
        .controls-left { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .btn-right { width: 90px; }

        .chip { padding: 8px; border-radius: 10px; font-weight: 900; font-size: 11px; border: 1px solid rgba(128,128,128,0.2); }
        .mode-real .chip.active { background: var(--real-green); color: #000; }
        .mode-demo .chip.active { background: #ff4444; color: #fff; }

        .pfp-circle { border-radius: 50%; border: 2px solid var(--blue-v); background: #222; }
        .verify { color: var(--blue-v); font-size: 11px; margin-left: 3px; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="dark-mode">

    <header class="fixed top-0 w-full z-50 p-4 flex justify-between items-center border-b border-zinc-500/10 backdrop-blur-xl">
        <div class="flex items-center gap-3">
            <div id="hPfp" class="w-11 h-11 pfp-circle flex items-center justify-center">👤</div>
            <div>
                <p id="hBal" class="text-green-500 font-black text-xl leading-none">0.00 ETB</p>
                <div class="flex items-center mt-1">
                    <span id="txtMode" data-am="ሪል ሞድ" data-en="REAL MODE" class="text-[10px] font-bold uppercase opacity-60">REAL MODE</span>
                    <i class="fa-solid fa-circle-check verify"></i>
                </div>
            </div>
        </div>
        <div class="flex gap-1 p-1 bg-zinc-500/10 rounded-xl">
            <button onclick="setMode(false)" id="mReal" class="px-5 py-2 bg-green-600 text-black text-[10px] font-black rounded-lg">REAL</button>
            <button onclick="setMode(true)" id="mDemo" class="px-5 py-2 text-zinc-500 text-[10px] font-black rounded-lg">DEMO</button>
        </div>
    </header>

    <section id="home" class="page active-page mode-real">
        <div id="history" class="flex gap-2 overflow-x-auto mb-4 no-scrollbar"></div>
        
        <div class="game-canvas flex items-center justify-center mb-6">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 240 Q 0 240 0 240" /></svg>
            <div id="mTxt" class="font-game text-7xl italic z-20">1.00x</div>
            <div id="plane" class="absolute bottom-6 left-6 text-5xl z-20" style="transform: rotate(-15deg);">🚀</div>
        </div>

        <div class="space-y-4">
            <div class="glass p-4 bet-panel">
                <div class="controls-left">
                    <div class="grid grid-cols-4 gap-1">
                        <button onclick="setB(1,10)" class="chip">10</button>
                        <button onclick="setB(1,50)" class="chip">50</button>
                        <button onclick="setB(1,100)" class="chip">100</button>
                        <button onclick="setB(1,500)" class="chip">500</button>
                    </div>
                    <div class="grid grid-cols-4 gap-1 mt-1">
                        <button onclick="setA(1,2)" class="chip">2x</button>
                        <button onclick="setA(1,4)" class="chip">4x</button>
                        <button onclick="setA(1,8)" class="chip">8x</button>
                        <button onclick="setA(1,10)" class="chip">10x</button>
                    </div>
                </div>
                <button id="bBtn1" onclick="handleBet(1)" class="btn-right bg-green-500 text-black rounded-xl font-black italic text-sm shadow-lg">BET</button>
            </div>

            <div class="glass p-4 bet-panel">
                <div class="controls-left">
                    <div class="grid grid-cols-4 gap-1">
                        <button onclick="setB(2,10)" class="chip">10</button>
                        <button onclick="setB(2,50)" class="chip">50</button>
                        <button onclick="setB(2,100)" class="chip">100</button>
                        <button onclick="setB(2,500)" class="chip">500</button>
                    </div>
                    <div class="grid grid-cols-4 gap-1 mt-1">
                        <button onclick="setA(2,2)" class="chip">2x</button>
                        <button onclick="setA(2,4)" class="chip">4x</button>
                        <button onclick="setA(2,8)" class="chip">8x</button>
                        <button onclick="setA(2,10)" class="chip">10x</button>
                    </div>
                </div>
                <button id="bBtn2" onclick="handleBet(2)" class="btn-right bg-green-500 text-black rounded-xl font-black italic text-sm shadow-lg">BET</button>
            </div>
        </div>

        <div id="liveFeed" class="mt-6 mb-24 space-y-2"></div>
    </section>

    <section id="wallet" class="page">
        <div class="flex gap-2 mb-6">
            <button onclick="shW('d')" id="btnD" class="flex-1 py-4 bg-red-600 text-white rounded-2xl font-black">DEPOSIT</button>
            <button onclick="shW('w')" id="btnW" class="flex-1 py-4 bg-zinc-800 text-white rounded-2xl font-black">WITHDRAW</button>
        </div>

        <div id="secD" class="glass p-6 space-y-4">
            <div onclick="copyT('1000179571815')" class="bg-black/20 p-5 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer">
                <p class="font-game text-2xl text-green-500">1000179571815</p><i class="fa-solid fa-copy"></i>
            </div>
            <input type="text" placeholder="FULL NAME" class="w-full bg-zinc-500/10 p-4 rounded-xl border border-zinc-500/20 font-bold outline-none">
            <input type="text" placeholder="FT NUMBER" class="w-full bg-zinc-500/10 p-4 rounded-xl border border-zinc-500/20 font-bold outline-none">
            <input type="number" placeholder="AMOUNT (ETB)" class="w-full bg-zinc-500/10 p-4 rounded-xl border border-zinc-500/20 font-black text-xl outline-none">
            <button onclick="tg.showAlert('Request Sent!')" class="w-full py-5 bg-red-600 text-white rounded-2xl font-black">SUBMIT DEPOSIT</button>
        </div>

        <div id="secW" class="hidden glass p-6 space-y-4">
            <input type="text" placeholder="CBE ACCOUNT NUMBER" class="w-full bg-zinc-500/10 p-4 rounded-xl border border-zinc-500/20 font-bold outline-none">
            <input type="number" placeholder="WITHDRAW AMOUNT" class="w-full bg-zinc-500/10 p-4 rounded-xl border border-zinc-500/20 font-black text-xl outline-none">
            <button onclick="tg.showAlert('Withdrawal Requested!')" class="w-full py-5 bg-green-600 text-black rounded-2xl font-black">CONFIRM WITHDRAW</button>
        </div>
    </section>

    <section id="top" class="page">
        <div class="flex justify-center items-end gap-3 mb-12 h-64">
            <div class="glass w-24 h-44 order-1 flex flex-col items-center justify-center animate-wobble" style="animation-delay: 0.5s;">🥈<p class="text-[10px] font-black mt-2">Lemi_X <i class="fa-solid fa-circle-check verify"></i></p></div>
            <div class="glass w-32 h-60 border-2 border-yellow-500 order-2 flex flex-col items-center justify-center bg-gradient-to-t from-yellow-500/10 to-transparent animate-wobble">
                <span class="text-4xl">👑</span><p class="text-xs font-black mt-3">DAI_FIKADU <i class="fa-solid fa-circle-check verify"></i></p>
                <span class="text-[11px] text-yellow-500 font-bold mt-1">245,000 ETB</span>
            </div>
            <div class="glass w-24 h-36 order-3 flex flex-col items-center justify-center animate-wobble" style="animation-delay: 1s;">🥉<p class="text-[10px] font-black mt-2">Abebe_K <i class="fa-solid fa-circle-check verify"></i></p></div>
        </div>
        <div id="tList" class="space-y-2 pb-12"></div>
    </section>

    <section id="profile" class="page">
        <div class="glass p-8 text-center mb-6">
            <div id="pfpB" class="w-24 h-24 mx-auto mb-4 pfp-circle flex items-center justify-center text-4xl">👤</div>
            <h2 id="uName" class="text-2xl font-black italic">@User <i class="fa-solid fa-circle-check verify"></i></h2>
            <div class="flex justify-center gap-6 mt-8">
                <button onclick="toggleTheme()" class="text-2xl p-5 glass rounded-full w-16 h-16 flex items-center justify-center"><i class="fa-solid fa-moon"></i></button>
                <button onclick="toggleLang()" class="text-sm font-black p-5 glass rounded-full w-16 h-16 flex items-center justify-center" id="langBtn">EN</button>
            </div>
        </div>
        <div id="admBox" class="hidden glass p-6 border-l-4 border-yellow-500">
            <p class="text-[10px] opacity-60">ADMIN PROFIT (20%)</p>
            <p id="adP" class="text-2xl font-game text-yellow-500">0.00 ETB</p>
        </div>
    </section>

    <nav class="nav-bar">
        <div onclick="shP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-gamepad"></i></div>
        <div onclick="shP('wallet')" id="n-wallet" class="nav-item"><i class="fa-solid fa-wallet"></i></div>
        <div onclick="shP('top')" id="n-top" class="nav-item"><i class="fa-solid fa-trophy"></i></div>
        <div onclick="shP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user"></i></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        let isD = false, isF = false, lang = 'am';
        let rBal = parseFloat(localStorage.getItem('v4_r')) || 0;
        let dBal = parseFloat(localStorage.getItem('v4_d')) || 500;
        let stats = JSON.parse(localStorage.getItem('v4_st')) || { p: 0 };
        let bts = { 1: { a: false, amt: 10, au: 0 }, 2: { a: false, amt: 10, au: 0 } };

        const translations = {
            am: { bet: "ውርርድ", cash: "ውጣ", bal: "ቀሪ ሂሳብ", modeR: "ሪል ሞድ", modeD: "ዴሞ ሞድ" },
            en: { bet: "BET", cash: "CASH OUT", bal: "Balance", modeR: "REAL MODE", modeD: "DEMO MODE" }
        };

        function init() {
            const u = tg.initDataUnsafe?.user; const un = u?.username || "Guest";
            document.getElementById('uName').innerText = "@" + un;
            const p = u?.photo_url ? `<img src="${u.photo_url}" class="w-full h-full object-cover">` : `👤`;
            document.getElementById('hPfp').innerHTML = p; document.getElementById('pfpB').innerHTML = p;
            if(un === "Dawit_Fikadu21") document.getElementById('admBox').classList.remove('hidden');
            upUI(); gameLoop(); loadTop(); applyLang();
        }

        function gameLoop() {
            if(isF) return;
            let timer = 5;
            let t = setInterval(() => {
                timer--; if(timer <= 0) { clearInterval(t); start(); }
                simPlayers();
            }, 1000);
        }

        function start() {
            isF = true; let m = 1.0;
            let pool = 0; if(!isD) [1,2].forEach(i => { if(bts[i].a) pool += bts[i].amt; });
            let crash = 1.1 + (Math.random() * 8.0);
            if(pool > 0) { crash = 1.1 + (Math.random() * 0.4); stats.p += (pool * 0.2); localStorage.setItem('v4_st', JSON.stringify(stats)); updateAdm(); }

            let eng = setInterval(() => {
                m += 0.05;
                document.getElementById('mTxt').innerText = m.toFixed(2) + "x";
                let x = m * 15, y = m * 13;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px) rotate(-15deg)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 240 Q ${x/2} ${240-y} ${x+10} ${240-y-10}`);
                [1,2].forEach(i => { if(bts[i].a && bts[i].au > 0 && m >= bts[i].au) handleBet(i, m); });
                if(m >= crash) { clearInterval(eng); boom(crash); }
            }, 85);
        }

        function boom(c) {
            isF = false; document.getElementById('mTxt').innerText = "CRASHED";
            document.getElementById('mTxt').style.color = "var(--accent)";
            addH(c.toFixed(2)); bts[1].a = bts[2].a = false; resetB();
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0) rotate(-15deg)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 240 Q 0 240 0 240');
                document.getElementById('mTxt').style.color = "inherit";
                gameLoop();
            }, 3000);
        }

        function handleBet(id) {
            let m = parseFloat(document.getElementById('mTxt').innerText);
            if(isF) {
                if(bts[id].a) {
                    let w = bts[id].amt * m;
                    if(isD) { dBal += w; localStorage.setItem('v4_d', dBal); } else { rBal += w; localStorage.setItem('v4_r', rBal); }
                    bts[id].a = false; resetB(); upUI();
                    tg.showAlert("WIN: " + w.toFixed(0) + " ETB");
                }
                return;
            }
            let b = isD ? dBal : rBal;
            if(bts[id].amt > b) return tg.showAlert("Low Balance!");
            if(isD) { dBal -= bts[id].amt; localStorage.setItem('v4_d', dBal); } else { rBal -= bts[id].amt; localStorage.setItem('v4_r', rBal); }
            bts[id].a = true; upUI();
            document.getElementById('bBtn'+id).innerText = translations[lang].cash;
            document.getElementById('bBtn'+id).style.background = "#f97316";
        }

        function setMode(d) {
            isD = d;
            document.getElementById('mReal').className = !d ? "px-5 py-2 bg-green-600 text-black text-[10px] font-black rounded-lg" : "px-5 py-2 text-zinc-500 text-[10px] font-black rounded-lg";
            document.getElementById('mDemo').className = d ? "px-5 py-2 bg-red-600 text-white text-[10px] font-black rounded-lg" : "px-5 py-2 text-zinc-500 text-[10px] font-black rounded-lg";
            document.getElementById('home').className = d ? "page active-page mode-demo" : "page active-page mode-real";
            applyLang(); upUI();
        }

        function applyLang() {
            const t = translations[lang];
            document.getElementById('txtMode').innerText = isD ? t.modeD : t.modeR;
            document.getElementById('langBtn').innerText = lang === 'am' ? 'EN' : 'አማ';
            resetB();
        }

        function upUI() { document.getElementById('hBal').innerText = (isD ? dBal : rBal).toFixed(2) + " ETB"; }
        function shP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-'+id).classList.add('active');
        }

        function toggleTheme() { document.body.classList.toggle('dark-mode'); document.body.classList.toggle('light-mode'); }
        function toggleLang() { lang = lang === 'am' ? 'en' : 'am'; applyLang(); }
        
        function setB(id, v) { bts[id].amt = v; }
        function setA(id, v) { bts[id].au = v; }
        function resetB() { [1,2].forEach(i => { document.getElementById('bBtn'+i).innerText = translations[lang].bet; document.getElementById('bBtn'+i).style.background = isD ? "#ff4444" : "#00ff66"; }); }
        
        function addH(c) {
            const h = document.getElementById('history');
            const d = document.createElement('div');
            d.className = `px-4 py-1.5 rounded-full text-[10px] font-black ${c > 2 ? 'bg-purple-600' : 'bg-zinc-800'}`;
            d.innerText = c + "x";
            h.prepend(d); if(h.children.length > 10) h.removeChild(h.lastChild);
        }

        function simPlayers() {
            const names = ["ከበደ","ለሞ","አበበ","ሃና","ዳዊት"];
            if(Math.random() > 0.8) {
                const f = document.getElementById('liveFeed');
                const r = document.createElement('div');
                r.className = "flex justify-between p-4 glass border-l-4 border-green-500";
                r.innerHTML = `<span class="text-xs font-black">🔥 @${names[Math.floor(Math.random()*5)]}_${Math.floor(Math.random()*99)} <i class="fa-solid fa-circle-check verify"></i></span><span class="text-green-500 font-black text-xs">+${(Math.random()*2000).toFixed(0)} ETB</span>`;
                f.prepend(r); if(f.children.length > 5) f.removeChild(f.lastChild);
            }
        }

        function loadTop() {
            const l = document.getElementById('tList'); const names = ["ከበደ","ለሞ","አበበ","ዳዊት","ሃና"];
            for(let i=1; i<=30; i++) {
                l.innerHTML += `<div class="glass p-4 flex justify-between items-center"><span class="text-xs font-bold uppercase">💎 ${names[i%5]}_${i} <i class="fa-solid fa-circle-check verify"></i></span><span class="text-green-500 font-black">${(Math.random()*40000+1000).toFixed(0)} ETB</span></div>`;
            }
        }

        function shW(t) {
            document.getElementById('secD').classList.toggle('hidden', t === 'w');
            document.getElementById('secW').classList.toggle('hidden', t === 'd');
            document.getElementById('btnD').className = t === 'd' ? 'flex-1 py-4 bg-red-600 text-white rounded-2xl font-black' : 'flex-1 py-4 bg-zinc-800 text-white rounded-2xl font-black';
            document.getElementById('btnW').className = t === 'w' ? 'flex-1 py-4 bg-green-600 text-black rounded-2xl font-black' : 'flex-1 py-4 bg-zinc-800 text-white rounded-2xl font-black';
        }

        function updateAdm() { document.getElementById('adP').innerText = stats.p.toFixed(2) + " ETB"; }
        function copyT(t) { navigator.clipboard.writeText(t); tg.showAlert("Copied!"); }

        init();
    </script>
</body>
</html>
