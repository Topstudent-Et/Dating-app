<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff0044">
    <title>AVIA-MASTER | ነጻ ጨዋታ</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            overflow-x: hidden;
            padding-top: 80px;
        }
        .font-crash { font-family: 'Orbitron', monospace; letter-spacing: 2px; }
        
        .glass-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 32px;
        }
        .game-btn {
            background: linear-gradient(135deg, #ff0044, #ff6600);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 900;
            color: white;
            box-shadow: 0 4px 15px rgba(255,0,68,0.3);
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(10,10,20,0.95); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000;
        }
        .nav-item { font-size: 24px; color: #888; transition: 0.2s; }
        .nav-item.active { color: #ff0044; transform: translateY(-3px); }
        
        .game-canvas { height: 220px; position: relative; }
        #gamePath { stroke-width: 7; fill: none; filter: drop-shadow(0 0 8px currentColor); }
        .rocket { position: absolute; font-size: 52px; transition: transform 0.03s linear; }
        
        .chip-btn, .bet-btn { transition: all 0.1s; }
        .bet-btn.cashout { background: #f97316 !important; color: white; }
        
        #historyGraph { height: 140px; }
        .streak { font-size: 13px; padding: 4px 12px; border-radius: 20px; }
    </style>
</head>
<body>

<!-- Header -->
<div class="fixed top-0 left-0 right-0 z-50 px-4 py-3 flex justify-between items-center border-b border-white/10 backdrop-blur-xl bg-black/40">
    <div class="flex items-center gap-3">
        <div id="userAvatar" class="w-10 h-10 rounded-full bg-gradient-to-r from-red-500 to-pink-500 flex items-center justify-center text-2xl overflow-hidden">
            <span id="avatarPlaceholder">👤</span>
        </div>
        <div>
            <div class="flex items-center gap-2"><span id="userName" class="font-bold text-sm">@User</span></div>
            <div><span id="balanceDisplay" class="text-green-400 font-black text-xl">0 ETB</span></div>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <button id="soundToggle" class="text-2xl"><i class="fas fa-volume-up"></i></button>
        <div class="mode-toggle flex bg-white/10 rounded-3xl p-1 text-xs font-bold">
            <div class="mode-opt px-5 py-1 rounded-3xl active" data-mode="real">እውነተኛ</div>
            <div class="mode-opt px-5 py-1 rounded-3xl" data-mode="demo">ዴሞ</div>
        </div>
    </div>
</div>

<!-- Home Page -->
<div id="homePage" class="page p-4 pb-24">
    <div class="glass-card p-4 mb-6 text-center">
        <div class="text-xl font-bold text-green-400">🛡️ ገንዘብህ ደህንነቱ የተጠበቀ ነው</div>
        <div class="text-sm opacity-80 mt-1">ነጻ ልምምድ ጨዋታ | ምንም አደጋ የለም</div>
    </div>

    <!-- Aviator Game -->
    <div class="glass-card p-5 mb-6">
        <div class="flex justify-between mb-3">
            <span class="font-bold"><i class="fas fa-plane"></i> አቪዬተር</span>
            <span id="roundTimer" class="text-blue-400 text-sm">ቀጣይ ዙር: --</span>
        </div>
        
        <div class="game-canvas bg-black/40 rounded-3xl overflow-hidden relative" id="gameArea">
            <svg width="100%" height="100%" class="absolute inset-0">
                <path id="gamePath" d="M 20 200 Q 20 200 20 200" class="stroke-cyan-400" />
            </svg>
            <div id="multiplierText" class="absolute inset-0 flex items-center justify-center font-crash text-6xl font-black drop-shadow-2xl">1.00x</div>
            <div id="rocket" class="rocket bottom-12 left-8">✈️</div>
            <div id="countdownOverlay" class="absolute inset-0 bg-black/70 hidden flex items-center justify-center">
                <span id="countdownNumber" class="font-crash text-7xl text-yellow-400">5</span>
            </div>
        </div>

        <!-- History Graph -->
        <div class="mt-4">
            <div class="text-xs opacity-70 mb-1 flex justify-between">
                <span>የቅርብ ጊዜ ውጤቶች</span>
                <span id="streakDisplay" class="streak bg-yellow-500/20 text-yellow-400">Streak: 0</span>
            </div>
            <canvas id="historyGraph" width="340" height="140"></canvas>
        </div>
    </div>

    <!-- Bet Slots -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <!-- Left Slot -->
        <div class="glass-card p-4">
            <div class="text-sm mb-3 font-bold">ግራ ቦታ</div>
            <div class="flex gap-2 mb-3">
                <button data-slot="1" data-amount="10" class="chip-btn flex-1 py-2 text-sm bg-white/10 rounded-xl">10</button>
                <button data-slot="1" data-amount="50" class="chip-btn flex-1 py-2 text-sm bg-white/10 rounded-xl">50</button>
                <button data-slot="1" data-amount="100" class="chip-btn flex-1 py-2 text-sm bg-white/10 rounded-xl">100</button>
            </div>
            <button id="betBtn1" class="bet-btn w-full py-4 text-xl font-black">ቤት</button>
            <div class="grid grid-cols-3 gap-2 mt-4 text-xs">
                <button data-slot="1" data-auto="1.5" class="chip-btn py-2 bg-white/10 rounded-xl">1.5x</button>
                <button data-slot="1" data-auto="3" class="chip-btn py-2 bg-white/10 rounded-xl">3x</button>
                <button data-slot="1" data-auto="10" class="chip-btn py-2 bg-white/10 rounded-xl">10x</button>
            </div>
        </div>

        <!-- Right Slot -->
        <div class="glass-card p-4">
            <div class="text-sm mb-3 font-bold">ቀኝ ቦታ</div>
            <div class="flex gap-2 mb-3">
                <button data-slot="2" data-amount="10" class="chip-btn flex-1 py-2 text-sm bg-white/10 rounded-xl">10</button>
                <button data-slot="2" data-amount="50" class="chip-btn flex-1 py-2 text-sm bg-white/10 rounded-xl">50</button>
                <button data-slot="2" data-amount="100" class="chip-btn flex-1 py-2 text-sm bg-white/10 rounded-xl">100</button>
            </div>
            <button id="betBtn2" class="bet-btn w-full py-4 text-xl font-black">ቤት</button>
            <div class="grid grid-cols-3 gap-2 mt-4 text-xs">
                <button data-slot="2" data-auto="1.5" class="chip-btn py-2 bg-white/10 rounded-xl">1.5x</button>
                <button data-slot="2" data-auto="3" class="chip-btn py-2 bg-white/10 rounded-xl">3x</button>
                <button data-slot="2" data-auto="10" class="chip-btn py-2 bg-white/10 rounded-xl">10x</button>
            </div>
        </div>
    </div>

    <button onclick="claimDailyBonus()" class="w-full py-4 bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-black rounded-3xl mb-6 flex items-center justify-center gap-3">
        <i class="fas fa-gift"></i> የዛሬ ቦነስ ይውሰዱ (50 ETB)
    </button>

    <div class="glass-card p-4">
        <div class="flex items-center gap-2 mb-3"><i class="fas fa-fire text-red-500"></i><span class="font-bold">ቀጥታ አሸናፊዎች</span></div>
        <div id="liveFeed" class="space-y-2 max-h-40 overflow-y-auto text-sm"></div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item active" data-page="home"><i class="fas fa-gamepad"></i><span class="text-xs">ጨዋታ</span></div>
    <div class="nav-item" data-page="top"><i class="fas fa-trophy"></i><span class="text-xs">ከፍተኛ</span></div>
    <div class="nav-item" data-page="wallet"><i class="fas fa-wallet"></i><span class="text-xs">የቦርሳ</span></div>
    <div class="nav-item" data-page="profile"><i class="fas fa-user"></i><span class="text-xs">መገለጫ</span></div>
</div>

<script>
// ====================== ዋና ሎጂክ ======================
const tg = window.Telegram.WebApp;
tg.expand();

let soundEnabled = true;
let isRealMode = true;
let realBalance = 150;
let demoBalance = 5000;
let currentMultiplier = 1.00;
let gameActive = false;
let crashPoint = 2.5;
let bets = {1: {amount: 50, auto: 0, active: false}, 2: {amount: 50, auto: 0, active: false}};

let gameHistory = []; // ለግራፍ
const canvas = document.getElementById('historyGraph');
const ctx = canvas.getContext('2d');

function playSound(freq, duration) {
    if (!soundEnabled) return;
    const audio = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    osc.frequency.value = freq;
    osc.connect(audio.destination);
    osc.start();
    setTimeout(() => osc.stop(), duration);
}

function updateBalance() {
    const bal = isRealMode ? realBalance : demoBalance;
    document.getElementById('balanceDisplay').textContent = bal.toFixed(0) + ' ETB';
}

function drawHistoryGraph() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (gameHistory.length < 2) return;
    
    const maxMult = Math.max(...gameHistory) || 10;
    const stepX = canvas.width / (gameHistory.length - 1);
    
    ctx.beginPath();
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = 3;
    
    gameHistory.forEach((mult, i) => {
        const x = i * stepX;
        const y = canvas.height - (mult / maxMult * canvas.height * 0.9);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.stroke();
}

// ቀላል ዙር ሲምዩሌሽን
function startNewRound() {
    if (gameActive) return;
    gameActive = true;
    currentMultiplier = 1.00;
    crashPoint = 1.2 + Math.random() * 18; // በተጨባጭ ለፈተና
    
    document.getElementById('rocket').style.transform = 'translate(0px, 0px)';
    
    const interval = setInterval(() => {
        if (!gameActive) { clearInterval(interval); return; }
        
        currentMultiplier += 0.04 + Math.random() * 0.03;
        document.getElementById('multiplierText').innerHTML = `<span class="font-crash">${currentMultiplier.toFixed(2)}x</span>`;
        
        // ሮኬት እንቅስቃሴ
        const progress = Math.min(currentMultiplier / crashPoint, 1);
        const rocketEl = document.getElementById('rocket');
        rocketEl.style.transform = `translate(\( {progress * 220}px, - \){progress * 160}px) rotate(-25deg)`;
        
        // Auto cashout
        for (let slot = 1; slot <= 2; slot++) {
            if (bets[slot].active && bets[slot].auto > 0 && currentMultiplier >= bets[slot].auto) {
                cashOut(slot);
            }
        }
        
        if (currentMultiplier >= crashPoint) {
            clearInterval(interval);
            crashGame();
        }
    }, 50);
}

function cashOut(slot) {
    if (!bets[slot].active) return;
    const win = bets[slot].amount * currentMultiplier;
    if (isRealMode) realBalance += win;
    else demoBalance += win;
    
    updateBalance();
    bets[slot].active = false;
    document.getElementById(`betBtn${slot}`).textContent = 'ቤት';
    document.getElementById(`betBtn${slot}`).classList.remove('cashout');
    
    showToast(`🎉 \( {win.toFixed(0)} ETB አሸንፈሃል! ( \){currentMultiplier.toFixed(2)}x)`);
    playSound(900, 150);
}

function crashGame() {
    gameActive = false;
    document.getElementById('multiplierText').innerHTML = `<span class="text-red-500 text-3xl">💥 CRASHED @ ${currentMultiplier.toFixed(2)}x</span>`;
    
    gameHistory.push(currentMultiplier);
    if (gameHistory.length > 50) gameHistory.shift();
    drawHistoryGraph();
    
    playSound(180, 400);
    setTimeout(() => {
        document.getElementById('multiplierText').innerHTML = `<span class="font-crash">1.00x</span>`;
        document.getElementById('rocket').style.transform = 'translate(0px, 0px)';
    }, 1800);
}

function showToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); padding:12px 24px; border-radius:50px; z-index:9999; font-size:14px;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

function claimDailyBonus() {
    const today = new Date().toDateString();
    if (localStorage.getItem('dailyBonus') === today) {
        showToast('ዛሬ ቀድሞ ቦነስ ወስደሃል!');
        return;
    }
    if (isRealMode) realBalance += 50;
    else demoBalance += 50;
    localStorage.setItem('dailyBonus', today);
    updateBalance();
    showToast('🎁 50 ETB ቦነስ ተቀብለሃል!');
}

// Event Listeners
document.querySelectorAll('.mode-opt').forEach(el => {
    el.addEventListener('click', () => {
        isRealMode = el.dataset.mode === 'real';
        document.querySelectorAll('.mode-opt').forEach(e => e.classList.toggle('active', e === el));
        updateBalance();
        showToast(isRealMode ? 'እውነተኛ ሁነታ' : 'ዴሞ ሁነታ');
    });
});

document.getElementById('betBtn1').addEventListener('click', () => {
    if (gameActive) cashOut(1);
    else {
        bets[1].active = true;
        document.getElementById('betBtn1').textContent = 'ካሽ ኦውት';
        document.getElementById('betBtn1').classList.add('cashout');
        showToast('ቤት ተቀምጧል');
    }
});

document.getElementById('betBtn2').addEventListener('click', () => {
    if (gameActive) cashOut(2);
    else {
        bets[2].active = true;
        document.getElementById('betBtn2').textContent = 'ካሽ ኦውት';
        document.getElementById('betBtn2').classList.add('cashout');
        showToast('ቤት ተቀምጧል');
    }
});

document.querySelectorAll('.chip-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const slot = parseInt(btn.dataset.slot);
        if (btn.dataset.amount) {
            bets[slot].amount = parseInt(btn.dataset.amount);
        }
        if (btn.dataset.auto) {
            bets[slot].auto = parseFloat(btn.dataset.auto);
            showToast(`Auto cashout በ ${btn.dataset.auto}x`);
        }
    });
});

document.getElementById('soundToggle').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    document.getElementById('soundToggle').innerHTML = soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
});

// የጨዋታ ጅምር
setInterval(() => {
    if (!gameActive) startNewRound();
}, 8000);

// Initialization
updateBalance();
drawHistoryGraph();
showToast('👋 እንኳን ደህና መጣህ ወደ AVIA-MASTER!');

// ተጨማሪ ማሻሻያዎች ከፈለግክ (Provably Fair, Live Chat, ሙሉ Wallet ገጽ ወዘተ) ተናገርኝ
</script>
</body>
</html>
