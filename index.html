<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFRO GAMES</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin:0;
    font-family:sans-serif;
    background:#0b0f1a;
    color:white;
}

/* HEADER */
.header {
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:#111827;
    align-items:center;
}

.balance {
    background:#1f2937;
    padding:5px 12px;
    border-radius:20px;
    color:#facc15;
}

/* CARD GRID */
.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:15px;
}

.card {
    background:#1f2937;
    border-radius:15px;
    padding:15px;
    text-align:center;
    transition:0.3s;
    position:relative;
    overflow:hidden;
}

.card:hover {
    transform:scale(1.05);
}

/* GLOW EFFECT */
.card::after {
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg,transparent,#ffffff33,transparent);
    animation:shine 3s infinite;
}

@keyframes shine {
    100% { left:100%; }
}

/* BUTTON */
.btn {
    background:#facc15;
    border:none;
    padding:10px;
    border-radius:10px;
    width:100%;
    margin-top:10px;
}

/* AVIATOR */
#plane {
    position:absolute;
    bottom:10px;
    left:10px;
    font-size:25px;
    transition:0.1s linear;
}

.aviator-box {
    height:180px;
    background:black;
    border-radius:10px;
    position:relative;
    overflow:hidden;
}

.mult {
    position:absolute;
    width:100%;
    text-align:center;
    top:40%;
    font-size:30px;
}

/* NAV */
.nav {
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    background:#111827;
}

.nav div {
    flex:1;
    text-align:center;
    padding:10px;
}
</style>
</head>

<body>

<div class="header">
<div>Dawit</div>
<div class="balance"><span id="bal">20</span> ETB</div>
</div>

<!-- HOME -->
<div id="home">

<div class="grid">

<div class="card" onclick="openGame('aviator')">
<h3>✈️ AVIATOR</h3>
<p>5.1k players</p>
</div>

<div class="card" onclick="playSound('click')">
<h3>🎰 BINGO</h3>
<p>1.2k players</p>
</div>

<div class="card">
<h3>💣 MINES</h3>
</div>

<div class="card">
<h3>🎡 SPIN</h3>
</div>

</div>

</div>

<!-- AVIATOR -->
<div id="aviator" style="display:none; padding:15px;">

<h3 onclick="back()">⬅ Back</h3>

<div class="aviator-box">
<div id="plane">✈️</div>
<div id="mult" class="mult">1.00x</div>
</div>

<input id="bet" placeholder="Bet">
<button class="btn" onclick="start()">START</button>
<button class="btn" onclick="cashout()">CASH OUT</button>

</div>

<div class="nav">
<div onclick="show('home')">🏠</div>
<div>💰</div>
<div>🎁</div>
<div>👤</div>
</div>

<script>
let balance=20;
let running=false;
let multi=1;
let bet=0;
let interval;

/* SOUND SYSTEM */
const sounds = {
click: new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3"),
win: new Audio("https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"),
lose: new Audio("https://www.soundjay.com/button/sounds/beep-10.mp3")
};

function playSound(type){
    sounds[type].currentTime = 0;
    sounds[type].play();
}

/* NAV */
function openGame(g){
    playSound("click");
    document.getElementById("home").style.display="none";
    document.getElementById(g).style.display="block";
}

function back(){
    document.getElementById("home").style.display="block";
    document.getElementById("aviator").style.display="none";
}

/* AVIATOR */
function start(){
    bet=parseFloat(document.getElementById("bet").value);
    if(bet>balance) return alert("No balance");

    playSound("click");

    balance-=bet;
    update();

    running=true;
    multi=1;

    interval=setInterval(()=>{
        multi+=0.05;

        document.getElementById("mult").innerText=multi.toFixed(2)+"x";

        let plane=document.getElementById("plane");
        plane.style.left = (10 + multi*20)+"px";
        plane.style.bottom = (10 + multi*10)+"px";

        if(Math.random()<0.03){
            clearInterval(interval);
            running=false;
            playSound("lose");
            alert("💥 Crashed!");
        }

    },100);
}

function cashout(){
    if(!running) return;

    clearInterval(interval);

    let win=bet*multi;
    balance+=win;

    playSound("win");

    alert("🎉 Win "+win.toFixed(2));

    running=false;
    update();
}

function update(){
    document.getElementById("bal").innerText=balance.toFixed(2);
}
</script>

</body>
</html>
