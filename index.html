<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro - Dai Tech</title>
    <style>
        :root {
            --primary: #e91e63;
            --secondary: #28a745;
            --bg-dark: #14151a;
            --panel-bg: #1c1d22;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 10px;
            padding: 10px;
        }

        /* የተጫዋቾች ዝርዝር (Left Panel) */
        .players-panel {
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #2d2e35;
        }

        .player-name { color: #aaa; }
        .player-bet { color: #fff; font-weight: bold; }

        /* የጨዋታው ክፍል (Right Panel) */
        .game-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-bar {
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #balance-display {
            color: var(--secondary);
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* ካንቫስ */
        .canvas-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            height: 350px;
            overflow: hidden;
            border: 1px solid #333;
        }

        #multiplier {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 900;
            z-index: 5;
        }

        /* የመጫወቻ መቆጣጠሪያ (Bottom) */
        .bet-controls {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            background: #14151a;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
        }

        .btn-main {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .bet-active { background: var(--secondary); color: white; }
        .cashout-active { background: #ffc107; color: black; }
        .disabled { background: #444; cursor: not-allowed; }

        @media (max-width: 600px) {
            .main-container { grid-template-columns: 1fr; }
            .players-panel { display: none; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="players-panel">
        <h3 style="font-size: 14px; color: #888;">All Bets</h3>
        <div id="player-list">
            </div>
    </div>

    <div class="game-panel">
        <div class="top-bar">
            <span style="color: var(--primary); font-weight: bold;">AVIATOR</span>
            <div id="balance-display">1,000.00 ETB</div>
        </div>

        <div class="canvas-container">
            <div id="multiplier">1.00x</div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="bet-controls">
            <div class="input-group">
                <label style="font-size: 12px; color: #888;">መወራረድ የሚፈልጉት መጠን</label>
                <input type="number" id="betAmount" value="10.00">
                <button id="mainBtn" class="btn-main bet-active" onclick="handleButtonClick()">BET</button>
            </div>
            <div class="input-group">
                <label style="font-size: 12px; color: #888;">Auto Cash Out (አማራጭ)</label>
                <input type="number" id="autoCashOut" placeholder="2.00">
                <div style="font-size: 11px; color: #555; text-align: center;">ቁጥሩ ሲደርስ በራሱ ያቆማል</div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const multText = document.getElementById('multiplier');
    const balText = document.getElementById('balance-display');
    const mainBtn = document.getElementById('mainBtn');
    
    let balance = 1000.00;
    let currentBet = 0;
    let multiplier = 1.00;
    let isPlaying = false;
    let crashPoint;
    let animationId;

    function resize() {
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
    }
    window.onresize = resize;
    resize();

    // የተጫዋቾች ዝርዝር ማስመሰያ
    const names = ["Abebe", "Sara", "Kebede", "Mulu", "Dai", "Yonas"];
    function updatePlayers() {
        const list = document.getElementById('player-list');
        list.innerHTML = names.map(n => `
            <div class="player-row">
                <span class="player-name">👤 ${n}</span>
                <span class="player-bet">${(Math.random()*100).toFixed(2)} ETB</span>
            </div>
        `).join('');
    }
    updatePlayers();

    function handleButtonClick() {
        if (!isPlaying && mainBtn.innerText === "BET") {
            const amt = parseFloat(document.getElementById('betAmount').value);
            if (amt > balance) return alert("በቂ ሂሳብ የሎትም!");
            
            currentBet = amt;
            balance -= amt;
            balText.innerText = balance.toFixed(2) + " ETB";
            
            startRound();
        } else if (isPlaying) {
            cashOut();
        }
    }

    function startRound() {
        isPlaying = true;
        multiplier = 1.00;
        crashPoint = (Math.random() * 5 + 1.1).toFixed(2);
        
        mainBtn.innerText = "CASH OUT";
        mainBtn.className = "btn-main cashout-active";
        multText.style.color = "white";

        animate();
    }

    function animate() {
        if (!isPlaying) return;

        multiplier += 0.004 * Math.sqrt(multiplier);
        multText.innerText = multiplier.toFixed(2) + "x";

        drawPlane();

        // Auto Cash Out check
        const auto = parseFloat(document.getElementById('autoCashOut').value);
        if (auto > 1 && multiplier >= auto) {
            cashOut();
            return;
        }

        if (multiplier >= crashPoint) {
            crash();
            return;
        }

        animationId = requestAnimationFrame(animate);
    }

    function drawPlane() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const x = (multiplier - 1) * (canvas.width / 4);
        const y = canvas.height - ((multiplier - 1) * (canvas.height / 4));

        // Curve Line
        ctx.beginPath();
        ctx.strokeStyle = "#e91e63";
        ctx.lineWidth = 4;
        ctx.moveTo(0, canvas.height);
        ctx.quadraticCurveTo(x/2, canvas.height, x, y);
        ctx.stroke();

        // Plane Icon (እውነተኛ አቪዬተር እንዲመስል)
        ctx.font = "40px Arial";
        ctx.fillText("✈️", Math.min(x, canvas.width-60), Math.max(y, 40));
    }

    function crash() {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        multText.innerText = "FLEW AWAY!";
        multText.style.color = "#ff4444";
        
        mainBtn.innerText = "BET";
        mainBtn.className = "btn-main bet-active";
        currentBet = 0;
    }

    function cashOut() {
        if (!isPlaying) return;
        const win = currentBet * multiplier;
        balance += win;
        balText.innerText = balance.toFixed(2) + " ETB";
        
        isPlaying = false;
        cancelAnimationFrame(animationId);
        
        multText.style.color = "#28a745";
        mainBtn.innerText = "BET";
        mainBtn.className = "btn-main bet-active";
        alert(`እንኳን ደስ አለህ! ${win.toFixed(2)} ETB አሸንፈሃል።`);
    }
</script>

</body>
</html>
