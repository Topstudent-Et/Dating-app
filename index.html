<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldDating | Elite Global Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #000; color: white; margin: 0; }
        .app-container { max-width: 450px; margin: 0 auto; min-height: 100vh; background: #080808; position: relative; }
        .page { display: none; padding: 20px; animation: slideUp 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .input-style { width: 100%; padding: 16px; border-radius: 18px; background: #1a1a1a; border: 1px solid #333; outline: none; transition: 0.3s; }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.2); }
        .btn-grad { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); padding: 16px; border-radius: 18px; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-grad:active { transform: scale(0.96); }
        .nav-bar { display: none; position: fixed; bottom: 0; width: 450px; background: rgba(10,10,10,0.9); backdrop-filter: blur(15px); justify-content: space-around; padding: 18px; border-top: 1px solid #222; z-index: 100; }
        .nav-item { color: #555; font-size: 1.4rem; transition: 0.3s; }
        .nav-item.active { color: #a855f7; transform: translateY(-5px); }
        select { appearance: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">

    <div id="login-page" class="page active pt-20">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-fire text-2xl"></i></div>
            <h1 class="text-3xl font-bold">Welcome Back</h1>
            <p class="text-gray-500">Sign in to continue your journey</p>
        </div>
        <div class="space-y-4">
            <input type="email" placeholder="Email" class="input-style">
            <input type="password" placeholder="Password" class="input-style">
            <p onclick="showPage('forgot-page')" class="text-right text-sm text-purple-400 cursor-pointer">Forgot Password?</p>
            <button onclick="handleLogin()" class="btn-grad mt-4">Sign In</button>
        </div>
        <p class="text-center mt-10 text-gray-500">New here? <span onclick="showPage('signup-page')" class="text-purple-400 font-bold cursor-pointer underline">Create Account</span></p>
    </div>

    <div id="signup-page" class="page pt-10">
        <h2 class="text-3xl font-bold mb-6">Create Profile</h2>
        <div class="space-y-4 h-[75vh] overflow-y-auto pr-2 custom-scroll">
            <div class="flex justify-center mb-6">
                <label class="w-24 h-24 bg-gray-900 rounded-full border-2 border-dashed border-purple-500 flex flex-col items-center justify-center cursor-pointer overflow-hidden">
                    <i class="fas fa-camera text-gray-500"></i>
                    <span class="text-[10px] text-gray-500 mt-1">Add Photo</span>
                    <input type="file" class="hidden">
                </label>
            </div>
            <input type="text" id="reg-name" placeholder="Full Name" class="input-style">
            <input type="number" id="reg-age" placeholder="Age" class="input-style">
            
            <div class="grid grid-cols-2 gap-4">
                <select id="reg-gender" class="input-style">
                    <option value="">Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <select id="reg-country" class="input-style">
                    <option value="">Country</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                    <option value="Ethiopia">Ethiopia</option>
                    <option value="Germany">Germany</option>
                    <option value="Other">Global</option>
                </select>
            </div>
            
            <input type="email" placeholder="Email" class="input-style">
            <input type="password" placeholder="Password" class="input-style">
            <button onclick="handleLogin()" class="btn-grad mt-4">Start Dating</button>
            <p onclick="showPage('login-page')" class="text-center text-gray-500 pb-10">Back to Login</p>
        </div>
    </div>

    <div id="forgot-page" class="page pt-20">
        <h2 class="text-2xl font-bold mb-4 text-center">Reset Password</h2>
        <p class="text-gray-500 text-center mb-8">Enter your email and we'll send a code.</p>
        <input type="email" placeholder="Registered Email" class="input-style mb-6">
        <button onclick="alert('Code Sent!'); showPage('login-page')" class="btn-grad">Send Reset Link</button>
        <p onclick="showPage('login-page')" class="text-center mt-6 text-purple-400 cursor-pointer">Back to Login</p>
    </div>

    <div id="home-page" class="page pt-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-extrabold italic">WorldDating</h2>
            <i class="fas fa-bell text-gray-600"></i>
        </div>
        <div class="relative rounded-[2.5rem] h-[550px] overflow-hidden border border-white/5 shadow-2xl">
            <img id="match-img" src="" class="w-full h-full object-cover">
            <div class="absolute bottom-0 w-full p-8 bg-gradient-to-t from-black via-black/50 to-transparent">
                <h3 id="match-name" class="text-3xl font-bold">Name, Age</h3>
                <p id="match-bio" class="text-gray-300 text-sm mt-1">Loading matches based on your preference...</p>
                <div class="flex gap-4 mt-6">
                    <button class="flex-1 p-4 bg-white/10 rounded-2xl text-red-500"><i class="fas fa-times"></i></button>
                    <button class="flex-1 p-4 bg-white/10 rounded-2xl text-green-400"><i class="fas fa-heart"></i></button>
                </div>
            </div>
        </div>
    </div>

    <nav id="nav-bar" class="nav-bar">
        <i onclick="showPage('home-page')" id="n-home" class="fas fa-fire nav-item active"></i>
        <i onclick="showPage('message-page')" id="n-msg" class="fas fa-comment nav-item"></i>
        <i onclick="showPage('profile-page')" id="n-prof" class="fas fa-user-circle nav-item"></i>
    </nav>

</div>

<script>
    let currentUserGender = "";

    const femaleMatches = [
        { name: "Elena, 23", bio: "Artist from Spain 🎨", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500" },
        { name: "Sara, 21", bio: "Music lover from Ethiopia 🇪🇹", img: "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=500" }
    ];

    const maleMatches = [
        { name: "David, 26", bio: "Tech Nomad from Germany 🇩🇪", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500" },
        { name: "Alex, 25", bio: "Photographer from USA 🇺🇸", img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=500" }
    ];

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        // Update nav icons color
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        if(id === 'home-page') document.getElementById('n-home').classList.add('active');
    }

    function handleLogin() {
        const gender = document.getElementById('reg-gender').value || "Male";
        currentUserGender = gender;
        
        // Show Nav Bar
        document.getElementById('nav-bar').style.display = 'flex';
        showPage('home-page');
        loadMatches();
    }

    function loadMatches() {
        // Simple logic: if user is Male, show Female matches and vice versa
        const displayData = (currentUserGender === "Male") ? femaleMatches[0] : maleMatches[0];
        
        document.getElementById('match-img').src = displayData.img;
        document.getElementById('match-name').innerText = displayData.name;
        document.getElementById('match-bio').innerText = displayData.bio;
    }
</script>

</body>
</html>
