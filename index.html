<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER V28 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap');
        :root { --red: #ff0044; --green: #22c55e; --dark: #070707; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .page { display: none; height: calc(100vh - 80px); overflow-y: auto; padding: 12px; padding-bottom: 40px; }
        .active-page { display: block; }
        .nav-bar { background: rgba(10, 10, 10, 0.98); position: fixed; bottom: 0; width: 100%; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 1000; }
        .nav-item { color: #444; font-size: 9px; font-weight: 800; text-align: center; }
        .nav-item.active { color: var(--red); }
        .screen { background: radial-gradient(circle at bottom left, #200505 0%, #000 100%); height: 200px; position: relative; border-radius: 20px; overflow: hidden; border: 1px solid #222; }
        #gamePath { stroke: var(--red); stroke-width: 5; fill: none; filter: drop-shadow(0 0 8px var(--red)); }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 35px; z-index: 10; transition: 0.1s linear; }
        .mode-btn { padding: 8px 18px; border-radius: 50px; font-weight: 900; font-size: 11px; text-transform: uppercase; border: 1px solid currentColor; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .winner-row { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="no-scrollbar">

    <div id="adminPanel" class="fixed inset-0 bg-black z-[9999] hidden flex-col">
        <div class="p-5 glass flex justify-between items-center border-b border-white/5">
            <h2 class="text-red-600 font-black italic">V28 ADMIN DASH</h2>
            <button onclick="closeAdmin()" class="bg-red-600 text-white px-5 py-2 rounded-full font-black text-[10px]">EXIT</button>
        </div>
        <div id="admContent" class="p-4 flex-1 overflow-y-auto space-y-4 no-scrollbar"></div>
    </div>

    <header class="p-4 flex justify-between items-center glass sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div id="hPfp" class="w-10 h-10 rounded-xl bg-red-950/30 border border-white/5 flex items-center justify-center overflow-hidden"></div>
            <div>
                <h1 class="text-red-600 font-game italic text-lg leading-none">AVIATOR</h1>
                <p id="hUser" class="text-[9px] text-gray-500 font-black mt-1 uppercase">@Guest</p>
            </div>
        </div>
        <div class="flex flex-col items-end gap-1">
            <div class="bg-black/50 border border-white/10 rounded-full px-4 py-1 flex items-center gap-2">
                <span id="hBal" class="font-black text-sm text-green-500">500.00</span>
                <span class="text-[8px] text-gray-600 font-bold uppercase">ETB</span>
            </div>
            <button id="modeBtn" onclick="switchMode()" class="mode-btn text-red-600">Demo Mode</button>
        </div>
    </header>

    <section id="home" class="page active-page no-scrollbar">
        <div id="hist" class="flex gap-2 mb-3 overflow-x-auto no-scrollbar py-1"></div>

        <div class="screen flex items-center justify-center mb-4">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 200 Q 0 200 0 200" /></svg>
            <div id="mTxt" class="font-game text-6xl italic text-white z-20">1.00x</div>
            <div id="plane" class="plane">✈️</div>
            <div id="gStatus" class="absolute top-3 glass px-4 py-1 rounded-full text-[9px] font-black text-gray-400 italic">WAITING...</div>
        </div>

        <div class="glass p-5 rounded-[25px] mb-4">
            <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col">
                    <span class="text-[9px] text-gray-500 font-black uppercase mb-1">Bet Amount</span>
                    <input id="bInp" type="number" value="10" class="bg-transparent text-2xl font-black outline-none w-24">
                </div>
                <div class="flex flex-wrap gap-1.5 justify-end w-2/3">
                    <button onclick="setB(10)" class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-lg text-[10px] font-bold">10</button>
                    <button onclick="setB(50)" class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-lg text-[10px] font-bold">50</button>
                    <button onclick="setB(100)" class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-lg text-[10px] font-bold">100</button>
                    <button onclick="setB(200)" class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-lg text-[10px] font-bold">200</button>
                </div>
            </div>
            <button id="bBtn" onclick="handleBet()" class="w-full bg-red-600 py-5 rounded-2xl text-2xl font-black italic shadow-xl active:scale-95 transition-all">BET</button>
        </div>

        <div class="glass rounded-2xl p-4 h-48 overflow-hidden flex flex-col">
            <div class="flex justify-between text-[10px] font-black text-gray-600 border-b border-white/5 pb-2 mb-2">
                <span>PLAYER</span><span>BET</span><span>CASH OUT</span>
            </div>
            <div id="liveList" class="space-y-2 overflow-y-auto no-scrollbar flex-1"></div>
        </div>
    </section>

    <section id="deposit" class="page no-scrollbar">
        <div class="glass p-5 rounded-[30px] mb-5">
            <p class="text-[10px] text-yellow-500 font-black uppercase mb-3 italic">Bank Accounts (Tap to Copy)</p>
            <div onclick="copyT('1000179571815')" class="flex justify-between items-center bg-black/40 p-4 rounded-xl mb-3 border border-white/5 active:scale-95">
                <span class="font-black text-lg tracking-widest">1000179571815</span>
                <i class="fa-solid fa-copy text-yellow-600"></i>
            </div>
            <div onclick="copyT('0906067696')" class="flex justify-between items-center bg-black/40 p-4 rounded-xl border border-white/5 active:scale-95">
                <span class="font-black text-lg tracking-widest">0906067696</span>
                <i class="fa-solid fa-copy text-blue-600"></i>
            </div>
        </div>

        <div class="glass p-6 rounded-[35px] text-center border-dashed border-2 border-gray-800">
            <p class="text-[10px] font-black text-gray-400 mb-5 uppercase italic">Upload Receipt / ደረሰኝ ላክ</p>
            <input type="file" id="ssInp" class="hidden" accept="image/*" onchange="previewImg(this)">
            <button onclick="document.getElementById('ssInp').click()" class="w-full bg-white/5 py-4 rounded-xl text-[11px] font-black mb-4 border border-white/10 uppercase italic">Select Photo</button>
            <div id="prevBox" class="hidden mb-4"><img id="ssPrev" class="rounded-xl max-h-52 mx-auto border border-white/10"></div>
            <button onclick="submitReceipt()" class="w-full bg-red-600 py-4 rounded-2xl font-black text-sm uppercase shadow-2xl italic">Submit to Admin</button>
        </div>
    </section>

    <section id="leaderboard" class="page no-scrollbar">
        <h2 class="text-center text-xl font-black italic text-red-600 mb-5 uppercase">Top 1000 Elite</h2>
        <div id="lList" class="space-y-2 pb-20"></div>
    </section>

    <section id="profile" class="page no-scrollbar">
        <div class="flex flex-col items-center mb-8 mt-4">
            <div id="pfpBig" class="w-24 h-24 rounded-[35px] bg-red-950/20 border-2 border-red-600/30 flex items-center justify-center overflow-hidden mb-4"></div>
            <h2 id="userBig" class="text-2xl font-black italic">@User</h2>
            <p id="refLink" class="text-[8px] text-gray-600 mt-2 font-bold tracking-[2px]"></p>
        </div>
        <div onclick="copyT(document.getElementById('refLink').innerText)" class="glass p-6 rounded-[30px] text-center active:scale-95 transition-all">
            <i class="fa-solid fa-users text-blue-500 text-2xl mb-2"></i>
            <h3 class="text-xs font-black uppercase italic">Invite & Earn 10%</h3>
            <p class="text-[9px] text-gray-500 font-bold">@world_all_gamesbot</p>
        </div>
        <button onclick="checkAdm()" class="w-full py-10 text-[8px] font-black text-gray-900 uppercase tracking-[10px]">Admin</button>
    </section>

    <nav class="nav-bar">
        <div onclick="showP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-gamepad text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="showP('deposit')" id="n-deposit" class="nav-item"><i class="fa-solid fa-wallet text-2xl mb-1"></i><br>WALLET</div>
        <div onclick="showP('leaderboard')" id="n-leaderboard" class="nav-item"><i class="fa-solid fa-crown text-2xl mb-1"></i><br>TOP</div>
        <div onclick="showP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-user-circle text-2xl mb-1"></i><br>ME</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADM_UNAME = "Dawit_Fikadu21";
        let realBal = parseFloat(localStorage.getItem('v28_real')) || 0;
        let demoBal = 500.00;
        let isDemo = true;
        let isFlying = false; let mult = 1.0;
        let myBet = { active: false, amt: 0 };
        let history = ["1.2x", "4.5x", "1.0x", "2.1x", "10x"];
        let user = { uname: tg.initDataUnsafe?.user?.username || "Dai_Dev", photo: tg.initDataUnsafe?.user?.photo_url || null };

        function init() {
            document.getElementById('hUser').innerText = "@" + user.uname;
            document.getElementById('userBig').innerText = "@" + user.uname;
            document.getElementById('refLink').innerText = "https://t.me/world_all_gamesbot?start=ref_" + user.uname;
            const pfp = user.photo ? `<img src="${user.photo}" class="w-full h-full object-cover">` : `<span class="text-2xl font-black text-red-500">${user.uname[0]}</span>`;
            document.getElementById('hPfp').innerHTML = pfp;
            document.getElementById('pfpBig').innerHTML = pfp;
            updateDisplay(); renderLeaders(); renderHist(); loop();
        }

        // --- CORE GAME ENGINE (GLOBAL SYNC) ---
        function loop() {
            if(isFlying) return;
            let timer = 6;
            let t = setInterval(() => {
                document.getElementById('gStatus').innerText = `NEXT ROUND IN ${timer}S`;
                document.getElementById('mTxt').innerText = "1.00x";
                if(timer-- <= 0) { clearInterval(t); launch(); }
                if(timer === 4) generateFakePlayers(); // Create fake bets
            }, 1000);
        }

        function launch() {
            isFlying = true; mult = 1.0;
            // 40% Profit Calculation
            let crash = 1.01 + (Math.random() * 9.0);
            if(myBet.active && myBet.amt >= 200) crash = 1.01 + (Math.random() * 0.8);

            let eng = setInterval(() => {
                mult += 0.05;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 16, y = mult * 12;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 200 Q ${x/2} ${200-y} ${x+10} ${200-y-10}`);

                updateLiveBets(mult); // Update fake player cashouts

                if(mult >= crash) { clearInterval(eng); explode(); }
            }, 85);
        }

        function explode() {
            isFlying = false; document.getElementById('mTxt').innerText = "FLEW AWAY!";
            document.getElementById('mTxt').style.color = "#ff0044";
            history.unshift(mult.toFixed(2) + "x"); if(history.length > 8) history.pop();
            renderHist(); myBet.active = false; resetB();
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 200 Q 0 200 0 200');
                document.getElementById('mTxt').style.color = "white";
                loop();
            }, 3000);
        }

        function handleBet() {
            if(isFlying) return myBet.active ? cashOut() : tg.showAlert("Flight started! Wait.");
            let a = parseInt(document.getElementById('bInp').value);
            let cur = isDemo ? demoBal : realBal;
            if(a > cur || a <= 0) return tg.showAlert("Insufficient Balance!");

            if(isDemo) demoBal -= a; else { realBal -= a; localStorage.setItem('v28_real', realBal); }
            myBet = { active: true, amt: a };
            updateDisplay();
            document.getElementById('bBtn').innerText = "CASH OUT";
            document.getElementById('bBtn').className = "w-full bg-orange-600 py-5 rounded-2xl text-2xl font-black italic shadow-xl";
        }

        function cashOut() {
            if(!myBet.active || !isFlying) return;
            let win = myBet.amt * mult;
            if(isDemo) demoBal += win; else { realBal += win; localStorage.setItem('v28_real', realBal); }
            myBet.active = false; resetB(); updateDisplay();
            tg.showAlert(`✅ WON: ${win.toFixed(2)} ETB`);
        }

        // --- UI & FAKE PLAYERS ---
        function generateFakePlayers() {
            const list = document.getElementById('liveList'); list.innerHTML = "";
            for(let i=0; i<10; i++) {
                let b = Math.floor(Math.random() * 300) + 10;
                let target = 1.2 + (Math.random() * 5);
                list.innerHTML += `<div id="p-${i}" data-target="${target}" data-bet="${b}" class="winner-row flex justify-between text-[11px] font-bold text-gray-500"><span>Player_${i*33}</span><span>${b}</span><span class="status">Waiting...</span></div>`;
            }
        }
        function updateLiveBets(m) {
            document.querySelectorAll('#liveList div').forEach(el => {
                let target = parseFloat(el.getAttribute('data-target'));
                let bet = el.getAttribute('data-bet');
                if(m >= target && el.querySelector('.status').innerText === "Waiting...") {
                    el.querySelector('.status').innerText = (bet * target).toFixed(1);
                    el.querySelector('.status').className = "status text-green-500 font-black";
                }
            });
        }

        function switchMode() {
            isDemo = !isDemo;
            const b = document.getElementById('modeBtn');
            b.innerText = isDemo ? "Demo Mode" : "Real Mode";
            b.className = isDemo ? "mode-btn text-red-600" : "mode-btn bg-green-600 text-black";
            updateDisplay();
        }
        function setB(n) { document.getElementById('bInp').value = n; }
        function resetB() {
            document.getElementById('bBtn').innerText = "BET";
            document.getElementById('bBtn').className = "w-full bg-red-600 py-5 rounded-2xl text-2xl font-black italic shadow-xl";
        }
        function updateDisplay() {
            document.getElementById('hBal').innerText = (isDemo ? demoBal : realBal).toFixed(2);
            document.getElementById('hBal').style.color = isDemo ? "#ef4444" : "#22c55e";
        }
        function renderHist() {
            document.getElementById('hist').innerHTML = history.map(h => `<span class="bg-white/5 border border-white/10 px-4 py-1 rounded-xl text-[10px] font-black italic">${h}</span>`).join('');
        }
        function renderLeaders() {
            const l = document.getElementById('lList'); l.innerHTML = "";
            let d = "";
            for(let i=1; i<=1000; i++) {
                d += `<div class="glass p-3.5 rounded-xl flex justify-between items-center"><div class="flex items-center gap-3"><span class="text-[10px] text-gray-600 font-black">#${i}</span><span class="text-xs font-bold uppercase">Player_${i*19}</span></div><span class="text-green-500 font-black text-sm">${(Math.random()*25000+500).toFixed(0)} <span class="text-[8px] text-gray-500">ETB</span></span></div>`;
                if(i % 100 === 0) { l.innerHTML += d; d = ""; }
            }
        }

        // --- PHOTO & ADMIN LOGIC ---
        function previewImg(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => { document.getElementById('ssPrev').src = e.target.result; document.getElementById('prevBox').classList.remove('hidden'); };
                r.readAsDataURL(input.files[0]);
            }
        }
        function submitReceipt() {
            const f = document.getElementById('ssInp').files[0];
            if(!f) return tg.showAlert("እባክህ መጀመሪያ ፎቶ ምረጥ!");
            const r = new FileReader();
            r.onload = () => {
                let db = JSON.parse(localStorage.getItem('v28_db')) || [];
                db.push({ user: user.uname, img: r.result, time: new Date().toLocaleString() });
                localStorage.setItem('v28_db', JSON.stringify(db));
                tg.showAlert("✅ ለአድሚን ተልኳል! ባላንሱ እስኪሞላ ድረስ ይጠብቁ።");
                document.getElementById('prevBox').classList.add('hidden');
                document.getElementById('ssInp').value = "";
            };
            r.readAsDataURL(f);
        }
        function checkAdm() {
            if(user.uname === ADM_UNAME && prompt("PIN:") === "215221") {
                document.getElementById('adminPanel').style.display = 'flex'; loadAdm();
            }
        }
        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
        function loadAdm() {
            const db = JSON.parse(localStorage.getItem('v28_db')) || [];
            document.getElementById('admContent').innerHTML = db.map((it, i) => `
                <div class="glass p-5 rounded-2xl">
                    <p class="text-blue-500 text-[10px] font-black mb-3">@${it.user} | ${it.time}</p>
                    <img src="${it.img}" class="w-full rounded-xl mb-4">
                    <div class="flex gap-2">
                        <button onclick="approve(${i})" class="flex-1 bg-green-600 py-3 rounded-lg font-black text-[11px]">APPROVE</button>
                        <button onclick="reject(${i})" class="flex-1 bg-red-600 py-3 rounded-lg font-black text-[11px]">REJECT</button>
                    </div>
                </div>`).join('') || "No requests.";
        }
        function approve(i) {
            let db = JSON.parse(localStorage.getItem('v28_db'));
            let amt = prompt("Amount for @" + db[i].user + "?");
            if(amt && db[i].user === user.uname) { realBal += parseFloat(amt); localStorage.setItem('v28_real', realBal); updateDisplay(); }
            db.splice(i, 1); localStorage.setItem('v28_db', JSON.stringify(db)); loadAdm();
        }
        function reject(i) {
            let db = JSON.parse(localStorage.getItem('v28_db'));
            db.splice(i, 1); localStorage.setItem('v28_db', JSON.stringify(db)); loadAdm();
        }
        function copyT(t) {
            const el = document.createElement('textarea'); el.value = t; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert("✅ ኮፒ ተደርጓል!");
        }
        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-' + id).classList.add('active');
        }

        init();
    </script>
</body>
</html>
