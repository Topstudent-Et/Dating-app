<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro Audio Fix - Dai Tech</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .game-box { width: 90%; max-width: 450px; background: #111; padding: 20px; border-radius: 20px; border: 2px solid #333; text-align: center; }
        .screen { position: relative; height: 250px; background: radial-gradient(circle, #200, #000); border-radius: 15px; overflow: hidden; margin-bottom: 20px; }
        #multiplier { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; font-weight: bold; z-index: 10; }
        canvas { width: 100%; height: 100%; }
        .btn { width: 100%; height: 60px; border: none; border-radius: 10px; font-size: 1.5rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .bet-btn { background: #28a745; color: white; }
        .cash-btn { background: #ffc107; color: black; display: none; }
        input { width: 80%; padding: 10px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>

<audio id="jetSound" loop>
    <source src="https://www.soundjay.com/transportation/sounds/jet-flying-1.mp3" type="audio/mpeg">
</audio>
<audio id="moneySound">
    <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
</audio>
<audio id="bombSound">
    <source src="https://www.soundjay.com/mechanical/sounds/explosion-02.mp3" type="audio/mpeg">
</audio>

<div class="game-box">
    <h2 style="color: #ff003c; margin-top: 0;">AVIATOR PRO</h2>
    <div id="balance" style="color: #28a745; margin-bottom: 10px;">💰 1,000.00 ETB</div>
    
    <div class="screen">
        <div id="multiplier">1.00x</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <input type="number" id="betAmount" value="10.00">
    <button id="betBtn" class="btn bet-btn" onclick="startRound()">BET</button>
    <button id="cashBtn" class="btn cash-btn" onclick="cashOut()">CASH OUT</button>
    <p style="font-size: 10px; color: #555; margin-top: 10px;">ድምፅ ለመስማት ስልክዎ Silent ላይ አለመሆኑን ያረጋግጡ</p>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const multDisplay = document.getElementById('multiplier');
    const balDisplay = document.getElementById('balance');
    
    const jetSnd = document.getElementById('jetSound');
    const moneySnd = document.getElementById('moneySound');
    const bombSnd = document.getElementById('bombSound');

    let balance = 1000.00;
    let multiplier = 1.00;
    let isFlying = false;
    let crashPoint;
    let animationId;

    function startRound() {
        const amt = parseFloat(document.getElementById('betAmount').value);
        if (amt > balance) return alert("ሂሳብ የሎትም!");
        
        balance -= amt;
        balDisplay.innerText = "💰 " + balance.toFixed(2) + " ETB";
        
        isFlying = true;
        multiplier = 1.00;
        // 40% House Edge Logic
        crashPoint = Math.random() < 0.4 ? (Math.random() * 0.2 + 1.01) : (Math.random() * 5 + 1.2);

        document.getElementById('betBtn').style.display = 'none';
        document.getElementById('cashBtn').style.display = 'block';
        multDisplay.style.color = "white";

        // ድምፅ ማስነሻ
        jetSnd.currentTime = 0;
        jetSnd.play().catch(e => console.log("Audio Play Error:", e));

        animate();
    }

    function animate() {
        if (!isFlying) return;
        multiplier += 0.008 * Math.sqrt(multiplier);
        multDisplay.innerText = multiplier.toFixed(2) + "x";
        draw();
        if (multiplier >= crashPoint) { explode(); return; }
        animationId = requestAnimationFrame(animate);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const x = (multiplier - 1) * 60;
        const y = canvas.height - ((multiplier - 1) * 40);
        
        ctx.strokeStyle = "#ff003c";
        ctx.lineWidth = 5;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "red";
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        ctx.quadraticCurveTo(x/2, canvas.height, x, y);
        ctx.stroke();

        ctx.font = "40px Arial";
        ctx.fillText("✈️", x - 20, y + 15);
    }

    function explode() {
        isFlying = false;
        jetSnd.pause();
        bombSnd.play();
        multDisplay.innerText = "FLEW AWAY!";
        multDisplay.style.color = "#ff4444";
        stopGame();
    }

    function cashOut() {
        if (!isFlying) return;
        const win = parseFloat(document.getElementById('betAmount').value) * multiplier;
        balance += win;
        balDisplay.innerText = "💰 " + balance.toFixed(2) + " ETB";
        
        isFlying = false;
        jetSnd.pause();
        moneySnd.play();
        multDisplay.style.color = "#28a745";
        stopGame();
    }

    function stopGame() {
        document.getElementById('betBtn').style.display = 'block';
        document.getElementById('cashBtn').style.display = 'none';
        cancelAnimationFrame(animationId);
    }

    canvas.width = 400; canvas.height = 250;
</script>

</body>
</html>
