<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate Betting Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #0f1422 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0a0e1a 0%, #0b0f1a 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            background: linear-gradient(135deg, #00ffcc, #00cc99);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .balance-card {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 15px;
            padding: 12px 20px;
            display: inline-block;
            margin-top: 10px;
        }

        .balance-card span {
            color: #00ffcc;
            font-size: 28px;
            font-weight: bold;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Cards */
        .game-card {
            background: rgba(17, 25, 40, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.2);
            border-color: rgba(0, 255, 204, 0.5);
        }

        .game-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #00ffcc;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Aviator Specific */
        .aviator-display {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            margin: 15px 0;
            position: relative;
            overflow: hidden;
        }

        #multiplier {
            font-size: 56px;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
        }

        .plane {
            font-size: 40px;
            position: relative;
            animation: none;
            display: inline-block;
        }

        @keyframes fly {
            0% {
                transform: translateX(-100px) translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateX(500px) translateY(-80px);
                opacity: 0;
            }
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffcc, #00cc99);
            color: #0a0e1a;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 255, 204, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #00cc88, #00aa66);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffa502, #ff6348);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Inputs */
        .input-group {
            margin: 10px 0;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00ffcc;
        }

        /* Result Display */
        .result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            text-align: center;
            font-weight: bold;
        }

        /* Admin Panel */
        .admin-panel {
            background: rgba(255, 100, 0, 0.1);
            border: 1px solid rgba(255, 100, 0, 0.3);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
        }

        .admin-panel h3 {
            color: #ffa502;
            margin-bottom: 15px;
        }

        /* Deposit Section */
        .deposit-section {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .deposit-section input {
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            .btn {
                padding: 10px 16px;
                font-size: 14px;
            }
            
            #multiplier {
                font-size: 40px;
            }
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .playing {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 ULTIMATE BETTING PRO 🎰</h1>
        <div class="balance-card">
            💰 Balance: $<span id="balance">100.00</span>
        </div>
    </div>

    <div class="container">
        <div class="games-grid">
            <!-- Aviator Game -->
            <div class="game-card">
                <div class="game-title">
                    ✈️ Aviator Game
                </div>
                <div class="input-group">
                    <input type="number" id="betAmount" placeholder="Bet Amount" step="0.01" value="10">
                </div>
                <div class="aviator-display">
                    <div class="plane" id="plane">✈️</div>
                    <div id="multiplier">1.00x</div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="startBtn" style="flex:1">🚀 Start</button>
                    <button class="btn btn-danger" id="cashOutBtn" style="flex:1">💰 Cash Out</button>
                </div>
                <div id="aviatorResult" class="result"></div>
            </div>

            <!-- Dice Game -->
            <div class="game-card">
                <div class="game-title">
                    🎲 Dice Game
                </div>
                <div class="input-group">
                    <input type="number" id="diceBet" placeholder="Bet Amount" step="0.01" value="10">
                </div>
                <button class="btn btn-primary" id="diceBtn" style="width:100%">🎲 Roll Dice</button>
                <div id="diceResult" class="result"></div>
            </div>

            <!-- Slot Machine -->
            <div class="game-card">
                <div class="game-title">
                    🎰 Slot Machine
                </div>
                <div class="input-group">
                    <input type="number" id="slotBet" placeholder="Bet Amount" step="0.01" value="10">
                </div>
                <button class="btn btn-primary" id="slotBtn" style="width:100%">🎰 Spin</button>
                <div id="slotResult" class="result"></div>
            </div>

            <!-- Coin Flip -->
            <div class="game-card">
                <div class="game-title">
                    🪙 Coin Flip
                </div>
                <div class="input-group">
                    <input type="number" id="coinBet" placeholder="Bet Amount" step="0.01" value="10">
                </div>
                <button class="btn btn-primary" id="coinBtn" style="width:100%">🪙 Flip Coin</button>
                <div id="coinResult" class="result"></div>
            </div>
        </div>

        <!-- Deposit/Withdraw Section -->
        <div class="game-card">
            <div class="game-title">
                💳 Deposit / Withdraw
            </div>
            <div class="input-group">
                <input type="number" id="amount" placeholder="Enter Amount" step="0.01">
            </div>
            <div class="deposit-section">
                <button class="btn btn-success" id="depositBtn" style="flex:1">➕ Deposit</button>
                <button class="btn btn-danger" id="withdrawBtn" style="flex:1">➖ Withdraw</button>
            </div>
        </div>

        <!-- Admin Panel -->
        <div class="admin-panel">
            <h3>⚙️ Admin Panel</h3>
            <div class="input-group">
                <input type="number" id="crashControl" placeholder="Set Crash Point (1-10)" step="0.1" min="1" max="10">
            </div>
            <button class="btn btn-warning" id="setCrashBtn">🎯 Set Custom Crash Point</button>
            <div style="margin-top: 10px; font-size: 12px; color: #888;">
                Current: Random (1-6x) | Custom overrides random
            </div>
        </div>
    </div>

    <script>
        // Game State
        let balance = 100.00;
        let multiplier = 1.00;
        let interval = null;
        let playing = false;
        let currentBet = 0;
        let customCrashPoint = null;
        
        // DOM Elements
        const balanceEl = document.getElementById('balance');
        const multiplierEl = document.getElementById('multiplier');
        const planeEl = document.getElementById('plane');
        const aviatorResult = document.getElementById('aviatorResult');
        
        // Update Balance Display
        function updateBalance() {
            balanceEl.textContent = balance.toFixed(2);
        }
        
        // Deposit Function
        function deposit() {
            const amount = parseFloat(document.getElementById('amount').value);
            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }
            balance += amount;
            updateBalance();
            document.getElementById('amount').value = '';
            showNotification('💰 Deposit successful!', 'success');
        }
        
        // Withdraw Function
        function withdraw() {
            const amount = parseFloat(document.getElementById('amount').value);
            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }
            if (amount > balance) {
                alert('Insufficient balance!');
                return;
            }
            balance -= amount;
            updateBalance();
            document.getElementById('amount').value = '';
            showNotification('💸 Withdrawal successful!', 'success');
        }
        
        // Set Custom Crash Point
        function setCrashPoint() {
            const crash = parseFloat(document.getElementById('crashControl').value);
            if (isNaN(crash) || crash < 1.1 || crash > 10) {
                alert('Please enter a crash point between 1.1 and 10');
                return;
            }
            customCrashPoint = crash;
            showNotification(`🎯 Crash point set to ${crash.toFixed(2)}x`, 'info');
        }
        
        // Show Notification
        function showNotification(message, type) {
            // Create temporary notification
            const notif = document.createElement('div');
            notif.textContent = message;
            notif.style.cssText = `
                position: fixed;
                top: 80px;
                right: 20px;
                background: ${type === 'success' ? '#00cc88' : '#ffa502'};
                color: white;
                padding: 12px 20px;
                border-radius: 10px;
                z-index: 1000;
                animation: slideIn 0.3s ease;
            `;
            document.body.appendChild(notif);
            setTimeout(() => {
                notif.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notif.remove(), 300);
            }, 2000);
        }
        
        // Aviator Game
        function startGame() {
            if (playing) {
                alert('Game already in progress!');
                return;
            }
            
            const bet = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(bet) || bet <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }
            if (bet > balance) {
                alert('Insufficient balance!');
                return;
            }
            
            balance -= bet;
            currentBet = bet;
            updateBalance();
            
            multiplier = 1.00;
            playing = true;
            
            // Determine crash point
            const crashPoint = customCrashPoint || (Math.random() * 5 + 1.1);
            
            // Animation for plane
            planeEl.style.animation = 'fly 3s linear infinite';
            
            interval = setInterval(() => {
                if (!playing) return;
                
                multiplier += 0.05;
                multiplierEl.textContent = multiplier.toFixed(2) + 'x';
                
                if (multiplier >= crashPoint) {
                    clearInterval(interval);
                    playing = false;
                    planeEl.style.animation = 'none';
                    aviatorResult.innerHTML = `💥 CRASHED at ${crashPoint.toFixed(2)}x! Lost $${currentBet.toFixed(2)}`;
                    aviatorResult.style.background = 'rgba(255, 71, 87, 0.3)';
                    showNotification(`💥 Crashed at ${crashPoint.toFixed(2)}x!`, 'error');
                    customCrashPoint = null; // Reset custom crash after use
                }
            }, 100);
        }
        
        function cashOut() {
            if (!playing) {
                alert('No active game!');
                return;
            }
            
            clearInterval(interval);
            playing = false;
            planeEl.style.animation = 'none';
            
            const win = currentBet * multiplier;
            balance += win;
            updateBalance();
            
            aviatorResult.innerHTML = `✅ CASHED OUT! Won $${win.toFixed(2)} at ${multiplier.toFixed(2)}x`;
            aviatorResult.style.background = 'rgba(0, 255, 204, 0.3)';
            showNotification(`🎉 Won $${win.toFixed(2)}!`, 'success');
        }
        
        // Dice Game
        function playDice() {
            const bet = parseFloat(document.getElementById('diceBet').value);
            if (isNaN(bet) || bet <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }
            if (bet > balance) {
                alert('Insufficient balance!');
                return;
            }
            
            const roll = Math.floor(Math.random() * 6) + 1;
            const resultEl = document.getElementById('diceResult');
            
            if (roll >= 4) {
                balance += bet;
                resultEl.innerHTML = `🎉 WIN! Rolled ${roll} - Won $${bet.toFixed(2)}`;
                resultEl.style.background = 'rgba(0, 255, 204, 0.3)';
                showNotification(`🎲 Dice Win! +$${bet.toFixed(2)}`, 'success');
            } else {
                balance -= bet;
                resultEl.innerHTML = `💀 LOST! Rolled ${roll} - Lost $${bet.toFixed(2)}`;
                resultEl.style.background = 'rgba(255, 71, 87, 0.3)';
                showNotification(`💀 Dice Lost! -$${bet.toFixed(2)}`, 'error');
            }
            updateBalance();
        }
        
        // Slot Machine
        function playSlot() {
            const bet = parseFloat(document.getElementById('slotBet').value);
            if (isNaN(bet) || bet <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }
            if (bet > balance) {
                alert('Insufficient balance!');
                return;
            }
            
            const symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣', '⭐'];
            const a = symbols[Math.floor(Math.random() * symbols.length)];
            const b = symbols[Math.floor(Math.random() * symbols.length)];
            const c = symbols[Math.floor(Math.random() * symbols.length)];
            const resultEl = document.getElementById('slotResult');
            
            if (a === b && b === c) {
                const winAmount = bet * 10;
                balance += winAmount;
                resultEl.innerHTML = `🎉 JACKPOT! ${a}${b}${c} - Won $${winAmount.toFixed(2)}! 🎉`;
                resultEl.style.background = 'rgba(255, 165, 2, 0.3)';
                showNotification(`🎰 JACKPOT! +$${winAmount.toFixed(2)}`, 'success');
            } else if (a === b || b === c || a === c) {
                const winAmount = bet * 2;
                balance += winAmount;
                resultEl.innerHTML = `✨ ${a}${b}${c} - Pair! Won $${winAmount.toFixed(2)} ✨`;
                resultEl.style.background = 'rgba(0, 255, 204, 0.3)';
                showNotification(`🎰 Pair Win! +$${winAmount.toFixed(2)}`, 'success');
            } else {
                balance -= bet;
                resultEl.innerHTML = `❌ ${a}${b}${c} - Lost $${bet.toFixed(2)} ❌`;
                resultEl.style.background = 'rgba(255, 71, 87, 0.3)';
                showNotification(`🎰 Lost! -$${bet.toFixed(2)}`, 'error');
            }
            updateBalance();
        }
        
        // Coin Flip
        function flipCoin() {
            const bet = parseFloat(document.getElementById('coinBet').value);
            if (isNaN(bet) || bet <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }
            if (bet > balance) {
                alert('Insufficient balance!');
                return;
            }
            
            const isWin = Math.random() > 0.5;
            const resultEl = document.getElementById('coinResult');
            
            if (isWin) {
                balance += bet;
                resultEl.innerHTML = `🪙 HEADS! You win $${bet.toFixed(2)}! 🎉`;
                resultEl.style.background = 'rgba(0, 255, 204, 0.3)';
                showNotification(`🪙 Coin Flip Win! +$${bet.toFixed(2)}`, 'success');
            } else {
                balance -= bet;
                resultEl.innerHTML = `💀 TAILS! You lose $${bet.toFixed(2)}! 💀`;
                resultEl.style.background = 'rgba(255, 71, 87, 0.3)';
                showNotification(`🪙 Coin Flip Lost! -$${bet.toFixed(2)}`, 'error');
            }
            updateBalance();
        }
        
        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        // Event Listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('cashOutBtn').addEventListener('click', cashOut);
        document.getElementById('diceBtn').addEventListener('click', playDice);
        document.getElementById('slotBtn').addEventListener('click', playSlot);
        document.getElementById('coinBtn').addEventListener('click', flipCoin);
        document.getElementById('depositBtn').addEventListener('click', deposit);
        document.getElementById('withdrawBtn').addEventListener('click', withdraw);
        document.getElementById('setCrashBtn').addEventListener('click', setCrashPoint);
        
        // Initial balance
        updateBalance();
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && playing) {
                e.preventDefault();
                cashOut();
            }
        });
        
        console.log('🎮 Ultimate Betting Pro loaded!');
    </script>
</body>
</html>
