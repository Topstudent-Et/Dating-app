<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WORLD GAME PRO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <div class="logo-icon">✈️</div>
            <div class="logo-text">WORLD GAME</div>
        </div>
        <div class="balance-badge" onclick="showP('walletPage')">
            <span id="topBal">0.00</span> <small>ETB</small>
        </div>
    </div>

    <div id="playPage" class="page active">
        <div class="game-container">
            <div id="multDisplay">1.00x</div>
            <canvas id="gameCanvas"></canvas>
            <div id="plane">✈️</div>
        </div>
        
        <div class="bet-grid">
            <div class="bet-card">
                <input type="number" id="amt1" value="10">
                <button id="btn1" onclick="handleBet(1)">BET</button>
            </div>
            <div class="bet-card">
                <input type="number" id="amt2" value="10">
                <button id="btn2" onclick="handleBet(2)">BET</button>
            </div>
        </div>
    </div>

    <nav class="nav-dock">
        <button onclick="showP('playPage')"><i class="fas fa-play"></i></button>
        <button onclick="showP('walletPage')"><i class="fas fa-wallet"></i></button>
        <button onclick="showP('profilePage')"><i class="fas fa-user"></i></button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
