<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dai Betting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .aviator-screen { background: radial-gradient(circle, #1a1d23 0%, #000 100%); height: 300px; position: relative; overflow: hidden; border: 2px solid #333; border-radius: 10px; }
        .plane { position: absolute; bottom: 20px; left: 20px; transition: all 0.1s linear; width: 50px; }
        .multiplier { font-size: 3rem; font-weight: bold; color: #e91e63; text-shadow: 0 0 10px rgba(233, 30, 99, 0.5); }
        .game-card { background: #1c2127; border-radius: 10px; padding: 15px; text-align: center; border-bottom: 3px solid transparent; transition: 0.3s; }
        .game-card:hover { border-bottom: 3px solid #e91e63; transform: translateY(-5px); }
        .btn-bet { background-color: #28a745; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; width: 100%; }
        .btn-bet:disabled { background-color: #555; }
    </style>
</head>
<body class="p-4">

    <div class="flex justify-between items-center mb-6 bg-gray-900 p-4 rounded-lg border border-gray-700">
        <div>
            <h1 id="user-name" class="text-xl font-bold">ሰላም፣ ተጫዋች</h1>
            <p id="balance-display" class="text-green-400 font-mono">ቀሪ ሂሳብ: 0.00 ETB</p>
        </div>
        <div class="text-right">
            <button onclick="toggleLang()" class="text-xs bg-gray-700 px-2 py-1 rounded mb-2">ENG/አማ</button>
            <div class="flex space-x-2">
                <button class="bg-blue-600 text-xs px-3 py-1 rounded">ገቢ (Deposit)</button>
                <button class="bg-red-600 text-xs px-3 py-1 rounded">ወጪ (Withdraw)</button>
            </div>
        </div>
    </div>

    <div class="aviator-screen flex flex-col items-center justify-center mb-4">
        <div id="status-text" class="absolute top-4 text-gray-400">ቀጣዩ በረራ ይጀምራል...</div>
        <div id="multi-val" class="multiplier">1.00x</div>
        <img id="plane-img" src="https://svgshare.com/i/157r.svg" class="plane" alt="plane">
        <canvas id="graphCanvas" class="absolute inset-0 pointer-events-none"></canvas>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-gray-800 p-3 rounded">
            <input type="number" id="bet-amount" value="10" class="w-full bg-black text-white p-2 rounded mb-2 border border-gray-600">
            <button id="bet-btn" onclick="placeBet()" class="btn-bet text-lg">BET (ውርርድ)</button>
        </div>
        <div class="bg-gray-800 p-3 rounded text-sm">
            <p class="mb-1">ራስ-ሰር ማቆሚያ (Auto Cashout)</p>
            <input type="number" id="auto-cash" value="2.0" step="0.1" class="w-full bg-black text-white p-2 rounded border border-gray-600">
        </div>
    </div>

    <h2 class="mb-3 font-bold text-gray-400">ሌሎች ጨዋታዎች</h2>
    <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="game-card">🎰 KENO</div>
        <div class="game-card">🎡 ROULETTE</div>
        <div class="game-card">💣 CRASH</div>
        <div class="game-card">🃏 POKER</div>
    </div>

    <div class="bg-gray-900 p-4 rounded-lg border border-gray-800 text-sm">
        <div class="flex justify-between mb-2">
            <span>አሁን እየተጫወቱ ያሉ፡ <span id="player-count" class="text-green-500">142</span></span>
            <span class="text-yellow-500">Daily Bonus: 🎁</span>
        </div>
        <p class="text-gray-500 mb-2 text-xs text-center">ሊንክዎን ያጋሩና ኮሚሽን ያግኙ</p>
        <div class="bg-black p-2 rounded flex justify-between items-center text-blue-400">
            <span class="truncate text-xs">t.me/YourBotName_bot?start=ref123</span>
            <button class="bg-gray-700 text-white px-2 py-1 rounded text-xs">Copy</button>
        </div>
    </div>

    <audio id="sound-fly" src="https://www.soundjay.com/transportation/airplane-take-off-1.mp3"></audio>
    <audio id="sound-blast" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

    <script>
        let multiplier = 1.00;
        let isFlying = false;
        let balance = 1000.00;
        let currentBet = 0;
        let profitMargin = 0.40; // 40% Admin Profit Logic

        function updateBalance() {
            document.getElementById('balance-display').innerText = `ቀሪ ሂሳብ: ${balance.toFixed(2)} ETB`;
        }

        function placeBet() {
            let amount = parseFloat(document.getElementById('bet-amount').value);
            if (amount > balance) {
                alert("ያላችሁ ቀሪ ሂሳብ አነስተኛ ነው!");
                return;
            }
            balance -= amount;
            currentBet = amount;
            updateBalance();
            startFlight();
        }

        function startFlight() {
            if (isFlying) return;
            isFlying = true;
            multiplier = 1.00;
            document.getElementById('bet-btn').innerText = "CASH OUT";
            document.getElementById('bet-btn').classList.replace('bg-green-600', 'bg-yellow-600');
            document.getElementById('sound-fly').play();
            
            // Logic for 40% profit: Crash early more often
            let crashPoint = Math.random() < profitMargin ? (1 + Math.random()).toFixed(2) : (1 + Math.random() * 10).toFixed(2);

            let interval = setInterval(() => {
                if (multiplier >= crashPoint) {
                    clearInterval(interval);
                    crash();
                } else {
                    multiplier += 0.01;
                    document.getElementById('multi-val').innerText = multiplier.toFixed(2) + "x";
                    movePlane();
                }
            }, 50);
        }

        function movePlane() {
            let plane = document.getElementById('plane-img');
            let bottom = 20 + (multiplier * 10);
            let left = 20 + (multiplier * 20);
            plane.style.bottom = bottom + "px";
            plane.style.left = left + "px";
        }

        function crash() {
            isFlying = false;
            document.getElementById('sound-blast').play();
            document.getElementById('status-text').innerText = "ፈነዳ! (FLEW AWAY)";
            document.getElementById('multi-val').style.color = "red";
            document.getElementById('bet-btn').innerText = "BET (ውርርድ)";
            // Reset for next round
            setTimeout(() => {
                document.getElementById('multi-val').style.color = "#e91e63";
                document.getElementById('status-text').innerText = "ቀጣዩ በረራ ይጀምራል...";
                document.getElementById('plane-img').style.bottom = "20px";
                document.getElementById('plane-img').style.left = "20px";
            }, 3000);
        }

        // Language toggle simple
        let lang = 'am';
        function toggleLang() {
            lang = lang === 'am' ? 'en' : 'am';
            document.getElementById('user-name').innerText = lang === 'am' ? "ሰላም፣ ዳይ" : "Hello, Dai";
        }

        // Live player simulation
        setInterval(() => {
            let count = Math.floor(Math.random() * (200 - 100) + 100);
            document.getElementById('player-count').innerText = count;
        }, 5000);

        updateBalance();
    </script>
</body>
</html>
