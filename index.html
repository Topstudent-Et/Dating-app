<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIA-MASTER ELITE V140</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800;900&display=swap');
        :root { --accent: #ff0044; --real-green: #00ff66; --gold: #ffd700; }
        
        body.dark-mode { background: #000; color: white; }
        body.light-mode { background: #f0f2f5; color: #111; }

        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass-ui { background: rgba(128, 128, 128, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; }
        
        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border-top: 1px solid rgba(128,128,128,0.2); }
        .dark-mode .nav-bar { background: #0a0a0a; }
        .light-mode .nav-bar { background: #ffffff; }

        .page { display: none; height: calc(100vh - 75px); overflow-y: auto; padding: 15px; margin-top: 80px; }
        .active-page { display: block; animation: fadeIn 0.3s; }

        /* Game Core */
        .game-canvas { height: 240px; position: relative; border-radius: 35px; border: 1px solid rgba(128,128,128,0.3); overflow: hidden; }
        .dark-mode .game-canvas { background: radial-gradient(circle, #1a0505 0%, #000 100%); }
        .light-mode .game-canvas { background: radial-gradient(circle, #fff0f0 0%, #eee 100%); }
        
        #gamePath { stroke: var(--accent); stroke-width: 6; fill: none; filter: drop-shadow(0 0 15px var(--accent)); }
        .verify-badge { color: #38bdf8; margin-left: 4px; }
        
        .chip { padding: 8px; border-radius: 12px; font-weight: 900; font-size: 11px; border: 1px solid rgba(128,128,128,0.3); cursor: pointer; }
        .chip.active { background: var(--accent); color: white; border-color: white; }

        .king-glow { animation: shine 2s infinite; }
        @keyframes shine { 0% { filter: brightness(1); } 50% { filter: brightness(1.5) drop-shadow(0 0 10px var(--gold)); } 100% { filter: brightness(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="dark-mode">

    <header class="fixed top-0 w-full z-50 p-4 flex justify-between items-center border-b border-white/10 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div id="hPfp" class="w-10 h-10 bg-zinc-800 rounded-xl overflow-hidden border-2 border-blue-500 shadow-lg"></div>
            <div>
                <p id="hBal" class="text-green-500 font-black text-lg">0.00 ETB</p>
                <div class="flex items-center"><span class="text-[8px] font-bold uppercase tracking-tighter opacity-60" id="txtMode">REAL MODE</span><i class="fa-solid fa-circle-check verify-badge text-[10px]"></i></div>
            </div>
        </div>
        <div class="flex gap-1 p-1 bg-black/20 rounded-xl">
            <button onclick="setGameMode(false)" id="mReal" class="px-4 py-1.5 bg-green-600 text-black text-[10px] font-black rounded-lg">REAL</button>
            <button onclick="setGameMode(true)" id="mDemo" class="px-4 py-1.5 text-zinc-500 text-[10px] font-black rounded-lg">DEMO</button>
        </div>
    </header>

    <section id="home" class="page active-page">
        <div id="history" class="flex gap-2 overflow-x-auto mb-3 pb-1 no-scrollbar"></div>
        
        <div class="game-canvas flex items-center justify-center mb-6">
            <svg width="100%" height="100%" style="position:absolute;"><path id="gamePath" d="M 0 240 Q 0 240 0 240" /></svg>
            <div id="mTxt" class="font-game text-7xl italic z-20">1.00x</div>
            <div id="plane" class="absolute bottom-6 left-6 text-5xl z-20" style="transform: rotate(-15deg);">🚀</div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="glass-ui p-4">
                <div class="grid grid-cols-4 gap-1 mb-3">
                    <button onclick="setB(1,10)" class="chip">10</button>
                    <button onclick="setB(1,50)" class="chip">50</button>
                    <button onclick="setB(1,100)" class="chip">100</button>
                    <button onclick="setB(1,500)" class="chip">500</button>
                </div>
                <div class="grid grid-cols-4 gap-1 mb-3">
                    <button onclick="setA(1,2)" class="chip">2x</button>
                    <button onclick="setA(1,4)" class="chip">4x</button>
                    <button onclick="setA(1,6)" class="chip">6x</button>
                    <button onclick="setA(1,10)" class="chip">10x</button>
                </div>
                <input id="bInp1" type="number" value="10" class="w-full bg-black/20 border border-white/10 p-3 rounded-xl mb-3 text-center font-black text-xl outline-none">
                <button id="bBtn1" onclick="handleBet(1)" class="w-full py-4 rounded-xl font-black italic text-lg shadow-lg bg-green-500 text-black">BET</button>
            </div>
            <div class="glass-ui p-4">
                <div class="grid grid-cols-4 gap-1 mb-3">
                    <button onclick="setB(2,10)" class="chip">10</button>
                    <button onclick="setB(2,50)" class="chip">50</button>
                    <button onclick="setB(2,100)" class="chip">100</button>
                    <button onclick="setB(2,500)" class="chip">500</button>
                </div>
                <div class="grid grid-cols-4 gap-1 mb-3">
                    <button onclick="setA(2,2)" class="chip">2x</button>
                    <button onclick="setA(2,4)" class="chip">4x</button>
                    <button onclick="setA(2,6)" class="chip">6x</button>
                    <button onclick="setA(2,10)" class="chip">10x</button>
                </div>
                <input id="bInp2" type="number" value="10" class="w-full bg-black/20 border border-white/10 p-3 rounded-xl mb-3 text-center font-black text-xl outline-none">
                <button id="bBtn2" onclick="handleBet(2)" class="w-full py-4 rounded-xl font-black italic text-lg shadow-lg bg-green-500 text-black">BET</button>
            </div>
        </div>

        <div class="mt-6 mb-24 space-y-2" id="liveFeed"></div>
    </section>

    <section id="wallet" class="page">
        <div class="flex gap-2 mb-6">
            <button onclick="shW('d')" id="btnD" class="flex-1 py-4 bg-red-600 rounded-2xl font-black text-sm shadow-lg">DEPOSIT</button>
            <button onclick="shW('w')" id="btnW" class="flex-1 py-4 bg-zinc-800 rounded-2xl font-black text-sm shadow-lg">WITHDRAW</button>
        </div>

        <div id="secD" class="glass-ui p-6">
            <p class="text-[10px] opacity-50 mb-2 font-bold uppercase">CBE Account Holder: DAWIT</p>
            <div onclick="copyT('1000179571815')" class="bg-black/30 p-5 rounded-2xl border border-white/5 flex justify-between items-center mb-6">
                <p class="font-game text-xl tracking-widest">1000179571815</p><i class="fa-solid fa-copy"></i>
            </div>
            <input type="text" id="dName" placeholder="Full Name" class="w-full bg-black/20 p-4 rounded-xl mb-3 border border-white/5 outline-none font-bold">
            <input type="text" id="dFT" placeholder="FT Transaction ID" class="w-full bg-black/20 p-4 rounded-xl mb-3 border border-white/5 outline-none font-bold">
            <input type="number" id="dAmt" placeholder="Amount (ETB)" class="w-full bg-black/20 p-4 rounded-xl mb-6 border border-white/5 outline-none font-bold">
            <button onclick="subD()" class="w-full py-5 bg-red-600 rounded-2xl font-black shadow-2xl">SUBMIT DEPOSIT</button>
        </div>

        <div id="secW" class="hidden glass-ui p-6">
            <h3 class="font-black mb-6 italic text-xl">CASH OUT TO CBE</h3>
            <input type="text" id="wAcc" placeholder="Account Number" class="w-full bg-black/20 p-4 rounded-xl mb-3 border border-white/5 outline-none font-bold">
            <input type="number" id="wAmt" placeholder="Amount to Withdraw" class="w-full bg-black/20 p-4 rounded-xl mb-6 border border-white/5 outline-none font-bold">
            <button onclick="subW()" class="w-full py-5 bg-green-600 text-black rounded-2xl font-black shadow-2xl">CONFIRM WITHDRAW</button>
        </div>
    </section>

    <section id="top" class="page">
        <div class="flex justify-center items-end gap-3 mb-12 h-64">
            <div class="glass-ui w-24 h-44 order-1 flex flex-col items-center justify-center border-zinc-400">🥈<p class="text-[10px] font-black mt-2">Bini_Boy</p><p class="text-[9px] text-green-500">92K</p></div>
            <div class="glass-ui w-32 h-60 border-2 border-yellow-500 order-2 flex flex-col items-center justify-center king-glow shadow-2xl bg-gradient-to-t from-yellow-900/20 to-transparent">
                <span class="text-4xl">👑</span><p class="text-xs font-black mt-3">DAI_FIKADU <i class="fa-solid fa-circle-check verify-badge"></i></p>
                <span class="text-[10px] text-yellow-500 font-bold mt-1 tracking-widest">🏆 245,000 ETB</span>
                <span class="text-[20px] mt-2">💎</span>
            </div>
            <div class="glass-ui w-24 h-36 order-3 flex flex-col items-center justify-center border-orange-900">🥉<p class="text-[10px] font-black mt-2">Sami_Pro</p><p class="text-[9px] text-green-500">48K</p></div>
        </div>
        <div id="tList" class="space-y-3 pb-12"></div>
    </section>

    <section id="profile" class="page">
        <div class="glass-ui p-8 text-center mb-6">
            <div id="pfpB" class="w-24 h-24 mx-auto mb-4 rounded-3xl border-4 border-blue-500 flex items-center justify-center text-4xl shadow-2xl"></div>
            <h2 id="uName" class="text-2xl font-black italic">@User <i class="fa-solid fa-circle-check verify-badge"></i></h2>
            <div class="flex justify-center gap-4 mt-6">
                <div onclick="toggleTheme()" class="p-3 bg-white/5 rounded-xl border border-white/10 w-24">
                    <i class="fa-solid fa-circle-half-stroke mb-1"></i><p class="text-[8px] font-bold">THEME</p>
                </div>
                <div onclick="toggleLang()" class="p-3 bg-white/5 rounded-xl border border-white/10 w-24">
                    <i class="fa-solid fa-language mb-1"></i><p class="text-[8px] font-bold" id="txtLang">አማርኛ</p>
                </div>
            </div>
        </div>

        <div id="admBox" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-ui p-6 border-l-4 border-blue-500"><p class="text-[9px] opacity-50 mb-1">TOTAL REVENUE</p><p id="adT" class="text-2xl font-game">0</p></div>
                <div class="glass-ui p-6 border-l-4 border-yellow-500"><p class="text-[9px] opacity-50 mb-1">ADMIN 20% PROFIT</p><p id="adP" class="text-2xl font-game text-yellow-500">0</p></div>
            </div>
            <button onclick="oM('dep')" class="w-full py-5 bg-red-600 rounded-2xl font-black shadow-xl">DEPOSIT REQUESTS</button>
            <button onclick="oM('wit')" class="w-full py-5 bg-zinc-800 rounded-2xl font-black shadow-xl">WITHDRAW REQUESTS</button>
        </div>
    </section>

    <nav class="nav-bar">
        <div onclick="shP('home')" id="n-home" class="nav-item active"><i class="fa-solid fa-plane-up text-2xl mb-1"></i><br>PLAY</div>
        <div onclick="shP('wallet')" id="n-wallet" class="nav-item"><i class="fa-solid fa-wallet text-2xl mb-1"></i><br>WALLET</div>
        <div onclick="shP('top')" id="n-top" class="nav-item"><i class="fa-solid fa-crown text-2xl mb-1"></i><br>TOP</div>
        <div onclick="shP('profile')" id="n-profile" class="nav-item"><i class="fa-solid fa-gear text-2xl mb-1"></i><br>PROFILE</div>
    </nav>

    <div id="admMod" class="fixed inset-0 bg-black/95 z-[2000] hidden p-6 flex flex-col">
        <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4"><h2 id="mTit" class="font-black text-red-500"></h2><button onclick="cM()" class="p-2 px-4 bg-zinc-800 rounded-lg text-xs font-bold">CLOSE</button></div>
        <div id="mList" class="space-y-4 overflow-y-auto"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ADM = "Dawit_Fikadu21";
        let isD = false, isF = false, mult = 1.0, lang = 'am';
        let rBal = parseFloat(localStorage.getItem('v14_r')) || 0;
        let dBal = parseFloat(localStorage.getItem('v14_d')) || 500;
        let stats = JSON.parse(localStorage.getItem('v14_st')) || { t: 0, p: 0 };
        let bts = { 1: { a: false, amt: 0, au: 0 }, 2: { a: false, amt: 0, au: 0 } };

        function init() {
            const u = tg.initDataUnsafe?.user;
            const un = u?.username || "Guest";
            document.getElementById('uName').innerText = "@" + un;
            const p = u?.photo_url ? `<img src="${u.photo_url}" class="w-full h-full object-cover">` : `<span class="font-black">${un[0]}</span>`;
            document.getElementById('hPfp').innerHTML = p; document.getElementById('pfpB').innerHTML = p;
            if(un === ADM) { document.getElementById('admBox').classList.remove('hidden'); updateAdm(); }
            upUI(); gameLoop(); loadTop();
        }

        function gameLoop() {
            if(isF) return;
            let timer = 5;
            let t = setInterval(() => {
                timer--; if(timer <= 0) { clearInterval(t); start(); }
                genF();
            }, 1000);
        }

        function start() {
            isF = true; mult = 1.0;
            let pool = 0; if(!isD) { if(bts[1].a) pool += bts[1].amt; if(bts[2].a) pool += bts[2].amt; }
            let crash = 1.1 + (Math.random() * 8.0);
            
            // 20% PROFIT SECURITY
            if(pool > 0) {
                crash = 1.1 + (Math.random() * 0.35);
                stats.t += pool; stats.p += (pool * 0.2);
                localStorage.setItem('v14_st', JSON.stringify(stats));
                updateAdm();
            }

            let engine = setInterval(() => {
                mult += 0.05;
                document.getElementById('mTxt').innerText = mult.toFixed(2) + "x";
                let x = mult * 18, y = mult * 16;
                document.getElementById('plane').style.transform = `translate(${x}px, -${y}px) rotate(-15deg)`;
                document.getElementById('gamePath').setAttribute('d', `M 0 240 Q ${x/2} ${240-y} ${x+20} ${240-y-20}`);
                
                [1,2].forEach(i => { if(bts[i].a && bts[i].au > 0 && mult >= bts[i].au) handleBet(i); });
                if(mult >= crash) { clearInterval(engine); boom(crash); }
            }, 80);
        }

        function boom(c) {
            isF = false; document.getElementById('mTxt').innerText = "CRASH!";
            document.getElementById('mTxt').style.color = "var(--accent)";
            addH(c.toFixed(2));
            bts[1].a = bts[2].a = false; resetB();
            setTimeout(() => {
                document.getElementById('plane').style.transform = "translate(0,0) rotate(-15deg)";
                document.getElementById('gamePath').setAttribute('d', 'M 0 240 Q 0 240 0 240');
                document.getElementById('mTxt').style.color = "inherit";
                gameLoop();
            }, 4000);
        }

        function handleBet(id) {
            if(isF) {
                if(bts[id].a) {
                    let w = bts[id].amt * mult;
                    if(isD) { dBal += w; localStorage.setItem('v14_d', dBal); } else { rBal += w; localStorage.setItem('v14_r', rBal); }
                    addWinFeed(tg.initDataUnsafe?.user?.username || "You", w.toFixed(0));
                    bts[id].a = false; resetB(); upUI();
                }
                return;
            }
            let a = parseInt(document.getElementById('bInp'+id).value);
            let b = isD ? dBal : rBal;
            if(a > b || a <= 0) return tg.showAlert("Insufficient Funds!");
            if(isD) { dBal -= a; localStorage.setItem('v14_d', dBal); } else { rBal -= a; localStorage.setItem('v14_r', rBal); }
            bts[id].a = true; bts[id].amt = a;
            upUI();
            document.getElementById('bBtn'+id).innerText = "CASH OUT";
            document.getElementById('bBtn'+id).style.background = "#ea580c";
        }

        function upUI() {
            let v = (isD ? dBal : rBal).toFixed(2);
            document.getElementById('hBal').innerText = v + " ETB";
            document.getElementById('txtMode').innerText = isD ? (lang === 'am' ? "ዴሞ" : "DEMO") : (lang === 'am' ? "ሪል" : "REAL");
        }

        function updateAdm() {
            if(document.getElementById('adT')) {
                document.getElementById('adT').innerText = stats.t.toFixed(0);
                document.getElementById('adP').innerText = stats.p.toFixed(0);
            }
        }

        function shP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('n-'+id).classList.add('active');
        }

        function shW(t) {
            document.getElementById('secD').classList.toggle('hidden', t === 'w');
            document.getElementById('secW').classList.toggle('hidden', t === 'd');
            document.getElementById('btnD').style.background = t === 'd' ? 'red' : '#222';
            document.getElementById('btnW').style.background = t === 'w' ? 'green' : '#222';
        }

        function toggleTheme() {
            const b = document.body;
            if(b.classList.contains('dark-mode')) { b.className = 'light-mode'; } else { b.className = 'dark-mode'; }
        }

        function toggleLang() {
            lang = lang === 'am' ? 'en' : 'am';
            document.getElementById('txtLang').innerText = lang === 'am' ? 'English' : 'አማርኛ';
            upUI();
        }

        function setB(id, v) { document.getElementById('bInp'+id).value = v; }
        function setA(id, v) { bts[id].au = v; tg.showAlert("Auto Cashout: " + v + "x"); }
        function resetB() { [1,2].forEach(i => { document.getElementById('bBtn'+i).innerText = "BET"; document.getElementById('bBtn'+i).style.background = "var(--real-green)"; }); }
        
        function addH(c) {
            const h = document.getElementById('history');
            const d = document.createElement('div');
            d.className = `px-3 py-1 rounded-full text-[10px] font-black ${c > 2 ? 'bg-purple-600' : 'bg-zinc-800'}`;
            d.innerText = c + "x";
            h.prepend(d); if(h.children.length > 8) h.removeChild(h.lastChild);
        }

        function subD() {
            const n = document.getElementById('dName').value, ft = document.getElementById('dFT').value, a = document.getElementById('dAmt').value;
            if(!n || !ft || !a) return tg.showAlert("Fill all fields!");
            let db = JSON.parse(localStorage.getItem('v14_db')) || [];
            db.push({ u: tg.initDataUnsafe?.user?.username || "Guest", n, ft, a: parseFloat(a), t: 'D' });
            localStorage.setItem('v14_db', JSON.stringify(db));
            tg.showAlert("Deposit request sent!");
        }

        function subW() {
            const acc = document.getElementById('wAcc').value, a = document.getElementById('wAmt').value;
            if(!acc || !a) return tg.showAlert("Fill all fields!");
            if(parseFloat(a) > rBal) return tg.showAlert("Insufficient Real Balance!");
            let db = JSON.parse(localStorage.getItem('v14_db')) || [];
            db.push({ u: tg.initDataUnsafe?.user?.username || "Guest", acc, a: parseFloat(a), t: 'W' });
            rBal -= parseFloat(a); localStorage.setItem('v14_r', rBal); upUI();
            localStorage.setItem('v14_db', JSON.stringify(db));
            tg.showAlert("Withdraw request sent!");
        }

        function setGameMode(d) { isD = d; upUI(); }
        function addWinFeed(un, a) {
            const f = document.getElementById('liveFeed');
            const r = document.createElement('div');
            r.className = "flex justify-between p-3 glass-ui mb-1 border-l-4 border-green-500";
            r.innerHTML = `<span class="text-[10px] font-black">🔥 @${un}</span><span class="text-green-500 font-black text-[10px]">+${a} ETB</span>`;
            f.prepend(r); if(f.children.length > 5) f.removeChild(f.lastChild);
        }

        function genF() {
            const ns = ["Elias_P","Bini_K","Hana_W","Sami_X"];
            if(Math.random() > 0.85) addWinFeed(ns[Math.floor(Math.random()*4)], (Math.random()*1500).toFixed(0));
        }

        function loadTop() {
            const l = document.getElementById('tList');
            for(let i=1; i<=30; i++) {
                l.innerHTML += `<div class="glass-ui p-4 flex justify-between items-center"><span class="text-xs font-black uppercase">💎 Player_${i} <i class="fa-solid fa-circle-check verify-badge"></i></span><span class="text-green-500 font-black">${(Math.random()*50000+1000).toFixed(0)} ETB</span></div>`;
            }
        }
        function copyT(t) { navigator.clipboard.writeText(t); tg.showAlert("Account Copied!"); }

        function oM(t) { document.getElementById('admMod').classList.remove('hidden'); document.getElementById('mTit').innerText = t === 'dep' ? "DEPOSITS" : "WITHDRAWALS"; lM(t); }
        function cM() { document.getElementById('admMod').classList.add('hidden'); }
        function lM(t) {
            const db = JSON.parse(localStorage.getItem('v14_db')) || [];
            const fil = db.filter(i => i.t === (t === 'dep' ? 'D' : 'W'));
            document.getElementById('mList').innerHTML = fil.map((it, i) => `
                <div class="glass-ui p-5">
                    <p class="text-[10px] opacity-50">@${it.u}</p>
                    <p class="text-xl font-black text-green-500">${it.a} ETB</p>
                    <p class="text-[10px] mb-3">${t === 'dep' ? 'FT: '+it.ft : 'ACC: '+it.acc}</p>
                    <button onclick="appAdm('${it.u}', ${it.a}, '${it.t}', ${i})" class="w-full bg-green-600 py-3 rounded-xl font-black text-[10px]">APPROVE</button>
                </div>
            `).join('') || "<p class='text-center opacity-20'>No Pending</p>";
        }

        function appAdm(un, a, t, idx) {
            let db = JSON.parse(localStorage.getItem('v14_db'));
            if(t === 'D' && un === (tg.initDataUnsafe?.user?.username || "Guest")) { rBal += a; localStorage.setItem('v14_r', rBal); upUI(); }
            db.splice(idx,1); localStorage.setItem('v14_db', JSON.stringify(db)); cM();
        }

        init();
    </script>
</body>
</html>
