<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator World - Premium Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #28a745;
            --aviator-red: #e11d48;
            --bg-dark: #050505;
            --card-bg: #121212;
            --gold: #ffd700;
        }

        body { background: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 70px; }
        
        /* Header & Balance */
        .top-nav { display: flex; justify-content: space-between; padding: 15px; background: #000; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222; }
        .balance-chip { background: #1e1e1e; padding: 8px 15px; border-radius: 20px; border: 1px solid #333; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .balance-chip i { color: var(--primary-green); }

        /* Game Stage */
        .stage { position: relative; height: 300px; background: radial-gradient(circle at bottom left, #2a0a0a 0%, #000 80%); overflow: hidden; }
        .multiplier { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; font-weight: 800; z-index: 10; }
        .plane-trail { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* Top 3 Winners Podium */
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 20px 0; background: #0a0a0a; }
        .podium-item { text-align: center; width: 100px; }
        .rank-1 { height: 140px; background: linear-gradient(to top, #1a1a1a, #ffd70033); border-radius: 10px 10px 0 0; border: 1px solid var(--gold); }
        .rank-2, .rank-3 { height: 100px; background: #1a1a1a; border-radius: 10px 10px 0 0; border: 1px solid #555; }
        .avatar-circle { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; margin: -25px auto 10px; overflow: hidden; background: #333; }

        /* Wallet Tabs */
        .wallet-tabs { display: flex; background: #111; border-radius: 10px; margin: 15px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: transparent; color: #888; cursor: pointer; }
        .tab-btn.active { background: #222; color: white; border-bottom: 2px solid var(--primary-green); }

        /* Navigation Menu */
        .bottom-bar { position: fixed; bottom: 0; width: 100%; background: #080808; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #222; }
        .nav-link { color: #666; text-decoration: none; font-size: 11px; text-align: center; }
        .nav-link.active { color: var(--primary-green); }
        .nav-link i { font-size: 20px; display: block; margin-bottom: 4px; }

        /* Share Button */
        .share-card { background: linear-gradient(45deg, #0088cc, #004466); margin: 15px; padding: 20px; border-radius: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div style="font-weight: bold; color: var(--aviator-red);">AVIATOR</div>
        <div class="balance-chip" onclick="showSection('wallet')">
            <i class="fas fa-wallet"></i> <span id="user-balance">0.00 ETB</span>
        </div>
    </div>

    <section id="game-ui">
        <div class="stage">
            <div class="multiplier" id="multi">1.00x</div>
            <canvas id="canvas"></canvas>
        </div>
        
        <div style="padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div style="background: #151515; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                <button style="background: var(--primary-green); width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold;">BET</button>
            </div>
            <div style="background: #151515; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                <button style="background: var(--primary-green); width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold;">BET</button>
            </div>
        </div>
    </section>

    <section id="winners-ui" style="display:none;">
        <div class="podium">
            <div class="podium-item rank-2">
                <div class="avatar-circle"><img src="https://via.placeholder.com/50" width="100%"></div>
                🥈 2nd <br> <small>Selam T.</small>
            </div>
            <div class="podium-item rank-1">
                <div class="avatar-circle" style="border-color: gold;"><img src="https://via.placeholder.com/50" width="100%"></div>
                👑 1st <br> <b>Aman G.</b>
            </div>
            <div class="podium-item rank-3">
                <div class="avatar-circle"><img src="https://via.placeholder.com/50" width="100%"></div>
                🥉 3rd <br> <small>Dawit F.</small>
            </div>
        </div>
        </section>

    <section id="wallet-ui" style="display:none;">
        <div class="wallet-tabs">
            <button class="tab-btn active" onclick="toggleWallet('dep')">DEPOSIT</button>
            <button class="tab-btn" onclick="toggleWallet('with')">WITHDRAW</button>
        </div>
        <div id="dep-box" style="padding: 20px;">
            <h3>ንግድ ባንክ (CBE): <span id="cbe-num">1000179571815</span></h3>
            <input type="number" placeholder="የገንዘብ መጠን" style="width:100%; padding:12px; background:#222; color:white; border:1px solid #444; margin-bottom:10px;">
            <input type="text" placeholder="የ FT ቁጥር ያስገቡ" style="width:100%; padding:12px; background:#222; color:white; border:1px solid #444;">
            <button style="background:var(--primary-green); width:100%; padding:15px; margin-top:10px; border:none; color:white;">ለአድሚን ላክ</button>
        </div>
    </section>

    <div class="share-card">
        <h3>🚀 ጓደኞችዎን ይጋብዙ!</h3>
        <p>በቀን እስከ 100,000 ማሸነፍ እንደሚችሉ ይንገሯቸው። በአንድ ሰው 5 ብር ያግኙ!</p>
        <button onclick="shareGame()" style="background: white; color: #0088cc; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold;">
            <i class="fab fa-telegram-plane"></i> አሁኑኑ ሼር አድርግ
        </button>
    </div>

    <nav class="bottom-bar">
        <a href="#" class="nav-link active" onclick="showSection('game')"><i class="fas fa-play"></i>PLAY</a>
        <a href="#" class="nav-link" onclick="showSection('wallet')"><i class="fas fa-wallet"></i>WALLET</a>
        <a href="#" class="nav-link" onclick="showSection('winners')"><i class="fas fa-trophy"></i>TOP 50</a>
        <a href="#" class="nav-link" onclick="showSection('profile')"><i class="fas fa-user"></i>PROFILE</a>
    </nav>

    <script>
        function shareGame() {
            const text = "🔥 ምርጥ የኤቪየተር ጨዋታ! ዛሬውኑ ተቀላቀሉና በቀን እስከ 100,000 ብር ያሸንፉ። ሲገቡ የ5 ብር ስጦታ ያገኛሉ! 👇\nhttps://t.me/World_All_Gamesbot";
            window.open(`https://t.me/share/url?url=${encodeURIComponent(text)}`);
        }
        
        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById(id + '-ui').style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
